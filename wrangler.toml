# Cloudflare Worker Configuration
# This deploys ONLY the worker script, not the entire site.
# Your Jekyll site stays on GitHub Pages.

name = "hanumanji-api"
main = "workers/cloudflare-worker.js"
compatibility_date = "2026-01-29"

# Workers configuration
workers_dev = true

# R2 bucket binding for large embedding files (Puranic sources)
# Public URL: https://pub-7a286ab192d84d218d1bcca8bbd68361.r2.dev
[[r2_buckets]]
bucket_name = "hanuman-gpt-embeddings"
binding = "EMBEDDINGS_BUCKET"

# Non-secret runtime variables
[vars]
AWS_REGION = "us-east-1"
BEDROCK_EMBEDDING_MODEL = "cohere.embed-multilingual-v3"
PURANIC_EMBEDDINGS_BASE_URL = "https://pub-7a286ab192d84d218d1bcca8bbd68361.r2.dev"

# Secrets (set via `wrangler secret put`, not in this file):
# OPENAI_API_KEY      -> OpenAI chat + OpenAI embeddings
# HF_TOKEN            -> Hugging Face embeddings
# AWS_ACCESS_KEY_ID   -> Bedrock embeddings
# AWS_SECRET_ACCESS_KEY -> Bedrock embeddings
# AWS_SESSION_TOKEN   -> Optional for temporary IAM credentials

# Account ID (optional - wrangler will prompt if not set)
# Get this from: https://dash.cloudflare.com/ > Workers & Pages > Overview
# account_id = "your-account-id"

# Route configuration (optional - for custom domains)
# [env.production]
# routes = [
#   { pattern = "api.hanumanchalisa.com/*", zone_name = "hanumanchalisa.com" }
# ]

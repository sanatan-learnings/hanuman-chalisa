_meta:
  collection: bajrang-baan
  description: Scene descriptions for bajrang-baan image generation
scenes:
  title-page:
    title: Bajrang Baan Title Page
    description: Close-up portrait of Lord Hanuman's face and chest filling the lower two-thirds
      of the frame. His crowned head, serene yet fierce face, and broad chest with jewelled
      necklace are the focal point, centered vertically in the image. The upper third of the
      image is an expansive radiant sky with golden divine light and sacred mandalas. His
      expression radiates strength and compassion. Saffron, gold and spiritual blue tones.
      No full body — just face, crown and upper chest prominently visible at center frame.
  doha-opening:
    title: 'Doha 1: Assurance of Hanuman''s Blessings [AI-Generated - Review Recommended]'
    description: In the heart of an ancient Indian forest, a humble devotee kneels before the mighty figure of Hanuman, the
      Hindu god of strength and devotion. The environment is bathed in the soft, golden light of dawn, illuminating the devout
      figure's sincere expression of love and respect, and the compassionate, yet powerful gaze of Hanuman. The focus is split
      between the devotee's hands clasped in prayer, symbolizing humility and devotion, and Hanuman's hand holding a gada
      (mace), symbolizing his power to bring success and prosperity. The leaves of the trees gently rustle, adding a sense
      of serene movement to this scene of profound spiritual connection.
  chaupai-01:
    title: 'Chaupai 1: Invocation of Hanuman for Swift Assistance [AI-Generated - Review Recommended]'
    description: A grand, celestial scene bathed in warm, ethereal light, where Hanuman, the Hindu deity, stands majestic
      and powerful. He is depicted in traditional iconographic detail, with a golden crown and a mace in his hand, his muscular,
      furry body exuding strength and serenity. Devotees at his feet, hands folded in prayer, beseeching him, their faces
      filled with hope and desperation. The setting is an ancient temple courtyard, adorned with intricate carvings, the air
      filled with a sense of urgent devotion. The focus is on Hanuman listening attentively to the prayers, symbolizing his
      role as a protector and benefactor, the embodiment of selfless service.
  chaupai-02:
    title: 'Chaupai 2: Hanuman Leaping Over the Ocean'
    description: Hanuman soaring majestically over a vast shimmering ocean under a luminous
      full moon, his divine form radiating golden light. His posture is powerful and graceful,
      arms outstretched, tail curling behind him. Below, gentle waves reflect his divine glow.
      In the far distance, the faint golden outline of Lanka glows on the horizon. The scene
      conveys unstoppable devotion and divine determination. Serene spiritual atmosphere with
      deep blue sky, silver moonlight, and warm saffron tones around Hanuman.
  chaupai-03:
    title: 'Chaupai 3: Hanuman''s Divine Interventions [AI-Generated - Review Recommended]'
    description: In the mystical light of a setting sun, the divine lord Hanuman is depicted bestowing peace upon the kneeling
      figure of Vibhishana, their faces bathed in the golden glow. On the other side, Hanuman gazes adoringly at the radiant
      Sita, who is seated on an elevated, celestial lotus, symbolizing her supreme status. The scene is set amidst a ravaged
      garden by the shore of a tumultuous ocean, signifying the chaos Hanuman has created. In the foreground, a terrified
      figure representing Yama, the god of death, is shown recoiling in fear from Hanuman's divine power, adding a dramatic
      contrast to the serene interactions.
  chaupai-04:
    title: 'Chaupai 4: Hanuman''s Divine Victory, Celestial Rejoicing'
    description: Hanuman standing triumphant on a hilltop, arms raised in victory, divine
      saffron light radiating from his form. Above him, a sky full of celestial beings — devas
      and gandharvas — appear in glowing clouds, their faces joyful, hands raised in celebration
      and praise. The atmosphere is one of divine jubilation and cosmic victory of dharma.
      Golden and saffron light fills the scene. Ancient Lanka visible in the misty background
      as a distant silhouette. Spiritual, luminous mood conveying righteousness triumphant.
  chaupai-05:
    title: 'Chaupai 5: Plea for Divine Intervention [AI-Generated - Review Recommended]'
    description: In the warm, golden glow of a setting sun, the divine figure of Lord Rama, the inner dweller, stands tall
      and majestic against a backdrop of an ethereal sky. His brother, Lakshman, the giver of life, is depicted beside him,
      offering a comforting hand on his shoulder, symbolizing protection and care. The characters are dressed in traditional
      Indian attire, with Rama's hand raised in a gesture of blessing, implying immediate help and compassion without delay.
      The overall mood is serene and hopeful, rich in spiritual symbolism, with a focus on the interaction between the two
      divine figures.
  chaupai-06:
    title: 'Chaupai 6: Glory to the Mountain Holder, the Ocean of Joy [AI-Generated - Review Recommended]'
    description: In the radiant glow of a setting sun, a majestic figure of Hanuman, the monkey god, stands atop a rugged
      mountain peak, holding a thunderbolt-shaped weapon. His eyes, filled with determination, are focused on a shadowy figure
      representing the enemy in the distance. Surrounding him, an ethereal group of celestial beings appear in the sky, lending
      an atmosphere of divine power and support. The scene is illuminated by the warm, golden hues of the setting sun, casting
      long shadows and highlighting the intricate details of Hanuman's muscular form, creating a mood of heroic resolve and
      spiritual strength.
  chaupai-07:
    title: 'Chaupai 7: Invoking the Mighty Power of Hanuman [AI-Generated - Review Recommended]'
    description: In the heart of an ancient Indian battlefield under a fiery twilight sky, the mighty deity Hanuman, clad
      in radiant orange robes, wields a thunderous gada (mace) and a sparkling vajra (thunderbolt) with a fierce determination.
      His muscular frame radiates immense power, eyes blazing with divine wrath against the unseen enemies, instilling a sense
      of awe and reverence. The atmosphere is thick with tension and anticipation, further heightened by dramatic shadows
      cast by the dying sun and the mystical glow of Omkara and the sacred syllable "Hum" floating ethereally above the battlefield.
      The focus is on the resolute Hanuman, the embodiment of devotion and might, with the symbolic weapons, divine glow,
      and the battlefield serving as the awe-inspiring backdrop.
  chaupai-08:
    title: 'Chaupai 8: Invocation of Hanuman''s Power [AI-Generated - Review Recommended]'
    description: A celestial landscape bathed in the golden glow of dawn, with the mighty Hanuman, the Monkey God, depicted
      as a majestic figure with a muscular physique, his face etched with determination. His fur is a rich hue of brown, and
      he holds a glistening golden gada (mace), ready for battle. He's surrounded by a divine aura, with the sacred Sanskrit
      mantra "ॐ ह्रीं ह्रीं ह्रीं हनुमन्त कपीसा। ॐ हुं हुं हुं हनु अरि उर शीथा॥" faintly glowing around him. In the foreground,
      the shadows of unseen adversaries loom, and in Hanuman's eyes, there's a fierce resolve, reflecting his oath "सत्य होउ
      हरि शपथ पायके। रामदूत धरु मारु धाय के॥". Behind him, the rising sun symbolizes hope and victory, its rays piercing through
      a sky scattered with soft clouds.
  chaupai-09:
    title: 'Chaupai 9: Invocation to the Infinite Hanuman [AI-Generated - Review Recommended]'
    description: A serene, ethereal landscape at twilight, where a humble devotee kneels in prayer before a grand, majestic
      statue of Hanuman, the Hindu god, depicted as a mighty, benevolent monkey. The statue, bathed in the soft glow of the
      setting sun, is adorned with garlands and appears to emanate a gentle, divine radiance, symbolizing Hanuman's profound
      wisdom and unwavering courage. The devotee, dressed in simple, traditional Indian attire, has a look of repentance,
      and his hands are clasped together in prayer, demonstrating his ignorance towards religious rituals yet his sincere
      devotion. The entire scene is framed by ancient, intricately carved temple archways, drawing the focus towards the devotee
      and the idol.
  chaupai-10:
    title: 'Chaupai 10: Fearless in Your Power [AI-Generated - Review Recommended]'
    description: A lush, mystical forest (van upvan) serves as the backdrop, with an ancient mountain (giri grh) rising majestically
      in the background, bathed in the soft, ethereal glow of twilight. At the center, a figure, symbolizing strength and
      courage (tumare bal), stands tall and unafraid, radiating an aura of divine light. This figure kneels on one knee (pay
      parau), hands clasped together in a gesture of respectful request (kar jori manaon). The atmosphere is calm yet filled
      with anticipation, as though waiting for a divine intervention (yeh avsar ab kehi goharaon). The focus is on the figure,
      framed by the intricate interplay of light and shadow, symbolizing the eternal struggle between fear and courage.
  chaupai-11:
    title: 'Chaupai 11: Praise of the Powerful Hanuman [AI-Generated - Review Recommended]'
    description: In the ethereal glow of a setting sun, a powerful figure of Hanuman, son of Anjani, stands, embodying strength
      and tranquility. His body is muscular and carved like a sculpture, his face fierce yet benevolent, eyes gleaming with
      wisdom and courage, his fur a deep hue of orange. He is set against the backdrop of a lush, vibrant jungle, symbolizing
      his connection with nature. The aura is serene yet potent, the rays of the sun form a halo around Hanuman, emphasizing
      his role as the eternal protector, the divine helper of Lord Rama.
  chaupai-12:
    title: 'Chaupai 12: Vanquishing Evil Forces [AI-Generated - Review Recommended]'
    description: A mystical, moonlit forest stands bathed in soft, ethereal blue light with shadows dancing eerily amongst
      the trees. In the foreground, a fierce and divine figure of Lord Hanuman, glowing with a soft divine aura, stands with
      a gada (mace) held high, eyes ablaze with righteous fury. Lurking in the shadows around him are spectral apparitions
      of bhoot, pret, pishach, nishachar, agni baital, and kaal, depicted as grotesque, fearful creatures recoiling from the
      holy light. The scene is a dramatic representation of a battle between good and evil, with the focus on Hanuman, his
      unwavering resolve symbolized by the faintly glowing symbol of Lord Rama's name inscribed on his chest, and the cowering
      evil spirits.
  chaupai-13:
    title: 'Chaupai 13: Invocation of Divine Power [AI-Generated - Review Recommended]'
    description: A serene celestial scene unfolds, where a devoted figure, dressed in traditional Indian attire, kneels reverently
      under an expansive, star-lit sky that resounds with the echoes of the chant "Jay Jay Jay". The figure, symbolizing 'Hari
      Das' or 'servant of Lord', is focusing on a radiant, ethereal image of 'Janakasuta', or Sita, daughter of King Janaka,
      appearing in the sky. The atmosphere is imbued with divine tranquility, the soft light from the celestial apparition
      casting a gentle glow on the figure's face, illuminating his intense devotion and the surrounding environment. The composition
      focuses on the interplay of the devotee's faith and the divine manifestation, while also subtly hinting at the dissolution
      of worldly distress, symbolized by dark, receding shadows.
  chaupai-14:
    title: 'Chaupai 14: Pleading for Divine Intervention [AI-Generated - Review Recommended]'
    description: A devotee, clad in simple, white traditional Indian attire, kneels humbly at the entrance of an ancient,
      intricately carved Hindu temple, bathed in the soft golden glow of the setting sun. His hands are clasped tightly in
      prayer, and his eyes are closed in earnest appeal, reflecting a serene yet intense mood of devotion. The symbolic presence
      of Lord Rama is suggested by a radiant halo gently illuminating a stone idol in the background. The focus is on the
      devotee, with the temple and idol providing a compelling backdrop, alluding to his call for divine intervention in his
      hour of need.
  chaupai-15:
    title: 'Chaupai 15: Invocation of the Agile Hanuman [AI-Generated - Review Recommended]'
    description: In the vibrant hues of an ethereal twilight, a colossal figure of Lord Hanuman, the mighty monkey god, strides
      across an ancient Indian landscape, radiating divine power and agility. The atmosphere is imbued with spiritual energy,
      illuminated by the soft, warm glow of celestial light gleaming off Hanuman's golden armor and reflecting on the rushing
      river below. Symbolically, in the foreground, a cluster of malevolent figures representing the "khal dal" or evil forces
      cowers in fear, their dark forms stark against the radiant aura of the divine. The composition focuses on the dynamic
      contrast between the majesty of Hanuman and the palpable fear of the wicked, embodying the spiritual battle between
      good and evil.
  chaupai-16:
    title: 'Chaupai 16: Immediate Rescue and Joyful Devotion [AI-Generated - Review Recommended]'
    description: In the spiritual haze of early dawn, a devout figure kneels in prayer at the foot of a towering statue of
      Hanuman, the monkey god, under the sprawling branches of a sacred Banyan tree in a peaceful Indian forest. Golden light
      filters through the canopy, casting dappled shadows and illuminating a vividly inscribed stone tablet, engraved with
      the verse from Bajrang-baan. The devotee's face is full of serene anticipation, the monkey god's statue radiates divine
      calmness, while the surrounding forest brims with vibrant, lush vegetation, symbolizing the joy and protection granted
      by Hanuman. The focus is on the connection between the devotee and the deity, highlighting the robust faith and spiritual
      energy flowing between them.
  chaupai-17:
    title: 'Chaupai 17: Protection Through Bajrang Baan [AI-Generated - Review Recommended]'
    description: In the warm, soft glow of the setting sun, under a vast, magical twilight sky, a devout individual is deeply
      engrossed in reciting the sacred Bajrang Baan. The individual sits cross-legged on a lush green hilltop, with a small,
      ancient, well-worn Sanskrit/Hindi manuscript in their hands. A majestic figure of Lord Hanuman, radiating a divine aura,
      stands protectively behind the individual, embodying strength and serenity. A horde of ethereal, frightened ghosts and
      spirits, symbolizing fear and negative energy, are shown retreating in the background, their ghastly forms dissolving
      into wisps at the sound of the holy chant. The focus of the composition is on the central figure of the devotee, with
      the powerful presence of Hanuman and the fleeing spirits providing a symbolic backdrop.
  chaupai-18:
    title: 'Chaupai 18: Offering Incense and Constant Chanting [AI-Generated - Review Recommended]'
    description: The scene unfolds in an open-air ancient Indian temple at dawn, bathed in the soft golden glow of the rising
      sun. A devoted practitioner, dressed in traditional saffron robes, is seen kneeling on an intricately woven prayer mat,
      offering a bowl of aromatic incense (dhoop) to a beautifully carved stone idol of Lord Hanuman. The atmosphere is serene
      and peaceful, with the morning light illuminating the temple and the worshipper, casting long, dramatic shadows behind
      them. The focus of the composition is on the devotee's act of devotion and the tranquil expression on their face, symbolizing
      the dissipation of distress (kalesha) through continuous prayer.
  doha-closing:
    title: 'Doha 20: Devotion and Meditation on Hanuman [AI-Generated - Review Recommended]'
    description: A serene, sacred setting in the heart of an ancient Indian forest at dawn, where the first rays of the sun
      gently illuminate the scene. In the center, a devout monkey deity, Hanuman, depicted in vibrant, warm colors, sits on
      a rock, meditating, his chest glowing with divine light symbolizing unwavering focus and devotion. Surrounding him,
      a subtle shimmering aura of tranquility and auspiciousness pervades, with an array of ethereal, celestial figures watching
      him from the clouds above. The foreground is adorned with lush, dew-kissed foliage, adding depth and framing the central
      figure, while the background reveals a faint silhouette of a majestic temple, further enhancing the spiritual ambiance.

_meta:
  collection: hanuman-chalisa
  source: Converted from docs/image-prompts/hanuman-chalisa.md
  description: Scene descriptions for hanuman-chalisa image generation
  format: theme-agnostic scene descriptions (narrative and spiritual meaning)
scenes:
  title-page:
    title: Title Page
    description: Welcoming title composition featuring Lord Hanuman in a central, prominent position with
      an inviting gesture. Hanuman is surrounded by divine elements representing the sacred nature of
      the Chalisa. The composition should feel like the opening of a sacred text - reverent yet accessible.
  opening-doha-01:
    title: Invocation to the Guru
    description: A devotional scene showing reverence to the guru. Either depict a guru's lotus feet with
      a devotee bowing in deep respect, or show the poet Tulsidas sitting in meditation before his spiritual
      teacher. The mood is one of humility, gratitude, and spiritual preparation - the beginning of a
      sacred journey.
  opening-doha-02:
    title: Prayer to Hanuman
    description: Hanuman in a humble, seated posture with hands joined in anjali mudra (prayer gesture).
      His expression is earnest and devotional, requesting divine strength, wisdom, and knowledge. This
      represents the invocation before beginning the main Chalisa, showing Hanuman as both powerful and
      humble.
  verse_01:
    title: Ocean of Knowledge and Virtues
    description: Hanuman standing in a majestic pose, radiating divine light that illuminates all three
      realms - heaven (above), earth (middle), and the netherworld (below). The three worlds can be shown
      as cosmic layers or spheres. Hanuman is the source of illumination, representing his boundless knowledge
      and virtues spreading throughout the universe. His presence brings enlightenment to all beings.
  verse_02:
    title: Rama's Messenger
    description: Hanuman in dynamic motion - flying or leaping across the sky with incredible speed. He
      carries Rama's message (can be shown as a ring, scroll, or divine light). Wind swirls around him
      showing his swift movement. His expression shows determination and devotion to his mission. The
      sky and clouds rush past, emphasizing speed and purpose.
  verse_03:
    title: Great Hero with Body Like Thunderbolt
    description: Hanuman in a powerful warrior stance displaying his extraordinary strength and indestructible
      form. His body radiates divine energy like a thunderbolt (vajra). Muscles are pronounced but graceful.
      A divine aura surrounds him, symbolizing his invincible nature. His stance is confident and protective,
      ready to defend righteousness.
  verse_04:
    title: Golden Complexion and Beautiful Form
    description: Portrait-style composition focusing on Hanuman's face and upper body, showcasing his
      divine beauty. His complexion glows with radiance. Distinctive features include expressive eyes,
      curly hair, ornate earrings. His expression combines strength with gentleness. This verse celebrates
      his physical beauty as a reflection of his divine nature.
  verse_05:
    title: Bearer of Mace and Sacred Thread
    description: Hanuman holding his iconic mace (gada) in one hand and a victory flag in the other. The
      sacred thread (janeu) is clearly visible across his shoulder, marking his high spiritual status.
      He stands with authority and nobility. These symbols represent his role as both warrior and spiritual
      being - strength combined with righteousness.
  verse_06:
    title: Son of Kesari, Like Shiva
    description: Hanuman in a powerful or meditative pose with subtle visual connections to Lord Shiva.
      This can be shown through symbols like the trishul (trident), third eye imagery, or Shiva's blessing
      gesture visible in the background. The scene emphasizes Hanuman's spiritual lineage and his blessing
      from Shiva, representing his divine parentage and spiritual power.
  verse_07:
    title: Learned and Eager to Serve Rama
    description: 'Two aspects of Hanuman: his scholarly nature and devotional service. Show Hanuman either
      studying sacred texts under divine light (representing his vast learning), or flying eagerly toward
      Rama with a joyful, devoted expression. Both scenes capture his wisdom and his eagerness to serve
      - a perfect devotee who combines knowledge with action.'
  verse_08:
    title: Devoted Listener of Rama's Stories
    description: The iconic image of Hanuman with his chest opened, revealing Lord Rama, Sita, and Lakshmana
      seated within his heart. This powerful metaphor shows that Rama resides perpetually in Hanuman's
      heart. Hanuman's expression is one of pure devotion and love. Rama, Sita, and Lakshmana are clearly
      visible within, glowing with divine light. This is one of the most famous and beloved images in
      Hindu devotional art.
  verse_09:
    title: Master of Many Forms
    description: 'Hanuman''s divine ability to change size at will. Show a split or dual composition:
      on one side, tiny Hanuman before Sita in the Ashoka grove (making himself small to avoid detection),
      and on the other side, giant Hanuman with his tail ablaze, setting Lanka on fire. This dramatic
      contrast demonstrates his mastery over his form - becoming minuscule to comfort Sita, then growing
      massive to wreak havoc on her captors.'
  verse_10:
    title: Destroyer of Demons
    description: Hanuman in his mighty Bhima roop form, standing tall with divine protective power. His
      expression radiates strength and determination. Divine light emanates from his form, dispelling
      darkness and negativity. This scene captures Hanuman as the great protector of dharma (righteousness),
      his presence transforming negative energies into positive ones. Sacred energy and spiritual power
      radiate from his magnificent form.
  verse_11:
    title: Bringing the Sanjeevani Herb
    description: The famous episode of Hanuman flying through the sky while carrying the entire Dronagiri
      mountain. The Sanjeevani herb glows with healing light on the mountain peak. Hanuman's expression
      shows determination and urgency as he rushes to save Lakshmana's life. The mountain is massive,
      yet Hanuman holds it effortlessly in one hand. This is one of the most beloved and recognizable
      scenes from the Ramayana.
  verse_12:
    title: Dear as Bharata
    description: An intimate moment showing the deep love between Rama and Hanuman. Rama embraces Hanuman
      warmly, or places his hand affectionately on Hanuman's shoulder. Both figures express deep affection,
      mutual respect, and spiritual love. The verse compares this bond to Rama's love for his brother
      Bharata. The scene should feel warm, loving, and deeply emotional - the perfect devotee-deity relationship.
  verse_13:
    title: Sung by Shesha
    description: Cosmic scene featuring Shesha Naga, the thousand-headed serpent who supports the universe,
      floating in the cosmic ocean. All of Shesha's heads are singing praises of Hanuman. In the scene,
      Rama can be shown embracing or blessing Hanuman. This represents how even the greatest cosmic beings
      cannot fully express Hanuman's glory. The setting is transcendent and universal.
  verse_14:
    title: Praised by Gods and Sages
    description: 'Hanuman at the center, surrounded by an assembly of celestial beings all honoring him:
      the four Kumaras (child sages), Lord Brahma, sage Narada with his veena, goddess Saraswati, and
      Shesha again. Multiple divine figures from different directions, all paying homage to Hanuman. This
      shows that beings from all realms recognize and revere Hanuman''s greatness. A grand assembly scene.'
  verse_15:
    title: Beyond Description
    description: Powerful cosmic beings - Yama (god of death), Kubera (god of wealth), and the eight Digpalas
      (guardians of the eight directions) - all appearing overwhelmed or in humble postures. They recognize
      that words cannot capture Hanuman's full glory. Their expressions show awe and the limits of their
      ability to describe him. Hanuman stands radiant, his greatness truly beyond description.
  verse_16:
    title: Helper of Sugriva
    description: The pivotal meeting on Rishyamukh mountain. Hanuman introduces Sugriva (the exiled monkey
      king) to Lord Rama. All three figures stand together - Rama with his bow, Sugriva looking hopeful,
      and Hanuman facilitating their alliance. This moment marks the beginning of the great friendship
      and alliance that will lead to Sita's rescue. The mountain setting provides a dramatic backdrop.
  verse_17:
    title: Advisor to Vibhishana
    description: Vibhishana (Ravana's righteous brother) crossing from Lanka to join Rama's side. Hanuman
      is shown either guiding Vibhishana across, or blessing/welcoming him to Rama's camp. This scene
      represents choosing righteousness over family loyalty when faced with evil. Hanuman plays a key
      role in accepting and supporting those who choose the righteous path. The moment is significant
      and dramatic - a defection that changes the war's outcome.
  verse_18:
    title: The Sun Swallowing Incident
    description: Young Hanuman as a child, leaping through the sky toward the sun, mistaking it for a
      ripe fruit. His expression is innocent, playful, and determined. The sun shines brightly above.
      This famous childhood episode shows Hanuman's divine power present even in infancy, as well as his
      innocent nature. His small form contrasts with the mighty leap and fearless ambition. A joyful,
      lighthearted scene showing the origin of his powers.
  verse_19:
    title: Crossing the Ocean
    description: Hanuman in mid-leap across the vast ocean, traveling from the mainland to Lanka to find
      Sita. Rama's ring is held in his mouth or hand - a token to prove his identity to Sita. Enormous
      waves and expansive water stretch far below. His powerful leap shows fearlessness and determination.
      The ocean appears vast and daunting, but Hanuman crosses it effortlessly. A dramatic scene of courage
      and mission.
  verse_20:
    title: Remover of Difficulties
    description: Devotees facing various life challenges and difficulties - illness, danger, despair.
      Hanuman appears in a large, protective form bringing divine help and relief. His presence dispels
      their troubles. The devotees look up with hope and faith. This scene illustrates Hanuman's role
      as the remover of obstacles for all who call upon him. The mood shifts from distress to relief and
      salvation.
  verse_21:
    title: Guardian at Rama's Door
    description: Hanuman standing as a devoted guardian at the entrance to Rama's dwelling. An ornate
      gateway or door frames the scene, with Rama's palace visible in the background. Hanuman's posture
      is alert and protective, yet devotional. This represents his eternal role as the faithful servant
      who guards and serves Rama. His vigilance never wavers. A scene of perfect devotion and service.
  verse_22:
    title: Refuge and Protection
    description: Multiple devotees taking shelter at Hanuman's feet, finding safety and peace. A protective
      divine aura or light surrounds them, dispelling all fears and dangers. Their expressions transform
      from fear to peace. Hanuman stands as the great protector, offering refuge to all who seek him.
      The scene shows complete safety and divine shelter - no harm can reach those under Hanuman's protection.
  verse_23:
    title: Controller of Own Power
    description: Hanuman roaring or speaking with such tremendous power that the three worlds themselves
      tremble. The cosmic realms (heaven, earth, underworld) can be shown as spheres or layers, all visibly
      shaking from his voice. This demonstrates his control over immense power - he possesses it but uses
      it only when needed. The scene is dramatic and awe-inspiring, showing universal impact.
  verse_24:
    title: Protector from Evil Spirits
    description: Hanuman in a fierce protective form, his mere presence causing evil spirits, ghosts,
      and negative forces to flee in terror. Dark entities scatter and disappear before him. His face
      shows fierce determination. A devotee may be shown protected behind him. This illustrates how Hanuman's
      name alone drives away all negative forces and dark energies. Protection through divine power.
  verse_25:
    title: Destroyer of Disease
    description: A sick person chanting Hanuman's name or thinking of him. Divine healing energy or light
      flows from Hanuman toward the ill person, bringing cure and relief. The person's expression changes
      from suffering to peace and healing. Hanuman appears either physically or as a divine presence.
      This shows his power to heal all ailments - physical, mental, and spiritual - for those who call
      upon him.
  verse_26:
    title: Liberator from Crises
    description: Someone in severe crisis - imprisoned, in danger, facing disaster, or gravely ill - calling
      out to Hanuman. Hanuman appears in response, bringing immediate rescue and liberation. Chains break,
      doors open, dangers dissipate. The person's face shows relief and gratitude. This represents Hanuman's
      quick response to devotees in distress. No crisis is too great for him to resolve.
  verse_27:
    title: Servant of the Supreme King
    description: Lord Rama shown in ascetic or meditative pose, and Hanuman engaged in devoted service
      to him. This can show various forms of service - bringing offerings, standing ready to serve, or
      simply being present in attendance. The relationship of perfect devotee to perfect Lord. Hanuman's
      entire existence is dedicated to serving Rama. A scene of ultimate devotional service and surrender.
  verse_28:
    title: Granter of Desires
    description: Hanuman in a blessing posture toward devotees. Their sincere wishes and prayers are being
      fulfilled - this can be shown symbolically with manifestations of their desires appearing or glowing
      around them. Devotees' faces show joy and gratitude. This illustrates how Hanuman grants the wishes
      of true devotees who approach him with faith. Fulfillment through divine grace.
  verse_29:
    title: Renowned Through All Ages
    description: Hanuman's eternal presence across all time periods. Show his form present through the
      four yugas (cosmic ages) - perhaps with visual representations of different time periods, or his
      presence spanning from ancient to modern times. This illustrates that Hanuman's glory and availability
      to devotees transcends time. He is worshipped in every age and will continue to be. A cosmic, timeless
      scene.
  verse_30:
    title: Protector of Saints
    description: Hanuman actively protecting saints, sages, and righteous people. He radiates both protective
      compassion toward the good and powerful divine energy that dispels negativity. Saints stand safely
      behind or near him, enveloped in his protective aura. Divine light emanating from him transforms
      darkness into light. This dual nature - gentle with devotees, powerful against negativity - is central
      to his character. A scene of divine protection in action.
  verse_31:
    title: Giver of Eight Siddhis
    description: Sita blessing Hanuman in the Ashoka grove during his secret visit to Lanka. Symbols of
      the eight siddhis (supernatural powers) and nine nidhis (divine treasures) appear around them as
      glowing emblems or manifestations. This represents Sita's blessing that makes Hanuman the bestower
      of all spiritual powers to deserving devotees. A significant moment of divine blessing and empowerment.
  verse_32:
    title: Possessor of Ram Rasayan
    description: Hanuman in eternal, joyful service to Rama. The "nectar of Rama" (Ram Rasayan) - representing
      the sweetness of devotion - can be shown as a glowing presence or vessel. Hanuman is completely
      immersed in devotion, finding supreme bliss in service. This illustrates the highest spiritual state
      - where service itself becomes nectar, and devotion is its own reward.
  verse_33:
    title: Path to Rama
    description: A visual metaphor showing Hanuman as the bridge or path leading to Rama. A devotee walks
      this path toward Rama's presence. The devotee appears freed from the cycles of birth and death (samsara)
      - chains broken, burdens lifted. Hanuman facilitates this liberation. The scene shows the spiritual
      journey and the role of devotion to Hanuman as the means to reach the ultimate goal.
  verse_34:
    title: Journey to Rama's Abode
    description: A departing soul at death, being gently guided by Hanuman upward toward Vaikuntha (Rama's
      divine heavenly abode). Rama's radiant abode is visible above. Hanuman escorts the devotee's soul,
      ensuring safe passage to the eternal realm. This shows that devotees of Hanuman attain the supreme
      destination after death. A transcendent, peaceful scene of spiritual ascension.
  verse_35:
    title: Sufficient Devotion
    description: Hanuman at the center in a prominent, radiant form. Other deities visible in the background
      or periphery. The composition shows that for true devotees, Hanuman alone is sufficient - one need
      not seek multiple gods when one has Hanuman's grace. His all-encompassing nature and complete ability
      to fulfill all devotee needs is central. A scene emphasizing his sufficiency and completeness.
  verse_36:
    title: Remover of Crises and Pain
    description: Multiple people experiencing different types of suffering and crises - illness, fear,
      poverty, danger - all simultaneously receiving Hanuman's grace. His divine energy reaches all of
      them at once, removing their difficulties. This emphasizes the universality and immediacy of his
      help. No matter how many call upon him, Hanuman responds to all. A scene of comprehensive divine
      intervention.
  verse_37:
    title: Invocation for Grace
    description: A devotee in a humble posture before Hanuman, who appears in the form of a spiritual
      guru or teacher. Hanuman imparts wisdom, guidance, and grace. The devotee seeks Hanuman as the eternal
      protector and guide of their life. This represents the guru-disciple relationship and the prayer
      for ongoing divine guidance. A scene of seeking and receiving spiritual wisdom.
  verse_38:
    title: Freedom Through Recitation
    description: A person engaged in reciting the Hanuman Chalisa repeatedly (the verse mentions 100 times).
      As they recite, visible chains of worldly bondage break and fall away. Divine light surrounds them.
      Liberation (mukti) comes through this devoted practice. The person's expression shows spiritual
      transformation and freedom. This illustrates the liberating power of sincere Chalisa recitation.
  verse_39:
    title: Attainment of Siddhi
    description: A person absorbed in reading or reciting the Chalisa with complete faith. Lord Shiva
      appears as a divine witness in the sky or background, validating and blessing this devotion. This
      represents that even the great Lord Shiva witnesses and approves of Hanuman Chalisa recitation.
      Spiritual attainment (siddhi) comes with such witnessed, blessed practice. A scene of divine validation.
  verse_40:
    title: Tulsidas's Prayer
    description: The poet Tulsidas sitting with writing materials, composing the Hanuman Chalisa. A divine
      glow emanates from his chest area, revealing Hanuman dwelling within his heart. This autobiographical
      verse shows Tulsidas's personal prayer that Hanuman remain forever in his heart. The scene captures
      the moment of composition itself and the deep devotional relationship between author and deity.

    title: Hanuman Bahuk Cover
    description: 'A clean, iconic devotional composition for collection/site cover usage.

      Focus on symbolic visual elements associated with the collection subject.

      Balanced framing suitable for landscape cover display, warm saffron-gold palette,

      and clear contrast for title text overlay if needed.'

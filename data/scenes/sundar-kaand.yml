_meta:
  collection: sundar-kaand
  source: Converted from docs/image-prompts/sundar-kaand.md
  description: Scene descriptions for sundar-kaand image generation
  format: theme-agnostic scene descriptions (narrative and spiritual meaning)
scenes:
  title-page:
    title: Title Page
    description: Majestic Hanuman mid-flight over the vast ocean, flying towards Lanka with determination and devotion. His
      powerful orange-red form radiates divine energy against a dramatic sunset sky. Below, the endless blue ocean with waves,
      and in the distance, the golden island of Lanka. Hanuman's expression shows focused devotion, remembering Lord Rama.
      Sacred symbols and divine light surround him. This captures the essence of Sundar Kaand - Hanuman's heroic journey,
      his unwavering faith, and the beautiful (sundar) narrative of devotion and courage.
  chaupai-01:
    title: Jambavan's Inspiring Words
    description: Jambavan, the wise ancient bear king with white fur and divine presence, speaking inspiring words to Hanuman
      on a mountain peak overlooking the vast ocean. Hanuman sits humbly listening, his orange-red form glowing with awakening
      divine energy. Golden sunset rays illuminate the scene. Sacred geometry patterns and lotus mandalas in the background.
      Luminous, spiritual atmosphere with warm golden tones. Divine radiance emanating from both figures with ethereal lighting.
  chaupai-02:
    title: Hanuman's Humble Confidence
    description: Lord Hanuman standing at the ocean shore in a respectful, humble posture with hands folded in namaste, yet
      radiating immense divine power. His muscular form glows with orange-golden energy. Vanaras (monkey warriors) stand behind
      him respectfully. The vast blue ocean stretches before him. Golden divine light emanates from his heart chakra. Sacred
      symbols and lotus flowers float in the spiritual atmosphere. Mystical ethereal composition with volumetric light rays.
  chaupai-03:
    title: Bowing to Lord Rama's Lotus Feet
    description: Hanuman kneeling in deep devotion, head bowed, hands in prayer mudra, before the luminous lotus feet of Lord
      Rama. Divine golden-white light radiates from above where Rama's feet are visible. Hanuman's orange-red form is surrounded
      by spiritual aura and sacred energy. Lotus petals fall from above. Om symbol glows in the background. Ethereal, mystical
      atmosphere with soft sacred geometry patterns. Emphasis on devotion and divine grace with dramatic spiritual lighting.
  chaupai-04:
    title: Hanuman's Bold Declaration
    description: Mighty Hanuman standing confidently at the shore, his powerful orange-red form radiating divine energy, addressing
      the gathered vanaras (monkey warriors) with an inspiring gesture. Sugriva the vanara king and prophetic vision of Vibhishana
      in ethereal golden light stand among the crowd. Hanuman's posture shows both humility and unshakeable determination.
      The vast ocean stretches behind him under a dramatic sky. Sacred symbols and divine auras surround all figures. Luminous
      spiritual energy flows between them representing collective faith and blessing. Epic cinematic composition with volumetric
      light rays and mystical atmosphere.
  chaupai-05:
    title: Hanuman's Playful Leap to Mount Mahendra
    description: Hanuman in mid-leap, his powerful orange-red form joyfully bounding onto the summit of Mount Mahendra (Mahendra
      Parvat), a majestic mountain rising from the ocean shore. His expression radiates childlike joy and playful confidence
      (kautuk). The beautiful mountain has lush vegetation and sacred atmosphere. The vast blue ocean stretches endlessly
      in the background under dramatic sky with golden-orange sunset rays. Hanuman's posture is dynamic and graceful, showing
      effortless power. Divine golden energy trails follow his movement. Sacred geometry patterns shimmer in the air. The
      scene captures both the playfulness and the gathering of cosmic energy for his impending great leap. Cinematic composition
      with dramatic lighting emphasizing the epic scale - tiny shore below, massive mountain, infinite ocean beyond.
  chaupai-06:
    title: Hanuman's Divine Strength and Wisdom
    description: 'Majestic Hanuman standing powerfully atop Mount Mahendra, his muscular orange-red form radiating both immense
      physical strength and profound spiritual wisdom. His posture embodies perfect balance - powerful warrior stance with
      contemplative, serene expression. Divine wind energy (representing his father Vayu) swirls around him in visible golden-white
      currents. His aura shows multiple layers: outer aura of raw power (wind-like currents), middle aura of luminous intelligence
      (geometric patterns and sacred yantra symbols), inner aura of pure wisdom (soft golden light with Om symbols). Third
      eye subtly glowing indicating heightened consciousness. Ancient Sanskrit shlokas and mathematical/astronomical symbols
      float ethereally around him representing knowledge (vigyana). Background shows the vast ocean and distant Lanka, with
      storm clouds gathering but Hanuman calm and centered. Sacred books and weapons both present around him symbolizing the
      union of wisdom and strength. Epic cinematic composition emphasizing his complete divine nature - both Maruti (son of
      wind) and Buddhimaan (possessor of supreme intelligence).'
  chaupai-07:
    title: Hanuman's Leap to the Underworld
    description: In the mystic twilight, the colossal figure of Hanuman, the monkey god, stands atop a rocky mountain peak,
      his muscular form silhouetted against a backdrop of a slowly setting sun that bathes the scene in hues of fiery orange
      and deep purples. Hanuman's foot presses down on the ground, causing the mountain to tremble and crack, symbolizing
      his power, whilst below, the gaping mouth of Patala, the underworld, begins to open. The focus is on Hanuman's determined
      expression and the symbolic action of his foot, with the opening underworld in the background, alluding to the verse's
      reference of his immense strength and speed.
  chaupai-08:
    title: Hanuman's Unfailing Journey
    description: Underneath the divine, star-studded expanse of the ancient Indian sky, the mighty figure of Hanuman, the
      monkey god, is seen soaring through the air, his muscular form silhouetted against the majestic moon. His eyes are intense,
      filled with determination, mirroring the unwavering arrow unleashed from the bow of Lord Rama, symbolizing their shared
      invincibility. The atmosphere is thick with mystique and reverence, with the soft, ethereal glow of the moonlight highlighting
      the contours of Hanuman's body and illuminating the path he traverses. The focus is on Hanuman, his trajectory symbolizing
      the unerring path of righteousness, his journey casting a comforting shadow over the awe-inspiring landscape beneath.
  chaupai-09:
    title: Rama's Emissary Considers the Ocean
    description: In the vast expanse of the sapphire ocean, Mount Mainaka rises majestically from the waves, its golden peaks
      piercing through soft clouds. The mighty Hanuman, his form radiant with divine orange-golden aura, soars through the
      sky above the sacred mountain, his determined gaze fixed on Lanka in the distance. The ocean deity, personified as a
      wise elderly figure with flowing white beard and blue-green robes adorned with coral and pearls, emerges from the waves
      below, his hands raised in reverent salute to Lord Rama's messenger. Mount Mainaka extends upward with welcoming green
      slopes offering shade and rest, while sacred waterfalls cascade down its sides. The composition captures the moment
      of divine consideration - the ocean honoring Rama's mission, the mountain offering respite to the devoted messenger.
      Ethereal rays of sunlight break through clouds, illuminating Hanuman's path while casting a mystical glow over this
      sacred encounter between earth, water, and sky.
  doha-01:
    title: Hanuman's Unwavering Resolve
    description: The mighty Hanuman, suspended in mid-air with his powerful orange-red form glowing with divine energy, reaches
      down with one hand to reverently touch the golden peak of Mount Mainaka in a gesture of respect and gratitude. His other
      hand is raised to his forehead in a traditional pranaam (salutation), his head slightly bowed in humility despite his
      immense power. His eyes are focused and determined, blazing with unwavering resolve - the fire of devotion to complete
      Lord Rama's mission burns within them. Mount Mainaka's personified form appears as a wise, benevolent mountain deity
      with welcoming gestures, offering rest and shelter. The sapphire ocean stretches endlessly below with gentle waves.
      In the distant background, the shadow of Lanka looms on the horizon - his ultimate destination. Sacred geometry patterns
      and divine light rays emanate from Hanuman's heart chakra, symbolizing his single-minded dedication. The composition
      captures the pivotal moment of respectful acknowledgment balanced with unshakeable determination - honoring the mountain's
      kindness while declining rest until his sacred duty is fulfilled. Golden sunset light bathes the scene with warm, spiritual
      energy, while mystical auras swirl around both Hanuman and the mountain in mutual respect.
  chaupai-10:
    title: The Gods Observe Hanuman
    description: High above the vast sapphire ocean, the mighty Hanuman soars with tremendous speed and grace, his powerful
      orange-red form blazing with divine energy as he continues his epic journey toward Lanka. His muscular silhouette cuts
      through the sky with unwavering determination. Above him, in the ethereal celestial realm (Devaloka), the Devas - gods
      of the Hindu pantheon - observe from their luminous cloud platforms bathed in soft golden-white divine light. Indra,
      Brahma, Vayu, and other radiant celestial beings are gathered, their forms glowing with divine auras in colors of gold,
      silver, and celestial blue. They watch intently with expressions of wonder, curiosity, and assessment, some pointing,
      others in discussion, observing Hanuman's extraordinary flight with keen interest. Their faces show a mixture of admiration
      and careful evaluation - they seek to understand the extent of his bal (strength) and buddhi (intelligence). Sacred
      cosmic symbols, celestial mandalas, and divine geometric patterns shimmer in the heavenly realm. Rays of divine light
      beam down from the gods toward Hanuman, as if scanning and assessing his capabilities. The composition is split between
      the earthly realm (Hanuman over ocean) and celestial realm (gods above in clouds), connected by streams of divine energy.
      The atmosphere is one of divine testing and cosmic significance, with both power and wisdom being measured. Epic scale
      showing the majesty of both mortal devotion and divine observation.
  chaupai-11:
    title: Surasa's Challenge
    description: In the endless expanse of the deep blue ocean sky, the mighty Hanuman flies forward with determination when
      suddenly, the majestic Surasa appears before him, blocking his path. Surasa, the primordial mother of all serpents (nagas),
      manifests as a powerful divine feminine figure with regal bearing - her lower body transforming into massive serpentine
      coils covered in iridescent scales that shimmer with jewel-like colors (emerald, sapphire, ruby). Her upper form is
      beautiful yet formidable, adorned with elaborate serpent-themed jewelry and a crown of cobra hoods. Her eyes hold ancient
      wisdom and divine authority. In the background, faint ethereal forms of the Devas can be seen in the clouds above, having
      sent her to test Hanuman - Indra and other gods watching from their celestial realm. Hanuman hovers mid-flight, his
      orange-red form radiating with alert energy, his expression showing surprise but not fear, hands in a respectful namaste
      gesture as Surasa speaks to him. The ocean below churns with mysterious energy. Sacred serpent symbols (nagamandala)
      and divine geometric patterns swirl in the space between them. The lighting is dramatic with divine rays breaking through
      clouds, casting both figures in supernatural glow. The composition captures the pivotal moment of divine testing - a
      cosmic checkpoint on Hanuman's sacred journey, where his intelligence and devotion will soon be put to the test. Epic
      scale with mystical atmosphere emphasizing the supernatural nature of this encounter.
  chaupai-12:
    title: Hanuman Receives Divine Nourishment
    description: In a tranquil moment after passing Surasa's test, Hanuman hovers in the vast ocean sky, his orange-red form
      glowing with renewed spiritual energy. His expression shows gratitude and humility as he acknowledges the divine grace
      he has received. Around him, ethereal celestial beings (Suras) manifest in soft golden light, their forms barely visible
      but radiating divine blessing. Sacred symbols and lotus flowers materialize in the air, representing spiritual nourishment
      and divine sustenance. Hanuman's hands are in anjali mudra (prayer gesture), expressing thankfulness. The atmosphere
      shifts from the intensity of testing to one of serene blessing - the gods have provided him not just physical strength,
      but spiritual fortification for his sacred mission ahead. The sapphire ocean below reflects this moment of grace, with
      gentle waves and soft light. In the background, Mount Mainaka and the fading form of Surasa represent tests overcome.
      Divine rays of golden-white light stream from above, symbolizing the blessings and support from the celestial realm.
      The composition emphasizes spiritual nourishment over physical - Hanuman's aura glows brighter, showing his strength
      renewed through divine grace. The scene captures the profound truth that devotion and righteousness receive divine support
      in sacred missions. Mystical atmosphere with soft, reverent lighting emphasizing spiritual sustenance and divine providence.
  chaupai-13:
    title: Hanuman's Unwavering Resolve
    description: In the vast expanse of the ocean sky, the mighty Hanuman soars forward with renewed determination and focus,
      his powerful orange-red form blazing with divine energy and unwavering resolve. His eyes are fixed on the distant horizon
      where Lanka awaits, burning with single-minded devotion to his sacred mission. His expression shows deep determination
      mixed with devotional love - the fire of service to Lord Rama illuminates his face. One hand is raised in a gesture
      of firm resolve (abhaya mudra), while the other touches his heart, symbolizing his promise to complete Rama's work.
      Behind him, the trials he has overcome (Mount Mainaka, Surasa's test) fade into ethereal light, while ahead, the golden
      shores of Lanka begin to shimmer in the distance. The sapphire ocean stretches endlessly below with white-capped waves.
      Sacred symbols and divine geometric patterns swirl around him, representing his focused intention. In the sky above,
      a subtle ethereal vision of Lord Rama and Sita appears in soft golden light, representing the purpose that drives him
      forward. His aura radiates with concentric circles of orange-golden energy showing his gathering power and determination.
      The composition emphasizes forward momentum and purposeful action - no more tests or distractions, only pure focused
      devotion to finding Sita and returning with news to his beloved Lord. Epic cinematic scale with dramatic lighting emphasizing
      Hanuman's transition from tested devotee to unstoppable divine messenger. The atmosphere is one of sacred determination,
      showing that nothing can now deter him from his mission.
  chaupai-14:
    title: Hanuman's Brilliant Solution
    description: In the vast expanse of the ocean sky, Hanuman hovers before the majestic Surasa with his hands folded in
      respectful namaste gesture, addressing her with reverence as "Mother" (Māī). His orange-red form radiates both humility
      and intelligent confidence, his expression showing deep respect mixed with clever determination. Surasa, the serpent
      mother with her massive divine form adorned with iridescent scales and regal bearing, listens intently to Hanuman's
      words. The atmosphere is charged with spiritual significance - this is the pivotal moment where Hanuman speaks his truth,
      declaring his intention to fulfill her divine test by entering her mouth, demonstrating his wit and adherence to dharma.
      His posture shows perfect balance between devotion (bowing respectfully) and determination (eyes steady and resolute).
      Sacred symbols and divine light surround both figures. In the background, the sapphire ocean stretches below and celestial
      devas watch from ethereal clouds above. The lighting is dramatic yet respectful - golden-white divine radiance illuminating
      Hanuman as he speaks his truth, emerald-silver light emanating from Surasa. The composition emphasizes the moment of
      verbal exchange and mutual respect - Hanuman addressing the divine feminine power with truthfulness and reverence, while
      demonstrating his brilliant problem-solving wisdom. The scene captures the essence of passing divine tests through intelligence,
      truth, and proper respect for the sacred feminine. Mystical atmosphere with spiritual energy flowing between the two
      beings in waves of understanding and divine acknowledgment.
  chaupai-15:
    title: Hanuman's Fearless Determination
    description: In the mystical glow of a twilight sky, the mighty Hanuman stands resiliently on the edge of a rocky cliff,
      his muscular form silhouetted against the horizon. His eyes gleam with determination and wisdom, looking upwards towards
      the heavens as if in silent communication with the divine. The air around him shimmers with spiritual energy, casting
      a warm glow on the myriad of undulating clouds beneath him. The focus is on Hanuman's confident stance, symbolizing
      his unwavering faith and courage, amidst the serene and ethereal atmosphere.
  chaupai-16:
    title: Hanuman's Magnificent Transformation
    description: A colossal figure with a body expanded to cover tens of miles, representing Lord Hanuman, is set against
      a deep indigo sky punctuated by twinkling stars. The monkey god's body, twice as large as his original size, radiates
      a warm, golden hue, illuminating the scene with a soft divine glow. The mood is one of awe and reverence, heightened
      by the serene, tranquil wilderness below, bathed in moonlight. The focus is on Hanuman's monumental form, symbolizing
      his steadfast devotion and immense power, with a wide-angle perspective that conveys the vastness of his divine transformation.
  chaupai-17:
    title: Hanuman's Swift Transformation [AI-Generated - Review Recommended]
    description: In a mystical realm of soft golden light and dusky shadows, the monkey god Hanuman, son of the wind, is depicted
      in mid-transformation, his body expanding from a regular size to a colossal figure of thirty-two yojanas. His face alone
      stretches for sixteen yojanas, eyes gleaming with determination and divine power. The backdrop is a vibrant, celestial
      sky filled with translucent clouds of iridescent colors, a few divine figures watch in awe from afar, their expressions
      filled with astonishment and reverence. The focus is on Hanuman, his body glowing with an ethereal radiance, capturing
      the very moment he becomes a giant, ready to leap across the ocean, symbolizing the immense power of devotion and courage.
  chaupai-18:
    title: Hanuman's Changing Form [AI-Generated - Review Recommended]
    description: In the midst of a vibrant, divine celestial landscape, the enormous figure of Surasa, the mother of the Nagas,
      expands her body, her scales shimmering in multiple hues. Opposite her, the agile form of Hanuman, the monkey God, dynamically
      adjusts his size, a determined gaze in his eyes, his body bathed in the warm, golden light of divinity. The setting
      is ethereal, tension palpable, as they engage in a battle of wits and size, symbolizing the eternal struggle between
      obstacles and the pursuit of Dharma. The focus is on the contrasting figures, Surasa's menacing posture and Hanuman's
      agile adaptability, ensnared in this divine dance.
  chaupai-19:
    title: Hanuman's Transformation for the Leap [AI-Generated - Review Recommended]
    description: In the ethereal glow of twilight, with a vast expanse of ocean reflecting the pink and purple hues, Hanuman,
      the son of the Wind God, is shrinking to a minuscule size. His monkey-like visage is filled with determination and reverence
      as he prepares to leap the daunting distance of a hundred Yojanas. The focus is on Hanuman, who stands on a rocky cliff,
      his body illuminated by the soft, celestial light, symbolizing his divine mission. The atmosphere is tense yet awe-inspiring,
      encapsulating the monumental endeavor about to be undertaken.

episodes:
- id: jatayu-rama-cremation
  type: event
  keywords:
  - Jatayu
  - Rama
  - cremation
  source:
    book: Ananda Ramayan
    sarga: अष्टम सर्ग
  summary_en: Rama and Lakshmana arrive at the hermitage and meet Jatayu, who narrates
    the abduction of Sita by Ravana. Rama performs the last rites for Jatayu with
    his own hands.
  summary_hi: राम और लक्ष्मण आश्रम पहुँचते हैं और जटायु से मिलते हैं, जो सीता के रावण
    द्वारा अपहरण की घटना सुनाते हैं। राम अपने हाथों से जटायु का अंतिम संस्कार करते
    हैं।
- id: hanuman-meets-sita
  type: story
  keywords:
  - Hanuman
  - Sita
  - Lanka
  source:
    book: Ananda Ramayan
    sarga: Mohanakanda
  summary_en: Hanuman reaches Lanka and, after searching, finds Sita in the Ashoka
    grove. He approaches her in a small form, introduces himself as a messenger of
    Rama, and gives her Rama's ring. Sita is overjoyed to see the ring and recognizes
    Hanuman as a friend.
  summary_hi: हनुमान लंका पहुँचते हैं और खोज के बाद अशोक वाटिका में सीता को पाते हैं।
    वे छोटे रूप में उनके पास जाते हैं, खुद को राम के दूत के रूप में परिचित कराते हैं
    और उन्हें राम की अंगूठी देते हैं। सीता अंगूठी देखकर प्रसन्न होती हैं और हनुमान
    को मित्र के रूप में पहचानती हैं।
- id: hanuman-burns-lanka
  type: story
  keywords:
  - Hanuman
  - Lanka
  - fire
  source:
    book: Ananda Ramayan
    sarga: Mohanakanda
  summary_en: After meeting Sita, Hanuman creates havoc in Lanka by uprooting trees
    and defeating demons. He sets Lanka on fire as a demonstration of his power and
    returns to Rama with Sita's jewelry as proof of their meeting.
  summary_hi: सीता से मिलने के बाद, हनुमान लंका में तबाही मचाते हैं, पेड़ों को उखाड़ते
    हैं और राक्षसों को हराते हैं। वे अपनी शक्ति का प्रदर्शन करते हुए लंका को आग लगा
    देते हैं और सीता के आभूषणों के साथ राम के पास लौटते हैं।
- id: rama-hanuman-friendship
  type: story
  keywords:
  - Rama
  - Hanuman
  - friendship
  source:
    book: Ananda Ramayan
    sarga: अष्टम सर्ग
  summary_en: Rama and Hanuman form a deep friendship, with Hanuman pledging his unwavering
    support to Rama in his quest to rescue Sita.
  summary_hi: राम और हनुमान गहरी मित्रता स्थापित करते हैं, जिसमें हनुमान सीता को बचाने
    के राम के प्रयास में अपना अटूट समर्थन देने की प्रतिज्ञा करते हैं।
- id: rama-birth-prophecy
  type: story
  keywords:
  - prophecy
  - rama
  source:
    book: Ananda Ramayan
    sarga: '1'
  summary_en: In this episode, a prophecy is made about the birth of Lord Rama. It
    is foretold that Rama will be born and that Ravana will be defeated. Brahma advises
    Ravana to refrain from unnecessary actions and to send the box containing the
    future to Ayodhya.
  summary_hi: इस प्रकरण में भगवान राम के जन्म की भविष्यवाणी की जाती है। यह भविष्यवाणी
    की जाती है कि राम का जन्म होगा और रावण पराजित होगा। ब्रह्मा रावण को अनावश्यक कार्यों
    से बचने और भविष्य को समेटे हुए पेटिका को अयोध्या भेजने की सलाह देते हैं।
- id: dasharatha-ravana-battle
  type: event
  keywords:
  - dasharatha
  - ravana
  - battle
  source:
    book: Ananda Ramayan
    sarga: '1'
  summary_en: Ravana, upon learning about his future death at the hands of Rama, attacks
    King Dasharatha. A fierce battle ensues, and Ravana defeats Dasharatha, sinking
    his boat in the Sarayu river. However, Dasharatha and his minister Sumantra survive
    by clinging to the boat's debris.
  summary_hi: रावण, अपनी भविष्य की मृत्यु के बारे में जानकर, राजा दशरथ पर हमला करता
    है। एक भयंकर युद्ध होता है, और रावण दशरथ को पराजित कर उनकी नाव को सरयू नदी में
    डुबो देता है। हालांकि, दशरथ और उनके मंत्री सुमंत्र नाव के टुकड़ों पर चढ़कर बच
    जाते हैं।
- id: ravana-abduction-of-kausalya
  type: story
  keywords:
  - Ravana
  - Kausalya
  - abduction
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana abducts Kausalya after defeating King Kosala in a fierce battle.
    He then entrusts her to a giant fish named Timingila for safekeeping, fearing
    that the gods might disguise themselves and rescue her.
  summary_hi: रावण ने राजा कोसल को भयंकर युद्ध में हराकर कौसल्या का अपहरण कर लिया।
    उसने देवताओं के भेष बदलकर उसे बचाने के डर से उसे तिमिंगिला नामक एक विशाल मछली
    को सौंप दिया।
- id: timingila-guarding-kausalya
  type: story
  keywords:
  - Timingila
  - Kausalya
  - guardianship
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The giant fish Timingila, entrusted with Kausalya, roams the ocean with
    her in its mouth. Upon encountering an enemy, it places the box containing Kausalya
    on an island and engages in battle.
  summary_hi: तिमिंगिला नामक विशाल मछली, जिसे कौसल्या की रक्षा का कार्य सौंपा गया
    था, उसे अपने मुख में लेकर समुद्र में घूमती है। एक शत्रु से सामना होने पर वह कौसल्या
    को एक द्वीप पर रखकर युद्ध करने लगती है।
- id: dasharatha-discovery-of-kausalya
  type: story
  keywords:
  - Dasharatha
  - Kausalya
  - discovery
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Dasharatha and his minister Sumantra arrive on the island and discover
    the box containing Kausalya. Astonished by the discovery, Dasharatha marries Kausalya
    on the island.
  summary_hi: राजा दशरथ और उनके मंत्री सुमंत्र द्वीप पर पहुंचते हैं और कौसल्या को
    एक संदूक में पाते हैं। इस खोज से आश्चर्यचकित होकर, दशरथ वहीं पर कौसल्या से विवाह
    कर लेते हैं।
- id: brahma-reveals-dasharatha-marriage
  type: story
  keywords:
  - Brahma
  - Dasharatha
  - marriage
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In Ravana's court, Brahma reveals that Dasharatha has married Kausalya,
    contradicting Ravana's claim of hiding her. Ravana attempts to prove Brahma wrong
    by summoning the box, only to find Dasharatha and Kausalya inside.
  summary_hi: रावण की सभा में, ब्रह्मा यह प्रकट करते हैं कि दशरथ ने कौसल्या से विवाह
    कर लिया है, जो रावण के उसे छुपाने के दावे का खंडन करता है। रावण ब्रह्मा को गलत
    साबित करने के लिए संदूक मंगवाता है, लेकिन उसमें दशरथ और कौसल्या को पाता है।
- id: dasharatha-marriages
  type: story
  keywords:
  - dasharatha
  - marriage
  source:
    book: Ananda Ramayan
    sarga: '1'
  summary_en: King Dasharatha marries multiple times to ensure the continuation of
    his lineage. He marries Sumitra, the daughter of the king of Magadha, and Kaikeyi,
    the daughter of the king of Kekaya, among others. Despite these marriages, he
    remains childless.
  summary_hi: राजा दशरथ अपने वंश की निरंतरता सुनिश्चित करने के लिए कई बार विवाह करते
    हैं। वह मगध के राजा की पुत्री सुमित्रा और केकय के राजा की पुत्री कैकेयी से विवाह
    करते हैं। इन विवाहों के बावजूद, वह संतानहीन रहते हैं।
- id: dasharatha-support-in-war
  type: story
  keywords:
  - dasharatha
  - war
  source:
    book: Ananda Ramayan
    sarga: '1'
  summary_en: During a great war between the gods and demons, an oracle declares that
    the side supported by King Dasharatha will be victorious. This prophecy influences
    the course of the battle, ensuring victory for the side aligned with Dasharatha.
  summary_hi: देवताओं और दानवों के बीच एक महान युद्ध के दौरान, एक आकाशवाणी होती है
    कि जिस पक्ष को राजा दशरथ का समर्थन प्राप्त होगा, वही विजयी होगा। यह भविष्यवाणी
    युद्ध के परिणाम को प्रभावित करती है, जिससे दशरथ के पक्ष की विजय सुनिश्चित होती
    है।
- id: dasharatha-kaikeyi-battle-episode
  type: story
  keywords:
  - Dasharatha
  - Kaikeyi
  - battle
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: During a fierce battle, King Dasharatha's chariot axle broke, but Queen
    Kaikeyi, who was watching the battle, quickly replaced it with her arm, thanks
    to a boon she received. This act of bravery led Dasharatha to offer her two boons,
    which she kept in reserve for future use.
  summary_hi: एक भयंकर युद्ध के दौरान, राजा दशरथ के रथ का धुरा टूट गया, लेकिन रानी
    कैकेयी, जो युद्ध देख रही थी, ने अपने हाथ से उसे तुरंत बदल दिया, जो उसे मिले वरदान
    के कारण संभव हुआ। इस साहसिक कार्य के लिए दशरथ ने उसे दो वरदान देने का प्रस्ताव
    दिया, जिन्हें उसने भविष्य में उपयोग के लिए सुरक्षित रखा।
- id: shravan-kumar-episode
  type: story
  keywords:
  - Shravan Kumar
  - Dasharatha
  - accidental killing
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Dasharatha, while hunting in the forest, accidentally killed Shravan
    Kumar, mistaking him for an elephant due to the sound of water filling a pot.
    Shravan was carrying his elderly parents to Kashi, and his death led to a tragic
    encounter between Dasharatha and Shravan's parents.
  summary_hi: राजा दशरथ ने जंगल में शिकार करते समय गलती से श्रवण कुमार को मार डाला,
    जिसे उन्होंने पानी भरते समय हाथी समझ लिया था। श्रवण अपने वृद्ध माता-पिता को काशी
    ले जा रहा था, और उसकी मृत्यु ने दशरथ और श्रवण के माता-पिता के बीच एक दुखद मुठभेड़
    को जन्म दिया।
- id: romapada-rain-and-son-story
  type: story
  keywords:
  - Romapada
  - Rishyashringa
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: King Romapada of Anga, facing a drought and childlessness, follows his
    ministers' advice to bring Rishyashringa, the son of sage Vibhandaka, to his kingdom.
    He sends courtesans to the forest to entice Rishyashringa with music and dance.
    Their efforts succeed, and Rishyashringa's presence brings rain and a son to Romapada.
  summary_hi: अंगदेश के राजा रोमपाद, वर्षा न होने और संतानहीनता से परेशान होकर अपने
    मंत्रियों की सलाह पर ऋष्यश्रृंग, जो कि ऋषि विभांडक के पुत्र थे, को अपने राज्य
    में लाने का निर्णय लेते हैं। वे वेश्याओं को वन में भेजते हैं, जो संगीत और नृत्य
    के माध्यम से ऋष्यश्रृंग को मोहित करती हैं। उनके आने से राज्य में वर्षा होती है
    और रोमपाद को पुत्र की प्राप्ति होती है।
- id: dasaratha-yajna-and-payasam-story
  type: story
  keywords:
  - Dasharatha
  - Yajna
  - Payasam
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: King Dasharatha, desiring offspring, performs a yajna with the help
    of sage Rishyashringa. From the sacrificial fire, a divine being emerges and offers
    payasam (sweet rice pudding) to the king, which he distributes among his three
    queens. This leads to the birth of his sons, including Rama.
  summary_hi: राजा दशरथ, संतान की इच्छा रखते हुए, ऋष्यश्रृंग की सहायता से एक यज्ञ
    करते हैं। यज्ञकुंड से एक दिव्य पुरुष प्रकट होता है और राजा को पायसम (मीठा खीर)
    प्रदान करता है, जिसे राजा अपनी तीन रानियों में बांट देते हैं। इससे उनके पुत्रों
    का जन्म होता है, जिनमें राम भी शामिल हैं।
- id: apsara-curse-and-redemption-story
  type: story
  keywords:
  - Apsara
  - Curse
  - Redemption
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: An apsara named Suvarcha is cursed by Brahma to become a vulture due
    to a dance mistake. She is told that her redemption will come when she steals
    payasam meant for Kaikeyi and drops it on Anjaniparvat. After doing so, she regains
    her apsara form and returns to heaven.
  summary_hi: सुवर्चा नामक अप्सरा को नृत्य में गलती के कारण ब्रह्मा द्वारा गृध्री
    बनने का शाप मिलता है। उसे बताया जाता है कि जब वह कैकेयी के लिए बने पायसम को चुराकर
    अंजनिपर्वत पर गिराएगी, तब उसका उद्धार होगा। ऐसा करने के बाद, वह अपने अप्सरा रूप
    को पुनः प्राप्त करती है और स्वर्ग लौट जाती है।
- id: rama-lakshmana-bharata-shatrughna-birth
  type: story
  keywords:
  - birth
  - rama
  - lakshmana
  - bharata
  - shatrughna
  source:
    book: Ananda Ramayan
    sarga: द्वितीयः सर्गः
  summary_en: In this episode, the Earth, tormented by Ravana and other demons, approaches
    Lord Vishnu for protection. Vishnu assures her that he will incarnate on Earth.
    Consequently, Rama, Lakshmana, Bharata, and Shatrughna are born to Kausalya, Sumitra,
    and Kaikeyi respectively. The birth of these divine children is celebrated with
    great joy and rituals.
  summary_hi: इस प्रकरण में, रावण और अन्य राक्षसों से पीड़ित पृथ्वी माता भगवान विष्णु
    के पास सुरक्षा के लिए जाती हैं। विष्णु उन्हें आश्वासन देते हैं कि वे पृथ्वी पर
    अवतार लेंगे। इसके परिणामस्वरूप, राम, लक्ष्मण, भरत और शत्रुघ्न का जन्म कौसल्या,
    सुमित्रा और कैकेयी से होता है। इन दिव्य बच्चों के जन्म का उत्सव बड़े हर्ष और विधियों
    के साथ मनाया जाता है।
- id: rama-childhood-pranks
  type: story
  keywords:
  - Rama
  - childhood
  - pranks
  source:
    book: Ananda Ramayan
    sarga: बालकाण्ड
  summary_en: The passage describes the playful antics of young Rama. He would watch
    his father eat and mischievously take a morsel from his plate, running away with
    it. Despite attempts by his mother Kausalya to catch him, Rama would elude her
    grasp, only to return and lovingly feed his parents with his own hands.
  summary_hi: इस अंश में बालक राम की खेल-खिलवाड़ का वर्णन है। वह अपने पिता को भोजन
    करते देखते और शरारत से उनकी थाली से एक कौर लेकर भाग जाते। कौसल्या द्वारा पकड़ने
    की कोशिश के बावजूद, राम उनके हाथ नहीं आते थे, और फिर प्यार से अपने माता-पिता को
    अपने हाथों से खिलाते थे।
- id: rama-yajnopavita-ceremony
  type: event
  keywords:
  - Rama
  - yajnopavita
  - ceremony
  source:
    book: Ananda Ramayan
    sarga: बालकाण्ड
  summary_en: The passage mentions the sacred thread ceremony (Yajnopavita) of Rama
    and his brothers. The ceremony was conducted by sages, marking an important rite
    of passage in their lives. The young princes, adorned with ornaments, performed
    the rituals with devotion.
  summary_hi: इस अंश में राम और उनके भाइयों के यज्ञोपवीत संस्कार का उल्लेख है। यह
    संस्कार ऋषियों द्वारा संपन्न किया गया, जो उनके जीवन का एक महत्वपूर्ण संस्कार था।
    युवा राजकुमारों ने आभूषणों से सुसज्जित होकर श्रद्धा के साथ इस अनुष्ठान को पूरा
    किया।
- id: vishvamitra-requests-rama-lakshmana
  type: event
  keywords:
  - Vishvamitra
  - Rama
  - Lakshmana
  source:
    book: Ananda Ramayan
    sarga: Sarga 2
  summary_en: Sage Vishvamitra visits Ayodhya and requests King Dasharatha to send
    Rama and Lakshmana with him to protect his yajna. Despite initial reluctance,
    Dasharatha agrees and sends the two princes with the sage.
  summary_hi: ऋषि विश्वामित्र अयोध्या आते हैं और राजा दशरथ से यज्ञ की रक्षा के लिए
    राम और लक्ष्मण को उनके साथ भेजने का अनुरोध करते हैं। प्रारंभिक अनिच्छा के बावजूद,
    दशरथ सहमत होते हैं और दोनों राजकुमारों को ऋषि के साथ भेज देते हैं।
- id: rama-lakshmana-learn-divine-weapons
  type: story
  keywords:
  - Rama
  - Lakshmana
  - Divine Weapons
  source:
    book: Ananda Ramayan
    sarga: Sarga 2
  summary_en: On their journey with Vishvamitra, Rama and Lakshmana are taught various
    divine weapons and skills by the sage. These include the knowledge of Maheshwari,
    archery, and other martial arts, which prepare them to face the rakshasas.
  summary_hi: विश्वामित्र के साथ यात्रा के दौरान, राम और लक्ष्मण को ऋषि द्वारा विभिन्न
    दिव्य अस्त्रों और कौशलों की शिक्षा दी जाती है। इनमें माहेश्वरी, धनुर्विद्या और
    अन्य युद्ध कलाओं का ज्ञान शामिल है, जो उन्हें राक्षसों का सामना करने के लिए तैयार
    करता है।
- id: rama-kills-tataka
  type: event
  keywords:
  - Rama
  - Tataka
  - Rakshasa
  source:
    book: Ananda Ramayan
    sarga: Sarga 2
  summary_en: During their journey, Rama encounters and kills the demoness Tataka,
    who was terrorizing travelers. This act demonstrates Rama's prowess and sets the
    stage for further encounters with rakshasas.
  summary_hi: यात्रा के दौरान, राम का सामना राक्षसी ताड़का से होता है और वह उसे मार
    देते हैं, जो यात्रियों को आतंकित कर रही थी। यह कार्य राम की वीरता को दर्शाता है
    और राक्षसों के साथ आगे की मुठभेड़ों की भूमिका तैयार करता है।
- id: ahalya-liberation
  type: story
  keywords:
  - Ahalya
  - Rama
  - Liberation
  source:
    book: Ananda Ramayan
    sarga: Sarga 2
  summary_en: Rama liberates Ahalya from a curse by touching her with his foot. Ahalya,
    who had been turned into stone due to a curse, regains her human form and is reunited
    with her husband, Sage Gautama.
  summary_hi: राम अपने चरण स्पर्श से अहल्या को श्राप से मुक्त करते हैं। अहल्या, जो
    श्राप के कारण पत्थर बन गई थी, अपनी मानव रूप में लौट आती है और अपने पति, ऋषि गौतम
    के साथ पुनर्मिलन करती है।
- id: tadaka-curse-story
  type: story
  keywords:
  - Tadaka
  - curse
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Tadaka was once a beautiful apsara who was cursed by Sage Agastya to
    become a demoness after she disturbed his penance in the forest. She gave birth
    to two demon sons, Maricha and Subahu. Agastya foretold that her liberation would
    come from Rama's arrows, which eventually happened, allowing her to ascend to
    heaven.
  summary_hi: ताड़का पहले एक सुन्दर अप्सरा थी, जिसे अगस्त्य ऋषि ने उसके वन में तपस्या
    में विघ्न डालने के कारण राक्षसी बनने का शाप दिया था। उसने मारीच और सुबाहु नामक
    दो राक्षस पुत्रों को जन्म दिया। अगस्त्य ने कहा था कि उसकी मुक्ति राम के बाणों
    से होगी, जो अंततः हुआ और वह स्वर्ग को चली गई।
- id: ahalya-redemption-story
  type: story
  keywords:
  - Ahalya
  - redemption
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Ahalya, the wife of Sage Gautama, was turned into a stone due to a curse
    after being deceived by Indra. Upon the request of Sage Vishwamitra, Lord Rama
    touched the stone with his feet, redeeming Ahalya and restoring her to her original
    form.
  summary_hi: अहल्या, जो ऋषि गौतम की पत्नी थीं, इंद्र द्वारा धोखा दिए जाने के कारण
    शापित होकर पत्थर बन गई थीं। विश्वामित्र मुनि के अनुरोध पर, भगवान राम ने अपने चरणों
    से पत्थर को स्पर्श किया, जिससे अहल्या का उद्धार हुआ और वह अपने मूल स्वरूप में
    लौट आईं।
- id: ram-chandra-boatman-episode
  type: story
  keywords:
  - Ram
  - boatman
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: As Rama and Lakshmana seek to cross a river, a boatman offers to ferry
    them across. However, he requests to wash Rama's feet first, fearing that the
    dust from Rama's feet might turn his boat into stone, as it is known that Rama's
    touch can transform objects. Rama laughs at the boatman's words and agrees to
    the request.
  summary_hi: राम और लक्ष्मण नदी पार करने के लिए नाव की तलाश में थे। एक नाववाला उन्हें
    पार ले जाने की पेशकश करता है, लेकिन पहले राम के चरण धोने की इच्छा व्यक्त करता
    है, यह सोचकर कि राम के चरणों की धूल से उसकी नाव पत्थर में बदल सकती है। राम नाववाले
    की बात सुनकर हंसते हैं और उसकी बात मान लेते हैं।
- id: vishvamitra-arrival-in-mithila
  type: event
  keywords:
  - Vishvamitra
  - Mithila
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vishvamitra arrives in Mithila with Rama and Lakshmana. A disciple of
    Vishvamitra conveys a message to King Janaka, informing him of the arrival of
    the two princes and their intention to participate in the bow-breaking contest.
  summary_hi: विश्वामित्र राम और लक्ष्मण के साथ मिथिला पहुंचते हैं। विश्वामित्र के
    एक शिष्य द्वारा राजा जनक को संदेश दिया जाता है, जिसमें दो राजकुमारों के आगमन और
    धनुष तोड़ने की प्रतियोगिता में भाग लेने की उनकी इच्छा की जानकारी दी जाती है।
- id: rama-sita-meeting
  type: event
  keywords:
  - Rama
  - Sita
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama and Lakshmana arrive in Mithila, where they are warmly welcomed
    by the citizens. The women of the city, upon seeing Rama, express their admiration
    and hope that he will be a suitable match for Sita. They shower flowers on the
    brothers as they pass by.
  summary_hi: राम और लक्ष्मण मिथिला में आते हैं, जहाँ उन्हें नगरवासियों द्वारा गर्मजोशी
    से स्वागत किया जाता है। नगर की महिलाएँ राम को देखकर उनकी प्रशंसा करती हैं और आशा
    करती हैं कि वे सीता के लिए उपयुक्त वर होंगे। वे भाइयों पर फूलों की वर्षा करती
    हैं।
- id: janaka-welcomes-rama-lakshmana
  type: event
  keywords:
  - Janaka
  - Rama
  - Lakshmana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Janaka, after decorating the city of Mithila, welcomes Rama and
    Lakshmana with great honor. He takes them to the city along with sage Vishwamitra,
    amidst celebrations and music.
  summary_hi: राजा जनक, मिथिला नगरी को सजाने के बाद, राम और लक्ष्मण का बड़े सम्मान
    के साथ स्वागत करते हैं। वे उन्हें ऋषि विश्वामित्र के साथ शहर में ले जाते हैं,
    जहाँ उत्सव और संगीत का माहौल होता है।
- id: parashurama-bow-story
  type: story
  keywords:
  - Parashurama
  - bow
  - Janaka
  - Sita
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: In the Ananda Ramayan, it is narrated that Parashurama received a divine
    bow from Shiva, which he later placed in King Janaka's courtyard. Sita, as a child,
    used to play with this bow. Recognizing Sita's divine nature, Parashurama gave
    the bow to Janaka, who then used it as a test in Sita's Swayamvara, declaring
    that whoever could string the bow would win Sita's hand in marriage.
  summary_hi: आनंद रामायण में वर्णित है कि परशुराम ने शिव से एक दिव्य धनुष प्राप्त
    किया, जिसे उन्होंने बाद में राजा जनक के आंगन में रखा। सीता बचपन में इस धनुष से
    खेला करती थीं। सीता की दिव्यता को पहचानते हुए, परशुराम ने यह धनुष जनक को दे दिया,
    जिन्होंने इसे सीता के स्वयंवर में एक परीक्षा के रूप में इस्तेमाल किया, यह घोषणा
    करते हुए कि जो भी इस धनुष को चढ़ा सकेगा, वह सीता से विवाह करेगा।
- id: ravana-fails-to-lift-bow
  type: story
  keywords:
  - Ravana
  - bow
  - strength
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: In this episode, Ravana attempts to lift a heavy bow using his immense
    strength. Despite using all his twenty arms, he fails to lift it and falls to
    the ground, much to the amusement of the assembled kings. This incident highlights
    Ravana's overconfidence and the limitations of his strength.
  summary_hi: इस प्रकरण में, रावण अपनी अपार शक्ति का उपयोग करके एक भारी धनुष उठाने
    का प्रयास करता है। बीस भुजाओं का उपयोग करने के बावजूद, वह इसे उठाने में असफल रहता
    है और जमीन पर गिर जाता है, जिससे उपस्थित राजाओं को हंसी आती है। यह घटना रावण के
    आत्मविश्वास और उसकी शक्ति की सीमाओं को दर्शाती है।
- id: janaka-challenges-heroes
  type: event
  keywords:
  - Janaka
  - challenge
  - heroes
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: King Janaka, witnessing Ravana's failure, questions if there are any
    true heroes left on earth. He challenges anyone present to save Ravana and lift
    the bow, expressing doubt about the presence of valorous men in the assembly.
  summary_hi: राजा जनक, रावण की असफलता को देखकर, पूछते हैं कि क्या पृथ्वी पर कोई सच्चा
    वीर बचा है। वह उपस्थित लोगों को चुनौती देते हैं कि वे रावण को बचाएं और धनुष उठाएं,
    सभा में वीर पुरुषों की उपस्थिति पर संदेह व्यक्त करते हैं।
- id: vishvamitra-commands-rama
  type: story
  keywords:
  - Vishvamitra
  - Rama
  - command
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Sage Vishvamitra instructs Rama to stand up and save Ravana, who is
    struggling under the weight of the bow. He urges Rama to not let Ravana die and
    to prepare the bow, indicating Rama's role as a savior and hero.
  summary_hi: ऋषि विश्वामित्र राम को खड़े होने और रावण को बचाने का निर्देश देते हैं,
    जो धनुष के भार के नीचे संघर्ष कर रहा है। वह राम से आग्रह करते हैं कि रावण को मरने
    न दें और धनुष को तैयार करें, जो राम की भूमिका को एक उद्धारकर्ता और नायक के रूप
    में दर्शाता है।
- id: sita-swayamvara-event
  type: event
  keywords:
  - Sita
  - Swayamvara
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Sita, adorned with beautiful garments and jewels, is
    seated with her companions on the terrace of a divine palace. She expresses her
    concern about the heavy bow that Rama must lift to win her hand in marriage. Despite
    her worries, she is determined not to marry anyone else and prays to various deities
    to make the bow light as a flower so that Rama can succeed.
  summary_hi: इस प्रकरण में, सीता, सुंदर वस्त्रों और आभूषणों से सजी हुई, अपनी सखियों
    के साथ एक दिव्य महल की छत पर बैठी हैं। वह उस भारी धनुष के बारे में चिंता व्यक्त
    करती हैं जिसे राम को उनके विवाह के लिए उठाना होगा। अपनी चिंताओं के बावजूद, वह
    किसी और से विवाह न करने का संकल्प लेती हैं और विभिन्न देवताओं से प्रार्थना करती
    हैं कि वे धनुष को फूल के समान हल्का बना दें ताकि राम सफल हो सकें।
- id: rama-breaks-shiva-bow
  type: event
  keywords:
  - Rama
  - Shiva's bow
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: In a grand assembly, Lord Rama effortlessly breaks the mighty bow of
    Lord Shiva, which was a test for winning Sita's hand in marriage. This event causes
    a great commotion, with celestial beings showering flowers and playing instruments
    in celebration.
  summary_hi: एक भव्य सभा में, भगवान राम ने शिवजी के महान धनुष को आसानी से तोड़ दिया,
    जो सीता का हाथ जीतने के लिए एक परीक्षा थी। इस घटना से एक बड़ा कोलाहल मच गया, जिसमें
    देवता फूल बरसाने लगे और वाद्ययंत्र बजाने लगे।
- id: ravana-departs-in-shame
  type: character
  keywords:
  - Ravana
  - shame
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Ravana, witnessing Rama's feat of breaking Shiva's bow, departs from
    the assembly in shame and anger. He leaves without his crown, feeling humiliated,
    and quickly returns to Lanka.
  summary_hi: रावण, राम द्वारा शिव के धनुष को तोड़ने की घटना देखकर, लज्जा और क्रोध
    में सभा से प्रस्थान करता है। वह बिना मुकुट के, अपमानित महसूस करते हुए, शीघ्रता
    से लंका लौट जाता है।
- id: sita-admires-rama
  type: character
  keywords:
  - Sita
  - admiration
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Sita, filled with joy and admiration, gazes at Rama with unblinking
    eyes after he breaks Shiva's bow. Her body experiences goosebumps of delight as
    she watches him.
  summary_hi: सीता, आनंद और प्रशंसा से भरी हुई, राम को बिना पलक झपकाए देखती हैं जब
    उन्होंने शिव का धनुष तोड़ा। उन्हें देखकर उनके शरीर में आनंद के रोमांच हो जाते
    हैं।
- id: sita-birth-story
  type: story
  keywords:
  - Sita
  - Janaka
  - birth
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Janaka discovers a box while plowing a field, which contains a
    baby girl. The king adopts her as his daughter, naming her Sita. The event is
    celebrated with music and flowers from the heavens, and the girl is given various
    names based on her origins.
  summary_hi: राजा जनक खेत जोतते समय एक संदूक पाते हैं, जिसमें एक बच्ची होती है। राजा
    उसे अपनी पुत्री के रूप में अपनाते हैं और उसका नाम सीता रखते हैं। इस घटना को स्वर्ग
    से संगीत और पुष्प वर्षा के साथ मनाया जाता है, और बच्ची को उसकी उत्पत्ति के आधार
    पर विभिन्न नाम दिए जाते हैं।
- id: rama-sita-marriage-arrangement
  type: event
  keywords:
  - Rama
  - Sita
  - marriage
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: King Janaka arranges the marriage of Sita with Rama, and also offers
    his other daughters Mandavi and Shrutakirti to Bharata and Shatrughna respectively.
    This arrangement is made in the presence of King Dasharatha and sage Vishwamitra.
  summary_hi: राजा जनक सीता का विवाह राम के साथ तय करते हैं, और अपनी अन्य पुत्रियों
    मांडवी और श्रुतकीर्ति को क्रमशः भरत और शत्रुघ्न के लिए प्रस्तावित करते हैं। यह
    व्यवस्था राजा दशरथ और ऋषि विश्वामित्र की उपस्थिति में की जाती है।
- id: padmaksha-tapasya-for-lakshmi-daughter
  type: story
  keywords:
  - Padmaksha
  - Lakshmi
  - tapasya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Padmaksha, observing the desires of people, decides to perform
    intense penance to have Goddess Lakshmi as his daughter. Pleased with his devotion,
    Lakshmi appears and advises him to seek Lord Vishnu's permission. Upon Vishnu's
    approval, Lakshmi agrees to become his daughter.
  summary_hi: राजा पद्माक्ष, लोगों की इच्छाओं को देखकर, देवी लक्ष्मी को अपनी पुत्री
    बनाने के लिए कठोर तप करने का निर्णय लेते हैं। उनकी भक्ति से प्रसन्न होकर लक्ष्मी
    प्रकट होती हैं और उन्हें भगवान विष्णु की अनुमति लेने की सलाह देती हैं। विष्णु
    की स्वीकृति पर, लक्ष्मी उनकी पुत्री बनने के लिए सहमत हो जाती हैं।
- id: birth-of-padmaksha-daughter
  type: story
  keywords:
  - Padmaksha
  - Lakshmi
  - birth
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lord Vishnu gives King Padmaksha a special fruit, which when opened
    reveals a radiant girl, considered to be the daughter of Lakshmi. The girl grows
    up in the king's care, bringing joy to all who see her.
  summary_hi: भगवान विष्णु राजा पद्माक्ष को एक विशेष फल देते हैं, जिसे खोलने पर एक
    चमकदार कन्या प्रकट होती है, जिसे लक्ष्मी की पुत्री माना जाता है। यह कन्या राजा
    की देखभाल में बड़ी होती है और उसे देखने वाले सभी को आनंद देती है।
- id: padmaksha-swayamvara
  type: event
  keywords:
  - Padmaksha
  - swayamvara
  - marriage
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Padmaksha organizes a swayamvara for his daughter, inviting kings
    and celestial beings from all realms. The event is grand, with many distinguished
    guests attending to win the hand of the radiant princess.
  summary_hi: राजा पद्माक्ष अपनी पुत्री के लिए एक स्वयंवर का आयोजन करते हैं, जिसमें
    सभी लोकों के राजाओं और दिव्य प्राणियों को आमंत्रित किया जाता है। यह आयोजन भव्य
    होता है, जिसमें कई प्रतिष्ठित अतिथि इस चमकदार राजकुमारी का हाथ जीतने के लिए आते
    हैं।
- id: padmaksha-battle-episode
  type: event
  keywords:
  - Padmaksha
  - battle
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: King Padmaksha engaged in a fierce battle with the gods and demons over
    the abduction of his daughter. Despite his efforts, he was ultimately killed in
    the battle, causing chaos and destruction in the kingdom.
  summary_hi: राजा पद्माक्ष ने अपनी पुत्री के अपहरण के कारण देवताओं और असुरों के साथ
    एक भयंकर युद्ध किया। उनके प्रयासों के बावजूद, वह अंततः युद्ध में मारे गए, जिससे
    राज्य में अराजकता और विनाश फैल गया।
- id: padma-self-immolation-episode
  type: event
  keywords:
  - Padma
  - self-immolation
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: In an attempt to escape capture, Padma, the daughter of King Padmaksha,
    jumped into a fire. Her disappearance led to a frantic search by the kings, who
    destroyed much of the city in their quest to find her.
  summary_hi: पकड़े जाने से बचने के लिए राजा पद्माक्ष की पुत्री पद्मा ने आग में छलांग
    लगा दी। उसके गायब होने से राजाओं ने उसे खोजने के लिए शहर का बड़ा हिस्सा नष्ट कर
    दिया।
- id: ravana-padma-encounter
  type: event
  keywords:
  - Ravana
  - Padma
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Ravana, while traveling in his Pushpaka Vimana, spotted Padma near a
    fire pit. Enchanted by her beauty, he attempted to capture her, but she disappeared
    into the fire again, eluding him.
  summary_hi: रावण, अपने पुष्पक विमान में यात्रा करते हुए, अग्निकुंड के पास पद्मा
    को देखा। उसकी सुंदरता से मोहित होकर, उसने उसे पकड़ने का प्रयास किया, लेकिन वह
    फिर से आग में गायब हो गई, जिससे वह उसे पकड़ नहीं सका।
- id: ravana-divine-gems-episode
  type: story
  keywords:
  - Ravana
  - divine gems
  source:
    book: Ananda Ramayan
    sarga: Sarga 3
  summary_en: Ravana discovers five divine gems and places them in a box. He takes
    the box to his city and instructs Mandodari to retrieve the gems from the temple.
    However, the box is too heavy to lift, and when Ravana opens it, he finds a radiant
    girl inside. Mandodari warns Ravana that the girl is dangerous and could lead
    to the destruction of their lineage.
  summary_hi: रावण पाँच दिव्य रत्नों की खोज करता है और उन्हें एक सन्दूक में रखता है।
    वह सन्दूक को अपनी नगरी ले जाता है और मंदोदरी को मंदिर से रत्न लाने के लिए कहता
    है। लेकिन सन्दूक बहुत भारी होता है और जब रावण उसे खोलता है, तो उसमें एक तेजस्वी
    कन्या मिलती है। मंदोदरी रावण को चेतावनी देती है कि यह कन्या खतरनाक है और उनके
    कुल का नाश कर सकती है।
- id: parashurama-confronts-rama
  type: event
  keywords:
  - Parashurama
  - Rama
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: Parashurama confronts Rama, challenging him to prove his prowess as
    a true Kshatriya by stringing the bow of Vishnu. Parashurama, known for his anger
    and strength, is initially hostile towards Rama, but upon realizing Rama's divine
    nature, he acknowledges him as an incarnation of Vishnu.
  summary_hi: परशुराम राम का सामना करते हैं और उन्हें विष्णु के धनुष को चढ़ाकर अपनी
    क्षत्रिय शक्ति साबित करने की चुनौती देते हैं। परशुराम, जो अपने क्रोध और शक्ति
    के लिए जाने जाते हैं, शुरू में राम के प्रति शत्रुतापूर्ण होते हैं, लेकिन राम की
    दिव्य प्रकृति को पहचानने पर, उन्हें विष्णु के अवतार के रूप में स्वीकार करते हैं।
- id: parashurama-confrontation-with-rama
  type: story
  keywords:
  - Parashurama
  - Rama
  source:
    book: Ananda Ramayan
    sarga: Sarga 3
  summary_en: In this episode, Parashurama confronts Rama, challenging him due to
    his Kshatriya lineage. Despite Parashurama's anger, Rama remains calm and respectful,
    ultimately demonstrating his divine nature. Parashurama recognizes Rama as an
    incarnation of Vishnu and acknowledges his own past actions and the prophecy of
    Rama's future deeds.
  summary_hi: इस प्रकरण में, परशुराम राम का सामना करते हैं और उनके क्षत्रिय वंश के
    कारण उन्हें चुनौती देते हैं। परशुराम के क्रोध के बावजूद, राम शांत और सम्मानजनक
    बने रहते हैं, अंततः अपनी दिव्य प्रकृति का प्रदर्शन करते हैं। परशुराम राम को विष्णु
    के अवतार के रूप में पहचानते हैं और अपने पिछले कार्यों और राम के भविष्य के कार्यों
    की भविष्यवाणी को स्वीकार करते हैं।
- id: parashurama-boon-from-rama
  type: story
  keywords:
  - Parashurama
  - Rama
  - boon
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: After being defeated by Rama, Parashurama is granted a boon by the pleased
    Lord Rama. Parashurama requests eternal devotion and the company of Rama's devotees.
    Rama grants this wish, and Parashurama departs after paying respects.
  summary_hi: राम द्वारा पराजित होने के बाद, प्रसन्न भगवान राम परशुराम को वरदान देते
    हैं। परशुराम शाश्वत भक्ति और राम के भक्तों की संगति की प्रार्थना करते हैं। राम
    इस इच्छा को पूरा करते हैं और परशुराम सम्मानपूर्वक विदा लेते हैं।
- id: dasharatha-return-to-ayodhya
  type: event
  keywords:
  - Dasharatha
  - Ayodhya
  - return
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: King Dasharatha returns to Ayodhya with joy, accompanied by music and
    dance. The city is decorated, and people celebrate his return. Dasharatha performs
    rituals and gives gifts, while the citizens and his family rejoice.
  summary_hi: राजा दशरथ अयोध्या लौटते हैं, उनके साथ संगीत और नृत्य होता है। शहर को
    सजाया जाता है और लोग उनके लौटने का उत्सव मनाते हैं। दशरथ अनुष्ठान करते हैं और
    उपहार देते हैं, जबकि नागरिक और उनका परिवार आनंदित होता है।
- id: rama-battle-with-kings
  type: event
  keywords:
  - Rama
  - battle
  - kings
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: In a fierce battle, Lord Rama uses his mighty bow and the Vayavyastra
    to defeat the attacking kings, scattering them like dry leaves to the seashore.
    He then uses the Mohanastra to render the remaining forces unconscious.
  summary_hi: एक भयंकर युद्ध में, भगवान राम अपने शक्तिशाली धनुष और वायव्यास्त्र का
    उपयोग करके आक्रमणकारी राजाओं को पराजित करते हैं, उन्हें सूखे पत्तों की तरह समुद्र
    तट पर बिखेर देते हैं। फिर वह मोहनास्त्र का उपयोग करके शेष सेना को मूर्छित कर देते
    हैं।
- id: lakshman-fetches-herbs
  type: event
  keywords:
  - Lakshman
  - herbs
  - Sanjeevani
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: Following Rama's instructions, Lakshman goes to the hermitage of the
    sage Mudgal to fetch the life-restoring Sanjeevani herbs. Despite initial resistance
    from the hermitage's students, he successfully retrieves the herbs and returns
    to revive Bharata.
  summary_hi: राम के निर्देशों का पालन करते हुए, लक्ष्मण ऋषि मुद्गल के आश्रम में जीवनदायिनी
    संजीवनी जड़ी-बूटियों को लाने जाते हैं। आश्रम के छात्रों के प्रारंभिक विरोध के
    बावजूद, वह सफलतापूर्वक जड़ी-बूटियों को प्राप्त करते हैं और भरत को पुनर्जीवित करने
    के लिए लौटते हैं।
- id: jalandhara-battle-episode
  type: story
  keywords:
  - Jalandhara
  - Vrinda
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The passage describes a story involving the demon Jalandhara, who was
    empowered by the devotion of his wife, Vrinda. Despite his strength, Jalandhara
    was ultimately defeated. Vrinda's devotion was so powerful that it initially protected
    Jalandhara from defeat.
  summary_hi: यह अंश जलंधर नामक राक्षस की कहानी का वर्णन करता है, जिसे उसकी पत्नी
    वृंदा की भक्ति से शक्ति प्राप्त हुई थी। अपनी शक्ति के बावजूद, जलंधर अंततः पराजित
    हो गया। वृंदा की भक्ति इतनी शक्तिशाली थी कि उसने प्रारंभ में जलंधर को पराजय से
    बचाया।
- id: vrinda-dream-episode
  type: story
  keywords:
  - Vrinda
  - Dream
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vrinda, the devoted wife of Jalandhara, experiences a troubling dream
    where she sees ominous signs. This dream foreshadows the impending doom of her
    husband, Jalandhara, despite her efforts to protect him through her devotion.
  summary_hi: जलंधर की पत्नी वृंदा एक चिंताजनक स्वप्न देखती है जिसमें वह अशुभ संकेत
    देखती है। यह स्वप्न उसके पति जलंधर के आसन्न विनाश की पूर्वसूचना देता है, भले ही
    वह अपनी भक्ति के माध्यम से उसे बचाने का प्रयास करती है।
- id: kalaha-salvation-story
  type: story
  keywords:
  - salvation
  - liberation
  source:
    book: Ananda Ramayan
    sarga: '5'
  summary_en: Kalaha, a spirit trapped in a ghostly form due to her sins, is liberated
    by the sage Dharmadatta. By sprinkling holy water and reciting a sacred mantra,
    Dharmadatta helps Kalaha attain a divine form and frees her from her ghostly existence.
    Grateful, Kalaha praises the sage for his compassion and requests further liberation
    from future births.
  summary_hi: कलहा, जो अपने पापों के कारण प्रेत योनि में फंसी हुई थी, ऋषि धर्मदत्त
    द्वारा मुक्त की जाती है। धर्मदत्त पवित्र जल छिड़ककर और एक पवित्र मंत्र का उच्चारण
    करके कलहा को दिव्य रूप प्रदान करते हैं और उसे प्रेत योनि से मुक्त करते हैं। कृतज्ञ
    होकर, कलहा ऋषि की करुणा की प्रशंसा करती है और भविष्य के जन्मों से भी मुक्ति की
    प्रार्थना करती है।
- id: rama-sita-joyful-years
  type: story
  keywords:
  - Rama
  - Sita
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: '63'
  summary_en: After their marriage, Rama and Sita spent twelve blissful years in Ayodhya,
    enjoying divine pleasures. During this time, the kingdom experienced prosperity
    and abundance, with no fear of drought or thieves.
  summary_hi: विवाह के बाद, राम और सीता ने अयोध्या में बारह आनंदमय वर्ष बिताए, दिव्य
    सुखों का आनंद लिया। इस दौरान, राज्य में समृद्धि और प्रचुरता थी, बिना किसी सूखे
    या चोरों के भय के।
- id: narada-visits-rama
  type: event
  keywords:
  - Narada
  - Rama
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: '63'
  summary_en: In the twelfth year of Rama and Sita's joyful life in Ayodhya, Narada
    Muni visited them from the sky. He conveyed a message from the gods, advising
    Rama to defeat Ravana before assuming the throne.
  summary_hi: अयोध्या में राम और सीता के आनंदमय जीवन के बारहवें वर्ष में, नारद मुनि
    आकाश मार्ग से उनके पास आए। उन्होंने देवताओं का संदेश दिया, जिसमें राम को रावण
    को हराने के बाद ही राज्याभिषेक करने की सलाह दी गई।
- id: kaikeyi-boon-episode
  type: story
  keywords:
  - Kaikeyi
  - boons
  - exile
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Kaikeyi, influenced by Manthara and divine intervention, decides to
    use the boons granted to her by King Dasharatha. She demands that her son Bharata
    be made king and that Rama be exiled to the forest for fourteen years. This decision
    leads to a significant turning point in the Ramayana.
  summary_hi: कैकेयी, मंथरा और देवताओं की प्रेरणा से प्रभावित होकर, राजा दशरथ द्वारा
    दिए गए वरदानों का उपयोग करने का निर्णय लेती है। वह मांग करती है कि उसका पुत्र
    भरत राजा बने और राम को चौदह वर्षों के लिए वनवास भेजा जाए। यह निर्णय रामायण में
    एक महत्वपूर्ण मोड़ लाता है।
- id: rama-accepts-exile
  type: story
  keywords:
  - Rama
  - exile
  - obedience
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Upon hearing Kaikeyi's demands, Rama accepts his exile to the forest
    without hesitation. He reassures his father, King Dasharatha, not to grieve and
    prepares to leave for the forest, demonstrating his obedience and commitment to
    dharma.
  summary_hi: कैकेयी की मांगों को सुनकर, राम बिना किसी हिचकिचाहट के अपने वनवास को
    स्वीकार करते हैं। वह अपने पिता, राजा दशरथ को दुखी न होने का आश्वासन देते हैं और
    धर्म के प्रति अपनी आज्ञाकारिता और प्रतिबद्धता को प्रदर्शित करते हुए वन के लिए
    प्रस्थान की तैयारी करते हैं।
- id: rama-exile-departure
  type: event
  keywords:
  - Rama
  - exile
  - departure
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Rama, after seeking blessings from his mother Kausalya and reassuring
    her, prepares to leave for the forest. He dons the ascetic attire given by Kaikeyi
    and teaches Sita to wear them as well. Despite the protests and sorrow of the
    citizens and family, Rama, accompanied by Sita and Lakshmana, departs for the
    forest in a chariot.
  summary_hi: राम, अपनी माता कौसल्या से आशीर्वाद लेकर और उन्हें आश्वस्त करके, वन जाने
    की तैयारी करते हैं। वे कैकेयी द्वारा दिए गए वल्कल वस्त्र धारण करते हैं और सीता
    को भी पहनना सिखाते हैं। नागरिकों और परिवार के विरोध और दुःख के बावजूद, राम, सीता
    और लक्ष्मण के साथ रथ में वन के लिए प्रस्थान करते हैं।
- id: vasistha-reprimands-kaikeyi
  type: event
  keywords:
  - Vasistha
  - Kaikeyi
  - reprimand
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Sage Vasistha, witnessing Kaikeyi's actions, reprimands her for her
    decision to send Rama to exile and questions her for giving Sita the ascetic attire.
    He criticizes her for her actions and questions her intentions.
  summary_hi: ऋषि वशिष्ठ, कैकेयी के कार्यों को देखकर, उन्हें राम को वनवास भेजने के
    निर्णय के लिए फटकारते हैं और सीता को वल्कल वस्त्र देने पर सवाल उठाते हैं। वे उनके
    कार्यों की आलोचना करते हैं और उनके इरादों पर प्रश्न उठाते हैं।
- id: rama-exile-episode
  type: story
  keywords:
  - Rama
  - exile
  source:
    book: Ananda Ramayan
    sarga: '1'
  summary_en: Rama, adhering to his father's command and to fulfill Kaikeyi's wishes,
    leaves for the forest. His brother Lakshmana, driven by affection, accompanies
    him. Sita, Rama's devoted wife, also follows him, demonstrating her unwavering
    loyalty.
  summary_hi: राम अपने पिता की आज्ञा का पालन करते हुए और कैकेयी की इच्छा पूरी करने
    के लिए वन को चले जाते हैं। उनके भाई लक्ष्मण स्नेहवश उनके साथ जाते हैं। राम की
    पत्नी सीता भी अपनी अटूट निष्ठा दिखाते हुए उनके साथ वन को जाती हैं।
- id: rama-at-bharadwaja-ashram
  type: story
  keywords:
  - Rama
  - Bharadwaja
  - ashram
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, Sita, and Lakshmana visit Bharadwaja's ashram, where they are
    warmly welcomed. They spend some time there before proceeding to the forest of
    Chitrakoot, where they build a beautiful hermitage and live peacefully.
  summary_hi: राम, सीता और लक्ष्मण भारद्वाज के आश्रम में जाते हैं, जहाँ उनका गर्मजोशी
    से स्वागत किया जाता है। वे वहाँ कुछ समय बिताते हैं और फिर चित्रकूट के वन की ओर
    बढ़ते हैं, जहाँ वे एक सुंदर पर्णकुटी बनाकर शांतिपूर्वक रहते हैं।
- id: jayanta-crow-episode
  type: story
  keywords:
  - Jayanta
  - crow
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: While Rama is resting with his head on Sita's lap, Jayanta, the son
    of Indra in the form of a crow, attempts to harm Sita. Rama, upon waking, uses
    a divine weapon to punish Jayanta by blinding one of his eyes, after which Jayanta
    seeks refuge with Rama.
  summary_hi: जब राम सीता की गोद में सिर रखकर आराम कर रहे होते हैं, इंद्र के पुत्र
    जयंत कौवे के रूप में सीता को नुकसान पहुँचाने की कोशिश करता है। राम जागने पर एक
    दिव्य अस्त्र का उपयोग करके जयंत को दंडित करते हैं और उसकी एक आँख फोड़ देते हैं,
    जिसके बाद जयंत राम की शरण में आता है।
- id: king-dasharatha-death
  type: event
  keywords:
  - Dasharatha
  - death
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Dasharatha, upon hearing the news of the events, passes away. His
    body is preserved in oil by Sage Vasishtha until Bharata and Shatrughna return.
  summary_hi: राजा दशरथ, घटनाओं की खबर सुनकर, प्राण त्याग देते हैं। उनके शरीर को वसिष्ठ
    ऋषि द्वारा तेल में संरक्षित किया जाता है जब तक कि भरत और शत्रुघ्न लौट नहीं आते।
- id: bharata-refuses-throne
  type: story
  keywords:
  - Bharata
  - throne
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Bharata, upon returning and learning of his mother's actions, refuses
    to accept the throne despite being urged by his mother and others. He instead
    decides to bring Rama back.
  summary_hi: भरत, लौटने पर और अपनी माँ के कार्यों के बारे में जानकर, सिंहासन स्वीकार
    करने से इनकार कर देते हैं, भले ही उनकी माँ और अन्य लोग उन्हें आग्रह करते हैं।
    इसके बजाय, वह राम को वापस लाने का निर्णय लेते हैं।
- id: bharata-meets-rama
  type: event
  keywords:
  - Bharata
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Bharata meets Rama at Chitrakoot and requests him to return and take
    the throne. Rama, however, refuses repeatedly, adhering to his vow.
  summary_hi: भरत चित्रकूट में राम से मिलते हैं और उनसे लौटकर सिंहासन ग्रहण करने का
    अनुरोध करते हैं। हालांकि, राम बार-बार इनकार करते हैं, अपनी प्रतिज्ञा का पालन करते
    हुए।
- id: bharata-ascetic-vow
  type: story
  keywords:
  - Bharata
  - asceticism
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Bharata, determined to bring Rama back, takes an ascetic vow and decides
    to live outside the city, serving Rama's sandals as a symbol of his rule.
  summary_hi: भरत, राम को वापस लाने के लिए दृढ़ संकल्पित होकर, एक तपस्वी व्रत लेते
    हैं और राम की खड़ाऊं की सेवा करते हुए शहर के बाहर रहने का निर्णय लेते हैं।
- id: bharata-receives-padukas
  type: story
  keywords:
  - Bharata
  - Padukas
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Bharata receives the divine sandals (Padukas) of Rama as a symbol of
    his authority to rule Ayodhya in Rama's absence. He places them on his head, feeling
    fulfilled, and returns to Ayodhya to govern from Nandigram, awaiting Rama's return.
  summary_hi: भरत राम की दिव्य पादुकाएँ प्राप्त करते हैं, जो राम की अनुपस्थिति में
    अयोध्या पर शासन करने का प्रतीक है। वे उन्हें अपने सिर पर रखते हैं, संतुष्ट महसूस
    करते हैं, और राम की वापसी की प्रतीक्षा करते हुए नंदीग्राम से शासन करने के लिए
    अयोध्या लौट जाते हैं।
- id: rama-and-sita-in-chitrakoot
  type: story
  keywords:
  - Rama
  - Sita
  - Chitrakoot
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama and Sita spend their time joyfully in the picturesque Chitrakoot
    mountains. Rama adorns Sita with sandalwood paste and flowers, and they enjoy
    the beauty of the forest together.
  summary_hi: राम और सीता चित्रकूट के सुंदर पर्वतों में आनंदपूर्वक समय बिताते हैं।
    राम सीता को चंदन और फूलों से सजाते हैं, और वे मिलकर वन की सुंदरता का आनंद लेते
    हैं।
- id: sita-meets-anasuya
  type: story
  keywords:
  - Sita
  - Anasuya
  source:
    book: Ananda Ramayan
    sarga: Sarga 6
  summary_en: Sita visits Anasuya, who warmly welcomes her and offers divine earrings
    and garments crafted by Vishwakarma. Anasuya blesses Sita, advising her to remain
    devoted to Rama and assures her of their safe return home.
  summary_hi: सीता अनसूया से मिलने जाती हैं, जो उनका गर्मजोशी से स्वागत करती हैं और
    विश्वकर्मा द्वारा निर्मित दिव्य कुंडल और वस्त्र प्रदान करती हैं। अनसूया सीता को
    आशीर्वाद देती हैं और उन्हें राम के प्रति समर्पित रहने की सलाह देती हैं और उनके
    सुरक्षित घर लौटने का आश्वासन देती हैं।
- id: rama-enters-dandakaranya
  type: event
  keywords:
  - Rama
  - Dandakaranya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama enters the great forest of Dandakaranya, where he encounters various
    sages and demons. He takes a vow to protect the sages from the demons.
  summary_hi: राम दंडकारण्य के महान जंगल में प्रवेश करते हैं, जहाँ वे विभिन्न ऋषियों
    और राक्षसों से मिलते हैं। वह ऋषियों को राक्षसों से बचाने की प्रतिज्ञा करते हैं।
- id: rama-encounter-with-viradha
  type: story
  keywords:
  - Rama
  - Viradha
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, along with Sita and Lakshmana, encounters the demon Viradha in
    the forest. Viradha threatens them, but Rama defeats him by cutting off his arms
    and legs. A divine being emerges from Viradha's body, revealing he was cursed
    by Sage Durvasa and is now liberated by Rama.
  summary_hi: राम, सीता और लक्ष्मण के साथ वन में राक्षस विराध से मिलते हैं। विराध
    उन्हें धमकाता है, लेकिन राम उसके हाथ और पैर काटकर उसे पराजित कर देते हैं। विराध
    के शरीर से एक दिव्य पुरुष प्रकट होता है, जो बताता है कि वह दुर्वासा ऋषि के शाप
    से ग्रस्त था और अब राम द्वारा मुक्त हो गया है।
- id: sarabhanga-muni-ascension
  type: story
  keywords:
  - Sarabhanga
  - Ascension
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After the encounter with Viradha, Rama, Sita, and Lakshmana visit the
    hermitage of Sage Sarabhanga. The sage honors them and then enters a funeral pyre,
    ascending to Vaikuntha in a divine form.
  summary_hi: विराध से मुठभेड़ के बाद, राम, सीता और लक्ष्मण शरभंग मुनि के आश्रम में
    जाते हैं। मुनि उनका सम्मान करते हैं और फिर चिता में प्रवेश कर दिव्य रूप में वैकुंठ
    धाम चले जाते हैं।
- id: rama-forest-exile
  type: story
  keywords:
  - Rama
  - exile
  - forest
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, along with Sita and Lakshmana, spends several years in the forest,
    visiting various hermitages and receiving hospitality from sages. During this
    time, Rama defeats many demons and enjoys the beauty of nature with Sita.
  summary_hi: राम, सीता और लक्ष्मण के साथ, वन में कई वर्ष बिताते हैं, विभिन्न आश्रमों
    का दौरा करते हैं और ऋषियों से आतिथ्य प्राप्त करते हैं। इस दौरान, राम कई राक्षसों
    को पराजित करते हैं और सीता के साथ प्रकृति की सुंदरता का आनंद लेते हैं।
- id: rama-meets-agastya
  type: story
  keywords:
  - Rama
  - Agastya
  - weapons
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama visits the hermitage of Sage Agastya, who honors him and gifts
    him divine weapons, including a bow and arrows given by Indra. Agastya praises
    Rama and provides him with guidance.
  summary_hi: राम, अगस्त्य ऋषि के आश्रम में जाते हैं, जो उनका सम्मान करते हैं और उन्हें
    इंद्र द्वारा दिए गए दिव्य शस्त्र, धनुष और बाण भेंट करते हैं। अगस्त्य राम की प्रशंसा
    करते हैं और उन्हें मार्गदर्शन प्रदान करते हैं।
- id: rama-at-panchavati
  type: story
  keywords:
  - Panchavati
  - Jatayu
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, Sita, and Lakshmana settle at Panchavati, where they build a hermitage.
    They meet Jatayu, the vulture king, who pledges to protect Sita. Rama spends peaceful
    years there, enjoying the company of Sita.
  summary_hi: राम, सीता और लक्ष्मण पंचवटी में बसते हैं, जहां वे एक आश्रम बनाते हैं।
    वे जटायु, गिद्धराज से मिलते हैं, जो सीता की रक्षा करने का वचन देते हैं। राम वहां
    शांतिपूर्ण वर्ष बिताते हैं, सीता के साथ समय का आनंद लेते हुए।
- id: surpanakha-encounter
  type: story
  keywords:
  - Surpanakha
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Surpanakha, the demoness, encounters Rama, Lakshmana, and Sita in Panchavati.
    She is infuriated by the death of her son Sambha and attempts to seduce Rama.
    When rejected, she tries to attack Sita, but Lakshmana intervenes and disfigures
    her by cutting off her nose, ears, and breasts.
  summary_hi: सूपर्णखा राक्षसी पंचवटी में राम, लक्ष्मण और सीता से मिलती है। अपने पुत्र
    साम्ब के मारे जाने से क्रोधित होकर वह राम को रिझाने का प्रयास करती है। अस्वीकार
    किए जाने पर वह सीता पर हमला करने की कोशिश करती है, लेकिन लक्ष्मण हस्तक्षेप करते
    हैं और उसकी नाक, कान और स्तनों को काटकर उसे विकृत कर देते हैं।
- id: rama-battle-with-khara-and-dushana
  type: story
  keywords:
  - Rama
  - Khara
  - Dushana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama engages in a fierce battle with the demon brothers Khara and Dushana,
    along with their army of fourteen thousand rakshasas. Using his divine powers,
    Rama creates fourteen thousand forms of himself and defeats the demons, sending
    them to their respective realms.
  summary_hi: राम खर और दूषण राक्षस भाइयों और उनकी चौदह हजार राक्षसों की सेना के साथ
    एक भयंकर युद्ध में संलग्न होते हैं। अपनी दिव्य शक्तियों का उपयोग करते हुए, राम
    अपने चौदह हजार रूप बनाते हैं और राक्षसों को पराजित कर उन्हें उनके लोक भेज देते
    हैं।
- id: sita-transformation-instructions
  type: story
  keywords:
  - Sita
  - Transformation
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: 'Rama instructs Sita to assume three forms: one as a shadow to stay
    with him, another as a form of rajas to reside in fire, and the third as a tamasic
    form to enchant Ravana. Sita follows Rama''s instructions to protect herself from
    Ravana''s advances.'
  summary_hi: 'राम सीता को तीन रूप धारण करने का निर्देश देते हैं: एक छाया के रूप में
    उनके साथ रहने के लिए, दूसरा रजस रूप में अग्नि में निवास करने के लिए, और तीसरा
    तमसिक रूप में रावण को मोहित करने के लिए। सीता रावण से अपनी रक्षा के लिए राम के
    निर्देशों का पालन करती हैं।'
- id: shurpanakha-complains-to-ravana
  type: story
  keywords:
  - Shurpanakha
  - Ravana
  - Complaint
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After witnessing the defeat of Khara and Dushana, Shurpanakha goes to
    Lanka and complains to Ravana about the destruction caused by Rama. She incites
    Ravana by describing Sita's beauty and suggests abducting her.
  summary_hi: खर और दूषण की हार देखने के बाद, शूर्पणखा लंका जाती है और रावण से राम
    द्वारा किए गए विनाश की शिकायत करती है। वह सीता की सुंदरता का वर्णन करके रावण को
    उकसाती है और उसे अपहरण करने का सुझाव देती है।
- id: ravana-maricha-plan
  type: story
  keywords:
  - Ravana
  - Maricha
  - Sita-abduction
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana devises a plan to abduct Sita by enlisting the help of Maricha.
    Maricha is initially reluctant, recalling how Rama had previously defeated him.
    However, Ravana persuades him by promising a share of his kingdom. Maricha agrees
    to transform into a golden deer to lure Rama and Lakshmana away from Sita.
  summary_hi: रावण सीता का हरण करने की योजना बनाता है और मारीच की मदद लेता है। मारीच
    पहले तो हिचकिचाता है, क्योंकि उसे याद है कि राम ने पहले उसे पराजित किया था। लेकिन
    रावण उसे अपने राज्य का हिस्सा देने का वादा करके मना लेता है। मारीच स्वर्ण मृग
    बनकर राम और लक्ष्मण को सीता से दूर ले जाने के लिए तैयार हो जाता है।
- id: sita-abduction-by-ravana
  type: event
  keywords:
  - Sita
  - Ravana
  - abduction
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Ravana abducts Sita, leading to a series of events
    where Rama and Lakshmana search for her. The abduction is witnessed by the vulture
    Jatayu, who informs Rama about it before dying.
  summary_hi: इस प्रकरण में रावण सीता का अपहरण करता है, जिससे राम और लक्ष्मण उसे खोजने
    के लिए निकल पड़ते हैं। इस अपहरण को गिद्ध जटायु देखता है, जो मरने से पहले राम को
    इसकी सूचना देता है।
- id: jatayu-battle-with-ravana
  type: story
  keywords:
  - Jatayu
  - Ravana
  - battle
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Jatayu, the king of birds, engages in a fierce battle with Ravana to
    rescue Sita. Despite his valiant efforts, Jatayu is gravely injured and falls
    to the ground, allowing Ravana to continue his journey with Sita.
  summary_hi: जटायु, पक्षियों के राजा, सीता को बचाने के लिए रावण के साथ एक भयंकर युद्ध
    में संलग्न होते हैं। अपनी वीरता के बावजूद, जटायु गंभीर रूप से घायल हो जाते हैं
    और जमीन पर गिर जाते हैं, जिससे रावण सीता के साथ अपनी यात्रा जारी रखता है।
- id: sita-drops-jewels
  type: story
  keywords:
  - Sita
  - jewels
  - Sugriva
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: As Ravana abducts Sita and flies over the sky, Sita spots Sugriva and
    other vanaras on a mountain peak. She tears her sari and drops her jewels wrapped
    in it, hoping they will reach Rama.
  summary_hi: जब रावण सीता का अपहरण कर आकाश में उड़ता है, सीता एक पर्वत शिखर पर सुग्रीव
    और अन्य वानरों को देखती हैं। वह अपनी साड़ी फाड़कर उसमें अपने गहने लपेटकर गिरा
    देती हैं, उम्मीद करती हैं कि वे राम तक पहुँचेंगे।
- id: sita-in-ashok-vatika
  type: story
  keywords:
  - Sita
  - Ashok Vatika
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Ravana takes Sita to Ashok Vatika in Lanka and tries to win her over
    with sweet words, but Sita remains steadfast and refuses to comply. Ravana assigns
    demons to guard her.
  summary_hi: रावण सीता को लंका की अशोक वाटिका में ले जाता है और मीठे शब्दों से उसे
    मनाने की कोशिश करता है, लेकिन सीता दृढ़ रहती हैं और मानने से इनकार करती हैं। रावण
    उसकी रक्षा के लिए राक्षसों को नियुक्त करता है।
- id: indra-gives-sita-food
  type: story
  keywords:
  - Indra
  - Sita
  - food
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Indra, on Brahma's advice, provides Sita with celestial food to sustain
    her during her captivity. Sita shares some of it with the gods, birds, and Trijata,
    and keeps a portion for Rama and Lakshmana.
  summary_hi: ब्रह्मा की सलाह पर इंद्र सीता को उसके बंदी जीवन के दौरान जीवित रहने
    के लिए दिव्य भोजन प्रदान करते हैं। सीता इसका कुछ हिस्सा देवताओं, पक्षियों और त्रिजटा
    के साथ साझा करती हैं और राम और लक्ष्मण के लिए एक हिस्सा रखती हैं।
- id: demons-sent-to-kill-rama
  type: story
  keywords:
  - Ravana
  - demons
  - Rama
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Ravana sends sixteen demons to kill Rama, but they are all defeated
    by Kabandha on their way. This highlights the ongoing divine protection over Rama.
  summary_hi: रावण राम को मारने के लिए सोलह राक्षसों को भेजता है, लेकिन वे सभी रास्ते
    में कबन्ध द्वारा पराजित हो जाते हैं। यह राम पर चल रही दिव्य सुरक्षा को उजागर करता
    है।
- id: jatayu-sacrifice
  type: character
  keywords:
  - Jatayu
  - Sacrifice
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Jatayu, the vulture king, attempts to rescue Sita from Ravana but is
    mortally wounded in the process. Before dying, he informs Rama about Sita's abduction.
  summary_hi: गिद्धराज जटायु सीता को रावण से बचाने का प्रयास करते हैं लेकिन इस प्रक्रिया
    में घातक रूप से घायल हो जाते हैं। मरने से पहले, वह राम को सीता के अपहरण के बारे
    में सूचित करते हैं।
- id: rama-searches-for-sita
  type: event
  keywords:
  - Rama
  - Sita
  - search
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, deeply distressed by Sita's abduction, searches the forest for
    her. He questions the animals and trees, seeking any clue about her whereabouts,
    demonstrating his deep love and desperation.
  summary_hi: राम, सीता के अपहरण से अत्यंत व्यथित होकर, वन में उसकी खोज करते हैं।
    वह जानवरों और पेड़ों से उसके ठिकाने के बारे में कोई सुराग पूछते हैं, जो उनके गहरे
    प्रेम और निराशा को दर्शाता है।
- id: sita-illusion-episode
  type: story
  keywords:
  - Sita
  - illusion
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the forest, an illusion of Sita approaches Rama, inviting him to
    play with her. Rama, aware of the illusion, questions the entity's true identity.
    Upon realizing her mistake, the entity apologizes and returns to her original
    form.
  summary_hi: वन में सीता का एक माया रूप राम के पास आता है और उन्हें उसके साथ खेलने
    के लिए आमंत्रित करता है। राम, जो इस माया से अवगत हैं, उस इकाई की वास्तविक पहचान
    पूछते हैं। अपनी गलती का एहसास होने पर, वह इकाई माफी मांगती है और अपने मूल रूप
    में लौट जाती है।
- id: kabandha-liberation-episode
  type: story
  keywords:
  - Kabandha
  - liberation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama and Lakshmana encounter the demon Kabandha, who captures them with
    his long arms. After cutting off his arms, Kabandha reveals his true form as a
    cursed celestial being and explains that he will be liberated from his curse by
    Rama and Lakshmana.
  summary_hi: राम और लक्ष्मण राक्षस कबंध से मिलते हैं, जो उन्हें अपनी लंबी भुजाओं
    से पकड़ लेता है। उनकी भुजाओं को काटने के बाद, कबंध अपने वास्तविक रूप में प्रकट
    होता है और बताता है कि वह एक शापित दिव्य प्राणी है और राम और लक्ष्मण द्वारा उसके
    शाप से मुक्त होगा।
- id: shabari-meeting-rama
  type: story
  keywords:
  - Shabari
  - Rama
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Rama, accompanied by Lakshmana, visits Shabari, who welcomes them with
    offerings of fruits and flowers. Shabari directs Rama to seek Sugriva's help to
    find Sita and then ascends to heaven after meeting Rama.
  summary_hi: राम, लक्ष्मण के साथ शबरी के पास जाते हैं, जो उन्हें फलों और फूलों से
    स्वागत करती हैं। शबरी राम को सुग्रीव की सहायता से सीता को खोजने का निर्देश देती
    हैं और राम से मिलने के बाद स्वर्ग को चली जाती हैं।
- id: rama-sugriva-alliance
  type: story
  keywords:
  - Rama
  - Sugriva
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Rama and Lakshmana reach the Rishyamuka mountain where Sugriva, along
    with his ministers, spots them. Sugriva, fearing they are sent by his brother
    Bali, discusses with his ministers before approaching them.
  summary_hi: राम और लक्ष्मण ऋष्यमूक पर्वत पर पहुँचते हैं जहाँ सुग्रीव अपने मंत्रियों
    के साथ उन्हें देखता है। सुग्रीव, यह सोचकर कि उन्हें उसके भाई बाली ने भेजा है,
    अपने मंत्रियों के साथ चर्चा करता है।
- id: hanuman-meets-rama-and-lakshmana
  type: story
  keywords:
  - Hanuman
  - Rama
  - Lakshmana
  source:
    book: Ananda Ramayan
    sarga: Sarga 8
  summary_en: Hanuman, disguised as a Brahmin, approaches Rama and Lakshmana to understand
    their intentions. After learning they seek friendship with Sugriva, Hanuman reveals
    his true form and offers to take them to Sugriva. They ride on Hanuman's shoulders
    to the mountain where Sugriva resides.
  summary_hi: हनुमान ब्राह्मण के रूप में राम और लक्ष्मण के पास जाते हैं ताकि उनके
    इरादों को समझ सकें। जब उन्हें पता चलता है कि वे सुग्रीव से मित्रता करना चाहते
    हैं, तो हनुमान अपना असली रूप प्रकट करते हैं और उन्हें सुग्रीव के पास ले जाने का
    प्रस्ताव देते हैं। वे हनुमान के कंधों पर सवार होकर उस पर्वत पर जाते हैं जहाँ सुग्रीव
    रहता है।
- id: sugreeva-rama-friendship
  type: story
  keywords:
  - Sugriva
  - Rama
  - Friendship
  source:
    book: Ananda Ramayan
    sarga: Sarga 8
  summary_en: Sugriva, after hearing from Hanuman about Rama and Lakshmana, lights
    a fire and makes a pact of friendship with Rama, witnessed by the fire. They embrace
    each other, and Sugriva provides a resting place for Rama and Lakshmana.
  summary_hi: हनुमान से राम और लक्ष्मण के बारे में सुनकर सुग्रीव अग्नि जलाकर राम के
    साथ मित्रता का संकल्प करता है, जिसे अग्नि साक्षी मानती है। वे एक-दूसरे को गले
    लगाते हैं और सुग्रीव राम और लक्ष्मण के लिए विश्राम स्थल प्रदान करता है।
- id: sugreeva-vali-conflict
  type: story
  keywords:
  - Sugriva
  - Vali
  - Conflict
  source:
    book: Ananda Ramayan
    sarga: Sarga 8
  summary_en: Sugriva recounts to Rama how Vali wronged him. Once, a demon named Mayavi
    challenged Vali, and Vali pursued him into a cave. Vali instructed Sugriva to
    wait outside, but after a month without Vali's return, Sugriva assumed Vali was
    dead.
  summary_hi: सुग्रीव राम को बताता है कि कैसे वाली ने उसके साथ अन्याय किया। एक बार,
    मायावी नामक राक्षस ने वाली को ललकारा, और वाली उसका पीछा करते हुए एक गुफा में चला
    गया। वाली ने सुग्रीव को बाहर इंतजार करने को कहा, लेकिन एक महीने बाद भी वाली के
    न लौटने पर सुग्रीव ने समझा कि वाली मर गया है।
- id: vali-sugriva-conflict
  type: story
  keywords:
  - Vali
  - Sugriva
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Vali, filled with arrogance, expelled Sugriva from the kingdom and declared
    that anyone who shelters Sugriva would be considered his enemy. Sugriva took refuge
    at Rishyamukha mountain, where he was safe from Vali due to a curse on Vali.
  summary_hi: वालि ने अहंकार में भरकर सुग्रीव को राज्य से निष्कासित कर दिया और घोषणा
    की कि जो भी सुग्रीव को शरण देगा, वह उसका शत्रु माना जाएगा। सुग्रीव ने ऋष्यमूक
    पर्वत पर शरण ली, जहाँ वालि के श्राप के कारण वह सुरक्षित था।
- id: dundubhi-demon-story
  type: story
  keywords:
  - Dundubhi
  - Vali
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: The demon Dundubhi, in the form of a buffalo, challenged Vali to a fight.
    Vali defeated Dundubhi by tearing off his head and throwing it far away, which
    landed in the hermitage of the sage Matanga, leading to a curse on Vali.
  summary_hi: दुंदुभि नामक राक्षस ने भैंसे का रूप धारण कर वालि को युद्ध के लिए ललकारा।
    वालि ने दुंदुभि को हराकर उसका सिर उखाड़कर दूर फेंक दिया, जो मतंग ऋषि के आश्रम
    में जा गिरा, जिससे वालि पर श्राप लग गया।
- id: sita-jewels-identification
  type: story
  keywords:
  - Sita
  - Jewels
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Sugriva showed Rama the jewels that Sita had dropped while being abducted
    by Ravana. Lakshmana identified the anklets as belonging to Sita, as he had only
    seen her feet while offering respects.
  summary_hi: सुग्रीव ने राम को वे आभूषण दिखाए जो सीता ने रावण द्वारा अपहरण के समय
    गिराए थे। लक्ष्मण ने उन पायल को सीता का बताया, क्योंकि उन्होंने प्रणाम करते समय
    केवल उनके पैर देखे थे।
- id: vali-death-episode
  type: story
  keywords:
  - Vali
  - Rama
  - Sugriva
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vali, mortally wounded in battle, requests Rama to protect Angada and
    reveals that he would have helped find Sita if Rama had approached him earlier.
    After speaking these words, Vali passes away. Rama then instructs Angada to perform
    Vali's last rites.
  summary_hi: वालि, युद्ध में घातक रूप से घायल होकर, राम से अंगद की रक्षा करने का
    अनुरोध करता है और बताता है कि यदि राम पहले उसके पास आते तो वह सीता को खोजने में
    मदद करता। ये शब्द कहने के बाद, वालि की मृत्यु हो जाती है। राम फिर अंगद को वालि
    के अंतिम संस्कार करने का निर्देश देते हैं।
- id: sugriva-coronation-episode
  type: event
  keywords:
  - Sugriva
  - Rama
  - Coronation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After Vali's death, Rama instructs Lakshmana to crown Sugriva as the
    king of Kishkindha. Sugriva is then established as the ruler, and Rama plans to
    spend the monsoon season in a cave on a beautiful mountain.
  summary_hi: वालि की मृत्यु के बाद, राम लक्ष्मण को सुग्रीव को किष्किंधा का राजा बनाने
    का निर्देश देते हैं। सुग्रीव को फिर शासक के रूप में स्थापित किया जाता है, और राम
    मानसून के मौसम को एक सुंदर पर्वत की गुफा में बिताने की योजना बनाते हैं।
- id: lakshmana-anger-episode
  type: story
  keywords:
  - Lakshmana
  - Sugriva
  - Anger
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lakshmana, angered by Sugriva's negligence in helping Rama, goes to
    Kishkindha to remind Sugriva of his promise. Hanuman intervenes to calm Lakshmana,
    and Tara persuades Lakshmana to forgive Sugriva, who then promises to gather the
    monkey army for Rama's cause.
  summary_hi: लक्ष्मण, सुग्रीव की राम की मदद में लापरवाही से क्रोधित होकर, सुग्रीव
    को उसके वादे की याद दिलाने के लिए किष्किंधा जाते हैं। हनुमान लक्ष्मण को शांत करने
    के लिए हस्तक्षेप करते हैं, और तारा लक्ष्मण को सुग्रीव को माफ करने के लिए मनाती
    है, जो फिर राम के उद्देश्य के लिए वानर सेना को इकट्ठा करने का वादा करता है।
- id: hanuman-mission-to-lanka
  type: story
  keywords:
  - Hanuman
  - Lanka
  - Sita
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman is entrusted with the mission to find Sita in Lanka. Rama gives
    Hanuman his ring as a token to show Sita, ensuring her trust. Hanuman, along with
    other monkeys, sets out towards the south to locate Sita within a month.
  summary_hi: हनुमान को लंका में सीता को खोजने का कार्य सौंपा जाता है। राम हनुमान
    को अपनी अंगूठी देते हैं ताकि वह सीता को दिखा सके और उसका विश्वास जीत सके। हनुमान
    अन्य वानरों के साथ दक्षिण दिशा की ओर सीता को एक महीने के भीतर खोजने के लिए निकलते
    हैं।
- id: monkeys-search-for-sita
  type: story
  keywords:
  - Monkeys
  - Search
  - Sita
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The monkeys, led by Sugriva, spread out in different directions to search
    for Sita. They encounter various challenges, including thirst and darkness, as
    they explore caves and forests in their quest.
  summary_hi: सुग्रीव के नेतृत्व में वानर विभिन्न दिशाओं में सीता की खोज में निकलते
    हैं। वे अपनी खोज के दौरान प्यास और अंधकार जैसी विभिन्न चुनौतियों का सामना करते
    हैं, जब वे गुफाओं और जंगलों में खोज करते हैं।
- id: hema-daughter-of-vishwakarma
  type: character
  keywords:
  - Hema
  - Vishwakarma
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hema, the daughter of Vishwakarma, pleased Lord Shiva with her dance
    and song. As a result, she was given a significant boon by Shiva. She was instructed
    to wait for the arrival of Rama and perform his worship.
  summary_hi: हेमा, जो विश्वकर्मा की पुत्री थी, ने महादेव को अपने नृत्य और गान से
    प्रसन्न किया। इसके फलस्वरूप, महादेव ने उसे एक बड़ा वरदान दिया। उसे राम के आगमन
    की प्रतीक्षा करने और उनकी पूजा करने का निर्देश दिया गया।
- id: sampati-and-jatayu-story
  type: story
  keywords:
  - Sampati
  - Jatayu
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sampati, the brother of Jatayu, recounts how he lost his wings while
    trying to protect Jatayu from the sun's heat. Jatayu had flown too close to the
    sun, and Sampati shielded him with his wings, which were burnt in the process.
  summary_hi: संपाती, जो जटायु का भाई था, बताता है कि उसने अपने पंख कैसे खो दिए जब
    वह जटायु को सूर्य की गर्मी से बचाने की कोशिश कर रहा था। जटायु सूर्य के बहुत करीब
    उड़ गया था, और संपाती ने उसे अपने पंखों से ढक लिया, जिससे उसके पंख जल गए।
- id: hanuman-flight-to-lanka
  type: story
  keywords:
  - Hanuman
  - Lanka
  - flight
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Hanuman, after being encouraged by Jambavan, prepares to leap across
    the ocean to reach Lanka. He recalls his divine powers and takes a giant leap,
    overcoming various obstacles on his way to fulfill Lord Rama's mission.
  summary_hi: हनुमान, जाम्बवान द्वारा प्रोत्साहित होकर, लंका पहुंचने के लिए समुद्र
    को पार करने की तैयारी करते हैं। वह अपनी दिव्य शक्तियों को याद करते हैं और भगवान
    राम के मिशन को पूरा करने के लिए विशाल छलांग लगाते हैं, अपने रास्ते में आने वाली
    विभिन्न बाधाओं को पार करते हुए।
- id: hanuman-and-mainaka
  type: story
  keywords:
  - Hanuman
  - Mainaka
  - rest
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: During his flight to Lanka, Hanuman is offered rest by the mountain
    Mainaka, who rises from the ocean to provide him a place to rest. However, Hanuman
    politely declines, stating that he cannot rest until he completes Lord Rama's
    task.
  summary_hi: लंका की यात्रा के दौरान, हनुमान को समुद्र से उठे पर्वत मैनाक द्वारा
    विश्राम की पेशकश की जाती है। हालांकि, हनुमान विनम्रता से मना कर देते हैं, यह कहते
    हुए कि वह भगवान राम का कार्य पूरा किए बिना विश्राम नहीं कर सकते।
- id: hanuman-and-simika
  type: story
  keywords:
  - Hanuman
  - Simika
  - obstacle
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: As Hanuman flies towards Lanka, he encounters the demoness Simika, who
    tries to capture him by grabbing his shadow. Hanuman realizes the threat and swiftly
    defeats Simika, continuing his journey without delay.
  summary_hi: जब हनुमान लंका की ओर उड़ते हैं, तो उन्हें राक्षसी सिमिका मिलती है, जो
    उनकी छाया पकड़कर उन्हें रोकने की कोशिश करती है। हनुमान खतरे को समझते हैं और जल्दी
    से सिमिका को पराजित कर अपनी यात्रा जारी रखते हैं।
- id: hanuman-enters-lanka
  type: story
  keywords:
  - Hanuman
  - Lanka
  - entry
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Upon reaching Lanka, Hanuman encounters the demoness Lankini at the
    entrance. After a brief confrontation, he defeats her and enters the city to search
    for Sita, fulfilling his mission to gather information for Lord Rama.
  summary_hi: लंका पहुंचने पर, हनुमान को प्रवेश द्वार पर राक्षसी लंकिनी मिलती है।
    एक संक्षिप्त संघर्ष के बाद, वह उसे पराजित करते हैं और सीता की खोज में शहर में
    प्रवेश करते हैं, भगवान राम के लिए जानकारी इकट्ठा करने के अपने मिशन को पूरा करते
    हुए।
- id: hanuman-and-mainaka-episode
  type: story
  keywords:
  - Hanuman
  - Mainaka
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: As Hanuman flies over the ocean, Mainaka Mountain rises to offer him
    rest and fruits. Mainaka, who was saved by King Dasharatha in the past, wishes
    to repay the favor by aiding Hanuman in his mission for Lord Rama. Hanuman politely
    declines, stating that he cannot rest until his task is complete.
  summary_hi: जब हनुमान समुद्र के ऊपर से उड़ रहे थे, मैनाक पर्वत उन्हें विश्राम और
    फल देने के लिए उठ खड़ा हुआ। मैनाक, जिसे राजा दशरथ ने पहले बचाया था, हनुमान की
    सहायता करके अपना ऋण चुकाना चाहता है। हनुमान विनम्रता से मना कर देते हैं, यह कहते
    हुए कि वह अपने कार्य के पूरा होने तक विश्राम नहीं कर सकते।
- id: hanuman-and-simhika-episode
  type: story
  keywords:
  - Hanuman
  - Simhika
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: While flying, Hanuman is caught by Simhika, a demoness who captures
    shadows of flying beings. Realizing the obstruction in his mission, Hanuman enters
    her mouth, tears her intestines, and kills her, continuing his journey.
  summary_hi: उड़ते समय, हनुमान को सिंहिका नामक राक्षसी पकड़ लेती है, जो उड़ते हुए
    प्राणियों की छाया पकड़ती है। अपने कार्य में बाधा को महसूस करते हुए, हनुमान उसके
    मुख में प्रवेश करते हैं, उसकी आंतें फाड़ देते हैं और उसे मार डालते हैं, और अपनी
    यात्रा जारी रखते हैं।
- id: hanuman-in-lanka-episode
  type: story
  keywords:
  - Hanuman
  - Lanka
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Hanuman reaches Lanka and searches for Sita. He encounters various demons
    and finally finds Sita in Ashoka Vatika. He reassures her of Rama's plan to rescue
    her and prepares to return with the news.
  summary_hi: हनुमान लंका पहुँचते हैं और सीता की खोज करते हैं। वह विभिन्न राक्षसों
    से मिलते हैं और अंततः अशोक वाटिका में सीता को पाते हैं। वह उन्हें राम की योजना
    के बारे में आश्वस्त करते हैं और समाचार के साथ लौटने की तैयारी करते हैं।
- id: ravana-deceit-by-vishnu
  type: story
  keywords:
  - Ravana
  - Vishnu
  - deception
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Vishnu disguises himself as a Brahmin to deceive Ravana.
    Ravana is tricked into believing that the real Parvati is hidden in the underworld,
    while he has been given a fake. Vishnu's deception leads Ravana to leave the fake
    Parvati behind.
  summary_hi: इस प्रकरण में, विष्णु ब्राह्मण का रूप धारण कर रावण को धोखा देते हैं।
    रावण को यह विश्वास दिलाया जाता है कि असली पार्वती पाताल में छिपी हुई है, जबकि
    उसे नकली पार्वती दी गई है। विष्णु की चालाकी से रावण नकली पार्वती को छोड़ देता
    है।
- id: sita-contemplates-suicide
  type: story
  keywords:
  - Sita
  - Suicide
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Sita, in her despair, contemplates ending her life due to the torment
    she faces in Lanka. She reflects on her past actions and considers them as the
    cause of her current suffering.
  summary_hi: सीता अपने दुख में लंका में झेल रही यातनाओं के कारण अपने जीवन को समाप्त
    करने का विचार करती हैं। वह अपने पिछले कार्यों पर विचार करती हैं और उन्हें अपनी
    वर्तमान पीड़ा का कारण मानती हैं।
- id: vibhishana-advises-rakshasis
  type: story
  keywords:
  - Vibhishana
  - Rakshasis
  - Sita
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Vibhishana advises the Rakshasis not to torment Sita and to treat her
    with respect. He shares his dream where he saw Rama defeating Ravana, suggesting
    that Sita should be served and protected.
  summary_hi: विभीषण राक्षसियों को सीता को परेशान न करने और उनका सम्मान करने की सलाह
    देते हैं। वह अपने स्वप्न को साझा करते हैं जिसमें उन्होंने राम को रावण को हराते
    हुए देखा, यह सुझाव देते हुए कि सीता की सेवा और सुरक्षा की जानी चाहिए।
- id: hanuman-reassures-sita
  type: story
  keywords:
  - Hanuman
  - Sita
  - reassurance
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman reassures Sita by showing her the ring given by Rama as a token
    of identification. He narrates the story of how he received it and assures her
    of Rama's intention to rescue her. Sita is comforted by Hanuman's words and the
    sight of the ring.
  summary_hi: हनुमान सीता को राम द्वारा दी गई अंगूठी दिखाकर आश्वस्त करते हैं। वह बताते
    हैं कि उन्हें यह अंगूठी कैसे मिली और राम के उन्हें बचाने के इरादे के बारे में
    बताते हैं। हनुमान के शब्दों और अंगूठी को देखकर सीता को सांत्वना मिलती है।
- id: hanuman-plucks-fruits
  type: story
  keywords:
  - Hanuman
  - fruits
  - forest
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman, feeling hungry, decides to pluck fruits from the trees in the
    forest. Despite Sita's warning about Ravana's control over the forest, Hanuman
    uses his strength to shake the trees and gather fruits. He eats the fruits quickly,
    demonstrating his power and determination.
  summary_hi: हनुमान, भूख लगने पर, जंगल के पेड़ों से फल तोड़ने का निर्णय लेते हैं।
    सीता की रावण के नियंत्रण की चेतावनी के बावजूद, हनुमान अपनी शक्ति का उपयोग करके
    पेड़ों को हिलाते हैं और फल इकट्ठा करते हैं। वह जल्दी से फल खा लेते हैं, अपनी शक्ति
    और दृढ़ संकल्प को दर्शाते हुए।
- id: hanuman-battle-with-rakshasas
  type: story
  keywords:
  - Hanuman
  - Rakshasas
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Hanuman, with great strength, battles the Rakshasas and their commanders.
    Using a palm tree as a weapon, he defeats Jambumali and other Rakshasa leaders.
    Ravana, upon hearing of their defeat, sends more commanders, but Hanuman overpowers
    them as well.
  summary_hi: हनुमान अपनी महान शक्ति से राक्षसों और उनके सेनापतियों से युद्ध करते
    हैं। एक ताड़ के वृक्ष का उपयोग करके, वे जम्बुमाली और अन्य राक्षस नेताओं को पराजित
    करते हैं। रावण, उनकी हार सुनकर, और अधिक सेनापतियों को भेजता है, लेकिन हनुमान उन्हें
    भी परास्त कर देते हैं।
- id: hanuman-captured-by-meghanada
  type: story
  keywords:
  - Hanuman
  - Meghanada
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Meghanada, son of Ravana, captures Hanuman using the Brahmastra. Despite
    his capture, Hanuman remains defiant and is brought before Ravana. Hanuman uses
    this opportunity to counsel Ravana, urging him to surrender to Lord Rama.
  summary_hi: रावण के पुत्र मेघनाद, ब्रह्मास्त्र का उपयोग करके हनुमान को पकड़ लेते
    हैं। अपनी गिरफ्तारी के बावजूद, हनुमान अवज्ञाकारी रहते हैं और उन्हें रावण के सामने
    लाया जाता है। हनुमान इस अवसर का उपयोग रावण को सलाह देने के लिए करते हैं, उन्हें
    भगवान राम के सामने आत्मसमर्पण करने का आग्रह करते हैं।
- id: hanuman-tale-of-strength
  type: story
  keywords:
  - Hanuman
  - Ravana
  - strength
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: In this episode, Hanuman demonstrates his immense strength and resilience.
    Despite Ravana's orders to cut off Hanuman's tail, the weapons used by the demons
    shatter upon contact, leaving Hanuman unharmed. This display of power astonishes
    Ravana and his followers.
  summary_hi: इस प्रकरण में, हनुमान अपनी अपार शक्ति और सहनशीलता का प्रदर्शन करते हैं।
    रावण के आदेश पर हनुमान की पूंछ काटने के प्रयास में राक्षसों के हथियार टकराकर टूट
    जाते हैं, लेकिन हनुमान को कोई नुकसान नहीं होता। इस शक्ति प्रदर्शन से रावण और उसके
    अनुयायी चकित रह जाते हैं।
- id: ravana-boastful-speech
  type: story
  keywords:
  - Ravana
  - boast
  - gods
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Ravana boasts about his conquests and the subjugation of various gods.
    He claims to have defeated many deities and made them serve him in menial roles.
    This speech is intended to intimidate Hanuman and demonstrate Ravana's power.
  summary_hi: रावण अपने विजय और विभिन्न देवताओं के अधीन करने की बात करता है। वह दावा
    करता है कि उसने कई देवताओं को हराया है और उन्हें तुच्छ भूमिकाओं में सेवा करने
    के लिए मजबूर किया है। यह भाषण हनुमान को डराने और रावण की शक्ति दिखाने के लिए दिया
    गया है।
- id: hanuman-tail-burning-episode
  type: story
  keywords:
  - Hanuman
  - Ravana
  - Lanka
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: In this episode, Hanuman is captured by Ravana's forces in Lanka. Ravana
    orders his servants to set Hanuman's tail on fire as a display of power. Despite
    their efforts, the fire does not ignite until Ravana himself attempts to blow
    on it, resulting in his own hair and beard catching fire instead.
  summary_hi: इस प्रकरण में, हनुमान को लंका में रावण की सेना द्वारा पकड़ लिया जाता
    है। रावण अपने सेवकों को हनुमान की पूंछ में आग लगाने का आदेश देता है ताकि अपनी
    शक्ति का प्रदर्शन कर सके। उनके प्रयासों के बावजूद, आग तब तक नहीं जलती जब तक रावण
    स्वयं उसे फूंकने का प्रयास नहीं करता, जिससे उसके अपने बाल और दाढ़ी-मूँछ जल जाती
    हैं।
- id: hanuman-captures-and-escapes
  type: story
  keywords:
  - Hanuman
  - Lanka
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: '93'
  summary_en: Hanuman is captured by Ravana's soldiers and paraded around Lanka in
    chains. However, he manages to escape by shrinking his size and setting fire to
    the city with his burning tail, causing chaos and destruction.
  summary_hi: हनुमान को रावण के सैनिकों द्वारा पकड़ लिया जाता है और लंका में जंजीरों
    में घुमाया जाता है। हालांकि, वह अपने आकार को छोटा करके और अपनी जलती हुई पूंछ से
    शहर में आग लगाकर भागने में सफल होते हैं, जिससे अराजकता और विनाश होता है।
- id: hanuman-spares-meghanada
  type: story
  keywords:
  - Hanuman
  - Meghanada
  - Mercy
  source:
    book: Ananda Ramayan
    sarga: '93'
  summary_en: Despite causing widespread destruction in Lanka, Hanuman chooses not
    to kill Meghanada, Ravana's son, reasoning that it would be more honorable for
    Meghanada to be defeated by Rama. Hanuman's act of mercy allows Meghanada to survive.
  summary_hi: लंका में व्यापक विनाश के बावजूद, हनुमान रावण के पुत्र मेघनाद को नहीं
    मारने का निर्णय लेते हैं, यह सोचकर कि मेघनाद का राम द्वारा पराजित होना अधिक सम्मानजनक
    होगा। हनुमान की दया का कार्य मेघनाद को जीवित रहने की अनुमति देता है।
- id: gajendra-moksha-story
  type: story
  keywords:
  - gajendra
  - moksha
  - vishnu
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: The story narrates the plight of Gajendra, a king in his previous life
    who was cursed to become an elephant. While bathing in a lake, he was caught by
    a crocodile. In distress, Gajendra prayed to Lord Vishnu, who appeared on Garuda
    and saved him by killing the crocodile with his chakra. This act of divine intervention
    freed Gajendra from his curse.
  summary_hi: यह कहानी गजेन्द्र की है, जो अपने पूर्व जन्म में एक राजा था और जिसे हाथी
    बनने का शाप मिला था। एक झील में स्नान करते समय उसे एक मगरमच्छ ने पकड़ लिया। संकट
    में गजेन्द्र ने भगवान विष्णु की प्रार्थना की, जो गरुड़ पर सवार होकर आए और अपने
    चक्र से मगरमच्छ को मारकर गजेन्द्र को बचाया। इस दिव्य हस्तक्षेप ने गजेन्द्र को
    उसके शाप से मुक्त कर दिया।
- id: indradhyumna-curse-story
  type: story
  keywords:
  - indradhyumna
  - curse
  - sage-agastya
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Indradhyumna, a Pandya king, was deeply engrossed in meditation when
    Sage Agastya visited him. Failing to greet the sage due to his meditation, he
    was cursed to become an elephant. The curse was eventually lifted when Gajendra,
    the elephant, was saved by Lord Vishnu.
  summary_hi: पांड्य राजा इन्द्रद्युम्न ध्यान में लीन थे जब ऋषि अगस्त्य उनके पास आए।
    ध्यान में होने के कारण राजा ने ऋषि का स्वागत नहीं किया, जिससे उन्हें हाथी बनने
    का शाप मिला। यह शाप तब समाप्त हुआ जब गजेन्द्र, जो हाथी था, को भगवान विष्णु ने
    बचाया।
- id: hu-hu-curse-story
  type: story
  keywords:
  - hu-hu
  - curse
  - sage-devala
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Hu Hu, a Gandharva, was cursed by Sage Devala to become a crocodile
    after he playfully pulled the sage's leg while he was meditating in a lake. This
    curse was eventually lifted when the crocodile, who had caught Gajendra, was killed
    by Lord Vishnu.
  summary_hi: हु हु नामक गंधर्व को ऋषि देवल ने मगरमच्छ बनने का शाप दिया जब उसने झील
    में ध्यान कर रहे ऋषि का पैर खींचा। यह शाप तब समाप्त हुआ जब गजेन्द्र को पकड़ने
    वाले मगरमच्छ को भगवान विष्णु ने मार डाला।
- id: garuda-seeks-pure-land
  type: story
  keywords:
  - Garuda
  - Kashyapa
  - Lanka
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Garuda, after defeating a vulture named Bhraja, seeks a pure place to
    consume the bodies of an elephant and a crocodile. He approaches his father Kashyapa,
    who advises him to go to Lanka, a pure land, to have his meal.
  summary_hi: गरुड़, भृज नामक गिद्ध को हराने के बाद, हाथी और मगरमच्छ के शरीरों को
    खाने के लिए एक शुद्ध स्थान की खोज करता है। वह अपने पिता कश्यप के पास जाता है,
    जो उसे लंका, एक शुद्ध भूमि, में जाकर भोजन करने की सलाह देते हैं।
- id: valakhilya-rishis-blessing
  type: story
  keywords:
  - Valakhilya Rishis
  - Garuda
  - Vishnu
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: As Garuda perches on a branch of a golden tree, it breaks, causing sixty
    thousand Valakhilya Rishis to fall. Fearing their curse, Garuda holds the branch
    in his beak and continues his journey. The Rishis, after completing their penance,
    attain Vishnu's supreme abode.
  summary_hi: जब गरुड़ एक सुनहरे वृक्ष की शाखा पर बैठता है, तो वह टूट जाती है, जिससे
    साठ हजार वालखिल्य ऋषि गिर जाते हैं। उनके शाप के डर से, गरुड़ शाखा को अपनी चोंच
    में पकड़कर अपनी यात्रा जारी रखता है। ऋषि अपनी तपस्या पूरी करने के बाद विष्णु के
    परम पद को प्राप्त करते हैं।
- id: hanuman-discovers-lanka
  type: story
  keywords:
  - Hanuman
  - Lanka
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman, during his search for Sita, discovers the land of Lanka. He
    is amazed by its golden landscape, which was transformed by the sap of a branch
    that fell during his encounter with the Rakshasas. Hanuman then approaches Sita
    in Ashok Vatika.
  summary_hi: हनुमान, सीता की खोज के दौरान, लंका की भूमि को खोजते हैं। वह इसकी स्वर्णिम
    भूमि को देखकर चकित हो जाते हैं, जो राक्षसों के साथ उनकी मुठभेड़ के दौरान गिरी
    एक शाखा के रस से परिवर्तित हो गई थी। इसके बाद हनुमान अशोक वाटिका में सीता के पास
    जाते हैं।
- id: hanuman-receives-ring-from-sita
  type: event
  keywords:
  - Hanuman
  - Sita
  - ring
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Sita gives Hanuman a ring to deliver to Lord Rama as a token of her
    message. Hanuman, after receiving the ring and taking Sita's permission, bows
    and quickly departs to return to Rama.
  summary_hi: सीता हनुमान को एक अंगूठी देती हैं जिसे वह भगवान राम को संदेश के रूप
    में देने के लिए ले जाता है। हनुमान, अंगूठी प्राप्त करने के बाद और सीता की आज्ञा
    लेकर, प्रणाम करके शीघ्र ही राम के पास लौट जाते हैं।
- id: hanuman-encounters-muni
  type: event
  keywords:
  - Hanuman
  - Muni
  - water
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: On his return journey, Hanuman encounters a sage and requests water
    to quench his thirst. The sage directs him to a nearby water body. Hanuman places
    Sita's ring and other items before the sage and goes to drink water.
  summary_hi: वापसी यात्रा के दौरान, हनुमान एक मुनि से मिलते हैं और अपनी प्यास बुझाने
    के लिए पानी मांगते हैं। मुनि उन्हें पास के जलाशय की ओर निर्देशित करते हैं। हनुमान
    सीता की अंगूठी और अन्य वस्तुएं मुनि के पास रखकर पानी पीने जाते हैं।
- id: hanuman-sees-multiple-rings
  type: event
  keywords:
  - Hanuman
  - rings
  - mystery
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Hanuman is surprised to see thousands of rings identical to Sita's in
    the sage's water pot. He questions the sage about the origin of these rings and
    which one is Sita's. The sage explains that these rings represent the numerous
    times Hanuman has undertaken this mission in different cycles of time.
  summary_hi: हनुमान मुनि के जलपात्र में सीता की अंगूठी जैसी हजारों अंगूठियाँ देखकर
    आश्चर्यचकित हो जाते हैं। वह मुनि से इन अंगूठियों की उत्पत्ति और सीता की अंगूठी
    के बारे में पूछते हैं। मुनि बताते हैं कि ये अंगूठियाँ उन अनेक बारों का प्रतिनिधित्व
    करती हैं जब हनुमान ने विभिन्न काल चक्रों में यह मिशन पूरा किया है।
- id: hanuman-returns-with-sita-news
  type: story
  keywords:
  - Hanuman
  - Sita
  - Ashok Vatika
  source:
    book: Ananda Ramayan
    sarga: Ninth Sarga
  summary_en: Hanuman returns from Lanka after meeting Sita in Ashok Vatika. He shares
    the news of Sita's well-being with the other Vanaras and they all head towards
    Rama to deliver the message. On their way, they stop at Sugriva's protected Madhuvan
    and consume its fruits, leading to a confrontation with the guardian Dadhimukha.
  summary_hi: हनुमान लंका से लौटकर अशोक वाटिका में सीता से मिलने के बाद सीता की कुशलता
    का समाचार अन्य वानरों के साथ साझा करते हैं। वे सभी राम के पास संदेश देने के लिए
    जाते हैं। रास्ते में वे सुग्रीव के संरक्षित मधुवन में रुकते हैं और उसके फलों का
    सेवन करते हैं, जिससे रक्षक दधिमुख के साथ टकराव होता है।
- id: rama-praises-hanuman
  type: story
  keywords:
  - Rama
  - Hanuman
  - Gratitude
  source:
    book: Ananda Ramayan
    sarga: Ninth Sarga
  summary_en: Upon hearing the news brought by Hanuman, Rama is extremely pleased
    and expresses his gratitude towards Hanuman for his great service. Rama acknowledges
    that Hanuman's embrace is a rare blessing, signifying his deep affection and appreciation
    for Hanuman's devotion.
  summary_hi: हनुमान द्वारा लाए गए समाचार को सुनकर राम अत्यंत प्रसन्न होते हैं और
    हनुमान के महान सेवा के लिए अपनी कृतज्ञता व्यक्त करते हैं। राम यह स्वीकार करते
    हैं कि हनुमान का आलिंगन एक दुर्लभ आशीर्वाद है, जो हनुमान की भक्ति के प्रति उनकी
    गहरी स्नेह और प्रशंसा को दर्शाता है।
- id: hanuman-describes-lanka
  type: story
  keywords:
  - hanuman
  - lanka
  - ramayana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman describes the city of Lanka to Lord Shiva. He details its divine
    beauty, its golden fortifications, and the various defenses including moats and
    soldiers. This description is part of the narrative where Hanuman informs about
    the grandeur and strength of Lanka.
  summary_hi: हनुमान ने भगवान शिव को लंका नगरी का वर्णन किया। उन्होंने इसके दिव्य
    सौंदर्य, स्वर्णिम दुर्ग और विभिन्न रक्षात्मक व्यवस्थाओं जैसे खाई और सैनिकों का
    विवरण दिया। यह वर्णन उस कथा का हिस्सा है जहाँ हनुमान लंका की भव्यता और शक्ति के
    बारे में बताते हैं।
- id: kumbhakarna-advises-ravana
  type: story
  keywords:
  - Kumbhakarna
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Kumbhakarna advises Ravana that abducting Sita was inappropriate and
    offers to rectify the situation by fighting Rama and his allies. He assures Ravana
    that he will defeat them and bring Sita back.
  summary_hi: कुम्भकर्ण रावण को सलाह देता है कि सीता का अपहरण अनुचित था और वह स्थिति
    को सुधारने के लिए राम और उनके सहयोगियों से लड़ने की पेशकश करता है। वह रावण को
    आश्वस्त करता है कि वह उन्हें हरा देगा और सीता को वापस लाएगा।
- id: vibhishana-warns-ravana
  type: story
  keywords:
  - Vibhishana
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vibhishana warns Ravana that even powerful demons like Kumbhakarna,
    Mahaparsva, Mahodara, Nikumbha, Kumbha, and Atikaya cannot stand against Rama
    in battle. He advises Ravana to make peace with Rama.
  summary_hi: विभीषण रावण को चेतावनी देते हैं कि कुम्भकर्ण, महापार्श्व, महोदर, निकुम्भ,
    कुम्भ और अतिकाय जैसे शक्तिशाली राक्षस भी राम के सामने युद्ध में नहीं टिक सकते।
    वह रावण को राम के साथ शांति बनाने की सलाह देते हैं।
- id: rama-vibhishana-friendship
  type: story
  keywords:
  - Rama
  - Vibhishana
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Rama befriends Vibhishana, the brother of Ravana, after he approaches
    Rama seeking refuge. Rama promises Vibhishana the throne of Lanka after the defeat
    of Ravana.
  summary_hi: राम विभीषण से मित्रता करते हैं, जो रावण का भाई है, जब वह शरण मांगते
    हुए राम के पास आता है। राम विभीषण को रावण की पराजय के बाद लंका का सिंहासन देने
    का वादा करते हैं।
- id: rama-sea-crossing-plan
  type: story
  keywords:
  - Rama
  - Sea
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Rama, along with his allies, plans to cross the sea to reach Lanka.
    He decides to perform a penance by the seashore to seek the sea god's assistance
    in building a bridge.
  summary_hi: राम अपने सहयोगियों के साथ लंका पहुँचने के लिए समुद्र पार करने की योजना
    बनाते हैं। वह समुद्र देवता की सहायता प्राप्त करने के लिए समुद्र तट पर तपस्या करने
    का निर्णय लेते हैं।
- id: rama-anger-at-sea
  type: story
  keywords:
  - Rama
  - Sea
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Frustrated by the sea's silence, Rama threatens to dry up the ocean.
    The sea god appears and offers a solution for crossing the sea, thus appeasing
    Rama's anger.
  summary_hi: समुद्र की चुप्पी से निराश होकर, राम समुद्र को सुखाने की धमकी देते हैं।
    समुद्र देवता प्रकट होते हैं और समुद्र पार करने का समाधान प्रस्तुत करते हैं, जिससे
    राम का क्रोध शांत होता है।
- id: rama-ocean-dialogue
  type: story
  keywords:
  - Rama
  - Ocean
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: In this episode, the ocean personified appears before Rama, requesting
    him to grant it protection. Rama, holding his bow and arrow, is asked by the ocean
    to direct his powerful arrow towards the sinful region of Drumakalpa in the north.
    The ocean promises to provide a path for Rama's army to cross.
  summary_hi: इस प्रकरण में, समुद्र राम के सामने प्रकट होता है और उनसे सुरक्षा देने
    की प्रार्थना करता है। राम, जो अपने धनुष और बाण के साथ खड़े हैं, से समुद्र अनुरोध
    करता है कि वह अपने शक्तिशाली बाण को उत्तर में स्थित पापी क्षेत्र द्रुमकल्प की
    ओर निर्देशित करें। समुद्र राम की सेना को पार करने के लिए एक मार्ग प्रदान करने
    का वादा करता है।
- id: nalas-bridge-construction
  type: story
  keywords:
  - Nala
  - Bridge
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: The ocean advises Rama to construct a bridge using Nala, the son of
    Vishwakarma, who has the boon to make stones float on water. This is due to a
    curse Nala received for disrespecting a sacred Shaligram. Rama instructs Nala
    to begin the construction of the bridge, starting with the installation of Ganesh
    and the worship of the Navagrahas.
  summary_hi: समुद्र राम को सलाह देता है कि वे नल के माध्यम से एक पुल का निर्माण करें,
    जो विश्वकर्मा का पुत्र है और जिसे पत्थरों को पानी पर तैराने का वरदान प्राप्त है।
    यह वरदान नल को एक शालिग्राम का अपमान करने के कारण मिले श्राप के कारण मिला था।
    राम नल को पुल निर्माण शुरू करने का निर्देश देते हैं, जिसमें गणेश की स्थापना और
    नवग्रहों की पूजा शामिल है।
- id: hanuman-fetches-shivalinga
  type: story
  keywords:
  - Hanuman
  - Shivalinga
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Rama instructs Hanuman to quickly fetch a Shivalinga from Kashi for
    installation. Hanuman, agreeing to the task, flies to Kashi to bring back the
    Shivalinga, ensuring that the auspicious time for the installation is not missed.
  summary_hi: राम हनुमान को काशी से शीघ्रता से एक शिवलिंग लाने का निर्देश देते हैं।
    हनुमान इस कार्य को स्वीकार करते हुए काशी के लिए उड़ान भरते हैं ताकि शिवलिंग को
    समय पर लाकर स्थापना की जा सके।
- id: agastya-vindhya-episode
  type: story
  keywords:
  - Agastya
  - Vindhya
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: The sage Agastya was requested by the gods to travel south and subdue
    the Vindhya mountain, which was growing excessively tall. Agastya instructed Vindhya
    to remain low until he returned, and Vindhya complied. Agastya never returned,
    and Vindhya remained low, allowing the sun to pass over it.
  summary_hi: ऋषि अगस्त्य को देवताओं द्वारा दक्षिण की ओर यात्रा करने और अत्यधिक ऊँचाई
    पर बढ़ रहे विंध्य पर्वत को वश में करने के लिए कहा गया। अगस्त्य ने विंध्य को तब
    तक नीचा रहने का निर्देश दिया जब तक वह वापस नहीं लौटते, और विंध्य ने अनुपालन किया।
    अगस्त्य कभी वापस नहीं आए, और विंध्य नीचा ही रहा, जिससे सूर्य को उसके ऊपर से गुजरने
    की अनुमति मिली।
- id: rama-koustubha-jewel
  type: story
  keywords:
  - Rama
  - Koustubha
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Rama, after establishing a sand Shiva Linga, remembers the Koustubha
    jewel. The jewel, shining like millions of suns, appears from the sky, and Rama
    places it around his neck. With the wealth and items obtained from the jewel,
    Rama performs a grand worship for the sages.
  summary_hi: राम ने बालू के शिवलिंग की स्थापना के बाद कौस्तुभ मणि का स्मरण किया।
    मणि, जो करोड़ों सूर्यों के समान चमक रही थी, आकाश से प्रकट हुई और राम ने उसे अपने
    गले में धारण किया। मणि से प्राप्त धन और वस्त्रों से राम ने मुनियों का भव्य पूजन
    किया।
- id: hanuman-anger-at-rama
  type: story
  keywords:
  - Hanuman
  - Rama
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Hanuman becomes angry upon learning that Rama had sent him to Kashi
    unnecessarily. He confronts Rama, expressing his frustration for being made to
    exert himself without reason. Rama acknowledges Hanuman's grievance and challenges
    him to uproot the sand Shiva Linga if he can.
  summary_hi: हनुमान को यह जानकर क्रोध आता है कि राम ने उन्हें बिना कारण काशी भेजा।
    वह राम के पास जाकर अपनी नाराजगी व्यक्त करते हैं। राम हनुमान की शिकायत को स्वीकार
    करते हैं और उन्हें चुनौती देते हैं कि यदि वे चाहें तो बालू के शिवलिंग को उखाड़
    लें।
- id: hanuman-fails-to-uproot-linga
  type: story
  keywords:
  - Hanuman
  - Shiva Linga
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Hanuman attempts to uproot the sand Shiva Linga by wrapping his tail
    around it and pulling with all his might. Despite his efforts, his tail breaks,
    and he falls unconscious, while the Linga remains unmoved. The other Vanaras laugh
    at the scene.
  summary_hi: हनुमान बालू के शिवलिंग को उखाड़ने का प्रयास करते हैं, अपनी पूंछ को उसके
    चारों ओर लपेटकर पूरी ताकत से खींचते हैं। उनके प्रयास के बावजूद, उनकी पूंछ टूट
    जाती है और वह बेहोश होकर गिर जाते हैं, जबकि लिंग हिलता भी नहीं है। अन्य वानर इस
    दृश्य को देखकर हंसते हैं।
- id: hanuman-linga-establishment
  type: story
  keywords:
  - Hanuman
  - Shiva Linga
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman, following Lord Rama's instructions, establishes a Shiva Linga
    with devotion. Rama blesses the Linga, stating that worship without honoring this
    Linga first would be in vain. This episode highlights the significance of the
    Linga established by Hanuman.
  summary_hi: हनुमान, भगवान राम के निर्देशों का पालन करते हुए, श्रद्धा के साथ एक शिवलिंग
    की स्थापना करते हैं। राम इस लिंग को आशीर्वाद देते हैं, यह कहते हुए कि इस लिंग
    की पूजा किए बिना अन्य पूजा व्यर्थ होगी। यह प्रकरण हनुमान द्वारा स्थापित लिंग के
    महत्व को दर्शाता है।
- id: hanuman-tail-restoration
  type: story
  keywords:
  - Hanuman
  - Tail Restoration
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama restores Hanuman's tail to its original form after it was injured.
    This act symbolizes Rama's gratitude and affection towards Hanuman, and it also
    signifies the divine bond between them.
  summary_hi: राम हनुमान की पूंछ को उसके मूल रूप में बहाल करते हैं जब वह घायल हो जाती
    है। यह कार्य हनुमान के प्रति राम की कृतज्ञता और स्नेह का प्रतीक है, और यह उनके
    बीच के दिव्य संबंध को भी दर्शाता है।
- id: maruti-tirtha-establishment
  type: story
  keywords:
  - Maruti
  - Tirtha
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: A sacred site named after Maruti (Hanuman) is established at the place
    where he fell unconscious. This site becomes known for its power to absolve sins,
    highlighting the sanctity associated with Hanuman's presence.
  summary_hi: जहां मारुति (हनुमान) मूर्छित होकर गिरे थे, उस स्थान पर उनके नाम से एक
    पवित्र स्थल की स्थापना की जाती है। यह स्थल पापों को नष्ट करने की शक्ति के लिए
    प्रसिद्ध हो जाता है, जो हनुमान की उपस्थिति से जुड़ी पवित्रता को दर्शाता है।
- id: establishment-of-rameshwar-linga
  type: event
  keywords:
  - Rameshwar
  - Linga
  source:
    book: Ananda Ramayan
    sarga: सारकाण्डम्
  summary_en: In this passage, it is described how the Rameshwar Linga was established
    by Lord Rama. The Linga is said to have gained prominence due to the divine light
    associated with it, and it became famous among all humans. The passage also mentions
    that worship and rituals will always be performed for this Linga.
  summary_hi: इस अंश में बताया गया है कि रामेश्वर लिंग की स्थापना भगवान राम द्वारा
    की गई थी। इस लिंग को दिव्य ज्योति के कारण प्रसिद्धि प्राप्त हुई और यह सभी मनुष्यों
    में प्रसिद्ध हो गया। इस लिंग की पूजा और अनुष्ठान हमेशा किए जाएंगे।
- id: agastya-muni-arrival
  type: event
  keywords:
  - Agastya
  - Rameshwar
  source:
    book: Ananda Ramayan
    sarga: सारकाण्डम्
  summary_en: Agastya Muni arrives at the site where Lord Rama is establishing the
    Rameshwar Linga. He offers his respects to both Lord Shiva and Lord Rama and expresses
    his joy at witnessing the divine event. Agastya also establishes a Linga named
    after himself at the site.
  summary_hi: अगस्त्य मुनि उस स्थान पर पहुँचते हैं जहाँ भगवान राम रामेश्वर लिंग की
    स्थापना कर रहे हैं। वे भगवान शिव और भगवान राम दोनों को प्रणाम करते हैं और इस दिव्य
    घटना को देखकर अपनी प्रसन्नता व्यक्त करते हैं। अगस्त्य वहाँ अपने नाम से एक लिंग
    की स्थापना भी करते हैं।
- id: nala-bridge-construction
  type: story
  keywords:
  - Nala
  - bridge
  - Ramayana
  - Setu
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Nala, under the guidance of Lord Rama, constructs a bridge across the
    ocean to reach Lanka. By inscribing Rama's name on the stones, they miraculously
    float and connect firmly, enabling the construction of a hundred yojana long bridge
    in five days. This feat is attributed to the divine power of Rama.
  summary_hi: नल, भगवान राम के निर्देशन में, लंका तक पहुँचने के लिए समुद्र पर एक पुल
    का निर्माण करते हैं। पत्थरों पर राम का नाम लिखने से वे चमत्कारिक रूप से तैरने
    लगते हैं और दृढ़ता से जुड़ जाते हैं, जिससे पाँच दिनों में सौ योजन लंबा पुल बन
    जाता है। इस चमत्कार को राम की दिव्य शक्ति का परिणाम माना जाता है।
- id: rama-sees-lanka-from-suvela
  type: event
  keywords:
  - Rama
  - Lanka
  - Suvela
  source:
    book: Ananda Ramayan
    sarga: '15'
  summary_en: Rama, along with his army, ascends the Suvela mountain to get a view
    of Lanka. From there, he observes the grandeur of the city, adorned with colorful
    flags, golden fortifications, and various structures.
  summary_hi: राम अपनी सेना के साथ सुवेल पर्वत पर चढ़ते हैं ताकि लंका का दृश्य देख
    सकें। वहाँ से वे रंग-बिरंगी ध्वजाओं, स्वर्णिम किलेबंदी और विभिन्न संरचनाओं से
    सुसज्जित लंका की भव्यता को देखते हैं।
- id: shuka-transformation-story
  type: story
  keywords:
  - Shuka
  - Curse
  - Transformation
  source:
    book: Ananda Ramayan
    sarga: '15'
  summary_en: Shuka, originally a learned Brahmin, was cursed by the sage Agastya
    to become a Rakshasa after serving human flesh disguised as a woman. Upon seeking
    forgiveness, he was told he would regain his form after meeting Rama and advising
    Ravana.
  summary_hi: शुक, जो मूल रूप से एक विद्वान ब्राह्मण थे, को अगस्त्य मुनि ने एक स्त्री
    के रूप में मानव मांस परोसने के कारण राक्षस बनने का श्राप दिया था। क्षमा मांगने
    पर, उन्हें बताया गया कि राम से मिलने और रावण को सलाह देने के बाद वे अपना रूप पुनः
    प्राप्त करेंगे।
- id: angada-advises-ravana
  type: event
  keywords:
  - Angada
  - Ravana
  - Advice
  source:
    book: Ananda Ramayan
    sarga: '15'
  summary_en: Angada, sent by Rama, enters Ravana's court and advises him to return
    Sita to Rama and seek refuge with him. Angada warns Ravana of the consequences
    if he refuses to comply.
  summary_hi: राम द्वारा भेजे गए अंगद रावण की सभा में प्रवेश करते हैं और उसे सलाह
    देते हैं कि वह सीता को राम को लौटा दे और उनकी शरण में आ जाए। अंगद रावण को चेतावनी
    देते हैं कि यदि उसने ऐसा नहीं किया तो इसके गंभीर परिणाम होंगे।
- id: angada-ravana-confrontation
  type: story
  keywords:
  - Angada
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: '19'
  summary_en: In this episode, Angada confronts Ravana, who boasts about his victories
    over the gods and threatens to kill Rama, Lakshmana, and the Vanaras. Angada responds
    by mocking Ravana's past defeats and ties up Ravana's limbs with his tail. Angada
    then flies back to Rama with Ravana's palace on his head, demonstrating his strength
    and courage.
  summary_hi: इस प्रकरण में अंगद रावण का सामना करते हैं, जो देवताओं पर अपनी जीत का
    घमंड करता है और राम, लक्ष्मण और वानरों को मारने की धमकी देता है। अंगद रावण की
    पिछली हार का मजाक उड़ाते हैं और अपनी पूंछ से रावण के हाथ-पैर बांध देते हैं। फिर
    अंगद रावण के महल को अपने सिर पर उठाकर राम के पास लौट आते हैं, अपनी शक्ति और साहस
    का प्रदर्शन करते हुए।
- id: sugriva-ravana-battle
  type: event
  keywords:
  - Sugriva
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sugriva, in a fit of anger, confronts Ravana in Lanka. He strikes Ravana
    with a powerful blow, causing him to fall from his throne. A fierce battle ensues
    between Sugriva and Ravana, with both combatants exchanging heavy blows. Ultimately,
    Sugriva's strength prevails, and Ravana retreats in shame.
  summary_hi: सुग्रीव क्रोध में लंका में रावण का सामना करते हैं। वह रावण को एक शक्तिशाली
    मुक्का मारते हैं, जिससे वह सिंहासन से गिर जाता है। सुग्रीव और रावण के बीच एक घोर
    युद्ध होता है, जिसमें दोनों एक-दूसरे पर भारी प्रहार करते हैं। अंततः, सुग्रीव की
    शक्ति विजयी होती है और रावण लज्जित होकर पीछे हट जाता है।
- id: rama-shoots-arrow-at-ravana
  type: event
  keywords:
  - Rama
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lord Rama, standing on Mount Suvela, shoots a powerful arrow at Ravana.
    The arrow strikes Ravana's crowns and parasols, cutting them down instantly. This
    act demonstrates Rama's prowess and serves as a warning to Ravana.
  summary_hi: भगवान राम सुवेल पर्वत पर खड़े होकर रावण पर एक शक्तिशाली बाण चलाते हैं।
    बाण रावण के मुकुटों और छत्रों को काट देता है। यह राम की शक्ति का प्रदर्शन है और
    रावण के लिए एक चेतावनी है।
- id: rama-siege-of-lanka
  type: event
  keywords:
  - Rama
  - Lanka
  - siege
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Rama and his army of monkeys lay siege to the city of Lanka, surrounding
    it from all sides. The monkeys block all the gates of the city, preparing for
    the battle against Ravana.
  summary_hi: राम और उनकी वानर सेना लंका नगरी का घेराव करती है, उसे चारों ओर से घेर
    लेती है। वानर लंका के सभी द्वारों को अवरुद्ध कर देते हैं, रावण के खिलाफ युद्ध
    की तैयारी करते हुए।
- id: ravana-counseled-by-malyavan
  type: story
  keywords:
  - Ravana
  - Malyavan
  - counsel
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Malyavan, Ravana's grandfather, advises Ravana to return Sita to Rama
    to prevent the destruction of their lineage. He points out the ominous signs and
    bad omens that have appeared since Sita's arrival in Lanka.
  summary_hi: रावण के नाना माल्यवान रावण को सलाह देते हैं कि वह सीता को राम को लौटा
    दे ताकि उनके कुल का विनाश न हो। वह सीता के लंका में आगमन के बाद से प्रकट हुए अपशकुनों
    और बुरे संकेतों की ओर इशारा करते हैं।
- id: bad-omens-in-lanka
  type: concept
  keywords:
  - omens
  - Lanka
  - destruction
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Since Sita's arrival in Lanka, several bad omens have been observed,
    such as unnatural animal behavior and strange occurrences, indicating impending
    doom for Ravana's kingdom.
  summary_hi: सीता के लंका में आगमन के बाद से कई अपशकुन देखे गए हैं, जैसे कि जानवरों
    का असामान्य व्यवहार और अजीब घटनाएं, जो रावण के राज्य के आसन्न विनाश का संकेत देती
    हैं।
- id: lakshman-injured-by-ravana
  type: event
  keywords:
  - Lakshman
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: In the battle, Ravana attacks Vibhishana with a powerful weapon. Lakshman
    steps forward to protect Vibhishana and is struck by the weapon, causing him to
    fall to the ground.
  summary_hi: युद्ध में, रावण विभीषण पर एक शक्तिशाली हथियार से हमला करता है। लक्ष्मण
    विभीषण की रक्षा के लिए आगे आते हैं और हथियार से घायल हो जाते हैं, जिससे वे जमीन
    पर गिर जाते हैं।
- id: hanuman-attacks-ravana
  type: event
  keywords:
  - Hanuman
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: Seeing Lakshman injured, Hanuman seizes the opportunity and strikes
    Ravana in the chest with a powerful punch, causing Ravana to bleed and fall to
    the ground.
  summary_hi: लक्ष्मण को घायल देखकर, हनुमान अवसर का लाभ उठाते हैं और रावण की छाती
    पर एक शक्तिशाली मुक्का मारते हैं, जिससे रावण को खून निकलने लगता है और वह जमीन
    पर गिर जाता है।
- id: rama-defeats-ravana-chariot
  type: event
  keywords:
  - Rama
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: Rama, angered by Ravana's actions, shoots arrows that destroy Ravana's
    chariot, horses, flag, and crown, leaving Ravana vulnerable.
  summary_hi: रावण की हरकतों से क्रोधित होकर, राम तीर चलाते हैं जो रावण के रथ, घोड़े,
    ध्वज और मुकुट को नष्ट कर देते हैं, जिससे रावण असहाय हो जाता है।
- id: hanuman-fetches-sanjeevani
  type: event
  keywords:
  - Hanuman
  - Sanjeevani
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: Rama instructs Hanuman to bring the Sanjeevani herb to revive the unconscious
    Lakshman. Hanuman sets off to fulfill this task.
  summary_hi: राम हनुमान को मूर्छित लक्ष्मण को पुनर्जीवित करने के लिए संजीवनी बूटी
    लाने का निर्देश देते हैं। हनुमान इस कार्य को पूरा करने के लिए निकल पड़ते हैं।
- id: hanuman-pond-episode
  type: story
  keywords:
  - Hanuman
  - pond
  - apsara
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman visits a sage's ashram and is shown a pond to quench his thirst.
    As he drinks, a crocodile attacks him, but he defeats it. The crocodile transforms
    into an apsara, who reveals she was cursed by a sage and advises Hanuman about
    a demon sent by Ravana.
  summary_hi: हनुमान एक मुनि के आश्रम में जाते हैं और अपनी प्यास बुझाने के लिए एक
    तालाब दिखाया जाता है। जब वह पानी पीते हैं, तो एक मगरमच्छ उन पर हमला करता है, लेकिन
    हनुमान उसे हरा देते हैं। मगरमच्छ एक अप्सरा में बदल जाता है, जो बताती है कि उसे
    एक मुनि ने शाप दिया था और वह हनुमान को रावण द्वारा भेजे गए राक्षस के बारे में
    सलाह देती है।
- id: hanuman-demon-encounter
  type: story
  keywords:
  - Hanuman
  - demon
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After being advised by the apsara, Hanuman encounters a demon named
    Kalanemi sent by Ravana to obstruct his path. Hanuman defeats the demon with a
    powerful punch, fulfilling his promise to the sage.
  summary_hi: अप्सरा की सलाह के बाद, हनुमान रावण द्वारा भेजे गए कालनेमि नामक राक्षस
    से मिलते हैं जो उनके मार्ग में बाधा डालने के लिए आया है। हनुमान एक शक्तिशाली मुक्के
    से राक्षस को हरा देते हैं, जिससे मुनि को दिया गया वचन पूरा होता है।
- id: hanuman-bharata-encounter
  type: story
  keywords:
  - Hanuman
  - Bharata
  - misunderstanding
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: While carrying a mountain, Hanuman is struck by an arrow from Bharata,
    causing him to drop it. Mistaking Bharata for Rama, Hanuman is initially confused
    but soon realizes the misunderstanding.
  summary_hi: एक पर्वत को ले जाते समय, हनुमान भरत के तीर से आहत होते हैं, जिससे वह
    पर्वत गिर जाता है। भरत को राम समझकर हनुमान पहले भ्रमित होते हैं, लेकिन जल्द ही
    गलतफहमी को समझ जाते हैं।
- id: hanuman-and-the-demons-episode
  type: story
  keywords:
  - Hanuman
  - demons
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman, after consuming all the food offered by the demons, challenges
    them. Despite being killed multiple times by Rama and Lakshmana, the demons keep
    reviving. Hanuman learns from a naga maiden about the secret to their death, which
    involves a condition related to her becoming Rama's wife. Eventually, the demons
    are defeated, and the naga maiden is promised a future as Rama's wife in another
    birth.
  summary_hi: हनुमान, जो राक्षसों द्वारा अर्पित सभी भोजन खा लेते हैं, उन्हें चुनौती
    देते हैं। राम और लक्ष्मण द्वारा कई बार मारे जाने के बावजूद, राक्षस बार-बार जीवित
    हो जाते हैं। हनुमान एक नाग कन्या से उनके मृत्यु का रहस्य जान लेते हैं, जिसमें
    एक शर्त होती है कि वह राम की पत्नी बनेगी। अंततः राक्षसों को पराजित किया जाता है
    और नाग कन्या को अगले जन्म में राम की पत्नी बनने का वादा किया जाता है।
- id: ravana-prophecy-and-kumbhakarna-awakening
  type: story
  keywords:
  - Ravana
  - Kumbhakarna
  - prophecy
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: Ravana recalls a prophecy by Brahma that he would be killed by a human,
    realizing that Rama is the incarnation of Narayana. He recounts a curse from King
    Anaranya that a descendant of his would kill Ravana. Ravana then orders his men
    to awaken Kumbhakarna, who is eventually roused after much effort. Kumbhakarna,
    upon awakening, is informed of the situation and advised to surrender Sita to
    Rama.
  summary_hi: रावण को ब्रह्मा द्वारा की गई भविष्यवाणी याद आती है कि उसकी मृत्यु एक
    मानव के हाथों होगी, और वह समझता है कि राम नारायण के अवतार हैं। वह राजा अनरण्य
    के श्राप को भी याद करता है कि उसके वंशज रावण को मारेंगे। रावण अपने लोगों को कुम्भकर्ण
    को जगाने का आदेश देता है, जिसे बहुत प्रयास के बाद जगाया जाता है। जागने पर कुम्भकर्ण
    को स्थिति की जानकारी दी जाती है और सीता को राम को सौंपने की सलाह दी जाती है।
- id: kumbhakarna-battle-and-death
  type: event
  keywords:
  - Kumbhakarna
  - battle
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Kumbhakarna, the giant brother of Ravana, engages in a fierce battle
    against Rama. Despite his immense strength and terrifying presence, Kumbhakarna
    is ultimately defeated and killed by Rama, who uses divine weapons to overpower
    him.
  summary_hi: कुम्भकर्ण, जो रावण का विशालकाय भाई है, राम के खिलाफ एक भयंकर युद्ध में
    शामिल होता है। अपनी अपार शक्ति और भयानक उपस्थिति के बावजूद, कुम्भकर्ण को अंततः
    राम द्वारा पराजित और मारा जाता है, जो दिव्य अस्त्रों का उपयोग करके उसे परास्त
    करते हैं।
- id: meghnad-ritual-and-defeat
  type: event
  keywords:
  - Meghnad
  - ritual
  - defeat
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Meghnad, the son of Ravana, performs a powerful ritual in a secluded
    cave to gain invincibility. However, Vibhishana warns Rama about the ritual, and
    Lakshmana, along with Hanuman and other warriors, interrupts the ritual and defeats
    Meghnad before its completion.
  summary_hi: मेघनाद, जो रावण का पुत्र है, एकांत गुफा में अजेयता प्राप्त करने के लिए
    एक शक्तिशाली अनुष्ठान करता है। हालांकि, विभीषण राम को इस अनुष्ठान के बारे में
    चेतावनी देते हैं, और लक्ष्मण, हनुमान और अन्य योद्धाओं के साथ, अनुष्ठान को बाधित
    करते हैं और मेघनाद को उसके पूरा होने से पहले ही पराजित कर देते हैं।
- id: lakshmana-meghanada-battle
  type: event
  keywords:
  - Lakshmana
  - Meghanada
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: A fierce battle takes place between Lakshmana and Meghanada. Lakshmana,
    with his skillful archery, destroys Meghanada's chariot and weapons. Eventually,
    Lakshmana severs Meghanada's right arm and later his head, leading to Meghanada's
    defeat. The gods rejoice at this victory.
  summary_hi: लक्ष्मण और मेघनाद के बीच एक भयंकर युद्ध होता है। लक्ष्मण अपनी कुशल धनुर्विद्या
    से मेघनाद के रथ और हथियारों को नष्ट कर देते हैं। अंततः, लक्ष्मण मेघनाद का दाहिना
    हाथ और बाद में उसका सिर काट देते हैं, जिससे मेघनाद की हार होती है। देवता इस विजय
    पर प्रसन्न होते हैं।
- id: ravana-anger-and-sulochana-grief
  type: story
  keywords:
  - Ravana
  - Sulochana
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: Ravana, upon seeing the severed head of his son Meghnad, becomes enraged
    and attempts to kill Sita. He is stopped by his wise minister, Suparshwa, who
    advises him to fight Rama and Lakshmana instead. Meanwhile, Sulochana, Meghnad's
    wife, finds his severed arm with a message written in blood, urging her to seek
    his head from Rama and join him in death.
  summary_hi: रावण अपने पुत्र मेघनाद का कटा हुआ सिर देखकर क्रोधित हो जाता है और सीता
    को मारने का प्रयास करता है। उसे उसके बुद्धिमान मंत्री सुपार्श्व द्वारा रोका जाता
    है, जो उसे राम और लक्ष्मण से युद्ध करने की सलाह देता है। इस बीच, सुलोचना, मेघनाद
    की पत्नी, उसके कटे हुए हाथ को पाती है, जिस पर खून से लिखा संदेश है कि वह राम से
    उसका सिर मांगे और मृत्यु में उसके साथ शामिल हो।
- id: sulochana-pleads-with-rama
  type: story
  keywords:
  - Sulochana
  - Rama
  source:
    book: Ananda Ramayan
    sarga: Sarga 11
  summary_en: Sulochana approaches Rama, seeking her husband's head as per his last
    wish. Rama offers to bring Meghnad back to life, but Sulochana declines, stating
    that dying by Lakshmana's hand was a path to liberation for her husband. She thanks
    Rama and leaves with her husband's head.
  summary_hi: सुलोचना राम के पास जाती है और अपने पति के अंतिम इच्छा के अनुसार उसका
    सिर मांगती है। राम मेघनाद को पुनर्जीवित करने की पेशकश करते हैं, लेकिन सुलोचना
    मना कर देती है, यह कहते हुए कि लक्ष्मण के हाथों मरना उसके पति के लिए मुक्ति का
    मार्ग था। वह राम को धन्यवाद देती है और अपने पति का सिर लेकर चली जाती है।
- id: sulochana-sati-pratha
  type: story
  keywords:
  - Sulochana
  - Sati
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sulochana, after reuniting with her husband's body, immolates herself
    on the pyre, following the practice of Sati. She then assumes a divine form and
    ascends to Vaikuntha with her husband.
  summary_hi: सुलोचना अपने पति के शरीर के साथ अग्नि में जलकर सती हो जाती हैं। इसके
    बाद वह दिव्य रूप धारण कर अपने पति के साथ वैकुंठ चली जाती हैं।
- id: ravana-fake-head-trick
  type: story
  keywords:
  - Ravana
  - Sita
  - Deception
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana, with the help of the demon Maya, creates a fake head of Rama
    to deceive Sita. However, Brahma informs Sita beforehand about Ravana's trickery,
    preventing her from being deceived.
  summary_hi: रावण, मयदानव की सहायता से राम का नकली सिर बनवाकर सीता को धोखा देने की
    कोशिश करता है। लेकिन ब्रह्मा पहले ही सीता को रावण की चाल के बारे में बता देते
    हैं, जिससे वह धोखा नहीं खाती।
- id: hanuman-lanka-burning
  type: event
  keywords:
  - Hanuman
  - Lanka
  - Fire
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Following Rama's orders, millions of Vanaras set fire to the city of
    Lanka, causing chaos and destruction reminiscent of Hanuman's earlier burning
    of Lanka.
  summary_hi: राम की आज्ञा से करोड़ों वानर लंका नगरी में आग लगा देते हैं, जिससे पहले
    के लंकादहन की तरह ही हाहाकार मच जाता है।
- id: ravana-homa-for-invincibility
  type: story
  keywords:
  - Ravana
  - Homa
  - Invincibility
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana, following the advice of Shukracharya, conducts a secret homa
    to become invincible. He collects all necessary materials, adorns himself with
    a garland of skulls, and begins the ritual in solitude.
  summary_hi: रावण, शुक्राचार्य के कथनानुसार, अजेय होने के लिए एकांत में हवन करता
    है। वह सभी आवश्यक सामग्री इकट्ठा करता है, मुण्डों की माला पहनता है और एकांत में
    हवन आरम्भ करता है।
- id: mandodari-pleads-with-ravana
  type: story
  keywords:
  - Mandodari
  - Ravana
  - Sita
  source:
    book: Ananda Ramayan
    sarga: '11'
  summary_en: Mandodari pleads with Ravana to return Sita to Rama and give the kingdom
    of Lanka to Vibhishana. She suggests that they both retire to the forest to perform
    penance for peace and happiness. Ravana, however, reveals his intention to die
    at Rama's hands, acknowledging Rama as Vishnu and Sita as Lakshmi.
  summary_hi: मंदोदरी रावण से आग्रह करती हैं कि वह सीता को राम को लौटा दे और विभीषण
    को लंका का राज्य दे दे। वह सुझाव देती हैं कि वे दोनों वन में तपस्या करने चले जाएं
    ताकि शांति और सुख प्राप्त हो सके। रावण, हालांकि, राम के हाथों मरने की अपनी मंशा
    प्रकट करता है, यह स्वीकार करते हुए कि राम विष्णु हैं और सीता लक्ष्मी हैं।
- id: ravana-creates-fake-sita
  type: story
  keywords:
  - Ravana
  - Fake Sita
  - Vanaras
  source:
    book: Ananda Ramayan
    sarga: '11'
  summary_en: Ravana, with the help of the demon Maya, creates a fake Sita and pretends
    to kill her in front of the Vanaras. The Vanaras, distressed by the sight, rush
    to inform Rama. However, Brahma appears and reassures them that the Sita they
    saw was an illusion.
  summary_hi: रावण, मय दानव की मदद से, एक नकली सीता बनाता है और वानरों के सामने उसका
    वध करने का नाटक करता है। इस दृश्य से दुखी वानर राम को सूचित करने के लिए दौड़ पड़ते
    हैं। हालांकि, ब्रह्मा प्रकट होते हैं और उन्हें आश्वस्त करते हैं कि उन्होंने जो
    सीता देखी वह एक माया थी।
- id: hanuman-as-rama-banner
  type: story
  keywords:
  - Hanuman
  - Rama
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: '11'
  summary_en: During the battle between Rama and Ravana, Ravana cuts down Rama's chariot
    banner. Rama instructs Hanuman to sit on the chariot as a substitute banner. Hanuman
    uproots a palm tree and places it on the chariot, sitting atop it with joy. Ravana,
    seeing Hanuman as the new banner, attacks with nine arrows, targeting Hanuman
    and other elements of the chariot.
  summary_hi: राम और रावण के बीच युद्ध के दौरान, रावण राम के रथ के ध्वज को काट देता
    है। राम हनुमान को रथ के ध्वज के स्थान पर बैठने का निर्देश देते हैं। हनुमान एक
    ताड़ का वृक्ष उखाड़कर उसे रथ पर रखते हैं और उस पर आनंद से बैठ जाते हैं। रावण,
    हनुमान को नए ध्वज के रूप में देखकर, नौ बाणों से हनुमान और रथ के अन्य तत्वों पर
    हमला करता है।
- id: rama-hanuman-battle-ravana
  type: story
  keywords:
  - Rama
  - Hanuman
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: '11'
  summary_en: Rama, riding on Hanuman's shoulders, engages in a fierce battle with
    Ravana. During the fight, Ravana strikes Hanuman with a mace, causing him to fall
    unconscious. However, Hanuman quickly regains consciousness, and Rama continues
    the battle with Ravana.
  summary_hi: राम, हनुमान के कंधों पर सवार होकर, रावण के साथ भयानक युद्ध करते हैं।
    लड़ाई के दौरान, रावण गदा से हनुमान पर प्रहार करता है, जिससे हनुमान मूर्छित होकर
    गिर जाते हैं। हालांकि, हनुमान शीघ्र ही चेतना प्राप्त कर लेते हैं, और राम रावण
    के साथ युद्ध जारी रखते हैं।
- id: rama-defeats-ravana
  type: event
  keywords:
  - Rama
  - Ravana
  - battle
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: In a fierce battle, Rama uses his sharp arrows to cut off Ravana's ten
    heads repeatedly. Despite this, Ravana does not die until Rama, following Vibhishana's
    advice, destroys the nectar pot in Ravana's navel with a divine weapon. Finally,
    Ravana's soul enters Rama's body, and the gods praise Rama for his victory.
  summary_hi: एक भयंकर युद्ध में, राम अपने तीक्ष्ण बाणों से रावण के दस सिरों को बार-बार
    काट देते हैं। इसके बावजूद, रावण नहीं मरता जब तक कि राम विभीषण की सलाह पर अमृतकुंड
    को अपने दिव्य अस्त्र से नष्ट नहीं कर देते। अंततः, रावण की आत्मा राम के शरीर में
    प्रवेश करती है और देवता राम की विजय की प्रशंसा करते हैं।
- id: sita-reintegration-episode
  type: story
  keywords:
  - Sita
  - Ravana
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After the defeat of Ravana, Sita, who had previously assumed three forms
    for the purpose of Ravana's destruction, reintegrates into one form. This signifies
    the end of her divine mission and her return to her original state.
  summary_hi: रावण की पराजय के बाद, सीता, जिन्होंने रावण के विनाश के लिए तीन रूप धारण
    किए थे, पुनः एक रूप में एकीकृत हो जाती हैं। यह उनके दिव्य मिशन के अंत और उनके
    मूल स्वरूप में वापसी का संकेत है।
- id: ram-revives-vanaras-episode
  type: story
  keywords:
  - Ram
  - Vanaras
  - Resurrection
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After the battle, Lord Ram revives the vanaras who died in the war by
    showering them with nectar. However, one vanara is missing, and it is revealed
    that Kumbhakarna had eaten him. Ram then looks at Yama, who, out of fear, brings
    the vanara back to life.
  summary_hi: युद्ध के बाद, भगवान राम युद्ध में मरे हुए वानरों को अमृत वर्षा से पुनर्जीवित
    करते हैं। हालांकि, एक वानर गायब है, और यह पता चलता है कि उसे कुम्भकर्ण ने खा लिया
    था। राम यमराज की ओर देखते हैं, जो डर के मारे उस वानर को जीवित कर देते हैं।
- id: ram-and-bharat-episode
  type: story
  keywords:
  - Ram
  - Bharat
  - Ritual
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vibhishana suggests a purification ritual for Ram after the battle,
    but Ram declines, remembering his brother Bharat. This highlights Ram's deep connection
    and respect for his brother, choosing to wait for Bharat's presence.
  summary_hi: विभीषण युद्ध के बाद राम के लिए एक शुद्धिकरण अनुष्ठान का सुझाव देते हैं,
    लेकिन राम अपने भाई भरत को याद करते हुए इसे अस्वीकार कर देते हैं। यह राम के अपने
    भाई के प्रति गहरे संबंध और सम्मान को दर्शाता है, जो भरत की उपस्थिति का इंतजार
    करने का निर्णय लेते हैं।
- id: ram-and-trijata-episode
  type: story
  keywords:
  - Ram
  - Trijata
  - Blessing
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ram grants a boon to Trijata, Sita's loyal companion, allowing her to
    receive offerings made without proper rituals. This act of kindness acknowledges
    Trijata's unwavering support and loyalty during Sita's captivity.
  summary_hi: राम त्रिजटा, सीता की वफादार साथी, को एक वरदान देते हैं, जिससे वह बिना
    उचित अनुष्ठानों के किए गए अर्पणों को प्राप्त कर सकती हैं। यह दयालुता का कार्य
    सीता की कैद के दौरान त्रिजटा के अटूट समर्थन और वफादारी को मान्यता देता है।
- id: hanuman-rescue-of-rama-lakshmana
  type: story
  keywords:
  - Hanuman
  - Rama
  - Lakshmana
  - Patal
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman is praised for rescuing Rama and Lakshmana from the clutches
    of demons in Patal. Rama explains that he remained silent during the ordeal to
    highlight Hanuman's valor and strength.
  summary_hi: हनुमान की प्रशंसा की जाती है क्योंकि उन्होंने पाताल में राक्षसों के
    चंगुल से राम और लक्ष्मण को बचाया था। राम बताते हैं कि उन्होंने इस घटना के दौरान
    चुप रहकर हनुमान के पराक्रम और शक्ति को उजागर किया।
- id: rama-hanuman-shivalinga-incident
  type: story
  keywords:
  - Rama
  - Hanuman
  - Shivalinga
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: During the construction of the bridge to Lanka, Rama playfully broke
    Hanuman's pride by pretending to uproot a Shivalinga that Hanuman had established.
    This incident is recounted humorously by Hanuman.
  summary_hi: लंका के लिए सेतु निर्माण के दौरान, राम ने हनुमान द्वारा स्थापित शिवलिंग
    को उखाड़ने का बहाना बनाकर हनुमान के गर्व को तोड़ा। इस घटना को हनुमान ने हास्यपूर्वक
    सुनाया।
- id: trijata-boon-from-rama
  type: story
  keywords:
  - Trijata
  - Rama
  - Boon
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama grants a boon to Trijata, promising that people will perform rituals
    to please her during specific months. He assures her that even improperly performed
    rituals will benefit her.
  summary_hi: राम त्रिजटा को वरदान देते हैं, जिसमें वे आश्वासन देते हैं कि विशेष महीनों
    के दौरान लोग उन्हें प्रसन्न करने के लिए अनुष्ठान करेंगे। वे यह भी कहते हैं कि
    गलत तरीके से किए गए अनुष्ठान भी उनके लिए लाभकारी होंगे।
- id: rama-returns-to-lanka
  type: event
  keywords:
  - Rama
  - Lanka
  - Vibhishana
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Rama, accompanied by Vibhishana, Sugriva, and others, returns to Lanka
    and shows Sita the city and the battlefield. He points out the bridge he built
    across the ocean, known as Setubandha, and breaks it with his bow.
  summary_hi: राम, विभीषण, सुग्रीव और अन्य के साथ लंका लौटते हैं और सीता को नगर और
    रणभूमि दिखाते हैं। वे समुद्र पर बनाए गए पुल सेतुबन्ध की ओर इशारा करते हैं और अपने
    धनुष से उसे तोड़ देते हैं।
- id: setubandha-tirtha-creation
  type: event
  keywords:
  - Setubandha
  - Tirtha
  - Moksha
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Rama creates a tirtha named Setubandha at the site of the bridge, which
    grants moksha to those who bathe there. The place becomes known as Dhanushkoti.
  summary_hi: राम सेतुबन्ध नामक तीर्थ का निर्माण करते हैं, जो वहां स्नान करने वालों
    को मोक्ष प्रदान करता है। यह स्थान धनुषकोटि के नाम से जाना जाता है।
- id: sampati-creates-jatayu-tirtha
  type: event
  keywords:
  - Sampati
  - Jatayu
  - Tirtha
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Sampati, following Rama's instructions, creates a tirtha named Jatayu
    to honor his brother. This tirtha becomes a place of reverence.
  summary_hi: संपाती, राम के निर्देशों का पालन करते हुए, अपने भाई के सम्मान में जटायु
    नामक तीर्थ का निर्माण करते हैं। यह तीर्थ एक पूजनीय स्थान बन जाता है।
- id: rama-shows-sacred-sites-to-sita
  type: event
  keywords:
  - Rama
  - Sita
  - Sacred Sites
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Rama shows Sita various sacred sites, including Rameshwar, Panchavati,
    and the ashrams of sages like Agastya and Bharadwaja. He recounts his experiences
    and the significance of these places.
  summary_hi: राम सीता को विभिन्न पवित्र स्थलों जैसे रामेश्वर, पंचवटी और अगस्त्य तथा
    भारद्वाज जैसे ऋषियों के आश्रम दिखाते हैं। वे अपने अनुभवों और इन स्थानों के महत्व
    का वर्णन करते हैं।
- id: bharadwaja-heavenly-creation
  type: story
  keywords:
  - Bharadwaja
  - heavenly-creation
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Bharadwaja, through his penance, creates a heavenly realm on earth.
    He worships Lord Rama, Sita, and the Vanaras with great devotion.
  summary_hi: भरद्वाज ने अपने तप से पृथ्वी पर स्वर्ग की रचना की। उन्होंने श्रीराम,
    सीता और वानरों की भक्ति के साथ पूजा की।
- id: hanuman-message-to-bharata
  type: story
  keywords:
  - Hanuman
  - Bharata
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Hanuman is instructed by Rama to go to Ayodhya and inform Bharata and
    the Nishada king about his well-being. Hanuman delivers the message, bringing
    joy to the Nishada king.
  summary_hi: हनुमान को राम द्वारा अयोध्या जाकर भरत और निषादराज को उनके कुशल समाचार
    देने का निर्देश दिया जाता है। हनुमान संदेश देकर निषादराज को प्रसन्न करते हैं।
- id: bharata-prepares-for-sacrifice
  type: story
  keywords:
  - Bharata
  - sacrifice
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Bharata, believing that Rama has perished in battle, prepares to enter
    a sacrificial fire. He gathers kings and their armies to assist in rescuing Sita
    from Lanka.
  summary_hi: भरत, यह मानते हुए कि राम युद्ध में मारे गए हैं, अग्नि में प्रवेश करने
    की तैयारी करते हैं। वे सीता को लंका से छुड़ाने के लिए राजाओं और उनकी सेनाओं को
    एकत्र करते हैं।
- id: hanuman-stops-bharata
  type: story
  keywords:
  - Hanuman
  - Bharata
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: As Bharata is about to enter the fire, Hanuman arrives and stops him,
    informing him that Rama, Sita, and Lakshmana are safe and returning.
  summary_hi: जब भरत अग्नि में प्रवेश करने वाले होते हैं, तब हनुमान आकर उन्हें रोकते
    हैं और बताते हैं कि राम, सीता और लक्ष्मण सुरक्षित हैं और लौट रहे हैं।
- id: bharata-welcomes-rama
  type: event
  keywords:
  - Bharata
  - Rama
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: '32'
  summary_en: Bharata, upon hearing the news of Rama's return, prepares Ayodhya for
    his arrival. He decorates the city with flags and banners, and along with the
    citizens, goes to welcome Rama, carrying Rama's sandals on his head as a mark
    of respect.
  summary_hi: भरत, राम की वापसी की खबर सुनकर, अयोध्या को उनके आगमन के लिए तैयार करते
    हैं। वह शहर को झंडों और पताकाओं से सजाते हैं और नागरिकों के साथ राम का स्वागत
    करने जाते हैं, राम की खड़ाऊँ को अपने सिर पर रखकर सम्मान प्रकट करते हैं।
- id: rama-meets-bharata
  type: event
  keywords:
  - Rama
  - Bharata
  - reunion
  source:
    book: Ananda Ramayan
    sarga: '32'
  summary_en: Upon meeting Bharata, Rama embraces him and assumes multiple forms to
    greet everyone simultaneously. This miraculous event astonishes the people, and
    Rama reassures Bharata, bringing tears to his eyes.
  summary_hi: भरत से मिलने पर, राम उन्हें गले लगाते हैं और सभी का एक साथ स्वागत करने
    के लिए कई रूप धारण करते हैं। यह चमत्कारिक घटना लोगों को आश्चर्यचकित कर देती है,
    और राम भरत को आश्वस्त करते हैं, जिससे उनके आँखों में आँसू आ जाते हैं।
- id: rama-performs-rituals
  type: practice
  keywords:
  - Rama
  - rituals
  - Nandigram
  source:
    book: Ananda Ramayan
    sarga: '32'
  summary_en: Rama arrives at Nandigram and performs various rituals. He shaves his
    head, applies fragrant substances, and takes a ceremonial bath with his brothers,
    marking the occasion with auspicious items.
  summary_hi: राम नंदीग्राम पहुँचते हैं और विभिन्न अनुष्ठान करते हैं। वह सिर मुंडवाते
    हैं, सुगंधित पदार्थ लगाते हैं, और अपने भाइयों के साथ मंगल स्नान करते हैं, इस अवसर
    को शुभ वस्तुओं के साथ चिह्नित करते हैं।
- id: sita-greets-mothers
  type: event
  keywords:
  - Sita
  - Kausalya
  - Arundhati
  source:
    book: Ananda Ramayan
    sarga: '32'
  summary_en: Sita greets her mothers-in-law, including Kausalya, and other venerable
    figures like Arundhati and Vasistha. She is embraced by them and is bathed with
    auspicious substances, enhancing her beauty.
  summary_hi: सीता अपनी सासों, कौसल्या सहित, और अरुंधति और वसिष्ठ जैसे अन्य वंदनीय
    व्यक्तियों का अभिवादन करती हैं। उन्हें गले लगाया जाता है और मांगलिक द्रव्यों से
    स्नान कराया जाता है, जिससे उनकी सुंदरता बढ़ जाती है।
- id: bharata-reports-to-rama
  type: event
  keywords:
  - Bharata
  - Rama
  - kingdom
  source:
    book: Ananda Ramayan
    sarga: '32'
  summary_en: Bharata reports to Rama about the state of the kingdom during his absence.
    He informs Rama that he has managed the kingdom as a trustee and has increased
    its wealth and resources tenfold.
  summary_hi: भरत राम को उनके अनुपस्थिति के दौरान राज्य की स्थिति के बारे में बताते
    हैं। वह राम को सूचित करते हैं कि उन्होंने राज्य को एक न्यासी के रूप में चलाया
    है और उसकी संपत्ति और संसाधनों को दस गुना बढ़ा दिया है।
- id: rama-coronation-episode
  type: event
  keywords:
  - coronation
  - Rama
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, after returning to Ayodhya, is coronated as the king in a grand
    ceremony. The event is attended by various dignitaries, including Sugriva, Vibhishana,
    and other allies. The city is decorated, and the people celebrate with music and
    dance.
  summary_hi: राम अयोध्या लौटने के बाद एक भव्य समारोह में राजा के रूप में अभिषिक्त
    होते हैं। इस कार्यक्रम में सुग्रीव, विभीषण और अन्य सहयोगियों सहित विभिन्न गणमान्य
    व्यक्ति शामिल होते हैं। शहर को सजाया जाता है और लोग संगीत और नृत्य के साथ उत्सव
    मनाते हैं।
- id: pushpaka-vimana-departure
  type: event
  keywords:
  - Pushpaka Vimana
  - Kubera
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After Rama's return to Ayodhya, he instructs the Pushpaka Vimana to
    return to Kubera, its original owner. The celestial vehicle departs as per Rama's
    command.
  summary_hi: राम के अयोध्या लौटने के बाद, वे पुष्पक विमान को उसके मूल स्वामी कुबेर
    के पास लौटने का निर्देश देते हैं। दिव्य वाहन राम के आदेशानुसार प्रस्थान करता है।
- id: hanuman-receives-necklace
  type: story
  keywords:
  - hanuman
  - sita
  - necklace
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita, pleased with Hanuman's devotion, gives him a necklace that was
    gifted to her by Rama. Hanuman becomes resplendent with the glory of the necklace.
  summary_hi: सीता, हनुमान की भक्ति से प्रसन्न होकर, उन्हें राम द्वारा उपहार में दिया
    गया हार देती हैं। हनुमान उस हार की महिमा से अत्यंत सुशोभित हो जाते हैं।
- id: hanuman-boon-from-rama
  type: story
  keywords:
  - hanuman
  - boon
  - rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama offers Hanuman a boon for his service. Hanuman requests to remain
    in the world as long as Rama's name is remembered and to always be present where
    Rama's stories are told.
  summary_hi: राम, हनुमान को उनकी सेवा के लिए वरदान देने की पेशकश करते हैं। हनुमान
    यह वरदान मांगते हैं कि जब तक राम का नाम स्मरण किया जाता है, तब तक वे इस संसार
    में रहें और जहां भी राम की कथाएं होती हैं, वहां उपस्थित रहें।
- id: sita-blesses-hanuman
  type: story
  keywords:
  - sita
  - hanuman
  - blessing
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita blesses Hanuman, ensuring that wherever he resides, he will receive
    all enjoyments through her blessings. She also states that people will worship
    him to alleviate their troubles.
  summary_hi: सीता हनुमान को आशीर्वाद देती हैं कि वे जहां भी रहें, उन्हें उनके आशीर्वाद
    से सभी भोग्य पदार्थ प्राप्त होंगे। वह यह भी कहती हैं कि लोग अपनी समस्याओं को दूर
    करने के लिए उनकी पूजा करेंगे।
- id: rama-rewards-vanaras
  type: event
  keywords:
  - rama
  - vanaras
  - reward
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama rewards the vanaras, including Sugriva and Vibhishana, with valuable
    ornaments and clothes for their assistance in his endeavors.
  summary_hi: राम, सुग्रीव और विभीषण सहित वानरों को उनके प्रयासों में सहायता के लिए
    मूल्यवान आभूषण और वस्त्रों से सम्मानित करते हैं।
- id: shabari-liberation
  type: story
  keywords:
  - Shabari
  - liberation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lord Rama liberated Shabari from the bonds of the world, granting her
    moksha. This act symbolizes the divine grace and compassion of Rama towards his
    devotees.
  summary_hi: भगवान राम ने शबरी को संसार के बंधनों से मुक्त कर मोक्ष प्रदान किया।
    यह घटना राम की अपने भक्तों के प्रति दिव्य कृपा और करुणा का प्रतीक है।
- id: ramayana-war-yagna
  type: concept
  keywords:
  - war
  - yagna
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The war in the Ramayana is metaphorically described as a yagna (sacrificial
    ritual), with various demons and events symbolizing different offerings. Rama's
    return to Ayodhya marks the completion of this cosmic yagna.
  summary_hi: रामायण में युद्ध को रूपक रूप में यज्ञ के रूप में वर्णित किया गया है,
    जिसमें विभिन्न राक्षस और घटनाएँ विभिन्न आहुतियों का प्रतीक हैं। राम का अयोध्या
    लौटना इस ब्रह्मांडीय यज्ञ की समाप्ति को दर्शाता है।
- id: meghnad-birth-and-deeds
  type: story
  keywords:
  - Meghnad
  - birth
  source:
    book: Ananda Ramayan
    sarga: अयोदश; सर्गः
  summary_en: The passage narrates the birth and deeds of Meghnad, son of Ravana,
    highlighting his prowess and the circumstances leading to his eventual defeat
    by Rama. It underscores the divine justice and the ultimate triumph of good over
    evil.
  summary_hi: यह अंश रावण के पुत्र मेघनाद के जन्म और कार्यों का वर्णन करता है, जिसमें
    उसकी वीरता और राम द्वारा उसकी अंतिम हार की परिस्थितियाँ शामिल हैं। यह दिव्य न्याय
    और अच्छाई की बुराई पर अंतिम विजय को रेखांकित करता है।
- id: agastya-visit-to-rama
  type: event
  keywords:
  - Agastya
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Agastya Muni, along with many other sages, visits Lord Rama to pay their
    respects. They express their happiness at seeing Rama safely enthroned after defeating
    his enemies.
  summary_hi: अगस्त्य मुनि और अन्य कई मुनि भगवान राम से मिलने आते हैं और उनका सम्मान
    करते हैं। वे राम को उनके शत्रुओं को हराकर सुरक्षित सिंहासन पर विराजमान देखकर प्रसन्नता
    व्यक्त करते हैं।
- id: birth-of-ravana-and-siblings
  type: story
  keywords:
  - ravana
  - birth
  - rakshasas
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: The sage Vishrava grants a boon to Kaikesi, resulting in the birth of
    her children Ravana, Kumbhakarna, Vibhishana, and their sisters. While Ravana
    and Kumbhakarna become notorious for their evil deeds, Vibhishana is known for
    his righteousness.
  summary_hi: ऋषि विश्रवा कैकसी को वरदान देते हैं, जिससे उनके बच्चे रावण, कुम्भकर्ण,
    विभीषण और उनकी बहनों का जन्म होता है। रावण और कुम्भकर्ण अपने दुष्कर्मों के लिए
    कुख्यात होते हैं, जबकि विभीषण अपनी धार्मिकता के लिए जाने जाते हैं।
- id: ravana-penance-for-shiva
  type: story
  keywords:
  - Ravana
  - Shiva
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana performs severe penance to please Lord Shiva. He uses his own
    body parts to create a musical instrument and sings praises to Shiva, demonstrating
    his devotion and determination.
  summary_hi: रावण भगवान शिव को प्रसन्न करने के लिए कठोर तपस्या करता है। वह अपने शरीर
    के अंगों का उपयोग करके एक वाद्य यंत्र बनाता है और शिव की स्तुति में गाता है, अपनी
    भक्ति और दृढ़ संकल्प को प्रदर्शित करता है।
- id: ravana-pleases-shiva
  type: story
  keywords:
  - ravana
  - shiva
  - boon
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Ravana performs severe penance to please Lord Shiva by creating a veena
    from his own body parts. Impressed by his devotion, Shiva grants him a boon, making
    Ravana extremely powerful.
  summary_hi: रावण भगवान शिव को प्रसन्न करने के लिए अपने शरीर के अंगों से वीणा बनाकर
    कठोर तप करता है। उसकी भक्ति से प्रभावित होकर, शिव उसे वरदान देते हैं, जिससे रावण
    अत्यंत शक्तिशाली बन जाता है।
- id: ravana-boon-from-shiva
  type: story
  keywords:
  - Ravana
  - Shiva
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Ravana pleased Lord Shiva with his singing and asked for the Atma-linga
    and a wife named Parvati. Shiva granted these boons, but Vishnu later intervened
    and took Parvati and the Atma-linga from Ravana. The Atma-linga was established
    at Gokarna, and Ravana returned empty-handed, eventually marrying Mandodari.
  summary_hi: रावण ने भगवान शिव को अपने गायन से प्रसन्न किया और आत्मलिंग तथा पार्वती
    नामक पत्नी की मांग की। शिव ने ये वरदान दिए, लेकिन बाद में विष्णु ने हस्तक्षेप
    कर पार्वती और आत्मलिंग को रावण से छीन लिया। आत्मलिंग को गोकर्ण में स्थापित किया
    गया और रावण खाली हाथ लौट आया, अंततः मंदोदरी से विवाह किया।
- id: ravana-boon-from-brahma
  type: story
  keywords:
  - Ravana
  - Brahma
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Ravana performed intense penance for ten thousand years, offering his
    heads in sacrifice. Pleased, Brahma granted him the boon of invincibility against
    gods, demons, and other celestial beings, but not against humans. Ravana also
    received ten heads and twenty arms.
  summary_hi: रावण ने दस हजार वर्षों तक कठोर तप किया और अपने सिरों की आहुति दी। प्रसन्न
    होकर ब्रह्मा ने उसे देवताओं, असुरों और अन्य दिव्य प्राणियों के खिलाफ अजेयता का
    वरदान दिया, लेकिन मनुष्यों के खिलाफ नहीं। रावण को दस सिर और बीस भुजाएँ भी प्राप्त
    हुईं।
- id: kumbhakarna-boon-from-brahma
  type: story
  keywords:
  - Kumbhakarna
  - Brahma
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Kumbhakarna, Ravana's brother, also performed penance and was granted
    a boon by Brahma. However, due to a mistake, he asked for eternal sleep. Brahma
    modified the boon so that Kumbhakarna would sleep for six months and be awake
    for one day.
  summary_hi: कुंभकर्ण, रावण का भाई, भी तपस्या करता है और ब्रह्मा से वरदान प्राप्त
    करता है। हालांकि, गलती से उसने अनंत नींद का वरदान मांगा। ब्रह्मा ने वरदान को संशोधित
    किया ताकि कुंभकर्ण छह महीने सोए और एक दिन जागे।
- id: kumbhakarna-boon-story
  type: story
  keywords:
  - kumbhakarna
  - boon
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Kumbhakarna, under the influence of Saraswati, mistakenly asked for
    six months of sleep as a boon. Later, Brahma granted him the boon of sleeping
    for six months and then eating for six months. This episode highlights the unintended
    consequences of Kumbhakarna's request.
  summary_hi: कुम्भकर्ण ने सरस्वती के प्रभाव में आकर गलती से छह महीने की नींद का वरदान
    माँगा। बाद में ब्रह्मा ने उसे छह महीने सोने और फिर छह महीने खाने का वरदान दिया।
    यह घटना कुम्भकर्ण की अनजाने में की गई मांग के अप्रत्याशित परिणामों को दर्शाती
    है।
- id: ravana-expels-kubera
  type: story
  keywords:
  - ravana
  - kubera
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana expelled Kubera from Lanka and took over the kingdom with the
    Rakshasas. Kubera then went to Mount Kailash, pleased Shiva with his penance,
    and received a divine city and the status of a divine being as a boon from Shiva.
  summary_hi: रावण ने कुबेर को लंका से निकाल दिया और राक्षसों के साथ राज्य पर कब्जा
    कर लिया। कुबेर कैलाश पर्वत पर गए, शिव को अपनी तपस्या से प्रसन्न किया, और शिव से
    एक दिव्य नगरी और दिव्य पदवी का वरदान प्राप्त किया।
- id: ravana-sister-marriage
  type: story
  keywords:
  - ravana
  - surpanakha
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana married his sister Surpanakha to Vidyutjihva and gave her the
    Dandakaranya forest as dowry. After Vidyutjihva's death, Ravana sent his cousins
    Khara and Dushana to assist her.
  summary_hi: रावण ने अपनी बहन शूर्पणखा का विवाह विद्युत्जिह्व से किया और दहेज में
    उसे दंडकारण्य वन दिया। विद्युत्जिह्व की मृत्यु के बाद, रावण ने अपनी मौसी के लड़कों
    खर और दूषण को उसकी सहायता के लिए भेजा।
- id: ravana-conquers-alaka
  type: story
  keywords:
  - ravana
  - alaka
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana attacked Alaka, the city of Kubera, and took the Pushpaka Vimana
    after defeating Kubera. This episode demonstrates Ravana's ambition and his conquest
    over divine territories.
  summary_hi: रावण ने कुबेर की नगरी अलका पर आक्रमण किया और कुबेर को हराकर पुष्पक विमान
    ले लिया। यह घटना रावण की महत्वाकांक्षा और दिव्य क्षेत्रों पर उसके विजय को दर्शाती
    है।
- id: mandodari-meghnad-birth
  type: story
  keywords:
  - Mandodari
  - Meghnad
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Mandodari gave birth to a son named Meghnad, who roared like a cloud
    as soon as he was born. Due to this, he was named Meghnad.
  summary_hi: मंदोदरी ने मेघनाद नामक पुत्र को जन्म दिया, जो जन्म के साथ ही बादल की
    तरह गरजने लगा। इसी कारण उसका नाम मेघनाद पड़ा।
- id: kuber-ravana-conflict
  type: story
  keywords:
  - Kuber
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Ravana, after hearing Kuber's warning against his misdeeds, became enraged
    and attacked Kuber. He defeated Kuber and took the Pushpak Vimana.
  summary_hi: कुबेर की चेतावनी सुनकर रावण क्रोधित हो गया और उसने कुबेर पर आक्रमण किया।
    उसने कुबेर को पराजित कर पुष्पक विमान छीन लिया।
- id: nalakubera-curse-on-ravana
  type: story
  keywords:
  - Nalakubera
  - Curse
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Nalakubera cursed Ravana that if he ever forced himself upon a woman
    who did not desire him, he would die instantly. This curse was a result of Ravana's
    misdeeds with Rambha.
  summary_hi: नलकुबेर ने रावण को श्राप दिया कि यदि वह किसी ऐसी स्त्री पर बलपूर्वक
    अधिकार करेगा जो उसे नहीं चाहती, तो वह तुरंत मर जाएगा। यह श्राप रम्भा के साथ रावण
    के दुर्व्यवहार के कारण दिया गया।
- id: meghnad-defeats-indra
  type: story
  keywords:
  - Meghnad
  - Indra
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Meghnad, the powerful son of Ravana, defeated Indra in battle and earned
    the name 'Indrajit'. He was known for his strength and love for war.
  summary_hi: रावण के शक्तिशाली पुत्र मेघनाद ने युद्ध में इन्द्र को पराजित किया और
    'इन्द्रजीत' नाम प्राप्त किया। वह अपनी शक्ति और युद्ध के प्रति प्रेम के लिए प्रसिद्ध
    था।
- id: ravana-lifts-kailash
  type: story
  keywords:
  - Ravana
  - Kailash
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Ravana attempted to lift Mount Kailash, causing fear among the deities.
    Shiva pressed the mountain down with his toe, subduing Ravana.
  summary_hi: रावण ने कैलाश पर्वत को उठाने का प्रयास किया, जिससे देवताओं में भय फैल
    गया। शिव ने अपने अंगूठे से पर्वत को दबाकर रावण को शांत किया।
- id: ravana-capture-by-sahasrabahu
  type: story
  keywords:
  - Ravana
  - Sahasrabahu
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Ravana, after being freed by Shiva, goes to the city of Sahasrabahu.
    He sits on an island in the river for Shiva's worship. Sahasrabahu, playing in
    the river, stops the water flow, causing Ravana to be swept away. Realizing Sahasrabahu's
    act, Ravana challenges him to a fight. Sahasrabahu captures Ravana and ties him
    up, giving him to his son as a toy. Later, Sage Pulastya frees Ravana.
  summary_hi: रावण, शिव द्वारा मुक्त होने के बाद, सहस्रबाहु के नगर जाता है। वह नदी
    के एक टापू पर शिव की पूजा करता है। सहस्रबाहु, नदी में खेलते हुए, जल प्रवाह को
    रोक देता है, जिससे रावण बह जाता है। सहस्रबाहु की इस हरकत को समझकर, रावण उसे युद्ध
    के लिए ललकारता है। सहस्रबाहु रावण को पकड़कर बांध देता है और अपने पुत्र को खिलौने
    के रूप में दे देता है। बाद में, पुलस्त्य मुनि रावण को मुक्त कराते हैं।
- id: vali-ravana-encounter
  type: story
  keywords:
  - Vali
  - Ravana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vali captures Ravana and carries him around the four oceans before taking
    him to Kishkindha. There, Vali's son is amused by Ravana's predicament. Eventually,
    Vali releases Ravana and they become friends.
  summary_hi: वाली रावण को पकड़कर चारों समुद्रों के चारों ओर घुमाता है और फिर उसे
    किष्किंधा ले जाता है। वहां, वाली का पुत्र रावण की स्थिति से मनोरंजन करता है। अंततः,
    वाली रावण को छोड़ देता है और वे मित्र बन जाते हैं।
- id: ravana-bali-encounter
  type: story
  keywords:
  - Ravana
  - Bali
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana visits the city of Bali and sees Bali playing a game with his
    wife. When a dice falls, Bali asks Ravana to pick it up, but Ravana is unable
    to lift it despite using all his strength. This encounter humbles Ravana.
  summary_hi: रावण बाली की नगरी में जाता है और बाली को अपनी पत्नी के साथ खेलते हुए
    देखता है। जब एक पासा गिरता है, तो बाली रावण से उसे उठाने के लिए कहता है, लेकिन
    रावण अपनी पूरी ताकत लगाने के बावजूद उसे नहीं उठा पाता। यह घटना रावण को विनम्र
    बनाती है।
- id: ravana-vamana-encounter
  type: story
  keywords:
  - Ravana
  - Vamana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana encounters Vamana, who is guarding the gates of Bali's city.
    Vamana, in his divine form, does not respond to Ravana's inquiries, leading Ravana
    to enter Bali's palace uninvited.
  summary_hi: रावण वामन से मिलता है, जो बाली की नगरी के द्वार की रक्षा कर रहे हैं।
    वामन, अपने दिव्य रूप में, रावण की पूछताछ का जवाब नहीं देते, जिससे रावण बिना निमंत्रण
    के बाली के महल में प्रवेश करता है।
- id: ravana-curse-anaranya
  type: story
  keywords:
  - Ravana
  - Anaranya
  - curse
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana encounters King Anaranya in Ayodhya and defeats him in battle.
    Before dying, Anaranya curses Ravana, stating that a descendant of his lineage,
    Raghunandan Rama, will kill Ravana. Anaranya then ascends to heaven.
  summary_hi: रावण अयोध्या में राजा अनरण्य से मिलता है और युद्ध में उन्हें हरा देता
    है। मरने से पहले, अनरण्य रावण को शाप देते हैं कि उनके वंश में जन्म लेने वाले रघुनंदन
    राम रावण का वध करेंगे। इसके बाद अनरण्य स्वर्ग सिधार जाते हैं।
- id: ravana-seeks-death-by-vishnu
  type: story
  keywords:
  - Ravana
  - Vishnu
  - liberation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana, seeking liberation, consults the sage Sanatkumara about how
    to be killed by Vishnu. The sage informs him that Vishnu will incarnate as a human
    in Ayodhya during the Treta Yuga, and Ravana should seek death at his hands to
    attain liberation.
  summary_hi: रावण, मुक्ति की खोज में, सनत्कुमार मुनि से पूछते हैं कि विष्णु के हाथों
    कैसे मरा जा सकता है। मुनि बताते हैं कि त्रेता युग में विष्णु अयोध्या में मानव
    रूप में अवतरित होंगे, और रावण को उनके हाथों मरकर मुक्ति प्राप्त करनी चाहिए।
- id: birth-of-vali-and-sugriva
  type: story
  keywords:
  - Vali
  - Sugriva
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: In a divine assembly on Mount Meru, a tear from Brahma's eye fell and
    transformed into a great monkey. Later, Indra and Surya, overcome by desire, contributed
    their essence, resulting in the birth of Vali and Sugriva, two powerful vanaras.
  summary_hi: मेरु पर्वत पर एक दिव्य सभा में ब्रह्मा की आँख से एक आँसू गिरा और एक
    महान वानर में बदल गया। बाद में, इन्द्र और सूर्य, कामवश होकर, अपने वीर्य का योगदान
    देते हैं, जिससे दो शक्तिशाली वानरों, बालि और सुग्रीव का जन्म होता है।
- id: birth-of-hanuman
  type: story
  keywords:
  - Hanuman
  - Anjana
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: Hanuman was born to Anjana and Kesari. Anjana, while playing with a
    cat, was blessed by Vayu, the wind god, resulting in the birth of Hanuman, who
    would later become a great devotee of Lord Rama.
  summary_hi: हनुमान का जन्म अंजना और केसरी से हुआ था। अंजना, एक बिल्ली के साथ खेलते
    समय, वायु देवता द्वारा आशीर्वादित हुईं, जिससे हनुमान का जन्म हुआ, जो बाद में भगवान
    राम के महान भक्त बने।
- id: hanuman-birth-story
  type: story
  keywords:
  - hanuman
  - birth
  source:
    book: Ananda Ramayan
    sarga: सारकाण्डम्
  summary_en: The passage describes the birth of Hanuman. Anjan, a female monkey,
    consumed a divine pudding that fell from the sky, leading to the birth of Hanuman.
    He was born on the day of Chaitra Shukla Ekadashi under the Mula Nakshatra.
  summary_hi: यह अंश हनुमान के जन्म का वर्णन करता है। अंजन, एक वानरी, ने आकाश से गिरे
    दिव्य पायस को खा लिया, जिससे हनुमान का जन्म हुआ। उनका जन्म चैत्र शुक्ल एकादशी
    के दिन मूल नक्षत्र में हुआ।
- id: hanuman-rahus-encounter
  type: story
  keywords:
  - hanuman
  - rahu
  source:
    book: Ananda Ramayan
    sarga: सारकाण्डम्
  summary_en: Hanuman, as a child, attempted to capture the sun, mistaking it for
    a fruit. During this attempt, he encountered Rahu, who was trying to eclipse the
    sun. Indra intervened, striking Hanuman with his thunderbolt, causing him to fall
    to the ground.
  summary_hi: बालक हनुमान ने सूर्य को फल समझकर पकड़ने का प्रयास किया। इस प्रयास के
    दौरान, उनकी राहु से भेंट हुई, जो सूर्य ग्रहण करने की कोशिश कर रहा था। इंद्र ने
    हस्तक्षेप किया और अपने वज्र से हनुमान को मारा, जिससे वह भूमि पर गिर पड़े।
- id: hanuman-boons-from-gods
  type: story
  keywords:
  - hanuman
  - boons
  source:
    book: Ananda Ramayan
    sarga: सारकाण्डम्
  summary_en: After Hanuman was struck by Indra's thunderbolt, the gods granted him
    several boons. He was blessed with immortality, immense strength, and the ability
    to assist Lord Vishnu. These boons were given to appease Vayu, Hanuman's father,
    who had stopped the wind in anger.
  summary_hi: इंद्र के वज्र से हनुमान के घायल होने के बाद, देवताओं ने उन्हें कई वरदान
    दिए। उन्हें अमरता, अपार शक्ति और भगवान विष्णु की सहायता करने की क्षमता का वरदान
    मिला। ये वरदान वायु को प्रसन्न करने के लिए दिए गए थे, जिन्होंने क्रोध में वायु
    को रोक दिया था।
- id: hanuman-rahu-encounter
  type: story
  keywords:
  - hanuman
  - rahu
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: During a solar eclipse, Rahu attempts to capture the sun but is thwarted
    by Hanuman, who stands in his way. Rahu, frightened, flees to Indra, who then
    attacks Hanuman with his thunderbolt, causing Hanuman to fall and injure his chin.
    This incident leads to Hanuman's name being derived from his injured chin.
  summary_hi: सूर्य ग्रहण के समय, राहु सूर्य को पकड़ने का प्रयास करता है लेकिन हनुमान
    द्वारा रोका जाता है। राहु डरकर इन्द्र के पास जाता है, जो हनुमान पर वज्र से प्रहार
    करते हैं, जिससे हनुमान गिर जाते हैं और उनकी ठुड्डी घायल हो जाती है। इस घटना के
    कारण हनुमान का नाम उनकी घायल ठुड्डी से जुड़ा।
- id: hanuman-blessing-from-brahma
  type: story
  keywords:
  - hanuman
  - brahma
  source:
    book: Ananda Ramayan
    sarga: '13'
  summary_en: After Hanuman is injured by Indra's thunderbolt, the wind god Vayu stops
    the wind in anger, causing distress across the universe. Brahma intervenes, granting
    Hanuman immortality and invulnerability, and assures Vayu that Hanuman will always
    have devotion to Vishnu.
  summary_hi: इन्द्र के वज्र से हनुमान के घायल होने के बाद, वायु देवता क्रोधित होकर
    वायु को रोक देते हैं, जिससे पूरे ब्रह्मांड में संकट उत्पन्न हो जाता है। ब्रह्मा
    हस्तक्षेप करते हैं, हनुमान को अमरता और अजेयता का वरदान देते हैं, और वायु को आश्वासन
    देते हैं कि हनुमान को हमेशा विष्णु की भक्ति प्राप्त होगी।
- id: ram-kingdom-prosperity
  type: story
  keywords:
  - Ram
  - prosperity
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: During the reign of Lord Ram, the earth was filled with prosperity.
    Trees bore abundant fruits, and people lived in harmony, following their respective
    duties. There was no untimely death of children during their parents' lifetime.
  summary_hi: भगवान राम के शासनकाल में पृथ्वी समृद्धि से भर गई थी। पेड़ भरपूर फल देते
    थे, और लोग अपने-अपने कर्तव्यों का पालन करते हुए सद्भाव में रहते थे। माता-पिता
    के जीवनकाल में बच्चों की अकाल मृत्यु नहीं होती थी।
- id: ram-establishes-shiva-lingas
  type: story
  keywords:
  - Ram
  - Shiva-linga
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lord Ram, in his divine form, established millions of Shiva-lingas across
    the earth to impart teachings to people. He performed numerous Ashwamedha Yajnas,
    which are rare for humans, to please Sita.
  summary_hi: भगवान राम ने अपने दिव्य रूप में लोगों को शिक्षा देने के लिए पृथ्वी पर
    करोड़ों शिवलिंग स्थापित किए। उन्होंने सीता को प्रसन्न करने के लिए अनेक अश्वमेध
    यज्ञ किए, जो मनुष्यों के लिए दुर्लभ हैं।
- id: ram-rules-for-11000-years
  type: story
  keywords:
  - Ram
  - rule
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lord Ram ruled the kingdom righteously for eleven thousand years, according
    to the calculations of the Kali Yuga. His reign was marked by the establishment
    of many stories that eradicated people's sins.
  summary_hi: भगवान राम ने कलियुग की गणना के अनुसार ग्यारह हजार वर्षों तक धर्मपूर्वक
    राज्य किया। उनके शासनकाल में कई कथाएँ स्थापित हुईं जो लोगों के पापों को दूर करती
    थीं।
- id: valmiki-curse-episode
  type: story
  keywords:
  - Valmiki
  - curse
  - Krauncha
  - Nishada
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Once, Sage Valmiki went to the Tamasa river with his disciple Bharadwaja
    for a bath. There, he witnessed a hunter (Nishada) kill a male Krauncha bird,
    leaving its mate in distress. Moved by compassion, Valmiki cursed the hunter,
    inadvertently composing a shloka in the process. This incident is said to have
    inspired the composition of the Ramayana.
  summary_hi: एक बार, ऋषि वाल्मीकि अपने शिष्य भारद्वाज के साथ तमसा नदी पर स्नान के
    लिए गए। वहाँ उन्होंने देखा कि एक निषाद ने एक क्रौंच पक्षी के नर को मार डाला, जिससे
    उसकी मादा अत्यंत दुखी हो गई। करुणा से प्रेरित होकर, वाल्मीकि ने निषाद को शाप दिया
    और अनजाने में एक श्लोक की रचना कर दी। इस घटना ने रामायण की रचना को प्रेरित किया।
- id: brahma-visit-to-valmiki
  type: event
  keywords:
  - Brahma
  - Valmiki
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Brahma, the creator of the worlds, visits the sage Valmiki. Valmiki
    is astonished by Brahma's sudden appearance and offers him hospitality with great
    reverence. Brahma encourages Valmiki to compose the Ramayana, assuring him that
    the story will be celebrated as long as the rivers and mountains exist.
  summary_hi: ब्रह्मा, जो समस्त लोकों के कर्ता हैं, वाल्मीकि मुनि के पास आते हैं।
    वाल्मीकि ब्रह्मा के अचानक आगमन से विस्मित हो जाते हैं और उनका आदरपूर्वक स्वागत
    करते हैं। ब्रह्मा वाल्मीकि को रामायण की रचना करने के लिए प्रेरित करते हैं और उन्हें
    आश्वस्त करते हैं कि यह कथा तब तक प्रचलित रहेगी जब तक नदियाँ और पर्वत विद्यमान
    हैं।
- id: valmiki-composes-ramayana
  type: story
  keywords:
  - Valmiki
  - Ramayana
  - Composition
  source:
    book: Ananda Ramayan
    sarga: Yatrakanda
  summary_en: Valmiki, after being inspired by Brahma, composes the Ramayana, a grand
    epic consisting of a hundred crore shlokas. This epic is filled with noble characters
    and profound teachings, and it becomes a revered text among sages and deities.
  summary_hi: ब्रह्मा से प्रेरित होकर वाल्मीकि सौ करोड़ श्लोकों वाला एक महाकाव्य 'रामायण'
    की रचना करते हैं। यह महाकाव्य उदार चरित्रों और गहन शिक्षाओं से भरा होता है और
    यह ऋषियों और देवताओं के बीच एक पूजनीय ग्रंथ बन जाता है।
- id: brahma-instructs-valmiki
  type: story
  keywords:
  - Brahma
  - Valmiki
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: Yatrakanda
  summary_en: Brahma instructs Valmiki to compose the Ramayana in the form of shlokas.
    Valmiki, inspired by Brahma's words, decides to create a grand epic consisting
    of a hundred crore shlokas, detailing the life and deeds of Rama.
  summary_hi: ब्रह्मा वाल्मीकि को रामायण की रचना श्लोकों के रूप में करने का निर्देश
    देते हैं। ब्रह्मा के शब्दों से प्रेरित होकर, वाल्मीकि राम के जीवन और कार्यों का
    वर्णन करते हुए सौ करोड़ श्लोकों वाला एक महाकाव्य बनाने का निर्णय लेते हैं।
- id: sages-adopt-ramayana
  type: event
  keywords:
  - Sages
  - Ramayana
  - Adoption
  source:
    book: Ananda Ramayan
    sarga: Yatrakanda
  summary_en: The sages adopt Valmiki's Ramayana and begin to recite and teach it
    in their ashrams. The epic becomes widely revered, attracting the attention of
    gods and celestial beings who gather to listen to its recitation.
  summary_hi: ऋषि वाल्मीकि के रामायण को अपनाते हैं और अपने आश्रमों में इसका पाठ और
    शिक्षण शुरू करते हैं। यह महाकाव्य व्यापक रूप से पूजनीय बन जाता है, जिससे देवता
    और आकाशीय प्राणी इसके पाठ को सुनने के लिए एकत्र होते हैं।
- id: sita-ganga-vow
  type: story
  keywords:
  - Sita
  - Ganga
  - vow
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita recalls a vow she made to Goddess Ganga when she, Rama, and Lakshmana
    were leaving Ayodhya for their exile. She promised to offer worship with various
    offerings upon their return. After fourteen years, she reminds Rama of this vow
    and requests him to visit the banks of the Ganga to fulfill it.
  summary_hi: सीता को याद आता है कि जब वह, राम और लक्ष्मण अयोध्या से वनवास के लिए
    जा रहे थे, तब उन्होंने देवी गंगा से एक संकल्प किया था। उन्होंने वचन दिया था कि
    लौटने पर वह विभिन्न प्रकार की पूजा अर्पित करेंगी। चौदह वर्ष बाद, वह राम को इस
    संकल्प की याद दिलाती हैं और इसे पूरा करने के लिए गंगा के तट पर जाने का अनुरोध
    करती हैं।
- id: sarayu-ganga-confluence-desire
  type: story
  keywords:
  - Sarayu
  - Ganga
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In a conversation with a sage, Rama inquires about the possibility of
    the sage residing in the ashram. The sage expresses his desire for the confluence
    of the Sarayu and Ganga rivers at the location to make it auspicious for his residence.
  summary_hi: राम ने एक ऋषि से बातचीत में पूछा कि क्या वह आश्रम में निवास कर सकते
    हैं। ऋषि ने अपनी इच्छा व्यक्त की कि सरयू और गंगा नदियों का संगम इस स्थान पर हो
    जाए, जिससे यह स्थान उनके निवास के लिए शुभ हो सके।
- id: matsya-avatar-vedas-retrieval
  type: story
  keywords:
  - Matsya Avatar
  - Vedas
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The passage narrates the story of the Matsya Avatar, where Lord Vishnu
    took the form of a giant fish to retrieve the Vedas stolen by the demon Shankhasura.
    After defeating the demon, Vishnu returned the Vedas to Brahma.
  summary_hi: इस अंश में मत्स्य अवतार की कथा का वर्णन है, जहां भगवान विष्णु ने शंखासुर
    राक्षस द्वारा चुराए गए वेदों को पुनः प्राप्त करने के लिए एक विशाल मछली का रूप
    धारण किया। राक्षस को पराजित करने के बाद, विष्णु ने वेदों को ब्रह्मा को लौटा दिया।
- id: sarayu-origin-story
  type: story
  keywords:
  - Sarayu
  - Origin
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The origin of the Sarayu river is described as the tears of joy shed
    by Lord Narayana during an event on the Himalayas. These tears transformed into
    a pure river, eventually becoming the Sarayu.
  summary_hi: सरयू नदी की उत्पत्ति का वर्णन भगवान नारायण के आनंदाश्रुओं के रूप में
    किया गया है, जो हिमालय पर एक घटना के दौरान बहाए गए थे। ये आँसू एक पवित्र नदी में
    परिवर्तित हो गए, जो अंततः सरयू बन गई।
- id: sarayu-arrival-ayodhya
  type: story
  keywords:
  - Sarayu
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The passage describes how King Vaivasvata Manu, upon his guru's advice,
    brought the Sarayu river to Ayodhya by shooting an arrow that guided the river's
    path from the Manasarovar to the city.
  summary_hi: इस अंश में वर्णन है कि कैसे राजा वैवस्वत मनु ने अपने गुरु की सलाह पर
    सरयू नदी को मानसरोवर से अयोध्या लाने के लिए एक बाण चलाया, जिसने नदी के मार्ग को
    शहर तक निर्देशित किया।
- id: sita-puja-and-journey
  type: event
  keywords:
  - Sita
  - Puja
  - Pushpaka Vimana
  source:
    book: Ananda Ramayan
    sarga: Yatra Kanda
  summary_en: Sita, along with her mothers-in-law and other women, boards the Pushpaka
    Vimana to perform a ritual at the confluence of the Sarayu and Ganga rivers. She
    conducts a detailed puja, offering various items and performing rituals as per
    the guidance of the priests. After the puja, she returns to Rama, who also performs
    a grand puja at the same location.
  summary_hi: सीता अपनी सासों और अन्य महिलाओं के साथ पुष्पक विमान पर सवार होकर सरयू
    और गंगा के संगम पर एक अनुष्ठान करने जाती हैं। वह पुरोहितों के निर्देशानुसार विभिन्न
    वस्तुओं की आहुति देकर और विधियों का पालन करते हुए विस्तृत पूजा करती हैं। पूजा
    के बाद, वह राम के पास लौटती हैं, जो उसी स्थान पर एक भव्य पूजा करते हैं।
- id: ram-rekha-creation
  type: event
  keywords:
  - Ram
  - Chyavana
  - protection
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Chyavana Rishi requests Lord Ram to protect his ashram from disturbances
    caused by the Magadha people. In response, Ram draws a protective line with his
    arrow around the ashram, which becomes known as 'Ram Rekha'. This line prevents
    any harm from reaching the ashram.
  summary_hi: च्यवन ऋषि राम से उनके आश्रम की रक्षा करने का अनुरोध करते हैं, जो मगध
    के लोगों द्वारा उत्पन्न विघ्नों से परेशान है। राम अपने बाण से आश्रम के चारों ओर
    एक सुरक्षा रेखा खींचते हैं, जिसे 'राम रेखा' के नाम से जाना जाता है। यह रेखा आश्रम
    तक किसी भी प्रकार की हानि को पहुँचने से रोकती है।
- id: chyavana-ram-dialogue
  type: story
  keywords:
  - Ram
  - Chyavana
  - dialogue
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Chyavana Rishi visits Lord Ram and expresses his concerns about his
    ashram being disturbed by the Magadha people. He requests Ram's help, and Ram
    assures him that his ashram will become a holy place, free from disturbances.
  summary_hi: च्यवन ऋषि राम से मिलने आते हैं और अपने आश्रम के मगध के लोगों द्वारा
    परेशान किए जाने की चिंता व्यक्त करते हैं। वह राम से मदद की गुहार लगाते हैं, और
    राम उन्हें आश्वस्त करते हैं कि उनका आश्रम एक पवित्र स्थान बन जाएगा, जो किसी भी
    विघ्न से मुक्त होगा।
- id: rama-visit-to-triveni
  type: event
  keywords:
  - Rama
  - Triveni
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Rama, along with Sita, descends from the aerial chariot near Triveni
    and walks to the confluence. There, he performs rituals, including offering Sita's
    hair and his own tonsure, as part of their pilgrimage.
  summary_hi: राम, सीता के साथ, त्रिवेणी के पास विमान से उतरते हैं और संगम तक पैदल
    जाते हैं। वहां, वे अनुष्ठान करते हैं, जिसमें सीता के बालों की आहुति और स्वयं का
    मुंडन शामिल है, जो उनकी तीर्थयात्रा का हिस्सा है।
- id: rama-pilgrimage-and-rituals
  type: event
  keywords:
  - Pilgrimage
  - Rituals
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Rama and his companions perform various rituals at Triveni, including
    fasting, offering tarpan, and conducting shraddha. They stay for a month, visiting
    eight sacred sites and giving donations to Brahmins.
  summary_hi: राम और उनके साथी त्रिवेणी में विभिन्न अनुष्ठान करते हैं, जिसमें उपवास,
    तर्पण और श्राद्ध शामिल हैं। वे एक महीने तक रहते हैं, आठ पवित्र स्थलों की यात्रा
    करते हैं और ब्राह्मणों को दान देते हैं।
- id: rama-visit-to-vindhyavasini
  type: event
  keywords:
  - Vindhyavasini
  - Temple
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Rama visits the divine temple of Vindhyavasini Devi, performs rituals,
    and offers clothes and ornaments to the goddess. He pleases the temple priests
    with donations before continuing his journey.
  summary_hi: राम विंध्यवासिनी देवी के दिव्य मंदिर की यात्रा करते हैं, अनुष्ठान करते
    हैं और देवी को वस्त्र और आभूषण अर्पित करते हैं। वह मंदिर के पुजारियों को दान देकर
    प्रसन्न करते हैं और अपनी यात्रा जारी रखते हैं।
- id: rama-arrival-in-kashi
  type: event
  keywords:
  - Kashi
  - Aerial Chariot
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: As Rama approaches Kashi in his radiant aerial chariot, the residents
    of Kashi are amazed and speculate about the chariot's nature, comparing it to
    celestial phenomena and divine beings.
  summary_hi: जब राम अपने चमकदार विमान में काशी के पास आते हैं, तो काशी के निवासी
    आश्चर्यचकित होते हैं और विमान की प्रकृति के बारे में अटकलें लगाते हैं, इसकी तुलना
    दिव्य घटनाओं और देवताओं से करते हैं।
- id: sita-pind-donation-episode
  type: story
  keywords:
  - Sita
  - pind-daan
  - Dasharatha
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Sita, accompanied by her companions, went to the Phalgu river to perform
    rituals. She attempted to create offerings (pind) using sand for the goddess Durga.
    As she placed each offering on the ground, a divine hand, identified as her father-in-law
    Dasharatha's, emerged to take them. This mysterious event left Sita in awe and
    she completed her worship mentally before returning to her vehicle.
  summary_hi: सीता अपनी सखियों के साथ फल्गु नदी पर स्नान और पूजा करने गईं। उन्होंने
    देवी दुर्गा के लिए बालू से पिंड बनाने का प्रयास किया। जैसे ही उन्होंने पिंड को
    जमीन पर रखा, उनके ससुर दशरथ का दिव्य हाथ प्रकट हुआ और पिंड को ले गया। इस रहस्यमय
    घटना ने सीता को चकित कर दिया और उन्होंने मन ही मन पूजा पूरी की और फिर अपने वाहन
    के पास लौट आईं।
- id: sita-curse-episode
  type: story
  keywords:
  - Sita
  - curse
  - testimony
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita, seeking testimony to prove her innocence, asks various entities
    to bear witness. When they refuse, she curses them. A cow, a tree, and eventually
    the sun are asked, with the sun finally agreeing to testify. This episode highlights
    Sita's trials and the divine intervention in her life.
  summary_hi: सीता अपनी निर्दोषिता साबित करने के लिए विभिन्न प्राणियों से साक्ष्य
    देने का अनुरोध करती हैं। जब वे मना कर देते हैं, तो वह उन्हें शाप देती हैं। एक
    गाय, एक पेड़ और अंततः सूर्य से पूछा जाता है, जिसमें सूर्य अंततः साक्ष्य देने के
    लिए सहमत होता है। यह प्रकरण सीता के संघर्षों और उनके जीवन में दिव्य हस्तक्षेप
    को दर्शाता है।
- id: dasharatha-appearance-episode
  type: story
  keywords:
  - Dasharatha
  - Ram
  - afterlife
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: King Dasharatha appears before Rama in a divine chariot, expressing
    his satisfaction with the pindadaan (ritual offerings) performed by Sita. He advises
    Rama to perform the Gaya Shraddha for the benefit of the world, highlighting the
    importance of ancestral rites.
  summary_hi: राजा दशरथ एक दिव्य रथ में राम के सामने प्रकट होते हैं और सीता द्वारा
    किए गए पिंडदान से अपनी संतुष्टि व्यक्त करते हैं। वह राम को लोक कल्याण के लिए गया
    श्राद्ध करने की सलाह देते हैं, जो पितृ कर्मकांडों के महत्व को दर्शाता है।
- id: ram-visit-sacred-sites
  type: event
  keywords:
  - pilgrimage
  - sacred-sites
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama visits various sacred sites including Bhairava Tirtha, Lakshmana
    Kunda, and Jatayu Tirtha. He performs rituals and offerings at these places, seeking
    blessings and purification.
  summary_hi: राम भैरव तीर्थ, लक्ष्मण कुंड और जटायु तीर्थ जैसे विभिन्न पवित्र स्थलों
    का दौरा करते हैं। वह इन स्थानों पर अनुष्ठान और अर्पण करते हैं, आशीर्वाद और शुद्धिकरण
    की कामना करते हैं।
- id: kanya-kumari-encounter
  type: story
  keywords:
  - kanya-kumari
  - marriage-proposal
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama encounters Kanya Kumari, a sage's daughter, who has been waiting
    for him with a marriage proposal. She explains that she was promised to Surendra
    but chose to wait for Rama instead.
  summary_hi: राम कन्याकुमारी से मिलते हैं, जो एक ऋषि की पुत्री हैं और विवाह प्रस्ताव
    के साथ उनकी प्रतीक्षा कर रही हैं। वह बताती हैं कि उन्हें सुरेंद्र को वचन दिया
    गया था, लेकिन उन्होंने राम की प्रतीक्षा करने का निर्णय लिया।
- id: ram-visit-to-manikarnika
  type: event
  keywords:
  - Ram
  - Manikarnika
  source:
    book: Ananda Ramayan
    sarga: यात्राकाण्डम्
  summary_en: Lord Rama visits Manikarnika and bathes in the Kartoya river. However,
    he does not cross it due to the belief that crossing it would nullify one's religious
    merits.
  summary_hi: भगवान राम मणिकर्णिका जाते हैं और करतोया नदी में स्नान करते हैं। हालांकि,
    वह इसे पार नहीं करते क्योंकि यह माना जाता है कि इसे पार करने से व्यक्ति के धार्मिक
    पुण्य नष्ट हो जाते हैं।
- id: ram-visit-to-badrikashram-and-kedarnath
  type: event
  keywords:
  - Ram
  - Badrikashram
  - Kedarnath
  source:
    book: Ananda Ramayan
    sarga: यात्राकाण्डम्
  summary_en: After visiting Badrikashram, Lord Rama proceeds to Kedarnath, where
    he pays his respects to the deity.
  summary_hi: बदरिकाश्रम के दर्शन के बाद, भगवान राम केदारनाथ जाते हैं और वहां के देवता
    को अपनी श्रद्धांजलि अर्पित करते हैं।
- id: ram-visit-to-manasarovar
  type: event
  keywords:
  - Ram
  - Manasarovar
  source:
    book: Ananda Ramayan
    sarga: यात्राकाण्डम्
  summary_en: Lord Rama visits the sacred Manasarovar lake, where the Ganga and Sarayu
    rivers originate. The lake is filled with golden lotuses and inhabited by swans.
  summary_hi: भगवान राम पवित्र मानसरोवर झील का दौरा करते हैं, जहां गंगा और सरयू नदियों
    का उद्गम होता है। झील में सुनहरे कमल खिले होते हैं और हंस निवास करते हैं।
- id: ram-meeting-with-shiva-at-kailash
  type: event
  keywords:
  - Ram
  - Shiva
  - Kailash
  source:
    book: Ananda Ramayan
    sarga: यात्राकाण्डम्
  summary_en: Upon reaching Kailash, Lord Rama is greeted by Lord Shiva, who arrives
    on Nandi. Rama descends from his chariot to pay respects to Shiva, who warmly
    receives him.
  summary_hi: कैलाश पहुंचने पर, भगवान राम का स्वागत भगवान शिव द्वारा किया जाता है,
    जो नंदी पर सवार होकर आते हैं। राम अपने रथ से उतरकर शिव को प्रणाम करते हैं, जो
    उन्हें गर्मजोशी से स्वीकार करते हैं।
- id: shatrughna-crosses-ganga
  type: story
  keywords:
  - Shatrughna
  - Ganga
  source:
    book: Ananda Ramayan
    sarga: Yagakanda 217
  summary_en: Shatrughna, along with Sumanta and a large army, reaches the banks of
    the river Ganga while following the sacrificial horse released by Rama. Facing
    obstacles, Shatrughna prays to the river goddess Ganga for a safe passage, invoking
    the truth of Rama's character. The river parts to allow them to cross, demonstrating
    the power of Rama's virtue.
  summary_hi: शत्रुघ्न, सुमंत्र और विशाल सेना के साथ, राम द्वारा छोड़े गए यज्ञीय अश्व
    का पीछा करते हुए गंगा नदी के तट पर पहुँचते हैं। बाधाओं का सामना करते हुए, शत्रुघ्न
    गंगा देवी से सुरक्षित मार्ग की प्रार्थना करते हैं, राम के चरित्र की सच्चाई का
    आह्वान करते हुए। गंगा नदी उनके पार करने के लिए मार्ग देती है, जो राम के गुण की
    शक्ति को दर्शाता है।
- id: shatrughna-reaches-magadh
  type: story
  keywords:
  - Shatrughna
  - Magadh
  source:
    book: Ananda Ramayan
    sarga: Yagakanda 217
  summary_en: After crossing the Ganga, Shatrughna and his army reach the region of
    Magadh, also known as Kikata. The people of Magadh, recognizing the power of Rama,
    chant the names of Sita and Rama in praise. The sacrificial horse continues its
    journey towards the east.
  summary_hi: गंगा पार करने के बाद, शत्रुघ्न और उनकी सेना मगध क्षेत्र में पहुँचते
    हैं, जिसे कीकट भी कहा जाता है। मगध के लोग, राम की शक्ति को पहचानते हुए, सीता और
    राम के नाम का जयघोष करते हैं। यज्ञीय अश्व अपनी यात्रा पूर्व दिशा की ओर जारी रखता
    है।
- id: rama-yajna-episode
  type: event
  keywords:
  - yajna
  - ritual
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, along with Sita and the priests, participates in a grand yajna
    (sacrificial ritual). The event is marked by the sound of drums and the chanting
    of Vedic hymns. Rama gives generous gifts to the priests and others involved in
    the ceremony, including clothes, ornaments, and other valuables.
  summary_hi: राम, सीता और ऋत्विजों के साथ एक भव्य यज्ञ में भाग लेते हैं। इस आयोजन
    में नगाड़ों की ध्वनि और वैदिक मंत्रों का उच्चारण होता है। राम यज्ञ में शामिल ऋत्विजों
    और अन्य लोगों को वस्त्र, आभूषण और अन्य मूल्यवान वस्तुएँ भेंट करते हैं।
- id: rama-gifts-to-priests
  type: event
  keywords:
  - gifts
  - priests
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After the yajna, Rama instructs Lakshmana to escort the priests to the
    treasury and allow them to take as much wealth as they desire. Rama ensures that
    the priests are honored with gifts and donations, reflecting his generosity and
    respect for the ritual.
  summary_hi: यज्ञ के बाद, राम लक्ष्मण को निर्देश देते हैं कि वे ऋत्विजों को कोषागार
    तक ले जाएं और उन्हें जितना चाहें उतना धन लेने दें। राम ऋत्विजों को उपहार और दान
    देकर सम्मानित करते हैं, जो उनकी उदारता और यज्ञ के प्रति सम्मान को दर्शाता है।
- id: rama-coronation-procession
  type: event
  keywords:
  - Rama
  - coronation
  source:
    book: Ananda Ramayan
    sarga: Yaga Kanda
  summary_en: The passage describes the grand procession of Lord Rama's coronation.
    Rama, seated on a chariot with Sita, is accompanied by Lakshmana holding an umbrella,
    Bharata with a fan, Shatrughna with a whisk, and other allies carrying various
    ceremonial items. The streets are adorned with fragrant showers and the people
    celebrate with music and dance as Rama proceeds to the royal palace.
  summary_hi: यह अंश भगवान राम के राज्याभिषेक की भव्य शोभायात्रा का वर्णन करता है।
    राम, सीता के साथ रथ पर बैठे हैं, लक्ष्मण छत्र धारण किए हुए हैं, भरत पंखा लिए हुए
    हैं, शत्रुघ्न चंवर लिए हुए हैं, और अन्य साथी विभिन्न धार्मिक वस्त्र और सामग्री
    लेकर चल रहे हैं। रास्ते में सुगंधित फव्वारे छूट रहे हैं और लोग संगीत और नृत्य
    के साथ उत्सव मना रहे हैं, जब राम राजमहल की ओर बढ़ते हैं।
- id: rama-ashwamedha-yagna
  type: event
  keywords:
  - Ashwamedha
  - Yagna
  source:
    book: Ananda Ramayan
    sarga: Yagakanda
  summary_en: Rama conducted ten Ashwamedha Yagnas over several years, following the
    guidance of Sage Vasistha. During the tenth Yagna, Rama donated all his wealth
    to the Brahmins, who returned it to him, acknowledging that only he could protect
    it. This event highlights the grandeur and generosity of Rama's rule.
  summary_hi: राम ने वशिष्ठ मुनि के मार्गदर्शन में कई वर्षों में दस अश्वमेध यज्ञ किए।
    दसवें यज्ञ के दौरान, राम ने अपनी सारी संपत्ति ब्राह्मणों को दान कर दी, जिन्होंने
    इसे यह कहते हुए लौटा दिया कि केवल राम ही इसकी रक्षा कर सकते हैं। यह घटना राम के
    शासन की भव्यता और उदारता को दर्शाती है।
- id: sita-charity-to-brahmin-wife
  type: story
  keywords:
  - Sita
  - charity
  - Brahmin wife
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: Sita, while observing the marketplace from the palace, notices a Brahmin's
    wife in distress, lacking clothes and jewelry. Upon inquiry, she learns that the
    woman's husband has left for a pilgrimage, leaving her and her child in poverty.
    Moved by compassion, Sita gives her own clothes and jewelry to the Brahmin's wife.
  summary_hi: सीता महल से बाजार का दृश्य देख रही थीं, तभी उन्होंने एक ब्राह्मण की
    पत्नी को देखा जो वस्त्र और आभूषणों के बिना संकट में थी। पूछने पर पता चला कि उसके
    पति तीर्थयात्रा पर गए हैं और वह अपने बच्चे के साथ गरीबी में है। दया से प्रेरित
    होकर, सीता ने अपने वस्त्र और आभूषण उस ब्राह्मण पत्नी को दे दिए।
- id: rama-welcomes-vyasa
  type: event
  keywords:
  - Rama
  - Vyasa
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Rama welcomes Vyasa and other sages to his abode with great devotion.
    He offers them seats and performs their worship with divine items. Sita fans Vyasa
    while Rama inquires about his well-being.
  summary_hi: राम ने व्यास और अन्य ऋषियों का अपने भवन में स्वागत किया और उन्हें उत्तम
    आसन पर बैठाया। उन्होंने दिव्य वस्तुओं से उनकी पूजा की। सीता ने व्यास को पंखा झला
    और राम ने उनके कुशल-मंगल के बारे में पूछा।
- id: rama-three-vows
  type: concept
  keywords:
  - Rama
  - vows
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: 'Rama explains to Vyasa the three vows he has taken: to always keep
    his word, to regard all women except Sita as mothers, and to kill with a single
    arrow. Vyasa blesses him, stating that in a future life, he will have many wives.'
  summary_hi: 'राम ने व्यास को अपने तीन व्रतों के बारे में बताया: एक बार कही बात को
    कभी न बदलना, सीता के अलावा सभी स्त्रियों को माता के समान मानना, और एक ही बाण से
    शत्रु का वध करना। व्यास ने उन्हें आशीर्वाद दिया और कहा कि अगले जन्म में उनके कई
    पत्नियाँ होंगी।'
- id: rama-donation-to-brahmins
  type: story
  keywords:
  - Rama
  - donation
  - Brahmins
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Rama, seeking to gain many wives in his next life, asks Vyasa about
    a suitable donation or vow. Vyasa advises him to create sixteen golden statues
    and donate them to Brahmins on the banks of the Sarayu River. Rama follows this
    advice and the Brahmins bless him, saying the donation will yield him sixteen
    thousand wives in his next life.
  summary_hi: राम, अपने अगले जीवन में कई पत्नियाँ प्राप्त करने की इच्छा से, व्यास
    से उपयुक्त दान या व्रत के बारे में पूछते हैं। व्यास उन्हें सलाह देते हैं कि वे
    सोने की सोलह मूर्तियाँ बनवाएँ और उन्हें सरयू नदी के तट पर ब्राह्मणों को दान दें।
    राम इस सलाह का पालन करते हैं और ब्राह्मण उन्हें आशीर्वाद देते हैं कि यह दान उन्हें
    अगले जीवन में सोलह हजार पत्नियाँ दिलाएगा।
- id: divine-women-visit-rama
  type: story
  keywords:
  - divine women
  - Rama
  - Sarayu
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: During a festival at the Sarayu River, divine beings including gods,
    Yakshas, and celestial women gather to bathe. Some divine women, adorned with
    jewelry, decide to visit Rama. They are enchanted by his beauty and approach him,
    despite being questioned by the guards about their presence at midnight.
  summary_hi: सरयू नदी पर एक उत्सव के दौरान, देवता, यक्ष और दिव्य स्त्रियाँ स्नान
    के लिए एकत्रित होती हैं। कुछ दिव्य स्त्रियाँ, आभूषणों से सजी, राम से मिलने का
    निर्णय लेती हैं। वे उनके सौंदर्य से मोहित होकर उनके पास जाती हैं, हालांकि रक्षक
    उनसे आधी रात को उनकी उपस्थिति के बारे में पूछताछ करते हैं।
- id: ram-meets-devangana
  type: event
  keywords:
  - Ram
  - Devangana
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: The Devanganas, celestial maidens, threatened to drown themselves in
    the river if they could not see Lord Ram. Upon hearing this, Ram summoned them,
    and they expressed their desire to be with him. Ram explained that in this life
    he is committed to one wife, Sita, but promised that in the Dwapara Yuga, he would
    incarnate as Krishna and fulfill their desires.
  summary_hi: देवांगनाओं ने धमकी दी कि यदि वे भगवान राम के दर्शन नहीं कर सकीं तो वे
    नदी में कूदकर प्राण त्याग देंगी। यह सुनकर राम ने उन्हें बुलाया और उन्होंने अपनी
    इच्छा व्यक्त की। राम ने समझाया कि इस जन्म में वे एकपत्नीव्रत हैं, लेकिन द्वापर
    युग में वे कृष्ण के रूप में अवतरित होंगे और उनकी इच्छाओं को पूरा करेंगे।
- id: garunvati-devotion-story
  type: story
  keywords:
  - Garunvati
  - Vishnu-devotion
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Garunvati, upon learning of the death of her father and husband by a
    demon, was filled with grief and began living a life of devotion to Vishnu. She
    performed various religious practices, such as fasting on Ekadashi and bathing
    in sacred rivers, and eventually traveled to Ayodhya to bathe in the holy Sarayu
    river. Her devotion was recognized by Lord Rama, who foretold her future birth
    as Satyabhama, the beloved of Krishna.
  summary_hi: गरुणवती, जब उसने सुना कि उसके पिता और पति को एक राक्षस ने मार डाला है,
    तो वह अत्यंत दुखी हुई और विष्णु की भक्ति में जीवन बिताने लगी। उसने एकादशी का व्रत,
    पवित्र नदियों में स्नान जैसे धार्मिक कार्य किए और अंततः सरयू नदी में स्नान करने
    के लिए अयोध्या गई। उसकी भक्ति को भगवान राम ने पहचाना और उसके भविष्य के जन्म के
    बारे में बताया, जिसमें वह कृष्ण की प्रिय सत्यभामा बनेगी।
- id: pigala-visit-to-rama
  type: story
  keywords:
  - Pigala
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Pigala, a courtesan, visits Lord Rama while he is resting with Sita.
    She approaches him quietly, touches his feet, and pleads for forgiveness for her
    actions. Rama, understanding her plight, assures her that in her next life she
    will serve him in a different form. He blesses her and advises her to live out
    her remaining life peacefully.
  summary_hi: पिगला नामक एक वेश्या राम के पास जाती है जब वह सीता के साथ विश्राम कर
    रहे होते हैं। वह चुपचाप उनके पास जाती है, उनके पैर छूती है और अपने कृत्य के लिए
    क्षमा मांगती है। राम उसकी स्थिति को समझते हैं और उसे आश्वासन देते हैं कि अगले
    जन्म में वह एक अलग रूप में उनकी सेवा करेगी। वह उसे आशीर्वाद देते हैं और शेष जीवन
    शांति से बिताने की सलाह देते हैं।
- id: sita-anger-at-pigala
  type: story
  keywords:
  - Sita
  - Pigala
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita becomes angry upon learning about Pigala's visit to Rama. She questions
    Rama's fidelity and threatens to end her life by drowning in the Sarayu river.
    Rama reassures her of his loyalty and calms her down, explaining the situation
    and his commitment to her.
  summary_hi: सीता पिगला के राम के पास आने की बात सुनकर क्रोधित हो जाती हैं। वह राम
    की निष्ठा पर सवाल उठाती हैं और सरयू नदी में डूबकर अपने जीवन को समाप्त करने की
    धमकी देती हैं। राम उन्हें अपनी निष्ठा का आश्वासन देते हैं और स्थिति को समझाते
    हुए उन्हें शांत करते हैं।
- id: sita-pregnancy-announcement
  type: event
  keywords:
  - Sita
  - pregnancy
  source:
    book: Ananda Ramayan
    sarga: जन्मकाण्डम्‌
  summary_en: One day, Lord Rama heard from a nurse that Sita was pregnant. In joy,
    he distributed various gifts and performed charitable acts.
  summary_hi: एक दिन, भगवान राम ने एक धाय के मुख से सुना कि सीता गर्भवती हैं। खुशी
    में, उन्होंने विभिन्न उपहार वितरित किए और दान किए।
- id: sita-pumsavana-ceremony
  type: event
  keywords:
  - Sita
  - Pumsavana
  source:
    book: Ananda Ramayan
    sarga: जन्मकाण्डम्‌
  summary_en: After a month and a half, Lord Rama, along with sage Vashistha and many
    Brahmins, performed the Pumsavana ceremony for Sita with great enthusiasm.
  summary_hi: एक महीने और आधे के बाद, भगवान राम ने ऋषि वशिष्ठ और कई ब्राह्मणों के
    साथ मिलकर सीता के लिए बड़े उत्साह के साथ पुंसवन संस्कार किया।
- id: sita-pregnancy-ceremony
  type: event
  keywords:
  - sita
  - pregnancy
  - ceremony
  source:
    book: Ananda Ramayan
    sarga: '300'
  summary_en: During the sixth month of Sita's pregnancy, Rama organized a ceremony
    called 'Saumantonayana' with the help of the sage Vasistha. Invitations were sent
    to Sumedha and Janaka, and various gifts were distributed to Brahmins. The event
    was marked by celebrations and offerings.
  summary_hi: सीता के गर्भ के छठे महीने में, राम ने वसिष्ठ ऋषि की मदद से 'सौमन्तोल्नयन'
    नामक एक समारोह का आयोजन किया। सुमेधा और जनक को निमंत्रण भेजा गया और ब्राह्मणों
    को विभिन्न उपहार दिए गए। इस अवसर पर उत्सव और भेंटों का आयोजन किया गया।
- id: sita-welcomed-in-ayodhya
  type: event
  keywords:
  - sita
  - ayodhya
  - welcome
  source:
    book: Ananda Ramayan
    sarga: '300'
  summary_en: When Sita and Rama entered Ayodhya, the women of the city showered them
    with flowers and performed aarti. They offered traditional items like curd, rice,
    and mustard oil. Rama and Sita then proceeded to their palace amidst celebrations.
  summary_hi: जब सीता और राम अयोध्या में प्रवेश करते हैं, तो नगर की स्त्रियाँ उन पर
    फूलों की वर्षा करती हैं और आरती उतारती हैं। वे दही, चावल, और सरसों के तेल जैसे
    पारंपरिक वस्त्र भेंट करती हैं। राम और सीता उत्सव के बीच अपने महल की ओर बढ़ते हैं।
- id: sita-exile-episode
  type: story
  keywords:
  - Sita
  - exile
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Lord Rama, following the advice of his mother Kausalya,
    decides to send Sita into exile. This decision is influenced by the derogatory
    remarks made by a washerman about Sita, which Rama uses as a pretext to adhere
    to societal norms and scriptural injunctions. Rama explains to Sita that this
    separation is necessary to maintain his reputation and fulfill scriptural duties.
  summary_hi: इस प्रकरण में, भगवान राम अपनी माता कौसल्या की सलाह पर सीता को वनवास
    भेजने का निर्णय लेते हैं। यह निर्णय एक धोबी द्वारा सीता के बारे में की गई निंदात्मक
    टिप्पणी से प्रभावित होता है, जिसे राम समाजिक मानदंडों और शास्त्रीय आदेशों का पालन
    करने के बहाने के रूप में उपयोग करते हैं। राम सीता को समझाते हैं कि यह अलगाव उनकी
    प्रतिष्ठा बनाए रखने और शास्त्रीय कर्तव्यों को पूरा करने के लिए आवश्यक है।
- id: sita-abandonment-episode
  type: story
  keywords:
  - Sita
  - abandonment
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Lakshman is troubled by the task of abandoning Sita as per Lord Rama's
    command. He contemplates ending his life instead of carrying out the difficult
    task. However, Vishwakarma appears in disguise and helps Lakshman by creating
    a fake hand of Sita to present to Rama, thus saving Lakshman from his dilemma.
  summary_hi: लक्ष्मण श्रीराम के आदेश के अनुसार सीता का परित्याग करने के कार्य से
    परेशान हैं। वह इस कठिन कार्य को करने के बजाय अपने जीवन को समाप्त करने का विचार
    करते हैं। लेकिन विश्वकर्मा एक बढ़ई के रूप में प्रकट होते हैं और लक्ष्मण की मदद
    करते हैं, सीता का नकली हाथ बनाकर राम को प्रस्तुत करने के लिए, जिससे लक्ष्मण की
    समस्या का समाधान होता है।
- id: sita-in-valmiki-ashram
  type: story
  keywords:
  - Sita
  - Valmiki
  - Ashram
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: After being left in the forest, Sita is welcomed by Valmiki and his
    disciples. She is taken to Valmiki's ashram, where she is treated with great respect
    and care. The women of the ashram shower her with flowers and provide her with
    divine food and fruits, recognizing her as the consort of Lord Vishnu.
  summary_hi: जंगल में छोड़े जाने के बाद, सीता का स्वागत वाल्मीकि और उनके शिष्यों
    द्वारा किया जाता है। उन्हें वाल्मीकि के आश्रम में ले जाया जाता है, जहां उनका बहुत
    सम्मान और देखभाल के साथ स्वागत किया जाता है। आश्रम की महिलाएं उन पर फूल बरसाती
    हैं और उन्हें दिव्य भोजन और फल प्रदान करती हैं, उन्हें भगवान विष्णु की पत्नी के
    रूप में पहचानते हुए।
- id: sita-birth-of-sons
  type: event
  keywords:
  - Sita
  - birth
  - sons
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Sita, residing in Valmiki's ashram, gives birth to twin sons, Lava and
    Kusha. The event is celebrated with great joy and rituals, including the performance
    of Jatakarma and other ceremonies. The gods shower flowers, and celestial beings
    dance in celebration.
  summary_hi: वाल्मीकि के आश्रम में निवास कर रही सीता जुड़वां पुत्रों, लव और कुश,
    को जन्म देती हैं। इस घटना को बड़ी खुशी और अनुष्ठानों के साथ मनाया जाता है, जिसमें
    जातकर्म और अन्य संस्कारों का प्रदर्शन शामिल है। देवता पुष्पवर्षा करते हैं और आकाशीय
    प्राणी नृत्य करते हैं।
- id: rama-yajna-golden-sita
  type: story
  keywords:
  - Rama
  - Yajna
  - Golden-Sita
  source:
    book: Ananda Ramayan
    sarga: '311'
  summary_en: Rama conducted yajnas with a golden statue of Sita, which he donated
    to his guru Vasistha after each yajna. This act of charity resulted in Rama receiving
    sixteen thousand and one hundred wives in his future incarnation as Krishna.
  summary_hi: राम ने यज्ञों का आयोजन किया जिसमें स्वर्णमयी सीता की मूर्ति का उपयोग
    किया गया, जिसे हर यज्ञ के बाद अपने गुरु वसिष्ठ को दान कर दिया करते थे। इस दान
    के फलस्वरूप, कृष्णावतार में उन्हें सोलह हजार एक सौ पत्नियाँ प्राप्त हुईं।
- id: kush-naming-ceremony
  type: event
  keywords:
  - Kush
  - Valmiki
  - Naming-Ceremony
  source:
    book: Ananda Ramayan
    sarga: '311'
  summary_en: Valmiki performed the naming ceremony for Rama's son, Kush, and conducted
    all the necessary rites as per Rama's instructions. Kush grew up happily, bringing
    joy to Sita with his playful antics.
  summary_hi: वाल्मीकि ने राम के पुत्र कुश का नामकरण संस्कार किया और राम के निर्देशानुसार
    सभी आवश्यक संस्कार पूरे किए। कुश खुशी-खुशी बड़ा हुआ और अपने खेल-कूद से सीता को
    प्रसन्न करता था।
- id: sita-children-episode
  type: story
  keywords:
  - Sita
  - Valmiki
  - Lava
  - Kusha
  source:
    book: Ananda Ramayan
    sarga: Sarga 5
  summary_en: Sita, feeling remorseful for leaving her child unattended, returns to
    find Valmiki has created another child using his spiritual power. Valmiki names
    the children Kusha and Lava, and they are raised with great care. Valmiki teaches
    them various skills, including archery and the Ramayana.
  summary_hi: सीता, अपने बच्चे को अकेला छोड़ने के लिए पछतावा महसूस करती हैं और लौटकर
    पाती हैं कि वाल्मीकि ने अपनी आध्यात्मिक शक्ति से एक और बच्चा बनाया है। वाल्मीकि
    बच्चों का नाम कुश और लव रखते हैं और उन्हें बड़े प्यार से पालते हैं। वाल्मीकि उन्हें
    विभिन्न कौशल सिखाते हैं, जिनमें धनुर्विद्या और रामायण शामिल हैं।
- id: lav-confronts-ramas-messengers
  type: story
  keywords:
  - Lav
  - Rama
  - messengers
  source:
    book: Ananda Ramayan
    sarga: Jammakandam
  summary_en: Lav, the son of Sita and Rama, encounters messengers of Rama while collecting
    lotus flowers. The messengers question Lav's authority to take the flowers without
    Rama's permission. Lav identifies himself as a servant of Sage Valmiki and not
    of Rama. Despite the messengers' insistence, Lav stands his ground and eventually
    uses his bow to defend himself, showcasing his valor.
  summary_hi: लव, जो सीता और राम के पुत्र हैं, कमल के फूल इकट्ठा करते समय राम के दूतों
    से मिलते हैं। दूत लव से बिना राम की अनुमति के फूल लेने का अधिकार पूछते हैं। लव
    खुद को महर्षि वाल्मीकि का सेवक बताते हैं, न कि राम का। दूतों के आग्रह के बावजूद,
    लव अपनी जगह पर डटे रहते हैं और अंततः अपने धनुष का उपयोग करके अपनी रक्षा करते हैं,
    जिससे उनका पराक्रम प्रदर्शित होता है।
- id: lava-defeats-ramas-messengers
  type: story
  keywords:
  - Lava
  - Ramayana
  - battle
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Lava, the son of Sita and Rama, encounters the messengers of Rama in
    a garden. Despite being outnumbered, Lava defeats them with his prowess. The messengers
    return to Rama, astonished by Lava's strength, and report the incident.
  summary_hi: लव, जो सीता और राम के पुत्र हैं, एक बगीचे में राम के दूतों से मिलते
    हैं। संख्या में कम होने के बावजूद, लव अपनी वीरता से उन्हें हरा देते हैं। दूत राम
    के पास लौटकर लव की शक्ति से आश्चर्यचकित होते हैं और घटना की रिपोर्ट करते हैं।
- id: sita-hears-of-lavas-bravery
  type: story
  keywords:
  - Sita
  - Lava
  - bravery
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: After the battle, Lava returns to the ashram and narrates the day's
    events to his mother, Sita. Hearing of her son's bravery, Sita feels immense pride
    and joy.
  summary_hi: युद्ध के बाद, लव आश्रम लौटकर अपनी माता सीता को दिन की घटनाएँ सुनाते
    हैं। अपने पुत्र की वीरता सुनकर, सीता को अत्यधिक गर्व और खुशी होती है।
- id: love-and-kusha-meet-rama
  type: story
  keywords:
  - Love
  - Kusha
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Love and Kusha, who resemble Lord Rama, are brought
    before him. Despite being accused of arrogance and mischief, including criticizing
    Rama for abandoning Sita, Rama is pleased with their singing of his life story.
    He forgives them and invites them to return and continue their recital.
  summary_hi: इस प्रकरण में, लव और कुश, जो भगवान राम के समान दिखते हैं, उनके समक्ष
    लाए जाते हैं। सीता के त्याग के लिए राम की आलोचना करने सहित अभिमान और शरारत के
    आरोपों के बावजूद, राम उनके गायन से प्रसन्न होते हैं। वह उन्हें क्षमा कर देते हैं
    और उन्हें वापस आकर अपनी कथा सुनाने के लिए आमंत्रित करते हैं।
- id: lav-kidnaps-ashvamedha-horse
  type: story
  keywords:
  - Lav
  - Ashvamedha
  - horse
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lav, while playing with other sage children, sees the Ashvamedha horse
    wandering near Ram's sacrificial area. Out of curiosity, he captures the horse
    and ties it to a tree near his hut. This act leads to a series of events involving
    Shatrughna and other warriors.
  summary_hi: लव, जो अन्य मुनिकुमारों के साथ खेल रहे थे, राम की यज्ञशाला के पास घूमते
    हुए अश्वमेध के घोड़े को देखते हैं। कौतूहलवश, वह घोड़े को पकड़कर अपनी कुटिया के
    पास एक वृक्ष से बांध देते हैं। इस घटना के कारण शत्रुघ्न और अन्य योद्धाओं के साथ
    कई घटनाएँ घटित होती हैं।
- id: lav-defeats-shatrughna-messengers
  type: story
  keywords:
  - Lav
  - Shatrughna
  - messengers
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: When Shatrughna's messengers arrive to retrieve the Ashvamedha horse,
    Lav uses a magical straw to create a powerful storm. This storm lifts Shatrughna
    and his soldiers into the sky, preventing them from taking the horse.
  summary_hi: जब शत्रुघ्न के दूत अश्वमेध के घोड़े को वापस लाने के लिए आते हैं, तो
    लव एक जादुई तिनके का उपयोग करके एक शक्तिशाली तूफान उत्पन्न करते हैं। यह तूफान
    शत्रुघ्न और उनके सैनिकों को आकाश में उठा ले जाता है, जिससे वे घोड़े को नहीं ले
    जा पाते।
- id: rama-sends-allies-to-aid-shatrughna
  type: event
  keywords:
  - Rama
  - allies
  - Shatrughna
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Upon hearing of the incident with Lav and the Ashvamedha horse, Rama
    sends his allies, including Sugriva, Hanuman, and others, to assist Shatrughna.
    This gathering of forces is meant to address the situation caused by Lav's actions.
  summary_hi: लव और अश्वमेध के घोड़े की घटना के बारे में सुनकर, राम अपने सहयोगियों
    जैसे सुग्रीव, हनुमान और अन्य को शत्रुघ्न की सहायता के लिए भेजते हैं। लव की हरकतों
    से उत्पन्न स्थिति को संभालने के लिए यह सेनाओं का जमावड़ा किया जाता है।
- id: brahmastra-capture-of-lava
  type: story
  keywords:
  - Lava
  - Brahmastra
  source:
    book: Ananda Ramayan
    sarga: जन्मकाण्डम्‌ श्२७
  summary_en: Lava is captured using the Brahmastra and brought to Ayodhya. Despite
    knowing Lava is his son, Rama orders his execution to set an example. However,
    Lakshmana points out that Lava cannot be killed by weapons.
  summary_hi: लव को ब्रह्मास्त्र का उपयोग करके पकड़ा जाता है और अयोध्या लाया जाता
    है। राम, जो जानते हैं कि लव उनका पुत्र है, उदाहरण स्थापित करने के लिए उसकी हत्या
    का आदेश देते हैं, लेकिन लक्ष्मण बताते हैं कि लव को हथियारों से नहीं मारा जा सकता।
- id: lava-growth-with-water
  type: story
  keywords:
  - Lava
  - Water
  source:
    book: Ananda Ramayan
    sarga: जन्मकाण्डम्‌ श्२७
  summary_en: Lava reveals that he will grow with water, as foretold by Valmiki. When
    water is poured on him, he grows to the height of seven palm trees. Lakshmana
    accuses him of lying, but Lava explains that his growth is a sign of his impending
    death.
  summary_hi: लव बताते हैं कि वह पानी के साथ बढ़ेगा, जैसा कि वाल्मीकि ने भविष्यवाणी
    की थी। जब उस पर पानी डाला जाता है, तो वह सात ताड़ के पेड़ों की ऊँचाई तक बढ़ जाता
    है। लक्ष्मण उस पर झूठ बोलने का आरोप लगाते हैं, लेकिन लव बताते हैं कि उसकी वृद्धि
    उसकी आसन्न मृत्यु का संकेत है।
- id: kush-lav-battle-episode
  type: story
  keywords:
  - Kush
  - Lav
  - Lakshman
  - battle
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Kush confronts Lakshman after hearing about the mistreatment
    of Lav. Armed with a bow and arrows, Kush challenges Lakshman to a battle. Despite
    Lakshman's attempts, his arrows prove ineffective against Kush. The battle escalates
    until Kush uses a powerful weapon, the Garudastra, which causes Lakshman to fall
    from his chariot. Seeing this, Ram intervenes by countering with the Brahmastra,
    neutralizing the Garudastra.
  summary_hi: इस प्रकरण में, कुश लव के साथ हुए छल के बारे में सुनकर लक्ष्मण का सामना
    करता है। धनुष और बाण से सुसज्जित कुश लक्ष्मण को युद्ध के लिए चुनौती देता है। लक्ष्मण
    के प्रयासों के बावजूद, उनके बाण कुश पर बेअसर साबित होते हैं। युद्ध तब तक बढ़ता
    है जब तक कि कुश गरुड़ास्त्र का उपयोग नहीं करता, जिससे लक्ष्मण रथ से गिर जाते हैं।
    इसे देखकर राम हस्तक्षेप करते हैं और ब्रह्मास्त्र का उपयोग करके गरुड़ास्त्र को
    निष्क्रिय कर देते हैं।
- id: lav-kush-sing-ramayana
  type: event
  keywords:
  - Lav
  - Kush
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Lav and Kush, the sons of Sita and Rama, sing the Ramayana in the court
    of Rama. The audience, including Rama, is amazed by their performance and the
    revelation of their parentage.
  summary_hi: लव और कुश, जो सीता और राम के पुत्र हैं, राम के दरबार में रामायण का गान
    करते हैं। दर्शक, जिसमें राम भी शामिल हैं, उनके प्रदर्शन और उनकी वंशावली के रहस्योद्घाटन
    से चकित हो जाते हैं।
- id: sita-trial-by-oath
  type: event
  keywords:
  - Sita
  - Oath
  - Trial
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Rama decides to bring Sita to the court to take an oath by the river
    Ganga to prove her purity and innocence. This event is witnessed by sages and
    the public to affirm Sita's chastity.
  summary_hi: राम सीता को दरबार में लाने का निर्णय लेते हैं ताकि वह गंगा नदी के किनारे
    शपथ लेकर अपनी पवित्रता और निर्दोषता साबित कर सकें। इस घटना को ऋषि और जनता द्वारा
    सीता की पवित्रता की पुष्टि के लिए देखा जाता है।
- id: sita-oath-episode
  type: event
  keywords:
  - Sita
  - oath
  - Ram
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Sita is brought to a grand assembly to take an oath
    in front of sages and citizens to prove her purity. Valmiki accompanies her, and
    the assembly is eager to witness the event. Ram expresses his willingness to accept
    Sita if she proves her purity.
  summary_hi: इस प्रकरण में, सीता को ऋषियों और नागरिकों के सामने अपनी पवित्रता साबित
    करने के लिए एक भव्य सभा में शपथ लेने के लिए लाया जाता है। वाल्मीकि उनके साथ होते
    हैं, और सभा इस घटना को देखने के लिए उत्सुक होती है। राम अपनी पवित्रता साबित करने
    पर सीता को स्वीकार करने की इच्छा व्यक्त करते हैं।
- id: valmiki-introduction-of-kusha-and-lava
  type: event
  keywords:
  - Valmiki
  - Kusha
  - Lava
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Valmiki introduces Kusha and Lava to Ram, explaining their origins.
    Kusha is introduced as Ram's son, and Lava as Valmiki's creation from water droplets.
    Valmiki assures Ram of their legitimacy and purity.
  summary_hi: वाल्मीकि कुश और लव को राम से मिलवाते हैं और उनके उत्पत्ति की व्याख्या
    करते हैं। कुश को राम का पुत्र और लव को जल की बूंदों से वाल्मीकि की रचना के रूप
    में प्रस्तुत किया जाता है। वाल्मीकि राम को उनकी वैधता और पवित्रता का आश्वासन देते
    हैं।
- id: sita-earth-entry
  type: event
  keywords:
  - Sita
  - Earth
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: '333'
  summary_en: Sita, after expressing her devotion to Rama, requests the Earth to take
    her in if she has never thought of anyone else. In response, a divine throne emerges
    from the ground, and the Earth goddess embraces Sita, seating her on the throne.
    Sita then descends into the Earth, leaving the onlookers astonished.
  summary_hi: सीता, राम के प्रति अपनी भक्ति व्यक्त करने के बाद, पृथ्वी से अनुरोध करती
    हैं कि यदि उन्होंने कभी किसी और के बारे में नहीं सोचा है, तो वह उन्हें अपने में
    समा ले। इसके जवाब में, एक दिव्य सिंहासन जमीन से निकलता है, और पृथ्वी देवी सीता
    को गले लगाकर सिंहासन पर बैठा देती हैं। इसके बाद सीता पृथ्वी में समा जाती हैं,
    जिससे दर्शक चकित रह जाते हैं।
- id: rama-plea-to-earth
  type: event
  keywords:
  - Rama
  - Earth
  - Sita
  source:
    book: Ananda Ramayan
    sarga: '333'
  summary_en: Upon witnessing Sita being absorbed by the Earth, Rama leaps from his
    throne and pleads with the Earth to return Sita. He acknowledges the Earth as
    the mother of all beings and praises her as the source of all prosperity and life.
  summary_hi: सीता को पृथ्वी में समाते देख राम अपने सिंहासन से कूद पड़ते हैं और पृथ्वी
    से सीता को वापस करने की प्रार्थना करते हैं। वे पृथ्वी को सभी प्राणियों की माता
    के रूप में स्वीकार करते हैं और उसे सभी समृद्धि और जीवन का स्रोत बताते हैं।
- id: sita-returns-to-earth
  type: event
  keywords:
  - Sita
  - Earth
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Sita begins to return to the Earth, and despite Rama's
    pleas, she continues to descend. In anger, Rama instructs Lakshmana to bring his
    bow, intending to punish the Earth. However, the Earth, personified, lifts Sita
    and places her in Rama's lap, offering her respects and calming Rama's anger.
    The gods celebrate with music and flowers, and the Earth disappears after offering
    Sita and a golden throne to Rama.
  summary_hi: इस प्रकरण में, सीता पृथ्वी में समाने लगती हैं, और राम के आग्रह के बावजूद,
    वह नीचे जाती रहती हैं। क्रोधित होकर, राम लक्ष्मण को अपना धनुष लाने का आदेश देते
    हैं, पृथ्वी को दंड देने के इरादे से। हालांकि, पृथ्वी, जो व्यक्तित्व धारण करती
    है, सीता को उठाकर राम की गोद में बिठा देती है, अपनी श्रद्धांजलि अर्पित करती है
    और राम के क्रोध को शांत करती है। देवता संगीत और फूलों के साथ उत्सव मनाते हैं,
    और पृथ्वी सीता और एक स्वर्णिम सिंहासन राम को अर्पित करके अदृश्य हो जाती है।
- id: birth-of-sons-to-ramas-brothers
  type: story
  keywords:
  - birth
  - sons
  - Rama's brothers
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: After some time, Mandavi and Shrutakirti conceived together. Sita was
    very happy at this time, and Rama performed the necessary rituals. Eventually,
    Mandavi gave birth to a son named Pushkar and another named Taksha, while Shrutakirti
    gave birth to a son named Suvahu and another named Yupaketu. Sage Vashistha performed
    the naming ceremonies for all the children.
  summary_hi: कुछ समय बाद, मांडवी और श्रुतकीर्ति ने एक साथ गर्भ धारण किया। इस समय
    सीता बहुत खुश थीं और राम ने आवश्यक संस्कार किए। अंततः मांडवी ने पुष्कर और तक्ष
    नामक पुत्रों को जन्म दिया, जबकि श्रुतकीर्ति ने सुवाहु और यूपकेतु नामक पुत्रों
    को जन्म दिया। ऋषि वशिष्ठ ने सभी बच्चों के नामकरण संस्कार किए।
- id: kush-lava-upanayana-ceremony
  type: event
  keywords:
  - upanayana
  - kush
  - lava
  source:
    book: Ananda Ramayan
    sarga: '9'
  summary_en: Rama decides to perform the Upanayana ceremony for his sons, Kush and
    Lava. He consults astrologers to find an auspicious date, and preparations are
    made for the grand event, including inviting kings, friends, and sages, and decorating
    the city of Ayodhya.
  summary_hi: राम ने अपने पुत्रों कुश और लव के उपनयन संस्कार का आयोजन करने का निर्णय
    लिया। उन्होंने ज्योतिषियों से शुभ मुहूर्त जानने के लिए परामर्श किया, और इस भव्य
    आयोजन के लिए तैयारियाँ की गईं, जिसमें राजाओं, मित्रों और ऋषियों को आमंत्रित करना
    और अयोध्या नगरी को सजाना शामिल था।
- id: lav-marriage-episode
  type: event
  keywords:
  - Lav
  - marriage
  source:
    book: Ananda Ramayan
    sarga: सर्गः ३
  summary_en: The passage describes the marriage of Lav, the son of Rama and Sita.
    Sunanda suggests to Sumati to accept Lav as her husband and place a garland around
    his neck. The event is celebrated with music, dance, and the presence of many
    kings who are unable to challenge Rama. The auspicious time for the marriage is
    determined by the sages.
  summary_hi: इस अंश में राम और सीता के पुत्र लव के विवाह का वर्णन है। सुनंदा सुमति
    से लव को अपना पति मानकर उसके गले में वरमाला डालने का सुझाव देती हैं। इस आयोजन
    को संगीत, नृत्य और कई राजाओं की उपस्थिति के साथ मनाया जाता है, जो राम को चुनौती
    देने में असमर्थ हैं। विवाह के लिए शुभ मुहूर्त ऋषियों द्वारा निर्धारित किया जाता
    है।
- id: rama-sea-bridge-episode
  type: story
  keywords:
  - Rama
  - sea bridge
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Rama constructs a bridge across the sea to reach Lanka, where he battles
    and defeats the demon king Ravana. This episode highlights Rama's determination
    and leadership in rescuing his wife Sita.
  summary_hi: राम समुद्र पर एक सेतु का निर्माण करते हैं ताकि लंका पहुँच सकें, जहाँ
    वे राक्षस राजा रावण से युद्ध करते हैं और उसे पराजित करते हैं। यह प्रकरण राम के
    दृढ़ संकल्प और नेतृत्व को दर्शाता है, जो अपनी पत्नी सीता को बचाने के लिए प्रयासरत
    हैं।
- id: lakshmana-character
  type: character
  keywords:
  - Lakshmana
  - Rama's brother
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Lakshmana, the son of Sumitra and a devoted brother to Rama, is portrayed
    as a loyal and brave warrior. He plays a crucial role in assisting Rama during
    their exile and in the battle against Ravana.
  summary_hi: लक्ष्मण, सुमित्रा के पुत्र और राम के समर्पित भाई, एक वफादार और बहादुर
    योद्धा के रूप में चित्रित किए गए हैं। वे अपने वनवास के दौरान और रावण के खिलाफ
    युद्ध में राम की सहायता करने में महत्वपूर्ण भूमिका निभाते हैं।
- id: bharata-character
  type: character
  keywords:
  - Bharata
  - Rama's brother
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Bharata, the son of Kaikeyi and Rama's younger brother, is known for
    his unwavering devotion to Rama. Despite being offered the throne, he chooses
    to rule Ayodhya as Rama's representative, awaiting his brother's return.
  summary_hi: भरत, कैकेयी के पुत्र और राम के छोटे भाई, अपनी अटूट भक्ति के लिए जाने
    जाते हैं। सिंहासन की पेशकश के बावजूद, वे अयोध्या पर राम के प्रतिनिधि के रूप में
    शासन करना चुनते हैं, अपने भाई की वापसी की प्रतीक्षा करते हुए।
- id: rama-exile-return
  type: story
  keywords:
  - Rama
  - Sita
  - exile
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, who had previously exiled Sita, later called her back. He is depicted
    as a ruler who performed sacrifices and engaged in battles with his sons, Lava
    and Kusha, to complete his sacrifices.
  summary_hi: राम, जिन्होंने पहले सीता का त्याग किया था, बाद में उन्हें वापस बुला
    लिया। उन्हें एक ऐसे शासक के रूप में चित्रित किया गया है जिन्होंने यज्ञ किए और
    अपने पुत्रों लव और कुश के साथ युद्ध किया।
- id: kush-marriage
  type: event
  keywords:
  - Kusha
  - marriage
  - Champika
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Kusha, the son of Rama and Sita, is described as a young, unmarried
    man skilled in archery and a disciple of the sage Valmiki. Champika chooses Kusha
    as her husband by placing a garland around his neck during a swayamvara ceremony.
  summary_hi: कुश, जो राम और सीता के पुत्र हैं, को एक युवा, अविवाहित व्यक्ति के रूप
    में वर्णित किया गया है जो धनुर्विद्या में निपुण और महर्षि वाल्मीकि के शिष्य हैं।
    चम्पिका ने स्वयंवर समारोह में उनके गले में वरमाला डालकर उन्हें अपना पति चुना।
- id: lav-sumati-marriage-episode
  type: event
  keywords:
  - Lav
  - Sumati
  - marriage
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Lav, the son of Rama and Sita, is married to Sumati.
    The event is marked by music, dance, and celebrations. King Bhurikirti, pleased
    with the union, places Sumati in Lav's lap, and both Rama and Sita express their
    happiness at the sight.
  summary_hi: इस प्रकरण में, राम और सीता के पुत्र लव का विवाह सुमति से होता है। इस
    आयोजन में संगीत, नृत्य और उत्सव मनाए जाते हैं। राजा भूरिकीति, इस मिलन से प्रसन्न
    होकर, सुमति को लव की गोद में बिठाते हैं और राम तथा सीता दोनों इस दृश्य को देखकर
    प्रसन्न होते हैं।
- id: annapurna-appears-to-agastya
  type: story
  keywords:
  - Annapurna
  - Agastya
  source:
    book: Ananda Ramayan
    sarga: Vivaah Kaandam
  summary_en: Annapurna, pleased with Agastya's penance, appears before him and gives
    him a pot filled with food. She instructs Agastya's wife, Lopamudra, to serve
    the food to the guests. After this, Annapurna disappears.
  summary_hi: अन्नपूर्णा, अगस्त्य की तपस्या से प्रसन्न होकर, उनके सामने प्रकट होती
    हैं और उन्हें भोजन से भरा एक पात्र देती हैं। वह अगस्त्य की पत्नी लोपामुद्रा को
    अतिथियों को भोजन परोसने का निर्देश देती हैं। इसके बाद अन्नपूर्णा अंतर्धान हो जाती
    हैं।
- id: ram-receives-gifts-from-agastya
  type: story
  keywords:
  - Ram
  - Agastya
  source:
    book: Ananda Ramayan
    sarga: Vivaah Kaandam
  summary_en: After being honored by Agastya, Ram is given a pair of divine bangles
    and earrings for Sita. Ram, along with Agastya, travels in the Pushpaka Vimana,
    exploring the Dandakaranya forest.
  summary_hi: अगस्त्य द्वारा सत्कृत होने के बाद, राम को सीता के लिए दिव्य कंगन और
    कुंडल दिए जाते हैं। राम, अगस्त्य के साथ पुष्पक विमान में दंडकारण्य वन की यात्रा
    करते हैं।
- id: apsaras-dance-heard-by-ram
  type: story
  keywords:
  - Apsaras
  - Ram
  source:
    book: Ananda Ramayan
    sarga: Vivaah Kaandam
  summary_en: While resting by a lake, Ram hears the melodious sound of singing and
    dancing by Apsaras. Curious about the source, Ram asks Agastya to explain the
    origin of these sounds.
  summary_hi: एक सरोवर के किनारे विश्राम करते समय, राम को अप्सराओं के गायन और नृत्य
    की मधुर ध्वनि सुनाई देती है। ध्वनि के स्रोत के बारे में जानने की उत्सुकता से,
    राम अगस्त्य से इन ध्वनियों की उत्पत्ति के बारे में पूछते हैं।
- id: friendship-between-gandharva-and-naga-maidens
  type: story
  keywords:
  - Gandharva
  - Naga
  source:
    book: Ananda Ramayan
    sarga: Vivaah Kaandam
  summary_en: Long ago, five Gandharva maidens and seven Naga maidens, both in their
    youth, formed a friendship and regularly played in a lake. Their activities were
    observed by a sage performing penance nearby.
  summary_hi: बहुत समय पहले, पाँच गंधर्व कन्याएँ और सात नाग कन्याएँ, दोनों अपनी युवावस्था
    में, एक झील में मित्रता कर नियमित रूप से खेलती थीं। उनके क्रियाकलापों को पास में
    तपस्या कर रहे एक ऋषि ने देखा।
- id: madanasundari-swayamvara
  type: event
  keywords:
  - swayamvara
  - madanasundari
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: In the city of Kantipuri, a swayamvara ceremony was taking place for
    Madanasundari. During the event, Yūpaketu arrived and, using a magical weapon,
    enchanted the attendants, allowing him to take Madanasundari with him. Madanasundari
    was initially worried about the numerous kings and their armies present, but Yūpaketu
    assured her of his victory and promised to take her to Ayodhya.
  summary_hi: कांतिपुरी में मदनसुंदरी का स्वयंवर समारोह हो रहा था। इस दौरान यूपकेतु
    आया और एक जादुई अस्त्र का उपयोग करके उपस्थित लोगों को मोहित कर दिया, जिससे वह
    मदनसुंदरी को अपने साथ ले जा सका। मदनसुंदरी पहले तो उपस्थित राजाओं और उनकी सेनाओं
    को देखकर चिंतित हुई, लेकिन यूपकेतु ने उसे अपनी विजय का आश्वासन दिया और अयोध्या
    ले जाने का वादा किया।
- id: yupa-ketu-battle
  type: event
  keywords:
  - Yupa Ketu
  - battle
  source:
    book: Ananda Ramayan
    sarga: Vivaahakanda
  summary_en: Yupa Ketu, the son of Shatrughna, engages in a fierce battle after abducting
    Madanasundari. The kings, angered by the abduction, attack Yupa Ketu with their
    armies. Yupa Ketu uses his skills and weapons to defeat the attacking kings and
    their forces.
  summary_hi: यूपकेतु, शत्रुघ्न के पुत्र, मदनसुंदरी का हरण करने के बाद एक भयंकर युद्ध
    में शामिल होते हैं। अपहरण से क्रोधित होकर राजा अपनी सेनाओं के साथ यूपकेतु पर हमला
    करते हैं। यूपकेतु अपनी कौशल और हथियारों का उपयोग करके आक्रमणकारी राजाओं और उनकी
    सेनाओं को पराजित करते हैं।
- id: durvasa-visit-to-ayodhya
  type: event
  keywords:
  - Durvasa
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Durvasa Muni, accompanied by sixty thousand disciples, visits Ayodhya
    to meet Lord Rama. He challenges Rama by asking for a meal prepared without using
    conventional means, to be served within a short time. Rama accepts the challenge,
    and Durvasa goes to bathe in the Sarayu river.
  summary_hi: दुर्वासा मुनि, साठ हजार शिष्यों के साथ, भगवान राम से मिलने के लिए अयोध्या
    आते हैं। वह राम को चुनौती देते हैं कि बिना पारंपरिक साधनों के भोजन तैयार करके
    एक मुहूर्त के भीतर परोसा जाए। राम इस चुनौती को स्वीकार करते हैं और दुर्वासा सरयू
    नदी में स्नान करने जाते हैं।
- id: indra-brings-kalpavriksha
  type: event
  keywords:
  - Indra
  - Kalpavriksha
  source:
    book: Ananda Ramayan
    sarga: '2'
  summary_en: Indra, upon learning about Durvasa's challenge to Rama, decides to help
    by bringing the Kalpavriksha and Parijata trees from heaven. He arrives in Ayodhya
    and presents them to Rama, enabling him to fulfill Durvasa's request.
  summary_hi: इंद्र, दुर्वासा की राम को दी गई चुनौती के बारे में जानकर, स्वर्ग से
    कल्पवृक्ष और पारिजात वृक्ष लाकर मदद करने का निर्णय लेते हैं। वह अयोध्या पहुंचते
    हैं और उन्हें राम को प्रस्तुत करते हैं, जिससे राम दुर्वासा की मांग को पूरा कर
    सकें।
- id: durvasa-praises-rama
  type: story
  keywords:
  - Durvasa
  - Rama
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ ( पूर्वा्दम ) ३९७
  summary_en: Sage Durvasa praises Lord Rama in front of the gods, acknowledging his
    divine role in the destruction of evil and the protection of the universe. Durvasa
    seeks forgiveness for any offenses and departs with his disciples after receiving
    Rama's blessings.
  summary_hi: ऋषि दुर्वासा देवताओं के सामने भगवान राम की स्तुति करते हैं, उनके दैवीय
    कार्यों और ब्रह्मांड की रक्षा में उनकी भूमिका को स्वीकार करते हैं। दुर्वासा किसी
    भी अपराध के लिए क्षमा मांगते हैं और राम के आशीर्वाद प्राप्त कर अपने शिष्यों के
    साथ प्रस्थान करते हैं।
- id: churning-of-ocean
  type: event
  keywords:
  - Churning of Ocean
  - Samudra Manthan
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ ( पूर्वा्दम ) ३९७
  summary_en: The passage recounts the event of the churning of the ocean (Samudra
    Manthan), where Lord Rama's divine intervention helped the gods obtain fourteen
    precious treasures, including Lakshmi, the moon, and the nectar of immortality.
  summary_hi: इस अंश में समुद्र मंथन की घटना का वर्णन है, जहां भगवान राम की दिव्य
    सहायता से देवताओं ने लक्ष्मी, चंद्रमा और अमृत सहित चौदह बहुमूल्य रत्न प्राप्त
    किए।
- id: rama-instructs-gods
  type: story
  keywords:
  - Rama
  - Gods
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ ( पूर्वा्दम ) ३९७
  summary_en: After the praise by Durvasa, Lord Rama instructs the gods to return
    to their respective abodes, taking the divine trees Kalpavriksha and Parijata
    with them. The gods, led by Brihaspati, agree to follow Rama's instructions.
  summary_hi: दुर्वासा की स्तुति के बाद, भगवान राम देवताओं को अपने-अपने लोकों में
    लौटने का निर्देश देते हैं, साथ ही कल्पवृक्ष और पारिजात वृक्ष को भी ले जाने को
    कहते हैं। बृहस्पति के नेतृत्व में देवता राम के निर्देशों का पालन करने के लिए सहमत
    होते हैं।
- id: shambuka-vadha-episode
  type: story
  keywords:
  - Shambuka
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the Ananda Ramayan, there is a mention of the killing of Shambuka,
    a Shudra ascetic, by Lord Rama. This act was done to uphold the dharma of the
    time, as Shambuka was performing penance that was not allowed for his caste.
  summary_hi: आनंदरामायण में शम्बुक नामक शूद्र तपस्वी की हत्या का उल्लेख है, जिसे
    भगवान राम ने किया था। यह कार्य उस समय के धर्म को बनाए रखने के लिए किया गया था,
    क्योंकि शम्बुक अपने जाति के लिए निषिद्ध तपस्या कर रहा था।
- id: krishna-dwaraka-destruction
  type: story
  keywords:
  - Krishna
  - Dwaraka
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The Ananda Ramayan describes the destruction of Dwaraka, the city of
    Lord Krishna, due to a curse from a Brahmin. This event marks the end of Krishna's
    lineage and the submergence of Dwaraka into the sea.
  summary_hi: आनंदरामायण में भगवान कृष्ण की नगरी द्वारका के विनाश का वर्णन है, जो
    एक ब्राह्मण के शाप के कारण हुआ था। यह घटना कृष्ण के वंश के अंत और द्वारका के समुद्र
    में विलीन होने को दर्शाती है।
- id: krishna-goloka-journey
  type: story
  keywords:
  - Krishna
  - Goloka
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the Ananda Ramayan, it is mentioned that Lord Krishna, after his
    earthly pastimes, embarked on a journey to Goloka. His departure was marked by
    being struck by a hunter's arrow, symbolizing the end of his avatar.
  summary_hi: आनंदरामायण में उल्लेख है कि भगवान कृष्ण ने अपनी पृथ्वीली लीलाओं के बाद
    गोलोक की यात्रा की। उनके प्रस्थान को एक शिकारी के बाण से चिह्नित किया गया, जो
    उनके अवतार के अंत का प्रतीक है।
- id: sita-ashram-visit
  type: story
  keywords:
  - Sita
  - Valmiki Ashram
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The Ananda Ramayan narrates an episode where Lord Rama secretly visits
    Valmiki's ashram to see Sita and his son. Despite publicly renouncing Sita, Rama's
    visit shows his continued love and concern for his family.
  summary_hi: आनंदरामायण में एक घटना का वर्णन है जहाँ भगवान राम गुप्त रूप से वाल्मीकि
    के आश्रम में सीता और अपने पुत्र से मिलने जाते हैं। सीता का सार्वजनिक रूप से परित्याग
    करने के बावजूद, राम की यह यात्रा उनके परिवार के प्रति उनके निरंतर प्रेम और चिंता
    को दर्शाती है।
- id: krishna-putana-slaying
  type: story
  keywords:
  - Krishna
  - Putana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The Ananda Ramayan recounts the story of Lord Krishna slaying the demoness
    Putana during his childhood. This act is one of the many divine feats performed
    by Krishna to protect the world from evil forces.
  summary_hi: आनंदरामायण में भगवान कृष्ण द्वारा अपने बचपन में राक्षसी पूतना का वध
    करने की कहानी का वर्णन है। यह कार्य उन कई दिव्य कारनामों में से एक है जो कृष्ण
    ने दुनिया को बुरी शक्तियों से बचाने के लिए किए थे।
- id: ram-tadaka-slaying
  type: story
  keywords:
  - Rama
  - Tadaka
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the Ananda Ramayan, it is mentioned that Lord Rama, during his childhood,
    killed the demoness Tadaka. This act was one of his early demonstrations of valor
    and righteousness.
  summary_hi: आनंदरामायण में उल्लेख है कि भगवान राम ने अपने बचपन में राक्षसी ताड़का
    का वध किया। यह कार्य उनके प्रारंभिक वीरता और धर्म के प्रदर्शन में से एक था।
- id: mulakasura-curse-and-death
  type: story
  keywords:
  - Mulakasura
  - curse
  - Sita
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Mulakasura, a demon, was granted a boon that he could not be killed
    by any man. However, due to his disrespectful words about Sita, a sage cursed
    him that he would be killed by Sita herself. Eventually, due to the sage's curse
    and Brahma's boon, Mulakasura's death was destined to be at the hands of Sita.
  summary_hi: मूलकासुर, एक राक्षस, को यह वरदान मिला था कि उसे किसी पुरुष द्वारा नहीं
    मारा जा सकेगा। लेकिन सीता के बारे में अपमानजनक शब्द कहने के कारण एक ऋषि ने उसे
    शाप दिया कि वह सीता के हाथों मारा जाएगा। अंततः ऋषि के शाप और ब्रह्मा के वरदान
    के कारण, मूलकासुर की मृत्यु सीता के हाथों निश्चित हो गई।
- id: sita-separation-grief
  type: story
  keywords:
  - Sita
  - separation
  - grief
  source:
    book: Ananda Ramayan
    sarga: '5'
  summary_en: Sita, in her grief over separation from Rama, engages in various rituals
    and vows, including worshiping the Sun God every Sunday. She remains sleepless
    and distressed, unable to find solace anywhere. Her companions, like Urmila and
    others, also suffer from the absence of their husbands, leading a joyless life.
  summary_hi: सीता, राम से वियोग के दुःख में, विभिन्न अनुष्ठानों और व्रतों में संलग्न
    रहती हैं, जिसमें हर रविवार को सूर्य भगवान की पूजा शामिल है। वह रात-दिन जागती रहती
    हैं और कहीं भी शांति नहीं पातीं। उनकी सहेलियाँ, जैसे उर्मिला और अन्य, भी अपने
    पतियों के वियोग में दुखी रहती हैं और एक नीरस जीवन जीती हैं।
- id: hanuman-garuda-arrival
  type: event
  keywords:
  - Hanuman
  - Garuda
  - arrival
  source:
    book: Ananda Ramayan
    sarga: '5'
  summary_en: During Sita's period of intense suffering, Hanuman and Garuda arrive
    at the scene. Sita experiences an auspicious twitch in her left eye and arm, which
    she interprets as a good omen, bringing her some relief. Hanuman and Garuda then
    convey Rama's message to Sita through Yupaketu.
  summary_hi: सीता के कठिन यंत्रणा के समय, हनुमान और गरुड़ वहाँ पहुँचते हैं। सीता
    की बायीं आँख और भुजा फड़कती है, जिसे वह शुभ शकुन मानती हैं और इससे उन्हें कुछ
    राहत मिलती है। हनुमान और गरुड़ यूपकेतु के माध्यम से राम का संदेश सीता तक पहुँचाते
    हैं।
- id: sita-reunion-with-rama
  type: story
  keywords:
  - Sita
  - Rama
  - reunion
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita, after a long period of separation, is reunited with Rama. She
    expresses her longing and the hardships she faced during their separation. Rama
    comforts her, and they share a tender moment, symbolizing their deep love and
    connection.
  summary_hi: सीता, लंबे समय के वियोग के बाद, राम से पुनः मिलती हैं। वह अपने वियोग
    के दौरान की कठिनाइयों और उनकी याद में बिताए समय का वर्णन करती हैं। राम उन्हें
    सांत्वना देते हैं और वे एक मधुर क्षण साझा करते हैं, जो उनके गहरे प्रेम और संबंध
    का प्रतीक है।
- id: sita-battles-mulakasura
  type: story
  keywords:
  - Sita
  - Mulakasura
  source:
    book: Ananda Ramayan
    sarga: राज्यकांडे पूर्वार्धे पंचमः सर्गः
  summary_en: In this episode, Sita, upon Rama's instruction, mounts a chariot to
    confront the demon Mulakasura. She sends her shadow form to battle, which circles
    Rama and proceeds with a thunderous sound. Meanwhile, the vanaras disrupt Mulakasura's
    rituals, and he angrily heads to battle. Despite setbacks, Mulakasura reaches
    the battlefield, where Sita, accompanied by Lakshmana and other warriors, prepares
    to face him.
  summary_hi: इस प्रकरण में, राम के निर्देश पर सीता एक रथ पर सवार होकर राक्षस मूलकासुर
    का सामना करने जाती हैं। वह अपनी छायारूपिणी को युद्ध के लिए भेजती हैं, जो राम की
    प्रदक्षिणा करती है और गर्जना करती हुई आगे बढ़ती है। इस बीच, वानर मूलकासुर के हवनकर्म
    को बाधित करते हैं, और वह क्रोधित होकर युद्ध के लिए निकलता है। बाधाओं के बावजूद,
    मूलकासुर रणभूमि में पहुँचता है, जहाँ सीता लक्ष्मण और अन्य योद्धाओं के साथ उसका
    सामना करने के लिए तैयार होती हैं।
- id: sita-battle-with-mulakasura
  type: story
  keywords:
  - Sita
  - Mulakasura
  source:
    book: Ananda Ramayan
    sarga: '6'
  summary_en: In this episode, Sita engages in a fierce battle with the demon Mulakasura.
    Despite Mulakasura's attempts to overpower her with various celestial weapons,
    Sita skillfully counters each attack. Eventually, she uses a powerful weapon to
    defeat Mulakasura, causing the earth to tremble and the ocean to surge.
  summary_hi: इस प्रकरण में, सीता राक्षस मूलकासुर के साथ एक भयंकर युद्ध में संलग्न
    होती हैं। मूलकासुर के विभिन्न दिव्य अस्त्रों से आक्रमण के बावजूद, सीता कुशलता
    से प्रत्येक हमले का प्रतिकार करती हैं। अंततः, वह एक शक्तिशाली अस्त्र का उपयोग
    करके मूलकासुर को पराजित करती हैं, जिससे पृथ्वी कांपने लगती है और समुद्र में लहरें
    उठने लगती हैं।
- id: rama-coronation-of-vibhishana
  type: event
  keywords:
  - Rama
  - Vibhishana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After taking leave from Rama, Vibhishana requests Rama to make him the
    king of Lanka as his father had not given him the authority. Rama agrees and coronates
    Vibhishana as the king of Lanka. A grand celebration follows, and Vibhishana honors
    Rama, Sita, and Lakshmana with jewels and garments.
  summary_hi: राम से आज्ञा लेकर, विभीषण राम से अनुरोध करते हैं कि उन्हें लंका का राजा
    बना दें क्योंकि उनके पिता ने उन्हें अधिकार नहीं दिया था। राम सहमत होते हैं और
    विभीषण का लंका के राजा के रूप में अभिषेक करते हैं। इसके बाद एक भव्य उत्सव मनाया
    जाता है, और विभीषण राम, सीता और लक्ष्मण को रत्न और वस्त्रों से सम्मानित करते हैं।
- id: kapila-idol-gift
  type: story
  keywords:
  - Kapila
  - Idol
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Vibhishana gifts Rama an idol of Kapila, which was previously worshipped
    by Ravana. The idol was created by Kapila using his mental powers and was worshipped
    by him for a long time before it came into Indra's possession and later to Ravana.
  summary_hi: विभीषण राम को कपिल की एक मूर्ति भेंट करते हैं, जिसकी पहले रावण पूजा
    करता था। यह मूर्ति कपिल ने अपनी मानसिक शक्तियों से बनाई थी और इसे लंबे समय तक
    उन्होंने स्वयं पूजा था, इसके बाद यह इंद्र के पास और फिर रावण के पास आई।
- id: sita-ashoka-vatika-tour
  type: event
  keywords:
  - Sita
  - Ashoka Vatika
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama takes Sita on a tour of Ashoka Vatika, showing her the places where
    she stayed during her captivity. Sita, filled with emotions, offers her gratitude
    to Rama for rescuing her from the clutches of the Rakshasis.
  summary_hi: राम सीता को अशोक वाटिका का दौरा कराते हैं, उन्हें वे स्थान दिखाते हैं
    जहाँ उन्होंने अपनी कैद के दौरान समय बिताया था। सीता भावुक होकर राम को राक्षसियों
    के चंगुल से बचाने के लिए धन्यवाद देती हैं।
- id: ravana-indra-battle
  type: event
  keywords:
  - Ravana
  - Indra
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू)
  summary_en: Ravana fought a battle with Indra and defeated him. He took Indra's
    idol and worshipped it for a long time. Later, Vibhishana offered this idol to
    Rama, who accepted it with love and placed it on his Pushpaka Vimana.
  summary_hi: रावण ने इन्द्र के साथ युद्ध किया और उन्हें पराजित किया। उसने इन्द्र
    की मूर्ति छीन ली और लंबे समय तक उसकी पूजा की। बाद में, विभीषण ने यह मूर्ति राम
    को अर्पित की, जिसे राम ने प्रेमपूर्वक स्वीकार किया और अपने पुष्पक विमान पर रखा।
- id: sita-ashok-vatika-tour
  type: event
  keywords:
  - Sita
  - Ashok Vatika
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू)
  summary_en: Sita, along with Rama and others, visited the Ashok Vatika where she
    was held captive by Ravana. She showed Rama the places where she used to bathe
    and perform other activities, and expressed her gratitude to Trijata for protecting
    her during her captivity.
  summary_hi: सीता, राम और अन्य लोगों के साथ अशोक वाटिका पहुँचीं, जहाँ रावण ने उन्हें
    बंदी बनाकर रखा था। उन्होंने राम को वे स्थान दिखाए जहाँ वह स्नान और अन्य कार्य
    करती थीं, और त्रिजटा को उनकी रक्षा के लिए धन्यवाद दिया।
- id: rama-vibhishana-protection
  type: event
  keywords:
  - Rama
  - Vibhishana
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू)
  summary_en: Rama, before leaving Lanka, promised Vibhishana protection by drawing
    a protective line with his bow around Lanka. He also gave Vibhishana an arrow,
    assuring him that as long as he had it, no enemy would attack him.
  summary_hi: लंका छोड़ने से पहले, राम ने विभीषण को सुरक्षा का वचन दिया और अपने धनुष
    से लंका के चारों ओर एक रक्षात्मक रेखा खींची। उन्होंने विभीषण को एक बाण भी दिया,
    यह आश्वासन देते हुए कि जब तक वह इसे रखेंगे, कोई शत्रु उन पर आक्रमण नहीं करेगा।
- id: ram-return-to-ayodhya
  type: event
  keywords:
  - Ram
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama returns to Ayodhya, where he is welcomed with music and dance.
    The people of Ayodhya, including the women, gather to see Rama and Sita. Rama
    performs rituals and establishes a statue of Varaha.
  summary_hi: राम अयोध्या लौटते हैं, जहाँ उनका स्वागत संगीत और नृत्य के साथ होता है।
    अयोध्या के लोग, विशेषकर महिलाएँ, राम और सीता को देखने के लिए इकट्ठा होते हैं।
    राम अनुष्ठान करते हैं और वराह की मूर्ति की स्थापना करते हैं।
- id: lavanasura-threat
  type: story
  keywords:
  - Lavanasura
  - Rishis
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rishis living by the Yamuna River approach Rama, seeking protection
    from the demon Lavanasura. The demon is causing distress to the sages and the
    gods, and they request Rama's help to eliminate this threat.
  summary_hi: यमुना नदी के किनारे रहने वाले ऋषि राम के पास आते हैं, लवणासुर नामक राक्षस
    से सुरक्षा की मांग करते हैं। यह राक्षस ऋषियों और देवताओं को परेशान कर रहा है,
    और वे राम से इस खतरे को समाप्त करने की सहायता मांगते हैं।
- id: shatrughna-assigned-to-defeat-lavanasura
  type: event
  keywords:
  - Shatrughna
  - Lavanasura
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama assigns Shatrughna the task of defeating Lavanasura. Shatrughna
    is given a divine weapon and instructed to establish a city named Mathura after
    defeating the demon.
  summary_hi: राम शत्रुघ्न को लवणासुर को हराने का कार्य सौंपते हैं। शत्रुघ्न को एक
    दिव्य शस्त्र दिया जाता है और राक्षस को हराने के बाद मथुरा नामक एक नगर स्थापित
    करने का निर्देश दिया जाता है।
- id: shatrughna-defeats-lavanasura
  type: story
  keywords:
  - Shatrughna
  - Lavanasura
  - Mathura
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू)
  summary_en: Shatrughna is tasked by Rama to defeat the demon Lavanasura, who is
    a threat to the sages. Rama gives Shatrughna a divine arrow to kill Lavanasura,
    instructing him to attack when Lavanasura is away from home. Shatrughna successfully
    defeats Lavanasura and establishes the city of Mathura, placing Subahu as its
    ruler.
  summary_hi: राम ने शत्रुघ्न को दानव लवणासुर को हराने का कार्य सौंपा, जो ऋषियों के
    लिए खतरा था। राम ने शत्रुघ्न को एक दिव्य बाण दिया और निर्देश दिया कि जब लवणासुर
    घर से बाहर हो, तब हमला करें। शत्रुघ्न ने लवणासुर को सफलतापूर्वक हराया और मथुरा
    नगरी की स्थापना की, जिसमें सुबाहु को शासक बनाया।
- id: bharata-establishes-takshashila
  type: story
  keywords:
  - Bharata
  - Takshashila
  - Gandharva
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू)
  summary_en: Bharata, following Rama's orders, establishes the city of Takshashila
    after defeating the Gandharva leaders. He places his sons in charge of the city,
    ensuring its prosperity and security.
  summary_hi: भरत, राम के आदेश का पालन करते हुए, गंधर्व नेताओं को हराकर तक्षशिला नगरी
    की स्थापना करते हैं। वे अपने पुत्रों को शहर की जिम्मेदारी सौंपते हैं, जिससे उसकी
    समृद्धि और सुरक्षा सुनिश्चित होती है।
- id: shatrughna-mathura-establishment
  type: story
  keywords:
  - Shatrughna
  - Mathura
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Shatrughna, following Lord Rama's instructions, defeats the demons and
    establishes the city of Mathura. He appoints Subahu as the ruler of Mathura and
    then proceeds to Vidisha with Yupaketu and his family.
  summary_hi: शत्रुघ्न, भगवान राम के निर्देशों का पालन करते हुए, राक्षसों को हराकर
    मथुरा नगरी की स्थापना करते हैं। वे सुबाहु को मथुरा का शासक नियुक्त करते हैं और
    फिर यूपकेतु और उनके परिवार के साथ विदिशा की ओर प्रस्थान करते हैं।
- id: shatrughna-kapil-varaha-idol
  type: story
  keywords:
  - Shatrughna
  - Kapil Varaha
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Shatrughna, pleased with his accomplishments, installs the idol of Kapil
    Varaha in Mathura. This idol remains in Mathura to this day.
  summary_hi: शत्रुघ्न, अपनी उपलब्धियों से प्रसन्न होकर, मथुरा में कपिल वराह की मूर्ति
    स्थापित करते हैं। यह मूर्ति आज भी मथुरा में विद्यमान है।
- id: bharata-takshashila-establishment
  type: story
  keywords:
  - Bharata
  - Takshashila
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Bharata establishes the city of Takshashila and appoints Taksha as its
    ruler. He serves the people and ensures the prosperity of the region.
  summary_hi: भरत तक्षशिला नगर की स्थापना करते हैं और तक्षक को उसका शासक नियुक्त करते
    हैं। वे लोगों की सेवा करते हैं और क्षेत्र की समृद्धि सुनिश्चित करते हैं।
- id: rama-victory-over-yavana-kings
  type: event
  keywords:
  - Rama
  - Yavana
  - victory
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Rama traveled to the beautiful Shaka country through the sky and defeated
    the kings residing in the Yavana country. He then visited various regions, including
    Tamradesha and Mayapuri.
  summary_hi: राम आकाश मार्ग से सुंदर शक देश गए और यवन देश में रहने वाले राजाओं को
    पराजित किया। इसके बाद उन्होंने ताम्रदेश और मायापुरी सहित विभिन्न क्षेत्रों का
    दौरा किया।
- id: rama-visit-to-himalayas
  type: event
  keywords:
  - Rama
  - Himalayas
  - journey
  source:
    book: Ananda Ramayan
    sarga: '7'
  summary_en: Rama visited the great Himalayan mountains, which spanned a thousand
    yojanas. There, he witnessed various wonders and showed them to Sita from the
    aerial chariot.
  summary_hi: राम ने एक हजार योजन तक फैले महान हिमालय पर्वत का दौरा किया। वहां उन्होंने
    विभिन्न कौतुक देखे और उन्हें विमान से सीता को दिखाया।
- id: rama-visit-to-kimpurusha-country
  type: event
  keywords:
  - Rama
  - Kimpurusha
  - journey
  source:
    book: Ananda Ramayan
    sarga: '8'
  summary_en: Rama traveled to the Kimpurusha country, which was nine thousand yojanas
    wide. There, he saw many divine wonders and continued his journey in the Pushpaka
    Vimana.
  summary_hi: राम नौ हजार योजन विस्तृत किम्पुरुष देश गए। वहां उन्होंने कई दिव्य कौतुक
    देखे और पुष्पक विमान में अपनी यात्रा जारी रखी।
- id: sita-and-rama-visit-malyavan-mountain
  type: event
  keywords:
  - Sita
  - Rama
  - Malyavan Mountain
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita and Rama visited the Malyavan Mountain, which is described as being
    two thousand yojanas wide and thirty-four thousand yojanas long. This visit was
    part of their journey across various regions.
  summary_hi: सीता और राम माल्यवान पर्वत पर गए, जो दो हजार योजन चौड़ा और चौंतीस हजार
    योजन लंबा बताया गया है। यह यात्रा उनके विभिन्न क्षेत्रों के भ्रमण का हिस्सा थी।
- id: rama-in-ketumala-region
  type: event
  keywords:
  - Rama
  - Ketumala
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama traveled to the Ketumala region, which is thirty-one thousand yojanas
    wide and thirty-four thousand yojanas long. The region is known for its devotees
    of Kamadeva.
  summary_hi: राम केतुमाल क्षेत्र में गए, जो इकतीस हजार योजन चौड़ा और चौंतीस हजार
    योजन लंबा है। यह क्षेत्र कामदेव के उपासकों के लिए जाना जाता है।
- id: rama-and-sita-in-ramyaka-region
  type: event
  keywords:
  - Rama
  - Sita
  - Ramyaka
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama and Sita visited the Ramyaka region, which is nine thousand yojanas
    wide. The region is inhabited by devotees of Matsya, the fish incarnation of Vishnu.
  summary_hi: राम और सीता रमणक क्षेत्र में गए, जो नौ हजार योजन चौड़ा है। यह क्षेत्र
    मत्स्य भगवान के उपासकों द्वारा बसा हुआ है।
- id: rama-in-hiranyamaya-region
  type: event
  keywords:
  - Rama
  - Hiranyamaya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama visited the Hiranyamaya region, where most inhabitants are devotees
    of Surya and other deities. The kings' wives paid their respects to Sita by placing
    their heads at her feet.
  summary_hi: राम हिरण्यमय क्षेत्र में गए, जहाँ अधिकांश निवासी सूर्य और अन्य देवताओं
    के उपासक हैं। वहाँ के राजाओं की पत्नियों ने सीता के चरणों में अपना मस्तक रखकर
    प्रणाम किया।
- id: rama-in-uttara-kuru-region
  type: event
  keywords:
  - Rama
  - Uttara Kuru
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama traveled to the Uttara Kuru region, known for its worshippers of
    Varaha and the earth goddess. The kings of the region surrendered to Rama in fear.
  summary_hi: राम उत्तर कुरु क्षेत्र में गए, जो वाराह और पृथ्वी देवी के उपासकों के
    लिए जाना जाता है। वहाँ के राजा भय से राम के चरणों में लोट गए।
- id: rama-travels-to-plakshadvipa
  type: event
  keywords:
  - Rama
  - Plakshadvipa
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama travels to Plakshadvipa, a region named after Shiva, and arrives
    there through the sky. He bathes in the Aruna river, known for absolving sins,
    and meets the local king.
  summary_hi: राम प्लक्षद्वीप नामक शिवजी के नाम पर एक क्षेत्र में जाते हैं और आकाश
    मार्ग से वहां पहुंचते हैं। वे अरुणा नदी में स्नान करते हैं, जो पापों का नाश करती
    है, और वहां के राजा से मिलते हैं।
- id: rama-battle-with-king-of-plakshadvipa
  type: event
  keywords:
  - Rama
  - Battle
  - Plakshadvipa
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama engages in a fierce battle with the king of Plakshadvipa, which
    lasts for five months. Eventually, the king is subdued and worships Rama.
  summary_hi: राम प्लक्षद्वीप के राजा के साथ एक भयंकर युद्ध में संलग्न होते हैं, जो
    पांच महीने तक चलता है। अंततः राजा पराजित हो जाता है और राम की पूजा करता है।
- id: rama-journey-to-various-lands
  type: event
  keywords:
  - Rama
  - Journey
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama continues his journey, visiting various lands and rivers, including
    Vajrakuta mountain, Yavayasa, and Upendra mountain. He bathes in sacred rivers
    and is honored by local kings.
  summary_hi: राम अपनी यात्रा जारी रखते हैं, विभिन्न भूमि और नदियों का दौरा करते हैं,
    जिसमें वज्रकूट पर्वत, यवयस और उपेंद्र पर्वत शामिल हैं। वे पवित्र नदियों में स्नान
    करते हैं और स्थानीय राजाओं द्वारा सम्मानित होते हैं।
- id: rama-conquers-suchandra
  type: event
  keywords:
  - Rama
  - Suchandra
  - Battle
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama defeats Suchandra, the ruler of Plakshadvipa, in a fierce battle.
    He then crosses the dangerous Ikshurasoda sea and reaches the Shalmali island.
  summary_hi: राम प्लक्षद्वीप के शासक सुचंद्र को एक भयंकर युद्ध में पराजित करते हैं।
    इसके बाद वे भयंकर इक्षुरसोद समुद्र को पार करके शाल्मली द्वीप पर पहुंचते हैं।
- id: sarameya-complaint-to-rama
  type: story
  keywords:
  - sarameya
  - rama
  - justice
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम (पूर्वाद्धम्)
  summary_en: A dog named Sarameya approaches Lord Rama's court to complain about
    being unjustly beaten by a monk, resulting in a broken leg. Rama, ensuring justice
    in his kingdom, listens to the dog's grievance and summons the monk responsible
    for the act.
  summary_hi: सारमेय नामक एक कुत्ता भगवान राम के दरबार में आता है और एक सन्यासी द्वारा
    अन्यायपूर्वक पीटे जाने की शिकायत करता है, जिससे उसका पैर टूट गया। राम, अपने राज्य
    में न्याय सुनिश्चित करते हुए, कुत्ते की शिकायत सुनते हैं और इस कृत्य के लिए जिम्मेदार
    सन्यासी को बुलाते हैं।
- id: ram-and-the-dog-episode
  type: story
  keywords:
  - Ram
  - dog
  - justice
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, a dog approaches Lord Rama with a grievance against
    a monk who broke its leg. The monk explains that he was hungry and threw a stone
    at the dog when it touched his food. Rama, understanding the nature of the dog,
    declares the monk guilty and allows the dog to decide the monk's punishment. The
    dog suggests making the monk the head of a Shiva temple, which Rama agrees to.
  summary_hi: इस प्रकरण में, एक कुत्ता भगवान राम के पास अपनी शिकायत लेकर आता है कि
    एक संन्यासी ने उसका पैर तोड़ दिया। संन्यासी बताता है कि वह भूखा था और जब कुत्ते
    ने उसके भोजन को छू लिया तो उसने पत्थर फेंककर मारा। राम, कुत्ते की प्रकृति को समझते
    हुए, संन्यासी को दोषी ठहराते हैं और कुत्ते को संन्यासी की सजा तय करने की अनुमति
    देते हैं। कुत्ता सुझाव देता है कि संन्यासी को एक शिव मंदिर का महंत बना दिया जाए,
    जिसे राम स्वीकार कर लेते हैं।
- id: dog-rebirth-story
  type: story
  keywords:
  - rebirth
  - karma
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: A sage, due to his misdeeds and arrogance in a past life, is reborn
    as a dog. The dog, after making a claim at the court of Rama, eventually attains
    a good state. However, the sage, who became a dog due to his past sins, dies elsewhere
    and does not attain liberation. This story illustrates the concept of karma and
    the consequences of one's actions.
  summary_hi: एक ऋषि, अपने पिछले जीवन के पापों और अहंकार के कारण, कुत्ते के रूप में
    पुनर्जन्म लेता है। वह कुत्ता, राम के दरबार में दावा करने के बाद, अंततः शुभ गति
    प्राप्त करता है। हालांकि, वह ऋषि, जो अपने पापों के कारण कुत्ता बना, कहीं और मरता
    है और उसे मुक्ति नहीं मिलती। यह कहानी कर्म और उसके परिणामों की अवधारणा को दर्शाती
    है।
- id: brahmins-child-death-episode
  type: event
  keywords:
  - death
  - justice
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In Ayodhya, a Brahmin's five-year-old child dies unexpectedly. The grieving
    parents bring the child's body to the royal court and accuse King Rama of being
    responsible for the untimely death, citing that such events occur due to the king's
    unrighteousness. This incident highlights the belief in the king's role in the
    moral and spiritual well-being of his kingdom.
  summary_hi: अयोध्या में, एक ब्राह्मण के पाँच वर्षीय बच्चे की अचानक मृत्यु हो जाती
    है। शोकाकुल माता-पिता बच्चे के शव को राजदरबार में लाते हैं और राजा राम पर समय
    से पहले मृत्यु के लिए जिम्मेदार होने का आरोप लगाते हैं, यह कहते हुए कि ऐसी घटनाएँ
    राजा के अधर्म के कारण होती हैं। यह घटना राज्य के नैतिक और आध्यात्मिक कल्याण में
    राजा की भूमिका के विश्वास को उजागर करती है।
- id: narada-advises-rama-on-brahmins-child
  type: story
  keywords:
  - Narada
  - Rama
  - Brahmin's child
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, a Brahmin's child has died prematurely, and Rama seeks
    a solution. Narada arrives and advises Rama to search his kingdom for any acts
    of adharma (unrighteousness) and correct them, as this will bring the child back
    to life. Rama agrees and sets out to investigate his kingdom.
  summary_hi: इस प्रकरण में, एक ब्राह्मण के बच्चे की अकाल मृत्यु हो जाती है, और राम
    समाधान खोजते हैं। नारद आते हैं और राम को सलाह देते हैं कि वे अपने राज्य में किसी
    भी अधर्म के कार्य की खोज करें और उन्हें ठीक करें, क्योंकि इससे बच्चा फिर से जीवित
    हो जाएगा। राम सहमत होते हैं और अपने राज्य की जांच करने के लिए निकल पड़ते हैं।
- id: rama-consoles-widow
  type: story
  keywords:
  - Rama
  - Widow
  - Promise
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama encounters a widow who blames him for her husband's death and threatens
    to curse him. Rama consoles her, promising to revive her husband and invites her
    to stay in his palace peacefully. He assures her that he is on his way to resolve
    such issues.
  summary_hi: राम एक विधवा से मिलते हैं जो अपने पति की मृत्यु के लिए उन्हें दोषी ठहराती
    है और उन्हें शाप देने की धमकी देती है। राम उसे सांत्वना देते हैं, उसके पति को
    पुनर्जीवित करने का वादा करते हैं और उसे अपने महल में शांति से रहने के लिए आमंत्रित
    करते हैं। वह उसे आश्वस्त करते हैं कि वह ऐसे मुद्दों को हल करने के लिए जा रहे हैं।
- id: rama-and-the-five-corpses
  type: event
  keywords:
  - Rama
  - corpses
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: In Ayodhya, five corpses from different regions are brought together.
    Rama instructs that no cremation should occur until his return. The corpses include
    those of a Kshatriya from Madhupur, a Vaishya from Prayag, a Teli from Hastinapur,
    a Lohar's daughter-in-law from Haridwar, and a Chamar's daughter from Ujjayini.
  summary_hi: अयोध्या में विभिन्न क्षेत्रों से पाँच शव एकत्रित होते हैं। राम निर्देश
    देते हैं कि उनके लौटने तक कोई दाह संस्कार नहीं होना चाहिए। इनमें मधुपुर के क्षत्रिय,
    प्रयाग के वैश्य, हस्तिनापुर के तेली, हरिद्वार के लोहार की पुत्रवधू और उज्जयिनी
    के चमार की लड़की के शव शामिल हैं।
- id: rama-and-the-sudra-ascetic
  type: story
  keywords:
  - Rama
  - Sudra
  - asceticism
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: Rama encounters a Sudra performing severe penance by hanging upside
    down and inhaling smoke, desiring to attain heaven. Rama admonishes him, stating
    that such penance is meant for Brahmins, Kshatriyas, and Vaishyas, not Sudras.
    Rama offers to grant him a boon for his devotion.
  summary_hi: राम एक शूद्र से मिलते हैं जो स्वर्ग प्राप्ति के लिए उल्टा लटक कर धुआं
    पीते हुए कठोर तप कर रहा है। राम उसे डांटते हैं, कहते हैं कि ऐसा तप ब्राह्मण, क्षत्रिय
    और वैश्य के लिए है, शूद्रों के लिए नहीं। राम उसकी भक्ति के लिए उसे वरदान देने
    की पेशकश करते हैं।
- id: sudra-salvation-blessing
  type: story
  keywords:
  - sudra
  - salvation
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌
  summary_en: A Sudra requests Lord Rama for a boon that would grant salvation to
    Sudras. Pleased with his devotion, Rama grants that those who chant his name will
    attain salvation. The Sudra further requests that Rama reside on a mountain with
    Sita and Lakshmana, and that those who visit the place will also be granted moksha.
  summary_hi: एक शूद्र भगवान राम से वरदान मांगता है कि शूद्रों को भी सद्गति प्राप्त
    हो। राम उसकी भक्ति से प्रसन्न होकर यह वरदान देते हैं कि जो लोग उनका नाम जपेंगे,
    उन्हें सद्गति प्राप्त होगी। शूद्र आगे यह भी मांगता है कि राम सीता और लक्ष्मण के
    साथ एक पर्वत पर निवास करें और जो लोग वहां आकर दर्शन करेंगे, उन्हें भी मोक्ष प्राप्त
    होगा।
- id: ram-ram-greeting-practice
  type: practice
  keywords:
  - ram-ram
  - greeting
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌
  summary_en: Lord Rama establishes the practice of saying 'Ram Ram' during greetings
    and blessings among Sudras, which would lead to their salvation. This practice
    becomes a means for Sudras to attain spiritual upliftment.
  summary_hi: भगवान राम शूद्रों के बीच प्रणाम और आशीर्वाद के समय 'राम राम' कहने की
    प्रथा स्थापित करते हैं, जिससे उन्हें सद्गति प्राप्त होगी। यह प्रथा शूद्रों के
    लिए आध्यात्मिक उन्नति का साधन बन जाती है।
- id: ram-judgment-bird-nest
  type: story
  keywords:
  - Ram
  - judgment
  - bird nest
  source:
    book: Ananda Ramayan
    sarga: '10'
  summary_en: In this episode, two birds, an owl and a vulture, dispute over the ownership
    of a nest. Both claim to have built it first. Unable to provide evidence, they
    seek Lord Ram's judgment. Ram, after hearing their claims, determines that the
    vulture's story is false and grants the nest to the owl. The vulture is then elevated
    to a higher state by Ram's grace.
  summary_hi: इस प्रकरण में, दो पक्षी, एक उल्लू और एक गिद्ध, एक घोंसले के स्वामित्व
    पर विवाद करते हैं। दोनों दावा करते हैं कि उन्होंने पहले इसे बनाया था। सबूत देने
    में असमर्थ, वे भगवान राम से न्याय की मांग करते हैं। राम, उनकी दलीलें सुनने के
    बाद, यह निर्धारित करते हैं कि गिद्ध की कहानी झूठी है और उल्लू को घोंसला दे देते
    हैं। गिद्ध को राम की कृपा से एक उच्चतर अवस्था में उठा लिया जाता है।
- id: ram-hunts-lion
  type: story
  keywords:
  - Ram
  - lion
  - curse
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: While hunting, Ram encounters a fearsome lion. After a chase, Ram shoots
    the lion with an arrow, transforming it into a divine being. The being reveals
    that it was once a Vidyadhar cursed to become a lion for violating a sage's wife's
    chastity. The curse would end only when Ram's arrow touched him. Grateful for
    his liberation, the Vidyadhar thanks Ram and returns to his realm.
  summary_hi: शिकार के दौरान, राम एक भयानक सिंह से मिलते हैं। पीछा करने के बाद, राम
    उसे एक बाण से मारते हैं, जिससे वह एक दिव्य पुरुष में परिवर्तित हो जाता है। वह
    बताता है कि वह पहले एक विद्याधर था जिसे एक मुनिपत्नी के साथ दुर्व्यवहार करने के
    कारण सिंह बनने का शाप मिला था। राम के बाण के स्पर्श से वह शाप से मुक्त हो गया।
    कृतज्ञता व्यक्त कर वह अपने लोक को चला जाता है।
- id: ram-meets-ascetic-women
  type: story
  keywords:
  - Ram
  - ascetic women
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Lord Ram encounters four ascetic women in a cave. They
    are emaciated, with only skin and bones, but still alive. Ram, pleased with their
    penance, creates four forms of himself and offers them a boon. Upon touching them,
    their bodies are rejuvenated with flesh and blood.
  summary_hi: इस प्रकरण में, भगवान राम एक गुफा में चार तपस्विनी स्त्रियों से मिलते
    हैं। वे अत्यंत दुर्बल हैं, केवल हड्डी और चमड़ी के साथ, लेकिन जीवित हैं। राम, उनकी
    तपस्या से प्रसन्न होकर, अपने चार रूप बनाते हैं और उन्हें वरदान देने का प्रस्ताव
    करते हैं। उनके स्पर्श से, उनकी सूखी देह में रक्त और मांस का संचार हो जाता है।
- id: ram-vishnu-revelation
  type: story
  keywords:
  - Ram
  - Vishnu
  - revelation
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू) सर्गः १२
  summary_en: In this episode, Lord Ram reveals his true form as Vishnu to a group
    of women who were trapped in a cave. They had been praying to Vishnu, and upon
    seeing Ram's divine form, their doubts were dispelled. Ram then promises them
    that in the Dwapara Yuga, he will incarnate as Krishna and marry them.
  summary_hi: इस प्रकरण में, भगवान राम एक गुफा में फंसी महिलाओं के समूह को अपना वास्तविक
    रूप विष्णु के रूप में प्रकट करते हैं। वे महिलाएं विष्णु की प्रार्थना कर रही थीं,
    और राम के दिव्य रूप को देखकर उनके संदेह दूर हो गए। राम उन्हें वचन देते हैं कि
    द्वापर युग में वे कृष्ण के रूप में अवतार लेंगे और उनसे विवाह करेंगे।
- id: ram-promise-to-women
  type: story
  keywords:
  - Ram
  - promise
  - marriage
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ (पूर्वार्डमू) सर्गः १२
  summary_en: After revealing his Vishnu form, Ram listens to the women's request
    to marry them. However, Ram explains that he is committed to one wife, Sita, and
    cannot marry them in this lifetime. He promises that in the Dwapara Yuga, as Krishna,
    he will fulfill their wish.
  summary_hi: विष्णु रूप प्रकट करने के बाद, राम महिलाओं की उनसे विवाह करने की प्रार्थना
    सुनते हैं। हालांकि, राम बताते हैं कि वे एकपत्नीव्रतधारी हैं और इस जीवन में उनसे
    विवाह नहीं कर सकते। वे वचन देते हैं कि द्वापर युग में कृष्ण के रूप में वे उनकी
    इच्छा पूरी करेंगे।
- id: ram-and-kalindi-encounter
  type: story
  keywords:
  - Ram
  - Kalindi
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: During a visit to the banks of the Yamuna, Ram encounters Kalindi, who
    approaches him in the form of a woman. She expresses her desire to be with him,
    but Ram, adhering to his vow of monogamy, gently declines her request. He assures
    her that in the Dwapara Yuga, he will incarnate as Krishna and she will be his
    consort. Satisfied with this promise, Kalindi returns to her abode.
  summary_hi: यमुना के तट पर भ्रमण के दौरान, राम कालिंदी से मिलते हैं, जो एक स्त्री
    के रूप में उनके पास आती है। वह उनके साथ रहने की इच्छा व्यक्त करती है, लेकिन राम
    अपने एकपत्नी व्रत का पालन करते हुए विनम्रता से उनकी इच्छा को अस्वीकार कर देते
    हैं। वह उन्हें आश्वासन देते हैं कि द्वापर युग में वह कृष्ण के रूप में अवतरित होंगे
    और कालिंदी उनकी पत्नी बनेगी। इस वादे से संतुष्ट होकर कालिंदी अपने स्थान पर लौट
    जाती है।
- id: rama-prohibits-laughter
  type: event
  keywords:
  - Rama
  - laughter
  - prohibition
  source:
    book: Ananda Ramayan
    sarga: 'अयोदश: सर्ग:'
  summary_en: In a gathering with his friends, Rama recalls the incident during the
    battle in Lanka where Ravana's heads would laugh and fall at his feet after being
    severed. This memory leads Rama to suspect that laughter in the assembly might
    be caused by Ravana's heads. Consequently, Rama decides to prohibit laughter throughout
    his kingdom, fearing it might be a trick by the rakshasas.
  summary_hi: राम अपने मित्रों के साथ एक सभा में बैठे थे जब उन्हें लंका के युद्ध की
    घटना याद आई, जहाँ रावण के सिर काटे जाने के बाद हँसते हुए उनके चरणों में गिरते
    थे। इस स्मृति के कारण राम को संदेह हुआ कि सभा में हँसी रावण के सिरों के कारण हो
    सकती है। इसलिए, राम ने अपने राज्य में हँसी पर प्रतिबंध लगाने का निर्णय लिया, यह
    सोचकर कि यह राक्षसों की चाल हो सकती है।
- id: matsya-avatar-sankhasura
  type: story
  keywords:
  - matsya-avatar
  - sankhasura
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: In the Matsya Avatar, Lord Vishnu took the form of a fish to kill the
    demon Sankhasura who had stolen the Vedas. This avatar was taken to restore the
    sacred texts.
  summary_hi: मत्स्य अवतार में, भगवान विष्णु ने मछली का रूप धारण कर शंखासुर नामक राक्षस
    का वध किया जिसने वेदों को चुरा लिया था। यह अवतार पवित्र ग्रंथों की पुनः स्थापना
    के लिए लिया गया था।
- id: kurma-avatar-mandara
  type: story
  keywords:
  - kurma-avatar
  - mandara
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: During the churning of the ocean, when Mount Mandara was sinking, Lord
    Vishnu took the form of a tortoise (Kurma Avatar) to support the mountain on his
    back.
  summary_hi: समुद्र मंथन के समय जब मंदराचल पर्वत डूब रहा था, तब भगवान विष्णु ने कूर्म
    अवतार धारण कर पर्वत को अपनी पीठ पर धारण किया।
- id: varaha-avatar-hiranyaksha
  type: story
  keywords:
  - varaha-avatar
  - hiranyaksha
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: In the Varaha Avatar, Lord Vishnu took the form of a boar to rescue
    the Earth from the demon Hiranyaksha, who had submerged it in the ocean.
  summary_hi: वराह अवतार में, भगवान विष्णु ने सूअर का रूप धारण कर हिरण्याक्ष नामक
    राक्षस से पृथ्वी का उद्धार किया, जिसने उसे समुद्र में डुबो दिया था।
- id: narasimha-avatar-hiranyakashipu
  type: story
  keywords:
  - narasimha-avatar
  - hiranyakashipu
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: In the Narasimha Avatar, Lord Vishnu emerged from a pillar to protect
    his devotee Prahlada and killed the demon king Hiranyakashipu.
  summary_hi: नरसिंह अवतार में, भगवान विष्णु खंभे से प्रकट होकर अपने भक्त प्रह्लाद
    की रक्षा के लिए हिरण्यकशिपु नामक राक्षस राजा का वध किया।
- id: vamana-avatar-bali
  type: story
  keywords:
  - vamana-avatar
  - bali
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: In the Vamana Avatar, Lord Vishnu took the form of a dwarf to subdue
    the demon king Bali by asking for three paces of land and then covering the universe
    in those steps.
  summary_hi: वामन अवतार में, भगवान विष्णु ने बौने का रूप धारण कर तीन पग भूमि मांगकर
    बलि नामक राक्षस राजा को परास्त किया और उन पगों में पूरे ब्रह्मांड को नाप लिया।
- id: parashurama-avatar-kshatriya
  type: story
  keywords:
  - parashurama-avatar
  - kshatriya
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: In the Parashurama Avatar, Lord Vishnu incarnated to rid the Earth of
    corrupt Kshatriya rulers, avenging the wrongs done to his family.
  summary_hi: परशुराम अवतार में, भगवान विष्णु ने पृथ्वी को भ्रष्ट क्षत्रिय शासकों
    से मुक्त करने के लिए अवतार लिया, अपने परिवार के साथ हुए अन्याय का बदला लेने के
    लिए।
- id: rama-avatar-ravana
  type: story
  keywords:
  - rama-avatar
  - ravana
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डे
  summary_en: In the Rama Avatar, Lord Vishnu incarnated to defeat the demon king
    Ravana and his brother Kumbhakarna, restoring dharma on Earth.
  summary_hi: राम अवतार में, भगवान विष्णु ने राक्षस राजा रावण और उसके भाई कुम्भकर्ण
    का वध कर पृथ्वी पर धर्म की स्थापना की।
- id: curse-of-jaya-vijaya
  type: story
  keywords:
  - jaya
  - vijaya
  - curse
  - ashwini-kumaras
  source:
    book: Ananda Ramayan
    sarga: '147'
  summary_en: Jaya and Vijaya, the gatekeepers of Vaikuntha, refused entry to the
    Ashwini Kumaras who wanted to meet Lord Vishnu. Angered by this, the Ashwini Kumaras
    cursed Jaya and Vijaya to be born on Earth three times. In retaliation, Jaya and
    Vijaya also cursed the Ashwini Kumaras to be born on Earth once. This incident
    caused a commotion in Vaikuntha, and Lord Vishnu intervened to offer a solution.
  summary_hi: जय और विजय, जो वैकुंठ के द्वारपाल थे, ने अश्विनी कुमारों को भगवान विष्णु
    से मिलने से मना कर दिया। इससे क्रोधित होकर अश्विनी कुमारों ने जय और विजय को तीन
    बार पृथ्वी पर जन्म लेने का श्राप दिया। बदले में, जय और विजय ने भी अश्विनी कुमारों
    को एक बार पृथ्वी पर जन्म लेने का श्राप दिया। इस घटना से वैकुंठ में हाहाकार मच
    गया, और भगवान विष्णु ने हस्तक्षेप कर समाधान प्रस्तुत किया।
- id: incarnation-of-jaya-vijaya
  type: story
  keywords:
  - jaya
  - vijaya
  - incarnation
  - hiranyaksha
  - hiranyakashipu
  source:
    book: Ananda Ramayan
    sarga: '147'
  summary_en: As a result of the curse, Jaya and Vijaya were born on Earth as demons.
    Jaya was born as Hiranyaksha and Vijaya as Hiranyakashipu. Lord Vishnu incarnated
    as Varaha to kill Hiranyaksha and as Narasimha to kill Hiranyakashipu, thus fulfilling
    the curse and their eventual return to Vaikuntha.
  summary_hi: श्राप के परिणामस्वरूप, जय और विजय पृथ्वी पर राक्षसों के रूप में जन्मे।
    जय हिरण्याक्ष के रूप में और विजय हिरण्यकशिपु के रूप में जन्मे। भगवान विष्णु ने
    वराह अवतार लेकर हिरण्याक्ष का वध किया और नरसिंह अवतार लेकर हिरण्यकशिपु का वध किया,
    जिससे श्राप पूरा हुआ और वे अंततः वैकुंठ लौट सके।
- id: valmiki-transformation-story
  type: story
  keywords:
  - Valmiki
  - transformation
  - meditation
  source:
    book: Ananda Ramayan
    sarga: '14'
  summary_en: The passage narrates the transformation of a sinner into the sage Valmiki.
    Initially, a man pleads for salvation from the ocean of sins. The sages advise
    him to chant 'Mara' (reverse of 'Rama') with concentration. Over time, he becomes
    so absorbed in the chant that he forgets his physical existence. Ants build a
    mound over him, and eventually, the sages return to find him transformed, emerging
    from the mound as the sage Valmiki.
  summary_hi: यह अंश एक पापी के ऋषि वाल्मीकि में परिवर्तन की कथा बताता है। प्रारंभ
    में, एक व्यक्ति पापों के महासागर से मुक्ति की प्रार्थना करता है। ऋषि उसे 'मरा'
    (राम का उल्टा) मंत्र का एकाग्रता से जप करने की सलाह देते हैं। समय के साथ, वह जप
    में इतना लीन हो जाता है कि अपने शरीर का भी भान नहीं रहता। दीमक उसके ऊपर मिट्टी
    का ढेर बना देते हैं, और अंततः ऋषि उसे वाल्मीकि के रूप में परिवर्तित पाते हैं।
- id: hema-swayamvara-episode
  type: event
  keywords:
  - swayamvara
  - hema
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ ( उत्तराद्धेम )
  summary_en: In this episode, Rama organizes a grand swayamvara for his daughter
    Hema. Many kings from various regions, adorned in fine garments and jewelry, attend
    the event. During the swayamvara, Hema, adorned with a garland of precious gems,
    is presented to the assembly. However, amidst the proceedings, Chitrangada, the
    son of the king of Avanti, abducts Hema using a magical spell that confuses the
    attendees.
  summary_hi: इस प्रकरण में, राम अपनी पुत्री हेमा के लिए एक भव्य स्वयंवर का आयोजन
    करते हैं। विभिन्न क्षेत्रों के कई राजा, सुंदर वस्त्र और आभूषण पहनकर इस आयोजन में
    शामिल होते हैं। स्वयंवर के दौरान, रत्नों की माला से सजी हेमा को सभा में प्रस्तुत
    किया जाता है। हालांकि, इस बीच, अवंती के राजा के पुत्र चित्रांगद एक जादुई मंत्र
    का उपयोग करके हेमा का अपहरण कर लेते हैं, जिससे उपस्थित लोग भ्रमित हो जाते हैं।
- id: kush-battle-and-victory
  type: story
  keywords:
  - Kush
  - battle
  - victory
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Kush, the son of Rama, arrives at the battlefield to assist his brother
    Lav, who is unconscious. Kush fights fiercely and captures both Chitrangada and
    his father Ugrabhahu. He then takes them to Rama, who releases Ugrabhahu as a
    friend. Kush is honored with a special garment from Sage Agastya, enhancing his
    splendor.
  summary_hi: कुश, राम के पुत्र, युद्धभूमि में अपने भाई लव की सहायता के लिए आते हैं,
    जो मूर्छित है। कुश वीरता से लड़ते हैं और चित्रांगद और उसके पिता उग्रबाहु को बंदी
    बना लेते हैं। फिर वे उन्हें राम के पास ले जाते हैं, जो उग्रबाहु को मित्र मानकर
    छोड़ देते हैं। कुश को अगस्त्य ऋषि से एक विशेष वस्त्र मिलता है, जिससे उनकी शोभा
    बढ़ जाती है।
- id: agastya-gift-to-kush
  type: story
  keywords:
  - Agastya
  - Kush
  - gift
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sage Agastya narrates to Kush how he received a special garment from
    the ocean as a gift after helping Indra defeat his enemies. This garment, adorned
    with various jewels and radiant like the sun, was given to Kush by Agastya, enhancing
    his appearance.
  summary_hi: अगस्त्य ऋषि कुश को बताते हैं कि कैसे उन्होंने इंद्र की सहायता करने के
    बाद समुद्र से एक विशेष वस्त्र उपहार में प्राप्त किया। यह वस्त्र, जो विभिन्न रत्नों
    से जटित और सूर्य के समान तेजस्वी था, अगस्त्य ने कुश को दिया, जिससे उनकी शोभा बढ़
    गई।
- id: indra-advice-to-agastya
  type: story
  keywords:
  - Indra
  - Agastya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Indra advises a celestial being to donate a bracelet to Sage Agastya
    in order to receive heavenly food. The celestial being follows Indra's advice
    and is eventually liberated when Agastya accepts the donation.
  summary_hi: इन्द्र एक स्वर्गीय प्राणी को सलाह देते हैं कि वह अगस्त्य ऋषि को एक कंकण
    दान करे ताकि उसे स्वर्गीय अन्न प्राप्त हो सके। स्वर्गीय प्राणी इन्द्र की सलाह
    का पालन करता है और अंततः अगस्त्य के दान स्वीकार करने पर मुक्त हो जाता है।
- id: origin-of-dandakaranya
  type: etymology
  keywords:
  - Dandakaranya
  - curse
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The forest of Dandakaranya got its name from a curse by Sage Bhrigu.
    King Danda, who was infatuated with Bhrigu's daughter, abducted her. In anger,
    Bhrigu cursed that Danda's kingdom would become a forest devoid of life, hence
    the name Dandakaranya.
  summary_hi: दण्डकारण्य वन का नामकरण भृगु ऋषि के श्राप से हुआ। राजा दण्ड, जो भृगु
    की पुत्री से प्रेम करता था, ने उसे अपहरण कर लिया। क्रोधित होकर भृगु ने श्राप दिया
    कि दण्ड का राज्य एक निर्जन वन बन जाएगा, इसलिए इसका नाम दण्डकारण्य पड़ा।
- id: king-and-bhrigu-curse
  type: story
  keywords:
  - king
  - bhrigu
  - curse
  source:
    book: Ananda Ramayan
    sarga: '18'
  summary_en: A king, while chasing a deer, reaches a hermitage where he meets Bhrigu's
    daughter. Overcome by desire, he forces himself upon her. When Bhrigu returns
    and learns of the incident, he curses the king's kingdom to be destroyed by fire.
    The daughter pleads for a time limit on the curse, and Bhrigu states that the
    land will become habitable again when Sage Agastya crosses the Vindhya mountains.
  summary_hi: एक राजा हिरण का पीछा करते हुए एक आश्रम में पहुँचता है जहाँ उसकी मुलाकात
    भृगु की बेटी से होती है। कामवश होकर वह उसके साथ जबरदस्ती करता है। भृगु लौटकर इस
    घटना को सुनते हैं और राजा के राज्य को आग से नष्ट होने का श्राप देते हैं। बेटी
    श्राप की अवधि के लिए प्रार्थना करती है, और भृगु कहते हैं कि जब अगस्त्य ऋषि विंध्य
    पर्वत को पार करेंगे, तब वह भूमि फिर से रहने योग्य हो जाएगी।
- id: ramnaya-pur-etymology
  type: etymology
  keywords:
  - Ramnaya
  - Brahmpur
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The city originally named Brahmpur was renamed Ramnaya Pur after Lord
    Rama donated it to the Brahmins. This change in name signifies the gift and blessing
    of Rama upon the city.
  summary_hi: शहर का मूल नाम ब्रह्मपुर था, जिसे भगवान राम ने ब्राह्मणों को दान देने
    के बाद रामनायपुर नाम दिया गया। इस नाम परिवर्तन का अर्थ है कि यह शहर राम का आशीर्वाद
    और उपहार है।
- id: hanuman-rescue-story
  type: story
  keywords:
  - Hanuman
  - Brahmins
  - Shila
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the future, the Brahmins of Ramnaya Pur will face persecution from
    an evil king who demands proof of Rama's donation. In desperation, they will throw
    the sacred Shila into a lake. Hanuman will later retrieve the Shila, saving the
    Brahmins from their plight.
  summary_hi: भविष्य में रामनायपुर के ब्राह्मणों को एक दुष्ट राजा से उत्पीड़न का सामना
    करना पड़ेगा, जो राम के दान का प्रमाण मांगता है। निराशा में, वे पवित्र शिला को
    एक तालाब में फेंक देंगे। बाद में हनुमान शिला को पुनः प्राप्त करेंगे, जिससे ब्राह्मणों
    को उनके संकट से बचाया जाएगा।
- id: hanuman-appears-to-brahmins
  type: story
  keywords:
  - Hanuman
  - Brahmins
  source:
    book: Ananda Ramayan
    sarga: '18'
  summary_en: In a time of distress, a group of Brahmins, fearing for their lives,
    decide to give up their lives. As they prepare for their end, Hanuman appears
    from a stone idol in a nearby temple and advises them not to give up hope. He
    assures them of his protection and instructs them to continue worshiping Lord
    Rama.
  summary_hi: एक संकट के समय में, कुछ ब्राह्मण अपने जीवन के लिए डरते हुए अपने प्राण
    त्यागने का निर्णय लेते हैं। जब वे अपने अंत की तैयारी कर रहे होते हैं, तब पास के
    मंदिर में एक पत्थर की मूर्ति से हनुमान प्रकट होते हैं और उन्हें आशा न छोड़ने की
    सलाह देते हैं। वे उन्हें अपनी सुरक्षा का आश्वासन देते हैं और भगवान राम की पूजा
    जारी रखने का निर्देश देते हैं।
- id: kurma-avatar
  type: story
  keywords:
  - Kurma
  - Avatar
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: During the churning of the ocean, the deity took the form of a turtle
    (Kurma) to support Mount Mandara on his back. However, he did not remain in this
    form for long as he found no happiness living as an aquatic creature.
  summary_hi: समुद्र मंथन के समय, देवता ने कछुए (कूर्म) का रूप धारण किया ताकि मंदराचल
    पर्वत को अपनी पीठ पर सहारा दे सकें। हालांकि, उन्होंने इस रूप में अधिक समय तक नहीं
    रहे क्योंकि उन्हें जलचर के रूप में कोई सुख नहीं मिला।
- id: varaha-avatar
  type: story
  keywords:
  - Varaha
  - Avatar
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Upon seeing the Earth sinking into the ocean, the deity assumed the
    form of a boar (Varaha) to lift the Earth on his tusks. He defeated the demon
    Hiranyaksha who claimed the Earth as his own.
  summary_hi: पृथ्वी को समुद्र में डूबते देखकर, देवता ने वराह (सूअर) का रूप धारण किया
    और पृथ्वी को अपने दांतों पर उठाया। उन्होंने हिरण्याक्ष नामक असुर का वध किया, जो
    पृथ्वी को अपनी मानता था।
- id: narasimha-avatar
  type: story
  keywords:
  - Narasimha
  - Avatar
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: To protect Prahlada, the deity took the form of Narasimha, a half-man,
    half-lion, and emerged from a pillar to slay the demon Hiranyakashipu. This form
    was fierce and instilled fear in everyone except Prahlada.
  summary_hi: प्रह्लाद की रक्षा के लिए, देवता ने नरसिंह का रूप धारण किया, जो आधा मनुष्य
    और आधा सिंह था, और खंभे से प्रकट होकर हिरण्यकशिपु का वध किया। यह रूप अत्यंत उग्र
    था और प्रह्लाद को छोड़कर सभी में भय उत्पन्न करता था।
- id: vamana-avatar
  type: story
  keywords:
  - Vamana
  - Avatar
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: To humble the demon king Bali, the deity took the form of a dwarf (Vamana)
    and measured the entire universe in three steps, sending Bali to the netherworld.
    Despite the success, the deity found no joy in this form.
  summary_hi: असुर राजा बलि को नीचा दिखाने के लिए, देवता ने वामन का रूप धारण किया
    और तीन कदमों में पूरे ब्रह्मांड को नापकर बलि को पाताल लोक भेज दिया। इस सफलता के
    बावजूद, देवता को इस रूप में कोई आनंद नहीं मिला।
- id: parashurama-avatar
  type: story
  keywords:
  - Parashurama
  - Avatar
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the form of Parashurama, the deity eradicated the Kshatriyas from
    the Earth twenty-one times. This avatar was characterized by anger and was not
    a source of happiness for the deity.
  summary_hi: परशुराम के रूप में, देवता ने इक्कीस बार पृथ्वी से क्षत्रियों का संहार
    किया। यह अवतार क्रोध से भरा था और देवता के लिए सुख का स्रोत नहीं था।
- id: krishna-avatar-story
  type: story
  keywords:
  - Krishna
  - avatar
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: This passage describes the avatar of Krishna, detailing his birth in
    a prison, his upbringing in Gokul, and his various exploits such as defeating
    demons like Putana, Kaliya, and Bakasura. It also mentions his eventual confrontation
    with Kamsa and his life in Dwarka.
  summary_hi: यह अंश कृष्ण के अवतार का वर्णन करता है, जिसमें उनके कारागार में जन्म,
    गोकुल में पालन-पोषण, और पूतना, कालिया, बकासुर जैसे राक्षसों को पराजित करने की
    घटनाएँ शामिल हैं। इसमें कंस के साथ उनका सामना और द्वारका में उनका जीवन भी उल्लेखित
    है।
- id: sita-marriage-narrative
  type: story
  keywords:
  - Sita
  - marriage
  - Ramayana
  source:
    book: Ananda Ramayan
    sarga: राज्यकाण्डम्‌ ( उत्तराद्धम )
  summary_en: The passage describes the narrative of Sita's marriage. It includes
    the arrival of Rama and Lakshmana with Vishwamitra at Janakpur, the breaking of
    Shiva's bow by Rama during the swayamvara, and the subsequent marriage of Rama
    and his brothers in Mithila. The story also mentions the encounter with Parashurama
    and how Rama subdued his anger by stringing the Vishnu bow.
  summary_hi: इस अंश में सीता के विवाह की कथा का वर्णन है। इसमें राम और लक्ष्मण का
    विश्वामित्र के साथ जनकपुर आगमन, राम द्वारा स्वयंवर में शिव के धनुष को तोड़ना और
    मिथिला में राम और उनके भाइयों का विवाह शामिल है। कथा में परशुराम से भेंट और राम
    द्वारा विष्णु धनुष चढ़ाकर उनके क्रोध को शांत करने का भी उल्लेख है।
- id: dasi-boon-episode
  type: story
  keywords:
  - boon
  - reincarnation
  source:
    book: Ananda Ramayan
    sarga: '21'
  summary_en: A maidservant accidentally consumes the sacred remnants of food left
    by Lord Rama and is blessed by him. Pleased with her devotion, Rama grants her
    a boon. She wishes to be with him in her next life. Rama assures her that she
    will be born as Radha, a beloved gopi, and will enjoy his company during his incarnation
    as Krishna.
  summary_hi: एक दासी गलती से भगवान राम द्वारा छोड़ा गया प्रसाद खा लेती है और राम
    उसकी भक्ति से प्रसन्न होकर उसे वरदान देते हैं। वह अगले जन्म में उनके साथ रहने
    की इच्छा व्यक्त करती है। राम उसे आश्वासन देते हैं कि वह राधा के रूप में जन्म लेगी
    और कृष्ण के अवतार के दौरान उनके साथ आनंदित होगी।
- id: brahmachari-visit-episode
  type: story
  keywords:
  - brahmachari
  - valmiki
  source:
    book: Ananda Ramayan
    sarga: '21'
  summary_en: During a royal assembly, a young brahmachari visits Lord Rama. He is
    sent by Sage Valmiki to invite Rama to a grand yajna. Rama receives him with respect,
    offers him a seat, and performs a ritualistic welcome. The brahmachari conveys
    Valmiki's message and requests Rama's presence at the yajna.
  summary_hi: एक राजसभा के दौरान, एक युवा ब्रह्मचारी भगवान राम से मिलने आता है। वह
    महर्षि वाल्मीकि द्वारा राम को एक महायज्ञ में आमंत्रित करने के लिए भेजा गया है।
    राम उसका आदरपूर्वक स्वागत करते हैं, उसे आसन देते हैं और विधिवत पूजा करते हैं।
    ब्रह्मचारी वाल्मीकि का संदेश देता है और राम से यज्ञ में उपस्थित होने का अनुरोध
    करता है।
- id: rama-invitation-to-yajna
  type: event
  keywords:
  - Rama
  - Vishvamitra
  - yajna
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: A Brahmachari arrives from Vishvamitra's ashram to invite Rama to a
    grand yajna. Rama graciously accepts the invitation and prepares to leave with
    his entourage after making necessary arrangements.
  summary_hi: एक ब्रह्मचारी विश्वामित्र के आश्रम से राम को एक भव्य यज्ञ में आमंत्रित
    करने आता है। राम इस निमंत्रण को सहर्ष स्वीकार करते हैं और अपनी सेना के साथ प्रस्थान
    की तैयारी करते हैं।
- id: narada-refuses-food-episode
  type: story
  keywords:
  - Narada
  - Sita
  - Tulsi
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In this episode, Narada refuses to eat the divine food served by Sita
    because she has committed a sin by plucking Tulsi leaves on an inauspicious day.
    Narada explains the significance of Tulsi and the consequences of plucking its
    leaves at inappropriate times.
  summary_hi: इस प्रकरण में, नारद सीता द्वारा परोसे गए दिव्य भोजन को खाने से मना कर
    देते हैं क्योंकि सीता ने एक अशुभ दिन पर तुलसी के पत्ते तोड़कर पाप किया है। नारद
    तुलसी के महत्व और अनुचित समय पर इसके पत्ते तोड़ने के परिणामों को समझाते हैं।
- id: sita-tulsi-leaf-episode
  type: story
  keywords:
  - Sita
  - Tulsi
  - Narada
  source:
    book: Ananda Ramayan
    sarga: '22'
  summary_en: In this episode, Sita is challenged to restore a plucked Tulsi leaf
    to its branch using her piety and devotion. Despite her efforts and the presence
    of divine beings, the leaf does not reattach, causing her distress. Narada then
    takes Sita aside to console and advise her.
  summary_hi: इस प्रकरण में, सीता को अपनी पवित्रता और भक्ति से एक तोड़े गए तुलसी पत्र
    को उसकी शाखा पर पुनः जोड़ने की चुनौती दी जाती है। उनके प्रयासों और देवताओं की
    उपस्थिति के बावजूद, पत्र नहीं जुड़ता, जिससे उन्हें दुख होता है। नारद फिर सीता
    को एकांत में ले जाकर उन्हें सांत्वना और सलाह देते हैं।
- id: sita-tulsi-episode
  type: story
  keywords:
  - Sita
  - Tulsi
  - Pativrata
  source:
    book: Ananda Ramayan
    sarga: '22'
  summary_en: In this episode, Sita is advised by Narada to prove her pativrata (devotion
    to husband) by performing a test involving a Tulsi leaf. Sita declares that if
    her devotion is true, the leaf will reattach to the tree. Upon her declaration,
    the leaf miraculously reattaches, demonstrating her unwavering devotion. The gods
    celebrate this event with music and flowers.
  summary_hi: इस प्रकरण में, नारद सीता को सलाह देते हैं कि वह तुलसी के पत्ते के माध्यम
    से अपने पातिव्रत धर्म की परीक्षा लें। सीता घोषणा करती हैं कि यदि उनका पातिव्रत
    सत्य है, तो पत्ता वृक्ष से जुड़ जाएगा। उनकी घोषणा पर, पत्ता चमत्कारिक रूप से जुड़
    जाता है, जिससे उनकी अटूट भक्ति साबित होती है। देवता इस घटना का संगीत और पुष्पवृष्टि
    से उत्सव मनाते हैं।
- id: messenger-minister-selection
  type: story
  keywords:
  - minister-selection
  - elephant-garland
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: A messenger, who wished to leave Ayodhya to perform penance, was granted
    permission by Lord Rama. After performing a nine-night recitation of the Ananda
    Ramayan, he left his home. Meanwhile, in a nearby kingdom, a king had died, and
    a new minister was needed for the young prince. The townspeople decided that the
    person whom the royal elephant garlanded would become the minister. The elephant,
    after being adorned, went to Ayodhya and garlanded the messenger who had recited
    the Ananda Ramayan. Consequently, he was chosen as the minister and taken to the
    kingdom.
  summary_hi: एक दूत, जिसने अयोध्या छोड़कर तपस्या करने की इच्छा व्यक्त की, को भगवान
    राम ने अनुमति दे दी। उसने आनंद रामायण का नौ रातों तक पाठ किया और फिर अपने घर से
    बाहर निकला। इसी बीच, एक निकटवर्ती राज्य में राजा की मृत्यु हो गई और युवा राजकुमार
    के लिए एक नए मंत्री की आवश्यकता थी। नगरवासियों ने निर्णय लिया कि जिस व्यक्ति को
    शाही हाथी माला पहनाएगा, वही मंत्री बनेगा। हाथी, सज-धज कर अयोध्या पहुंचा और उस
    दूत को माला पहनाई जिसने आनंद रामायण का पाठ किया था। परिणामस्वरूप, उसे मंत्री चुना
    गया और राज्य में ले जाया गया।
- id: rama-rescues-sumantra
  type: story
  keywords:
  - Rama
  - Sumantra
  - Yama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Once, while Rama was in his court, a servant informed him that his elderly
    minister, Sumantra, had passed away. Sumantra's wife wished to follow him in death,
    but Rama decided to intervene. He discovered that Sumantra had only a few days
    left to live according to his birth chart. Determined to bring Sumantra back,
    Rama mounted Garuda and traveled to Yama's realm. On the way, he encountered Yama's
    messengers taking Sumantra and defeated them, rescuing Sumantra.
  summary_hi: एक बार राम अपनी सभा में थे, जब एक सेवक ने उन्हें बताया कि उनके वृद्ध
    मंत्री सुमंत्र का निधन हो गया है। सुमंत्र की पत्नी उनके साथ सती होना चाहती थी,
    लेकिन राम ने हस्तक्षेप करने का निर्णय लिया। उन्होंने सुमंत्र की जन्मकुंडली देखी
    और पाया कि उनकी आयु के कुछ दिन शेष थे। सुमंत्र को वापस लाने के लिए, राम गरुड़
    पर सवार होकर यम की नगरी गए। रास्ते में, उन्होंने यमदूतों को सुमंत्र को ले जाते
    देखा और उन्हें हराकर सुमंत्र को छुड़ा लिया।
- id: sumantra-birth-story
  type: story
  keywords:
  - Sumantra
  - birth
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sumantra's birth was unique as he was born in an unusual manner. Initially,
    his hands and face emerged from his mother's womb, and gradually, the rest of
    his body followed. Due to this extraordinary birth, he was named Sumantra.
  summary_hi: सुमन्त्र का जन्म अद्वितीय था क्योंकि वह असामान्य तरीके से हुआ था। पहले
    उसके हाथ और मुख उसकी माता के गर्भ से बाहर आए, और धीरे-धीरे उसका शेष शरीर भी बाहर
    आया। इस अद्वितीय जन्म के कारण उसका नाम सुमन्त्र पड़ा।
- id: rama-and-yama-messengers
  type: story
  keywords:
  - Rama
  - Yama
  - messengers
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama converses with the messengers of Yama, who have come to take Sumantra.
    Rama explains that Sumantra's life has nine days remaining, based on the day of
    his proper birth celebration. The messengers agree to return on the tenth day,
    allowing Sumantra to live out his remaining days.
  summary_hi: राम यम के दूतों से बातचीत करते हैं, जो सुमन्त्र को लेने आए हैं। राम
    बताते हैं कि सुमन्त्र के जीवन के नौ दिन शेष हैं, जो उसके सही जन्म उत्सव के दिन
    के आधार पर हैं। दूत दसवें दिन लौटने के लिए सहमत होते हैं, जिससे सुमन्त्र अपने
    शेष दिन जी सके।
- id: lava-yama-battle
  type: story
  keywords:
  - Lava
  - Yama
  source:
    book: Ananda Ramayan
    sarga: '27'
  summary_en: Lava, the son of Rama, engages in a fierce battle with Yama, the god
    of death. Despite Yama's powerful attacks, Lava manages to counter them with his
    own skills. Eventually, the battle is halted by the intervention of Surya, who
    pleads with Lava to spare Yama, revealing their familial connection.
  summary_hi: लव, जो राम के पुत्र हैं, यमराज के साथ एक भयंकर युद्ध में संलग्न होते
    हैं। यमराज के शक्तिशाली हमलों के बावजूद, लव अपनी कौशल से उन्हें जवाब देते हैं।
    अंततः, सूर्य के हस्तक्षेप से युद्ध रुक जाता है, जो लव से यम को बचाने की प्रार्थना
    करते हैं और उनके पारिवारिक संबंध का खुलासा करते हैं।
- id: bharata-plea-to-rama
  type: story
  keywords:
  - Bharata
  - Rama
  source:
    book: Ananda Ramayan
    sarga: '1'
  summary_en: After King Dasharatha's demise, Bharata, refusing to take the throne,
    goes to the forest to persuade Rama to return and rule Ayodhya. Despite Bharata's
    plea, Rama insists on fulfilling his father's command and gives Bharata his sandals
    as a symbol of his authority.
  summary_hi: राजा दशरथ के निधन के बाद भरत सिंहासन ग्रहण करने से इनकार करते हैं और
    राम को अयोध्या लौटने और शासन करने के लिए मनाने वन में जाते हैं। भरत के आग्रह के
    बावजूद, राम अपने पिता की आज्ञा का पालन करने पर जोर देते हैं और भरत को अपनी पादुकाएं
    देते हैं जो उनके अधिकार का प्रतीक होती हैं।
- id: shurpanakha-mutilation
  type: event
  keywords:
  - Shurpanakha
  - Mutilation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama mutilates Shurpanakha by cutting off her nose and ears, which leads
    to a series of events culminating in the battle with Khara, Trishira, and Dushana.
  summary_hi: राम शूर्पणखा की नाक और कान काटकर उसे कुरूप कर देते हैं, जिससे खर, त्रिशिरा
    और दूषण के साथ युद्ध की घटनाओं की श्रृंखला शुरू होती है।
- id: battle-with-khara-trishira-dushana
  type: event
  keywords:
  - Khara
  - Trishira
  - Dushana
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama battles and defeats the demon army led by Khara, Trishira, and
    Dushana, who were sent by Shurpanakha.
  summary_hi: राम शूर्पणखा द्वारा भेजे गए खर, त्रिशिरा और दूषण के नेतृत्व वाली राक्षस
    सेना से युद्ध करते हैं और उन्हें पराजित करते हैं।
- id: abduction-of-sita
  type: event
  keywords:
  - Sita
  - Abduction
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ravana, with the help of the demon Maricha, abducts Sita by disguising
    Maricha as a golden deer to lure Rama away from the hermitage.
  summary_hi: रावण, मारीच नामक राक्षस की मदद से, मारीच को स्वर्ण मृग के रूप में बदलकर
    सीता का अपहरण करता है ताकि राम को आश्रम से दूर ले जाया जा सके।
- id: rama-meets-shabari
  type: event
  keywords:
  - Shabari
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama meets the devout Shabari, who guides him on his journey. She directs
    him to seek help from Sugriva and Hanuman.
  summary_hi: राम भक्त शबरी से मिलते हैं, जो उन्हें उनके यात्रा मार्ग में मार्गदर्शन
    करती हैं। वह उन्हें सुग्रीव और हनुमान से सहायता लेने का निर्देश देती हैं।
- id: rama-sugriva-friendship
  type: story
  keywords:
  - Rama
  - Sugriva
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama meets Sugriva and narrates the story of Sita's abduction. Sugriva,
    in turn, shares his enmity with Vali and forms a friendship with Rama, witnessed
    by fire.
  summary_hi: राम सुग्रीव से मिलते हैं और सीता के अपहरण की कहानी सुनाते हैं। सुग्रीव
    भी अपनी वाली के साथ दुश्मनी की कहानी बताते हैं और अग्नि को साक्षी मानकर राम से
    मित्रता करते हैं।
- id: rama-valis-death
  type: story
  keywords:
  - Rama
  - Vali
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama, fulfilling his promise to Sugriva, kills Vali in battle. After
    Vali's death, Rama installs Sugriva as the king of Kishkindha.
  summary_hi: राम, सुग्रीव से किए गए वचन को पूरा करते हुए, युद्ध में वाली को मार देते
    हैं। वाली की मृत्यु के बाद, राम सुग्रीव को किष्किन्धा का राजा बनाते हैं।
- id: hanuman-finds-sita
  type: story
  keywords:
  - Hanuman
  - Sita
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman, after learning Sita's location from the vulture Sampati, leaps
    across the ocean to Lanka. There, he finds Sita in the Ashoka grove, meditating
    on Rama.
  summary_hi: हनुमान, गिद्ध सम्पाती से सीता का पता जानकर, समुद्र को पार करके लंका
    पहुंचते हैं। वहां, वे अशोक वाटिका में राम का ध्यान करती हुई सीता को पाते हैं।
- id: hanuman-returns-to-rama
  type: event
  keywords:
  - Hanuman
  - Rama
  - Sita
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After discovering Sita in Lanka, Hanuman returns to Rama to convey the
    news. He performs a circumambulation around Rama and informs him of Sita's safety.
  summary_hi: लंका में सीता को खोजने के बाद, हनुमान राम के पास लौटकर यह समाचार देते
    हैं। वह राम की परिक्रमा करते हैं और उन्हें सीता की सुरक्षा की जानकारी देते हैं।
- id: rama-builds-bridge-to-lanka
  type: event
  keywords:
  - Rama
  - Lanka
  - Bridge
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Following the advice of the ocean god, Rama constructs a bridge to Lanka
    with the help of Nala. This enables Rama and his army to reach Lanka and confront
    Ravana.
  summary_hi: समुद्र देवता की सलाह पर, राम नल की मदद से लंका तक एक पुल का निर्माण
    करते हैं। इससे राम और उनकी सेना लंका पहुँचकर रावण का सामना कर सकते हैं।
- id: sita-agni-pariksha
  type: event
  keywords:
  - Sita
  - Agni Pariksha
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Sita undergoes the Agni Pariksha (trial by fire) to prove her purity.
    After emerging unscathed, she is accepted by Rama, and the gods and sages are
    pleased.
  summary_hi: सीता अपनी पवित्रता साबित करने के लिए अग्नि परीक्षा से गुजरती हैं। अग्नि
    से सुरक्षित बाहर आने के बाद, राम उन्हें स्वीकार करते हैं और देवता तथा ऋषि प्रसन्न
    होते हैं।
- id: rama-coronates-vibhishana
  type: event
  keywords:
  - Vibhishana
  - Coronation
  - Rama
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: After defeating Ravana, Rama coronates Vibhishana as the king of Lanka.
    This act brings peace and satisfaction to Rama, who is then free from his burdens.
  summary_hi: रावण को हराने के बाद, राम विभीषण को लंका का राजा बनाते हैं। यह कार्य
    राम को शांति और संतोष प्रदान करता है, और वे अपने बोझ से मुक्त हो जाते हैं।
- id: rama-returns-to-ayodhya
  type: event
  keywords:
  - Rama
  - Ayodhya
  - Return
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama returns to Ayodhya with his companions in the Pushpaka Vimana.
    He is warmly welcomed and resumes his rule, bringing prosperity and happiness
    to the kingdom.
  summary_hi: राम पुष्पक विमान में अपने साथियों के साथ अयोध्या लौटते हैं। उनका गर्मजोशी
    से स्वागत किया जाता है और वे अपने शासन को पुनः प्रारंभ करते हैं, जिससे राज्य में
    समृद्धि और खुशी आती है।
- id: kausalya-realization-episode
  type: story
  keywords:
  - Kausalya
  - realization
  source:
    book: Ananda Ramayan
    sarga: Minoharakandam
  summary_en: Kausalya, the mother of Rama, once approached him in a secluded place
    and expressed her desire for spiritual guidance. Rama advised her to go to the
    cowshed and contemplate. There, she heard the calves repeatedly saying 'Ahm Ma'
    and realized the deeper meaning behind it, which was to let go of ego. This realization
    dispelled her ignorance, and she returned to Rama, expressing her newfound understanding.
  summary_hi: कौसल्या, जो राम की माता हैं, एक बार एकांत में राम के पास गईं और उनसे
    आध्यात्मिक मार्गदर्शन की इच्छा प्रकट की। राम ने उन्हें गोशाला में जाकर ध्यान करने
    की सलाह दी। वहां, उन्होंने बछड़ों को बार-बार 'अहं मा' कहते सुना और इसके पीछे के
    गहरे अर्थ को समझा, जो अहंकार को त्यागने का संदेश था। इस समझ से उनका अज्ञान दूर
    हो गया और वह राम के पास अपनी नई समझ के साथ लौटीं।
- id: ramachandra-devotee-brahmin
  type: story
  keywords:
  - Ramachandra
  - Brahmin
  - Devotion
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: In the town of Ramanathpur, located on the northern bank of the Kaveri
    river, there lived a devout Brahmin named Sundar who was a great devotee of Lord
    Ramachandra. He had nine sons, all of whom were also devoted to Lord Rama. Once,
    during the month of Chaitra, these nine sons traveled to Ayodhya to have a glimpse
    of Lord Ramachandra.
  summary_hi: कावेरी नदी के उत्तरी तट पर स्थित रामनाथपुर में सुंदर नामक एक भक्तिमान
    ब्राह्मण रहते थे, जो भगवान रामचन्द्र के महान भक्त थे। उनके नौ पुत्र थे, जो सभी
    भगवान राम के प्रति समर्पित थे। एक बार, चैत्र मास में, ये नौ पुत्र भगवान रामचन्द्र
    का दर्शन करने अयोध्या गए।
- id: nine-brahmin-sons-visit-ayodhya
  type: event
  keywords:
  - Ayodhya
  - Pilgrimage
  - Devotees
  source:
    book: Ananda Ramayan
    sarga: '3'
  summary_en: During the month of Chaitra, the nine sons of the devout Brahmin Sundar
    traveled to Ayodhya to see Lord Ramachandra. Upon reaching the banks of the Sarayu
    river, they found a large crowd of people from various regions who had gathered
    for the Chaitra bath, making it difficult for them to have a clear view of Lord
    Ramachandra.
  summary_hi: चैत्र मास के दौरान, भक्तिमान ब्राह्मण सुंदर के नौ पुत्र भगवान रामचन्द्र
    का दर्शन करने अयोध्या गए। सरयू नदी के तट पर पहुँचने पर, उन्होंने देखा कि विभिन्न
    क्षेत्रों से आए लोगों की भारी भीड़ चैत्र स्नान के लिए एकत्रित हो गई थी, जिससे
    उन्हें भगवान रामचन्द्र का स्पष्ट दर्शन करना कठिन हो गया।
- id: rama-nine-forms-episode
  type: story
  keywords:
  - Rama
  - nine-forms
  - Brahmins
  source:
    book: Ananda Ramayan
    sarga: Mohanakanda, Sarga 3
  summary_en: In this episode, Rama appears in nine different forms simultaneously
    to a group of Brahmins who are performing penance. The Brahmins are amazed and
    request a boon that would make their fame eternal. Rama grants their wish and
    declares that he will be known by nine names, and anything given in sets of nine
    will be dear to him. After this, Rama merges back into a single form and returns
    to Ayodhya.
  summary_hi: इस प्रकरण में, राम एक साथ नौ विभिन्न रूपों में उन ब्राह्मणों के सामने
    प्रकट होते हैं जो तपस्या कर रहे होते हैं। ब्राह्मण चकित होकर एक वरदान मांगते हैं
    जिससे उनकी कीर्ति चिरस्थायी हो जाए। राम उनकी इच्छा पूरी करते हैं और घोषणा करते
    हैं कि वे नौ नामों से जाने जाएंगे, और जो भी वस्तुएं नौ की संख्या में दी जाएंगी,
    वे उन्हें प्रिय होंगी। इसके बाद, राम फिर से एक रूप में मिल जाते हैं और अयोध्या
    लौट जाते हैं।
- id: ram-navami-vrat-story
  type: story
  keywords:
  - Ram Navami
  - vrat
  - Brahmin
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: A poor Brahmin from Kerala, despite having no family or wealth, devotedly
    performed a ritual every morning. He would create a sand altar by the river, place
    a representation of Lord Rama on it, and worship with great devotion. This story
    illustrates the power of devotion and the significance of the Ram Navami vrat.
  summary_hi: केरल के एक गरीब ब्राह्मण ने, बिना परिवार या धन के होते हुए भी, हर सुबह
    एक अनुष्ठान किया। वह नदी के किनारे रेत की वेदी बनाकर उस पर भगवान राम की प्रतिमा
    स्थापित करता और बड़ी भक्ति से पूजा करता। यह कहानी भक्ति की शक्ति और राम नवमी व्रत
    के महत्व को दर्शाती है।
- id: yudhishthira-seeks-guidance-from-krishna
  type: story
  keywords:
  - Yudhishthira
  - Krishna
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Yudhishthira, deprived of his kingdom, seeks guidance from Krishna while
    residing in the forest with his family. He requests Krishna to suggest a vow that
    would bring prosperity and liberation. Krishna advises him on the power of chanting
    the name of Rama, which is said to grant moksha and prosperity.
  summary_hi: युधिष्ठिर, जो अपने राज्य से वंचित हो गए थे, अपने परिवार के साथ वन में
    निवास करते समय कृष्ण से मार्गदर्शन मांगते हैं। वह कृष्ण से एक ऐसा व्रत बताने का
    अनुरोध करते हैं जो समृद्धि और मुक्ति लाए। कृष्ण उन्हें राम नाम के जप की शक्ति
    के बारे में बताते हैं, जो मोक्ष और समृद्धि प्रदान करने वाला कहा गया है।
- id: hanuman-receives-ram-mantra
  type: story
  keywords:
  - Hanuman
  - Ram Mantra
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Rama instructs Hanuman to head south to gather information about Sita,
    who was abducted by Ravana. Rama gives Hanuman a powerful mantra to overcome obstacles
    and succeed in his mission. Hanuman uses this mantra to cross the ocean and reach
    Lanka, where he finds Sita.
  summary_hi: राम, हनुमान को दक्षिण दिशा में जाकर सीता के बारे में जानकारी इकट्ठा
    करने का निर्देश देते हैं, जिन्हें रावण ने अपहरण कर लिया था। राम हनुमान को एक शक्तिशाली
    मंत्र देते हैं ताकि वह बाधाओं को पार कर अपने मिशन में सफल हो सकें। हनुमान इस मंत्र
    का उपयोग करके समुद्र पार करते हैं और लंका पहुँचते हैं, जहाँ वे सीता को पाते हैं।
- id: hanuman-receives-mantra
  type: story
  keywords:
  - Hanuman
  - mantra
  - Ram
  source:
    book: Ananda Ramayan
    sarga: Mohanakanda
  summary_en: Hanuman expresses concern about his ability to face the demons in the
    south. Lord Rama imparts a powerful mantra to Hanuman, which he uses to successfully
    cross the ocean and reach Lanka. There, he finds Sita and presents her with Rama's
    ring as proof of his identity.
  summary_hi: हनुमान दक्षिण दिशा में राक्षसों का सामना करने की अपनी क्षमता को लेकर
    चिंतित हैं। भगवान राम हनुमान को एक शक्तिशाली मंत्र देते हैं, जिसका उपयोग करके
    वह सफलतापूर्वक समुद्र पार करते हैं और लंका पहुँचते हैं। वहाँ, वे सीता को पाते
    हैं और अपनी पहचान के प्रमाण के रूप में राम की अंगूठी प्रस्तुत करते हैं।
- id: hanuman-ashok-vatika-episode
  type: story
  keywords:
  - Hanuman
  - Ashok Vatika
  - Ram
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Hanuman seeks permission from Sita to eat fruits in the Ashok Vatika,
    which belongs to Ravana. Despite Sita's warning about his lack of strength, Hanuman
    assures her of his power derived from the name of Ram. He enters the garden, uproots
    trees, and defeats the demons who come to stop him. After burning the city, he
    returns to Sita and then to Ram with Sita's ornament.
  summary_hi: हनुमान सीता से अशोक वाटिका में फल खाने की अनुमति मांगते हैं, जो रावण
    की है। सीता की चेतावनी के बावजूद, हनुमान राम के नाम से मिली शक्ति का आश्वासन देते
    हैं। वह बगीचे में प्रवेश करते हैं, पेड़ों को उखाड़ते हैं और उन्हें रोकने आए राक्षसों
    को पराजित करते हैं। शहर को जलाने के बाद, वह सीता के पास लौटते हैं और फिर राम के
    पास सीता के आभूषण के साथ लौटते हैं।
- id: ram-nama-mahatmya-concept
  type: concept
  keywords:
  - Ram Nama
  - Mahatmya
  - Japa
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The passage highlights the greatness of chanting the name of Ram. It
    describes the benefits of reciting the Ram mantra, which can destroy sins equivalent
    to millions of Brahmahatyas. The mantra 'Shri Ram Jai Ram Jai Jai Ram' is particularly
    emphasized for its potency.
  summary_hi: यह अंश राम नाम के जप की महानता को दर्शाता है। यह राम मंत्र के जप के
    लाभों का वर्णन करता है, जो लाखों ब्रह्महत्या के पापों को नष्ट कर सकता है। 'श्रीराम
    जय राम जय जय राम' मंत्र को विशेष रूप से इसकी शक्ति के लिए महत्व दिया गया है।
- id: birth-of-rama
  type: event
  keywords:
  - Rama
  - birth
  source:
    book: Ananda Ramayan
    sarga: '11'
  summary_en: Lord Rama was born to Queen Kausalya and King Dasharatha in Ayodhya
    on the ninth day of the bright half of the month of Chaitra, under the Punarvasu
    Nakshatra. His birth was celebrated with great joy by the gods and people alike,
    marking the beginning of a new era free from the fear of demons.
  summary_hi: भगवान राम का जन्म अयोध्या में रानी कौसल्या और राजा दशरथ के घर चैत्र
    मास के शुक्ल पक्ष की नवमी तिथि को पुनर्वसु नक्षत्र में हुआ। उनके जन्म का देवताओं
    और लोगों ने बड़े हर्षोल्लास के साथ स्वागत किया, जो राक्षसों के भय से मुक्त एक
    नए युग की शुरुआत का संकेत था।
- id: ramchandra-blesses-brahmin
  type: story
  keywords:
  - Ramchandra
  - Brahmin
  - Godavari
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Ramchandra appears before a Brahmin and advises him not to return to
    Ayodhya but to visit a sacred place near the Godavari River. There, he should
    perform rituals in Ram's name to cleanse his sins and gain a son.
  summary_hi: रामचन्द्र एक ब्राह्मण के सामने प्रकट होते हैं और उसे अयोध्या न लौटने
    की सलाह देते हैं। इसके बजाय, उसे गोदावरी नदी के पास एक पवित्र स्थान पर जाकर राम
    के नाम से अनुष्ठान करने चाहिए ताकि उसके पाप धुल जाएं और उसे पुत्र की प्राप्ति
    हो।
- id: brahmin-rituals-and-son
  type: story
  keywords:
  - Brahmin
  - Rituals
  - Son
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The Brahmin follows Ramchandra's advice, performs rituals with his wife
    at the sacred site, and eventually returns to his city blessed with a son due
    to the power of the rituals.
  summary_hi: ब्राह्मण रामचन्द्र की सलाह का पालन करता है, अपनी पत्नी के साथ पवित्र
    स्थल पर अनुष्ठान करता है, और अंततः अनुष्ठानों की शक्ति के कारण पुत्र के साथ अपने
    नगर लौटता है।
- id: apsara-rambha-and-pishachas
  type: story
  keywords:
  - Apsara Rambha
  - Pishachas
  - Liberation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Apsara Rambha, while bathing in the Sarayu River, inadvertently sprinkles
    water on three Pishachas, liberating them from their cursed existence. The Pishachas
    regain memories of their past lives and express gratitude to Rambha.
  summary_hi: अप्सरा रम्भा सरयू नदी में स्नान करते समय अनजाने में तीन पिशाचों पर पानी
    छिड़क देती है, जिससे वे अपने शापित अस्तित्व से मुक्त हो जाते हैं। पिशाच अपने पिछले
    जन्मों की यादें वापस पा लेते हैं और रम्भा के प्रति आभार व्यक्त करते हैं।
- id: pisacha-curse-and-redemption
  type: story
  keywords:
  - pisacha
  - curse
  - redemption
  source:
    book: Ananda Ramayan
    sarga: मनोहरकाण्डस्‌
  summary_en: Two individuals, cursed to become pisachas due to their actions in a
    previous life, recount their story. They were born to a Brahmin and a woman named
    Biraja and later cursed by their guru for misconduct. They are told that their
    redemption will come when a Brahmin named Nrisiha visits the forest and grants
    them liberation through his pious deeds.
  summary_hi: दो व्यक्ति, जो अपने पिछले जीवन के कर्मों के कारण पिशाच बनने का शापित
    हुए थे, अपनी कहानी सुनाते हैं। वे बिरजा नामक स्त्री और एक ब्राह्मण के पुत्र थे
    और अपने गुरु द्वारा अनुचित आचरण के लिए शापित हुए थे। उन्हें बताया गया कि उनकी
    मुक्ति तब होगी जब नृसिह नामक ब्राह्मण वन में आएंगे और अपने पुण्य कर्मों से उन्हें
    उद्धार देंगे।
- id: lion-elephant-reincarnation-story
  type: story
  keywords:
  - reincarnation
  - curse
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In a previous life, a Brahmin who was a critic of all religions and
    indulged in heretical talks was cursed to be reborn as a lion after he disparaged
    the significance of the month of Chaitra. The curse would be lifted only when
    he heard the glory of Chaitra from a Brahmin's mouth. In his current life as a
    lion, he recalls his past life upon hearing the story of Chaitra from a Brahmin
    named Shambhu and pleads for salvation.
  summary_hi: एक पूर्व जन्म में, एक ब्राह्मण जो सभी धर्मों का निंदक था और पाखंड से
    भरी बातें करता था, उसे चैत्र मास की महिमा की निंदा करने पर शाप दिया गया था कि
    वह सिंह के रूप में पुनर्जन्म लेगा। यह शाप तब समाप्त होगा जब वह किसी ब्राह्मण के
    मुख से चैत्र की महिमा सुनेगा। वर्तमान जीवन में सिंह के रूप में, वह शम्भु नामक
    ब्राह्मण से चैत्र की कहानी सुनकर अपने पूर्व जन्म को याद करता है और मुक्ति की प्रार्थना
    करता है।
- id: brahmin-elephant-curse
  type: story
  keywords:
  - curse
  - elephant
  - past-life
  source:
    book: Ananda Ramayan
    sarga: Madhura Kanda
  summary_en: A Brahmin recounts his past life where he lived in Ramanathapur on the
    northern bank of the Kaveri River. He was a corrupt Brahmin who indulged in vices
    and was cursed to be reborn as an elephant due to eating on a Navami day, which
    was against the scriptures.
  summary_hi: एक ब्राह्मण अपने पूर्वजन्म की कथा सुनाता है, जहाँ वह कावेरी नदी के उत्तरी
    तट पर स्थित रामनाथपुर में रहता था। वह एक भ्रष्ट ब्राह्मण था जो बुराइयों में लिप्त
    था और नवमी के दिन भोजन करने के कारण उसे हाथी के रूप में पुनर्जन्म का शाप मिला।
- id: redemption-through-ramanavami
  type: story
  keywords:
  - redemption
  - Ramanavami
  - pilgrimage
  source:
    book: Ananda Ramayan
    sarga: Madhura Kanda
  summary_en: In his past life, the Brahmin had once listened to the story of Rama
    on Ramanavami and bathed in the sacred Ramateertha, which earned him the merit
    to eventually meet a sage who promised to liberate him from his current cursed
    form.
  summary_hi: अपने पूर्वजन्म में, ब्राह्मण ने एक बार रामनवमी के दिन राम की कथा सुनी
    थी और पवित्र रामतीर्थ में स्नान किया था, जिससे उसे वह पुण्य प्राप्त हुआ जिसने
    उसे एक ऋषि से मिलने का अवसर दिया, जिसने उसे उसके वर्तमान शापित रूप से मुक्त करने
    का वादा किया।
- id: shabari-guides-women-to-rama
  type: event
  keywords:
  - Shabari
  - Rama
  - women
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Shabari guides a group of women to meet Lord Rama. The women, with lotus-like
    eyes, see Rama and offer their respects. They present divine food and water in
    golden vessels, sent by Goddess Durga, to Rama.
  summary_hi: शबरी कुछ स्त्रियों को भगवान राम से मिलवाने ले जाती हैं। कमल के समान
    नेत्रों वाली स्त्रियाँ राम को देखती हैं और प्रणाम करती हैं। वे देवी दुर्गा द्वारा
    भेजे गए दिव्य भोजन और जल को स्वर्ण पात्रों में राम के समक्ष प्रस्तुत करती हैं।
- id: durga-sends-food-to-rama
  type: event
  keywords:
  - Durga
  - Rama
  - food
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Goddess Durga sends food to Lord Rama through the women. She instructs
    them to first offer the food to Rama and then bring back what remains. Durga reveals
    that Rama is an incarnation of Maheshwara and she is Sita.
  summary_hi: देवी दुर्गा स्त्रियों के माध्यम से भगवान राम के लिए भोजन भेजती हैं।
    वह उन्हें निर्देश देती हैं कि पहले राम को भोजन कराएं और फिर जो बच जाए उसे वापस
    लाएं। दुर्गा बताती हैं कि राम साक्षात महेश्वर के अवतार हैं और वह स्वयं सीता हैं।
- id: durga-manifests-as-sita
  type: event
  keywords:
  - Durga
  - Sita
  - manifestation
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Upon receiving Rama's message, Goddess Durga manifests herself in the
    form of Sita and comes out to meet Rama. She closes the temple door securely and
    approaches Rama with a water vessel, sitting beside him.
  summary_hi: राम का संदेश पाकर देवी दुर्गा सीता के रूप में प्रकट होती हैं और राम
    से मिलने के लिए बाहर आती हैं। वह मंदिर के दरवाजे को मजबूती से बंद करती हैं और
    जल पात्र लेकर राम के पास जाकर बैठ जाती हैं।
- id: ram-identity-revelation
  type: story
  keywords:
  - Ram
  - Shiva
  - revelation
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: In this episode, the companions of Ram realize that he is the incarnation
    of Lord Shiva after hearing the words of Shabari. They also recognize Sita as
    the incarnation of Parvati. This revelation brings a sense of awe and reverence
    among them.
  summary_hi: इस प्रकरण में, राम के साथियों को शबरी के शब्द सुनने के बाद यह एहसास
    होता है कि राम भगवान शिव के अवतार हैं। वे सीता को पार्वती के अवतार के रूप में
    भी पहचानते हैं। इस रहस्योद्घाटन से उनमें श्रद्धा और विस्मय की भावना उत्पन्न होती
    है।
- id: ram-boon-to-women
  type: story
  keywords:
  - Ram
  - boon
  - women
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Ram grants a boon to the women present, stating that their devotion
    to him will be greater than that of men. He assures them that they will remain
    pure and will be known by his name. This boon signifies the special place women
    hold in devotion to Ram.
  summary_hi: राम उपस्थित महिलाओं को वरदान देते हैं कि उनकी भक्ति पुरुषों की अपेक्षा
    अधिक होगी। वे उन्हें आश्वासन देते हैं कि वे पवित्र रहेंगी और उनके नाम से जानी
    जाएंगी। यह वरदान राम की भक्ति में महिलाओं की विशेष स्थिति को दर्शाता है।
- id: future-incarnation-promise
  type: story
  keywords:
  - Ram
  - future
  - incarnation
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: Ram promises the women that in the future, during the Dwapara Yuga,
    he will appear to them as Krishna. This promise provides them with hope and assurance
    of his eternal presence and guidance.
  summary_hi: राम महिलाओं से वादा करते हैं कि भविष्य में, द्वापर युग के दौरान, वे
    कृष्ण के रूप में उनके सामने प्रकट होंगे। यह वादा उन्हें उनकी अनंत उपस्थिति और
    मार्गदर्शन की आशा और आश्वासन प्रदान करता है।
- id: ram-mudra-practice
  type: practice
  keywords:
  - ram-mudra
  - spiritual-practice
  source:
    book: Ananda Ramayan
    sarga: '12'
  summary_en: In this episode, sages approach Lord Rama seeking guidance for the welfare
    of Brahmins in the Kali Yuga. Rama advises them to wear clothes marked with his
    insignia, the Ram Mudra, as a spiritual practice. This practice is said to protect
    them from sins and grant liberation.
  summary_hi: इस प्रकरण में, ऋषि भगवान राम के पास कलियुग में ब्राह्मणों के कल्याण
    के लिए मार्गदर्शन मांगने आते हैं। राम उन्हें सलाह देते हैं कि वे राम मुद्रा से
    अंकित वस्त्र पहनें, जो एक आध्यात्मिक अभ्यास है। कहा जाता है कि यह अभ्यास उन्हें
    पापों से बचाता है और मुक्ति प्रदान करता है।
- id: vishvamitra-teaches-ram
  type: story
  keywords:
  - Vishvamitra
  - Ram
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Vishvamitra imparts the knowledge of weaponry to Ram, preparing him
    for future battles. This marks the beginning of Ram's martial training.
  summary_hi: विश्वामित्र राम को शस्त्र विद्या सिखाते हैं, जिससे राम भविष्य के युद्धों
    के लिए तैयार होते हैं। यह राम के युद्ध प्रशिक्षण की शुरुआत है।
- id: tataka-slaying
  type: story
  keywords:
  - Tataka
  - Ram
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Ram slays the demoness Tataka as part of his training under Vishvamitra.
    This act demonstrates his growing prowess and commitment to righteousness.
  summary_hi: राम विश्वामित्र के प्रशिक्षण के दौरान राक्षसी ताड़का का वध करते हैं।
    यह कार्य उनकी बढ़ती हुई शक्ति और धर्म के प्रति उनकी प्रतिबद्धता को दर्शाता है।
- id: ahalya-redemption
  type: story
  keywords:
  - Ahalya
  - Redemption
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Ram redeems Ahalya from her curse by Gautama Rishi. This episode highlights
    Ram's role as a restorer of dharma and compassion.
  summary_hi: राम गौतम ऋषि के शाप से अहल्या का उद्धार करते हैं। यह प्रकरण राम की धर्म
    और करुणा के पुनर्स्थापक के रूप में भूमिका को उजागर करता है।
- id: sita-swayamvara
  type: event
  keywords:
  - Sita
  - Swayamvara
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Ram participates in Sita's swayamvara and wins her hand by breaking
    the bow of Shiva. This event marks the union of Ram and Sita.
  summary_hi: राम सीता के स्वयंवर में भाग लेते हैं और शिव के धनुष को तोड़कर सीता का
    हाथ जीतते हैं। यह घटना राम और सीता के मिलन को चिह्नित करती है।
- id: parashurama-defeat
  type: story
  keywords:
  - Parashurama
  - Defeat
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Ram defeats Parashurama, showcasing his divine strength and establishing
    his supremacy. This encounter signifies the transition of power from Parashurama
    to Ram.
  summary_hi: राम परशुराम को पराजित करते हैं, अपनी दिव्य शक्ति को प्रदर्शित करते हुए
    और अपनी श्रेष्ठता स्थापित करते हैं। यह मुठभेड़ परशुराम से राम तक शक्ति के संक्रमण
    को दर्शाती है।
- id: ram-exile
  type: story
  keywords:
  - Ram
  - Exile
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Due to Kaikeyi's boon, Ram is exiled to the forest for fourteen years.
    This pivotal event sets the stage for the epic adventures and trials of Ram, Sita,
    and Lakshman.
  summary_hi: कैकेयी के वरदान के कारण राम को चौदह वर्षों के लिए वनवास भेजा जाता है।
    यह महत्वपूर्ण घटना राम, सीता और लक्ष्मण के महाकाव्य रोमांच और परीक्षाओं की पृष्ठभूमि
    तैयार करती है।
- id: sita-abduction
  type: story
  keywords:
  - Sita
  - Abduction
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Ravana abducts Sita, leading to a series of events that culminate in
    the epic battle between Ram and Ravana. This incident is central to the Ramayana
    narrative.
  summary_hi: रावण सीता का अपहरण करता है, जिससे घटनाओं की एक श्रृंखला शुरू होती है
    जो राम और रावण के महाकाव्य युद्ध में समाप्त होती है। यह घटना रामायण कथा के केंद्र
    में है।
- id: hanuman-lanka-visit
  type: story
  keywords:
  - Hanuman
  - Lanka
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Hanuman leaps across the ocean to Lanka to find Sita. His journey and
    subsequent meeting with Sita are crucial in the efforts to rescue her.
  summary_hi: हनुमान सागर पार कर लंका जाते हैं ताकि सीता को खोज सकें। उनकी यात्रा
    और सीता से उनकी मुलाकात उसे बचाने के प्रयासों में महत्वपूर्ण है।
- id: setu-bandhan
  type: event
  keywords:
  - Setu
  - Bridge
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: The construction of the bridge to Lanka, known as Setu Bandhan, is a
    monumental task undertaken by Ram's army. It symbolizes unity and determination
    in the face of adversity.
  summary_hi: लंका तक पुल का निर्माण, जिसे सेतु बंधन के नाम से जाना जाता है, राम की
    सेना द्वारा किया गया एक विशाल कार्य है। यह विपत्ति के सामने एकता और दृढ़ संकल्प
    का प्रतीक है।
- id: vibhishana-coronation
  type: event
  keywords:
  - Vibhishana
  - Coronation
  source:
    book: Ananda Ramayan
    sarga: '17'
  summary_en: Vibhishana is crowned as the king of Lanka after Ravana's defeat. This
    event marks the restoration of dharma and the establishment of a just rule in
    Lanka.
  summary_hi: रावण की हार के बाद विभीषण को लंका का राजा बनाया जाता है। यह घटना धर्म
    की पुनर्स्थापना और लंका में न्यायपूर्ण शासन की स्थापना को चिह्नित करती है।
- id: kalnemi-vadha
  type: story
  keywords:
  - Kalnemi
  - demon
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The episode describes the slaying of the demon Kalnemi. This event is
    a significant part of the narrative where the forces of good triumph over evil.
  summary_hi: यह प्रकरण राक्षस कालनेमि के वध का वर्णन करता है। यह घटना उस कथा का महत्वपूर्ण
    हिस्सा है जहाँ अच्छाई की बुराई पर विजय होती है।
- id: kumbhakarna-vadha
  type: story
  keywords:
  - Kumbhakarna
  - demon
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The episode narrates the slaying of Kumbhakarna, a giant demon and brother
    of Ravana. His death is a pivotal moment in the battle against Ravana's forces.
  summary_hi: यह प्रकरण कुंभकर्ण के वध का वर्णन करता है, जो रावण का विशालकाय राक्षस
    भाई था। उसकी मृत्यु रावण की सेना के खिलाफ युद्ध में एक महत्वपूर्ण क्षण है।
- id: meghnad-vadha
  type: story
  keywords:
  - Meghnad
  - Indrajit
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: This episode details the defeat of Meghnad, also known as Indrajit,
    the son of Ravana. His defeat marks a significant victory for Rama's army.
  summary_hi: यह प्रकरण मेघनाद, जिसे इंद्रजीत भी कहा जाता है, की हार का वर्णन करता
    है। वह रावण का पुत्र था और उसकी हार राम की सेना के लिए एक महत्वपूर्ण विजय है।
- id: sita-divya-daan
  type: story
  keywords:
  - Sita
  - divine gift
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The episode describes the divine gift given to Sita. This event signifies
    the divine favor and blessings bestowed upon her.
  summary_hi: यह प्रकरण सीता को दिए गए दिव्य उपहार का वर्णन करता है। यह घटना उनके
    ऊपर दिव्य कृपा और आशीर्वाद का प्रतीक है।
- id: hanuman-birth-and-boon
  type: story
  keywords:
  - Hanuman
  - birth
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: This episode narrates the birth and the boons received by Hanuman. It
    highlights his divine origin and the powers bestowed upon him.
  summary_hi: यह प्रकरण हनुमान के जन्म और उन्हें प्राप्त वरदानों का वर्णन करता है।
    यह उनके दिव्य उत्पत्ति और उन पर प्रदत्त शक्तियों को उजागर करता है।
- id: arjuna-hanuman-encounter
  type: story
  keywords:
  - Arjuna
  - Hanuman
  source:
    book: Ananda Ramayan
    sarga: '18'
  summary_en: In this episode, Arjuna goes hunting in the forest and encounters Hanuman
    in the form of a simple monkey. Arjuna, proud of his archery skills, questions
    the necessity of Lord Rama's bridge to Lanka, suggesting he could have built it
    with arrows. Hanuman challenges Arjuna to prove his claim, leading to a demonstration
    of Arjuna's skills and Hanuman's divine intervention.
  summary_hi: इस प्रकरण में अर्जुन वन में शिकार करने जाते हैं और साधारण वानर के रूप
    में हनुमान से मिलते हैं। अर्जुन, अपनी धनुर्विद्या पर गर्व करते हुए, राम सेतु की
    आवश्यकता पर प्रश्न उठाते हैं और कहते हैं कि वह तीरों से पुल बना सकते थे। हनुमान
    अर्जुन को अपनी बात साबित करने की चुनौती देते हैं, जिससे अर्जुन की कौशल और हनुमान
    की दिव्यता का प्रदर्शन होता है।
- id: hanuman-arjuna-bridge-challenge
  type: story
  keywords:
  - Hanuman
  - Arjuna
  - bridge
  - challenge
  source:
    book: Ananda Ramayan
    sarga: '18'
  summary_en: In a conversation between Hanuman and Arjuna, Arjuna questions why Lord
    Rama did not use arrows to build a bridge across the ocean instead of stones.
    Hanuman explains that the weight of the monkeys would have sunk an arrow bridge.
    Arjuna challenges Hanuman, claiming he can build a bridge with arrows that can
    withstand Hanuman's weight. Hanuman accepts the challenge, and when Arjuna's bridge
    is built, Hanuman easily sinks it with his thumb, proving his point.
  summary_hi: हनुमान और अर्जुन के बीच बातचीत में, अर्जुन पूछते हैं कि भगवान राम ने
    समुद्र पर पत्थरों की बजाय तीरों से पुल क्यों नहीं बनाया। हनुमान बताते हैं कि बंदरों
    के वजन से तीरों का पुल डूब जाता। अर्जुन चुनौती देते हैं कि वह तीरों से ऐसा पुल
    बना सकते हैं जो हनुमान के वजन को सह सके। हनुमान इस चुनौती को स्वीकार करते हैं
    और जब अर्जुन का पुल बनता है, तो हनुमान उसे अपने अंगूठे से आसानी से डुबा देते हैं,
    जिससे उनकी बात साबित होती है।
- id: arjuna-krishna-sea-bridge-episode
  type: story
  keywords:
  - Arjuna
  - Krishna
  - Sea Bridge
  - Hanuman
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Arjuna attempts to jump into a funeral pyre by the sea, but is stopped
    by Hanuman. Krishna, disguised as a Brahmachari, questions Arjuna and reveals
    that the wager they made earlier was invalid due to lack of witnesses. Krishna
    offers to be the witness and asks them to recreate the bridge. This time, Krishna
    uses his Sudarshan Chakra to stabilize the bridge, preventing Hanuman from sinking
    it. Hanuman realizes Krishna's divine intervention and acknowledges his defeat.
  summary_hi: अर्जुन समुद्र के किनारे चिता में कूदने का प्रयास करते हैं, लेकिन हनुमान
    उन्हें रोकते हैं। कृष्ण ब्रह्मचारी के रूप में प्रकट होते हैं और अर्जुन से पूछते
    हैं कि वह चिता में क्यों कूदना चाहते हैं। कृष्ण बताते हैं कि पहले की बाजी गवाहों
    के बिना थी और अब वह गवाह बनकर निर्णय करेंगे। कृष्ण अपने सुदर्शन चक्र से पुल को
    स्थिर करते हैं, जिससे हनुमान उसे डुबो नहीं पाते। हनुमान कृष्ण की दिव्यता को पहचानते
    हैं और अपनी हार स्वीकार करते हैं।
- id: hanuman-krishna-encounter
  type: story
  keywords:
  - hanuman
  - krishna
  source:
    book: Ananda Ramayan
    sarga: Madhya Sarga
  summary_en: Hanuman meets Krishna, fulfilling a boon given by Rama in Treta Yuga.
    Krishna reveals his divine form to Hanuman, who is overwhelmed with devotion and
    gratitude.
  summary_hi: हनुमान कृष्ण से मिलते हैं, जो त्रेता युग में राम द्वारा दिए गए वरदान
    को पूरा करते हैं। कृष्ण अपने दिव्य रूप का दर्शन हनुमान को कराते हैं, जिससे हनुमान
    भक्ति और कृतज्ञता से अभिभूत हो जाते हैं।
- id: arjuna-bridge-dissolution
  type: story
  keywords:
  - arjuna
  - bridge
  source:
    book: Ananda Ramayan
    sarga: Madhya Sarga
  summary_en: Arjuna's pride is humbled when the bridge he built is dissolved by the
    sea waves, following Krishna's instructions. This event teaches Arjuna a lesson
    about humility and the futility of pride.
  summary_hi: अर्जुन का गर्व तब चूर हो जाता है जब कृष्ण के निर्देश पर समुद्र की लहरों
    द्वारा बनाया गया पुल विलीन हो जाता है। यह घटना अर्जुन को विनम्रता और गर्व की निरर्थकता
    का पाठ सिखाती है।
- id: soma-birth-story
  type: story
  keywords:
  - Soma
  - birth
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In the Satya Yuga, a sage named Atri saw the moon's face, which was
    as beautiful as a lotus, and released his seed, resulting in the birth of a son
    named Soma. Soma went on to perform great penance by the banks of the Ganges.
  summary_hi: सत्ययुग में अत्रि नामक ऋषि ने चंद्रमा का मुख देखा, जो कमल के समान सुंदर
    था, और अपना वीर्य त्याग दिया, जिससे एक पुत्र का जन्म हुआ जिसका नाम सोम रखा गया।
    सोम ने गंगा के तट पर महान तप किया।
- id: hastinapur-creation-story
  type: story
  keywords:
  - Hastinapur
  - creation
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: During Soma's penance, an elephant was killed by birds, which intrigued
    Soma. He believed it was due to the land's power and established a city there,
    naming it Hastinapur after the elephant's destruction.
  summary_hi: सोम के तप के दौरान, पक्षियों ने एक हाथी को मार डाला, जिससे सोम को कौतुक
    हुआ। उन्होंने इसे भूमि की शक्ति के कारण माना और वहां एक नगर बसाया, जिसका नाम हाथी
    के विनाश के कारण हस्तिनापुर रखा।
- id: soma-rule-story
  type: story
  keywords:
  - Soma
  - rule
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The inhabitants of Hastinapur requested Soma to become their king. Soma's
    son, Budha, was born, and together they conquered all the islands and eventually
    ascended to the heavenly realms.
  summary_hi: हस्तिनापुर के निवासियों ने सोम से राजा बनने का आग्रह किया। सोम के पुत्र
    बुध का जन्म हुआ, और उन्होंने मिलकर सभी द्वीपों को जीत लिया और अंततः स्वर्गलोक
    चले गए।
- id: brahma-intervenes-in-battle
  type: event
  keywords:
  - Brahma
  - battle
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: In a battle involving Rama, Brahma intervenes to stop the conflict.
    He chastises the warriors for attempting to fight Rama, who is an incarnation
    of Vishnu. Brahma advises them to seek refuge in Rama to avoid destruction.
  summary_hi: राम के साथ एक युद्ध में, ब्रह्मा हस्तक्षेप करते हैं और संघर्ष को रोकने
    का प्रयास करते हैं। वह योद्धाओं को राम से लड़ने की कोशिश के लिए फटकारते हैं, जो
    विष्णु के अवतार हैं। ब्रह्मा उन्हें विनाश से बचने के लिए राम की शरण में जाने की
    सलाह देते हैं।
- id: rama-welcomes-shiva
  type: event
  keywords:
  - Rama
  - Shiva
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: When Shiva arrives, Rama descends from the Pushpaka Vimana to welcome
    and pay respects to him. Rama performs a formal worship of Shiva and other deities,
    showing his reverence.
  summary_hi: जब शिव आते हैं, तो राम पुष्पक विमान से उतरकर उनका स्वागत और सम्मान करते
    हैं। राम शिव और अन्य देवताओं की विधिवत पूजा करते हैं, जिससे उनकी श्रद्धा प्रकट
    होती है।
- id: brahma-grants-boon-to-soma-dynasty
  type: event
  keywords:
  - Brahma
  - boon
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Brahma reveals that he has granted a boon to the Soma dynasty, ensuring
    they remain undefeated until the end of the Dvapara Yuga. He requests Rama to
    protect the kings of this dynasty.
  summary_hi: ब्रह्मा बताते हैं कि उन्होंने सोम वंश को एक वरदान दिया है, जिससे वे
    द्वापर युग के अंत तक अजेय रहेंगे। वह राम से इस वंश के राजाओं की रक्षा करने का
    अनुरोध करते हैं।
- id: brahma-pleads-to-ram
  type: story
  keywords:
  - Brahma
  - Ram
  - plea
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Brahma approaches Ram to explain that while he has the power to aid
    others, he cannot assist Ram directly. Brahma requests Ram to intervene with his
    son, Kush, who is in his youth and not heeding advice. Ram suggests that Brahma
    visit Valmiki for guidance.
  summary_hi: ब्रह्मा राम के पास आते हैं और बताते हैं कि उनके पास दूसरों की सहायता
    करने की शक्ति है, लेकिन वे राम की सीधे मदद नहीं कर सकते। ब्रह्मा राम से उनके पुत्र
    कुश से बात करने का अनुरोध करते हैं, जो युवावस्था में है और सलाह नहीं मान रहा है।
    राम ब्रह्मा को वाल्मीकि के पास जाने की सलाह देते हैं।
- id: valmiki-advises-brahma
  type: story
  keywords:
  - Valmiki
  - Brahma
  - advice
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Valmiki advises Brahma that the wives of Nal and others should plead
    with Sita for their husbands' lives. If Sita is pleased, Kush will also relent.
    Following this advice, Brahma sends messengers to bring the wives to Sita.
  summary_hi: वाल्मीकि ब्रह्मा को सलाह देते हैं कि नल और अन्य की पत्नियाँ सीता से
    अपने पतियों के जीवन के लिए प्रार्थना करें। यदि सीता प्रसन्न होती हैं, तो कुश भी
    मान जाएगा। इस सलाह के अनुसार, ब्रह्मा दूतों को भेजकर पत्नियों को सीता के पास लाते
    हैं।
- id: sita-meets-the-wives
  type: event
  keywords:
  - Sita
  - wives
  - meeting
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: The wives of Nal and others arrive with gifts to meet Sita. They find
    her surrounded by her companions, and upon seeing them, Sita rises and greets
    them warmly. The wives then plead for their husbands' lives.
  summary_hi: नल और अन्य की पत्नियाँ उपहार लेकर सीता से मिलने आती हैं। वे सीता को
    उनकी सखियों से घिरी हुई पाती हैं, और उन्हें देखकर सीता उठकर उनका स्वागत करती हैं।
    पत्नियाँ अपने पतियों के जीवन के लिए प्रार्थना करती हैं।
- id: kush-brahma-discussion
  type: story
  keywords:
  - Kush
  - Brahma
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: Kush speaks to Brahma, suggesting that if the kings like Nala follow
    his orders, he will keep them safe. Brahma agrees and instructs Kush to allow
    them to bear umbrellas, signifying their status, while they continue to serve
    under his command.
  summary_hi: कुश ब्रह्मा से कहते हैं कि यदि नल जैसे राजा उनकी आज्ञा का पालन करें,
    तो वे उन्हें सुरक्षित रखेंगे। ब्रह्मा सहमत होते हैं और कुश को उन्हें छत्र धारण
    करने की अनुमति देने का निर्देश देते हैं, जो उनके दर्जे का प्रतीक है, जबकि वे उनकी
    आज्ञा का पालन करते रहेंगे।
- id: ajamidh-coronation
  type: event
  keywords:
  - Ajamidh
  - Coronation
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: Brahma, following the instructions of Rama, coronates Ajamidh as the
    king of Hastinapura. This event marks the transition of power to Ajamidh, who
    is part of the Soma dynasty.
  summary_hi: ब्रह्मा, राम के निर्देशों का पालन करते हुए, अजमीढ़ का हस्तिनापुर के
    राजा के रूप में राज्याभिषेक करते हैं। यह घटना सोम वंश के सदस्य अजमीढ़ को सत्ता
    का हस्तांतरण दर्शाती है।
- id: vibhishan-lanka-stay
  type: story
  keywords:
  - Vibhishan
  - Lanka
  source:
    book: Ananda Ramayan
    sarga: '4'
  summary_en: Rama instructs Vibhishan to stay in Lanka as long as his name is revered
    on earth. Vibhishan accepts Rama's command and returns to Lanka, honored by Rama's
    words.
  summary_hi: राम विभीषण को निर्देश देते हैं कि जब तक उनके नाम का पृथ्वी पर प्रचार
    होता रहे, तब तक वे लंका में रहें। विभीषण राम की आज्ञा स्वीकार करते हैं और लंका
    लौट जाते हैं, राम के शब्दों से सम्मानित होते हैं।
- id: hanuman-receives-gifts-from-rama
  type: story
  keywords:
  - Hanuman
  - Rama
  - gifts
  source:
    book: Ananda Ramayan
    sarga: पूर्णकाण्डम् 375
  summary_en: Before departing, Rama gives Hanuman a necklace from his own neck as
    a token of appreciation for his help in Lanka. Sita also gives Hanuman her armlet.
    Hanuman, with tears in his eyes, bows to Rama and Sita and departs to the Himalayas
    for penance.
  summary_hi: प्रस्थान से पहले, राम हनुमान को लंका में उनकी सहायता के लिए अपनी गर्दन
    से एक रत्नमाला देते हैं। सीता भी हनुमान को अपना बाहुभूषण देती हैं। हनुमान, आँखों
    में आँसू भरकर, राम और सीता को प्रणाम करते हैं और तपस्या के लिए हिमालय की ओर प्रस्थान
    करते हैं।
- id: rama-sends-allies-to-different-places
  type: event
  keywords:
  - Rama
  - allies
  - dispatch
  source:
    book: Ananda Ramayan
    sarga: पूर्णकाण्डम् 375
  summary_en: Rama sends his allies to various places after his reign. He sends Sugriva
    to Kishkindha, Vibhishana to Lanka, and other allies to different locations with
    gifts and honors. This marks the dispersal of Rama's allies to their respective
    domains.
  summary_hi: राम अपने शासन के बाद अपने सहयोगियों को विभिन्न स्थानों पर भेजते हैं।
    वे सुग्रीव को किष्किंधा, विभीषण को लंका और अन्य सहयोगियों को विभिन्न स्थानों पर
    उपहार और सम्मान के साथ भेजते हैं। यह राम के सहयोगियों के उनके संबंधित क्षेत्रों
    में प्रस्थान का प्रतीक है।
- id: rama-final-journey
  type: story
  keywords:
  - Rama
  - Vaikuntha
  - Ayodhya
  source:
    book: Ananda Ramayan
    sarga: ''
  summary_en: Lord Rama, after waking up with Sita, informs Ajameedha of his intention
    to journey to Vaikuntha with Sita, the Vanaras, and all beings. He instructs Ajameedha
    to send his belongings to Ayodhya and to inform his son Kush of his departure.
    Rama performs rituals, gives donations to Brahmins, and then, along with Sita,
    enters the divine realm of Vaikuntha, transforming into his Vishnu form.
  summary_hi: भगवान राम, सीता के साथ जागने के बाद, अजमीढ़ को सूचित करते हैं कि वे
    सीता, वानरों और सभी प्राणियों के साथ वैकुंठ की यात्रा करेंगे। वे अजमीढ़ को अपने
    सामान अयोध्या भेजने और अपने पुत्र कुश को उनके प्रस्थान की सूचना देने का निर्देश
    देते हैं। राम अनुष्ठान करते हैं, ब्राह्मणों को दान देते हैं, और फिर सीता के साथ
    वैकुंठ के दिव्य लोक में प्रवेश करते हैं, जहां वे विष्णु के रूप में परिवर्तित हो
    जाते हैं।

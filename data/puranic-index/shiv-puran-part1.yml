- id: veerabhadra-destruction-of-daksha-yajna
  type: event
  keywords:
  - Veerabhadra
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Veerabhadra, along with Shiva's attendants, destroys Daksha's Yajna
    and kills Daksha. He then returns to Mount Kailash, where Lord Shiva, pleased
    with his actions, appoints him as the leader of his attendants.
  summary_hi: वीरभद्र, शिव के गणों के साथ, दक्ष के यज्ञ का विध्वंस करते हैं और दक्ष
    का वध करते हैं। इसके बाद वह कैलास पर्वत पर लौट जाते हैं, जहाँ भगवान शिव उनके कार्यों
    से प्रसन्न होकर उन्हें गणाध्यक्ष पद प्रदान करते हैं।
- id: dadheechi-muni-and-king-kshuva-conflict
  type: story
  keywords:
  - Dadheechi
  - King Kshuva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The story of the conflict between Sage Dadheechi and King Kshuva is
    narrated. Shukracharya teaches Dadheechi the Mahamrityunjaya Mantra, which makes
    him invincible.
  summary_hi: दधीचि मुनि और राजा क्षुव के विवाद की कहानी का वर्णन किया गया है। शुक्राचार्य
    दधीचि को महामृत्युंजय मंत्र का उपदेश देते हैं, जिससे वह अवध्य हो जाते हैं।
- id: parvati-birth-and-divine-appearance
  type: story
  keywords:
  - Parvati
  - Divine Appearance
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Goddess Uma appears in a divine form to the gods and assures them of
    her incarnation. She is born to Himavan and Mena, and the gods praise her while
    she is in the womb.
  summary_hi: देवी उमा देवताओं के समक्ष दिव्य रूप में प्रकट होती हैं और उन्हें अपने
    अवतार का आश्वासन देती हैं। वह हिमवान और मेना के घर जन्म लेती हैं, और देवता गर्भ
    में रहते हुए उनकी स्तुति करते हैं।
- id: kama-deva-incineration-by-shiva
  type: event
  keywords:
  - Kama Deva
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Kama Deva is incinerated by Lord Shiva's third eye when he tries to
    disturb Shiva's meditation. Rati laments his death, and the gods request Shiva
    to revive Kama.
  summary_hi: कामदेव को भगवान शिव की तीसरी आंख से भस्म कर दिया जाता है जब वह शिव की
    तपस्या में विघ्न डालने की कोशिश करते हैं। रति उनके निधन पर विलाप करती हैं, और
    देवता शिव से कामदेव को पुनर्जीवित करने की प्रार्थना करते हैं।
- id: parvati-tapasya-effect
  type: story
  keywords:
  - Parvati
  - Tapasya
  - Devas
  source:
    book: Shiv Puran
    sarga: Chapter 22-44
  summary_en: The Devas, distressed by the intense heat affecting the universe, seek
    counsel from Brahma. They learn that the cause is Parvati's severe penance. Brahma,
    along with the Devas, approaches Vishnu for help. Vishnu suggests they all go
    to Shiva and request him to marry Parvati to restore balance.
  summary_hi: देवगण, जो ब्रह्मा से परामर्श लेते हैं, ब्रह्मा से यह जानकर कि पार्वती
    की कठोर तपस्या के कारण यह सब हो रहा है, विष्णु के पास जाते हैं। विष्णु सुझाव देते
    हैं कि वे सभी शिव के पास जाकर उनसे पार्वती से विवाह करने का अनुरोध करें ताकि संतुलन
    बहाल हो सके।
- id: shiva-disguised-brahmin
  type: story
  keywords:
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: To test Parvati's devotion, Lord Shiva disguises himself as a matted-hair
    Brahmin and approaches her. During their conversation, the Brahmin criticizes
    Shiva, but Parvati defends Shiva's greatness and rebukes the Brahmin. Shiva then
    reveals himself to Parvati.
  summary_hi: भगवान शिव पार्वती की भक्ति की परीक्षा लेने के लिए जटाधारी ब्राह्मण का
    वेश धारण कर उनके समीप जाते हैं। बातचीत के दौरान ब्राह्मण शिव की निंदा करता है,
    लेकिन पार्वती शिव की महत्ता प्रतिपादित करती हैं और ब्राह्मण को फटकारती हैं। इसके
    बाद शिव पार्वती के समक्ष प्रकट होते हैं।
- id: shiva-parvati-wedding-preparations
  type: event
  keywords:
  - Shiva
  - Parvati
  - wedding
  source:
    book: Shiv Puran
    sarga: Part 1, Passage 468
  summary_en: The preparations for the wedding of Shiva and Parvati are underway.
    The sage Garga advises King Himavat to bring Shiva to his home for the marriage.
    The gods, sages, and mountains gather with great joy and celebration, anticipating
    the auspicious event. Musical instruments are played, and everyone is filled with
    happiness as they prepare for the grand occasion.
  summary_hi: शिव और पार्वती के विवाह की तैयारियाँ चल रही हैं। गर्ग ऋषि हिमालय के
    राजा को सलाह देते हैं कि वे शिवजी को विवाह के लिए अपने घर लाएँ। देवता, ऋषि और
    पर्वत बड़े हर्ष और उत्साह के साथ एकत्र होते हैं, इस शुभ अवसर की प्रतीक्षा करते
    हुए। वाद्य यंत्र बजाए जाते हैं और सभी लोग इस महान उत्सव की तैयारी में आनंदित होते
    हैं।
- id: shiva-reveals-divine-form
  type: story
  keywords:
  - Shiva
  - Divine Form
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: During the wedding procession, Shiva reveals his divine and beautiful
    form, which pleases Menaka, Parvati's mother. She apologizes, and the women of
    the city consider themselves blessed to witness Shiva's form.
  summary_hi: विवाह की बारात के दौरान, शिव अपना परम सुन्दर दिव्य रूप प्रकट करते हैं,
    जिससे पार्वती की माता मेनका प्रसन्न होती हैं और क्षमा-प्रार्थना करती हैं। नगर
    की स्त्रियाँ शिव के रूप का दर्शन कर अपने जीवन को सफल मानती हैं।
- id: brahma-mohagrasta-parvati-episode
  type: story
  keywords:
  - Brahma
  - Parvati
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: During the Agni Parikrama, Brahma becomes infatuated upon seeing Parvati's
    toenails, leading to the creation of the Balakhilyas. Shiva becomes angry, and
    the gods perform Shiva Stuti to appease him.
  summary_hi: अग्नि परिक्रमा के समय पार्वती के पदनखों को देखकर ब्रह्मा मोहग्रस्त हो
    जाते हैं, जिससे बालखिल्य उत्पन्न होते हैं। शिव कुपित हो जाते हैं और देवता शिव
    स्तुति करते हैं।
- id: shiva-parvati-wedding-episode
  type: event
  keywords:
  - Shiva
  - Parvati
  - wedding
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The passage describes the grand wedding ceremony of Lord Shiva and Parvati.
    After the marriage rituals were completed, Lord Shiva gave gifts to Brahma and
    other sages, including gold coins and jewels to many Brahmins. The entire event
    was celebrated with great joy and music, and the divine couple was taken to their
    celestial abode by the women of the city.
  summary_hi: यह अंश भगवान शिव और पार्वती के भव्य विवाह समारोह का वर्णन करता है। विवाह
    के अनुष्ठान पूरे होने के बाद, भगवान शिव ने ब्रह्मा और अन्य ऋषियों को उपहार दिए,
    जिसमें कई ब्राह्मणों को सोने के सिक्के और रत्न शामिल थे। पूरे आयोजन को बड़ी खुशी
    और संगीत के साथ मनाया गया, और नगर की स्त्रियों द्वारा दिव्य युगल को उनके दिव्य
    निवास स्थान पर ले जाया गया।
- id: shiva-revives-kamadeva-episode
  type: story
  keywords:
  - Shiva
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: At Rati's request, Lord Shiva revives Kamadeva. The gods perform Shiva
    Stuti in gratitude for this act.
  summary_hi: रति के अनुरोध पर भगवान शिव कामदेव को जीवित करते हैं। इस कार्य के लिए
    देवता शिव स्तुति करते हैं।
- id: kartikeya-birth-story
  type: story
  keywords:
  - Kartikeya
  - Skanda
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Kartikeya is born from the radiance of Lord Shiva, leading to great
    celebrations. Sage Vishwamitra performs his rites, and Kartikeya demonstrates
    his prowess by piercing the Krauncha mountain.
  summary_hi: भगवान शिव के तेज से कार्तिकेय का जन्म होता है, जिससे महान उत्सव होता
    है। महर्षि विश्वामित्र उनके संस्कार सम्पन्न करते हैं और कार्तिकेय क्रौंच पर्वत
    का भेदन करते हैं।
- id: ganesha-birth-story
  type: story
  keywords:
  - Ganesha
  - Birth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 13
  summary_en: The story narrates the birth of Ganesha, where Brahma explains to Narada
    that Ganesha's birth is said to precede even Brahma's. At one point, Ganesha's
    head was severed and replaced with an elephant's head. This narrative is part
    of the divine and auspicious tales of Ganesha.
  summary_hi: यह कहानी गणेश के जन्म का वर्णन करती है, जहां ब्रह्मा नारद को बताते हैं
    कि गणेश का जन्म ब्रह्मा से भी पहले कहा गया है। एक समय गणेश का सिर काट दिया गया
    और उसकी जगह हाथी का सिर जोड़ दिया गया। यह कथा गणेश की दिव्य और मंगलमय कहानियों
    का हिस्सा है।
- id: ganesha-chaturthi-episode
  type: practice
  keywords:
  - Ganesha
  - Chaturthi
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Ganesha is granted a boon by Parvati and is recognized as the foremost
    deity by the gods. Shiva appoints him as the leader of all, and the significance
    of the Ganesha Chaturthi fast is established.
  summary_hi: गणेश को पार्वती द्वारा वरदान दिया जाता है और देवताओं द्वारा उन्हें अग्रपूज्य
    माना जाता है। शिव उन्हें सर्वाध्यक्षपद प्रदान करते हैं और गणेश चतुर्थी व्रत का
    महत्व स्थापित होता है।
- id: tripura-destruction-episode
  type: story
  keywords:
  - Tripura
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, troubled by the demons of Tripura, seek Lord Shiva's help
    for their destruction. Shiva, with the assistance of Vishnu and Brahma, constructs
    a divine chariot and destroys the three cities of Tripura with a single arrow,
    saving the universe from the demons' tyranny.
  summary_hi: त्रिपुर के दैत्यों से पीड़ित देवता भगवान शिव से उनकी विनाश के लिए सहायता
    मांगते हैं। शिव, विष्णु और ब्रह्मा की सहायता से, एक दिव्य रथ का निर्माण करते हैं
    और एक ही बाण से त्रिपुर के तीनों नगरों का विनाश कर देते हैं, जिससे ब्रह्मांड को
    दैत्यों के अत्याचार से मुक्ति मिलती है।
- id: jalandhara-birth-and-war-episode
  type: story
  keywords:
  - Jalandhara
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Jalandhara is born from the fire of Shiva's eye and marries Vrinda,
    the daughter of Kalnemi. Angered by the gods' deceit during the churning of the
    ocean, Jalandhara attacks heaven and defeats the gods, taking control of Amaravati.
    The gods, in fear, hide in the caves of Sumeru.
  summary_hi: जलन्धर शिव की नेत्राग्नि से उत्पन्न होता है और कालनेमि की पुत्री वृन्दा
    से विवाह करता है। समुद्र मंथन के समय देवताओं के छल से क्रोधित होकर, जलन्धर स्वर्ग
    पर आक्रमण करता है और देवताओं को पराजित कर अमरावती पर अधिकार कर लेता है। भयभीत
    देवता सुमेरु की गुफाओं में छिप जाते हैं।
- id: jalandhara-and-vishnu-war-episode
  type: story
  keywords:
  - Jalandhara
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, terrified of Jalandhara, approach Vishnu for help. Vishnu
    engages in a fierce battle with Jalandhara, but impressed by his valor, Vishnu
    decides to reside in Jalandhara's city along with the gods and Lakshmi.
  summary_hi: जलन्धर से भयभीत देवता विष्णु के पास सहायता के लिए जाते हैं। विष्णु जलन्धर
    के साथ भयंकर युद्ध करते हैं, लेकिन उसके पराक्रम से प्रभावित होकर, विष्णु देवताओं
    और लक्ष्मी के साथ जलन्धर के नगर में निवास करने का निर्णय लेते हैं।
- id: shiva-and-jalandhara-messenger-episode
  type: story
  keywords:
  - Jalandhara
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Jalandhara sends a messenger to Shiva to demand Parvati. Enraged by
    the messenger's words, a fierce being emerges from Shiva's brow, causing the messenger
    to flee. This being is named Kirtimukha and is stationed at Shiva's door.
  summary_hi: जलन्धर पार्वती की मांग के लिए शिव के पास दूत भेजता है। दूत के वचनों
    से क्रोधित होकर, शिव के भ्रूमध्य से एक भयंकर पुरुष उत्पन्न होता है, जिससे दूत
    भयभीत होकर भाग जाता है। इस पुरुष का नाम कीर्तिमुख रखा जाता है और वह शिव के द्वार
    पर स्थित होता है।
- id: shiva-jalandhara-battle
  type: story
  keywords:
  - Shiva
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: In a fierce battle, Lord Shiva confronts the demon Jalandhara. Despite
    Jalandhara's powerful attacks, Shiva remains unperturbed and ultimately assumes
    a terrifying Rudra form, causing the demons to flee in fear. Shiva curses the
    demons Shumbha and Nishumbha, stating that they will be slain by Goddess Parvati
    in the future.
  summary_hi: एक भयंकर युद्ध में भगवान शिव राक्षस जलंधर का सामना करते हैं। जलंधर के
    शक्तिशाली हमलों के बावजूद, शिव अप्रभावित रहते हैं और अंततः एक भयानक रौद्र रूप
    धारण करते हैं, जिससे राक्षस डरकर भाग जाते हैं। शिव शुंभ और निशुंभ राक्षसों को
    शाप देते हैं कि भविष्य में देवी पार्वती उन्हें मारेंगी।
- id: vishnu-curse-by-vrinda
  type: story
  keywords:
  - Vishnu
  - Vrinda
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Vishnu, in the guise of Jalandhara, deceives Vrinda, leading to
    her curse upon him. This episode explains the origin of certain sacred plants
    and the transformation of Vishnu into a stone.
  summary_hi: भगवान विष्णु, जलंधर के रूप में, वृंदा को धोखा देते हैं, जिससे वह उन्हें
    शाप देती हैं। यह प्रकरण कुछ पवित्र पौधों की उत्पत्ति और विष्णु के पत्थर में परिवर्तन
    की व्याख्या करता है।
- id: shankhachuda-origin-and-battle
  type: story
  keywords:
  - Shankhachuda
  - Tulsi
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The origin of Shankhachuda and his marriage to Tulsi is narrated, followed
    by his battles with the gods. Eventually, Lord Shiva defeats Shankhachuda, leading
    to the origin of sacred symbols like the Shankha and Tulsi.
  summary_hi: शंखचूड़ की उत्पत्ति और तुलसी से उसका विवाह वर्णित है, इसके बाद देवताओं
    के साथ उसके युद्ध होते हैं। अंततः भगवान शिव शंखचूड़ को पराजित करते हैं, जिससे
    शंख और तुलसी जैसे पवित्र प्रतीकों की उत्पत्ति होती है।
- id: andhakasura-battle-with-shiva
  type: story
  keywords:
  - Andhakasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The story of Andhakasura's battle with Lord Shiva is detailed, where
    Andhakasura's blood gives rise to more demons. With Vishnu's help, Shiva ultimately
    defeats Andhakasura, restoring balance.
  summary_hi: अंधकासुर के भगवान शिव के साथ युद्ध की कहानी का वर्णन है, जहां अंधकासुर
    के रक्त से और अधिक दानव उत्पन्न होते हैं। विष्णु की मदद से, शिव अंततः अंधकासुर
    को पराजित करते हैं, जिससे संतुलन बहाल होता है।
- id: andhaka-gains-ganapatya
  type: story
  keywords:
  - Andhaka
  - Ganapatya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Andhaka, after pleasing Shiva with his devotion, is granted the position
    of Ganapatya by Shiva. This episode highlights the power of devotion and Shiva's
    benevolence.
  summary_hi: अन्धक ने अपनी भक्ति से शिव को प्रसन्न किया और शिव ने उसे गाणपत्य पद
    प्रदान किया। यह कथा भक्ति की शक्ति और शिव की कृपा को दर्शाती है।
- id: shukracharya-revives-demons
  type: story
  keywords:
  - Shukracharya
  - Sanjeevani Vidya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shukracharya, recalling the Sanjeevani Vidya he obtained from Shiva,
    decides to use it to revive the demons slain in battle. Despite his initial hesitation
    due to the sacredness of the knowledge, he chooses to honor the duty of protecting
    those who seek refuge.
  summary_hi: शुक्राचार्य, शिव से प्राप्त संजीवनी विद्या को याद करते हुए, युद्ध में
    मारे गए दैत्यों को पुनर्जीवित करने का निर्णय लेते हैं। ज्ञान की पवित्रता के कारण
    उनकी प्रारंभिक हिचकिचाहट के बावजूद, वह शरण में आए लोगों की रक्षा करने के कर्तव्य
    का सम्मान करने का निर्णय लेते हैं।
- id: shiva-swallows-shukracharya
  type: event
  keywords:
  - Shiva
  - Shukracharya
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 47
  summary_en: Lord Shiva swallows Shukracharya, causing distress among the demons.
    The demons, feeling hopeless without their guru, are compared to various entities
    deprived of their essential parts.
  summary_hi: भगवान शिव शुक्राचार्य को निगल लेते हैं, जिससे दैत्यों में दुख फैल जाता
    है। अपने गुरु के बिना दैत्य निराश हो जाते हैं और उनकी तुलना उन वस्तुओं से की जाती
    है जो अपने आवश्यक अंगों से वंचित हैं।
- id: banasura-pleases-shiva
  type: story
  keywords:
  - Banasura
  - Tandava
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Banasura, a devotee of Shiva, pleases him with a Tandava dance. As a
    boon, Shiva agrees to reside in Banasura's city, showcasing the power of devotion
    and dance.
  summary_hi: शिवभक्त बाणासुर ने ताण्डव नृत्य से शिव को प्रसन्न किया। वरदान के रूप
    में, शिव ने बाणासुर की नगरी में निवास करने का वचन दिया, जो भक्ति और नृत्य की शक्ति
    को दर्शाता है।
- id: aniruddha-abduction
  type: story
  keywords:
  - Aniruddha
  - Usha
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Usha dreams of meeting Aniruddha, and with the help of Chitralekha's
    yogic powers, Aniruddha is abducted from Dwarka. This leads to a series of events
    culminating in a battle involving Krishna and Banasura.
  summary_hi: ऊषा ने अनिरुद्ध से मिलने का सपना देखा, और चित्रलेखा के योगबल से अनिरुद्ध
    का द्वारका से अपहरण कर लिया गया। यह घटनाक्रम कृष्ण और बाणासुर के बीच युद्ध में
    परिणत हुआ।
- id: krishna-banasura-battle
  type: story
  keywords:
  - Krishna
  - Banasura
  - battle
  source:
    book: Shiv Puran
    sarga: '55'
  summary_en: In this episode, Banasura, the son of Bali, engages in a fierce battle
    with Lord Krishna. Banasura, equipped with various weapons, fights valiantly but
    is ultimately overpowered by Krishna's might. Despite Banasura's attempts to counter
    Krishna's arrows, Krishna's strength and the divine support from Shiva help him
    prevail in the battle.
  summary_hi: इस प्रकरण में, बलि के पुत्र बाणासुर भगवान कृष्ण के साथ एक भयंकर युद्ध
    में संलग्न होते हैं। बाणासुर, विभिन्न हथियारों से सुसज्जित होकर, बहादुरी से लड़ता
    है लेकिन अंततः कृष्ण की शक्ति से पराजित हो जाता है। बाणासुर के तीरों का मुकाबला
    करने के प्रयासों के बावजूद, कृष्ण की शक्ति और शिव के दिव्य समर्थन से वह युद्ध
    में विजयी होते हैं।
- id: gajasura-slain-by-shiva
  type: story
  keywords:
  - Gajasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Gajasura, the son of Mahishasura, performs penance and receives a boon
    from Brahma. However, his tyranny leads the gods to request Shiva for his destruction.
    Shiva slays Gajasura and wears his skin, becoming known as Krittivasa.
  summary_hi: महिषासुर के पुत्र गजासुर ने तपस्या की और ब्रह्मा से वर प्राप्त किया।
    लेकिन उसके अत्याचारों के कारण देवताओं ने शिव से उसके वध की प्रार्थना की। शिव ने
    गजासुर का वध किया और उसकी चर्म धारण कर 'कृत्तिवासा' के नाम से विख्यात हुए।
- id: devaraj-redemption-story
  type: story
  keywords:
  - devaraj
  - redemption
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 2
  summary_en: Devaraj, a Brahmin who fell into sinful ways, including murder and theft,
    was redeemed by listening to the Shiv Puran. Despite his misdeeds, Shiva's attendants
    rescued him from Yama's clutches and took him to Kailash, granting him liberation.
  summary_hi: देवराज, एक ब्राह्मण जिसने पापमय जीवन जिया, जिसमें हत्या और चोरी शामिल
    थी, शिव पुराण सुनने से मुक्त हो गया। उसके पापों के बावजूद, शिव के गणों ने उसे
    यम के चंगुल से छुड़ाया और कैलाश ले गए, जिससे उसे मुक्ति मिली।
- id: chanchula-vairagya-story
  type: story
  keywords:
  - chanchula
  - vairagya
  source:
    book: Shiv Puran
    sarga: अथ तृतीयोऽध्यायः
  summary_en: In the village of Baskala, a Brahmin named Binduga lived a life of vice,
    despite having a virtuous wife named Chanchula. Binduga was infatuated with a
    courtesan, neglecting his wife. Chanchula, initially devoted to her husband, eventually
    succumbed to the same path of immorality due to her circumstances, leading to
    a life of distress and spiritual awakening.
  summary_hi: बाष्कल नामक ग्राम में बिन्दुग नामक एक ब्राह्मण रहता था, जो अपनी धर्मपरायण
    पत्नी चंचुला के होते हुए भी कुमार्ग पर चलता था। बिन्दुग वेश्या के प्रति आसक्त
    था और अपनी पत्नी की उपेक्षा करता था। चंचुला, जो पहले अपने पति के प्रति समर्पित
    थी, अंततः परिस्थितियों के कारण उसी अनैतिक मार्ग पर चल पड़ी, जिससे उसे क्लेश और
    आध्यात्मिक जागृति का अनुभव हुआ।
- id: bindug-and-chanchula-downfall
  type: story
  keywords:
  - bindug
  - chanchula
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Bindug, a Brahmin, and his wife Chanchula fall into a life of immorality.
    Despite Chanchula's initial resistance, she eventually succumbs to infidelity
    influenced by her husband's actions. Bindug encourages her to engage with other
    men for financial gain. Their lives become consumed by vice, leading to Bindug's
    death and subsequent suffering in hell, while Chanchula continues her life with
    diminishing youth.
  summary_hi: बिन्दुग, एक ब्राह्मण, और उसकी पत्नी चंचुला अनैतिक जीवन में गिर जाते
    हैं। चंचुला की प्रारंभिक प्रतिरोध के बावजूद, वह अपने पति के कार्यों से प्रभावित
    होकर व्यभिचार में लिप्त हो जाती है। बिन्दुग उसे अन्य पुरुषों के साथ संबंध बनाने
    के लिए प्रोत्साहित करता है ताकि धन प्राप्त हो सके। उनका जीवन कुकर्म में डूब जाता
    है, जिससे बिन्दुग की मृत्यु होती है और वह नरक में कष्ट भोगता है, जबकि चंचुला अपने
    घटते यौवन के साथ जीवन व्यतीत करती है।
- id: chanchula-hears-shiva-story
  type: story
  keywords:
  - Chanchula
  - Shiva
  - repentance
  source:
    book: Shiv Puran
    sarga: '3'
  summary_en: Chanchula, while wandering with her relatives, hears a sacred story
    about Lord Shiva from a learned Brahmin in a temple. The story, which describes
    the severe punishments for women who commit adultery, instills fear and a sense
    of detachment in her. She approaches the Brahmin, expressing her remorse for her
    past sins and seeking guidance for redemption.
  summary_hi: चंचुला अपने बंधुजनों के साथ घूमते हुए एक मंदिर में भगवान शिव की पवित्र
    कथा एक विद्वान ब्राह्मण से सुनती है। यह कथा, जो परपुरुषों के साथ व्यभिचार करने
    वाली स्त्रियों के लिए कठोर दंड का वर्णन करती है, उसमें भय और वैराग्य उत्पन्न करती
    है। वह ब्राह्मण के पास जाकर अपने पापों के लिए पश्चाताप व्यक्त करती है और उद्धार
    के लिए मार्गदर्शन मांगती है।
- id: chanchula-renunciation-story
  type: story
  keywords:
  - Chanchula
  - renunciation
  - Shiva Purana
  source:
    book: Shiv Puran
    sarga: अध्याय ३
  summary_en: Chanchula, filled with remorse and detachment, falls at the feet of
    a wise Brahmin, seeking redemption for her sins. The Brahmin, moved by her plea,
    assures her that listening to the stories of Shiva Purana will purify her soul
    and lead her to a higher spiritual state. He explains that true repentance is
    the greatest atonement for sins.
  summary_hi: चंचुला, खेद और वैराग्य से भरी हुई, एक बुद्धिमान ब्राह्मण के चरणों में
    गिरकर अपने पापों के लिए मुक्ति की याचना करती है। ब्राह्मण, उसकी प्रार्थना से प्रभावित
    होकर, उसे आश्वासन देते हैं कि शिव पुराण की कथाएँ सुनने से उसकी आत्मा शुद्ध होगी
    और उसे उच्च आध्यात्मिक स्थिति प्राप्त होगी। वह समझाते हैं कि सच्चा पश्चात्ताप
    पापों के लिए सबसे बड़ा प्रायश्चित्त है।
- id: chanchula-attains-parvati-companionship
  type: story
  keywords:
  - Chanchula
  - Parvati
  - spiritual liberation
  source:
    book: Shiv Puran
    sarga: अध्याय ४
  summary_en: After listening to the complete Shiva Purana as narrated by the Brahmin,
    Chanchula attains spiritual liberation and becomes a companion of Goddess Parvati
    in Shiva's abode. This transformation signifies the power of divine stories in
    leading one to salvation.
  summary_hi: ब्राह्मण द्वारा सुनाई गई सम्पूर्ण शिव पुराण सुनने के बाद, चंचुला को
    आध्यात्मिक मुक्ति प्राप्त होती है और वह शिव के धाम में देवी पार्वती की सखी बन
    जाती है। यह परिवर्तन दिव्य कथाओं की मुक्ति की ओर ले जाने वाली शक्ति को दर्शाता
    है।
- id: chanchula-devotion-and-liberation
  type: story
  keywords:
  - Chanchula
  - Shiva
  - liberation
  source:
    book: Shiv Puran
    sarga: '4'
  summary_en: Chanchula, a devoted follower of Shiva, practices intense devotion and
    meditation under the guidance of her guru. She regularly bathes in holy waters,
    wears sacred ash and Rudraksha beads, and chants Shiva's name. Her dedication
    leads to her liberation, and she is taken to Shiva's abode in a divine chariot
    sent by Shiva himself, where she is transformed into a divine being.
  summary_hi: चंचुला, जो शिव की भक्त है, अपने गुरु के मार्गदर्शन में गहन भक्ति और
    ध्यान करती है। वह नियमित रूप से पवित्र जल में स्नान करती है, पवित्र भस्म और रुद्राक्ष
    की माला धारण करती है, और शिव का नाम जपती है। उसकी भक्ति उसे मुक्ति दिलाती है,
    और शिव द्वारा भेजे गए दिव्य विमान में उसे शिव के धाम ले जाया जाता है, जहाँ वह
    एक दिव्य रूप में परिवर्तित हो जाती है।
- id: chanchula-divine-vision
  type: story
  keywords:
  - Chanchula
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Chapter 4
  summary_en: Chanchula, a Brahmin's wife, experiences a divine vision of Lord Shiva
    and Goddess Parvati. Overwhelmed with joy and devotion, she is blessed by the
    deities, and Parvati makes her a divine companion. Chanchula then resides in eternal
    bliss in the divine realm.
  summary_hi: चंचुला, जो एक ब्राह्मण की पत्नी है, भगवान शिव और देवी पार्वती के दिव्य
    दर्शन करती है। अत्यधिक आनंद और भक्ति से अभिभूत होकर, उसे देवताओं द्वारा आशीर्वाद
    प्राप्त होता है और पार्वती उसे अपनी दिव्य सखी बना लेती हैं। चंचुला फिर दिव्य लोक
    में अनंत आनंद में निवास करती है।
- id: chanchula-praises-parvati
  type: story
  keywords:
  - Chanchula
  - Parvati
  - Praise
  source:
    book: Shiv Puran
    sarga: Chapter 5
  summary_en: After attaining divine status, Chanchula approaches Goddess Parvati
    and praises her with great devotion. She acknowledges Parvati as the source of
    all happiness and the supreme power behind creation, maintenance, and destruction.
    Parvati, pleased with Chanchula's devotion, offers her a boon.
  summary_hi: दिव्य स्थिति प्राप्त करने के बाद, चंचुला देवी पार्वती के पास जाती है
    और उनकी महान भक्ति के साथ स्तुति करती है। वह पार्वती को सभी सुखों का स्रोत और
    सृष्टि, पालन और संहार की सर्वोच्च शक्ति के रूप में मान्यता देती है। पार्वती, चंचुला
    की भक्ति से प्रसन्न होकर, उसे एक वरदान देने का प्रस्ताव करती हैं।
- id: chanchula-seeks-husband-redemption
  type: story
  keywords:
  - redemption
  - Chanchula
  - Parvati
  source:
    book: Shiv Puran
    sarga: Chapter 5
  summary_en: Chanchula, a devoted wife, approaches Goddess Parvati to seek redemption
    for her deceased husband, Binduga, who was a sinner and is now suffering as a
    spirit. Parvati advises that if Binduga listens to the sacred stories of Shiva,
    he can attain salvation and be freed from his suffering.
  summary_hi: चंचुला, एक समर्पित पत्नी, देवी पार्वती के पास अपने मृत पति बिन्दुग के
    उद्धार के लिए जाती है, जो एक पापी था और अब एक पिशाच के रूप में कष्ट भोग रहा है।
    पार्वती सलाह देती हैं कि यदि बिन्दुग शिव की पवित्र कथाएँ सुनता है, तो वह मुक्ति
    प्राप्त कर सकता है और अपने कष्टों से मुक्त हो सकता है।
- id: chanchula-prayer-to-parvati
  type: story
  keywords:
  - Chanchula
  - Parvati
  source:
    book: Shiv Puran
    sarga: 23-24
  summary_en: Chanchula, with folded hands and bowed head, prays to Goddess Parvati
    for the purification and salvation of her husband by arranging for him to hear
    the Shiv Puran. Parvati, moved by Chanchula's devotion, decides to help.
  summary_hi: चंचुला ने हाथ जोड़कर और सिर झुकाकर पार्वती देवी से प्रार्थना की कि उनके
    पति के समस्त पापों की शुद्धि और उत्तम गति के लिए शिवपुराण सुनाने की व्यवस्था होनी
    चाहिए। पार्वती, चंचुला की भक्ति से प्रभावित होकर मदद करने का निर्णय लेती हैं।
- id: tumburu-mission-to-vindhya
  type: story
  keywords:
  - Tumburu
  - Vindhya
  source:
    book: Shiv Puran
    sarga: 25-28
  summary_en: Goddess Parvati instructs Tumburu, the king of Gandharvas, to accompany
    Chanchula to the Vindhya mountains where a fearsome demon resides. Tumburu is
    tasked with narrating the Shiv Puran to purify the demon's soul.
  summary_hi: पार्वती देवी गन्धर्वराज तुम्बुरु को चंचुला के साथ विन्ध्य पर्वत पर जाने
    का आदेश देती हैं, जहाँ एक भयंकर पिशाच रहता है। तुम्बुरु को उस पिशाच की आत्मा को
    शुद्ध करने के लिए शिवपुराण सुनाने का कार्य सौंपा जाता है।
- id: binduga-brahmin-to-demon
  type: story
  keywords:
  - Binduga
  - Demon
  source:
    book: Shiv Puran
    sarga: 29-35
  summary_en: Binduga, a Brahmin in his previous life, became a demon due to his sinful
    actions. He abandoned his duties, indulged in immoral activities, and ultimately
    became a demon on the Vindhya mountains, suffering the consequences of his past
    deeds.
  summary_hi: बिन्दुग, जो अपने पूर्वजन्म में एक ब्राह्मण था, अपने पापपूर्ण कर्मों
    के कारण पिशाच बन गया। उसने अपने कर्तव्यों को त्याग दिया, अनैतिक गतिविधियों में
    लिप्त हो गया और अंततः विन्ध्य पर्वत पर पिशाच बन गया, अपने पिछले कर्मों का फल भोग
    रहा है।
- id: redemption-through-shiv-puran
  type: concept
  keywords:
  - Redemption
  - Shiv Puran
  source:
    book: Shiv Puran
    sarga: 36-38
  summary_en: The narration of the Shiv Puran is described as a divine and purifying
    act that can cleanse all sins and liberate souls from demonic forms. It is suggested
    that listening to the Shiv Puran will purify the demon Binduga and allow him to
    ascend to Shiva's presence.
  summary_hi: शिवपुराण का श्रवण एक दिव्य और शुद्धिकरण करने वाला कार्य बताया गया है,
    जो सभी पापों को मिटा सकता है और आत्माओं को पिशाच रूप से मुक्त कर सकता है। यह सुझाव
    दिया गया है कि शिवपुराण सुनने से पिशाच बिन्दुग शुद्ध हो जाएगा और उसे शिव के समीप
    जाने की अनुमति मिलेगी।
- id: pisacha-redemption-by-tumburu
  type: story
  keywords:
  - pisacha
  - redemption
  - tumburu
  - shiv-puran
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Tumburu, a devotee of Lord Shiva, encounters a terrifying pisacha (demon)
    and binds it with a noose. He then narrates the Shiv Puran to the pisacha, which
    leads to its redemption. The pisacha sheds its demonic form and attains a divine
    appearance, becoming a devotee of Lord Shiva.
  summary_hi: तुम्बुरु, जो भगवान शिव के भक्त हैं, एक भयंकर पिशाच से मिलते हैं और उसे
    पाश से बांध देते हैं। फिर वह पिशाच को शिव पुराण की कथा सुनाते हैं, जिससे पिशाच
    का उद्धार होता है। पिशाच अपनी पैशाचिक देह को त्यागकर दिव्य रूप धारण कर लेता है
    और भगवान शिव का भक्त बन जाता है।
- id: shiva-attainment-concept
  type: concept
  keywords:
  - shiva
  - attainment
  - practice
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 3
  summary_en: The ultimate goal (sadhya) is the attainment of Shiva's state, and the
    means (sadhana) to achieve this is through service and devotion to Shiva. A true
    practitioner is one who is indifferent to worldly gains and dedicates the fruits
    of Vedic rituals to Shiva, leading to liberation.
  summary_hi: शिवपद की प्राप्ति ही परम साध्य है और शिव की सेवा ही उसका साधन है। सच्चा
    साधक वही है जो सांसारिक फलों से निरपेक्ष होकर वेदोक्त कर्मों के फल शिव को अर्पित
    करता है, जिससे मुक्ति प्राप्त होती है।
- id: shiva-devotion-practice
  type: practice
  keywords:
  - devotion
  - shiva
  - liberation
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 3
  summary_en: Devotion to Shiva leads to liberation from worldly bonds. This devotion
    is achieved through listening to Shiva's stories, singing his praises, and meditating
    on him. These practices are considered the highest form of sadhana.
  summary_hi: शिव की भक्ति से मनुष्य संसार बंधनों से मुक्त हो जाता है। यह भक्ति शिव
    की कथाओं का श्रवण, उनके गुणों का कीर्तन और उन पर मनन करने से प्राप्त होती है।
    ये साधन महान साधन माने जाते हैं।
- id: shiva-yoga-concept
  type: concept
  keywords:
  - shiva
  - yoga
  - liberation
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 3
  summary_en: Through the practice of listening, singing, and meditating on Shiva,
    one gradually attains union with Shiva, known as Shiva Yoga. This process leads
    to liberation in stages, starting with the removal of physical ailments and culminating
    in spiritual bliss.
  summary_hi: श्रवण, कीर्तन और मनन के अभ्यास से धीरे-धीरे शिवयोग की प्राप्ति होती
    है। यह प्रक्रिया शारीरिक रोगों के नाश से शुरू होकर आध्यात्मिक आनंद में समाप्त
    होती है, जिससे क्रमशः मुक्ति प्राप्त होती है।
- id: vyasa-tapasya-and-sanatkumara-encounter
  type: story
  keywords:
  - Vyasa
  - Sanatkumara
  source:
    book: Shiv Puran
    sarga: Vidyashwar Samhita
  summary_en: Vyasa, the son of Parashara, was performing penance on the banks of
    the Saraswati river. One day, Sanatkumara, traveling in a radiant chariot, appeared
    before Vyasa. Vyasa, upon seeing Sanatkumara, offered him respect and hospitality.
    Sanatkumara advised Vyasa to focus on meditating upon Lord Shiva for divine assistance.
  summary_hi: पराशर मुनि के पुत्र व्यास सरस्वती नदी के तट पर तपस्या कर रहे थे। एक
    दिन, सूर्य के समान तेजस्वी विमान में यात्रा करते हुए सनत्कुमार वहाँ प्रकट हुए।
    व्यास ने सनत्कुमार को देखकर उन्हें सम्मान और आतिथ्य प्रदान किया। सनत्कुमार ने
    व्यास को भगवान शिव का ध्यान करने की सलाह दी।
- id: nandi-advises-vyasa
  type: story
  keywords:
  - Nandikeshvara
  - Vyasa
  - liberation
  source:
    book: Shiv Puran
    sarga: Vidyeshvara Samhita, Chapter 4
  summary_en: Nandikeshvara, a devotee of Lord Shiva, advises Vyasa on the path to
    liberation. He emphasizes the importance of listening, chanting, and meditating
    on Lord Shiva as means to achieve liberation.
  summary_hi: नन्दिकेश्वर, जो भगवान शिव के भक्त हैं, व्यास को मुक्ति के मार्ग पर सलाह
    देते हैं। वे भगवान शिव के श्रवण, कीर्तन और मनन के महत्व को मुक्ति प्राप्त करने
    के साधन के रूप में बताते हैं।
- id: worship-of-shiva-linga
  type: practice
  keywords:
  - Shiva Linga
  - worship
  - liberation
  source:
    book: Shiv Puran
    sarga: Vidyeshvara Samhita, Chapter 5
  summary_en: The passage describes the practice of worshipping the Shiva Linga and
    the significance of such worship. It explains that even if one is unable to perform
    the traditional practices of listening, chanting, and meditating, worshipping
    the Shiva Linga with devotion can lead to liberation.
  summary_hi: यह अंश शिवलिंग की पूजा की प्रथा और उसके महत्व का वर्णन करता है। यह बताता
    है कि यदि कोई व्यक्ति पारंपरिक श्रवण, कीर्तन और मनन के साधनों को करने में असमर्थ
    है, तो भी शिवलिंग की भक्ति से पूजा करने से मुक्ति प्राप्त हो सकती है।
- id: shiva-nirakar-sakar-concept
  type: concept
  keywords:
  - Shiva
  - Nirakar
  - Sakar
  source:
    book: Shiv Puran
    sarga: '5'
  summary_en: The passage discusses the dual nature of Lord Shiva as both 'Nirakar'
    (formless) and 'Sakar' (with form). Shiva is worshipped in both forms, represented
    by the Shiva Linga (formless) and the idol (with form). This duality signifies
    Shiva's transcendence and immanence.
  summary_hi: यह अंश भगवान शिव के 'निराकार' (निर्गुण) और 'साकार' (सगुण) दोनों रूपों
    की चर्चा करता है। शिव की पूजा दोनों रूपों में की जाती है, जो शिवलिंग (निर्गुण)
    और मूर्ति (सगुण) द्वारा दर्शाई जाती है। यह द्वैत शिव की पारलौकिकता और इमानेन्स
    को दर्शाता है।
- id: brahma-vishnu-conflict-story
  type: story
  keywords:
  - Brahma
  - Vishnu
  - Conflict
  source:
    book: Shiv Puran
    sarga: '5'
  summary_en: In a past era, a conflict arose between Brahma and Vishnu, each claiming
    supremacy. To resolve their dispute, Lord Shiva manifested as a colossal, formless
    pillar of light, demonstrating his transcendence and superiority over both deities.
  summary_hi: एक पूर्व युग में, ब्रह्मा और विष्णु के बीच श्रेष्ठता को लेकर विवाद उत्पन्न
    हुआ। उनके विवाद को सुलझाने के लिए, भगवान शिव ने एक विशाल, निराकार प्रकाश स्तंभ
    के रूप में प्रकट होकर अपनी पारलौकिकता और दोनों देवताओं पर अपनी श्रेष्ठता को प्रदर्शित
    किया।
- id: shiva-linga-origin-story
  type: story
  keywords:
  - Shiva
  - Linga
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Vidyeshvara Samhita, Chapter 5
  summary_en: In a past era, Brahma and Vishnu engaged in a fierce battle due to their
    pride. To quell their arrogance, Lord Shiva manifested as a colossal, formless
    pillar of light between them. This event marked the origin of the worship of Shiva's
    Linga, symbolizing both his formless and manifest aspects.
  summary_hi: प्राचीन काल में, ब्रह्मा और विष्णु अपने अहंकार के कारण एक भयंकर युद्ध
    में उलझ गए। उनके अहंकार को शांत करने के लिए, भगवान शिव ने उनके बीच एक विशाल, निराकार
    प्रकाश स्तंभ के रूप में प्रकट होकर हस्तक्षेप किया। इस घटना ने शिव के लिंग की पूजा
    की शुरुआत की, जो उनके निराकार और साकार दोनों रूपों का प्रतीक है।
- id: brahma-vishnu-conflict
  type: story
  keywords:
  - Brahma
  - Vishnu
  - conflict
  source:
    book: Shiv Puran
    sarga: '6'
  summary_en: Brahma and Vishnu, in a state of delusion, argue over who is superior
    and prepare to battle each other. Mounted on their respective vehicles, Hansa
    and Garuda, they engage in a fierce battle, with their followers also joining
    the fight. The gods, witnessing this extraordinary battle, become anxious and
    seek the intervention of Lord Shiva.
  summary_hi: ब्रह्मा और विष्णु मोहवश यह सोचकर कि वे श्रेष्ठ हैं, आपस में युद्ध करने
    के लिए तैयार हो जाते हैं। हंस और गरुड़ पर आरूढ़ होकर वे युद्ध करने लगते हैं, और
    उनके अनुयायी भी इस युद्ध में शामिल हो जाते हैं। देवगण इस अद्भुत युद्ध को देखकर
    चिंतित हो जाते हैं और भगवान शिव की शरण में जाते हैं।
- id: shiva-intervention
  type: story
  keywords:
  - Shiva
  - intervention
  - Kailash
  source:
    book: Shiv Puran
    sarga: '6'
  summary_en: The gods, troubled by the battle between Brahma and Vishnu, decide to
    seek the help of Lord Shiva. They travel to Mount Kailash, where Shiva resides,
    and offer their respects. Shiva, seated with Parvati, listens to their concerns
    and prepares to intervene in the conflict.
  summary_hi: ब्रह्मा और विष्णु के बीच के युद्ध से परेशान देवगण भगवान शिव की सहायता
    लेने का निर्णय लेते हैं। वे कैलाश पर्वत पर जाते हैं, जहाँ शिव निवास करते हैं,
    और उन्हें प्रणाम करते हैं। शिव, पार्वती के साथ बैठे हुए, उनकी चिंताओं को सुनते
    हैं और इस संघर्ष में हस्तक्षेप करने की तैयारी करते हैं।
- id: shiva-vision-episode
  type: event
  keywords:
  - Shiva
  - vision
  source:
    book: Shiv Puran
    sarga: '6'
  summary_en: The gods, with eyes filled with tears of joy, saw Lord Shiva, who was
    surrounded by his attendants and being served by devoted maidens. The Vedas were
    singing his praises, and Shiva was looking at everyone with a benevolent gaze.
    The gods paid their respects from a distance.
  summary_hi: देवताओं ने आनंदाश्रु से भरी आँखों से भगवान शिव को देखा, जो अपने गणों
    से घिरे हुए थे और भक्तिपूर्ण रमणियाँ उनकी सेवा कर रही थीं। वेद उनकी स्तुति कर
    रहे थे और शिव सबको अनुग्रह की दृष्टि से देख रहे थे। देवताओं ने दूर से ही उन्हें
    प्रणाम किया।
- id: shiva-brahma-vishnu-conflict
  type: event
  keywords:
  - Shiva
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: '7'
  summary_en: Lord Shiva appeared as a pillar of fire during a conflict between Brahma
    and Vishnu. Both gods attempted to find the beginning and end of the pillar, with
    Vishnu taking the form of a boar and Brahma taking the form of a swan, but neither
    could find its limits.
  summary_hi: भगवान शिव ब्रह्मा और विष्णु के बीच संघर्ष के दौरान अग्निस्तम्भ के रूप
    में प्रकट हुए। दोनों देवताओं ने स्तम्भ के आदि और अंत को खोजने का प्रयास किया,
    विष्णु ने वराह का रूप धारण किया और ब्रह्मा ने हंस का, लेकिन कोई भी उसकी सीमाओं
    को नहीं खोज सका।
- id: shiva-appears-as-fire-column
  type: story
  keywords:
  - Shiva
  - Fire Column
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Part I, Section 4
  summary_en: During a fierce battle between Brahma and Vishnu, both wielding powerful
    weapons, Shiva intervenes to prevent destruction by manifesting as a massive fire
    column. This divine column pacifies the weapons, and both deities are left in
    awe, questioning its origin.
  summary_hi: ब्रह्मा और विष्णु के बीच भयंकर युद्ध के दौरान, दोनों शक्तिशाली अस्त्रों
    का प्रयोग कर रहे थे। शिवजी ने विनाश को रोकने के लिए एक विशाल अग्निस्तम्भ के रूप
    में प्रकट होकर हस्तक्षेप किया। इस दिव्य स्तम्भ ने अस्त्रों को शांत कर दिया और
    दोनों देवता इसकी उत्पत्ति के बारे में जानने के लिए उत्सुक हो गए।
- id: brahma-and-vishnu-search-fire-column
  type: story
  keywords:
  - Brahma
  - Vishnu
  - Fire Column
  source:
    book: Shiv Puran
    sarga: Part I, Section 4
  summary_en: Brahma and Vishnu decide to explore the fire column to find its beginning
    and end. Vishnu takes the form of a boar to search its base, while Brahma becomes
    a swan to find its top. Despite their efforts, neither can find the limits of
    the column.
  summary_hi: ब्रह्मा और विष्णु अग्निस्तम्भ की शुरुआत और अंत खोजने का निर्णय लेते
    हैं। विष्णु सूकर का रूप धारण कर उसकी जड़ की खोज में जाते हैं, जबकि ब्रह्मा हंस
    का रूप लेकर उसके शीर्ष की खोज में जाते हैं। उनके प्रयासों के बावजूद, कोई भी स्तम्भ
    की सीमाएं नहीं खोज पाता।
- id: brahma-lies-about-seeing-column-end
  type: story
  keywords:
  - Brahma
  - Ketaki Flower
  - Deception
  source:
    book: Shiv Puran
    sarga: Part I, Section 4
  summary_en: Unable to find the end of the fire column, Brahma encounters a Ketaki
    flower and persuades it to falsely testify that he has seen the column's top.
    Brahma then deceives Vishnu by claiming he found the end, with the flower as his
    witness.
  summary_hi: अग्निस्तम्भ का अंत न खोज पाने पर, ब्रह्मा को केतकी पुष्प मिलता है और
    वह उसे झूठी गवाही देने के लिए मना लेता है कि उसने स्तम्भ का शीर्ष देखा है। ब्रह्मा
    फिर विष्णु को धोखा देते हुए कहता है कि उसने अंत खोज लिया है, पुष्प को साक्षी बनाकर।
- id: vishnu-pleads-to-shiva
  type: story
  keywords:
  - Vishnu
  - Shiva
  - forgiveness
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 7
  summary_en: Vishnu, upon seeing Shiva manifest from the fiery pillar, approaches
    him with trembling hands and pleads for forgiveness for his earlier misconceptions.
    Shiva, pleased with Vishnu's truthfulness, grants him equal status among the gods
    and decrees that Vishnu's separate idol will be worshipped in holy places.
  summary_hi: विष्णु, जब शिव को प्रज्वलित स्तम्भ से प्रकट होते देखते हैं, तो काँपते
    हाथों से उनके चरण पकड़कर अपने पूर्व के भ्रम के लिए क्षमा मांगते हैं। शिव, विष्णु
    की सत्यनिष्ठा से प्रसन्न होकर, उन्हें देवताओं में समानता प्रदान करते हैं और यह
    आदेश देते हैं कि विष्णु की पृथक मूर्ति पुण्य क्षेत्रों में प्रतिष्ठित की जाएगी।
- id: bhairava-creation-and-brahma-punishment
  type: story
  keywords:
  - Bhairava
  - Brahma
  - punishment
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 8
  summary_en: Shiva creates Bhairava from his brow to curb Brahma's arrogance. Bhairava
    is instructed to punish Brahma by cutting off his fifth head. However, Vishnu
    intervenes, pleading with Shiva to forgive Brahma. Shiva, appeased by Vishnu's
    request, stops Bhairava and declares that Brahma will not be worshipped in temples
    due to his deceit.
  summary_hi: शिव अपनी भौंह से भैरव को ब्रह्मा के अहंकार को मिटाने के लिए उत्पन्न
    करते हैं। भैरव को ब्रह्मा का पाँचवाँ सिर काटने का आदेश दिया जाता है। लेकिन विष्णु
    हस्तक्षेप करते हैं और शिव से ब्रह्मा को क्षमा करने की प्रार्थना करते हैं। विष्णु
    की प्रार्थना से प्रसन्न होकर शिव भैरव को रोक देते हैं और घोषणा करते हैं कि ब्रह्मा
    का मंदिरों में पूजन नहीं होगा क्योंकि उन्होंने छल किया है।
- id: brahma-seeks-shiva-blessing
  type: story
  keywords:
  - Brahma
  - Shiva
  - blessing
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 8
  summary_en: Brahma prays to Lord Shiva, expressing his willingness to sacrifice
    his own head as a mark of devotion. Shiva, pleased with Brahma's devotion, instructs
    him to maintain order in the world by punishing the guilty and grants him a rare
    boon, making him the foremost in Vedic and domestic rituals.
  summary_hi: ब्रह्मा भगवान शिव से प्रार्थना करते हैं और अपनी भक्ति के प्रतीक के रूप
    में अपने सिर की बलि देने की इच्छा व्यक्त करते हैं। शिव, ब्रह्मा की भक्ति से प्रसन्न
    होकर, उन्हें संसार में व्यवस्था बनाए रखने और दोषियों को दंड देने का निर्देश देते
    हैं और उन्हें एक दुर्लभ वरदान देते हैं, जिससे वे वैदिक और गृह्य यज्ञों में श्रेष्ठ
    बन जाते हैं।
- id: ketaki-flower-curse
  type: story
  keywords:
  - Ketaki flower
  - Shiva
  - curse
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 8
  summary_en: Lord Shiva curses the Ketaki flower for bearing false witness, declaring
    that it will no longer be used in his worship. Despite this, Shiva assures the
    flower that it will still be honored by other deities and used in rituals, thus
    redeeming its existence.
  summary_hi: भगवान शिव केतकी फूल को झूठी गवाही देने के लिए शाप देते हैं कि वह उनकी
    पूजा में प्रयुक्त नहीं होगा। इसके बावजूद, शिव फूल को आश्वासन देते हैं कि अन्य
    देवताओं द्वारा इसे सम्मानित किया जाएगा और अनुष्ठानों में उपयोग किया जाएगा, जिससे
    इसका अस्तित्व सफल होगा।
- id: shivaratri-significance
  type: concept
  keywords:
  - Shivaratri
  - worship
  source:
    book: Shiv Puran
    sarga: '9'
  summary_en: Shivaratri is described as a highly auspicious day for worshiping Lord
    Shiva. It is said that worshiping Shiva on this day yields the same benefits as
    a year-long continuous worship. The day is considered sacred and is associated
    with the increase of Shiva's dharma, similar to how the full moon causes the ocean
    to swell.
  summary_hi: शिवरात्रि को भगवान शिव की पूजा के लिए अत्यंत शुभ दिन बताया गया है। कहा
    गया है कि इस दिन शिव की पूजा करने से एक वर्ष की निरंतर पूजा के समान फल प्राप्त
    होता है। यह दिन पवित्र माना जाता है और इसे शिव के धर्म की वृद्धि के समय के रूप
    में वर्णित किया गया है, जैसे पूर्ण चंद्रमा समुद्र की वृद्धि का कारण बनता है।
- id: shiva-linga-worship
  type: practice
  keywords:
  - Shiva
  - Linga
  - Worship
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Shiva instructs that worshiping the Linga form of Shiva will grant devotees
    various fruits and fulfill their desires. He emphasizes that whenever they face
    difficulties, worshiping the Linga will help alleviate their troubles.
  summary_hi: शिव यह निर्देश देते हैं कि शिव के लिंग रूप की पूजा करने से भक्तों को
    विभिन्न फल प्राप्त होंगे और उनकी इच्छाएँ पूरी होंगी। वे यह भी कहते हैं कि जब भी
    उन्हें कठिनाइयों का सामना करना पड़े, लिंग की पूजा करने से उनकी समस्याएँ दूर होंगी।
- id: arunachala-linga
  type: story
  keywords:
  - Arunachala
  - Linga
  source:
    book: Shiv Puran
    sarga: '9'
  summary_en: The Arunachala Linga is mentioned as a significant form of Shiva that
    emerged like a column of fire. It is said to be a place of pilgrimage where many
    holy sites will exist, and it is associated with liberation for beings who reside
    or die there.
  summary_hi: अरुणाचल लिंग को शिव के एक महत्वपूर्ण रूप के रूप में वर्णित किया गया
    है, जो अग्नि के स्तंभ के रूप में प्रकट हुआ। इसे एक तीर्थ स्थान बताया गया है जहाँ
    कई पवित्र स्थल होंगे, और यह उन प्राणियों के लिए मोक्ष से जुड़ा है जो वहाँ निवास
    करते हैं या मरते हैं।
- id: jyotirlinga-appearance-story
  type: story
  keywords:
  - jyotirlinga
  - shiva
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: Lord Shiva narrates the story of his appearance as a Jyotirlinga during
    the Ardra Nakshatra in the month of Margashirsha. He explains the significance
    of viewing or worshipping his form or the Linga during this time, promising great
    spiritual benefits to the devotees.
  summary_hi: भगवान शिव ज्योतिर्लिंग के रूप में मार्गशीर्ष मास के आर्द्रा नक्षत्र
    में प्रकट होने की कथा सुनाते हैं। वे इस समय उनके रूप या लिंग के दर्शन या पूजा
    के महत्व को बताते हैं, और भक्तों को महान आध्यात्मिक लाभ का आश्वासन देते हैं।
- id: arunachala-linga-story
  type: story
  keywords:
  - arunachala
  - shiva-linga
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: The passage describes the emergence of a massive Shiva Linga, resembling
    a mountain of fire, which led to the place being known as Arunachala. It is said
    to be a site where many sacred pilgrimages will manifest, and residing there grants
    liberation to beings.
  summary_hi: इस अंश में अग्नि के पहाड़ के समान एक विशाल शिवलिंग के प्रकट होने का
    वर्णन है, जिसके कारण यह स्थान अरुणाचल के नाम से प्रसिद्ध हुआ। यह कहा जाता है कि
    यहाँ कई पवित्र तीर्थ प्रकट होंगे और यहाँ निवास करने से जीवों को मुक्ति प्राप्त
    होगी।
- id: shiva-grants-liberation
  type: concept
  keywords:
  - liberation
  - shiva
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: Shiva explains the concept of liberation through worship at the Linga.
    By performing rituals and remembering Shiva, devotees can attain various forms
    of liberation, including Salokya, Samipya, Sarupya, and Sayujya.
  summary_hi: शिव लिंग में पूजा के माध्यम से मुक्ति की अवधारणा को समझाते हैं। अनुष्ठान
    करने और शिव का स्मरण करने से भक्त सालोक्य, सामीप्य, सारूप्य और सायुज्य जैसी विभिन्न
    प्रकार की मुक्ति प्राप्त कर सकते हैं।
- id: shiva-revives-armies
  type: event
  keywords:
  - shiva
  - brahma
  - vishnu
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: After a battle between the armies of Brahma and Vishnu, Shiva revives
    the slain soldiers using his divine power. He advises Brahma and Vishnu to let
    go of their pride and enmity, emphasizing his supreme nature.
  summary_hi: ब्रह्मा और विष्णु की सेनाओं के बीच युद्ध के बाद, शिव अपनी दिव्य शक्ति
    से मारे गए सैनिकों को पुनर्जीवित करते हैं। वे ब्रह्मा और विष्णु को अपने गर्व और
    वैर को छोड़ने की सलाह देते हैं, और अपनी सर्वोच्च प्रकृति पर जोर देते हैं।
- id: shiva-five-acts-concept
  type: concept
  keywords:
  - Shiva
  - five acts
  - creation
  - destruction
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: 'In this passage, Shiva explains his five cosmic acts: creation (sarga),
    maintenance (sthiti), destruction (samhara), concealment (tirobhava), and grace
    (anugraha). These acts are eternal and are carried out by the five elements. The
    concept highlights the cyclical nature of the universe and Shiva''s role in it.'
  summary_hi: 'इस अंश में शिवजी अपने पाँच ब्रह्मांडीय कृत्यों का वर्णन करते हैं: सर्ग
    (सृष्टि), स्थिति (पालन), संहार (विनाश), तिरोभाव (गोपन), और अनुग्रह (कृपा)। ये
    कृत्य शाश्वत हैं और पंच तत्वों द्वारा संपन्न होते हैं। यह अवधारणा ब्रह्मांड की
    चक्रीय प्रकृति और उसमें शिव की भूमिका को दर्शाती है।'
- id: omkara-mantra-concept
  type: concept
  keywords:
  - Omkara
  - mantra
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva imparts the knowledge of the Omkara mantra, which is considered
    the most auspicious and represents his essence. The mantra is composed of five
    elements and is a means to remember Shiva constantly. It symbolizes the unity
    of Shiva and Shakti and is central to spiritual practice.
  summary_hi: शिवजी ओंकार मंत्र का ज्ञान प्रदान करते हैं, जिसे सबसे शुभ माना जाता
    है और यह उनके स्वरूप का प्रतिनिधित्व करता है। यह मंत्र पाँच अवयवों से बना है और
    शिव को निरंतर स्मरण करने का साधन है। यह शिव और शक्ति की एकता का प्रतीक है और आध्यात्मिक
    साधना में केंद्रीय भूमिका निभाता है।
- id: pranava-origin-and-significance
  type: concept
  keywords:
  - pranava
  - panchakshara
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: The passage describes the origin of the Panchakshara mantra from the
    Pranava (ॐ) and its significance. It explains how the mantra leads to the manifestation
    of the Matrika letters and the Tripada Gayatri, which in turn gave rise to the
    Vedas and numerous mantras. These mantras are said to fulfill various desires,
    with the Pranava and Panchakshara being capable of granting both worldly pleasures
    and liberation.
  summary_hi: इस अंश में प्रणव (ॐ) से पंचाक्षर मंत्र की उत्पत्ति और उसके महत्व का
    वर्णन है। यह बताता है कि कैसे इस मंत्र से मातृका वर्ण और त्रिपदा गायत्री का प्राकट्य
    हुआ, जिससे वेद और अनेक मंत्र उत्पन्न हुए। ये मंत्र विभिन्न इच्छाओं की पूर्ति करते
    हैं, जबकि प्रणव और पंचाक्षर भोग और मोक्ष दोनों प्रदान करने में सक्षम हैं।
- id: shiva-initiation-of-brahma-and-vishnu
  type: event
  keywords:
  - initiation
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: In this episode, Lord Shiva, seated with Goddess Parvati, initiates
    Brahma and Vishnu into a supreme mantra. He covers them with a cloth and places
    his hand on their heads, imparting the mantra through slow recitation. Following
    the initiation, Brahma and Vishnu offer themselves as Guru Dakshina and praise
    Shiva as the supreme teacher.
  summary_hi: इस प्रकरण में, भगवान शिव, देवी पार्वती के साथ बैठे हुए, ब्रह्मा और विष्णु
    को एक उत्तम मंत्र की दीक्षा देते हैं। वह उन्हें वस्त्र से ढककर उनके सिर पर हाथ
    रखते हैं और धीरे-धीरे मंत्र का उच्चारण करते हैं। दीक्षा के बाद, ब्रह्मा और विष्णु
    स्वयं को गुरु दक्षिणा के रूप में समर्पित करते हैं और शिव की स्तुति करते हैं।
- id: creation-of-days-by-shiva
  type: concept
  keywords:
  - Shiva
  - days
  - creation
  source:
    book: Shiv Puran
    sarga: '71'
  summary_en: In this passage, Lord Shiva is described as creating the days of the
    week, each associated with different deities and their respective benefits. These
    days are meant to provide various boons such as health, prosperity, and longevity
    to the world.
  summary_hi: इस अंश में भगवान शिव को सप्ताह के दिनों की रचना करते हुए वर्णित किया
    गया है, जो विभिन्न देवताओं और उनके संबंधित लाभों से जुड़े हैं। ये दिन दुनिया को
    स्वास्थ्य, समृद्धि और दीर्घायु जैसे विभिन्न वरदान प्रदान करने के लिए हैं।
- id: worship-methods-for-deities
  type: practice
  keywords:
  - worship
  - deities
  - methods
  source:
    book: Shiv Puran
    sarga: '71'
  summary_en: 'The passage outlines five methods of worship to please the deities:
    chanting mantras, performing homa, giving donations, practicing penance, and conducting
    rituals with sixteen offerings. These practices are intended to gain the favor
    of the gods.'
  summary_hi: 'इस अंश में देवताओं को प्रसन्न करने के लिए पूजा की पाँच विधियों का वर्णन
    किया गया है: मंत्रों का जाप, हवन करना, दान देना, तपस्या करना, और सोलह उपचारों
    के साथ अनुष्ठान करना। ये प्रथाएँ देवताओं की कृपा प्राप्त करने के लिए हैं।'
- id: shiva-linga-worship-practice
  type: practice
  keywords:
  - Shiva
  - Linga
  - Worship
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The passage describes the practice of worshipping Lord Shiva in the
    form of a Shiva Linga. Devotees are instructed to perform rituals with incense,
    lamps, offerings, and chants. The practice includes offering flowers, performing
    salutations, and seeking forgiveness for any offenses. It emphasizes the importance
    of devotion to Shiva for attaining spiritual success and well-being.
  summary_hi: यह अंश भगवान शिव की शिवलिंग के रूप में पूजा की विधि का वर्णन करता है।
    भक्तों को धूप, दीप, नैवेद्य और मंत्रों के साथ पूजा करने का निर्देश दिया गया है।
    इसमें फूल चढ़ाना, नमस्कार करना और किसी भी अपराध के लिए क्षमा माँगना शामिल है।
    शिव की भक्ति के महत्व को रेखांकित किया गया है, जिससे आध्यात्मिक सफलता और कल्याण
    प्राप्त होता है।
- id: pranava-and-six-forms-of-linga
  type: concept
  keywords:
  - pranava
  - six-lingas
  source:
    book: Shiv Puran
    sarga: '16'
  summary_en: The text explains the concept of Pranava and its association with six
    forms of Linga. Each form represents different aspects of the divine, such as
    sound and bindu. The passage highlights the significance of these forms and suggests
    that regular worship of these six Lingas leads to liberation.
  summary_hi: पाठ में प्रणव और उसके साथ जुड़े छह लिंगों के रूपों की अवधारणा को समझाया
    गया है। प्रत्येक रूप दिव्य के विभिन्न पहलुओं का प्रतिनिधित्व करता है, जैसे ध्वनि
    और बिंदु। यह अंश इन रूपों के महत्व को उजागर करता है और सुझाव देता है कि इन छह
    लिंगों की नियमित पूजा से मुक्ति प्राप्त होती है।
- id: types-of-shiva-lingas
  type: concept
  keywords:
  - shiva-linga
  - types-of-linga
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The passage describes various types of Shiva Lingas, including Swayambhu
    Linga, Bindu Linga, Pratishthita Linga, Chara Linga, and Guru Linga. Each type
    of Linga has its own significance and method of worship, leading to spiritual
    and material benefits for the devotee.
  summary_hi: इस अंश में विभिन्न प्रकार के शिवलिंगों का वर्णन है, जिनमें स्वयम्भू
    लिंग, बिंदु लिंग, प्रतिष्ठित लिंग, चर लिंग और गुरु लिंग शामिल हैं। प्रत्येक लिंग
    का अपना महत्व और पूजा की विधि है, जो उपासक को आध्यात्मिक और भौतिक लाभ प्रदान करती
    है।
- id: shiva-bhasma-concept
  type: concept
  keywords:
  - bhasma
  - shiva
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: The passage describes the concept of Bhasma in Shaivism, where it is
    considered sacred ash produced by burning specific woods with the fire of Shiva.
    This ash is believed to contain the essence of the universe, and applying it is
    seen as a way to absorb the universe's essence, similar to how Shiva absorbed
    the essence of creation.
  summary_hi: इस अंश में शैव धर्म में भस्म की अवधारणा का वर्णन है, जहाँ इसे शिव की
    अग्नि से विशेष लकड़ियों को जलाकर उत्पन्न पवित्र राख माना जाता है। इस राख को ब्रह्मांड
    का सार माना जाता है, और इसे लगाने से ब्रह्मांड के सार को अवशोषित करने का तरीका
    माना जाता है, जैसे शिव ने सृष्टि के सार को अवशोषित किया।
- id: shiva-tripundra-concept
  type: concept
  keywords:
  - tripundra
  - shiva
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: The Tripundra, a three-line mark on the forehead, is described as representing
    the essence of Brahma, Vishnu, and Rudra. It is a significant symbol in Shaivism,
    symbolizing the absorption of universal essence and is worn by devotees during
    worship.
  summary_hi: त्रिपुंड्र, जो माथे पर तीन रेखाओं का चिन्ह होता है, ब्रह्मा, विष्णु
    और रुद्र के सार का प्रतिनिधित्व करता है। यह शैव धर्म में एक महत्वपूर्ण प्रतीक
    है, जो ब्रह्मांडीय सार के अवशोषण का प्रतीक है और इसे भक्त पूजा के दौरान धारण करते
    हैं।
- id: shiva-bhasma-practice
  type: practice
  keywords:
  - bhasma
  - shaivism
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita
  summary_en: The practice of applying Bhasma, or sacred ash, is emphasized as a significant
    ritual in Shaivism. Devotees apply it to their bodies, especially on the forehead
    as Tripundra, to gain spiritual benefits and purification, and it is considered
    essential for worship.
  summary_hi: भस्म या पवित्र राख लगाने की प्रथा शैव धर्म में एक महत्वपूर्ण अनुष्ठान
    के रूप में जोर दी गई है। भक्त इसे अपने शरीर पर, विशेषकर माथे पर त्रिपुंड्र के
    रूप में लगाते हैं, जिससे आध्यात्मिक लाभ और शुद्धिकरण प्राप्त होता है, और इसे पूजा
    के लिए आवश्यक माना जाता है।
- id: parthiva-linga-supremacy
  type: concept
  keywords:
  - parthiva-linga
  - shiva-worship
  source:
    book: Shiv Puran
    sarga: '19'
  summary_en: The passage describes the supremacy of the Parthiva Linga among all
    Shiva Lingas. It is considered the most revered and worshipped form, providing
    great spiritual benefits and fulfillment of desires to devotees. The Parthiva
    Linga is especially significant in the Kali Yuga, and its worship is said to yield
    more merit than other forms of penance.
  summary_hi: इस अंश में सभी शिवलिंगों में पार्थिव लिंग की श्रेष्ठता का वर्णन किया
    गया है। इसे सबसे अधिक पूजनीय और आराध्य रूप माना जाता है, जो भक्तों को महान आध्यात्मिक
    लाभ और इच्छाओं की पूर्ति प्रदान करता है। कलियुग में पार्थिव लिंग विशेष रूप से
    महत्वपूर्ण है, और इसकी पूजा अन्य प्रकार की तपस्या से अधिक पुण्य देती है।
- id: parthiva-linga-worship-practice
  type: practice
  keywords:
  - parthiva-linga
  - worship
  source:
    book: Shiv Puran
    sarga: Section 7
  summary_en: The passage describes the practice of worshipping Parthiva Lingas, which
    are clay representations of Shiva Lingas. It details the number of Lingas to be
    worshipped for various desires, such as wealth, progeny, and liberation. The text
    emphasizes the importance of this practice in achieving both worldly and spiritual
    benefits.
  summary_hi: इस अंश में पार्थिव लिंगों की पूजा का वर्णन किया गया है, जो शिव लिंगों
    के मिट्टी के रूप हैं। इसमें विभिन्न इच्छाओं जैसे धन, संतान और मोक्ष के लिए कितने
    लिंगों की पूजा की जानी चाहिए, इसका विवरण दिया गया है। यह पाठ इस प्रथा के महत्व
    को रेखांकित करता है, जो सांसारिक और आध्यात्मिक लाभ दोनों को प्राप्त करने में सहायक
    है।
- id: shiva-name-salvation-concept
  type: concept
  keywords:
  - Shiva
  - salvation
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 23
  summary_en: The passage emphasizes the power of chanting Lord Shiva's name as a
    means to attain salvation. It suggests that unwavering devotion to Shiva and the
    repetition of his name can absolve all sins, much like a forest fire reduces trees
    to ashes.
  summary_hi: यह अंश भगवान शिव के नाम का जप करने की शक्ति को मोक्ष प्राप्ति का साधन
    बताता है। यह सुझाव देता है कि शिव के प्रति अटूट भक्ति और उनके नाम का जप सभी पापों
    को समाप्त कर सकता है, जैसे जंगल की आग पेड़ों को राख में बदल देती है।
- id: indradyumna-salvation-story
  type: story
  keywords:
  - Indradyumna
  - salvation
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 23
  summary_en: King Indradyumna, who was a great sinner, attained salvation through
    the power of chanting Lord Shiva's name. This story illustrates the transformative
    power of Shiva's name in redeeming even the gravest of sinners.
  summary_hi: महापापी राजा इन्द्रद्युम्न ने भगवान शिव के नाम के जप के प्रभाव से मोक्ष
    प्राप्त किया। यह कहानी शिव के नाम की परिवर्तनकारी शक्ति को दर्शाती है, जो सबसे
    बड़े पापियों को भी उद्धार दिला सकती है।
- id: sinful-brahmin-woman-salvation-story
  type: story
  keywords:
  - Brahmin woman
  - salvation
  source:
    book: Shiv Puran
    sarga: Vidyeshwar Samhita, Chapter 23
  summary_en: A Brahmin woman, who had committed many sins, achieved salvation through
    the influence of chanting Lord Shiva's name. This narrative highlights the redemptive
    power of Shiva's name for those burdened with sin.
  summary_hi: एक ब्राह्मणी महिला, जिसने कई पाप किए थे, भगवान शिव के नाम के जप के प्रभाव
    से मोक्ष प्राप्त कर ली। यह कथा उन लोगों के लिए शिव के नाम की उद्धारक शक्ति को
    उजागर करती है जो पाप से ग्रस्त हैं।
- id: tripundra-importance-practice
  type: practice
  keywords:
  - tripundra
  - ash
  - purification
  source:
    book: Shiv Puran
    sarga: '24'
  summary_en: The passage emphasizes the importance of wearing the Tripundra, a sacred
    ash mark on the forehead, for all individuals regardless of their caste or stage
    of life. It is believed to purify the wearer and is a practice endorsed by Lord
    Shiva. The text also warns against consuming food or water without first adorning
    the Tripundra and Rudraksha, as doing so is considered sinful.
  summary_hi: यह अंश सभी व्यक्तियों के लिए त्रिपुंड्र, जो कि माथे पर लगाया जाने वाला
    पवित्र भस्म का चिह्न है, धारण करने के महत्व को बताता है। यह सभी जातियों और जीवन
    के सभी चरणों के लोगों के लिए शुद्धिकरण का प्रतीक माना जाता है और भगवान शिव द्वारा
    समर्थित है। पाठ यह भी चेतावनी देता है कि त्रिपुंड्र और रुद्राक्ष धारण किए बिना
    भोजन या पानी का सेवन करना पाप माना जाता है।
- id: bhasma-application-practice
  type: practice
  keywords:
  - bhasma
  - tripundra
  source:
    book: Shiva Purana
    sarga: Vidyeshvara Samhita, Chapter 24
  summary_en: The passage describes the practice of applying sacred ash (bhasma) on
    specific parts of the body, such as the forehead, arms, chest, and navel, while
    reciting specific mantras. This practice is associated with Lord Shiva and is
    considered a form of spiritual purification.
  summary_hi: यह अंश शरीर के विशिष्ट भागों पर पवित्र भस्म लगाने की प्रथा का वर्णन
    करता है, जैसे माथा, भुजाएँ, छाती और नाभि, विशेष मंत्रों का उच्चारण करते हुए। यह
    प्रथा भगवान शिव से जुड़ी है और इसे आध्यात्मिक शुद्धिकरण का एक रूप माना जाता है।
- id: rudraksha-origin-story
  type: story
  keywords:
  - rudraksha
  - Shiva
  source:
    book: Shiva Purana
    sarga: Vidyeshvara Samhita, Chapter 25
  summary_en: The origin of Rudraksha is described as tears shed by Lord Shiva during
    his intense meditation. These tears fell to the earth and transformed into Rudraksha
    trees, which are considered sacred and beneficial for spiritual practices.
  summary_hi: रुद्राक्ष की उत्पत्ति भगवान शिव के घोर तपस्या के दौरान बहाए गए आँसुओं
    के रूप में वर्णित है। ये आँसू पृथ्वी पर गिरे और रुद्राक्ष वृक्षों में परिवर्तित
    हो गए, जिन्हें पवित्र और आध्यात्मिक साधनाओं के लिए लाभकारी माना जाता है।
- id: rudraksha-varieties-concept
  type: concept
  keywords:
  - rudraksha
  - spiritual-benefits
  source:
    book: Shiv Puran
    sarga: '25'
  summary_en: The passage describes various types of Rudraksha beads and their spiritual
    benefits. Each type of Rudraksha, from one-faced to twelve-faced, is associated
    with different deities and is believed to provide specific spiritual and material
    benefits, such as the removal of sins and fulfillment of desires.
  summary_hi: इस अंश में विभिन्न प्रकार के रुद्राक्ष और उनके आध्यात्मिक लाभों का वर्णन
    किया गया है। एक मुखी से बारह मुखी तक के प्रत्येक रुद्राक्ष को विभिन्न देवताओं
    से जोड़ा गया है और इसे विशिष्ट आध्यात्मिक और भौतिक लाभ प्रदान करने वाला माना गया
    है, जैसे कि पापों का नाश और इच्छाओं की पूर्ति।
- id: eleven-faced-rudraksha
  type: concept
  keywords:
  - rudraksha
  - victory
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The eleven-faced Rudraksha is associated with the form of Rudra. Wearing
    it grants the wearer victory in all endeavors.
  summary_hi: ग्यारह मुखवाला रुद्राक्ष रुद्र के रूप से जुड़ा है। इसे धारण करने से
    धारणकर्ता को सभी प्रयासों में विजय प्राप्त होती है।
- id: twelve-faced-rudraksha
  type: concept
  keywords:
  - rudraksha
  - aditya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The twelve-faced Rudraksha should be worn on the head. It is believed
    to embody the presence of the twelve Adityas, bringing their blessings to the
    wearer.
  summary_hi: बारह मुखवाला रुद्राक्ष सिर पर धारण करना चाहिए। यह बारह आदित्यों की उपस्थिति
    को धारणकर्ता के लिए लाता है।
- id: thirteen-faced-rudraksha
  type: concept
  keywords:
  - rudraksha
  - vishwedevas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The thirteen-faced Rudraksha is associated with the Vishwedevas. Wearing
    it fulfills all desires and brings prosperity and auspiciousness.
  summary_hi: तेरह मुखवाला रुद्राक्ष विश्वेदेवों से जुड़ा है। इसे धारण करने से सभी
    इच्छाएं पूरी होती हैं और समृद्धि और शुभता प्राप्त होती है।
- id: fourteen-faced-rudraksha
  type: concept
  keywords:
  - rudraksha
  - shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The fourteen-faced Rudraksha is considered the supreme form of Shiva.
    Devotees wearing it on their head with devotion are freed from all sins.
  summary_hi: चौदह मुखवाला रुद्राक्ष परम शिव रूप माना जाता है। इसे भक्ति के साथ सिर
    पर धारण करने से सभी पापों से मुक्ति मिलती है।
- id: rudraksha-mantras
  type: practice
  keywords:
  - rudraksha
  - mantras
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Specific mantras are prescribed for wearing Rudrakshas with different
    numbers of faces. These mantras enhance the efficacy of the Rudrakshas and should
    be chanted with devotion.
  summary_hi: विभिन्न मुखों वाले रुद्राक्षों को धारण करने के लिए विशेष मंत्र निर्धारित
    हैं। ये मंत्र रुद्राक्षों की प्रभावशीलता को बढ़ाते हैं और इन्हें भक्ति के साथ
    जपना चाहिए।
- id: rudraksha-protection
  type: concept
  keywords:
  - rudraksha
  - protection
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Wearing a Rudraksha mala provides protection from evil spirits, ghosts,
    and negative energies. It is believed to ward off harmful influences and bring
    divine favor.
  summary_hi: रुद्राक्ष माला धारण करने से बुरी आत्माओं, भूतों और नकारात्मक ऊर्जा से
    सुरक्षा मिलती है। यह हानिकारक प्रभावों को दूर करता है और दिव्य कृपा लाता है।
- id: rudraksha-divine-favor
  type: concept
  keywords:
  - rudraksha
  - divine
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Seeing a person wearing a Rudraksha mala pleases deities like Shiva,
    Vishnu, Durga, Ganesh, and Surya, bringing their blessings to the wearer.
  summary_hi: रुद्राक्ष माला धारण करने वाले व्यक्ति को देखकर शिव, विष्णु, दुर्गा,
    गणेश और सूर्य जैसे देवता प्रसन्न होते हैं और अपनी कृपा प्रदान करते हैं।
- id: narada-tapasya-and-indra
  type: story
  keywords:
  - Narada
  - Indra
  - Tapasya
  - Disruption
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda, Chapter 2
  summary_en: Narada, the son of Brahma, decides to undertake intense tapasya (meditation)
    in a beautiful cave in the Himalayas, near the river Ganga. As he enters deep
    meditation, Indra, the king of gods, becomes anxious, fearing that Narada seeks
    to usurp his throne. To disrupt Narada's meditation, Indra summons Kamadeva, the
    god of love, to distract him.
  summary_hi: नारद, जो ब्रह्मा के पुत्र हैं, हिमालय में गंगा नदी के पास एक सुंदर गुफा
    में गहन तपस्या करने का निर्णय लेते हैं। जब वे गहरी ध्यानावस्था में होते हैं, तो
    इन्द्र, देवताओं के राजा, चिंतित हो जाते हैं, यह सोचकर कि नारद उनका सिंहासन छीनना
    चाहते हैं। नारद की तपस्या को भंग करने के लिए, इन्द्र कामदेव को बुलाते हैं ताकि
    वे नारद का ध्यान भंग कर सकें।
- id: indra-commands-kamadeva
  type: story
  keywords:
  - Indra
  - Kamadeva
  - Narada
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Indra, the king of gods, commands Kamadeva to disrupt the penance of
    Sage Narada, who is meditating to please Lord Shiva. Indra fears that Narada might
    ask for his kingdom as a boon from Brahma. Kamadeva, accompanied by Spring, attempts
    to disturb Narada's meditation but fails due to Lord Shiva's grace.
  summary_hi: देवराज इन्द्र कामदेव को आदेश देते हैं कि वे नारद मुनि की तपस्या में
    विघ्न डालें, जो भगवान शिव को प्रसन्न करने के लिए ध्यान कर रहे हैं। इन्द्र को डर
    है कि नारद ब्रह्मा से वरदान में उनका राज्य न मांग लें। कामदेव वसंत के साथ नारद
    की तपस्या को भंग करने का प्रयास करते हैं, लेकिन भगवान शिव की कृपा से असफल रहते
    हैं।
- id: shiva-burns-kamadeva
  type: story
  keywords:
  - Shiva
  - Kamadeva
  - Narada
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In the same ashram where Narada is meditating, Lord Shiva had previously
    performed intense penance and had burnt Kamadeva to ashes for disturbing the penance
    of sages. Later, at the request of the gods, Shiva assures that Kamadeva will
    be revived after some time, but his powers will not work in that region.
  summary_hi: उसी आश्रम में जहां नारद ध्यान कर रहे हैं, भगवान शिव ने पहले गहन तपस्या
    की थी और मुनियों की तपस्या में विघ्न डालने के लिए कामदेव को भस्म कर दिया था। बाद
    में, देवताओं के अनुरोध पर, शिव आश्वासन देते हैं कि कुछ समय बाद कामदेव पुनर्जीवित
    होंगे, लेकिन उस क्षेत्र में उनकी शक्तियाँ काम नहीं करेंगी।
- id: narada-pride-and-shiva-maya
  type: story
  keywords:
  - Narada
  - Shiva
  - Maya
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Srishtikhanda
  summary_en: Narada, after defeating Kamadeva with his penance, becomes prideful
    and shares his victory with Lord Shiva. However, Shiva warns Narada not to speak
    of this victory, especially in front of Vishnu, as it is a secret. Despite the
    warning, Narada, influenced by Shiva's Maya, does not heed the advice and continues
    to boast about his victory.
  summary_hi: नारद, कामदेव को अपनी तपस्या से हराने के बाद गर्वित हो जाते हैं और अपनी
    विजय की बात भगवान शिव से साझा करते हैं। शिव उन्हें चेतावनी देते हैं कि इस विजय
    की बात विशेषकर विष्णु के सामने न करें क्योंकि यह एक गुप्त रहस्य है। शिव की माया
    से प्रभावित नारद इस चेतावनी को नहीं मानते और अपनी विजय का गर्व करते रहते हैं।
- id: narada-visit-to-brahmaloka
  type: event
  keywords:
  - Narada
  - Brahma
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Srishtikhanda
  summary_en: Narada visits Brahmaloka and tells Brahma about his victory over Kamadeva.
    Brahma, understanding the influence of Shiva's Maya, advises Narada to keep this
    event a secret. However, Narada, under the influence of pride, does not consider
    Brahma's advice beneficial.
  summary_hi: नारद ब्रह्मलोक जाते हैं और ब्रह्मा को कामदेव पर अपनी विजय के बारे में
    बताते हैं। ब्रह्मा, शिव की माया के प्रभाव को समझते हुए, नारद को इस घटना को गुप्त
    रखने की सलाह देते हैं। लेकिन गर्व के प्रभाव में नारद ब्रह्मा की सलाह को लाभकारी
    नहीं मानते।
- id: narada-visit-to-vaikuntha
  type: event
  keywords:
  - Narada
  - Vishnu
  - Pride
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Srishtikhanda
  summary_en: Narada, filled with pride, goes to Vaikuntha to narrate his victory
    over Kamadeva to Lord Vishnu. Despite warnings from both Shiva and Brahma, Narada's
    pride leads him to share his story with Vishnu.
  summary_hi: गर्व से भरे नारद, कामदेव पर अपनी विजय की कहानी भगवान विष्णु को सुनाने
    के लिए वैकुंठ जाते हैं। शिव और ब्रह्मा की चेतावनियों के बावजूद, नारद का गर्व उन्हें
    विष्णु के साथ अपनी कहानी साझा करने के लिए प्रेरित करता है।
- id: narada-visit-to-vishnu
  type: story
  keywords:
  - Narada
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda, Chapter 2
  summary_en: Narada visits Vishnu, who welcomes him warmly and inquires about the
    purpose of his visit. Narada, filled with pride, recounts his deeds. Vishnu, understanding
    the situation, meditates on Shiva and praises him, acknowledging Shiva's supreme
    power and maya. Vishnu then advises Narada on the importance of devotion, knowledge,
    and detachment.
  summary_hi: नारद विष्णु के पास आते हैं, जो उनका स्वागत करते हैं और उनके आगमन का
    कारण पूछते हैं। गर्व से भरे नारद अपने कार्यों का वर्णन करते हैं। विष्णु स्थिति
    को समझकर शिव का ध्यान करते हैं और उनकी स्तुति करते हैं, शिव की सर्वोच्च शक्ति
    और माया को स्वीकार करते हैं। विष्णु नारद को भक्ति, ज्ञान और वैराग्य के महत्व के
    बारे में सलाह देते हैं।
- id: narada-curse-to-shiva-ganas
  type: story
  keywords:
  - Narada
  - Shiva Ganas
  - curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda, Chapter 3
  summary_en: Narada, influenced by Shiva's maya, becomes angry when mocked by Shiva's
    ganas. In his anger, he curses them to be born as demons from a Brahmin's seed,
    despite their Brahmin birth, they will have demonic forms.
  summary_hi: नारद, शिव की माया से प्रभावित होकर, शिव के गणों द्वारा उपहास किए जाने
    पर क्रोधित हो जाते हैं। अपने क्रोध में, वे उन्हें ब्राह्मण के वीर्य से उत्पन्न
    राक्षस होने का शाप देते हैं, हालांकि उनका जन्म ब्राह्मण के रूप में होगा, उनके
    आकार राक्षस के समान होंगे।
- id: narada-visit-to-king-shilanidhi
  type: event
  keywords:
  - Narada
  - King Shilanidhi
  - Swayamvara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Narada visits the kingdom of King Shilanidhi, where a grand swayamvara
    is being organized for the king's daughter, Shrimati. Narada is captivated by
    the beauty of the city and the arrangements for the swayamvara.
  summary_hi: नारद राजा शीलनिधि के राज्य में जाते हैं, जहाँ राजा की पुत्री श्रीमती
    के लिए एक भव्य स्वयंवर का आयोजन किया जा रहा है। नारद नगर की सुंदरता और स्वयंवर
    की तैयारियों से मोहित हो जाते हैं।
- id: narada-fascination-with-shrimati
  type: story
  keywords:
  - Narada
  - Shrimati
  - Swayamvara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Narada is fascinated by the beauty of Shrimati, the daughter of King
    Shilanidhi, and desires to marry her. He approaches Lord Vishnu to seek his help
    in winning Shrimati's hand in marriage.
  summary_hi: नारद राजा शीलनिधि की पुत्री श्रीमती की सुंदरता से मोहित हो जाते हैं
    और उससे विवाह करने की इच्छा रखते हैं। वे श्रीमती का हाथ जीतने के लिए भगवान विष्णु
    की सहायता मांगने जाते हैं।
- id: narada-vishnu-disguise-story
  type: story
  keywords:
  - narada
  - vishnu
  - disguise
  - swayamvara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Narada Muni, enamored by the beauty of King Sheelanidhi's daughter Shrimati,
    seeks to win her hand at her swayamvara. He requests Lord Vishnu to lend him his
    form, believing that Shrimati will only choose him if he appears as Vishnu. Vishnu
    humorously grants Narada a monkey's face while retaining his own form for the
    rest of Narada's body. Unaware of this, Narada attends the swayamvara, confident
    of his appearance.
  summary_hi: नारद मुनि, राजा शीलनिधि की पुत्री श्रीमती की सुंदरता से मोहित होकर,
    उसके स्वयंवर में उसका हाथ जीतने की इच्छा रखते हैं। वह भगवान विष्णु से उनका रूप
    देने का अनुरोध करते हैं, यह मानते हुए कि श्रीमती केवल उन्हें ही चुनेगी यदि वह
    विष्णु के रूप में दिखाई देंगे। विष्णु हंसते हुए नारद को बंदर का चेहरा देते हैं
    जबकि नारद के शरीर के बाकी हिस्से को अपने रूप में रखते हैं। इस बात से अनजान नारद
    स्वयंवर में भाग लेते हैं, अपने रूप को लेकर आश्वस्त रहते हैं।
- id: narada-vishnu-disguise-episode
  type: story
  keywords:
  - Narada
  - Vishnu
  - disguise
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 142
  summary_en: Narada, disguised as Vishnu, attends a royal assembly hoping to be chosen
    by a princess. However, his face is transformed to resemble a monkey's, unbeknownst
    to him. The princess, upon seeing his appearance, chooses the real Vishnu, who
    arrives later in disguise as a king.
  summary_hi: नारद, विष्णु के रूप में वेश बदलकर, एक राजसभा में जाते हैं और उम्मीद
    करते हैं कि राजकुमारी उन्हें चुनेगी। हालांकि, उनका चेहरा बंदर जैसा हो जाता है,
    जो उन्हें पता नहीं होता। राजकुमारी उनके रूप को देखकर अस्वीकार कर देती है और बाद
    में राजा के रूप में आए असली विष्णु को चुनती है।
- id: narada-curse-episode
  type: story
  keywords:
  - Narada
  - curse
  - Rudra's attendants
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 142
  summary_en: After realizing his monkey-like appearance, Narada becomes furious and
    curses Rudra's attendants, who had mocked him. He curses them to become demons,
    but the attendants remain calm and return to their place, understanding Narada's
    state of delusion.
  summary_hi: अपने बंदर जैसे चेहरे को देखकर नारद क्रोधित हो जाते हैं और उनका उपहास
    करने वाले रुद्र के गणों को शाप देते हैं। वह उन्हें राक्षस बनने का शाप देते हैं,
    लेकिन गण शांत रहते हैं और नारद की मोहावस्था को समझते हुए अपने स्थान पर लौट जाते
    हैं।
- id: narada-anger-at-vishnu
  type: story
  keywords:
  - Narada
  - Vishnu
  - anger
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda, Chapter 4
  summary_en: Narada, still under the influence of Shiva's maya, goes to Vishnu Lok
    in anger, accusing Vishnu of deceit and trickery. He recalls Vishnu's past actions,
    such as taking the form of Mohini to deceive the demons, and blames him for his
    current state of delusion.
  summary_hi: नारद, शिव की माया के प्रभाव में रहते हुए, क्रोध में विष्णु लोक जाते
    हैं और विष्णु पर छल और कपट का आरोप लगाते हैं। वे विष्णु के पिछले कार्यों को याद
    करते हैं, जैसे कि मोहिनी रूप धारण कर असुरों को धोखा देना, और अपने वर्तमान भ्रमित
    अवस्था के लिए उन्हें दोषी ठहराते हैं।
- id: narada-curse-to-vishnu
  type: story
  keywords:
  - Narada
  - Vishnu
  - curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Narada, under the influence of illusion, curses Vishnu for causing him
    distress over a woman. He declares that Vishnu will become human and suffer the
    pain of separation from a woman, just as he caused others to suffer. Vishnu accepts
    the curse, acknowledging the power of Shiva's illusion.
  summary_hi: नारद, मोह के प्रभाव में आकर, विष्णु को एक स्त्री के कारण उसे व्याकुल
    करने के लिए शाप देते हैं। वे कहते हैं कि विष्णु मनुष्य बनेंगे और स्त्री के वियोग
    का दुःख भोगेंगे, जैसे उन्होंने दूसरों को दुःख दिया। विष्णु इस शाप को स्वीकार करते
    हैं और शिव की माया की प्रशंसा करते हैं।
- id: narada-penance-guidance
  type: story
  keywords:
  - Narada
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Narada, feeling remorseful for his actions, seeks guidance from Lord
    Vishnu on how to atone for his sins and avoid hell. Vishnu advises Narada to worship
    Lord Shiva, as Shiva is the one who grants the fruits of actions and can remove
    pride. Vishnu explains that by singing the praises of Shiva and reciting the Shiva
    Shatanama Stotra, Narada's sins will be destroyed.
  summary_hi: नारद, अपने कर्मों के लिए पश्चाताप करते हुए, भगवान विष्णु से अपने पापों
    का प्रायश्चित्त करने और नरक से बचने के उपाय पूछते हैं। विष्णु उन्हें भगवान शिव
    की उपासना करने की सलाह देते हैं, क्योंकि शिव ही कर्मों के फल देने वाले और गर्व
    को दूर करने वाले हैं। विष्णु बताते हैं कि शिव के सुयश का गान करने और शिव शतनाम
    स्तोत्र का पाठ करने से नारद के पाप नष्ट हो जाएंगे।
- id: shiva-devotion-concept
  type: concept
  keywords:
  - Shiva
  - devotion
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Srishtikhanda
  summary_en: The passage emphasizes the importance of unwavering devotion to Lord
    Shiva. It states that all sins and sufferings rooted in worldly existence can
    be eradicated through the worship of Shiva. The text highlights that true liberation
    is attainable only through sincere and exclusive devotion to Shiva.
  summary_hi: यह अंश भगवान शिव के प्रति अटूट भक्ति के महत्व को रेखांकित करता है। इसमें
    कहा गया है कि शिव की पूजा के माध्यम से संसार में निहित सभी पाप और दुखों का नाश
    हो सकता है। पाठ में यह भी बताया गया है कि सच्ची मुक्ति केवल शिव के प्रति ईमानदार
    और अनन्य भक्ति से ही प्राप्त की जा सकती है।
- id: shiva-devotion-and-salvation
  type: concept
  keywords:
  - Shiva
  - devotion
  - salvation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khand
  summary_en: The passage emphasizes the importance of devotion to Lord Shiva as a
    means to attain salvation. It suggests that even those who have committed great
    sins can be absolved through sincere worship of Shiva. The text highlights practices
    such as applying sacred ash, chanting the six-syllable mantra, and wearing Rudraksha
    beads as part of Shiva worship.
  summary_hi: इस अंश में भगवान शिव की भक्ति के महत्व को मोक्ष प्राप्ति के साधन के
    रूप में बताया गया है। यह सुझाव देता है कि जो लोग बड़े पाप कर चुके हैं, वे भी शिव
    की सच्ची पूजा के माध्यम से मुक्त हो सकते हैं। पाठ में पवित्र भस्म का लेपन, षडक्षर
    मंत्र का जाप और रुद्राक्ष धारण करने जैसी शिव पूजा की प्रथाओं को उजागर किया गया
    है।
- id: narada-instructed-by-vishnu
  type: event
  keywords:
  - Narada
  - Vishnu
  - instruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khand
  summary_en: Lord Vishnu instructs Narada Muni to establish the lotus feet of Lord
    Shiva in his heart and to visit sacred places associated with Shiva. Vishnu advises
    Narada to seek blessings from Brahma and learn about Shiva's greatness, ultimately
    encouraging him to become a devoted follower of Shiva for attaining liberation.
  summary_hi: भगवान विष्णु नारद मुनि को भगवान शिव के चरणों को अपने हृदय में स्थापित
    करने और शिव से संबंधित पवित्र स्थलों की यात्रा करने का निर्देश देते हैं। विष्णु
    नारद को ब्रह्मा से आशीर्वाद प्राप्त करने और शिव की महानता के बारे में जानने की
    सलाह देते हैं, अंततः उन्हें मोक्ष प्राप्ति के लिए शिव के भक्त बनने के लिए प्रोत्साहित
    करते हैं।
- id: narada-shiva-lingas-journey
  type: story
  keywords:
  - Narada
  - Shiva Lingas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, First Khanda, Chapter 5
  summary_en: After Lord Vishnu's disappearance, Sage Narada roams the earth, visiting
    various Shiva Lingas with devotion. During his travels, he encounters two Shiva
    Ganas who seek his forgiveness for a curse he had previously placed on them.
  summary_hi: भगवान विष्णु के अंतर्धान होने के बाद, नारद मुनि पृथ्वी पर भ्रमण करते
    हैं और भक्ति के साथ विभिन्न शिवलिंगों का दर्शन करते हैं। अपनी यात्रा के दौरान,
    वे दो शिवगणों से मिलते हैं जो उनसे पहले दिए गए शाप के लिए क्षमा मांगते हैं।
- id: shiva-ganas-curse-lifting
  type: story
  keywords:
  - Shiva Ganas
  - Curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, First Khanda, Chapter 5
  summary_en: The Shiva Ganas approach Narada, expressing their regret for the past
    incident at a royal swayamvara where they were cursed by him. They explain that
    their actions were influenced by divine will and request Narada to lift the curse.
    Narada, acknowledging his error, provides them with a way to be freed from the
    curse.
  summary_hi: शिवगण नारद के पास आते हैं और एक राजकुमारी के स्वयंवर में हुए पिछले घटनाक्रम
    के लिए खेद व्यक्त करते हैं, जहाँ उन्हें नारद द्वारा शापित किया गया था। वे बताते
    हैं कि उनके कार्य दिव्य इच्छा से प्रेरित थे और नारद से शाप को हटाने की प्रार्थना
    करते हैं। नारद अपनी गलती को स्वीकार करते हुए उन्हें शाप से मुक्त होने का उपाय
    बताते हैं।
- id: narada-visit-to-kashi
  type: story
  keywords:
  - Narada
  - Kashi
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Narada Muni, after hearing the words of the great sage, visits the holy
    city of Kashi. He experiences immense joy and fulfillment upon seeing the city,
    which is dear to Lord Shiva. Narada worships Lord Kashi Nath with great devotion
    and then proceeds to Brahmaloka.
  summary_hi: महर्षि नारद, महान ऋषि के वचनों को सुनने के बाद, पवित्र नगरी काशी का
    दर्शन करते हैं। वे भगवान शिव की प्रिय नगरी को देखकर अत्यंत आनंदित और कृतार्थ होते
    हैं। नारदजी भगवान काशीनाथ की पूजा करते हैं और फिर ब्रह्मलोक की ओर प्रस्थान करते
    हैं।
- id: narada-seeks-shiva-tattva
  type: story
  keywords:
  - Narada
  - Shiva Tattva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, First Khanda, Chapter 5
  summary_en: Narada, filled with devotion, travels to Brahmaloka to seek deeper understanding
    of Shiva Tattva. He approaches Lord Brahma with reverence, seeking knowledge about
    the essence of Lord Shiva.
  summary_hi: नारद, भक्ति से परिपूर्ण होकर, शिव तत्त्व की गहरी समझ प्राप्त करने के
    लिए ब्रह्मलोक की यात्रा करते हैं। वे भगवान ब्रह्मा के पास श्रद्धा के साथ जाते
    हैं और भगवान शिव के सार के बारे में ज्ञान प्राप्त करने की इच्छा व्यक्त करते हैं।
- id: kumbhakarna-ravana-birth
  type: story
  keywords:
  - Kumbhakarna
  - Ravana
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The passage describes the birth of Kumbhakarna and Ravana, who are born
    from the virility of sage Vishrava. They become renowned across all directions,
    possessing great strength, wealth, and valor. They are destined to be killed by
    Lord Vishnu and will be reinstated to their positions.
  summary_hi: इस अंश में कुम्भकर्ण और रावण के जन्म का वर्णन है, जो मुनि विश्रवा के
    वीर्य से उत्पन्न होते हैं। वे सभी दिशाओं में प्रसिद्ध होते हैं और महान बल, वैभव
    और प्रताप से युक्त होते हैं। उनका वध भगवान विष्णु के हाथों होना तय है और वे अपने
    पद पर पुनः प्रतिष्ठित होंगे।
- id: narada-seeks-shiva-knowledge
  type: story
  keywords:
  - Narada
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Narada Muni, filled with devotion towards Lord Shiva, approaches Brahma
    to gain knowledge about Shiva Tattva. He expresses his desire to understand the
    nature of Shiva, his worship, and his various forms and pastimes. Brahma is requested
    to narrate the stories of Shiva's manifestations and his marriage with Uma.
  summary_hi: नारद मुनि, भगवान शिव के प्रति भक्ति से परिपूर्ण होकर, शिव तत्त्व का
    ज्ञान प्राप्त करने के लिए ब्रह्मा के पास जाते हैं। वे शिव के स्वरूप, उनकी पूजा
    और विभिन्न लीलाओं को समझने की इच्छा व्यक्त करते हैं। ब्रह्मा से शिव के अवतारों
    और उमा के साथ उनके विवाह की कथाओं को सुनाने का अनुरोध किया जाता है।
- id: creation-of-ambika
  type: story
  keywords:
  - Ambika
  - Shakti
  - Creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In the narrative, Sadashiva creates a powerful Shakti named Ambika.
    She is described as having eight arms, a radiant face, and adorned with various
    ornaments. Ambika is the mother of the three deities and is considered the primal
    cause of the universe.
  summary_hi: इस कथा में, सदाशिव ने अंबिका नामक एक शक्तिशाली शक्ति की रचना की। उसे
    आठ भुजाओं वाली, एक चमकदार मुख वाली और विभिन्न आभूषणों से सुसज्जित बताया गया है।
    अंबिका को त्रिदेवों की माता और ब्रह्मांड का मूल कारण माना जाता है।
- id: creation-of-shivaloka
  type: story
  keywords:
  - Shivaloka
  - Creation
  - Kashi
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The narrative describes the creation of Shivaloka, also known as Kashi,
    by Sadashiva. This realm is considered the supreme abode of liberation, transcending
    all others.
  summary_hi: इस कथा में, सदाशिव द्वारा शिवलोक, जिसे काशी भी कहा जाता है, की रचना
    का वर्णन किया गया है। यह क्षेत्र मोक्ष का सर्वोच्च स्थान माना जाता है, जो सभी
    अन्य स्थानों से ऊपर है।
- id: creation-of-vishnu
  type: story
  keywords:
  - Vishnu
  - creation
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In the blissful forest of Anandavana, Shiva and Shakti decide to create
    another being to manage the burden of creation, allowing them to reside in Kashi.
    From Shiva's left side, a beautiful and virtuous being emerges, who is named Vishnu.
    Shiva instructs Vishnu to perform penance to achieve his goals.
  summary_hi: आनन्दवन में शिव और शक्ति ने सृष्टि के संचालन का भार किसी अन्य पुरुष
    पर डालने का निर्णय लिया ताकि वे काशी में निवास कर सकें। शिव के वामभाग से एक सुंदर
    और गुणी पुरुष प्रकट हुआ, जिसे विष्णु नाम दिया गया। शिव ने विष्णु को अपने लक्ष्यों
    को प्राप्त करने के लिए तप करने का निर्देश दिया।
- id: vishnu-naming-and-tapasya
  type: story
  keywords:
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Upakhyan, Chapter 6
  summary_en: Shiva tells Vishnu that he will be known by the name 'Vishnu' due to
    his all-pervading nature. Shiva advises Vishnu to perform intense penance, which
    Vishnu does for twelve thousand divine years without achieving his desired vision
    of Shiva. Doubtful, Vishnu receives a divine voice instructing him to continue
    his penance.
  summary_hi: शिव विष्णु से कहते हैं कि वह अपने व्यापक स्वभाव के कारण 'विष्णु' नाम
    से प्रसिद्ध होंगे। शिव विष्णु को गहन तप करने की सलाह देते हैं, जिसे विष्णु बारह
    हजार दिव्य वर्षों तक करते हैं, लेकिन शिव के दर्शन नहीं कर पाते। संदेह में पड़े
    विष्णु को एक दिव्य वाणी सुनाई देती है जो उन्हें तप जारी रखने का निर्देश देती है।
- id: narayana-name-origin
  type: etymology
  keywords:
  - Narayana
  - Water
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Upakhyan, Chapter 6
  summary_en: The name 'Narayana' is explained as Vishnu rests in the cosmic waters
    after his penance. The term 'Narayana' is derived from 'Nara' meaning water, indicating
    Vishnu's connection with the primordial waters.
  summary_hi: '''नारायण'' नाम की व्युत्पत्ति तब होती है जब विष्णु अपनी तपस्या के बाद
    ब्रह्मरूप जल में विश्राम करते हैं। ''नारायण'' शब्द ''नर'' से उत्पन्न होता है जिसका
    अर्थ जल है, जो विष्णु के आदिकालीन जल से संबंध को दर्शाता है।'
- id: creation-of-elements
  type: concept
  keywords:
  - Creation
  - Elements
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Upakhyan, Chapter 6
  summary_en: The passage describes the creation of elements and senses from the primal
    matter. From Prakriti, Mahat is born, followed by the three Gunas, leading to
    the formation of Ahamkara, Tanmatras, and the five elements, along with the senses.
  summary_hi: इस अंश में तत्वों और इंद्रियों की उत्पत्ति का वर्णन है। प्रकृति से महत्त्व
    उत्पन्न होता है, फिर तीन गुणों का जन्म होता है, जिससे अहंकार, तन्मात्राएँ और पाँच
    तत्व उत्पन्न होते हैं, साथ ही इंद्रियों का भी प्रादुर्भाव होता है।
- id: brahma-birth-from-lotus
  type: story
  keywords:
  - brahma
  - lotus
  - creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Brahma narrates his own birth from the lotus that emerged from the navel
    of Lord Vishnu. Bewildered by the illusion created by Lord Shiva, Brahma finds
    himself on the lotus without knowledge of his origin. He questions his identity
    and purpose, and eventually performs penance to seek answers.
  summary_hi: ब्रह्मा अपने जन्म की कथा सुनाते हैं, जो भगवान विष्णु की नाभि से उत्पन्न
    कमल से हुआ था। भगवान शिव की माया से मोहित होकर, ब्रह्मा कमल पर अपने उत्पत्ति के
    बारे में अनजान होते हैं। वे अपनी पहचान और उद्देश्य के बारे में प्रश्न करते हैं
    और उत्तर पाने के लिए तपस्या करते हैं।
- id: brahma-seeks-origin
  type: story
  keywords:
  - brahma
  - origin
  - penance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Brahma, in his quest to find his origin, descends from the lotus and
    explores its stem for hundreds of years but fails to find its source. Confused
    and bewildered, he hears a divine voice instructing him to perform penance, which
    he does for twelve years.
  summary_hi: ब्रह्मा, अपनी उत्पत्ति का पता लगाने के प्रयास में, कमल से नीचे उतरते
    हैं और सैकड़ों वर्षों तक उसके नाल का अन्वेषण करते हैं लेकिन स्रोत नहीं पाते। भ्रमित
    और मोहित होकर, वे एक दिव्य वाणी सुनते हैं जो उन्हें तप करने का निर्देश देती है,
    जिसे वे बारह वर्षों तक करते हैं।
- id: vishnu-appears-to-brahma
  type: story
  keywords:
  - vishnu
  - brahma
  - divine-vision
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: After Brahma's penance, Lord Vishnu appears before him in a divine form
    with four arms, holding a conch, discus, mace, and lotus. Vishnu's appearance
    is described as enchanting and radiant, bringing immense joy to Brahma, who is
    still under the influence of Shiva's illusion.
  summary_hi: ब्रह्मा की तपस्या के बाद, भगवान विष्णु उनके सामने चार भुजाओं वाले दिव्य
    रूप में प्रकट होते हैं, जिनके हाथों में शंख, चक्र, गदा और पद्म होता है। विष्णु
    का रूप मोहक और तेजस्वी होता है, जो ब्रह्मा को अत्यधिक आनंदित करता है, जो अभी भी
    शिव की माया के प्रभाव में होते हैं।
- id: brahma-vishnu-dialogue
  type: story
  keywords:
  - Brahma
  - Vishnu
  - dialogue
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Srishtikhanda
  summary_en: In this episode, Brahma and Vishnu engage in a dialogue where Brahma
    questions Vishnu's familiarity and authority. Vishnu reassures Brahma of his divine
    role and explains that Brahma's existence and actions are part of Vishnu's cosmic
    plan. The dialogue highlights the interplay of divine roles and the concept of
    Maya.
  summary_hi: इस प्रकरण में, ब्रह्मा और विष्णु के बीच संवाद होता है जहाँ ब्रह्मा विष्णु
    की पहचान और अधिकार पर प्रश्न करते हैं। विष्णु ब्रह्मा को उनके दिव्य कर्तव्यों
    के बारे में आश्वस्त करते हैं और बताते हैं कि ब्रह्मा का अस्तित्व और कार्य विष्णु
    की ब्रह्मांडीय योजना का हिस्सा हैं। यह संवाद दिव्य भूमिकाओं और माया के सिद्धांत
    को उजागर करता है।
- id: brahma-vishnu-conflict-and-linga-appearance
  type: story
  keywords:
  - Brahma
  - Vishnu
  - Linga
  source:
    book: Shiv Puran
    sarga: Section 9
  summary_en: A conflict arises between Brahma and Vishnu, each claiming supremacy.
    As they engage in a fierce battle, a mysterious Linga appears before them, emitting
    intense flames and light. This Linga is beyond description and serves to resolve
    their dispute and impart knowledge.
  summary_hi: ब्रह्मा और विष्णु के बीच एक संघर्ष उत्पन्न होता है, जिसमें दोनों अपनी
    श्रेष्ठता का दावा करते हैं। जब वे एक भयंकर युद्ध में संलग्न होते हैं, तो उनके
    सामने एक रहस्यमय लिंग प्रकट होता है, जो तीव्र ज्वालाओं और प्रकाश का उत्सर्जन करता
    है। यह लिंग वर्णन से परे है और उनके विवाद को सुलझाने और ज्ञान प्रदान करने का कार्य
    करता है।
- id: vishnu-brahma-linga-test
  type: story
  keywords:
  - Vishnu
  - Brahma
  - Jyotirlinga
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda, Chapter 7
  summary_en: In this episode, Vishnu and Brahma are enchanted by Shiva's maya and
    decide to test the origin of a divine linga that appears as a pillar of fire.
    Vishnu takes the form of a boar and descends to find the base, while Brahma transforms
    into a swan to find the top. Despite their efforts, neither can find the end of
    the linga, leading them to realize the infinite nature of Shiva.
  summary_hi: इस प्रकरण में, विष्णु और ब्रह्मा शिव की माया से मोहित होकर एक दिव्य
    लिंग के उत्पत्ति की परीक्षा करने का निर्णय लेते हैं, जो अग्नि के स्तंभ के रूप
    में प्रकट होता है। विष्णु वाराह का रूप धारण कर आधार खोजने के लिए नीचे जाते हैं,
    जबकि ब्रह्मा हंस का रूप धारण कर शीर्ष खोजने के लिए ऊपर जाते हैं। उनके प्रयासों
    के बावजूद, कोई भी लिंग का अंत नहीं पा सका, जिससे उन्हें शिव की अनंतता का एहसास
    होता है।
- id: omkar-manifestation-episode
  type: story
  keywords:
  - Omkar
  - manifestation
  source:
    book: Shiv Puran
    sarga: Chapter 8
  summary_en: In this episode, the sound 'Om' manifests from the supreme deity, symbolizing
    the primordial sound. Lord Vishnu, along with other deities, witnesses this divine
    occurrence and contemplates its significance. The Omkar is described as having
    three parts, representing the cosmic functions of creation, preservation, and
    destruction.
  summary_hi: इस प्रकरण में, 'ॐ' ध्वनि परमेश्वर से प्रकट होती है, जो आद्य ध्वनि का
    प्रतीक है। भगवान विष्णु अन्य देवताओं के साथ इस दिव्य घटना का साक्षात्कार करते
    हैं और इसके महत्व पर विचार करते हैं। ओंकार को तीन भागों में वर्णित किया गया है,
    जो सृष्टि, पालन और संहार के ब्रह्मांडीय कार्यों का प्रतिनिधित्व करते हैं।
- id: jyotirlinga-vision-episode
  type: story
  keywords:
  - Jyotirlinga
  - vision
  source:
    book: Shiv Puran
    sarga: Chapter 8
  summary_en: Brahma and Vishnu, devoid of pride, continuously bow to the Jyotirlinga,
    seeking a vision of the supreme deity. They witness the Jyotirlinga, which symbolizes
    the eternal and formless aspect of Shiva, and realize the divine presence of the
    supreme Brahman.
  summary_hi: ब्रह्मा और विष्णु, गर्व से रहित होकर, ज्योतिर्लिंग के सामने निरंतर प्रणाम
    करते हैं और परमेश्वर के दर्शन की कामना करते हैं। वे ज्योतिर्लिंग का दर्शन करते
    हैं, जो शिव के शाश्वत और निराकार स्वरूप का प्रतीक है, और परम ब्रह्म की दिव्य उपस्थिति
    को महसूस करते हैं।
- id: pranava-significance-episode
  type: concept
  keywords:
  - Pranava
  - significance
  source:
    book: Shiv Puran
    sarga: Chapter 8
  summary_en: The episode explains the significance of the Pranava (Om) and its components.
    The sound 'A' represents Brahma, the creator; 'U' represents Vishnu, the preserver;
    and 'M' represents Shiva, the destroyer. Together, they symbolize the entire universe
    and the supreme Brahman.
  summary_hi: यह प्रकरण प्रणव (ॐ) और उसके घटकों के महत्व को समझाता है। ध्वनि 'अ' ब्रह्मा,
    सृष्टिकर्ता का प्रतिनिधित्व करती है; 'उ' विष्णु, पालनकर्ता का प्रतिनिधित्व करता
    है; और 'म' शिव, संहारक का प्रतिनिधित्व करता है। ये सभी मिलकर पूरे ब्रह्मांड और
    परम ब्रह्म का प्रतीक हैं।
- id: creation-of-brahma-from-golden-egg
  type: story
  keywords:
  - creation
  - brahma
  - golden-egg
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The passage describes the creation of Brahma from a golden egg that
    was split into two by the force of Maheshwara. The upper half of the egg became
    the sky, while the lower half became the earth. From this egg, Brahma, known as
    'Ka', was born as the creator of all worlds.
  summary_hi: इस अंश में ब्रह्मा की उत्पत्ति का वर्णन है, जो महेश्वर के आघात से दो
    भागों में विभाजित हुए एक सुवर्णमय अंडे से हुई। अंडे का ऊपरी भाग आकाश बन गया, जबकि
    निचला भाग पृथ्वी बन गया। इस अंडे से 'क' नामक ब्रह्मा का जन्म हुआ, जो सभी लोकों
    के स्रष्टा हैं।
- id: manifestation-of-maheshwara
  type: story
  keywords:
  - maheshwara
  - manifestation
  - divine-form
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Vishnu, along with another being, witnessed the manifestation of Maheshwara
    in a divine form with five faces and ten arms. This form was adorned with various
    ornaments and shone with the brilliance of camphor, leaving Vishnu feeling fulfilled.
  summary_hi: विष्णु ने एक अन्य व्यक्ति के साथ महेश्वर के दिव्य रूप का दर्शन किया,
    जिसमें पाँच मुख और दस भुजाएँ थीं। यह रूप विभिन्न आभूषणों से सुसज्जित था और कपूर
    की भाँति चमक रहा था, जिससे विष्णु को संतोष प्राप्त हुआ।
- id: symbolism-of-om-in-maheshwara
  type: concept
  keywords:
  - om
  - maheshwara
  - symbolism
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The passage explains the symbolism of the sacred syllable 'Om' in relation
    to Maheshwara. The components of 'Om' are associated with different parts of Maheshwara's
    divine form, illustrating the profound connection between the sound and the deity.
  summary_hi: इस अंश में महेश्वर के संदर्भ में पवित्र अक्षर 'ॐ' के प्रतीकवाद का वर्णन
    है। 'ॐ' के घटक महेश्वर के दिव्य रूप के विभिन्न अंगों से जुड़े हैं, जो ध्वनि और
    देवता के बीच गहरे संबंध को दर्शाते हैं।
- id: shiva-appearance-with-uma
  type: event
  keywords:
  - Shiva
  - Uma
  - appearance
  source:
    book: Shiv Puran
    sarga: Chapter 9
  summary_en: Lord Shiva, pleased by the praises of Lord Vishnu, appears with Goddess
    Uma. He is described as having five faces, each with three eyes, and adorned with
    a crescent moon on his forehead and ashes on his body.
  summary_hi: भगवान शिव, भगवान विष्णु की स्तुति से प्रसन्न होकर, देवी उमा के साथ प्रकट
    होते हैं। उनका वर्णन पाँच मुखों के साथ किया गया है, प्रत्येक में तीन नेत्र हैं,
    और उनके मस्तक पर चंद्रमा का मुकुट और शरीर पर भस्म लगा हुआ है।
- id: shiva-teaches-vedas-to-vishnu
  type: story
  keywords:
  - Shiva
  - Vishnu
  - Vedas
  source:
    book: Shiv Puran
    sarga: Chapter 9
  summary_en: Lord Shiva, pleased with Lord Vishnu, imparts the knowledge of the Vedas
    to him in the form of breath. This signifies the transmission of sacred knowledge
    from Shiva to Vishnu.
  summary_hi: भगवान शिव, भगवान विष्णु से प्रसन्न होकर, उन्हें श्वास के रूप में वेदों
    का ज्ञान प्रदान करते हैं। यह शिव से विष्णु को पवित्र ज्ञान के संचार का प्रतीक
    है।
- id: shiva-instructs-on-linga-worship
  type: practice
  keywords:
  - Shiva
  - Linga
  - worship
  source:
    book: Shiv Puran
    sarga: Chapter 9
  summary_en: Lord Shiva instructs that his Linga form should always be worshipped
    and meditated upon. He assures that worshipping the Linga will grant various desired
    results and alleviate sorrows.
  summary_hi: भगवान शिव निर्देश देते हैं कि उनके लिंग रूप की हमेशा पूजा और ध्यान किया
    जाना चाहिए। वे आश्वासन देते हैं कि लिंग की पूजा करने से विभिन्न इच्छित फल प्राप्त
    होंगे और दुखों का नाश होगा।
- id: shiva-vishnu-brahma-origin
  type: story
  keywords:
  - Shiva
  - Vishnu
  - Brahma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In this episode, Shiva explains to Vishnu and Brahma that they both
    emerged from his own form. Brahma was born from Shiva's right side, while Vishnu
    emerged from his left. Shiva grants them boons and instructs them on their cosmic
    duties, with Brahma tasked with creation and Vishnu with preservation.
  summary_hi: इस प्रकरण में, शिव विष्णु और ब्रह्मा को बताते हैं कि वे दोनों उनके स्वरूप
    से प्रकट हुए हैं। ब्रह्मा शिव के दाहिने पार्श्व से उत्पन्न हुए, जबकि विष्णु बाएँ
    पार्श्व से प्रकट हुए। शिव उन्हें वरदान देते हैं और उनके ब्रह्मा को सृष्टि और विष्णु
    को पालन का कार्य सौंपते हैं।
- id: shiva-as-trimurti
  type: concept
  keywords:
  - Shiva
  - Trimurti
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Shiva describes himself as the embodiment of the Trimurti, taking the
    forms of Brahma, Vishnu, and Rudra for creation, preservation, and destruction.
    Despite these forms, he remains the singular, unchanging supreme being.
  summary_hi: शिव स्वयं को त्रिमूर्ति के रूप में वर्णित करते हैं, जो सृष्टि, पालन
    और संहार के लिए ब्रह्मा, विष्णु और रुद्र के रूप धारण करते हैं। इन रूपों के बावजूद,
    वे एकल, अपरिवर्तनीय परमात्मा बने रहते हैं।
- id: shiva-vishnu-equality-concept
  type: concept
  keywords:
  - shiva
  - vishnu
  - equality
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In this passage, Shiva declares that Vishnu and he are essentially the
    same, with no difference between them. Shiva explains that Vishnu emerged from
    his left side, Brahma from his right, and Rudra from his heart. This illustrates
    the concept of the Trimurti, where Shiva, Vishnu, and Brahma are different aspects
    of the same divine entity.
  summary_hi: इस अंश में शिव यह घोषणा करते हैं कि विष्णु और वे मूलतः समान हैं, उनके
    बीच कोई अंतर नहीं है। शिव बताते हैं कि विष्णु उनके बाएँ अंग से, ब्रह्मा दाहिने
    से, और रुद्र उनके हृदय से प्रकट हुए हैं। यह त्रिमूर्ति की अवधारणा को दर्शाता है,
    जहाँ शिव, विष्णु और ब्रह्मा एक ही दिव्य सत्ता के विभिन्न रूप हैं।
- id: shiva-granting-boon-to-vishnu
  type: event
  keywords:
  - shiva
  - vishnu
  - boon
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Shiva grants a boon to Vishnu, declaring that Vishnu will be a liberator
    for all beings and that seeing Vishnu will yield the same spiritual benefits as
    seeing Shiva. This event emphasizes the unity and mutual respect between the deities
    and highlights Vishnu's role in the cosmic order.
  summary_hi: शिव विष्णु को वरदान देते हैं, यह घोषणा करते हुए कि विष्णु सभी प्राणियों
    के लिए मुक्तिदाता होंगे और विष्णु के दर्शन से वही आध्यात्मिक लाभ मिलेगा जो शिव
    के दर्शन से मिलता है। यह घटना देवताओं के बीच एकता और पारस्परिक सम्मान को दर्शाती
    है और ब्रह्मांडीय व्यवस्था में विष्णु की भूमिका को उजागर करती है।
- id: trimurti-roles-explanation
  type: concept
  keywords:
  - trimurti
  - creation
  - preservation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: 'The passage explains the roles of the Trimurti: Brahma is responsible
    for creation, Vishnu for preservation, and Rudra for destruction. Shiva, being
    beyond these qualities, is the ultimate reality. This explanation provides insight
    into the Hindu understanding of cosmic functions and the interconnectedness of
    these deities.'
  summary_hi: 'इस अंश में त्रिमूर्ति की भूमिकाओं की व्याख्या की गई है: ब्रह्मा सृष्टि
    के लिए, विष्णु पालन के लिए, और रुद्र संहार के लिए जिम्मेदार हैं। शिव, जो इन गुणों
    से परे हैं, परम वास्तविकता हैं। यह व्याख्या हिंदू धर्म में ब्रह्मांडीय कार्यों
    की समझ और इन देवताओं की परस्पर संबंधिता को स्पष्ट करती है।'
- id: shiva-vishnu-unity-concept
  type: concept
  keywords:
  - Shiva
  - Vishnu
  source:
    book: Shiv Puran
    sarga: '10'
  summary_en: In this passage, Lord Shiva explains to Vishnu that despite their different
    forms and roles, they are essentially one and the same. This unity is a fundamental
    truth, and any distinction between them is illusory. Devotees who understand this
    unity will find liberation, while those who create divisions will face downfall.
  summary_hi: इस अंश में, भगवान शिव विष्णु को समझाते हैं कि भिन्न रूपों और भूमिकाओं
    के बावजूद, वे मूल रूप से एक ही हैं। यह एक मौलिक सत्य है, और उनके बीच कोई भी भेद
    भ्रमात्मक है। जो भक्त इस एकता को समझते हैं, उन्हें मुक्ति प्राप्त होगी, जबकि जो
    विभाजन करते हैं, उन्हें पतन का सामना करना पड़ेगा।
- id: shiva-instructs-vishnu
  type: story
  keywords:
  - Shiva
  - Vishnu
  - instruction
  source:
    book: Shiv Puran
    sarga: '10'
  summary_en: Lord Shiva instructs Vishnu to take various avatars to protect the world
    and to be ready to assist in overcoming any difficulties that arise. Shiva promises
    to aid Vishnu in defeating formidable enemies and emphasizes the importance of
    their cooperation for the welfare of the universe.
  summary_hi: भगवान शिव विष्णु को विभिन्न अवतार लेने का निर्देश देते हैं ताकि वे संसार
    की रक्षा कर सकें और उत्पन्न होने वाली किसी भी कठिनाई को दूर करने के लिए तैयार
    रहें। शिव विष्णु को दुर्जेय शत्रुओं को पराजित करने में सहायता करने का वचन देते
    हैं और ब्रह्मांड के कल्याण के लिए उनके सहयोग के महत्व पर जोर देते हैं।
- id: shiva-vishnu-dialogue
  type: story
  keywords:
  - shiva
  - vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In a conversation between Shiva and Vishnu, Vishnu expresses his devotion
    to Shiva, promising to follow his commands and keep him as the sole focus of his
    meditation. Shiva, pleased with Vishnu's words, forgives any of Vishnu's past
    faults and blesses him.
  summary_hi: शिव और विष्णु के बीच संवाद में, विष्णु अपनी भक्ति व्यक्त करते हैं और
    शिव की आज्ञा का पालन करने का वचन देते हैं। शिव, विष्णु के शब्दों से प्रसन्न होकर,
    उनके किसी भी पिछले दोष को क्षमा करते हैं और उन्हें आशीर्वाद देते हैं।
- id: origin-of-linga-worship
  type: concept
  keywords:
  - linga
  - worship
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The practice of Linga worship is established as a result of Shiva's
    blessing. The Linga is described as the embodiment of Maheshwara, and its worship
    is said to grant both worldly pleasures and liberation.
  summary_hi: लिंग पूजा की प्रथा शिव के आशीर्वाद के परिणामस्वरूप स्थापित होती है।
    लिंग को महेश्वर का स्वरूप बताया गया है, और इसकी पूजा से भोग और मोक्ष दोनों की
    प्राप्ति होती है।
- id: shiva-linga-worship-importance
  type: concept
  keywords:
  - Shiva
  - Linga
  - Worship
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The passage emphasizes the importance of worshiping Lord Shiva's Linga
    form. It states that those who are devoted to Shiva and regularly worship the
    Linga are free from suffering and achieve success in their endeavors. The text
    highlights that worshiping Shiva leads to the fulfillment of desires and spiritual
    liberation.
  summary_hi: इस अंश में भगवान शिव के लिंग रूप की पूजा के महत्व को बताया गया है। यह
    कहा गया है कि जो लोग शिव के प्रति समर्पित हैं और नियमित रूप से लिंग की पूजा करते
    हैं, वे दुखों से मुक्त होते हैं और अपने कार्यों में सफलता प्राप्त करते हैं। यह
    पाठ बताता है कि शिव की पूजा से इच्छाओं की पूर्ति और आध्यात्मिक मुक्ति प्राप्त
    होती है।
- id: vishwakarma-creates-shiva-lingas
  type: event
  keywords:
  - Vishwakarma
  - Shiva Linga
  - Creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In this episode, Lord Vishnu instructs Vishwakarma to create various
    Shiva Lingas for the gods. Vishwakarma, following the orders of Brahma and Vishnu,
    crafts different types of Lingas and distributes them among the deities, facilitating
    their worship of Lord Shiva for the fulfillment of their desires.
  summary_hi: इस घटना में, भगवान विष्णु विश्वकर्मा को विभिन्न देवताओं के लिए शिव लिंग
    बनाने का निर्देश देते हैं। ब्रह्मा और विष्णु के आदेशों का पालन करते हुए, विश्वकर्मा
    विभिन्न प्रकार के लिंगों का निर्माण करते हैं और उन्हें देवताओं के बीच वितरित करते
    हैं, जिससे वे भगवान शिव की पूजा कर सकें और अपनी इच्छाओं की पूर्ति कर सकें।
- id: creation-of-the-universe
  type: story
  keywords:
  - creation
  - universe
  - brahma
  - vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Mahadeva became hidden, Brahma, following Shiva's command, began
    contemplating creation. Vishnu, after paying respects to Sadashiva, instructed
    Brahma and then disappeared. Brahma, with the desire to create, remembered Shiva
    and Vishnu, and from the previously created water, an egg containing twenty-four
    elements emerged, which later became conscious after Vishnu entered it.
  summary_hi: महादेव के अंतर्धान होने के बाद, ब्रह्मा ने शिव की आज्ञा का पालन करते
    हुए सृष्टि की रचना पर ध्यान केंद्रित किया। विष्णु ने सदाशिव को प्रणाम कर ब्रह्मा
    को उपदेश दिया और फिर अदृश्य हो गए। सृष्टि की इच्छा से ब्रह्मा ने शिव और विष्णु
    का स्मरण किया, और पहले से रचे गए जल से चौबीस तत्वों वाला एक अंड प्रकट हुआ, जो
    विष्णु के उसमें प्रवेश करने के बाद सचेतन हो गया।
- id: varaha-kalpa
  type: concept
  keywords:
  - varaha
  - kalpa
  - vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The Varaha Kalpa began when Vishnu assumed the form of a boar. This
    event marked the start of a new cosmic cycle, as desired by Maheshwara, who wished
    for the forms of a swan and a boar to be taken amidst a dispute.
  summary_hi: जब विष्णु ने वाराह का रूप धारण किया, तब वाराह कल्प की शुरुआत हुई। यह
    घटना एक नए ब्रह्मांडीय चक्र की शुरुआत का संकेत देती है, जैसा कि महेश्वर की इच्छा
    थी, जिन्होंने विवाद के बीच हंस और वाराह के रूप धारण करने की इच्छा व्यक्त की थी।
- id: creation-of-the-universe-by-vishnu
  type: story
  keywords:
  - creation
  - universe
  - vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Vishnu, following the command of Shiva, enters the
    cosmic egg (Anda) and brings consciousness to it. This act marks the beginning
    of creation, with Vishnu taking a form with a thousand heads, eyes, and feet,
    spreading across the universe.
  summary_hi: इस प्रकरण में, विष्णु, शिव के आदेश का पालन करते हुए, ब्रह्मांडीय अंड
    (अंडा) में प्रवेश करते हैं और उसमें चेतना लाते हैं। यह सृष्टि की शुरुआत का संकेत
    है, जिसमें विष्णु हजार सिर, आंखें और पैर वाले रूप में प्रकट होते हैं और पूरे ब्रह्मांड
    में फैल जाते हैं।
- id: five-types-of-creation
  type: concept
  keywords:
  - creation
  - types
  - brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The passage describes the five types of creation initiated by Brahma
    under the guidance of Shiva. These include the sinful creation, the immobile creation,
    the animal creation, the divine creation, and the human creation, each with its
    unique characteristics and purpose.
  summary_hi: यह अंश शिव के मार्गदर्शन में ब्रह्मा द्वारा आरंभ की गई पांच प्रकार की
    सृष्टियों का वर्णन करता है। इनमें पापपूर्ण सृष्टि, स्थावर सृष्टि, तिर्यक सृष्टि,
    देव सृष्टि और मानव सृष्टि शामिल हैं, जिनमें प्रत्येक की अपनी विशेषताएँ और उद्देश्य
    हैं।
- id: nine-creations-including-kaumara
  type: concept
  keywords:
  - creation
  - kaumara
  - brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The text outlines nine types of creations, including the Kaumara creation,
    which is both natural and modified. These creations are part of the cosmic order
    established by Brahma and include various forms and stages of existence.
  summary_hi: पाठ में नौ प्रकार की सृष्टियों का वर्णन किया गया है, जिसमें कौमार सृष्टि
    भी शामिल है, जो प्राकृतिक और संशोधित दोनों है। ये सृष्टियाँ ब्रह्मा द्वारा स्थापित
    ब्रह्मांडीय व्यवस्था का हिस्सा हैं और विभिन्न रूपों और अस्तित्व के चरणों को शामिल
    करती हैं।
- id: birth-of-sanaka-and-others
  type: story
  keywords:
  - sanaka
  - brahma
  - creation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Brahma creates Sanaka and his brothers as his mind-born sons, who are
    endowed with great dispassion and wisdom. Despite Brahma's instructions, they
    remain detached from worldly creation and focus solely on meditating upon Shiva.
  summary_hi: ब्रह्मा ने सनक और उनके भाइयों को अपने मानस पुत्रों के रूप में उत्पन्न
    किया, जो महान वैराग्य और ज्ञान से संपन्न थे। ब्रह्मा के निर्देशों के बावजूद, वे
    सांसारिक सृष्टि से अलग रहते हैं और केवल शिव की ध्यान साधना में लीन रहते हैं।
- id: ardhanaarishvara-manifestation
  type: story
  keywords:
  - ardhanaarishvara
  - shiva
  - creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: In the Shiv Puran, Lord Shiva manifests as Ardhanarishvara, a form that
    is half male and half female, symbolizing the union of Shiva and Shakti. This
    form is a representation of the complete and all-encompassing nature of the divine.
  summary_hi: शिव पुराण में, भगवान शिव अर्धनारीश्वर के रूप में प्रकट होते हैं, जो
    आधा पुरुष और आधा महिला है, जो शिव और शक्ति के मिलन का प्रतीक है। यह रूप दिव्य
    के पूर्ण और सर्वव्यापी स्वभाव का प्रतिनिधित्व करता है।
- id: creation-of-rudras
  type: story
  keywords:
  - rudra
  - creation
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Upon Brahma's request, Lord Shiva creates multiple Rudras, beings similar
    to himself, to assist in the process of creation. These Rudras are manifestations
    of Shiva's power and play a crucial role in the cosmic order.
  summary_hi: ब्रह्मा के अनुरोध पर, भगवान शिव कई रुद्रों की सृष्टि करते हैं, जो उनके
    समान हैं, ताकि सृष्टि की प्रक्रिया में सहायता कर सकें। ये रुद्र शिव की शक्ति के
    अभिव्यक्ति हैं और ब्रह्मांडीय व्यवस्था में महत्वपूर्ण भूमिका निभाते हैं।
- id: refusal-of-sanaka-kumaras
  type: story
  keywords:
  - sanaka
  - kumaras
  - creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The Sanaka Kumaras, mind-born sons of Brahma, refuse to engage in the
    act of creation despite Brahma's command. They are deeply engrossed in meditation
    and devotion to Lord Shiva, choosing spiritual pursuits over worldly duties.
  summary_hi: सनक कुमार, जो ब्रह्मा के मानस पुत्र हैं, ब्रह्मा के आदेश के बावजूद सृष्टि
    के कार्य में संलग्न होने से इनकार कर देते हैं। वे भगवान शिव की ध्यान और भक्ति
    में गहराई से लीन हैं, और सांसारिक कर्तव्यों के बजाय आध्यात्मिक साधनाओं को चुनते
    हैं।
- id: brahma-seeks-vishnus-guidance
  type: story
  keywords:
  - brahma
  - vishnu
  - guidance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Brahma, frustrated by the refusal of the Sanaka Kumaras, seeks guidance
    from Lord Vishnu. Vishnu advises Brahma to perform penance to please Lord Shiva,
    who can aid in the creation process.
  summary_hi: सनक कुमारों के इनकार से निराश ब्रह्मा, भगवान विष्णु से मार्गदर्शन प्राप्त
    करते हैं। विष्णु ब्रह्मा को भगवान शिव को प्रसन्न करने के लिए तप करने की सलाह देते
    हैं, जो सृष्टि प्रक्रिया में सहायता कर सकते हैं।
- id: shiva-refuses-to-create
  type: story
  keywords:
  - shiva
  - creation
  - compassion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Lord Shiva, approached by Brahma to create beings subject to birth and
    death, refuses to do so. He expresses his compassion by stating that he will instead
    provide knowledge to liberate beings from the cycle of suffering.
  summary_hi: भगवान शिव, जिन्हें ब्रह्मा द्वारा जन्म और मृत्यु के अधीन प्राणियों की
    सृष्टि करने के लिए कहा जाता है, ऐसा करने से इनकार करते हैं। वह अपनी करुणा व्यक्त
    करते हुए कहते हैं कि वह इसके बजाय प्राणियों को दुख के चक्र से मुक्त करने के लिए
    ज्ञान प्रदान करेंगे।
- id: creation-of-elements-and-sages
  type: story
  keywords:
  - creation
  - elements
  - sages
  source:
    book: Shiv Puran
    sarga: '16'
  summary_en: Brahma describes the creation of the five gross elements from subtle
    elements and the subsequent creation of mountains, oceans, trees, and time cycles.
    He also creates various sages from different parts of his body, including Marichi,
    Bhrigu, Angira, Pulaha, Pulastya, and Vasistha.
  summary_hi: ब्रह्मा ने सूक्ष्म तत्वों से पंच महाभूतों की सृष्टि की और पर्वतों, समुद्रों,
    वृक्षों और काल चक्रों की रचना की। उन्होंने अपने शरीर के विभिन्न अंगों से मरीचि,
    भृगु, अंगिरा, पुलह, पुलस्त्य और वसिष्ठ जैसे विभिन्न ऋषियों की सृष्टि की।
- id: creation-of-dharma-and-sadhakas
  type: story
  keywords:
  - dharma
  - sadhakas
  source:
    book: Shiv Puran
    sarga: '16'
  summary_en: Brahma, unsatisfied with his initial creations, meditates on Lord Shiva
    and creates the concept of Dharma and various sadhakas (practitioners) to propagate
    it. Dharma, born from Brahma's will, takes a human form and is further propagated
    by the sadhakas.
  summary_hi: ब्रह्मा, अपनी प्रारंभिक सृष्टि से असंतुष्ट होकर, भगवान शिव का ध्यान
    करते हैं और धर्म की अवधारणा और विभिन्न साधकों की सृष्टि करते हैं। संकल्प से उत्पन्न
    धर्म मानव रूप धारण करता है और साधकों द्वारा आगे बढ़ाया जाता है।
- id: creation-of-manu-and-shatarupa
  type: story
  keywords:
  - manu
  - shatarupa
  source:
    book: Shiv Puran
    sarga: '16'
  summary_en: Brahma divides his body into two, creating a male and a female. The
    male becomes the famous Svayambhuva Manu, and the female becomes Shatarupa. They
    marry and begin the process of procreation, leading to the birth of their children,
    including Priyavrata and Uttanapada.
  summary_hi: ब्रह्मा अपने शरीर को दो भागों में विभाजित करते हैं, जिससे एक पुरुष और
    एक स्त्री की सृष्टि होती है। पुरुष प्रसिद्ध स्वायम्भुव मनु बनता है और स्त्री शतरूपा
    कहलाती है। वे विवाह करते हैं और प्रजनन की प्रक्रिया शुरू करते हैं, जिससे उनके
    बच्चों का जन्म होता है, जिनमें प्रियव्रत और उत्तानपाद शामिल हैं।
- id: marriage-and-progeny-of-manu-and-shatarupa
  type: story
  keywords:
  - marriage
  - progeny
  source:
    book: Shiv Puran
    sarga: '16'
  summary_en: Manu and Shatarupa marry and have two sons, Priyavrata and Uttanapada,
    and three daughters, Akuti, Devahuti, and Prasuti. Akuti is married to Ruchi,
    Devahuti to Kardama, and Prasuti to Daksha. Their progeny populate the universe.
  summary_hi: मनु और शतरूपा का विवाह होता है और उनके दो पुत्र, प्रियव्रत और उत्तानपाद,
    और तीन पुत्रियाँ, आकूति, देवहूति, और प्रसूति होती हैं। आकूति का विवाह रुचि से,
    देवहूति का कर्दम से, और प्रसूति का दक्ष से होता है। उनकी संतानों से सारा ब्रह्मांड
    भर जाता है।
- id: birth-of-yajna-and-dakshina
  type: story
  keywords:
  - yajna
  - dakshina
  source:
    book: Shiv Puran
    sarga: '16'
  summary_en: From the union of Ruchi and Akuti, Yajna and Dakshina are born. Yajna
    and Dakshina have twelve sons, who further contribute to the cosmic order.
  summary_hi: रुचि और आकूति के मिलन से यज्ञ और दक्षिणा का जन्म होता है। यज्ञ और दक्षिणा
    के बारह पुत्र होते हैं, जो ब्रह्मांडीय व्यवस्था में योगदान करते हैं।
- id: daksha-daughters-marriage
  type: event
  keywords:
  - Daksha
  - marriage
  - daughters
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 14
  summary_en: Daksha Prajapati, following the advice of Brahma, married off his sixty
    daughters to various sages and deities. Ten daughters were given to Dharma, thirteen
    to Kashyapa, twenty-seven to Chandra, and others to Angiras, Krishashva, and Tarkshya.
    This event led to the proliferation of various beings across the universe.
  summary_hi: दक्ष प्रजापति ने ब्रह्मा की सलाह पर अपनी साठ कन्याओं का विवाह विभिन्न
    ऋषियों और देवताओं के साथ किया। दस कन्याएँ धर्म को, तेरह कश्यप को, सत्ताईस चंद्रमा
    को, और अन्य अंगिरा, कृशाश्व और तक्षक को दी गईं। इस घटना से ब्रह्मांड में विभिन्न
    प्राणियों का प्रसार हुआ।
- id: sati-birth-and-deeds
  type: story
  keywords:
  - Sati
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati, born to Daksha, was created by Shiva for the welfare of the world.
    She performed many divine acts for the upliftment of devotees. Eventually, she
    married Shiva, but later immolated herself at Daksha's sacrifice due to disrespect.
  summary_hi: सती, दक्ष की पुत्री, शिव द्वारा विश्व के कल्याण के लिए प्रकट की गई थीं।
    उन्होंने भक्तों के उद्धार के लिए कई दिव्य कार्य किए। अंततः उन्होंने शिव से विवाह
    किया, लेकिन बाद में दक्ष के यज्ञ में अपमान के कारण आत्मदाह कर लिया।
- id: parvati-rebirth-and-marriage
  type: story
  keywords:
  - Parvati
  - Shiva
  - rebirth
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Sati's self-immolation, she was reborn as Parvati, the daughter
    of the Himalayas, due to the prayers of the gods. Parvati performed intense penance
    and eventually reunited with Shiva through marriage.
  summary_hi: सती के आत्मदाह के बाद, वह पर्वतों की पुत्री पार्वती के रूप में पुनर्जन्मी
    हुईं, देवताओं की प्रार्थना के कारण। पार्वती ने कठोर तप किया और अंततः शिव से विवाह
    कर पुनः मिलन किया।
- id: sati-sacrifice-and-rebirth
  type: story
  keywords:
  - Sati
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati, the daughter of Daksha, sacrifices herself due to her father's
    disrespect towards her husband, Shiva. This causes Shiva great sorrow. The gods
    request Sati to be reborn and reunite with Shiva to fulfill their desires and
    bring happiness to the universe.
  summary_hi: सती, दक्ष की पुत्री, अपने पिता द्वारा अपने पति शिव के प्रति अनादर के
    कारण आत्म-त्याग करती हैं। इससे शिव को अत्यधिक दुःख होता है। देवता सती से पुनर्जन्म
    लेकर शिव के साथ पुनर्मिलन करने का अनुरोध करते हैं ताकि उनके मनोरथ पूर्ण हों और
    ब्रह्मांड में सुख आए।
- id: shiva-and-kubera-friendship
  type: story
  keywords:
  - Shiva
  - Kubera
  - Kailasa
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, First Khand, Chapter 17
  summary_en: Narada inquires about the time when Lord Shiva went to Mount Kailasa
    and formed a friendship with Kubera. Brahma narrates the events leading to this
    friendship.
  summary_hi: नारद भगवान शिव के कैलास पर्वत पर जाने और कुबेर के साथ मित्रता करने के
    समय के बारे में पूछते हैं। ब्रह्मा इस मित्रता की घटनाओं का वर्णन करते हैं।
- id: gunanidhi-transformation-story
  type: story
  keywords:
  - gunanidhi
  - transformation
  - shiva-devotion
  source:
    book: Shiv Puran
    sarga: Sadrasa Samhita, Chapter 17
  summary_en: Gunanidhi, a Brahmin's son, is disowned by his father due to his misdeeds.
    He wanders aimlessly, lamenting his fate and lack of skills or wealth. Eventually,
    he encounters a group of Shiva devotees and, driven by hunger, decides to steal
    offerings from a Shiva temple. This act sets the stage for his transformation
    and redemption through devotion to Shiva.
  summary_hi: गुणनिधि, एक ब्राह्मण का पुत्र, अपने दुष्कर्मों के कारण अपने पिता द्वारा
    त्याग दिया जाता है। वह अपने भाग्य और कौशल या धन की कमी पर विलाप करते हुए भटकता
    है। अंततः, वह शिव भक्तों के एक समूह से मिलता है और भूख से प्रेरित होकर शिव मंदिर
    से प्रसाद चुराने का निर्णय लेता है। यह कार्य शिव की भक्ति के माध्यम से उसके परिवर्तन
    और मोक्ष की शुरुआत करता है।
- id: yajnadatta-son-episode
  type: story
  keywords:
  - Yajnadatta
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khand
  summary_en: The son of Yajnadatta, a Brahmin, finds himself hungry and without food.
    He enters a Shiva temple during Shivaratri and sees a grand offering made by a
    devotee. Driven by hunger, he takes the food offering meant for Shiva. As he tries
    to leave, he is caught and killed by the city guards. However, Shiva's attendants
    intervene, declaring that the Brahmin's sins are absolved due to Shiva's grace,
    and they take him to a divine abode.
  summary_hi: यज्ञदत्त का पुत्र, एक ब्राह्मण, भूखा और बिना भोजन के होता है। वह शिवरात्रि
    के दौरान एक शिव मंदिर में प्रवेश करता है और एक भक्त द्वारा की गई भव्य पूजा देखता
    है। भूख से प्रेरित होकर, वह शिव के लिए बने भोजन को ले लेता है। बाहर निकलने की
    कोशिश करते समय, उसे नगर के रक्षकों द्वारा पकड़ा और मार दिया जाता है। हालांकि,
    शिव के गण हस्तक्षेप करते हैं, यह घोषणा करते हुए कि ब्राह्मण के पाप शिव की कृपा
    से समाप्त हो गए हैं, और वे उसे एक दिव्य स्थान पर ले जाते हैं।
- id: yagnyadatta-son-deeds
  type: story
  keywords:
  - yagnyadatta
  - shiva-devotee
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: The son of Yagnyadatta performed several virtuous acts in devotion to
    Lord Shiva. He removed the shadow falling on a Shiva Lingam by tearing his garment
    to make a wick for a lamp, ensuring it stayed lit throughout the night. He also
    listened to and chanted Shiva's names and observed the worship of Shiva with great
    dedication.
  summary_hi: यज्ञदत्त के पुत्र ने भगवान शिव की भक्ति में कई पुण्य कार्य किए। उसने
    शिवलिंग पर पड़ रही छाया को हटाने के लिए अपने वस्त्र को फाड़कर दीपक की बाती बनाई
    और रात भर दीपक को जलाए रखा। उसने शिव के नामों को सुना और उनका उच्चारण किया तथा
    शिव की पूजा को बड़ी श्रद्धा से देखा।
- id: yamadutas-return
  type: event
  keywords:
  - yamadutas
  - shiva-parshads
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: After hearing from Shiva's attendants about the virtuous deeds of Yagnyadatta's
    son, the Yamadutas returned to their realm. They were instructed by Dharma Raja
    to leave those who bear the marks of Shiva, such as wearing sacred ash or Rudraksha,
    and not bring them to Yama's abode.
  summary_hi: शिव के पार्षदों से यज्ञदत्त के पुत्र के पुण्य कार्यों के बारे में सुनने
    के बाद, यमदूत अपने लोक को लौट गए। धर्मराज ने उन्हें आदेश दिया कि जो लोग शिव के
    चिह्न धारण करते हैं, जैसे कि विभूति या रुद्राक्ष, उन्हें छोड़ दें और यमलोक में
    न लाएं।
- id: yamadutas-release-brahmin
  type: story
  keywords:
  - yamadutas
  - brahmin
  - shiva
  source:
    book: Shiv Puran
    sarga: '18'
  summary_en: Yamraj instructs his servants to release a Brahmin who had taken the
    guise of Shiva out of deceit. The Brahmin is freed by Shiva's attendants and taken
    to Shiva's abode, where he enjoys divine pleasures and serves Shiva and Parvati.
  summary_hi: यमराज अपने सेवकों को आदेश देते हैं कि वे एक ब्राह्मण को छोड़ दें जिसने
    छल से शिव का वेश धारण किया था। शिव के पार्षद उस ब्राह्मण को मुक्त कर देते हैं
    और उसे शिवलोक ले जाते हैं, जहाँ वह दिव्य सुखों का उपभोग करता है और शिव और पार्वती
    की सेवा करता है।
- id: king-dama-and-lamp-offering
  type: story
  keywords:
  - king-dama
  - lamp-offering
  - shiva
  source:
    book: Shiv Puran
    sarga: '18'
  summary_en: King Dama, devoted to Shiva, orders that lamps be lit in all Shiva temples.
    He warns that any village head who disobeys will be punished. His dedication to
    this practice leads to his rebirth as Kubera, the king of Alakapuri, due to the
    merit gained from lighting lamps for Shiva.
  summary_hi: राजा दम, जो शिव के प्रति समर्पित थे, आदेश देते हैं कि सभी शिवालयों में
    दीप जलाए जाएं। वह चेतावनी देते हैं कि जो ग्राम प्रमुख इस आदेश का पालन नहीं करेगा,
    उसे दंडित किया जाएगा। इस धर्माचरण के कारण, वह अगले जन्म में अलकापुरी के राजा कुबेर
    के रूप में पुनर्जन्म लेते हैं, जो शिव के लिए दीप जलाने के पुण्य के कारण होता है।
- id: kubera-creation-story
  type: story
  keywords:
  - Kubera
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khand
  summary_en: A Brahmin named Yajnadatta, envious of Parvati's beauty, is punished
    by losing sight in one eye. Shiva reveals that Yajnadatta is Parvati's son and
    grants him the boon to become Kubera, the lord of wealth and king of Yakshas and
    Kinnaras. Parvati blesses him with eternal devotion to Shiva.
  summary_hi: यज्ञदत्त नामक एक ब्राह्मण, पार्वती की सुंदरता से ईर्ष्या करता है और
    उसकी एक आँख की दृष्टि खो देता है। शिव प्रकट करते हैं कि यज्ञदत्त पार्वती का पुत्र
    है और उसे कुबेर बनने का वरदान देते हैं, जो धन के स्वामी और यक्षों और किन्नरों
    के राजा होंगे। पार्वती उसे शिव के प्रति अनंत भक्ति का आशीर्वाद देती हैं।
- id: kubera-shiva-friendship
  type: story
  keywords:
  - Kubera
  - Shiva
  - Kailasa
  source:
    book: Shiva Purana
    sarga: Rudra Samhita, First Khand, Chapter 19
  summary_en: Kubera, the god of wealth, becomes a friend of Lord Shiva. Kubera's
    city, Alakapuri, is near Mount Kailasa, which becomes the abode of Shiva. This
    chapter describes the friendship between Kubera and Shiva.
  summary_hi: कुबेर, जो धन के देवता हैं, भगवान शिव के मित्र बन जाते हैं। कुबेर की
    नगरी अलकापुरी कैलास पर्वत के पास है, जो शिव का निवास स्थान बन जाता है। इस अध्याय
    में कुबेर और शिव की मित्रता का वर्णन है।
- id: shiva-journey-to-kailasa
  type: event
  keywords:
  - Shiva
  - Kailasa
  - Journey
  source:
    book: Shiva Purana
    sarga: Rudra Samhita, First Khand, Chapter 20
  summary_en: Lord Shiva decides to go to Mount Kailasa, the abode of the Guhyakas,
    in the form of Rudra. He plays his drum, the sound of which spreads across the
    three worlds, inviting all beings to gather. Gods, sages, and other divine beings
    come to witness Shiva's journey.
  summary_hi: भगवान शिव रुद्र के रूप में गुह्यकों के निवास स्थान कैलास पर्वत पर जाने
    का निर्णय लेते हैं। वे अपने डमरू को बजाते हैं, जिसकी ध्वनि तीनों लोकों में फैल
    जाती है और सभी प्राणियों को एकत्र होने के लिए आमंत्रित करती है। देवता, ऋषि और
    अन्य दिव्य प्राणी शिव की यात्रा को देखने के लिए आते हैं।
- id: shiva-kailasa-visit
  type: event
  keywords:
  - Shiva
  - Kailasa
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: Lord Shiva, pleased by the prayers of Vishnu, grants a boon to Kubera
    and then proceeds to Mount Kailasa. There, he is joyfully welcomed by the gods,
    sages, and celestial beings who perform his abhisheka and offer gifts. The event
    is marked by a grand celebration with music and dance by apsaras.
  summary_hi: भगवान शिव, विष्णु की प्रार्थना से प्रसन्न होकर कुबेर को वरदान देते हैं
    और फिर कैलास पर्वत की ओर प्रस्थान करते हैं। वहाँ उनका स्वागत देवताओं, ऋषियों और
    अप्सराओं द्वारा अभिषेक और उपहारों के साथ किया जाता है। यह घटना संगीत और नृत्य
    के साथ एक भव्य उत्सव के रूप में मनाई जाती है।
- id: shiva-boon-to-gods
  type: event
  keywords:
  - Shiva
  - Boon
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Srishti Khanda
  summary_en: After being praised by the gods, Lord Shiva, in a pleased state, grants
    them their desired boons. He then advises Vishnu and Brahma to return to their
    respective abodes, assuring them of his constant support and protection.
  summary_hi: देवताओं द्वारा स्तुति किए जाने के बाद, भगवान शिव प्रसन्न होकर उन्हें
    मनोवांछित वरदान देते हैं। वह विष्णु और ब्रह्मा को उनके स्थानों पर लौटने की सलाह
    देते हैं और उन्हें अपने निरंतर समर्थन और संरक्षण का आश्वासन देते हैं।
- id: shiva-kubera-friendship
  type: story
  keywords:
  - shiva
  - kubera
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, First Khand, Chapter 20
  summary_en: Shiva forms a friendship with Kubera, the god of wealth. Pleased with
    Kubera's devotion, Shiva assures him of his support and sends him back to his
    abode with blessings.
  summary_hi: शिव, धन के देवता कुबेर के साथ मित्रता स्थापित करते हैं। कुबेर की भक्ति
    से प्रसन्न होकर, शिव उन्हें अपने समर्थन का आश्वासन देते हैं और आशीर्वाद के साथ
    उन्हें उनके निवास स्थान पर वापस भेजते हैं।
- id: shiva-kailasa-episode
  type: story
  keywords:
  - shiva
  - kailasa
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, First Khand, Chapter 20
  summary_en: Lord Shiva, after granting boons to Brahma and Vishnu, resides on Mount
    Kailasa. He engages in meditation and various divine activities with his attendants.
    Eventually, he marries Sati, the daughter of Daksha, and enjoys a blissful life
    with her.
  summary_hi: भगवान शिव, ब्रह्मा और विष्णु को वरदान देने के बाद, कैलास पर्वत पर निवास
    करते हैं। वे ध्यान और अपने गणों के साथ विभिन्न दिव्य गतिविधियों में संलग्न रहते
    हैं। अंततः, वे दक्ष की पुत्री सती से विवाह करते हैं और उनके साथ सुखमय जीवन व्यतीत
    करते हैं।
- id: shiva-marriage-to-sati
  type: story
  keywords:
  - Shiva
  - Sati
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The passage describes how Shiva, pleased by Vishnu's prayers, married
    Sati, the daughter of Daksha. Sati was later reborn as Parvati, the daughter of
    the Himalayas, and through her devotion, she became Shiva's consort again.
  summary_hi: इस अंश में बताया गया है कि विष्णु की प्रार्थना से प्रसन्न होकर शिव ने
    दक्ष की पुत्री सती से विवाह किया। सती बाद में हिमालय की पुत्री पार्वती के रूप
    में पुनर्जन्म लेकर अपनी भक्ति के माध्यम से फिर से शिव की पत्नी बनीं।
- id: daksha-insults-shiva
  type: event
  keywords:
  - daksha
  - shiva
  source:
    book: Shiv Puran
    sarga: '2'
  summary_en: Daksha, in his arrogance, insults Lord Shiva by questioning his importance
    in the yajna. He claims that with Vishnu and Brahma present, there is no need
    for Shiva, whom he considers unworthy and associated with inauspicious beings.
  summary_hi: दक्ष अपने अहंकार में भगवान शिव का अपमान करते हैं और यज्ञ में उनकी महत्ता
    पर सवाल उठाते हैं। वह दावा करते हैं कि विष्णु और ब्रह्मा की उपस्थिति में शिव की
    कोई आवश्यकता नहीं है, जिन्हें वह अयोग्य और अमंगलकारी प्राणियों से जुड़ा मानते
    हैं।
- id: sati-self-immolation
  type: story
  keywords:
  - Sati
  - Daksha
  - Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 4
  summary_en: Sati, the daughter of Daksha, immolates herself after witnessing the
    disrespect shown to her husband, Lord Shiva, at Daksha's Yajna. This event leads
    to Shiva's deep sorrow and his wandering in grief.
  summary_hi: सती, दक्ष की पुत्री, अपने पति भगवान शिव के प्रति यज्ञ में हुए अपमान
    को देखकर आत्मदाह कर लेती हैं। इस घटना से शिव अत्यंत दुखी हो जाते हैं और शोक में
    भटकने लगते हैं।
- id: birth-of-veerabhadra
  type: story
  keywords:
  - Veerabhadra
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: In a fit of rage, Lord Shiva plucks a lock of his hair and throws it
    onto a mountain, resulting in the birth of the fierce warrior Veerabhadra. Veerabhadra
    is described as having a thousand arms and being as terrifying as the fire of
    destruction.
  summary_hi: भगवान शिव ने क्रोध में आकर अपनी जटा का एक भाग उखाड़कर पर्वत पर फेंक
    दिया, जिससे भयंकर योद्धा वीरभद्र का जन्म हुआ। वीरभद्र को हजार भुजाओं वाला और प्रलय
    की अग्नि के समान भयंकर बताया गया है।
- id: destruction-of-daksha-yajna
  type: event
  keywords:
  - daksha-yajna
  - veerabhadra
  - destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Veerabhadra, along with Shiva's ganas, descends upon Daksha's yajna,
    causing havoc and destruction. He defeats the gods, including Vishnu, and beheads
    Daksha, offering his head into the sacrificial fire.
  summary_hi: वीरभद्र शिव के गणों के साथ दक्ष के यज्ञ पर आक्रमण करते हैं, जिससे वहां
    हाहाकार और विनाश होता है। वह देवताओं, जिसमें विष्णु भी शामिल हैं, को पराजित करते
    हैं और दक्ष का सिर काटकर यज्ञ की अग्नि में अर्पित कर देते हैं।
- id: sati-rebirth-as-parvati
  type: story
  keywords:
  - Sati
  - Parvati
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Sati's self-immolation at her father's yajna, she was reborn as
    Parvati, the daughter of the Himalayas. Parvati was destined to become the wife
    of Lord Shiva, continuing the divine relationship from her previous life.
  summary_hi: अपने पिता के यज्ञ में सती के आत्मदाह के बाद, वह हिमालय की पुत्री पार्वती
    के रूप में पुनर्जन्म लेती हैं। पार्वती भगवान शिव की पत्नी बनने के लिए नियत थीं,
    जो उनके पिछले जीवन के दिव्य संबंध को जारी रखता है।
- id: shiva-revives-daksha
  type: event
  keywords:
  - Shiva
  - Daksha
  - Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Lord Shiva, showing his compassion, revives Daksha Prajapati and allows
    him to complete his Yajna. All the gods, including Vishnu, are pleased and worship
    Rudra with devotion.
  summary_hi: भगवान शिव ने अपनी कृपालुता दिखाते हुए दक्ष प्रजापति को पुनर्जीवित किया
    और उन्हें यज्ञ पूरा करने की अनुमति दी। विष्णु सहित सभी देवता प्रसन्न होकर रुद्र
    की भक्ति के साथ पूजा करते हैं।
- id: jvalamukhi-origin
  type: concept
  keywords:
  - Jvalamukhi
  - Sacred Fire
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: The fire that emerged from Sati's body fell on a mountain and became
    known as Jvalamukhi. It is revered and believed to fulfill desires and destroy
    sins.
  summary_hi: सती के शरीर से उत्पन्न अग्नि एक पर्वत पर गिरी और ज्वालामुखी के नाम से
    प्रसिद्ध हुई। इसे पूजनीय माना जाता है और यह इच्छाओं को पूर्ण करने और पापों का
    नाश करने वाली मानी जाती है।
- id: creation-of-trinity
  type: story
  keywords:
  - Trinity
  - Brahma
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: From the formless and attribute-less Shiva, the trinity of Brahma, Vishnu,
    and Rudra emerged. Brahma became the creator, Vishnu the preserver, and Rudra
    the destroyer.
  summary_hi: निर्गुण और निराकार शिव से ब्रह्मा, विष्णु और रुद्र की त्रिमूर्ति प्रकट
    हुई। ब्रह्मा सृष्टिकर्ता, विष्णु पालनकर्ता और रुद्र संहारक बने।
- id: creation-of-sandhya
  type: story
  keywords:
  - Sandhya
  - Brahma
  - creation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Brahma, after creating his mind-born sons like Marichi, Atri, and others,
    also created a beautiful maiden named Sandhya from his mind. She became known
    as the goddess of twilight, enchanting the minds of sages with her beauty.
  summary_hi: ब्रह्मा ने मरीचि, अत्रि आदि अपने मानस पुत्रों की सृष्टि के बाद अपने
    मन से एक सुंदर कन्या सन्ध्या की रचना की। वह संध्या के रूप में प्रसिद्ध हुई और
    अपनी सुंदरता से मुनियों के मन को मोहित करने वाली थी।
- id: emergence-of-kama
  type: story
  keywords:
  - Kama
  - Brahma
  - creation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: While Brahma was contemplating the creation of Sandhya, a wondrous and
    charming mind-born being named Kama emerged. He was adorned with golden features
    and carried a bow made of flowers, captivating the minds of Brahma's sons.
  summary_hi: जब ब्रह्मा सन्ध्या की सृष्टि पर विचार कर रहे थे, तब एक अद्भुत और मनोहर
    मानस पुरुष काम का प्रकट हुआ। वह स्वर्णिम विशेषताओं से सुसज्जित था और पुष्पों से
    बने धनुष को धारण किए हुए था, जिससे ब्रह्मा के पुत्रों के मन मोहित हो गए।
- id: kama-birth-story
  type: story
  keywords:
  - Kama
  - Brahma
  - creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 2
  summary_en: In this episode, a divine being with a radiant appearance approaches
    Brahma and seeks guidance on his role in the universe. Brahma instructs him to
    use his form and five flower arrows to enchant all beings and create the eternal
    world. This being is identified as Kama, the god of love, who will influence all
    creatures, including deities like Shiva and Vishnu.
  summary_hi: इस प्रकरण में, एक दिव्य पुरुष अपनी तेजस्वी आकृति के साथ ब्रह्मा के पास
    आता है और ब्रह्मांड में अपनी भूमिका के बारे में मार्गदर्शन चाहता है। ब्रह्मा उसे
    अपने स्वरूप और पाँच पुष्प बाणों का उपयोग करके सभी प्राणियों को मोहित करने और सनातन
    सृष्टि की रचना करने का निर्देश देते हैं। यह पुरुष कामदेव के रूप में पहचाना जाता
    है, जो शिव और विष्णु जैसे देवताओं सहित सभी प्राणियों को प्रभावित करेगा।
- id: kamadeva-names-and-boons
  type: story
  keywords:
  - Kamadeva
  - names
  - boons
  source:
    book: Shiv Puran
    sarga: अथ तृतीयोऽध्यायः
  summary_en: Kamadeva receives various names and boons. The sages, knowing Brahma's
    intentions, name him Manmatha, Kama, Madana, and Kandarpa, each reflecting his
    qualities and influence. He is promised a beautiful wife by Daksha, and a girl
    named Sandhya, born from Brahma's mind, is introduced.
  summary_hi: कामदेव को विभिन्न नाम और वर प्राप्त होते हैं। मुनिगण, ब्रह्मा के अभिप्राय
    को जानकर, उन्हें मन्मथ, काम, मदन और कंदर्प नाम देते हैं, जो उनके गुणों और प्रभाव
    को दर्शाते हैं। दक्ष द्वारा उन्हें एक सुंदर पत्नी का वचन दिया जाता है, और ब्रह्मा
    के मन से उत्पन्न हुई एक कन्या संध्या का परिचय दिया जाता है।
- id: kamadeva-brahma-and-sages-bewilderment
  type: story
  keywords:
  - Kamadeva
  - Brahma
  - sages
  source:
    book: Shiv Puran
    sarga: अथ तृतीयोऽध्यायः
  summary_en: Kamadeva, with his five flower arrows, decides to bewilder the sages
    and Brahma. He uses his powers to enchant them, causing them to become infatuated
    with Sandhya. This episode highlights Kamadeva's influence and the power of desire.
  summary_hi: कामदेव अपने पाँच पुष्प-बाणों के साथ मुनियों और ब्रह्मा को मोहित करने
    का निर्णय लेते हैं। वह अपनी शक्तियों का उपयोग करके उन्हें संध्या के प्रति मोहित
    कर देते हैं। यह प्रकरण कामदेव के प्रभाव और कामना की शक्ति को दर्शाता है।
- id: kama-deva-bewitches-brahma
  type: story
  keywords:
  - Kama Deva
  - Brahma
  - desire
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Kama Deva, the god of love, uses his flower arrows to enchant Brahma
    and his mind-born sons, causing them to be overcome with desire. This leads to
    a state where everyone is captivated by the beauty of Sandhya, a manifestation
    of twilight.
  summary_hi: कामदेव, प्रेम के देवता, अपने पुष्प बाणों का उपयोग करके ब्रह्मा और उनके
    मानस पुत्रों को मोहित कर देते हैं, जिससे वे कामविकार से ग्रस्त हो जाते हैं। इससे
    सभी संध्या की सुंदरता से मोहित हो जाते हैं।
- id: dharma-prays-to-shiva
  type: story
  keywords:
  - Dharma
  - Shiva
  - protection
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Seeing the state of his father Brahma and brothers, Dharma prays to
    Lord Shiva for protection. He praises Shiva as the preserver of dharma and the
    one who transcends the three gunas, seeking his intervention to restore order.
  summary_hi: अपने पिता ब्रह्मा और भाइयों की दशा देखकर धर्म भगवान शिव से रक्षा के
    लिए प्रार्थना करते हैं। वे शिव की स्तुति करते हैं, जो धर्म के रक्षक और तीनों गुणों
    से परे हैं, और उनसे व्यवस्था बहाल करने की प्रार्थना करते हैं।
- id: rati-birth-story
  type: story
  keywords:
  - Rati
  - Daksha
  source:
    book: Shiv Puran
    sarga: Chapter 3
  summary_en: From the sweat of Daksha's body, a beautiful woman named Rati was born.
    She had a delicate and charming appearance, with a face as radiant as the full
    moon. Rati was known to captivate even the minds of sages.
  summary_hi: दक्ष के शरीर से निकले पसीने से रति नामक एक सुंदर स्त्री का जन्म हुआ।
    उसका स्वरूप कोमल और आकर्षक था, और उसका मुख पूर्ण चंद्रमा के समान दीप्तिमान था।
    रति मुनियों के मन को भी मोहित करने वाली थी।
- id: kama-curse-episode
  type: story
  keywords:
  - Kama
  - Brahma
  - Curse
  source:
    book: Shiv Puran
    sarga: Chapter 3
  summary_en: Brahma, angered by Kama's actions, cursed him to be burned by Shiva's
    third eye. This curse was pronounced in front of the assembled sages and ancestors,
    causing Kama to become fearful and abandon his arrows.
  summary_hi: ब्रह्मा ने काम के कार्यों से क्रोधित होकर उसे शिव की तीसरी आँख से भस्म
    होने का शाप दिया। यह शाप पितरों और मुनियों के सामने दिया गया, जिससे काम भयभीत
    होकर अपने बाणों को त्याग दिया।
- id: kama-curse-and-blessing
  type: story
  keywords:
  - Kama
  - Brahma
  - curse
  - blessing
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 3
  summary_en: Brahma curses Kama for targeting him with his arrows, but later relents
    and blesses him. Kama is told that he will be incinerated by Shiva's third eye
    but will regain his body when Shiva marries.
  summary_hi: ब्रह्मा कामदेव को अपने बाणों से लक्ष्य बनाने के लिए शाप देते हैं, लेकिन
    बाद में उन्हें आशीर्वाद देते हैं। कामदेव को बताया जाता है कि वह शिव की तीसरी आंख
    से भस्म हो जाएगा, लेकिन शिव के विवाह के समय उसे पुनः शरीर प्राप्त होगा।
- id: marriage-of-kama-and-rati
  type: story
  keywords:
  - Kama
  - Rati
  - marriage
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 4
  summary_en: Daksha offers his daughter Rati to Kama in marriage. Rati, born from
    Daksha's sweat, is described as beautiful and virtuous, and she becomes Kama's
    wife.
  summary_hi: दक्ष अपनी पुत्री रति का विवाह कामदेव से करते हैं। रति, जो दक्ष के पसीने
    से उत्पन्न हुई थी, सुंदर और गुणवान बताई जाती है और कामदेव की पत्नी बनती है।
- id: kama-rati-marriage
  type: event
  keywords:
  - Kama
  - Rati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 4
  summary_en: The passage describes the marriage of Kama (the god of love) and Rati.
    Kama, enchanted by Rati's beauty, accepts her with great joy, similar to how Lord
    Narayana accepted Goddess Lakshmi. The event brings immense happiness to all,
    including Daksha, Rati's father.
  summary_hi: यह अंश कामदेव और रति के विवाह का वर्णन करता है। कामदेव, रति की सुंदरता
    से मोहित होकर, उसे बड़ी प्रसन्नता से स्वीकार करते हैं, जैसे भगवान नारायण ने देवी
    लक्ष्मी को स्वीकार किया था। इस घटना से सभी को अत्यधिक खुशी मिलती है, जिसमें दक्ष,
    रति के पिता भी शामिल हैं।
- id: sandhya-arundhati-transformation
  type: story
  keywords:
  - Sandhya
  - Arundhati
  - transformation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 5
  summary_en: The passage narrates the story of Sandhya, a daughter of Brahma, who
    after performing penance, transforms into Arundhati. This transformation is significant
    as it highlights the virtues and the path of devotion leading to a higher state
    of being.
  summary_hi: यह अंश ब्रह्मा की पुत्री संध्या की कहानी का वर्णन करता है, जो तपस्या
    करने के बाद अरुंधती में परिवर्तित हो जाती है। यह परिवर्तन महत्वपूर्ण है क्योंकि
    यह गुणों और भक्ति के मार्ग को उच्चतर अवस्था की ओर ले जाने को दर्शाता है।
- id: sandhya-tapasya-and-rebirth
  type: story
  keywords:
  - Sandhya
  - tapasya
  - rebirth
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sandhya, the daughter of Brahma, performed intense tapasya to atone
    for the desires she felt due to Kama's influence. She decided to end her life
    in fire as a form of penance and to establish a moral boundary for beings not
    to be born with desires. After her sacrifice, she was reborn as the daughter of
    sage Medhatithi.
  summary_hi: संध्या, जो ब्रह्मा की पुत्री थीं, ने कामदेव के प्रभाव से उत्पन्न इच्छाओं
    के प्रायश्चित्त के लिए कठोर तप किया। उन्होंने अग्नि में आत्मदाह करने का निर्णय
    लिया ताकि प्रायश्चित्त हो सके और यह सुनिश्चित किया जा सके कि प्राणियों का जन्म
    इच्छाओं के साथ न हो। उनके बलिदान के बाद, उनका पुनर्जन्म ऋषि मेधातिथि की पुत्री
    के रूप में हुआ।
- id: sandhya-penance-story
  type: story
  keywords:
  - Sandhya
  - penance
  - purification
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Sandhya, feeling guilty for her impure thoughts towards her father and
    brothers, decides to purify herself through penance. She resolves to establish
    a moral boundary for beings on earth and intends to perform severe penance on
    the Chandra Bhaga mountain. Brahma instructs Vasistha to guide her in her penance.
  summary_hi: संध्या, अपने पिता और भाइयों के प्रति अपने अशुद्ध विचारों के लिए दोषी
    महसूस करती हैं और तपस्या के माध्यम से खुद को शुद्ध करने का निर्णय लेती हैं। वह
    पृथ्वी पर प्राणियों के लिए एक नैतिक सीमा स्थापित करने का संकल्प लेती हैं और चंद्रभाग
    पर्वत पर कठोर तपस्या करने का इरादा रखती हैं। ब्रह्मा वसिष्ठ को उनकी तपस्या में
    मार्गदर्शन करने का निर्देश देते हैं।
- id: sandhya-tapasya-episode
  type: story
  keywords:
  - Sandhya
  - Vasistha
  - Tapasya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Sandhya, the daughter of Brahma, arrives at a secluded mountain to perform
    penance. She encounters Sage Vasistha and expresses her desire to undertake tapasya.
    Vasistha advises her to meditate on Shambhu (Shiva) and provides guidance on performing
    the penance.
  summary_hi: संध्या, जो ब्रह्मा की पुत्री हैं, तपस्या करने के लिए एक निर्जन पर्वत
    पर आती हैं। वहाँ उनकी भेंट वसिष्ठ जी से होती है और वे अपनी तपस्या की इच्छा व्यक्त
    करती हैं। वसिष्ठ जी उन्हें शम्भु (शिव) का ध्यान करने की सलाह देते हैं और तपस्या
    करने की विधि बताते हैं।
- id: sandhya-tapasya-story
  type: story
  keywords:
  - Sandhya
  - Tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 5
  summary_en: The story describes how Sandhya, following the instructions of sage
    Vasistha, undertakes a rigorous tapasya (penance) by the river Bhrallohita. She
    performs the penance with great devotion, focusing her mind on Lord Shiva. After
    a long period, Shiva, pleased with her dedication, appears before her and grants
    her divine knowledge, speech, and vision.
  summary_hi: यह कहानी बताती है कि कैसे संध्या, वसिष्ठ मुनि के निर्देशों का पालन करते
    हुए, बृहल्लोहित नदी के किनारे कठोर तपस्या करती है। वह शिवजी पर मन लगाकर बड़ी भक्ति
    से तपस्या करती है। लंबे समय के बाद, शिवजी उसकी भक्ति से प्रसन्न होकर उसके सामने
    प्रकट होते हैं और उसे दिव्य ज्ञान, वाणी और दृष्टि प्रदान करते हैं।
- id: sandhya-boon-from-shiva
  type: story
  keywords:
  - Sandhya
  - Shiva
  - boon
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sandhya performs intense penance and praises Lord Shiva, who is pleased
    with her devotion. Shiva grants her several boons, including that no being will
    be born with immediate desires, and that any man who looks at her with lust will
    lose his masculinity. Additionally, her husband will be a great, virtuous, and
    long-lived sage.
  summary_hi: संध्या ने भगवान शिव की आराधना की और उनकी तपस्या से प्रसन्न होकर शिव
    ने उन्हें कई वरदान दिए। इनमें यह शामिल था कि कोई भी प्राणी तुरंत कामना के साथ
    उत्पन्न नहीं होगा, और जो पुरुष उन्हें कामुक दृष्टि से देखेगा, वह अपनी मर्दानगी
    खो देगा। इसके अलावा, उनका पति एक महान, पुण्यात्मा और दीर्घायु ऋषि होगा।
- id: sandhya-sacrifice-and-rebirth
  type: story
  keywords:
  - Sandhya
  - sacrifice
  - rebirth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 6
  summary_en: Sandhya is instructed to sacrifice herself in the fire of a grand yajna
    conducted by sage Medhatithi. By doing so, she will be reborn as his daughter.
    This act is part of a divine plan to fulfill her desires and to eventually marry
    a worthy husband.
  summary_hi: सन्ध्या को महर्षि मेधातिथि द्वारा आयोजित एक महान यज्ञ की अग्नि में आत्मसमर्पण
    करने का निर्देश दिया जाता है। ऐसा करने से वह उनकी पुत्री के रूप में पुनर्जन्म
    लेगी। यह कार्य उनके इच्छाओं को पूरा करने और अंततः एक योग्य पति से विवाह करने की
    दिव्य योजना का हिस्सा है।
- id: daksha-daughters-and-chandra-curse
  type: story
  keywords:
  - Daksha
  - Chandra
  - curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 6
  summary_en: Daksha's daughters, including 27 who were married to Chandra, faced
    neglect as Chandra favored Rohini. Angered by this, Daksha cursed Chandra. To
    alleviate the curse, the Chandrabhaga river was created, and Medhatithi was present
    at its inception.
  summary_hi: दक्ष की पुत्रियाँ, जिनमें से 27 का विवाह चन्द्रमा से हुआ था, उपेक्षित
    हुईं क्योंकि चन्द्रमा रोहिणी को अधिक पसंद करता था। इससे क्रोधित होकर दक्ष ने चन्द्रमा
    को शाप दिया। इस शाप को दूर करने के लिए चन्द्रभागा नदी का निर्माण किया गया, और
    मेधातिथि इसके निर्माण के समय उपस्थित थे।
- id: sandhya-tapasya-and-divine-vision
  type: story
  keywords:
  - Sandhya
  - tapasya
  - divine vision
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 6
  summary_en: Sandhya performs intense penance on a mountain for four yugas. During
    this time, she does not notice the gods, including Brahma, who visit her because
    she is absorbed in meditation. Eventually, she receives a divine vision and guidance.
  summary_hi: सन्ध्या चार युगों तक एक पर्वत पर घोर तपस्या करती हैं। इस दौरान, वह ब्रह्मा
    सहित देवताओं को नहीं देखतीं, जो उनसे मिलने आते हैं, क्योंकि वह ध्यान में लीन होती
    हैं। अंततः, उन्हें एक दिव्य दर्शन और मार्गदर्शन प्राप्त होता है।
- id: sandhya-sacrifice-story
  type: story
  keywords:
  - Sandhya
  - sacrifice
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Sandhya, the daughter of Brahma, performed a sacrifice by entering the
    sacrificial fire unnoticed by the sages. Her body was consumed by the fire, and
    by Shiva's command, the ashes were purified and entered the solar orb. The upper
    part of her body became the morning twilight, while the remaining part became
    the evening twilight, pleasing to the ancestors.
  summary_hi: संध्या, जो ब्रह्मा की पुत्री थी, ने एक यज्ञ में प्रवेश कर अपनी आहुति
    दी, जिसे मुनियों ने नहीं देखा। उसका शरीर अग्नि द्वारा भस्म हो गया और शिव की आज्ञा
    से उसकी राख को शुद्ध कर सूर्य मंडल में प्रवेश कराया गया। उसके शरीर का ऊपरी भाग
    प्रातः संध्या बना और शेष भाग सायं संध्या बना, जो पितरों को प्रसन्न करता है।
- id: arundhati-birth-story
  type: story
  keywords:
  - Arundhati
  - birth
  - Medhatithi
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: During the conclusion of Medhatithi's sacrifice, a radiant girl emerged
    from the sacrificial fire. The sage joyfully accepted her, named her Arundhati,
    and raised her in his hermitage. She became known for her unwavering devotion
    to her husband and was later married to the sage Vashistha.
  summary_hi: मेधातिथि के यज्ञ के समापन पर, यज्ञ अग्नि से एक तेजस्वी कन्या प्रकट हुई।
    मुनि ने प्रसन्नतापूर्वक उसे स्वीकार किया, उसका नाम अरुन्धती रखा और अपने आश्रम
    में उसका पालन-पोषण किया। वह अपने पातिव्रत्य धर्म के लिए प्रसिद्ध हुई और बाद में
    मुनि वशिष्ठ से उसका विवाह हुआ।
- id: arundhati-vasistha-marriage
  type: event
  keywords:
  - Arundhati
  - Vasistha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 7
  summary_en: The marriage of Arundhati and Vasistha was a grand event that brought
    joy to all the gods and sages. From the water spilled by Brahma, Vishnu, and Mahesh,
    seven sacred rivers including Shipra were created.
  summary_hi: अरुन्धती और वसिष्ठ का विवाह एक भव्य उत्सव था जिसने सभी देवताओं और ऋषियों
    को प्रसन्न किया। ब्रह्मा, विष्णु और महेश के हाथ से गिरे जल से शिप्रा सहित सात
    पवित्र नदियों का निर्माण हुआ।
- id: brahma-urges-kamadeva-to-bewitch-shiva
  type: story
  keywords:
  - Brahma
  - Kamadeva
  - Shiva
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Brahma, troubled by Shiva's disdain for worldly desires, urges Kamadeva
    to bewitch Shiva so that he may take a wife. Brahma believes that if Shiva accepts
    a wife, it will alleviate his own distress. Despite the challenge, Brahma encourages
    Kamadeva to use his powers to sway Shiva's mind.
  summary_hi: ब्रह्मा, जो शिव के सांसारिक इच्छाओं के प्रति उदासीनता से परेशान हैं,
    कामदेव से शिव को मोहित करने का आग्रह करते हैं ताकि वे पत्नी स्वीकार करें। ब्रह्मा
    का मानना है कि यदि शिव पत्नी स्वीकार करते हैं, तो यह उनके अपने कष्ट को दूर करेगा।
    चुनौती के बावजूद, ब्रह्मा कामदेव को शिव के मन को प्रभावित करने के लिए अपनी शक्तियों
    का उपयोग करने के लिए प्रोत्साहित करते हैं।
- id: creation-of-vasanta
  type: story
  keywords:
  - Vasanta
  - Kamadeva
  - Brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Brahma creates Vasanta, the embodiment of spring, from
    his breath while contemplating how to enchant Shiva. Vasanta is described as having
    the beauty of a red lotus and is adorned with flowers. He becomes a companion
    to Kamadeva, aiding him in his mission to enchant Shiva.
  summary_hi: इस प्रकरण में, ब्रह्मा शिव को मोहित करने के उपाय के रूप में अपने श्वास
    से वसंत का सृजन करते हैं। वसंत को लाल कमल के समान सुंदर और फूलों से सुसज्जित बताया
    गया है। वह कामदेव का साथी बनता है और शिव को मोहित करने के उनके मिशन में सहायता
    करता है।
- id: kamadeva-seeks-help
  type: story
  keywords:
  - Kamadeva
  - Shiva
  - Brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Kamadeva approaches Brahma seeking assistance to enchant Shiva. He requests
    Brahma to create a suitable woman who can aid in his mission. Brahma, deep in
    thought, inadvertently creates Vasanta, who becomes Kamadeva's ally.
  summary_hi: कामदेव ब्रह्मा के पास जाकर शिव को मोहित करने के लिए सहायता मांगते हैं।
    वह ब्रह्मा से अनुरोध करते हैं कि वह एक उपयुक्त स्त्री का निर्माण करें जो उनके
    मिशन में सहायता कर सके। विचारमग्न ब्रह्मा अनजाने में वसंत का सृजन करते हैं, जो
    कामदेव का सहयोगी बनता है।
- id: vasanta-naming-story
  type: story
  keywords:
  - vasanta
  - spring
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 8
  summary_en: The passage describes how the season of spring, Vasanta, is named and
    its role as a companion to Kama, the god of love. Vasanta is tasked with bringing
    joy to the world and following Kama's lead.
  summary_hi: इस अंश में वसन्त ऋतु का नामकरण और कामदेव के साथी के रूप में उसकी भूमिका
    का वर्णन किया गया है। वसन्त का कार्य संसार में आनंद लाना और कामदेव का अनुसरण करना
    है।
- id: kama-fails-to-bewitch-shiva
  type: story
  keywords:
  - Kama
  - Shiva
  - Brahma
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Sati Khand
  summary_en: Brahma instructs Kama, along with Rati and Vasanta, to attempt to enchant
    Shiva so that he may take a wife. Despite their efforts, Shiva remains unaffected
    due to his deep meditation and previous merits. Kama fears being incinerated by
    Shiva's wrath but is reassured by Brahma's words. Ultimately, Kama returns to
    Brahma, unsuccessful and humbled.
  summary_hi: ब्रह्मा काम, रति और वसंत को शिव को मोहित करने के लिए भेजते हैं ताकि
    वे विवाह कर सकें। उनके प्रयासों के बावजूद, शिव अपनी गहरी ध्यानावस्था और पूर्वजन्म
    के पुण्यों के कारण अप्रभावित रहते हैं। काम को डर है कि शिव के क्रोध से उसका शरीर
    भस्म हो जाएगा, लेकिन ब्रह्मा के आश्वासन से वह शांत होता है। अंततः, काम ब्रह्मा
    के पास लौटता है, असफल और विनम्र।
- id: shiva-immovable-by-kama
  type: story
  keywords:
  - Shiva
  - Kama
  - meditation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In an attempt to disturb Shiva's meditation, Kama, the god of love,
    uses his flower arrows and the enchanting atmosphere of spring to captivate Shiva.
    Despite these efforts, Shiva remains unaffected and continues his meditation,
    demonstrating his supreme control over desires.
  summary_hi: कामदेव ने शिवजी की ध्यानावस्था को भंग करने के लिए अपने पुष्पबाणों और
    वसंत के मोहक वातावरण का उपयोग किया। इन प्रयासों के बावजूद, शिवजी अप्रभावित रहे
    और अपने ध्यान में लीन रहे, जिससे उनकी इच्छाओं पर सर्वोच्च नियंत्रण का प्रदर्शन
    हुआ।
- id: brahma-seeks-vishnus-help
  type: story
  keywords:
  - Brahma
  - Vishnu
  - Rudra
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Satikhanda)
  summary_en: Brahma, after failing to enchant Shiva with the help of Kama and other
    deities, seeks the assistance of Vishnu. Vishnu appears before Brahma and inquires
    about his distress. Brahma explains the situation and requests Vishnu's help to
    alleviate his troubles.
  summary_hi: ब्रह्मा, काम और अन्य देवताओं की सहायता से शिव को मोहित करने में असफल
    होने के बाद, विष्णु की सहायता मांगते हैं। विष्णु ब्रह्मा के सामने प्रकट होते हैं
    और उनके दुःख के बारे में पूछते हैं। ब्रह्मा स्थिति को समझाते हैं और विष्णु से
    अपनी परेशानियों को दूर करने की प्रार्थना करते हैं।
- id: brahma-misunderstanding-shiva
  type: story
  keywords:
  - Brahma
  - Shiva
  - misunderstanding
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: In the beginning of creation, Brahma, influenced by Maya, becomes infatuated
    with his own daughter and is rebuked by Shiva for his actions. Brahma feels insulted
    and seeks Vishnu's counsel, who advises him to recognize Shiva's true nature and
    to worship him for his own welfare.
  summary_hi: सृष्टि के प्रारम्भ में, ब्रह्मा माया से प्रभावित होकर अपनी ही पुत्री
    पर मोहित हो जाते हैं और शिव द्वारा उनके इस कृत्य के लिए निंदा की जाती है। ब्रह्मा
    अपमानित महसूस करते हैं और विष्णु से सलाह लेते हैं, जो उन्हें शिव के वास्तविक स्वरूप
    को पहचानने और अपने कल्याण के लिए उनकी पूजा करने की सलाह देते हैं।
- id: shiva-marriage-prophecy
  type: story
  keywords:
  - shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: The passage describes a prophecy about Shiva's marriage. It is suggested
    that if Shiva takes a human form, he will marry a certain daughter. Brahma is
    advised to instruct Daksha to perform penance to produce a suitable wife for Shiva.
  summary_hi: इस अंश में शिव के विवाह के बारे में एक भविष्यवाणी का वर्णन है। यह सुझाव
    दिया गया है कि यदि शिव मानव रूप धारण करते हैं, तो वे एक विशेष कन्या से विवाह करेंगे।
    ब्रह्मा को दक्ष को यह निर्देश देने की सलाह दी जाती है कि वे शिव के लिए उपयुक्त
    पत्नी उत्पन्न करने के लिए तप करें।
- id: shiva-and-vishnu-discussion
  type: story
  keywords:
  - shiva
  - vishnu
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: Vishnu reminds Brahma of the time when Shiva, in his formless state,
    created both Vishnu and Brahma. Shiva then instructed them on their respective
    roles in creation and preservation. This discussion highlights the divine roles
    and the interconnectedness of the deities.
  summary_hi: विष्णु ब्रह्मा को उस समय की याद दिलाते हैं जब निराकार शिव ने विष्णु
    और ब्रह्मा दोनों को उत्पन्न किया था। शिव ने उन्हें सृष्टि और संरक्षण में उनके
    संबंधित भूमिकाओं के बारे में निर्देश दिया। यह चर्चा देवताओं की दिव्य भूमिकाओं
    और उनकी परस्पर संबंधिता को उजागर करती है।
- id: rudra-incarnation
  type: story
  keywords:
  - rudra
  - incarnation
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: Shiva declares that his supreme form will manifest as Rudra, who will
    be known in the world by that name. Rudra will be worshipped and will fulfill
    all tasks, acting as the dissolver of the universe and the master of all qualities.
  summary_hi: शिव घोषणा करते हैं कि उनका परम रूप रुद्र के रूप में प्रकट होगा, जो इस
    नाम से संसार में जाना जाएगा। रुद्र की पूजा की जाएगी और वह सभी कार्यों को पूरा
    करेंगे, ब्रह्मांड के संहारक और सभी गुणों के अधिपति के रूप में कार्य करेंगे।
- id: divine-trinity-and-their-consorts
  type: concept
  keywords:
  - trinity
  - consorts
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: The passage explains the divine trinity of Brahma, Vishnu, and Shiva,
    and their respective consorts. Lakshmi is the consort of Vishnu, Saraswati of
    Brahma, and Sati of Shiva. This highlights the roles and relationships of the
    divine couples in Hindu mythology.
  summary_hi: इस अंश में ब्रह्मा, विष्णु और शिव की दिव्य त्रिमूर्ति और उनकी संबंधित
    पत्नियों का वर्णन है। लक्ष्मी विष्णु की पत्नी हैं, सरस्वती ब्रह्मा की पत्नी हैं,
    और सती शिव की पत्नी हैं। यह हिंदू पौराणिक कथाओं में दिव्य युगलों की भूमिकाओं और
    संबंधों को उजागर करता है।
- id: shiva-marriage-discussion
  type: story
  keywords:
  - Shiva
  - marriage
  - deities
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The deities, led by Brahma and Vishnu, approach Lord Shiva to request
    him to marry Parvati. They express their eagerness to witness the marriage and
    remind Shiva of his promise to Rati. Shiva, however, explains his reluctance towards
    marriage, describing it as a binding and difficult commitment, especially highlighting
    the challenges of attachment.
  summary_hi: देवताओं ने ब्रह्मा और विष्णु के नेतृत्व में भगवान शिव से पार्वती से
    विवाह करने का अनुरोध किया। वे विवाह देखने की अपनी उत्सुकता व्यक्त करते हैं और
    शिव को रति को दिए गए वचन की याद दिलाते हैं। शिव विवाह के प्रति अपनी अनिच्छा व्यक्त
    करते हैं, इसे एक बंधन और कठिन प्रतिबद्धता बताते हैं, विशेष रूप से लगाव की चुनौतियों
    को उजागर करते हुए।
- id: brahma-praises-durga
  type: story
  keywords:
  - Brahma
  - Durga
  - praise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 11
  summary_en: After Vishnu's departure, Brahma praises Goddess Durga, who is the embodiment
    of knowledge and ignorance, purity, and the sustainer of the universe. Durga,
    described as having a radiant form with divine attributes, appears before Brahma
    as he offers his respects and prayers.
  summary_hi: विष्णु के प्रस्थान के बाद, ब्रह्मा देवी दुर्गा की स्तुति करते हैं, जो
    ज्ञान और अज्ञान, पवित्रता और ब्रह्मांड की धारक हैं। दुर्गा, जो दिव्य गुणों के
    साथ एक तेजस्वी रूप धारण करती हैं, ब्रह्मा के सामने प्रकट होती हैं जब वे अपनी श्रद्धा
    और प्रार्थना अर्पित करते हैं।
- id: brahma-requests-sati-to-bewitch-shiva
  type: story
  keywords:
  - Brahma
  - Sati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Brahma approaches Goddess Sati and requests her to enchant Shiva, who
    is in deep meditation on Mount Kailash. Brahma explains that Shiva, absorbed in
    his ascetic practices, is indifferent to worldly desires and needs to be drawn
    towards a consort. Sati is asked to incarnate as the daughter of Daksha and use
    her divine form to captivate Shiva, thus becoming his wife.
  summary_hi: ब्रह्मा देवी सती के पास जाते हैं और उनसे शिव को मोहित करने का अनुरोध
    करते हैं, जो कैलाश पर्वत पर गहरी तपस्या में लीन हैं। ब्रह्मा बताते हैं कि शिव,
    अपनी तपस्या में लीन होने के कारण सांसारिक इच्छाओं से उदासीन हैं और उन्हें एक पत्नी
    की ओर आकर्षित करने की आवश्यकता है। सती से कहा जाता है कि वे दक्ष की पुत्री के
    रूप में अवतरित हों और अपने दिव्य रूप से शिव को आकर्षित करें, जिससे वे उनकी पत्नी
    बन सकें।
- id: shiva-mohini-episode
  type: story
  keywords:
  - Shiva
  - Mohini
  - Brahma
  - Jagadambika
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: In this episode, Brahma expresses his desire to enchant Shiva, the supreme
    being, through Jagadambika. Despite Shiva's transcendental nature, Brahma seeks
    Jagadambika's help to fulfill his wish. Jagadambika, surprised by Brahma's request,
    contemplates the situation and ultimately agrees to take the form of Sati, the
    daughter of Daksha, to captivate Shiva.
  summary_hi: इस प्रकरण में, ब्रह्मा अपनी इच्छा व्यक्त करते हैं कि वे शिव, जो परमात्मा
    हैं, को जगदम्बिका के माध्यम से मोहित करना चाहते हैं। शिव की अलौकिक प्रकृति के
    बावजूद, ब्रह्मा जगदम्बिका की सहायता से अपनी इच्छा पूरी करना चाहते हैं। जगदम्बिका,
    ब्रह्मा की इस इच्छा से आश्चर्यचकित होकर, स्थिति पर विचार करती हैं और अंततः दक्ष
    की पुत्री सती का रूप धारण कर शिव को आकर्षित करने के लिए सहमत होती हैं।
- id: durga-plan-to-enchant-shiva
  type: story
  keywords:
  - Durga
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 11
  summary_en: Goddess Durga speaks to Brahma, acknowledging that she is the only one
    capable of enchanting Shiva. She expresses her determination to take birth as
    Sati, the daughter of Daksha, to win Shiva's affection and become his consort.
    Durga plans to use her devotion to make Shiva subservient to her, similar to how
    other beings are influenced by women.
  summary_hi: देवी दुर्गा ब्रह्मा से कहती हैं कि केवल वही शिव को मोहित करने में सक्षम
    हैं। वह अपनी दृढ़ता व्यक्त करती हैं कि दक्ष की पुत्री सती के रूप में जन्म लेंगी
    और शिव का प्रेम प्राप्त करेंगी। दुर्गा अपनी भक्ति का उपयोग करके शिव को अपने वश
    में करने की योजना बनाती हैं, जैसे अन्य प्राणी स्त्रियों के वश में होते हैं।
- id: daksha-penance-for-shakti
  type: story
  keywords:
  - Daksha
  - Shakti
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 12
  summary_en: Narada asks Brahma about Daksha's penance and how Shakti became Daksha's
    daughter. Brahma narrates that Daksha performed intense penance for three thousand
    divine years, subsisting on leaves, water, and air, to please Goddess Jagadamba.
    Eventually, the goddess appeared before him, fulfilling his desire to have her
    as his daughter.
  summary_hi: नारद ब्रह्मा से दक्ष की तपस्या और शक्ति के दक्ष की पुत्री बनने के बारे
    में पूछते हैं। ब्रह्मा बताते हैं कि दक्ष ने तीन हजार दिव्य वर्षों तक कठोर तप किया,
    पत्ते, जल, और वायु पर निर्भर रहते हुए, देवी जगदम्बा को प्रसन्न करने के लिए। अंततः
    देवी उनके सामने प्रकट हुईं और उनकी इच्छा पूरी की कि वह उनकी पुत्री बनें।
- id: daksha-prays-to-jagadamba
  type: story
  keywords:
  - Daksha
  - Jagadamba
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khanda)
  summary_en: Daksha Prajapati, after performing intense penance and worship of Jagadamba,
    is granted a boon by the goddess. He requests that she be born as his daughter
    and become the consort of Shiva, thus fulfilling a divine purpose.
  summary_hi: दक्ष प्रजापति, जगदम्बा की गहन तपस्या और आराधना के बाद, देवी से वरदान
    प्राप्त करते हैं। वह उनसे अनुरोध करते हैं कि वह उनकी पुत्री के रूप में जन्म लें
    और शिव की पत्नी बनें, जिससे एक दिव्य उद्देश्य पूरा हो।
- id: jagadamba-agrees-to-daksha-request
  type: story
  keywords:
  - Jagadamba
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khanda)
  summary_en: Jagadamba agrees to Daksha's request and promises to be born as his
    daughter, Sati, and become Shiva's consort. She assures Daksha that she will perform
    severe penance to achieve this goal.
  summary_hi: जगदम्बा, दक्ष के अनुरोध को स्वीकार करती हैं और वादा करती हैं कि वह उनकी
    पुत्री सती के रूप में जन्म लेंगी और शिव की पत्नी बनेंगी। वह दक्ष को आश्वासन देती
    हैं कि वह इस लक्ष्य को प्राप्त करने के लिए कठोर तपस्या करेंगी।
- id: sati-promise-to-daksha
  type: story
  keywords:
  - Sati
  - Daksha
  - promise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 12
  summary_en: Sati promises Daksha that she will be born as his daughter in every
    cycle of creation and become the wife of Shiva. She warns Daksha that if he ever
    disrespects her, she will abandon her body. After making this promise, Sati disappears,
    leaving Daksha hopeful and pleased.
  summary_hi: सती दक्ष से वादा करती हैं कि वह हर सर्ग में उनकी पुत्री बनेंगी और शिव
    की पत्नी बनेंगी। वह दक्ष को चेतावनी देती हैं कि अगर उन्होंने कभी उनका अनादर किया,
    तो वह अपना शरीर त्याग देंगी। यह वादा करने के बाद सती अंतर्धान हो जाती हैं, जिससे
    दक्ष आशान्वित और प्रसन्न होते हैं।
- id: daksha-returns-home
  type: event
  keywords:
  - Daksha
  - return
  - home
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 12
  summary_en: After Sati disappears, Daksha returns to his home, feeling joyful with
    the thought that Sati will be born as his daughter and marry Shiva. This marks
    the end of the twelfth chapter in the Sati Khand of the Rudra Samhita.
  summary_hi: सती के अंतर्धान होने के बाद, दक्ष अपने घर लौट जाते हैं और इस विचार से
    प्रसन्न होते हैं कि सती उनकी पुत्री बनकर शिव से विवाह करेंगी। यह रुद्रसंहिता के
    सती खंड के बारहवें अध्याय का अंत है।
- id: daksha-progeny-creation
  type: story
  keywords:
  - Daksha
  - progeny
  - creation
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: Daksha Prajapati, following Brahma's advice, marries Virini and begets
    ten thousand sons named Haryashvas. These sons, devoted to their father and the
    Vedic path, go westward to perform penance for creation. They reach the sacred
    Narayana Saras Tirtha, where their minds become pure, and they engage in deep
    penance for the growth of progeny.
  summary_hi: दक्ष प्रजापति, ब्रह्मा की सलाह पर, वीरिणी से विवाह करते हैं और हर्यश्व
    नामक दस हजार पुत्रों को जन्म देते हैं। ये पुत्र अपने पिता और वैदिक मार्ग के प्रति
    समर्पित होकर सृष्टि के लिए तपस्या करने पश्चिम दिशा में जाते हैं। वे पवित्र नारायण
    सर तीर्थ पर पहुँचते हैं, जहाँ उनकी बुद्धि निर्मल हो जाती है और वे प्रजावृद्धि
    के लिए गहन तपस्या में लग जाते हैं।
- id: narada-intervention
  type: event
  keywords:
  - Narada
  - intervention
  - divine-council
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Narada, the divine sage, arrived at the scene to help the distressed
    gods. He advised them to approach Parvati with humility and seek her mercy to
    calm her wrath. The gods, along with Narada, decided to collectively pray to Parvati
    for peace.
  summary_hi: नारद, दिव्य ऋषि, संकटग्रस्त देवताओं की सहायता के लिए वहाँ पहुँचे। उन्होंने
    देवताओं को पार्वती के पास विनम्रता से जाकर उनकी कृपा प्राप्त करने की सलाह दी।
    नारद के साथ देवताओं ने पार्वती से शांति की प्रार्थना करने का निर्णय लिया।
- id: daksha-sons-destruction
  type: story
  keywords:
  - Daksha
  - Narada
  - sons
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Daksha Prajapati was deeply saddened upon hearing from Narada about
    the destruction of his sons. Despite being consoled and advised by Narada, Daksha
    remained in grief due to the influence of Shiva's Maya. Eventually, Daksha had
    more sons, but they too followed the path of their predecessors and were lost.
  summary_hi: दक्ष प्रजापति अपने पुत्रों के नाश की खबर नारद से सुनकर अत्यंत दुखी हो
    गए। नारद के समझाने और सलाह देने के बावजूद, दक्ष शिव की माया के प्रभाव से शोक में
    डूबे रहे। अंततः दक्ष ने और पुत्रों को जन्म दिया, लेकिन वे भी अपने पूर्वजों के
    मार्ग का अनुसरण करते हुए खो गए।
- id: narada-daksha-conflict
  type: event
  keywords:
  - Narada
  - Daksha
  - conflict
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Narada's teachings led Daksha's sons to renounce worldly duties, which
    angered Daksha. He accused Narada of misleading his sons and cursed him. Despite
    the curse, Narada accepted it calmly, embodying the virtues of a true sage.
  summary_hi: नारद की शिक्षाओं के कारण दक्ष के पुत्रों ने सांसारिक कर्तव्यों का त्याग
    कर दिया, जिससे दक्ष क्रोधित हो गए। उन्होंने नारद पर अपने पुत्रों को गुमराह करने
    का आरोप लगाया और उन्हें शाप दिया। शाप के बावजूद, नारद ने इसे शांतिपूर्वक स्वीकार
    किया, जो एक सच्चे साधु के गुणों को दर्शाता है।
- id: sati-birth
  type: event
  keywords:
  - Sati
  - birth
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 14
  summary_en: Sati, the daughter of Daksha and Virini, was born as a result of the
    divine intervention of Jagadambika. Her birth was celebrated by all the gods,
    and she was recognized for her divine radiance and connection to Shiva.
  summary_hi: सती, दक्ष और वीरणी की पुत्री, जगदम्बिका के दिव्य हस्तक्षेप के परिणामस्वरूप
    जन्मी। उनके जन्म का सभी देवताओं ने उत्सव मनाया, और उन्हें शिव से उनके दिव्य तेज
    और संबंध के लिए पहचाना गया।
- id: birth-of-sati
  type: story
  keywords:
  - sati
  - daksha
  - birth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand)
  summary_en: The passage describes the birth of Sati, the daughter of Daksha and
    his wife. Influenced by the presence of Shiva, Sati is born with auspicious signs,
    and her birth is celebrated by the gods. Daksha performs various rituals and offers
    wealth to Brahmins in celebration.
  summary_hi: यह अंश दक्ष और उनकी पत्नी की पुत्री सती के जन्म का वर्णन करता है। शिव
    की उपस्थिति के प्रभाव से सती शुभ लक्षणों के साथ जन्म लेती हैं, और उनके जन्म का
    देवताओं द्वारा उत्सव मनाया जाता है। दक्ष विभिन्न संस्कार करते हैं और ब्राह्मणों
    को धन प्रदान करते हैं।
- id: daksha-praises-sati
  type: story
  keywords:
  - daksha
  - sati
  - praise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand)
  summary_en: After Sati's birth, Daksha praises her with devotion, recognizing her
    as the eternal mother and the source of creation, preservation, and destruction.
    He acknowledges her as the embodiment of knowledge and ignorance, and prays for
    her blessings.
  summary_hi: सती के जन्म के बाद, दक्ष उन्हें भक्ति के साथ स्तुति करते हैं, उन्हें
    शाश्वत माता और सृष्टि, पालन और संहार की स्रोत के रूप में पहचानते हैं। वे उन्हें
    विद्या और अविद्या की मूर्ति मानते हैं और उनके आशीर्वाद की प्रार्थना करते हैं।
- id: daksha-daughter-birth
  type: event
  keywords:
  - daksha
  - birth
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Daksha Prajapati performed rituals and gave gifts to Brahmins and others
    upon the birth of his daughter. The city celebrated with music and dance, and
    the gods, including Vishnu, attended the festivities.
  summary_hi: दक्ष प्रजापति ने अपनी पुत्री के जन्म पर विधिपूर्वक संस्कार किए और ब्राह्मणों
    व अन्य लोगों को दान दिया। नगर में संगीत और नृत्य के साथ उत्सव मनाया गया, और विष्णु
    सहित देवताओं ने इस समारोह में भाग लिया।
- id: uma-naming
  type: event
  keywords:
  - uma
  - naming
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Daksha, pleased with his daughter's qualities, named her Uma with the
    consent of Vishnu and other gods. She was later given other auspicious names that
    were believed to remove sorrows.
  summary_hi: दक्ष ने अपनी पुत्री के गुणों से प्रसन्न होकर, विष्णु और अन्य देवताओं
    की सहमति से उसका नाम उमा रखा। बाद में उसे अन्य शुभ नाम भी दिए गए जो दुखों को दूर
    करने वाले माने जाते थे।
- id: shiva-childhood
  type: character
  keywords:
  - shiva
  - childhood
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In her childhood, Shiva was nurtured by her mother Veerini and Daksha.
    She grew like the waxing moon, embodying all virtues, and often engaged in activities
    like drawing Shiva's image and singing songs.
  summary_hi: अपने बचपन में, शिवा का पालन-पोषण उनकी माता वीरिणी और दक्ष ने किया। वह
    बढ़ती चंद्र कला की तरह बढ़ीं, सभी गुणों को धारण करते हुए, और अक्सर शिव की प्रतिमा
    बनाना और गीत गाना जैसे कार्यों में संलग्न रहती थीं।
- id: sati-childhood-story
  type: story
  keywords:
  - Sati
  - childhood
  - devotion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 14
  summary_en: Sati, the daughter of Prajapati Daksha and Virini, was raised with great
    care and grew in virtues like the waxing moon. Even as a child, she was devoted
    to Lord Shiva, often creating his idols and singing songs in his praise. Her parents'
    affection for her grew daily, and she was skilled in household duties, pleasing
    them greatly.
  summary_hi: सती, प्रजापति दक्ष और वीरिणी की पुत्री, बड़े ध्यान से पाली गई और चंद्रमा
    की कलाओं की तरह गुणों में बढ़ी। बाल्यकाल से ही वह शिवजी की भक्त थीं, उनकी मूर्तियाँ
    बनाती और उनकी स्तुति में गाने गाती थीं। उनके माता-पिता का स्नेह उन पर दिन-प्रतिदिन
    बढ़ता गया और वह घर के कार्यों में निपुण होकर उन्हें प्रसन्न करती थीं।
- id: sati-tapasya-for-shiva
  type: story
  keywords:
  - Sati
  - tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 15
  summary_en: Sati, desiring to marry Lord Shiva, sought her mother's permission to
    perform penance. With her mother's consent, she began her tapasya at home to win
    Shiva as her husband. Her father, Daksha, was pleased with the idea of Sati marrying
    Shiva and considered her worthy of the divine union.
  summary_hi: सती, भगवान शिव से विवाह करने की इच्छा रखते हुए, अपनी माता से तपस्या
    करने की अनुमति मांगती हैं। माता की अनुमति से, उन्होंने घर पर ही तपस्या शुरू की
    ताकि शिव को पति रूप में प्राप्त कर सकें। उनके पिता दक्ष भी सती के शिव से विवाह
    के विचार से प्रसन्न थे और उन्हें इस दिव्य मिलन के योग्य मानते थे।
- id: sati-tapasya-episode
  type: story
  keywords:
  - Sati
  - Tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: The gods and sages, led by Vishnu, visit Sati who is deeply engrossed
    in meditation on Shiva. They praise her intense tapasya and express their admiration.
    After paying their respects, they return to Mount Kailash, the abode of Shiva.
  summary_hi: देवता और ऋषि, विष्णु के नेतृत्व में, सती के पास जाते हैं जो शिव की ध्यान
    में लीन हैं। वे उनकी गहन तपस्या की प्रशंसा करते हैं और अपनी श्रद्धा व्यक्त करते
    हैं। उन्हें प्रणाम करने के बाद, वे कैलाश पर्वत, जो शिव का निवास स्थान है, लौट
    जाते हैं।
- id: brahma-vishnu-pray-to-shiva-for-marriage
  type: story
  keywords:
  - Brahma
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 16
  summary_en: Brahma and Vishnu approach Shiva to request his marriage, explaining
    the necessity of their cooperation for the balance of the universe. They emphasize
    the need for Shiva to participate in the destruction of demons to maintain cosmic
    order.
  summary_hi: ब्रह्मा और विष्णु शिव के पास उनके विवाह के लिए अनुरोध करने आते हैं,
    यह समझाते हुए कि ब्रह्मांड के संतुलन के लिए उनके सहयोग की आवश्यकता है। वे शिव
    को राक्षसों के विनाश में भाग लेने की आवश्यकता पर जोर देते हैं ताकि ब्रह्मांडीय
    व्यवस्था बनी रहे।
- id: shiva-marriage-proposal
  type: story
  keywords:
  - shiva
  - marriage
  - sati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In this passage, Lord Shiva expresses his willingness to marry a woman
    who can match his spiritual and worldly pursuits. He sets conditions for his prospective
    wife, emphasizing that she must be able to share in his yogic practices and worldly
    desires. Brahma and Vishnu, pleased with Shiva's conditions, suggest Sati, the
    daughter of Daksha, as a suitable match for him.
  summary_hi: इस अंश में, भगवान शिव अपनी भावी पत्नी के लिए शर्तें रखते हैं कि वह उनकी
    योग साधना और सांसारिक इच्छाओं में सहभागी हो सके। ब्रह्मा और विष्णु, शिव की शर्तों
    से प्रसन्न होकर, दक्ष की पुत्री सती को उनके लिए उपयुक्त पत्नी के रूप में सुझाते
    हैं।
- id: sati-marriage-to-shiva
  type: story
  keywords:
  - Sati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 16
  summary_en: In this episode, Lord Vishnu and Brahma request Lord Shiva to marry
    Sati, the daughter of Daksha. Sati is performing penance to obtain Shiva as her
    husband. Shiva agrees to the marriage, fulfilling the wishes of the gods.
  summary_hi: इस प्रकरण में, भगवान विष्णु और ब्रह्मा भगवान शिव से सती, जो दक्ष की
    पुत्री हैं, से विवाह करने का अनुरोध करते हैं। सती भगवान शिव को पति रूप में प्राप्त
    करने के लिए तप कर रही हैं। शिव इस विवाह के लिए सहमत हो जाते हैं, जिससे देवताओं
    की इच्छाएं पूरी होती हैं।
- id: shiva-appearance-to-sati
  type: story
  keywords:
  - Shiva
  - Sati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 17
  summary_en: Sati performs a fast and worships Lord Shiva with devotion. Pleased
    with her devotion, Shiva appears before her in a magnificent form with five faces
    and three eyes on each face. He grants her the boon she desires.
  summary_hi: सती उपवास करती हैं और भक्तिपूर्वक भगवान शिव की पूजा करती हैं। उनकी भक्ति
    से प्रसन्न होकर, शिव उनके सामने प्रकट होते हैं, उनके पाँच मुख और प्रत्येक मुख
    में तीन-तीन नेत्र होते हैं। वह उन्हें उनकी इच्छित वरदान प्रदान करते हैं।
- id: sati-asks-for-marriage
  type: story
  keywords:
  - Sati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati, the daughter of Daksha, performs a vrata to please Shiva. Pleased
    with her devotion, Shiva asks her to choose a boon. Overcome with shyness, Sati
    hesitates to express her desire to marry Shiva. Understanding her wish, Shiva
    himself proposes marriage to her, which she happily accepts.
  summary_hi: दक्ष की पुत्री सती शिव को प्रसन्न करने के लिए एक व्रत करती हैं। उनकी
    भक्ति से प्रसन्न होकर शिव उन्हें वर मांगने के लिए कहते हैं। सती संकोचवश अपनी इच्छा
    व्यक्त नहीं कर पातीं। शिव उनकी इच्छा को समझकर स्वयं उनसे विवाह का प्रस्ताव रखते
    हैं, जिसे सती खुशी-खुशी स्वीकार कर लेती हैं।
- id: shiva-sati-divine-union
  type: story
  keywords:
  - Shiva
  - Sati
  - divine union
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Sati expresses her wish to marry Shiva, the divine union is blessed.
    Sati's love and devotion towards Shiva lead to a beautiful and harmonious relationship,
    symbolized by their radiant presence together, akin to a cloud embracing the moon.
  summary_hi: सती द्वारा शिव से विवाह की इच्छा व्यक्त करने के बाद, उनका दिव्य मिलन
    संपन्न होता है। शिव के प्रति सती का प्रेम और भक्ति एक सुंदर और सामंजस्यपूर्ण संबंध
    की ओर ले जाता है, जो उनके एक साथ होने पर चंद्रमा को आलिंगन करने वाले बादल के समान
    दीप्तिमान होता है।
- id: sati-marriage-proposal
  type: event
  keywords:
  - Sati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati expresses her desire to marry Shiva in front of her father, and
    Shiva agrees to the proposal. Sati then seeks her mother's blessing before returning
    to her parents' home.
  summary_hi: सती अपने पिता के समक्ष शिव से विवाह की इच्छा व्यक्त करती हैं, और शिव
    इस प्रस्ताव को स्वीकार करते हैं। सती अपनी माँ का आशीर्वाद लेकर अपने माता-पिता
    के घर लौट जाती हैं।
- id: shiva-sati-separation
  type: story
  keywords:
  - Shiva
  - Sati
  - separation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After agreeing to marry Sati, Shiva returns to his abode in the Himalayas,
    feeling the pain of separation from Sati. He meditates deeply, trying to overcome
    the sorrow.
  summary_hi: सती से विवाह के लिए सहमति देने के बाद, शिव हिमालय में अपने आश्रम लौट
    जाते हैं और सती से वियोग के दुःख को महसूस करते हैं। वह ध्यान में लीन होकर इस दुःख
    को दूर करने का प्रयास करते हैं।
- id: brahma-intervenes-for-sati
  type: event
  keywords:
  - Brahma
  - Shiva
  - Sati
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Brahma visits Shiva to discuss the marriage of Sati. He assures Shiva
    that Daksha will eventually agree to the marriage and promises to speak to Daksha
    on Shiva's behalf.
  summary_hi: ब्रह्मा शिव से मिलने आते हैं और सती के विवाह पर चर्चा करते हैं। वह शिव
    को आश्वस्त करते हैं कि दक्ष अंततः विवाह के लिए सहमत होंगे और शिव की ओर से दक्ष
    से बात करने का वादा करते हैं।
- id: sati-returns-home
  type: event
  keywords:
  - Sati
  - Daksha
  - homecoming
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After receiving the boon from Shiva, Sati returns to her parents' home
    and informs them about the boon she received from Maheshwara. Her parents, upon
    hearing the news, are overjoyed and celebrate the occasion.
  summary_hi: शिव से वर प्राप्त करने के बाद, सती अपने माता-पिता के घर लौटती हैं और
    उन्हें महेश्वर से प्राप्त वर के बारे में बताती हैं। उनके माता-पिता यह समाचार सुनकर
    अत्यंत प्रसन्न होते हैं और उत्सव मनाते हैं।
- id: daksha-contemplates-sati-marriage
  type: story
  keywords:
  - Daksha
  - Sati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Daksha, the father of Sati, contemplates how to give his daughter in
    marriage to Shiva. Despite Shiva's previous visit and blessing, Daksha worries
    about how to approach the matter again. He considers sending someone to Shiva
    or performing a puja to please him.
  summary_hi: दक्ष, सती के पिता, अपनी पुत्री का विवाह शिव से कैसे करें, इस पर विचार
    करते हैं। शिव के पूर्व आगमन और आशीर्वाद के बावजूद, दक्ष इस विषय को फिर से कैसे
    उठाएं, इस पर चिंतित हैं। वह शिव के पास किसी को भेजने या उन्हें प्रसन्न करने के
    लिए पूजा करने पर विचार करते हैं।
- id: brahma-visits-daksha
  type: event
  keywords:
  - Brahma
  - Daksha
  - Sati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Brahma visits Daksha to inform him that the time has come for Sati to
    marry Shiva. Brahma explains that Shiva is restless due to his separation from
    Sati and urges Daksha to proceed with the marriage arrangements.
  summary_hi: ब्रह्मा दक्ष के पास जाते हैं और उन्हें सूचित करते हैं कि सती का शिव
    से विवाह करने का समय आ गया है। ब्रह्मा बताते हैं कि शिव सती से अलगाव के कारण बेचैन
    हैं और दक्ष को विवाह की व्यवस्था करने के लिए प्रेरित करते हैं।
- id: sati-shiva-union
  type: story
  keywords:
  - Sati
  - Shiva
  - union
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 17
  summary_en: In this episode, Brahma informs Daksha that his daughter Sati has been
    performing penance to win Lord Shiva's affection. Shiva, in turn, is also contemplating
    Sati and desires to unite with her. Brahma suggests that Daksha should give Sati
    to Shiva, fulfilling both their desires. Daksha agrees, and Brahma, along with
    Narada, plans to bring Sati to Shiva.
  summary_hi: इस प्रकरण में, ब्रह्मा दक्ष को सूचित करते हैं कि उनकी पुत्री सती भगवान
    शिव का प्रेम प्राप्त करने के लिए तप कर रही है। शिव भी सती का ध्यान कर रहे हैं
    और उनसे मिलन की इच्छा रखते हैं। ब्रह्मा सुझाव देते हैं कि दक्ष को सती को शिव को
    सौंप देना चाहिए, जिससे दोनों की इच्छाएं पूरी हों। दक्ष सहमत होते हैं और ब्रह्मा
    नारद के साथ सती को शिव के पास लाने की योजना बनाते हैं।
- id: shiva-visit-daksha
  type: event
  keywords:
  - Shiva
  - Daksha
  - visit
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 18
  summary_en: Lord Shiva, accompanied by gods and sages, visits Daksha's house. Daksha
    welcomes everyone and prepares for the marriage of Sati and Shiva. This event
    marks the beginning of the union between Sati and Shiva.
  summary_hi: भगवान शिव, देवताओं और ऋषियों के साथ, दक्ष के घर जाते हैं। दक्ष सभी का
    स्वागत करते हैं और सती और शिव के विवाह की तैयारी करते हैं। यह घटना सती और शिव
    के मिलन की शुरुआत को चिह्नित करती है।
- id: shiva-sati-marriage-arrangement
  type: event
  keywords:
  - Shiva
  - Sati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Brahma informs Rudra (Shiva) about Daksha's decision to give his daughter
    Sati in marriage to Shiva. Brahma advises Shiva to visit Daksha's house at an
    auspicious time to formalize the marriage. Shiva, along with Narada and Brahma's
    mind-born sons, prepares to visit Daksha's abode.
  summary_hi: ब्रह्मा रुद्र (शिव) को दक्ष के निर्णय के बारे में बताते हैं कि वह अपनी
    पुत्री सती का विवाह शिव से करेंगे। ब्रह्मा शिव को सलाह देते हैं कि वे शुभ मुहूर्त
    में दक्ष के घर जाकर विवाह को औपचारिक रूप दें। शिव, नारद और ब्रह्मा के मानस पुत्रों
    के साथ दक्ष के घर जाने की तैयारी करते हैं।
- id: shiva-sati-marriage
  type: event
  keywords:
  - shiva
  - sati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 20
  summary_en: The passage describes the marriage of Lord Shiva and Goddess Sati during
    the Svayambhuva Manvantara. After the marriage, Shiva, along with Sati and his
    attendants, returns to Mount Kailash, where they are warmly received by the gods
    and sages. The narrative emphasizes the auspiciousness of listening to this story
    during weddings or other ceremonies, promising success and happiness.
  summary_hi: यह अंश भगवान शिव और देवी सती के विवाह का वर्णन करता है, जो स्वायंभुव
    मन्वंतर के दौरान हुआ था। विवाह के बाद, शिव, सती और उनके गण कैलाश पर्वत लौटते हैं,
    जहाँ देवताओं और ऋषियों द्वारा उनका स्वागत किया जाता है। कथा सुनने की महत्ता को
    रेखांकित किया गया है, विशेषकर विवाह या अन्य शुभ कार्यों के दौरान, जो सफलता और
    सुख की प्राप्ति का वादा करता है।
- id: shiva-sati-smoke-episode
  type: story
  keywords:
  - Shiva
  - Sati
  - smoke
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In an attempt to see Sati's face, Shiva creates a dense smoke by throwing
    wet wood into the fire. This smoke causes darkness around the sacrificial altar,
    allowing Shiva to glimpse Sati's face. However, this act leads to a series of
    events where Shiva becomes aware of the situation and expresses his displeasure.
  summary_hi: सती का मुख देखने के प्रयास में, शिव गीली लकड़ी को अग्नि में डालकर घना
    धुआं उत्पन्न करते हैं। यह धुआं वेदी के चारों ओर अंधकार फैलाता है, जिससे शिव सती
    का मुख देख पाते हैं। हालांकि, इस घटना के कारण शिव को स्थिति का ज्ञान होता है और
    वे अपनी नाराजगी व्यक्त करते हैं।
- id: shiva-brahma-confrontation
  type: story
  keywords:
  - Shiva
  - Brahma
  - confrontation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Shiva, angered by Brahma's actions, raises his trident to punish him.
    The gods and sages, fearful of Shiva's wrath, plead for Brahma's protection. Eventually,
    Daksha arrives and intervenes, reminding Shiva of Vishnu's earlier words, which
    calms Shiva down.
  summary_hi: ब्रह्मा के कार्यों से क्रोधित होकर शिव अपने त्रिशूल को उठाकर उन्हें
    दंडित करने का प्रयास करते हैं। शिव के क्रोध से भयभीत देवता और ऋषि ब्रह्मा की रक्षा
    के लिए प्रार्थना करते हैं। अंततः दक्ष आकर हस्तक्षेप करते हैं और शिव को विष्णु
    के पूर्व वचनों की याद दिलाते हैं, जिससे शिव शांत हो जाते हैं।
- id: shiva-anger-at-brahma
  type: event
  keywords:
  - Shiva
  - Brahma
  - Anger
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand)
  summary_en: In this episode, Lord Shiva becomes enraged upon learning that Brahma
    has looked at Sati with desire. His anger causes fear among the gods, sages, and
    humans. The deities, led by Vishnu, plead with Shiva to spare Brahma, emphasizing
    Brahma's role in creation.
  summary_hi: इस प्रकरण में, भगवान शिव ब्रह्मा द्वारा सती को कामना से देखने पर क्रोधित
    हो जाते हैं। उनके क्रोध से देवता, ऋषि और मनुष्य भयभीत हो जाते हैं। विष्णु के नेतृत्व
    में देवता शिव से ब्रह्मा को क्षमा करने की प्रार्थना करते हैं, यह बताते हुए कि
    ब्रह्मा सृष्टि के लिए आवश्यक हैं।
- id: vishnu-pleads-for-brahma
  type: story
  keywords:
  - Vishnu
  - Brahma
  - Plea
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand)
  summary_en: Vishnu, being wise and dear to Shiva, approaches him with a plea to
    spare Brahma's life. He argues that Brahma is essential for creation and that
    there is no other being who can fulfill this role. Vishnu emphasizes the importance
    of mercy and the continuation of cosmic duties.
  summary_hi: विष्णु, जो शिव के प्रिय और बुद्धिमान हैं, ब्रह्मा के जीवन को बचाने के
    लिए शिव से प्रार्थना करते हैं। वे तर्क देते हैं कि ब्रह्मा सृष्टि के लिए आवश्यक
    हैं और इस भूमिका को कोई अन्य नहीं निभा सकता। विष्णु दया और ब्रह्मांडीय कर्तव्यों
    की निरंतरता के महत्व पर जोर देते हैं।
- id: shiva-brahma-vishnu-unity-concept
  type: concept
  keywords:
  - shiva
  - brahma
  - vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In this passage, Lord Vishnu explains to Lord Shiva that Brahma, Vishnu,
    and Shiva are not separate entities but are manifestations of the same supreme
    reality. They are different aspects of the same divine being responsible for creation,
    maintenance, and destruction of the universe.
  summary_hi: इस अंश में, भगवान विष्णु भगवान शिव को समझाते हैं कि ब्रह्मा, विष्णु
    और शिव अलग-अलग अस्तित्व नहीं हैं, बल्कि एक ही परम वास्तविकता के विभिन्न रूप हैं।
    वे ब्रह्मांड की सृष्टि, पालन और संहार के लिए जिम्मेदार एक ही दिव्य सत्ता के विभिन्न
    पहलू हैं।
- id: shiva-intent-to-create-new-creator
  type: story
  keywords:
  - shiva
  - creation
  - brahma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Lord Shiva expresses his intent to destroy Brahma and create a new creator
    for the universe. However, Vishnu advises against it, explaining that all three
    deities are manifestations of the same supreme being and should not be seen as
    separate.
  summary_hi: भगवान शिव ब्रह्मा का वध कर एक नए सृष्टिकर्ता को उत्पन्न करने की इच्छा
    व्यक्त करते हैं। हालांकि, विष्णु उन्हें ऐसा करने से मना करते हैं और समझाते हैं
    कि ये तीनों देवता एक ही परम सत्ता के रूप हैं और अलग नहीं माने जाने चाहिए।
- id: rudra-shir-name-origin
  type: etymology
  keywords:
  - Rudra
  - Brahma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 20
  summary_en: The origin of the name 'Rudra Shir' for Brahma is explained. After Shiva
    forgives Brahma and spares his life, Brahma is instructed by Shiva to perform
    penance in his current form, which will lead to him being known as 'Rudra Shir'
    on earth.
  summary_hi: ब्रह्मा के लिए 'रुद्र शिर' नाम की उत्पत्ति का वर्णन किया गया है। शिव
    द्वारा ब्रह्मा को क्षमा कर देने और उनके जीवन को बचाने के बाद, शिव ब्रह्मा को अपने
    वर्तमान रूप में तप करने का निर्देश देते हैं, जिससे उन्हें पृथ्वी पर 'रुद्र शिर'
    के नाम से जाना जाएगा।
- id: brahma-pleads-for-forgiveness
  type: story
  keywords:
  - Brahma
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 20
  summary_en: Brahma, feeling ashamed and seeking forgiveness, prays to Shiva after
    being spared from death. He requests Shiva to suggest a penance for his sins,
    and Shiva, pleased with Brahma's devotion, instructs him on the path to redemption.
  summary_hi: ब्रह्मा, लज्जित होकर और क्षमा की याचना करते हुए, शिव से प्रार्थना करते
    हैं जब उन्हें मृत्यु से बचा लिया जाता है। वह शिव से अपने पापों के लिए प्रायश्चित्त
    का सुझाव देने का अनुरोध करते हैं, और शिव, ब्रह्मा की भक्ति से प्रसन्न होकर, उन्हें
    मोक्ष का मार्ग बताते हैं।
- id: shiva-megh-creation
  type: event
  keywords:
  - Shiva
  - Megh
  - Creation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Shiva's energy, which fell on the earth, transforms
    into four types of destructive clouds named Samvartaka, Aavarta, Pushkara, and
    Drona. These clouds, created in the presence of divine sages, are destined to
    cause destruction.
  summary_hi: इस प्रकरण में, शिव का जो तेज पृथ्वी पर गिरा था, वह चार प्रकार के प्रलयंकारी
    मेघों में परिवर्तित हो गया, जिनके नाम संवर्तक, आवर्त, पुष्कर और द्रोण हैं। ये
    मेघ देवर्षियों की उपस्थिति में बने और विनाश करने के लिए नियत हैं।
- id: shiva-parvati-marriage-completion
  type: event
  keywords:
  - Shiva
  - Parvati
  - Marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After the creation of the destructive clouds, Shiva and Parvati's marriage
    rituals are completed. The divine beings celebrate the occasion with music, dance,
    and showers of flowers, marking a grand celebration.
  summary_hi: प्रलयंकारी मेघों के निर्माण के बाद, शिव और पार्वती के विवाह के शेष कृत्य
    पूरे होते हैं। देवता इस अवसर को संगीत, नृत्य और पुष्पवर्षा के साथ मनाते हैं, जो
    एक भव्य उत्सव का प्रतीक है।
- id: shiva-boon-to-brahma
  type: event
  keywords:
  - Shiva
  - Brahma
  - Boon
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Pleased with the completion of the marriage rituals, Shiva offers Brahma
    a boon. Brahma requests Shiva to remain on the earth in his current form to purify
    the sins of humans, and Shiva agrees to this request.
  summary_hi: विवाह के कृत्यों की पूर्णता से प्रसन्न होकर, शिव ब्रह्मा को वरदान देने
    की पेशकश करते हैं। ब्रह्मा शिव से अनुरोध करते हैं कि वे अपने वर्तमान रूप में पृथ्वी
    पर बने रहें ताकि मनुष्यों के पापों की शुद्धि हो सके, और शिव इस अनुरोध को स्वीकार
    करते हैं।
- id: shiva-brahma-conversation
  type: story
  keywords:
  - Shiva
  - Brahma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In a conversation between Shiva and Brahma, Brahma requests Shiva to
    remain on earth in a particular form to help purify the sins of humans. Shiva
    agrees to Brahma's request and decides to stay with his wife Sati for the welfare
    of the world.
  summary_hi: शिव और ब्रह्मा के बीच एक संवाद में, ब्रह्मा शिव से अनुरोध करते हैं कि
    वे एक विशेष रूप में पृथ्वी पर रहें ताकि मनुष्यों के पापों को शुद्ध करने में मदद
    मिल सके। शिव ब्रह्मा के अनुरोध को स्वीकार करते हैं और अपनी पत्नी सती के साथ संसार
    के कल्याण के लिए रहने का निर्णय लेते हैं।
- id: shiva-departure-with-sati
  type: event
  keywords:
  - Shiva
  - Sati
  - Departure
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: After taking leave from Daksha, Shiva, along with his wife Sati, departs
    on a bull towards the Himalayas. The event is marked by the presence of various
    deities and sages who praise Shiva and bid him farewell.
  summary_hi: दक्ष से विदा लेने के बाद, शिव अपनी पत्नी सती के साथ बैल पर सवार होकर
    हिमालय की ओर प्रस्थान करते हैं। इस घटना में विभिन्न देवताओं और ऋषियों की उपस्थिति
    होती है जो शिव की प्रशंसा करते हैं और उन्हें विदा करते हैं।
- id: shiva-and-sati-arrival-at-himalayas
  type: event
  keywords:
  - Shiva
  - Sati
  - Himalayas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Shiva and Sati arrive at the Himalayas, where they are warmly welcomed
    by the deities and sages. Shiva, pleased with the reception, allows the deities
    to return to their abodes while he remains with Sati at the Himalayan abode.
  summary_hi: शिव और सती हिमालय पहुँचते हैं, जहाँ उनका देवताओं और ऋषियों द्वारा गर्मजोशी
    से स्वागत किया जाता है। स्वागत से प्रसन्न होकर शिव देवताओं को उनके निवास स्थान
    लौटने की अनुमति देते हैं जबकि वे सती के साथ हिमालय में रहते हैं।
- id: shiva-return-to-kailash
  type: event
  keywords:
  - Shiva
  - Kailash
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: After being honored by Daksha, Lord Shiva, along with his attendants,
    returns to his abode at Mount Kailash. There, he reminisces about his beloved
    Sati and shares her story with his chief attendants.
  summary_hi: दक्ष द्वारा सम्मानित होने के बाद, भगवान शिव अपने गणों के साथ कैलाश पर्वत
    पर अपने निवास स्थान लौट जाते हैं। वहाँ, वे अपनी प्रिय सती को याद करते हैं और उनके
    मुख्य गणों के साथ उनकी कथा साझा करते हैं।
- id: shiva-sati-springtime-romance
  type: story
  keywords:
  - Shiva
  - Sati
  - Spring
  - Romance
  source:
    book: Shiv Puran
    sarga: '21'
  summary_en: In the enchanting season of spring, Lord Shiva and Goddess Sati spent
    time together in the beautiful groves and rivers of the mountains. The environment
    was filled with blooming flowers and the air was fragrant, enhancing their romantic
    moments. Shiva, deeply in love, adorned Sati with garlands he made himself, and
    they enjoyed each other's company immensely.
  summary_hi: वसन्त ऋतु के मनोहारी समय में भगवान शिव और देवी सती पर्वतों के सुंदर
    कुंजों और नदियों में साथ समय बिताते हैं। चारों ओर खिले हुए फूलों और सुगंधित वायु
    से वातावरण रोमांटिक हो जाता है। शिव, सती के प्रति अपने प्रेम में मग्न होकर, स्वयं
    बनाए हुए फूलों की मालाओं से सती को सजाते हैं और वे एक-दूसरे की संगति का भरपूर
    आनंद लेते हैं।
- id: sati-shiva-residence-on-himalaya
  type: story
  keywords:
  - Sati
  - Shiva
  - Himalaya
  source:
    book: Shiv Puran
    sarga: '22'
  summary_en: Sati expresses her desire to reside with Shiva on the Himalaya mountains.
    Shiva, enchanted by her words, takes her to the beautiful and divine peaks of
    the Himalayas, where they live happily for many years. The place is described
    as a heavenly abode, filled with various birds, flowers, and celestial beings.
  summary_hi: सती शिव से हिमालय पर्वत पर निवास करने की इच्छा व्यक्त करती हैं। शिव,
    उनके शब्दों से मोहित होकर, उन्हें हिमालय की सुंदर और दिव्य चोटियों पर ले जाते
    हैं, जहाँ वे कई वर्षों तक प्रसन्नतापूर्वक रहते हैं। यह स्थान स्वर्ग के समान है,
    जहाँ विभिन्न पक्षी, फूल और दिव्य प्राणी निवास करते हैं।
- id: shiva-sati-love-story
  type: story
  keywords:
  - Shiva
  - Sati
  source:
    book: Shiv Puran
    sarga: द्वितीय सतीखण्ड, अध्याय २२
  summary_en: Shiva and Sati are deeply in love, spending their time together in various
    gardens and forests. Shiva's mind is not inclined towards rituals or meditation,
    as he is constantly thinking of Sati. Similarly, Sati is always gazing at Shiva,
    and their mutual affection grows stronger.
  summary_hi: शिव और सती एक-दूसरे से गहरे प्रेम में हैं और विभिन्न उद्यानों और वनों
    में समय बिताते हैं। शिव का मन यज्ञ या ध्यान में नहीं लगता क्योंकि वे सती के बारे
    में ही सोचते रहते हैं। इसी प्रकार सती भी शिव को निहारती रहती हैं और उनका परस्पर
    प्रेम बढ़ता जाता है।
- id: sati-seeks-knowledge-of-supreme-truth
  type: story
  keywords:
  - Sati
  - Shiva
  - Supreme Truth
  source:
    book: Shiv Puran
    sarga: द्वितीय सतीखण्ड, अध्याय २३
  summary_en: Sati, feeling content with her life with Shiva, seeks to understand
    the supreme truth that brings liberation from worldly suffering. She approaches
    Shiva with devotion and requests him to reveal this knowledge. Shiva, pleased
    with her devotion, begins to explain the supreme truth to her.
  summary_hi: सती, शिव के साथ अपने जीवन से संतुष्ट होकर, उस परमतत्त्व को समझना चाहती
    हैं जो सांसारिक दुःखों से मुक्ति दिलाता है। वह शिव के पास भक्ति के साथ जाती हैं
    और उनसे इस ज्ञान को प्रकट करने का अनुरोध करती हैं। शिव, उनकी भक्ति से प्रसन्न
    होकर, उन्हें परमतत्त्व का वर्णन करना शुरू करते हैं।
- id: sati-sacrifice-story
  type: story
  keywords:
  - sati
  - shiva
  - daksha-yajna
  source:
    book: Shiv Puran
    sarga: Section 15
  summary_en: Sati, the daughter of Daksha, felt insulted when her husband Shiva was
    disrespected at her father's yajna. In her anguish, she sacrificed her own body.
    Later, she was reborn as Parvati and through intense penance, she reunited with
    Shiva through marriage.
  summary_hi: सती, दक्ष की पुत्री, अपने पिता के यज्ञ में अपने पति शिव का अपमान देखकर
    आहत हुईं। अपनी पीड़ा में, उन्होंने अपने शरीर का त्याग कर दिया। बाद में, वह पार्वती
    के रूप में पुनर्जन्मी और कठोर तपस्या के माध्यम से शिव से विवाह कर पुनः मिल गईं।
- id: shiva-rama-encounter
  type: event
  keywords:
  - shiva
  - rama
  - dandakaranya
  source:
    book: Shiv Puran
    sarga: Section 15
  summary_en: While wandering with Sati, Shiva encountered Rama in the Dandakaranya
    forest. Rama was in distress, searching for his abducted wife Sita. Shiva, recognizing
    Rama's divine nature, paid his respects and continued on his way.
  summary_hi: सती के साथ भ्रमण करते हुए, शिव की दंडकारण्य वन में राम से भेंट हुई।
    राम अपनी अपहृत पत्नी सीता की खोज में व्यथित थे। शिव ने राम की दिव्यता को पहचानते
    हुए उन्हें प्रणाम किया और अपनी यात्रा जारी रखी।
- id: shiva-meets-rama-in-forest
  type: event
  keywords:
  - Shiva
  - Rama
  - Dandakaranya
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Satikhanda
  summary_en: In the Dandakaranya forest, Shiva encounters Rama and Lakshmana, who
    are searching for Sita, abducted by Ravana. Shiva, moved by Rama's plight, blesses
    him and continues his journey.
  summary_hi: दंडकारण्य वन में, शिव राम और लक्ष्मण से मिलते हैं, जो रावण द्वारा अपहृत
    सीता की खोज कर रहे हैं। शिव, राम की स्थिति से प्रभावित होकर उन्हें आशीर्वाद देते
    हैं और अपनी यात्रा जारी रखते हैं।
- id: sati-questions-shiva-about-rama
  type: story
  keywords:
  - Sati
  - Shiva
  - Rama
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Satikhanda
  summary_en: Sati, witnessing Shiva's reverence for Rama, questions him about the
    identity of Rama and Lakshmana. Shiva explains that they are the sons of King
    Dasharatha, with Rama being an incarnation of Vishnu.
  summary_hi: सती, शिव को राम के प्रति श्रद्धा व्यक्त करते देख, उनसे राम और लक्ष्मण
    की पहचान के बारे में पूछती हैं। शिव बताते हैं कि वे राजा दशरथ के पुत्र हैं, और
    राम भगवान विष्णु के अवतार हैं।
- id: sati-tests-rama
  type: story
  keywords:
  - Sati
  - Rama
  - Test
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Sati, doubting Lord Shiva's words about Rama being an incarnation of
    Vishnu, decides to test Rama herself. She takes the form of Sita and approaches
    Rama. Rama, recognizing her true form, greets her and questions her about her
    presence without Shiva. Realizing Rama's divine nature, Sati is ashamed and returns
    to Shiva, acknowledging Rama as Vishnu.
  summary_hi: सती, शिवजी के इस कथन पर संदेह करते हुए कि श्रीराम विष्णु के अवतार हैं,
    स्वयं राम की परीक्षा लेने का निर्णय करती हैं। वह सीता का रूप धारण कर राम के पास
    जाती हैं। राम, उनके वास्तविक रूप को पहचानते हुए, उनका अभिवादन करते हैं और शिव
    के बिना उनके आने का कारण पूछते हैं। राम की दिव्यता को पहचानकर सती लज्जित होती
    हैं और शिव के पास लौटकर राम को विष्णु के रूप में स्वीकार करती हैं।
- id: vishnu-coronation-by-shiva
  type: event
  keywords:
  - Vishnu
  - Shiva
  - coronation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 25
  summary_en: In a grand ceremony, Lord Shiva coronates Lord Vishnu as Gopesh in Goloka.
    Shiva invites all the gods, sages, and celestial beings to witness the event.
    Vishnu is adorned with divine ornaments and seated on a magnificent throne, symbolizing
    his supreme status.
  summary_hi: भगवान शिव ने गोलोक में एक भव्य समारोह में भगवान विष्णु का गोपेश के रूप
    में अभिषेक किया। शिव ने सभी देवताओं, ऋषियों और दिव्य प्राणियों को इस घटना का साक्षी
    बनने के लिए आमंत्रित किया। विष्णु को दिव्य आभूषणों से सजाया गया और एक भव्य सिंहासन
    पर बैठाया गया, जो उनकी सर्वोच्च स्थिति का प्रतीक है।
- id: shiva-vishnu-reconciliation
  type: event
  keywords:
  - Shiva
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In this episode, Lord Shiva declares that Vishnu is worthy of worship
    and grants him significant powers. Shiva acknowledges Vishnu as the creator, preserver,
    and destroyer of the worlds, and bestows upon him the ability to perform various
    divine acts and grant liberation to devotees.
  summary_hi: इस प्रकरण में, भगवान शिव विष्णु को पूजनीय घोषित करते हैं और उन्हें महत्वपूर्ण
    शक्तियाँ प्रदान करते हैं। शिव विष्णु को लोकों के कर्ता, पालक और संहारक के रूप
    में स्वीकार करते हैं और उन्हें विभिन्न दिव्य कार्य करने और भक्तों को मोक्ष प्रदान
    करने की क्षमता देते हैं।
- id: goloka-establishment
  type: concept
  keywords:
  - Goloka
  - Vaikuntha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Shiva describes a divine realm called Goloka, which will be known for
    its supreme splendor and will be the abode of Vishnu. This realm is depicted as
    a place of great brightness and divine presence.
  summary_hi: शिव एक दिव्य क्षेत्र गोलोक का वर्णन करते हैं, जो अपनी उच्चतम वैभवता
    के लिए जाना जाएगा और विष्णु का निवास स्थान होगा। यह क्षेत्र महान उज्ज्वलता और
    दिव्य उपस्थिति का स्थान बताया गया है।
- id: rama-exile-episode
  type: story
  keywords:
  - Rama
  - Exile
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Lord Rama narrates his story to Sati, explaining that he is in exile
    in the forest with Sita and Lakshmana due to his father's command. He expresses
    his sorrow over Sita's abduction by a demon and his ongoing search for her.
  summary_hi: भगवान राम सती को अपनी कहानी सुनाते हैं, बताते हैं कि वे अपने पिता की
    आज्ञा के कारण सीता और लक्ष्मण के साथ वनवास में हैं। वे एक राक्षस द्वारा सीता के
    अपहरण और उसकी खोज में अपने दुख को व्यक्त करते हैं।
- id: sati-regret-and-reconciliation
  type: story
  keywords:
  - Sati
  - Shiva
  - regret
  - reconciliation
  source:
    book: Shiv Puran
    sarga: '286'
  summary_en: Devi Sati regrets not heeding Lord Shiva's advice and harboring negative
    thoughts towards Shri Ram. Upon returning to Shiva, she is filled with sorrow
    and remorse. Shiva, through meditation, learns of Sati's actions and recalls his
    vow. Despite his love for Sati, he decides to uphold his vow, leading to a silent
    separation. Eventually, they reconcile, and Shiva comforts Sati, restoring her
    happiness.
  summary_hi: देवी सती भगवान शिव की सलाह न मानने और श्रीराम के प्रति नकारात्मक विचार
    रखने के कारण पछताती हैं। शिव के पास लौटने पर वह दुख और पश्चाताप से भर जाती हैं।
    शिव ध्यान के माध्यम से सती के कार्यों को जान लेते हैं और अपनी प्रतिज्ञा को याद
    करते हैं। सती के प्रति अपने प्रेम के बावजूद, वह अपनी प्रतिज्ञा को निभाने का निर्णय
    लेते हैं, जिससे एक मौन अलगाव होता है। अंततः वे सुलह कर लेते हैं और शिव सती को
    सांत्वना देते हैं, जिससे उनकी खुशी लौट आती है।
- id: sati-shiva-reunion
  type: story
  keywords:
  - Sati
  - Shiva
  - reunion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 25
  summary_en: Sati, feeling distressed, approaches Shiva and offers her respects.
    Shiva, with a generous heart, welcomes her and engages in delightful conversations,
    alleviating her sorrow. They enjoy each other's company, emphasizing their inseparable
    bond.
  summary_hi: सती, दुखी मन से शिव के पास जाती हैं और उन्हें प्रणाम करती हैं। शिव उदार
    हृदय से उनका स्वागत करते हैं और मनोहर वार्तालाप में संलग्न होते हैं, जिससे सती
    का दुख दूर हो जाता है। वे एक-दूसरे की संगति का आनंद लेते हैं, जो उनके अविभाज्य
    संबंध को दर्शाता है।
- id: daksha-curses-rudra
  type: event
  keywords:
  - Daksha
  - Rudra
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand)
  summary_en: Daksha, in anger, curses Rudra (Shiva) to be excluded from the Yagna,
    declaring him unworthy due to his association with ghosts and his residence in
    cremation grounds. Daksha's disdain for Rudra stems from his perception of Rudra's
    non-conformity to Vedic rituals.
  summary_hi: दक्ष ने क्रोधित होकर रुद्र (शिव) को यज्ञ से बहिष्कृत कर दिया, उन्हें
    भूतों के साथ रहने और श्मशान में निवास करने के कारण अयोग्य घोषित किया। दक्ष की
    रुद्र के प्रति अवमानना उनके वैदिक अनुष्ठानों के प्रति असंगतता के कारण थी।
- id: nandi-curses-daksha
  type: event
  keywords:
  - Nandi
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand)
  summary_en: Nandi, a devotee of Shiva, becomes enraged upon hearing Daksha's curse
    and retaliates by cursing Daksha and his followers. Nandi condemns Daksha for
    his arrogance and ignorance of Shiva's true nature.
  summary_hi: शिव के भक्त नंदी, दक्ष के शाप को सुनकर क्रोधित हो जाते हैं और दक्ष तथा
    उनके अनुयायियों को शाप देते हैं। नंदी दक्ष की अहंकारिता और शिव के वास्तविक स्वरूप
    की अज्ञानता की निंदा करते हैं।
- id: daksha-curses-nandi
  type: event
  keywords:
  - Daksha
  - Nandi
  - curse
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a fit of anger, Daksha curses Nandi and the followers of Shiva, declaring
    them to be outside the Vedic path and indulging in heretical practices. This curse
    is a result of Daksha's disdain for Shiva and his followers.
  summary_hi: क्रोधित होकर दक्ष ने नंदी और शिव के अनुयायियों को शाप दिया, उन्हें वेदों
    के मार्ग से बाहर और विधर्मी आचरणों में लिप्त बताया। यह शाप दक्ष की शिव और उनके
    अनुयायियों के प्रति घृणा का परिणाम था।
- id: nandi-curses-brahmins
  type: event
  keywords:
  - Nandi
  - Brahmins
  - curse
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In response to Daksha's curse, Nandi, a devoted follower of Shiva, curses
    the Brahmins who oppose Shiva, predicting that they will become ignorant of true
    knowledge and indulge in material pleasures.
  summary_hi: दक्ष के शाप के जवाब में, शिव के भक्त नंदी ने उन ब्राह्मणों को शाप दिया
    जो शिव का विरोध करते हैं, यह भविष्यवाणी करते हुए कि वे सच्चे ज्ञान से अनभिज्ञ
    हो जाएंगे और भौतिक सुखों में लिप्त रहेंगे।
- id: sadashiva-advises-nandi
  type: story
  keywords:
  - Sadashiva
  - Nandi
  - advice
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sadashiva, upon hearing Nandi's curse, advises him to remain calm and
    not to curse in anger. He explains the futility of cursing and emphasizes the
    importance of understanding the true nature of existence.
  summary_hi: सदाशिव, नंदी के शाप को सुनकर, उन्हें शांत रहने और क्रोध में शाप न देने
    की सलाह देते हैं। वे शाप देने की निरर्थकता को समझाते हैं और अस्तित्व के सच्चे
    स्वरूप को समझने के महत्व पर जोर देते हैं।
- id: nandi-enlightenment-by-shiva
  type: story
  keywords:
  - Nandi
  - Shiva
  - Enlightenment
  source:
    book: Shiv Puran
    sarga: Sati Khand, Chapter 26
  summary_en: Nandi, initially filled with anger, is enlightened by Lord Shiva and
    becomes calm and free of anger. Shiva, pleased with Nandi's transformation, returns
    to his abode with his followers.
  summary_hi: नंदी, जो पहले क्रोध से भरे हुए थे, भगवान शिव द्वारा ज्ञान प्राप्त कर
    शांत और क्रोध रहित हो जाते हैं। नंदी के इस परिवर्तन से प्रसन्न होकर शिव अपने गणों
    के साथ अपने स्थान को लौट जाते हैं।
- id: daksha-anger-towards-shiva
  type: story
  keywords:
  - Daksha
  - Shiva
  - Anger
  source:
    book: Shiv Puran
    sarga: Sati Khand, Chapter 26
  summary_en: Daksha, filled with anger towards Shiva, returns to his place with resentment
    in his heart. He remembers the curse given to Rudra and continues to harbor anger,
    criticizing Shiva and his devotees.
  summary_hi: दक्ष, शिव के प्रति क्रोध से भरे हुए, अपने स्थान पर लौट जाते हैं और उनके
    हृदय में शिव के प्रति द्वेष बना रहता है। वह रुद्र को दिए गए शाप को याद करते हैं
    और शिव तथा उनके भक्तों की निंदा करते रहते हैं।
- id: daksha-yajna-begins
  type: event
  keywords:
  - Daksha
  - Yajna
  - Ritual
  source:
    book: Shiv Puran
    sarga: Sati Khand, Chapter 27
  summary_en: Daksha begins a grand yajna, inviting all the gods and sages. However,
    influenced by Shiva's illusion, they attend the yajna without realizing the underlying
    tensions.
  summary_hi: दक्ष एक भव्य यज्ञ का आरम्भ करते हैं और सभी देवताओं तथा ऋषियों को आमंत्रित
    करते हैं। शिव की माया से प्रभावित होकर, वे सभी यज्ञ में भाग लेते हैं, बिना किसी
    अंतर्निहित तनाव को समझे।
- id: daksha-yajna-episode
  type: story
  keywords:
  - Daksha
  - Yajna
  - Veerabhadra
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Satikhanda)
  summary_en: Lord Vishnu advises Daksha to abandon his cruel intentions and reminds
    him of the consequences of Rudra's wrath. Despite Vishnu's promise to protect
    Daksha's yajna, he acknowledges the futility against Rudra's anger, as Veerabhadra,
    born from Rudra's fury, arrives to destroy the yajna. Vishnu admits his inability
    to stop Veerabhadra due to his own transgression against Shiva.
  summary_hi: भगवान विष्णु दक्ष को अपनी क्रूर बुद्धि त्यागने की सलाह देते हैं और रुद्र
    के क्रोध के परिणामों की याद दिलाते हैं। यद्यपि विष्णु दक्ष के यज्ञ की रक्षा करने
    का वचन देते हैं, वे रुद्र के क्रोध के सामने अपनी असमर्थता स्वीकार करते हैं, क्योंकि
    रुद्र के क्रोध से उत्पन्न वीरभद्र यज्ञ को नष्ट करने के लिए आता है। विष्णु अपनी
    शिव के प्रति द्रोह के कारण वीरभद्र को रोकने में असमर्थता स्वीकार करते हैं।
- id: dadheechi-distress-episode
  type: character
  keywords:
  - Dadheechi
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 27
  summary_en: Sage Dadheechi, a devotee of Lord Shiva, was deeply distressed upon
    noticing Shiva's absence at Daksha's yajna. His mind was troubled by the exclusion
    of Shiva, highlighting the tension between Daksha and Shiva's followers.
  summary_hi: भगवान शिव के भक्त ऋषि दधीचि, दक्ष के यज्ञ में शिव की अनुपस्थिति देखकर
    अत्यंत व्यथित हो गए। शिव के बहिष्कार से उनका मन अशांत हो गया, जो दक्ष और शिव के
    अनुयायियों के बीच तनाव को दर्शाता है।
- id: shiva-absence-from-yajna
  type: event
  keywords:
  - shiva
  - yajna
  source:
    book: Shiv Puran
    sarga: '2'
  summary_en: In a grand yajna organized by Daksha, the absence of Lord Shiva is noted
    by Dadhichi. Despite the presence of many gods and sages, the yajna lacks its
    full glory without Shiva. Dadhichi suggests that Shiva's presence is essential
    for the success and sanctity of the yajna.
  summary_hi: दक्ष द्वारा आयोजित एक भव्य यज्ञ में भगवान शिव की अनुपस्थिति को दधीचि
    द्वारा नोट किया जाता है। कई देवताओं और ऋषियों की उपस्थिति के बावजूद, यज्ञ शिव
    के बिना अपनी पूरी शोभा नहीं पा रहा है। दधीचि सुझाव देते हैं कि यज्ञ की सफलता और
    पवित्रता के लिए शिव की उपस्थिति आवश्यक है।
- id: dadhichi-leaves-yajna
  type: event
  keywords:
  - dadhichi
  - yajna
  source:
    book: Shiv Puran
    sarga: '2'
  summary_en: After hearing Daksha's disrespectful words towards Shiva, Dadhichi leaves
    the yajna in protest. He predicts that the yajna will not be successful without
    Shiva's presence and returns to his hermitage.
  summary_hi: शिव के प्रति दक्ष के अपमानजनक शब्द सुनने के बाद, दधीचि विरोध स्वरूप
    यज्ञ छोड़ देते हैं। वह भविष्यवाणी करते हैं कि शिव की उपस्थिति के बिना यज्ञ सफल
    नहीं होगा और अपने आश्रम लौट जाते हैं।
- id: sati-departure-episode
  type: event
  keywords:
  - Sati
  - Departure
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Upon hearing about Daksha's yajna and receiving Shiva's permission,
    Goddess Sati decided to visit her father's yajna site. Accompanied by Shiva's
    followers, she prepared to leave for the ceremony, setting the stage for the subsequent
    events.
  summary_hi: दक्ष के यज्ञ के बारे में सुनकर और शिव की आज्ञा प्राप्त कर देवी सती ने
    अपने पिता के यज्ञ स्थल पर जाने का निर्णय लिया। शिव के अनुयायियों के साथ, उन्होंने
    समारोह के लिए प्रस्थान करने की तैयारी की, जो आगे की घटनाओं की नींव रखता है।
- id: sati-learns-about-daksha-yajna
  type: event
  keywords:
  - Sati
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: '28'
  summary_en: Sati learns from her friend Vijaya that a grand yajna is being organized
    by her father, Daksha. Despite being his beloved daughter, Sati is surprised and
    hurt that she has not been invited to the event.
  summary_hi: सती अपनी सखी विजय से यह जानती हैं कि उनके पिता दक्ष एक भव्य यज्ञ का
    आयोजन कर रहे हैं। अपनी प्रिय पुत्री होने के बावजूद, सती को इस बात से आश्चर्य और
    दुख होता है कि उन्हें इस आयोजन में आमंत्रित नहीं किया गया है।
- id: sati-seeks-shiva-advice
  type: event
  keywords:
  - Sati
  - Shiva
  source:
    book: Shiv Puran
    sarga: '28'
  summary_en: Disturbed by the lack of invitation to her father's yajna, Sati decides
    to seek advice from her husband, Shiva. She approaches him with respect and asks
    why they have not been invited to the yajna.
  summary_hi: अपने पिता के यज्ञ में निमंत्रण न मिलने से व्यथित होकर सती अपने पति शिव
    से सलाह लेने का निर्णय करती हैं। वह आदरपूर्वक उनके पास जाती हैं और पूछती हैं कि
    उन्हें यज्ञ में क्यों नहीं बुलाया गया।
- id: shiva-advises-against-attending-yajna
  type: event
  keywords:
  - Shiva
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: '28'
  summary_en: Shiva advises Sati against attending her father's yajna, explaining
    that Daksha harbors animosity towards him. He warns that attending uninvited could
    lead to disrespect and greater harm.
  summary_hi: शिव सती को उनके पिता के यज्ञ में जाने से मना करते हैं, यह बताते हुए
    कि दक्ष उनके प्रति द्वेष रखते हैं। वह चेतावनी देते हैं कि बिना बुलाए जाने से अपमान
    और अधिक हानि हो सकती है।
- id: sati-daksha-yajna-episode
  type: story
  keywords:
  - Sati
  - Daksha
  - Yajna
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati, the daughter of Daksha, chose to marry Shiva despite her father's
    disapproval. During a grand yajna organized by Daksha, Shiva was not invited,
    and Sati was insulted. In her anger and sorrow, Sati immolated herself, leading
    to a series of events that caused great upheaval.
  summary_hi: सती, दक्ष की पुत्री, ने अपने पिता की असहमति के बावजूद शिव से विवाह किया।
    दक्ष द्वारा आयोजित एक भव्य यज्ञ में शिव को आमंत्रित नहीं किया गया और सती का अपमान
    किया गया। अपने क्रोध और दुःख में, सती ने आत्मदाह कर लिया, जिससे घटनाओं की एक श्रृंखला
    शुरू हुई जिसने महान उथल-पुथल पैदा की।
- id: sati-yatra-episode
  type: event
  keywords:
  - Sati
  - Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 28
  summary_en: During a grand yajna, Sati, the daughter of Daksha, arrives at her father's
    house and is disrespected by him. Despite being welcomed by her mother and sisters,
    Sati is angered by the absence of an offering for Shiva in the yajna. She questions
    Daksha's decision to exclude Shiva, highlighting Shiva's significance in the universe.
  summary_hi: एक भव्य यज्ञ के दौरान, दक्ष की पुत्री सती अपने पिता के घर पहुँचती हैं
    और उनके द्वारा अपमानित होती हैं। अपनी माता और बहनों द्वारा स्वागत किए जाने के
    बावजूद, सती यज्ञ में शिव के लिए अर्पण की अनुपस्थिति से क्रोधित हो जाती हैं। वह
    दक्ष से शिव को बाहर रखने के निर्णय पर सवाल उठाती हैं, शिव के ब्रह्मांड में महत्व
    को उजागर करती हैं।
- id: sati-reprimands-daksha
  type: story
  keywords:
  - Sati
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 29
  summary_en: Sati reprimands her father Daksha for not inviting Shiva to the yajna.
    She emphasizes Shiva's role as the purifier of the universe and questions how
    the yajna can be complete without him. Sati also addresses Vishnu and other deities,
    questioning their participation in the yajna without Shiva.
  summary_hi: सती अपने पिता दक्ष को यज्ञ में शिव को आमंत्रित न करने के लिए फटकार लगाती
    हैं। वह शिव की भूमिका को ब्रह्मांड के शुद्धिकर्ता के रूप में जोर देती हैं और पूछती
    हैं कि उनके बिना यज्ञ कैसे पूरा हो सकता है। सती विष्णु और अन्य देवताओं को भी संबोधित
    करती हैं, शिव के बिना यज्ञ में उनकी भागीदारी पर सवाल उठाती हैं।
- id: rudra-curse-episode
  type: story
  keywords:
  - rudra
  - curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Satikhanda) 449
  summary_en: In the Daruvana forest, Lord Shiva, in the guise of a beggar, was cursed
    by the sages. Despite being cursed, Rudra (Shiva) performed a deed that the sages
    seem to have forgotten, where his linga burned the entire world including all
    living and non-living entities.
  summary_hi: दारुवन में, भगवान शिव भिक्षुक के रूप में थे और उन्हें ऋषियों द्वारा
    शाप दिया गया। शापित होने के बावजूद, रुद्र (शिव) ने एक ऐसा कार्य किया जिसे ऋषि
    भूल गए हैं, जहाँ उनके लिंग से समस्त चराचर सहित समस्त भुवन जलने लगा।
- id: sati-daksha-confrontation
  type: story
  keywords:
  - sati
  - daksha
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati confronts her father Daksha at the sacrificial ceremony. She questions
    the absence of Lord Shiva and criticizes Daksha for not inviting him. Daksha,
    in turn, insults Shiva and tells Sati that she has no business there, prompting
    her to become angry and distressed.
  summary_hi: सती अपने पिता दक्ष का यज्ञ समारोह में सामना करती हैं। वह भगवान शिव की
    अनुपस्थिति पर सवाल उठाती हैं और दक्ष को उन्हें आमंत्रित न करने के लिए आलोचना करती
    हैं। दक्ष, बदले में, शिव का अपमान करते हैं और सती से कहते हैं कि उनका वहां कोई
    काम नहीं है, जिससे सती क्रोधित और व्यथित हो जाती हैं।
- id: sati-self-immolation-decision
  type: story
  keywords:
  - Sati
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Sati, deeply hurt by her father Daksha's disrespect towards her husband
    Shiva, decides to immolate herself in the sacrificial fire. She expresses that
    life holds no meaning for her after hearing the dishonor of her lord.
  summary_hi: सती, अपने पिता दक्ष द्वारा अपने पति शिव के प्रति अनादर से अत्यंत आहत
    होकर, यज्ञ की अग्नि में आत्मदाह करने का निर्णय लेती हैं। वह व्यक्त करती हैं कि
    अपने स्वामी का अनादर सुनने के बाद उनके लिए जीवन का कोई अर्थ नहीं है।
- id: sati-condemns-daksha
  type: story
  keywords:
  - Sati
  - Daksha
  - Shiva
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Sati condemns her father Daksha for his blasphemy against Shiva, predicting
    that he will suffer great sorrow and ultimately face punishment. She highlights
    Shiva's impartiality and questions who else could harbor enmity against him.
  summary_hi: सती अपने पिता दक्ष को शिव के प्रति निंदा के लिए धिक्कारती हैं और भविष्यवाणी
    करती हैं कि वह महान दुःख भोगेंगे और अंततः दंड का सामना करेंगे। वह शिव की निष्पक्षता
    को रेखांकित करती हैं और सवाल करती हैं कि उनके अलावा और कौन उनके प्रति वैर रख सकता
    है।
- id: sati-renounces-her-body
  type: story
  keywords:
  - Sati
  - Daksha
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 29
  summary_en: In a confrontation with her father Daksha, Sati expresses her disapproval
    of his actions and insults towards Lord Shiva. She declares that she will renounce
    her body, which she considers impure due to its association with Daksha, and subsequently
    immolates herself using her yogic powers.
  summary_hi: अपने पिता दक्ष के साथ एक टकराव में, सती अपनी असहमति और भगवान शिव के
    प्रति उनके अपमानजनक व्यवहार की निंदा करती हैं। वह घोषणा करती हैं कि वह अपने शरीर
    का त्याग करेंगी, जिसे वह दक्ष के साथ संबंध के कारण अशुद्ध मानती हैं, और अपनी योगिक
    शक्तियों का उपयोग करके स्वयं को भस्म कर लेती हैं।
- id: sati-yoga-immolation
  type: event
  keywords:
  - Sati
  - immolation
  source:
    book: Shiv Puran
    sarga: Chapter 30
  summary_en: Sati, the beloved of Shiva, enters a deep meditative state and immolates
    herself in the sacrificial fire due to the insult by her father Daksha. This act
    leads to a great uproar among the gods and Shiva's attendants.
  summary_hi: सती, शिव की प्रिय, अपने पिता दक्ष द्वारा अपमानित होने के कारण गहन ध्यान
    में जाकर यज्ञाग्नि में आत्मदाह कर लेती हैं। इस घटना से देवताओं और शिव के गणों
    में बड़ा हाहाकार मच जाता है।
- id: shiva-attendants-anger
  type: event
  keywords:
  - Shiva's attendants
  - anger
  source:
    book: Shiv Puran
    sarga: Chapter 30
  summary_en: After Sati's self-immolation, Shiva's attendants become enraged and
    prepare to attack Daksha. Their anger and the resulting chaos spread fear among
    the gods and sages present.
  summary_hi: सती के आत्मदाह के बाद, शिव के गण क्रोधित हो जाते हैं और दक्ष पर आक्रमण
    करने की तैयारी करते हैं। उनका क्रोध और resulting chaos देवताओं और उपस्थित ऋषियों
    में भय फैला देता है।
- id: sati-self-immolation-aftermath
  type: event
  keywords:
  - Sati
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand) 447
  summary_en: After witnessing Sati's self-immolation, Shiva's attendants, filled
    with rage, took up arms against Daksha's sacrificial assembly. The commotion caused
    by Shiva's attendants terrified the gods and sages present. In response, Bhrigu
    invoked powerful deities from the sacrificial fire to combat Shiva's followers.
  summary_hi: सती के आत्मदाह को देखने के बाद, शिव के गण क्रोध में भरकर दक्ष के यज्ञ
    मंडप के खिलाफ हथियार उठा लेते हैं। शिवगणों के हाहाकार से वहां उपस्थित देवता और
    ऋषि भयभीत हो जाते हैं। इसके जवाब में, भृगु ने यज्ञ अग्नि से शक्तिशाली देवताओं
    को शिव के अनुयायियों से लड़ने के लिए बुलाया।
- id: shiva-attendants-defeated
  type: event
  keywords:
  - Shiva
  - Ribhus
  - Bhrigu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand) 448
  summary_en: The Ribhus, powerful deities invoked by Bhrigu, defeated Shiva's attendants
    with ease. This event, orchestrated by Shiva's divine will, left the gods and
    sages in silence. Some began to pray to Vishnu for intervention, concerned about
    the consequences of the conflict.
  summary_hi: भृगु द्वारा बुलाए गए शक्तिशाली ऋभु देवताओं ने शिव के गणों को आसानी से
    पराजित कर दिया। यह घटना, जो शिव की इच्छा से हुई, ने देवताओं और ऋषियों को मौन कर
    दिया। कुछ लोग विष्णु से हस्तक्षेप के लिए प्रार्थना करने लगे, इस संघर्ष के परिणामों
    को लेकर चिंतित।
- id: daksha-disrespecting-sati
  type: story
  keywords:
  - Daksha
  - Sati
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Daksha, despite being warned by divine voices, disrespects his daughter
    Sati and her husband Shiva by not honoring them in a sacrificial ceremony. This
    act of disrespect leads to dire consequences for Daksha, as Sati is a revered
    goddess and Shiva is a supreme deity.
  summary_hi: दक्ष, दिव्य आवाजों द्वारा चेतावनी मिलने के बावजूद, अपनी पुत्री सती और
    उनके पति शिव का यज्ञ समारोह में सम्मान नहीं करता। इस अपमानजनक कृत्य के कारण दक्ष
    को गंभीर परिणाम भुगतने पड़ते हैं, क्योंकि सती एक पूजनीय देवी हैं और शिव एक परम
    देवता हैं।
- id: glory-of-sati
  type: character
  keywords:
  - Sati
  - Goddess
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Sati is described as a highly revered goddess, the mother of the universe,
    and the consort of Shiva. She is known for granting all kinds of blessings and
    removing fears and obstacles for her devotees. Her worship is considered highly
    auspicious and beneficial.
  summary_hi: सती को एक अत्यंत पूजनीय देवी, ब्रह्मांड की माता और शिव की अर्धांगिनी
    के रूप में वर्णित किया गया है। वह अपने भक्तों को सभी प्रकार के आशीर्वाद देने और
    भय व बाधाओं को दूर करने के लिए जानी जाती हैं। उनकी पूजा अत्यंत शुभ और लाभकारी
    मानी जाती है।
- id: shiva-supreme-deity
  type: character
  keywords:
  - Shiva
  - Supreme Deity
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Shiva is depicted as the supreme deity, worshipped by Brahma, Vishnu,
    and other gods. He is the ultimate source of welfare and is revered by sages and
    yogis who seek his vision through penance and meditation. His presence is considered
    the greatest blessing.
  summary_hi: शिव को परम देवता के रूप में चित्रित किया गया है, जिनकी ब्रह्मा, विष्णु
    और अन्य देवताओं द्वारा पूजा की जाती है। वह कल्याण के अंतिम स्रोत हैं और ऋषि व
    योगी उनके दर्शन के लिए तप और ध्यान करते हैं। उनकी उपस्थिति को सबसे बड़ा आशीर्वाद
    माना जाता है।
- id: sati-disrespect-and-curse
  type: event
  keywords:
  - Sati
  - disrespect
  - curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In this episode, Sati, the wife of Lord Shiva, is disrespected during
    a sacrificial ceremony. As a result, a divine voice curses the participants, warning
    them of destruction if they do not leave the ceremony immediately. The voice emphasizes
    the importance of respecting divine entities like Shiva and Sati.
  summary_hi: इस प्रकरण में, भगवान शिव की पत्नी सती का एक यज्ञ समारोह के दौरान अपमान
    किया जाता है। इसके परिणामस्वरूप, एक दिव्य आवाज प्रतिभागियों को चेतावनी देती है
    कि यदि वे तुरंत समारोह नहीं छोड़ते हैं तो उनका विनाश होगा। यह आवाज शिव और सती
    जैसे दिव्य व्यक्तियों के सम्मान के महत्व पर जोर देती है।
- id: divine-voice-warning
  type: event
  keywords:
  - divine voice
  - warning
  - destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: A divine voice warns all the participants of the sacrificial ceremony,
    including gods like Vishnu and Brahma, to leave immediately or face destruction.
    The voice serves as a harbinger of the consequences of disrespecting Sati and
    Shiva.
  summary_hi: एक दिव्य आवाज यज्ञ समारोह के सभी प्रतिभागियों, जिसमें विष्णु और ब्रह्मा
    जैसे देवता शामिल हैं, को तुरंत छोड़ने या विनाश का सामना करने की चेतावनी देती है।
    यह आवाज सती और शिव का अपमान करने के परिणामों की पूर्वसूचना देती है।
- id: virabhadra-creation
  type: event
  keywords:
  - virabhadra
  - creation
  source:
    book: Shiv Puran
    sarga: Section 16
  summary_en: In response to the insult and the events at Daksha's yajna, Shiva created
    Virabhadra from a lock of his hair. Virabhadra was a powerful being, fierce and
    capable of destruction, created to avenge the insult to Shiva and disrupt the
    yajna.
  summary_hi: दक्ष के यज्ञ में हुए अपमान और घटनाओं के जवाब में, शिव ने अपनी जटा से
    वीरभद्र को उत्पन्न किया। वीरभद्र एक शक्तिशाली और विनाशकारी क्षमता वाला प्राणी
    था, जिसे शिव के अपमान का बदला लेने और यज्ञ को बाधित करने के लिए बनाया गया था।
- id: birth-of-mahakali
  type: story
  keywords:
  - Mahakali
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: From another part of Shiva's hair, the terrifying goddess Mahakali is
    born. She is surrounded by millions of spirits and is described as extremely fearsome.
  summary_hi: शिव की जटा के दूसरे भाग से भयंकर देवी महाकाली का जन्म होता है। वह करोड़ों
    भूतों से घिरी हुई और अत्यंत भयंकर बताई गई हैं।
- id: shiva-creates-fevers
  type: story
  keywords:
  - Shiva
  - Fevers
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: From the breath of the enraged Shiva, a hundred types of fevers and
    thirteen types of ailments are created. These manifestations are described as
    fearsome and capable of terrifying the world.
  summary_hi: क्रोधित शिव के निःश्वास से सौ प्रकार के ज्वर और तेरह प्रकार के रोग उत्पन्न
    होते हैं। ये सभी मूर्तियाँ भयंकर और संसार को भयभीत करने वाली बताई गई हैं।
- id: shiva-orders-veerabhadra
  type: story
  keywords:
  - Shiva
  - Veerabhadra
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Satikhand
  summary_en: In this episode, Lord Shiva instructs Veerabhadra to destroy Daksha's
    yajna (sacrifice) as Daksha has become arrogant and opposed to Shiva. Veerabhadra
    is ordered to burn the yajna and all participants, including any gods present,
    and return swiftly to Shiva.
  summary_hi: इस प्रकरण में, भगवान शिव वीरभद्र को दक्ष के यज्ञ को नष्ट करने का आदेश
    देते हैं क्योंकि दक्ष अहंकारी हो गया है और शिव का विरोध कर रहा है। वीरभद्र को
    यज्ञ और सभी प्रतिभागियों को, जिनमें कोई भी देवता उपस्थित हों, जलाकर शीघ्रता से
    शिव के पास लौटने का आदेश दिया जाता है।
- id: virabhadra-creation-and-shiva-instruction
  type: story
  keywords:
  - Virabhadra
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 32
  summary_en: In this episode, Lord Shiva, in his anger, creates the fierce warrior
    Virabhadra to destroy Daksha's sacrificial ceremony. Shiva instructs Virabhadra
    to annihilate Daksha and his followers, and then return to him. Virabhadra, along
    with a massive army of Shiva's attendants, sets out to fulfill Shiva's command.
  summary_hi: इस प्रकरण में, भगवान शिव अपने क्रोध में वीर योद्धा वीरभद्र की रचना करते
    हैं ताकि दक्ष के यज्ञ समारोह को नष्ट कर सकें। शिव वीरभद्र को दक्ष और उसके अनुयायियों
    को नष्ट करने और फिर उनके पास लौटने का निर्देश देते हैं। वीरभद्र, शिव के अनुचरों
    की विशाल सेना के साथ, शिव के आदेश को पूरा करने के लिए निकल पड़ते हैं।
- id: virabhadra-march-to-destroy-daksha-yajna
  type: event
  keywords:
  - Virabhadra
  - Daksha Yajna
  - Shiva's army
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 33
  summary_en: Virabhadra, accompanied by Mahakali and a vast army of Shiva's attendants,
    marches towards Daksha's sacrificial site to destroy it. The army includes various
    fierce beings like Bhairavas, Yoginis, and other supernatural entities. As they
    proceed, flowers rain down from the heavens, and the army is filled with enthusiasm
    for the task ahead.
  summary_hi: वीरभद्र, महाकाली और शिव के अनुचरों की विशाल सेना के साथ, दक्ष के यज्ञ
    स्थल को नष्ट करने के लिए आगे बढ़ते हैं। इस सेना में भैरव, योगिनी और अन्य अलौकिक
    प्राणी शामिल हैं। जैसे ही वे आगे बढ़ते हैं, आकाश से फूलों की वर्षा होती है और
    सेना आगामी कार्य के लिए उत्साह से भर जाती है।
- id: mahakali-daksha-yajna-destruction
  type: event
  keywords:
  - Mahakali
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 33
  summary_en: Mahakali, along with other goddesses and spirits, sets out to destroy
    Daksha's Yajna as per Shiva's command. This event marks the divine intervention
    to stop the sacrificial ritual led by Daksha.
  summary_hi: महाकाली अन्य देवियों और भूतगणों के साथ, शिव की आज्ञा से दक्ष के यज्ञ
    को नष्ट करने के लिए चल पड़ती हैं। यह घटना दक्ष द्वारा आयोजित यज्ञ को रोकने के
    लिए दिव्य हस्तक्षेप का प्रतीक है।
- id: shiva-gana-daksha-yajna-destruction
  type: event
  keywords:
  - Shiva Gana
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 33
  summary_en: Shiva's followers, including various spirits and beings, march towards
    Daksha's Yajna to destroy it. This massive assembly of Shiva's forces signifies
    the divine retribution against Daksha's actions.
  summary_hi: शिव के अनुयायी, जिनमें विभिन्न भूत और प्राणी शामिल हैं, दक्ष के यज्ञ
    को नष्ट करने के लिए आगे बढ़ते हैं। शिव की सेनाओं की यह विशाल सभा दक्ष के कार्यों
    के खिलाफ दिव्य प्रतिशोध का प्रतीक है।
- id: virabhadra-march-daksha-yajna
  type: event
  keywords:
  - Virabhadra
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 33
  summary_en: Virabhadra, a fierce warrior created by Shiva, leads a massive army
    to destroy Daksha's Yajna. The march is accompanied by ominous sounds and portents,
    highlighting the impending doom of Daksha's ritual.
  summary_hi: वीरभद्र, जो शिव द्वारा रचित एक प्रचंड योद्धा है, दक्ष के यज्ञ को नष्ट
    करने के लिए एक विशाल सेना का नेतृत्व करता है। इस यात्रा के दौरान भयानक ध्वनियाँ
    और शकुन होते हैं, जो दक्ष के अनुष्ठान के आसन्न विनाश को दर्शाते हैं।
- id: ominous-signs-at-daksha-yajna
  type: event
  keywords:
  - Daksha
  - Yajna
  - Omens
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 34
  summary_en: As Veerabhadra set out with his followers, Daksha and the gods witnessed
    numerous ominous signs indicating impending doom. These included earthquakes,
    strange celestial phenomena, and unsettling natural occurrences, all suggesting
    the destruction of Daksha's yajna.
  summary_hi: वीरभद्र के गणों सहित प्रस्थान करने पर दक्ष और देवताओं ने अनेक अशुभ लक्षण
    देखे, जो यज्ञ के विध्वंस की सूचना दे रहे थे। इनमें भूकंप, अद्भुत नक्षत्रीय घटनाएँ,
    और अन्य प्राकृतिक उत्पात शामिल थे, जो दक्ष के यज्ञ के विनाश का संकेत दे रहे थे।
- id: daksha-yajna-omens
  type: event
  keywords:
  - Daksha
  - omens
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 34
  summary_en: During Daksha's yajna, ominous signs appeared, such as rain of blood
    and darkness covering the skies, causing fear among the gods including Vishnu.
    An ethereal voice condemned Daksha, predicting great sorrow due to his actions
    against Shiva.
  summary_hi: दक्ष के यज्ञ के दौरान, रक्त की वर्षा और आकाश में अंधकार जैसे अपशकुन
    प्रकट हुए, जिससे विष्णु सहित देवताओं में भय व्याप्त हो गया। एक आकाशवाणी ने दक्ष
    की निंदा की और शिव के खिलाफ उसके कार्यों के कारण महान दुःख की भविष्यवाणी की।
- id: daksha-seeks-vishnu-help
  type: story
  keywords:
  - Daksha
  - Vishnu
  - yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 35
  summary_en: Daksha, frightened by the omens and the ethereal voice, seeks refuge
    in Vishnu, pleading for protection of his yajna. Vishnu, however, explains his
    inability to avert the consequences of Daksha's disrespect towards Shiva.
  summary_hi: अपशकुन और आकाशवाणी से भयभीत दक्ष ने अपने यज्ञ की रक्षा के लिए विष्णु
    की शरण ली। विष्णु ने दक्ष को समझाया कि शिव के प्रति उसके अपमान के परिणामों को
    टालने में वह असमर्थ हैं।
- id: shiva-destroyer-of-shivadrohis
  type: concept
  keywords:
  - shiva
  - shivadrohi
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: The passage describes the fate of those who oppose Lord Shiva, known
    as Shivadrohis. It is said that such individuals face severe punishments in the
    afterlife, including being thrown into boiling oil by Yama, the god of death.
    The narrative emphasizes the inevitability of suffering for those who betray Shiva.
  summary_hi: यह अंश उन लोगों के भाग्य का वर्णन करता है जो भगवान शिव का विरोध करते
    हैं, जिन्हें शिवद्रोही कहा जाता है। कहा जाता है कि ऐसे व्यक्तियों को मृत्यु के
    बाद यमराज द्वारा उबलते तेल में फेंकने जैसी कठोर सजा मिलती है। यह कथा शिव के साथ
    विश्वासघात करने वालों के लिए दुख की अनिवार्यता पर जोर देती है।
- id: virabhadra-arrival-at-sacrificial-altar
  type: event
  keywords:
  - virabhadra
  - sacrifice
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: The passage narrates the arrival of Virabhadra at the sacrificial altar.
    As Vishnu sits silently with a worried expression, Virabhadra, accompanied by
    a vast army, arrives at the scene, witnessed by the gods. This marks a significant
    moment in the conflict between Shiva's followers and the other deities.
  summary_hi: यह अंश वीरभद्र के यज्ञमंडप में आगमन का वर्णन करता है। जब विष्णु चिंतित
    मुखमुद्रा के साथ चुपचाप बैठे होते हैं, तब वीरभद्र विशाल सेना के साथ वहाँ पहुँचते
    हैं, जिसे देवताओं ने देखा। यह शिव के अनुयायियों और अन्य देवताओं के बीच संघर्ष
    का एक महत्वपूर्ण क्षण है।
- id: indra-prepares-for-battle
  type: event
  keywords:
  - indra
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: Indra, along with other deities, prepares for battle against Virabhadra.
    Mounted on various celestial vehicles, the gods, including Agni, Yama, and Varuna,
    ready themselves for the impending conflict. This preparation underscores the
    tension and the scale of the confrontation with Shiva's forces.
  summary_hi: इंद्र अन्य देवताओं के साथ वीरभद्र के खिलाफ युद्ध की तैयारी करते हैं।
    विभिन्न दिव्य वाहनों पर सवार होकर, अग्नि, यम और वरुण सहित देवता आगामी संघर्ष के
    लिए तैयार होते हैं। यह तैयारी शिव की सेनाओं के साथ टकराव के तनाव और पैमाने को
    दर्शाती है।
- id: daksha-yajna-battle
  type: event
  keywords:
  - Daksha
  - Yajna
  - Battle
  source:
    book: Shiv Puran
    sarga: Sati Khanda
  summary_en: A great battle ensues between the devas and Shiva's followers during
    Daksha's yajna. Despite the devas' efforts, Shiva's forces, led by Veerabhadra,
    overpower them. The devas, including Indra, are eventually defeated and retreat
    to their heavenly abode.
  summary_hi: दक्ष के यज्ञ के दौरान देवताओं और शिव के अनुयायियों के बीच एक महान युद्ध
    होता है। देवताओं के प्रयासों के बावजूद, वीरभद्र के नेतृत्व में शिव की सेनाएँ उन्हें
    पराजित कर देती हैं। अंततः इंद्र सहित देवता पराजित होकर अपने स्वर्गीय लोक को लौट
    जाते हैं।
- id: indra-seeks-guidance-from-brihaspati
  type: story
  keywords:
  - Indra
  - Brihaspati
  - guidance
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Indra and other gods approach Brihaspati for guidance on how to achieve
    victory in a battle. Brihaspati advises them, recalling Vishnu's earlier words
    and emphasizing the importance of devotion to Shiva.
  summary_hi: इन्द्र और अन्य देवता बृहस्पति के पास युद्ध में विजय प्राप्त करने के
    लिए मार्गदर्शन के लिए जाते हैं। बृहस्पति उन्हें सलाह देते हैं, विष्णु के पूर्व
    के शब्दों को याद करते हुए और शिव की भक्ति के महत्व पर जोर देते हैं।
- id: veerabhadra-attacks-the-gods
  type: story
  keywords:
  - Veerabhadra
  - gods
  - attack
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Veerabhadra, filled with anger, attacks the gods with sharp arrows,
    causing them to flee in all directions. After the gods retreat, Veerabhadra approaches
    the sacrificial site with his followers.
  summary_hi: वीरभद्र, क्रोध से भरकर, तीक्ष्ण बाणों से देवताओं पर हमला करते हैं, जिससे
    वे सभी दिशाओं में भाग जाते हैं। देवताओं के पीछे हटने के बाद, वीरभद्र अपने अनुयायियों
    के साथ यज्ञ स्थल के पास पहुँचते हैं।
- id: sages-plead-to-vishnu-for-protection
  type: story
  keywords:
  - sages
  - Vishnu
  - protection
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The sages, terrified by the events, humbly approach Vishnu, pleading
    for the protection of Daksha's sacrifice. They acknowledge Vishnu as the embodiment
    and protector of the sacrifice.
  summary_hi: ऋषिगण, घटनाओं से भयभीत होकर, विनम्रता से विष्णु के पास जाते हैं और दक्ष
    के यज्ञ की रक्षा के लिए प्रार्थना करते हैं। वे विष्णु को यज्ञ का स्वरूप और रक्षक
    मानते हैं।
- id: virabhadra-vishnu-confrontation
  type: story
  keywords:
  - Virabhadra
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Virabhadra confronts Vishnu at Daksha's sacrifice, questioning his allegiance
    to Shiva and his role in protecting the sacrifice. Virabhadra challenges Vishnu,
    expressing his intent to defeat him for violating Shiva's oath.
  summary_hi: वीरभद्र दक्ष के यज्ञ में विष्णु का सामना करते हैं, शिव के प्रति उनकी
    निष्ठा और यज्ञ की रक्षा में उनकी भूमिका पर सवाल उठाते हैं। वीरभद्र विष्णु को चुनौती
    देते हैं और शिव के शपथ का उल्लंघन करने के लिए उन्हें हराने की अपनी मंशा व्यक्त
    करते हैं।
- id: vishnu-response-to-virabhadra
  type: story
  keywords:
  - Vishnu
  - Virabhadra
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Vishnu responds to Virabhadra's challenge, explaining his presence at
    the sacrifice as a result of Daksha's repeated invitations. He emphasizes his
    devotion to Shiva and clarifies that he is not against Rudra, but was compelled
    by Daksha's devotion.
  summary_hi: विष्णु वीरभद्र की चुनौती का जवाब देते हैं, यह बताते हुए कि वह दक्ष के
    बार-बार आमंत्रण के कारण यज्ञ में उपस्थित हैं। वह शिव के प्रति अपनी भक्ति पर जोर
    देते हैं और स्पष्ट करते हैं कि वह रुद्र के खिलाफ नहीं हैं, बल्कि दक्ष की भक्ति
    के कारण बाध्य हैं।
- id: vishnu-veerabhadra-dialogue
  type: story
  keywords:
  - Vishnu
  - Veerabhadra
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 36
  summary_en: In this episode, Lord Vishnu and Veerabhadra engage in a dialogue before
    the battle at Daksha's Yajna. Vishnu assures Veerabhadra that he is a devotee
    of Shiva and has come to the Yajna because Daksha is his devotee. Veerabhadra,
    pleased with Vishnu's words, acknowledges the unity between Shiva and Vishnu and
    prepares for battle.
  summary_hi: इस प्रकरण में, भगवान विष्णु और वीरभद्र दक्ष के यज्ञ में युद्ध से पहले
    संवाद करते हैं। विष्णु वीरभद्र को आश्वस्त करते हैं कि वे शिव के भक्त हैं और यज्ञ
    में इसलिए आए हैं क्योंकि दक्ष उनके भक्त हैं। वीरभद्र, विष्णु के शब्दों से प्रसन्न
    होकर, शिव और विष्णु की एकता को स्वीकार करते हैं और युद्ध की तैयारी करते हैं।
- id: battle-of-veerabhadra-and-vishnu
  type: event
  keywords:
  - Battle
  - Veerabhadra
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 36
  summary_en: The battle between Veerabhadra and Vishnu is described, where Veerabhadra,
    empowered by Shiva's blessings, fights against Vishnu. Both sides prepare for
    the battle with their respective armies, and the sound of conch shells and war
    cries fill the air as the battle commences.
  summary_hi: वीरभद्र और विष्णु के बीच युद्ध का वर्णन किया गया है, जहां वीरभद्र, शिव
    के आशीर्वाद से सशक्त होकर, विष्णु के खिलाफ लड़ते हैं। दोनों पक्ष अपनी-अपनी सेनाओं
    के साथ युद्ध की तैयारी करते हैं, और शंखों की ध्वनि और युद्ध के नारों से आकाश गूंज
    उठता है।
- id: indra-nandi-battle
  type: story
  keywords:
  - Indra
  - Nandi
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Indra and Nandi engage in a fierce battle, each trying to outdo the
    other with various attacks. Despite their rivalry, they fight with mutual respect
    and admiration.
  summary_hi: इन्द्र और नन्दी एक भयंकर युद्ध में संलग्न होते हैं, जहाँ वे एक-दूसरे
    को विभिन्न प्रहारों से पराजित करने की कोशिश करते हैं। उनके बीच प्रतिद्वंद्विता
    के बावजूद, वे परस्पर सम्मान और प्रशंसा के साथ लड़ते हैं।
- id: agni-yama-battle
  type: story
  keywords:
  - Agni
  - Yama
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Agni, filled with intense anger, attacks with his power, while Yama,
    the leader of the Ganas, engages in a fierce battle, remembering Lord Shiva with
    joy.
  summary_hi: अग्नि, अत्यधिक क्रोध से भरे हुए, अपनी शक्ति से प्रहार करते हैं, जबकि
    गणों के नेता यमराज, शिवजी का ध्यान करते हुए एक घनघोर युद्ध में संलग्न होते हैं।
- id: chanda-nirriti-battle
  type: story
  keywords:
  - Chanda
  - Nirriti
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The mighty Chanda confronts Nirriti, dismissing him with powerful weapons,
    and engages in a fierce battle.
  summary_hi: महान बलशाली चण्ड निर्क्रति का तिरस्कार करते हुए बड़े-बड़े अस्त्रों से
    उनके साथ युद्ध करते हैं।
- id: mund-varuna-battle
  type: story
  keywords:
  - Mund
  - Varuna
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The powerful Mund amazes the three worlds with his strength as he battles
    Varuna with great skill.
  summary_hi: महाबलवान् मुण्ड अपनी उत्तम शक्ति से त्रिलोकी को विस्मित करते हुए वरुण
    के साथ युद्ध करते हैं।
- id: bhairava-yogini-battle
  type: story
  keywords:
  - Bhairava
  - Yogini
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Bhairava, accompanied by a group of Yoginis, tears through the gods
    and drinks their blood in a fearsome display.
  summary_hi: महान भैरवीपति योगिनियों के समूह के साथ देवताओं को विदीर्ण करके उनका
    रक्त पीते हैं।
- id: vishnu-chakra-battle
  type: story
  keywords:
  - Vishnu
  - Chakra
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Vishnu, the destroyer of enemies, engages in battle, hurling his
    chakra with great speed, burning the ten directions.
  summary_hi: शत्रुओं का संहार करने वाले भगवान विष्णु युद्ध में संलग्न होते हैं और
    अपने चक्र को वेगपूर्वक फेंकते हैं, जिससे दसों दिशाएँ जलने लगती हैं।
- id: virabhadra-vishnu-battle
  type: event
  keywords:
  - Virabhadra
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A fierce battle takes place between the powerful Virabhadra and Lord
    Vishnu. Vishnu, wielding his chakra, fights with Virabhadra, who remembers Lord
    Shiva and destroys Vishnu's army with his trident. The battle is intense, with
    both sides displaying immense power.
  summary_hi: वीरभद्र और भगवान विष्णु के बीच एक भयंकर युद्ध होता है। विष्णु अपने चक्र
    के साथ वीरभद्र से लड़ते हैं, जो भगवान शिव का स्मरण करके अपने त्रिशूल से विष्णु
    की सेना को नष्ट कर देते हैं। यह युद्ध बहुत ही तीव्र होता है, जिसमें दोनों पक्ष
    अपार शक्ति का प्रदर्शन करते हैं।
- id: virabhadra-stops-vishnu-chakra
  type: event
  keywords:
  - Virabhadra
  - Vishnu
  - Chakra
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: During the battle, Virabhadra, empowered by Lord Shiva, stops Vishnu's
    powerful chakra from moving. Despite Vishnu's efforts, the chakra remains immobilized
    due to Shiva's influence, showcasing the divine power of Shiva through Virabhadra.
  summary_hi: युद्ध के दौरान, भगवान शिव की शक्ति से प्रेरित वीरभद्र, विष्णु के शक्तिशाली
    चक्र को रोक देते हैं। विष्णु के प्रयासों के बावजूद, शिव के प्रभाव के कारण चक्र
    स्थिर रहता है, जो वीरभद्र के माध्यम से शिव की दिव्य शक्ति को दर्शाता है।
- id: virabhadra-defeats-yajna
  type: event
  keywords:
  - Virabhadra
  - Yajna
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Virabhadra disrupts the sacrificial ceremony by defeating the deities
    and sages who were supporting it. He captures and punishes several sages and gods,
    including Prajapati and Kashyapa, demonstrating his formidable power and the wrath
    of Shiva.
  summary_hi: वीरभद्र यज्ञ समारोह को बाधित करते हैं और इसे समर्थन देने वाले देवताओं
    और ऋषियों को पराजित करते हैं। वह प्रजापति और कश्यप सहित कई ऋषियों और देवताओं को
    पकड़कर दंडित करते हैं, जो उनकी अपार शक्ति और शिव के क्रोध को दर्शाता है।
- id: virabhadra-destroys-yajna
  type: event
  keywords:
  - Virabhadra
  - Yajna
  - Destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand) 475-476
  summary_en: Virabhadra, created by Lord Shiva, wreaks havoc at Daksha's Yajna. He
    defeats the gods and sages present, destroys the sacrificial rituals, and causes
    chaos. The Yajna is left in ruins, and the gods flee in fear.
  summary_hi: भगवान शिव द्वारा उत्पन्न वीरभद्र दक्ष के यज्ञ में भारी उपद्रव मचाते
    हैं। वे उपस्थित देवताओं और ऋषियों को पराजित करते हैं, यज्ञीय अनुष्ठानों को नष्ट
    करते हैं और अराजकता फैलाते हैं। यज्ञ खंडहर में बदल जाता है और देवता भयभीत होकर
    भाग जाते हैं।
- id: virabhadra-punishes-daksha
  type: event
  keywords:
  - Virabhadra
  - Daksha
  - Punishment
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Sati Khand) 475-476
  summary_en: Virabhadra captures Daksha, who is hiding in fear, and punishes him
    by severing his head and throwing it into the sacrificial fire. This act signifies
    the culmination of Virabhadra's wrath against Daksha for his disrespect towards
    Shiva.
  summary_hi: वीरभद्र भय के मारे छिपे हुए दक्ष को पकड़ते हैं और उनका सिर काटकर यज्ञ
    अग्नि में फेंक देते हैं। यह कृत्य दक्ष के प्रति वीरभद्र के क्रोध की पराकाष्ठा
    को दर्शाता है, जो शिव के प्रति उनके अपमान के कारण हुआ।
- id: virabhadra-destruction-of-daksha-yajna
  type: event
  keywords:
  - Virabhadra
  - Daksha Yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 37
  summary_en: Virabhadra, after destroying Daksha's Yajna, performed a terrifying
    laugh that echoed through the three worlds. Pleased with his actions, Shiva appointed
    Virabhadra as the leader of his Ganas.
  summary_hi: वीरभद्र ने दक्ष के यज्ञ को नष्ट करने के बाद भयानक अट्टहास किया जो तीनों
    लोकों में गूंज उठा। शिवजी ने उनके कार्य से प्रसन्न होकर उन्हें गणों का अध्यक्ष
    बना दिया।
- id: dadheechi-curse-on-vishnu
  type: event
  keywords:
  - Dadheechi
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 38
  summary_en: Sage Dadheechi cursed Lord Vishnu due to a dispute with King Kshuva,
    which led to Vishnu losing his wisdom and participating in Daksha's Yajna, resulting
    in his humiliation.
  summary_hi: दधीचि मुनि ने राजा क्षुव के साथ विवाद के कारण भगवान विष्णु को शाप दिया,
    जिससे विष्णु ने अपनी बुद्धि खो दी और दक्ष के यज्ञ में भाग लिया, जहाँ उनका अपमान
    हुआ।
- id: dadheechi-kshuva-dispute
  type: event
  keywords:
  - Dadheechi
  - Kshuva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 38
  summary_en: A significant dispute arose between Sage Dadheechi and King Kshuva over
    the superiority of Brahmins, leading to a conflict that became famous across the
    three worlds.
  summary_hi: दधीचि मुनि और राजा क्षुव के बीच ब्राह्मणों की श्रेष्ठता को लेकर एक महत्वपूर्ण
    विवाद उत्पन्न हुआ, जो तीनों लोकों में प्रसिद्ध हो गया।
- id: dadheechi-resurrection-by-shukra
  type: story
  keywords:
  - Dadheechi
  - Shukracharya
  - resurrection
  source:
    book: Shiv Puran
    sarga: अ० ३ IIo
  summary_en: In a confrontation with Kshuva, the sage Dadheechi is struck down and
    killed. However, Shukracharya, a master of resurrection, revives Dadheechi by
    rejoining his body, demonstrating his profound yogic powers and devotion to Shiva.
  summary_hi: क्षुव के साथ एक संघर्ष में, ऋषि दधीचि मारे जाते हैं। हालांकि, शुक्राचार्य,
    जो पुनर्जीवन के विशेषज्ञ हैं, दधीचि के शरीर को पुनः जोड़कर उन्हें पुनर्जीवित करते
    हैं, जिससे उनकी गहन योगिक शक्तियों और शिव के प्रति भक्ति का प्रदर्शन होता है।
- id: maha-mrityunjaya-mantra-initiation
  type: practice
  keywords:
  - Maha Mrityunjaya Mantra
  - initiation
  - Shukracharya
  source:
    book: Shiv Puran
    sarga: अ० ३ IIo
  summary_en: Shukracharya initiates Dadheechi into the Maha Mrityunjaya Mantra, a
    powerful Vedic chant dedicated to Lord Shiva, known for its ability to conquer
    death and bestow longevity. This mantra is revered for its spiritual significance
    and protective qualities.
  summary_hi: शुक्राचार्य दधीचि को महामृत्युंजय मंत्र में दीक्षा देते हैं, जो भगवान
    शिव को समर्पित एक शक्तिशाली वैदिक मंत्र है, जो मृत्यु पर विजय पाने और दीर्घायु
    प्रदान करने के लिए जाना जाता है। यह मंत्र अपनी आध्यात्मिक महत्ता और सुरक्षात्मक
    गुणों के लिए पूजनीय है।
- id: dadhichi-receives-mahamrityunjaya-mantra
  type: story
  keywords:
  - Dadhichi
  - Mahamrityunjaya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Sage Dadhichi receives the Mahamrityunjaya mantra from Shukracharya
    and goes to the forest to perform penance while meditating on Lord Shiva. Through
    his devotion and the power of the mantra, he pleases Shiva, who appears before
    him and grants him three boons.
  summary_hi: ऋषि दधीचि शुक्राचार्य से महामृत्युंजय मंत्र प्राप्त करते हैं और शिवजी
    का ध्यान करते हुए वन में तपस्या करने जाते हैं। अपनी भक्ति और मंत्र की शक्ति से
    वे शिव को प्रसन्न करते हैं, जो उनके सामने प्रकट होते हैं और उन्हें तीन वरदान देते
    हैं।
- id: shiva-grants-boons-to-dadhichi
  type: story
  keywords:
  - Shiva
  - Boons
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: 'Lord Shiva, pleased with Dadhichi''s penance and devotion, appears
    before him and grants him three boons: the strength of a vajra (thunderbolt),
    invincibility, and freedom from all forms of misery.'
  summary_hi: 'भगवान शिव, दधीचि की तपस्या और भक्ति से प्रसन्न होकर, उनके सामने प्रकट
    होते हैं और उन्हें तीन वरदान देते हैं: वज्र की शक्ति, अवध्यता, और सभी प्रकार की
    पीड़ा से मुक्ति।'
- id: dadheechi-boon-story
  type: story
  keywords:
  - Dadheechi
  - boon
  - Shiva
  source:
    book: Shiv Puran
    sarga: द्वितीय रुद्रसंहिता, द्वितीय सतीखण्ड, अध्याय ३८
  summary_en: 'Sage Dadheechi requests three boons from Lord Shiva: that his bones
    become indestructible, that he cannot be killed by anyone, and that he remains
    undefeated. Shiva grants these boons, and Dadheechi becomes invincible. Later,
    he uses his newfound power to strike King Kshuva with his foot, demonstrating
    his invulnerability.'
  summary_hi: 'ऋषि दधीचि भगवान शिव से तीन वरदान मांगते हैं: उनकी हड्डियाँ अजेय हो
    जाएँ, कोई उन्हें मार न सके, और वे सर्वथा अदीन रहें। शिव उन्हें ये वरदान देते हैं,
    जिससे दधीचि अजेय हो जाते हैं। बाद में, वे अपनी नई शक्ति का प्रदर्शन करते हुए राजा
    क्षुव को अपने पैर से प्रहार करते हैं।'
- id: kshuva-dadheechi-conflict
  type: event
  keywords:
  - Kshuva
  - Dadheechi
  - conflict
  source:
    book: Shiv Puran
    sarga: द्वितीय रुद्रसंहिता, द्वितीय सतीखण्ड, अध्याय ३८
  summary_en: King Kshuva, angered by Dadheechi's actions, attempts to retaliate by
    striking Dadheechi with a thunderbolt. However, due to Shiva's boon, Dadheechi
    remains unharmed, leaving Kshuva astonished. This conflict highlights the power
    of Shiva's protection over his devotees.
  summary_hi: राजा क्षुव, दधीचि की हरकतों से क्रोधित होकर, दधीचि पर वज्र से प्रहार
    करने का प्रयास करते हैं। हालांकि, शिव के वरदान के कारण दधीचि को कोई नुकसान नहीं
    होता, जिससे क्षुव आश्चर्यचकित रह जाते हैं। यह संघर्ष शिव के भक्तों पर उनकी सुरक्षा
    की शक्ति को दर्शाता है।
- id: vishnu-intervenes-in-conflict
  type: event
  keywords:
  - Vishnu
  - intervention
  - conflict
  source:
    book: Shiv Puran
    sarga: द्वितीय रुद्रसंहिता, द्वितीय सतीखण्ड, अध्याय ३८
  summary_en: Lord Vishnu intervenes in the conflict between King Kshuva and Sage
    Dadheechi. Acknowledging Dadheechi's invulnerability due to Shiva's boon, Vishnu
    advises Kshuva against further aggression, warning that it could lead to a curse.
    Vishnu's intervention prevents further escalation of the conflict.
  summary_hi: भगवान विष्णु राजा क्षुव और ऋषि दधीचि के बीच के संघर्ष में हस्तक्षेप
    करते हैं। शिव के वरदान के कारण दधीचि की अजेयता को स्वीकार करते हुए, विष्णु क्षुव
    को आगे की आक्रामकता से बचने की सलाह देते हैं, चेतावनी देते हैं कि यह एक शाप का
    कारण बन सकता है। विष्णु का हस्तक्षेप संघर्ष को और बढ़ने से रोकता है।
- id: vishnu-disguises-as-brahmin
  type: story
  keywords:
  - Vishnu
  - Dadhichi
  - disguise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 39
  summary_en: Lord Vishnu, in order to help King Kshuva, disguises himself as a Brahmin
    and visits the sage Dadhichi's ashram. Vishnu requests a boon from Dadhichi, who
    recognizes Vishnu's true identity and acknowledges his devotion to Lord Shiva.
  summary_hi: भगवान विष्णु, राजा क्षुव की सहायता के लिए ब्राह्मण का रूप धारण कर ऋषि
    दधीचि के आश्रम में जाते हैं। विष्णु दधीचि से एक वरदान मांगते हैं, जिसे दधीचि उनकी
    असली पहचान को पहचानते हुए स्वीकार करते हैं और उनकी भगवान शिव के प्रति भक्ति को
    स्वीकार करते हैं।
- id: dadhichi-recognizes-vishnu
  type: story
  keywords:
  - Dadhichi
  - Vishnu
  - recognition
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 39
  summary_en: Sage Dadhichi recognizes Lord Vishnu despite his Brahmin disguise. He
    acknowledges Vishnu's divine nature and his own knowledge of past, present, and
    future, granted by Lord Shiva's grace.
  summary_hi: ऋषि दधीचि ब्राह्मण के वेश में भगवान विष्णु को पहचान लेते हैं। वह विष्णु
    की दिव्य प्रकृति और भगवान शिव की कृपा से प्राप्त अपने त्रिकाल ज्ञान को स्वीकार
    करते हैं।
- id: dadhichi-unafraid-of-vishnu
  type: story
  keywords:
  - Dadhichi
  - fearlessness
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 39
  summary_en: Dadhichi declares his fearlessness, stating that he is not afraid of
    any deity or demon due to his devotion to Lord Shiva. He assures Vishnu that his
    fear is completely eradicated because of his dedication to Shiva.
  summary_hi: दधीचि अपनी निर्भीकता की घोषणा करते हैं, यह कहते हुए कि वह भगवान शिव
    की भक्ति के कारण किसी भी देवता या राक्षस से नहीं डरते। वह विष्णु को आश्वस्त करते
    हैं कि शिव के प्रति उनकी भक्ति के कारण उनका भय पूरी तरह से समाप्त हो गया है।
- id: dadheechi-vishnu-conflict
  type: story
  keywords:
  - Dadheechi
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda
  summary_en: In a conflict between the sage Dadheechi and Lord Vishnu, Dadheechi,
    empowered by Lord Shiva, remains unafraid of Vishnu's powerful Sudarshan Chakra.
    Despite Vishnu's attempts to attack with various divine weapons, Dadheechi's devotion
    to Shiva renders him invincible. Eventually, Dadheechi uses a handful of kusha
    grass, which transforms into a divine trident, overpowering the weapons of the
    gods.
  summary_hi: ऋषि दधीचि और भगवान विष्णु के बीच एक संघर्ष में, शिवजी की शक्ति से समर्थित
    दधीचि, विष्णु के शक्तिशाली सुदर्शन चक्र से नहीं डरते। विष्णु के विभिन्न दिव्य
    अस्त्रों के प्रयासों के बावजूद, शिवभक्ति के कारण दधीचि अजेय रहते हैं। अंततः, दधीचि
    एक मुट्ठी कुशा का उपयोग करते हैं, जो एक दिव्य त्रिशूल में बदल जाता है और देवताओं
    के अस्त्रों को पराजित कर देता है।
- id: vishnu-dadhichi-vision
  type: story
  keywords:
  - Vishnu
  - Dadhichi
  - divine-vision
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Vishnu, to amaze the sage Dadhichi, transformed into a cosmic form,
    revealing countless deities and beings within his body. Witnessing this, Dadhichi
    offered Vishnu a divine vision, allowing him to see the entire universe within
    Dadhichi's own body.
  summary_hi: भगवान विष्णु ने ऋषि दधीचि को चकित करने के लिए विश्वमूर्ति का रूप धारण
    किया, जिसमें उन्होंने अपने शरीर में अनगिनत देवताओं और जीवों को प्रकट किया। इसे
    देखकर, दधीचि ने विष्णु को दिव्य दृष्टि प्रदान की, जिससे विष्णु ने दधीचि के शरीर
    में सम्पूर्ण ब्रह्माण्ड को देखा।
- id: dadhichi-curse-on-gods
  type: story
  keywords:
  - Dadhichi
  - curse
  - gods
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sage Dadhichi, angered by the actions of the gods and Vishnu, remembered
    Lord Shiva and cursed the gods, including Indra and Vishnu, to be destroyed by
    the fire of Rudra's anger.
  summary_hi: ऋषि दधीचि, देवताओं और विष्णु के कार्यों से क्रोधित होकर, शिवजी का स्मरण
    करते हुए इन्द्र और विष्णु सहित देवताओं को रुद्र के क्रोध की अग्नि से नष्ट होने
    का शाप दिया।
- id: dadhichi-curse-story
  type: story
  keywords:
  - Dadhichi
  - curse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 39
  summary_en: Sage Dadhichi curses the gods and then returns to his hermitage. The
    place where this event occurred became known as Sthaneswar, a sacred pilgrimage
    site where devotees can attain union with Shiva. The narrative also mentions that
    those who recite this story can overcome premature death and attain Brahmaloka.
  summary_hi: ऋषि दधीचि ने देवताओं को शाप दिया और फिर अपने आश्रम में लौट गए। यह स्थान
    स्थानेश्वर के नाम से प्रसिद्ध हुआ, जहाँ भक्त शिव के साथ सायुज्य प्राप्त कर सकते
    हैं। इस कथा का पाठ करने वाले व्यक्ति अकाल मृत्यु को जीत सकते हैं और ब्रह्मलोक
    को प्राप्त कर सकते हैं।
- id: brahma-vishnu-seek-shiva
  type: story
  keywords:
  - Brahma
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 40
  summary_en: After the destruction of Daksha's sacrifice by Virabhadra, Brahma and
    the defeated gods visit Vishnu to express their grief. Vishnu advises them to
    seek Shiva's forgiveness, as the gods had wronged Shiva by not giving him his
    share in the sacrifice.
  summary_hi: वीरभद्र द्वारा दक्ष के यज्ञ के विनाश के बाद, ब्रह्मा और पराजित देवता
    विष्णु के पास जाकर अपना दुःख व्यक्त करते हैं। विष्णु उन्हें सलाह देते हैं कि वे
    शिव से क्षमा याचना करें, क्योंकि देवताओं ने यज्ञ में शिव को उनका भाग नहीं दिया
    था।
- id: vishnu-pleads-for-shiva-forgiveness
  type: story
  keywords:
  - Vishnu
  - Shiva
  - forgiveness
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Vishnu advises the gods to seek forgiveness from Shiva, who is angered
    by Daksha's actions. He emphasizes that appeasing Shiva is the only way to restore
    peace and order. Vishnu, along with Brahma and other deities, decides to visit
    Mount Kailash to seek Shiva's forgiveness.
  summary_hi: विष्णु देवताओं को सलाह देते हैं कि वे दक्ष के कार्यों से क्रोधित शिव
    से क्षमा माँगें। वह इस बात पर जोर देते हैं कि शिव को प्रसन्न करना ही शांति और
    व्यवस्था बहाल करने का एकमात्र तरीका है। विष्णु, ब्रह्मा और अन्य देवताओं के साथ,
    शिव से क्षमा मांगने के लिए कैलाश पर्वत जाने का निर्णय लेते हैं।
- id: mount-kailash-description
  type: concept
  keywords:
  - Mount Kailash
  - Shiva
  - sacred
  source:
    book: Shiv Puran
    sarga: Sati Khand
  summary_en: Mount Kailash is described as the sacred abode of Shiva, adorned with
    precious stones and diverse flora and fauna. It is a place of great beauty, frequented
    by celestial beings, and surrounded by holy rivers like the Ganges.
  summary_hi: कैलाश पर्वत को शिव का पवित्र निवास स्थान बताया गया है, जो बहुमूल्य रत्नों
    और विविध वनस्पतियों और जीवों से सुसज्जित है। यह एक अत्यंत सुंदर स्थान है, जहाँ
    देवगण आते हैं, और यह गंगा जैसी पवित्र नदियों से घिरा हुआ है।
- id: shiva-under-the-banyan-tree
  type: story
  keywords:
  - shiva
  - banyan-tree
  - meditation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 40
  summary_en: The gods, including Vishnu, see Lord Shiva seated under a vast banyan
    tree on a mountain. This tree is described as a sacred place, suitable for divine
    yogis, and only visible to the virtuous. Shiva is in deep meditation, surrounded
    by great sages who are devotedly worshipping him.
  summary_hi: विष्णु सहित देवताओं ने भगवान शिव को एक विशाल वटवृक्ष के नीचे बैठे देखा।
    यह वृक्ष एक पवित्र स्थान है, जो दिव्य योगियों के लिए उपयुक्त है और केवल पुण्यात्माओं
    को ही दिखाई देता है। शिव ध्यान में लीन हैं और महान सिद्धजन उनकी भक्तिपूर्वक उपासना
    कर रहे हैं।
- id: daksha-yajna-destruction
  type: event
  keywords:
  - Daksha
  - Yajna
  - Destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Lord Shiva explains to the gods that he did not destroy Daksha's Yajna.
    Daksha's own actions led to his downfall. Shiva advises that one should not harm
    others as it ultimately harms oneself. The destruction of Daksha's Yajna was carried
    out by Virabhadra, who was sent by Shiva.
  summary_hi: भगवान शिव देवताओं को बताते हैं कि उन्होंने दक्ष के यज्ञ का विध्वंस नहीं
    किया। दक्ष के अपने कर्मों के कारण उनका पतन हुआ। शिव सलाह देते हैं कि दूसरों को
    हानि नहीं पहुंचानी चाहिए क्योंकि यह अंततः स्वयं को ही हानि पहुंचाता है। दक्ष के
    यज्ञ का विध्वंस वीरभद्र द्वारा किया गया था, जिसे शिव ने भेजा था।
- id: virabhadra-sent-by-shiva
  type: character
  keywords:
  - Virabhadra
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Virabhadra, a fierce warrior created by Shiva, is sent to destroy Daksha's
    Yajna. He carries out Shiva's orders by causing havoc at the Yajna, leading to
    the destruction of the sacrificial site and injury to many attendees.
  summary_hi: वीरभद्र, जो शिव द्वारा निर्मित एक पराक्रमी योद्धा है, दक्ष के यज्ञ को
    नष्ट करने के लिए भेजा जाता है। वह यज्ञ स्थल पर हंगामा मचाकर शिव के आदेशों का पालन
    करता है, जिससे यज्ञ स्थल का विध्वंस होता है और कई उपस्थित लोगों को चोट लगती है।
- id: daksha-restoration
  type: event
  keywords:
  - Daksha
  - Restoration
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: After the destruction of the Yajna, Shiva orders the restoration of
    Daksha. A goat's head is placed on Daksha's body, reviving him. This act signifies
    Shiva's forgiveness and the restoration of order.
  summary_hi: यज्ञ के विध्वंस के बाद, शिव दक्ष की पुनर्स्थापना का आदेश देते हैं। दक्ष
    के शरीर पर बकरे का सिर लगाया जाता है, जिससे वह पुनर्जीवित हो जाते हैं। यह शिव
    की क्षमा और व्यवस्था की पुनर्स्थापना का प्रतीक है।
- id: daksha-revived-with-goat-head
  type: story
  keywords:
  - Daksha
  - Shiva
  - goat-head
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: After Daksha's head was sacrificed, Shiva instructed that a goat's head
    be attached to his body. Upon receiving Shiva's grace, Daksha was revived and
    stood up as if awakening from sleep. He then saw Shiva, who was the embodiment
    of compassion, and his heart, once filled with hatred, became pure like the autumn
    moon.
  summary_hi: दक्ष का सिर बलि चढ़ने के बाद, शिव ने आदेश दिया कि उसके शरीर पर बकरे
    का सिर जोड़ा जाए। शिव की कृपा प्राप्त करने पर, दक्ष पुनर्जीवित हो गए और सोकर जागे
    हुए व्यक्ति की तरह खड़े हो गए। उन्होंने शिव को देखा, जो करुणा के अवतार थे, और
    उनका हृदय, जो पहले द्वेष से भरा था, शरद ऋतु के चंद्रमा की तरह निर्मल हो गया।
- id: daksha-praises-shiva
  type: story
  keywords:
  - Daksha
  - Shiva
  - praise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: Feeling ashamed and grateful, Daksha praised Shiva, acknowledging him
    as the supreme deity, the eternal source of knowledge, and the benefactor of the
    world. He expressed his realization of Shiva's greatness and sought forgiveness
    for his past offenses.
  summary_hi: लज्जित और कृतज्ञ होकर, दक्ष ने शिव की स्तुति की, उन्हें सर्वोच्च देवता,
    ज्ञान का सनातन स्रोत और विश्व के कल्याणकर्ता के रूप में स्वीकार किया। उन्होंने
    शिव की महानता को समझने की बात कही और अपने पिछले अपराधों के लिए क्षमा मांगी।
- id: shiva-daksha-forgiveness
  type: story
  keywords:
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand, Chapter 42
  summary_en: In this episode, Lord Shiva is praised by various deities, including
    Brahma and Vishnu, for his supreme qualities and forgiving nature. Despite the
    previous insults by Daksha, Shiva is urged to forgive and bless him, allowing
    Daksha's sacrifice to be completed. The episode highlights Shiva's magnanimity
    and the unity among the gods.
  summary_hi: इस प्रकरण में, भगवान शिव की ब्रह्मा और विष्णु सहित विभिन्न देवताओं द्वारा
    उनकी सर्वोच्च विशेषताओं और क्षमाशील स्वभाव के लिए प्रशंसा की जाती है। दक्ष द्वारा
    पहले किए गए अपमान के बावजूद, शिव को उन्हें क्षमा करने और आशीर्वाद देने का आग्रह
    किया जाता है, जिससे दक्ष का यज्ञ पूरा हो सके। यह प्रकरण शिव की उदारता और देवताओं
    के बीच एकता को दर्शाता है।
- id: shiva-pleased-with-devotees
  type: story
  keywords:
  - Shiva
  - devotees
  - Daksha
  source:
    book: Shiv Puran
    sarga: '43'
  summary_en: Lord Shiva, pleased by the prayers of Brahma, Vishnu, and other deities,
    addresses Daksha. He explains that although he is independent and the supreme
    lord, he is always under the influence of his devotees. Shiva describes four types
    of devotees, with the 'jnani' or the wise one being the most dear to him.
  summary_hi: भगवान शिव, ब्रह्मा, विष्णु और अन्य देवताओं की प्रार्थनाओं से प्रसन्न
    होकर दक्ष को संबोधित करते हैं। वे बताते हैं कि यद्यपि वे स्वतंत्र और सर्वोच्च
    भगवान हैं, फिर भी वे हमेशा अपने भक्तों के अधीन रहते हैं। शिव चार प्रकार के भक्तों
    का वर्णन करते हैं, जिनमें 'ज्ञानी' या ज्ञानी व्यक्ति उन्हें सबसे प्रिय होता है।
- id: shiva-on-knowledge-and-devotion
  type: concept
  keywords:
  - knowledge
  - devotion
  - liberation
  source:
    book: Shiv Puran
    sarga: '43'
  summary_en: Shiva emphasizes the importance of knowledge over mere ritualistic actions
    for attaining him. He states that those who are bound by karma cannot reach him
    through rituals, charity, or penance alone. True understanding and devotion, particularly
    through knowledge, lead to liberation.
  summary_hi: शिव ज्ञान के महत्व को केवल कर्मकांडों पर अधिक बताते हैं। वे कहते हैं
    कि जो लोग कर्म के वशीभूत हैं, वे केवल अनुष्ठानों, दान या तपस्या के माध्यम से उन्हें
    प्राप्त नहीं कर सकते। सच्ची समझ और भक्ति, विशेष रूप से ज्ञान के माध्यम से, मुक्ति
    की ओर ले जाती है।
- id: shiva-on-non-duality
  type: concept
  keywords:
  - non-duality
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: '43'
  summary_en: Shiva explains the concept of non-duality, stating that he is the ultimate
    cause of the universe, manifesting as Brahma, Vishnu, and Rudra. He emphasizes
    that seeing distinctions among these deities is a sign of ignorance, and true
    peace comes from recognizing their unity.
  summary_hi: शिव अद्वैत के सिद्धांत को समझाते हैं, यह बताते हुए कि वे ब्रह्मा, विष्णु
    और रुद्र के रूप में प्रकट होते हुए ब्रह्मांड का अंतिम कारण हैं। वे इस बात पर जोर
    देते हैं कि इन देवताओं के बीच भेद देखना अज्ञानता का संकेत है, और सच्ची शांति उनके
    एकत्व को पहचानने से आती है।
- id: shiva-daksha-reconciliation
  type: event
  keywords:
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khand
  summary_en: After receiving Lord Shiva's blessings, Daksha successfully completes
    his yajna with the help of the priests. He offers portions of the yajna to the
    gods and gives the full share to Shiva. This act earns him Shiva's grace, and
    all the gods and sages leave satisfied, singing Shiva's praises.
  summary_hi: भगवान शिव की कृपा प्राप्त करने के बाद, दक्ष अपने यज्ञ को पुरोहितों की
    सहायता से सफलतापूर्वक पूरा करते हैं। वह देवताओं को यज्ञ का भाग देते हैं और शिव
    को पूरा भाग अर्पित करते हैं। इस कार्य से उन्हें शिव की कृपा प्राप्त होती है, और
    सभी देवता और ऋषि संतुष्ट होकर शिव की प्रशंसा करते हुए चले जाते हैं।
- id: mena-devotion-to-sati
  type: story
  keywords:
  - Mena
  - Sati
  - Devotion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Sati Khanda, Chapter 42
  summary_en: Mena, the wife of Himavat, was devoted to Sati and wished to serve her.
    After Sati's self-immolation, Mena desired to worship the goddess who resided
    in Shiva's abode.
  summary_hi: हिमालय की पत्नी मेना सती की भक्त थीं और उनकी सेवा करना चाहती थीं। सती
    के आत्मदाह के बाद, मेना शिवलोक में स्थित देवी की आराधना करना चाहती थीं।
- id: himalaya-description
  type: concept
  keywords:
  - Himalaya
  - Mountain
  - Description
  source:
    book: Shiv Puran
    sarga: Chapter 13-20
  summary_en: The Himalaya is described as a majestic and divine mountain, rich with
    various minerals and home to many sages and animals. It is a place of penance
    and is beloved by Lord Shiva.
  summary_hi: हिमालय को एक भव्य और दिव्य पर्वत के रूप में वर्णित किया गया है, जो विभिन्न
    खनिजों से समृद्ध है और कई ऋषियों और पशुओं का निवास स्थान है। यह तप का स्थान है
    और भगवान शिव को प्रिय है।
- id: menaka-marriage-to-himavan
  type: event
  keywords:
  - Menaka
  - Himavan
  - Marriage
  source:
    book: Shiv Puran
    sarga: Chapter 24-31
  summary_en: Menaka, the daughter of the divine Pitrs, is married to Himavan, the
    king of mountains, in a grand and auspicious ceremony attended by gods and sages.
  summary_hi: दिव्य पितरों की पुत्री मेनका का विवाह पर्वतों के राजा हिमवान से एक भव्य
    और शुभ समारोह में होता है, जिसमें देवता और ऋषि शामिल होते हैं।
- id: mena-marriage-to-himalaya
  type: event
  keywords:
  - Mena
  - Himalaya
  source:
    book: Shiv Puran
    sarga: Rudrasamhita Parvatikhanda
  summary_en: The gods request the Pitrs to marry their eldest daughter, Mena, to
    the mountain king Himalaya. The Pitrs agree, recalling a curse on their daughters,
    and the marriage is celebrated with great festivity, attended by deities and sages.
  summary_hi: देवता पितरों से उनकी ज्येष्ठ पुत्री मेना का विवाह पर्वतराज हिमालय से
    करने का अनुरोध करते हैं। पितर अपनी कन्याओं के शाप को याद करके सहमत हो जाते हैं,
    और यह विवाह बड़े उत्सव के साथ मनाया जाता है, जिसमें देवता और ऋषि शामिल होते हैं।
- id: mena-origin-story
  type: story
  keywords:
  - Mena
  - Daksha
  source:
    book: Shiv Puran
    sarga: Rudrasamhita Parvatikhanda
  summary_en: Brahma narrates the origin of Mena, the eldest daughter of Daksha's
    sixty daughters, who were born for the purpose of creation. Mena, along with her
    sisters Dhanya and Kalavati, were born from the mind of the Pitrs and are considered
    auspicious and revered.
  summary_hi: ब्रह्मा मेना की उत्पत्ति का वर्णन करते हैं, जो दक्ष की साठ पुत्रियों
    में सबसे बड़ी थीं, जिन्हें सृष्टि के उद्देश्य से उत्पन्न किया गया था। मेना, अपनी
    बहनों धन्या और कलावती के साथ, पितरों के मन से उत्पन्न हुई थीं और उन्हें शुभ और
    पूजनीय माना जाता है।
- id: sanakadis-visit-to-vishnu
  type: event
  keywords:
  - Sanakadi
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: The Sanakadi sages, sons of Brahma, visited Lord Vishnu and offered
    their respects. They were allowed to stay at Vishnu's abode by his command.
  summary_hi: सनकादि मुनि, जो ब्रह्मा के पुत्र हैं, भगवान विष्णु के पास गए और उन्हें
    प्रणाम किया। विष्णु की आज्ञा से उन्हें वहाँ रहने की अनुमति मिली।
- id: curse-of-sanatkumara
  type: story
  keywords:
  - Sanatkumara
  - curse
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Sanatkumara, a sage, cursed three sisters who were daughters of the
    Pitrs for not showing proper respect. Under the influence of Shiva's maya, they
    were cursed to be born as human women.
  summary_hi: सनत्कुमार, एक मुनि, ने पितरों की तीन बेटियों को उचित सम्मान न देने के
    कारण शाप दिया। शिव की माया के प्रभाव में, उन्हें मनुष्यों की स्त्रियाँ बनने का
    शाप मिला।
- id: redemption-of-the-sisters
  type: story
  keywords:
  - redemption
  - sisters
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: After being cursed, the three sisters pleaded for forgiveness. Sanatkumara,
    influenced by Shiva's maya, assured them of a future redemption where they would
    be born as significant figures in their next lives.
  summary_hi: शापित होने के बाद, तीनों बहनों ने क्षमा की याचना की। शिव की माया से
    प्रेरित होकर, सनत्कुमार ने उन्हें आश्वासन दिया कि अगले जन्म में वे महत्वपूर्ण
    व्यक्तियों के रूप में जन्म लेंगी।
- id: parvati-birth-and-marriage
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The passage describes the birth and future marriage of Parvati, the
    daughter of Menaka, who will perform severe penance to become the wife of Shiva.
    This narrative highlights the divine lineage and destiny of Parvati as Jagadambika.
  summary_hi: इस अंश में मेनका की पुत्री पार्वती के जन्म और उनके शिव की पत्नी बनने
    के लिए कठोर तप करने का वर्णन है। यह कथा पार्वती की दिव्य वंशावली और नियति को दर्शाती
    है।
- id: sita-birth-and-marriage
  type: story
  keywords:
  - Sita
  - Rama
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The passage narrates the birth of Sita, daughter of Dhanya, who will
    become the wife of Rama. It describes her as taking refuge in worldly conduct
    and enjoying life with Rama.
  summary_hi: इस अंश में धन्या की पुत्री सीता के जन्म का वर्णन है, जो राम की पत्नी
    बनेंगी। यह उन्हें लौकिक आचार का आश्रय लेने और राम के साथ जीवन का आनंद लेने वाली
    के रूप में वर्णित करता है।
- id: radha-birth-and-marriage
  type: story
  keywords:
  - Radha
  - Krishna
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The passage tells the story of Radha, daughter of Kalavati, who will
    become the wife of Krishna. It highlights her divine connection and secret love
    for Krishna.
  summary_hi: इस अंश में कलावती की पुत्री राधा की कथा है, जो कृष्ण की पत्नी बनेंगी।
    यह उनके कृष्ण के प्रति गुप्त प्रेम और दिव्य संबंध को उजागर करता है।
- id: parvati-birth-and-tapasya
  type: story
  keywords:
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After marrying Menaka, Himavan and Menaka had a daughter named Parvati.
    Parvati performed severe penance to obtain Shiva as her husband. This story highlights
    Parvati's devotion and determination.
  summary_hi: मेनका से विवाह के बाद हिमवान और मेनका की एक पुत्री हुई जिसका नाम पार्वती
    था। पार्वती ने शिव को पति रूप में प्राप्त करने के लिए कठोर तप किया। यह कहानी पार्वती
    की भक्ति और दृढ़ संकल्प को दर्शाती है।
- id: himavan-welcomes-deities
  type: event
  keywords:
  - Himavan
  - Deities
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After marrying Menaka, Himavan hosted a grand celebration. Deities including
    Vishnu and sages visited Himavan, who welcomed them with great devotion and hospitality,
    feeling blessed by their presence.
  summary_hi: मेनका से विवाह के बाद हिमवान ने एक भव्य उत्सव का आयोजन किया। विष्णु
    सहित देवता और ऋषि हिमवान के पास आए, जिन्होंने उन्हें बड़ी भक्ति और आतिथ्य के साथ
    स्वागत किया और उनकी उपस्थिति से धन्य महसूस किया।
- id: uma-sati-rebirth-story
  type: story
  keywords:
  - Uma
  - Sati
  - rebirth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The passage narrates the story of Uma, who was born as Sati, the daughter
    of Daksha. After being disrespected by her father, she remembered her vow and
    left her body during a sacrificial ceremony, returning to her divine abode. This
    story is well-known and signifies the rebirth of Uma.
  summary_hi: यह कथा उमा की है, जो दक्ष की पुत्री सती के रूप में जन्मी थीं। अपने पिता
    द्वारा अनादर किए जाने पर, उन्होंने अपनी प्रतिज्ञा को याद किया और यज्ञ के दौरान
    अपने शरीर का त्याग कर अपने परम धाम को चली गईं। यह कथा प्रसिद्ध है और उमा के पुनर्जन्म
    का संकेत देती है।
- id: uma-divine-appearance
  type: event
  keywords:
  - Uma
  - divine-appearance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 4
  summary_en: In response to the prayers of the gods, the goddess Uma appears before
    them in a divine form. She is described as being seated on a magnificent chariot
    adorned with jewels, radiating a brilliance greater than millions of suns. The
    gods are filled with joy and continue to praise her.
  summary_hi: देवताओं की प्रार्थना के उत्तर में, देवी उमा उनके सामने दिव्य रूप में
    प्रकट होती हैं। उन्हें रत्नों से सजे एक अद्भुत रथ पर बैठे हुए वर्णित किया गया
    है, जो करोड़ों सूर्यों से अधिक तेजस्वी है। देवता आनंद से भर जाते हैं और उनकी स्तुति
    करते रहते हैं।
- id: durga-appearance
  type: event
  keywords:
  - Durga
  - appearance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 4
  summary_en: Goddess Durga appears before the gods to dispel the troubles caused
    by the demon Durga. She is depicted as a powerful and radiant figure, seated on
    a chariot, and is praised by the gods for her ability to destroy all sorrows.
  summary_hi: देवी दुर्गा देवताओं के समक्ष प्रकट होती हैं ताकि राक्षस दुर्ग द्वारा
    उत्पन्न संकटों का नाश कर सकें। उन्हें एक शक्तिशाली और तेजस्वी रूप में वर्णित किया
    गया है, जो रथ पर विराजमान हैं, और देवताओं द्वारा उनकी सभी दुखों को नष्ट करने की
    क्षमता के लिए प्रशंसा की जाती है।
- id: parvati-rebirth-and-union-with-shiva
  type: story
  keywords:
  - Parvati
  - Shiva
  - Rebirth
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati, the reincarnation of Sati, is born to Himachal and Mena. She
    is destined to reunite with Shiva and fulfill the divine play that brings joy
    to the universe. Parvati's birth and union with Shiva are seen as a means to remove
    sorrow and bring happiness to all beings.
  summary_hi: पार्वती, सती का पुनर्जन्म, हिमाचल और मेना के घर जन्म लेती हैं। उनका
    शिव के साथ पुनर्मिलन होना तय है और यह दिव्य लीला ब्रह्मांड में आनंद लाती है। पार्वती
    का जन्म और शिव के साथ उनका मिलन सभी प्राणियों के दुःख को दूर करने और सुख लाने
    का माध्यम माना जाता है।
- id: shiva-grief-wandering
  type: story
  keywords:
  - Shiva
  - Grief
  - Wandering
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 4
  summary_en: After Sati's self-immolation, Lord Shiva, overwhelmed by grief, renounces
    worldly pleasures and wanders in a state of sorrow. Despite being the supreme
    deity, he is depicted as a grieving lover, unable to find peace.
  summary_hi: सती के आत्मदाह के बाद, भगवान शिव शोक में डूब जाते हैं और सांसारिक सुखों
    का त्याग कर देते हैं। वे दुखी अवस्था में भटकते रहते हैं, और एक प्रेमी के रूप में
    चित्रित होते हैं जो शांति नहीं पा सकते।
- id: parvati-reincarnation-promise
  type: story
  keywords:
  - Parvati
  - Reincarnation
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 4
  summary_en: The goddess promises to reincarnate as Parvati, the daughter of Himavan
    and Mena, to bring joy to Shiva and fulfill divine purposes. This promise sets
    the stage for her future birth and union with Shiva.
  summary_hi: देवी यह वादा करती हैं कि वह हिमवान और मेना की पुत्री पार्वती के रूप
    में पुनर्जन्म लेंगी, ताकि शिव को प्रसन्नता प्रदान कर सकें और दिव्य उद्देश्यों
    को पूरा कर सकें। यह वादा उनके भविष्य के जन्म और शिव के साथ मिलन की पृष्ठभूमि तैयार
    करता है।
- id: himalaya-mena-tapasya
  type: story
  keywords:
  - Himalaya
  - Mena
  - Tapasya
  - Uma
  source:
    book: Shiv Puran
    sarga: Chapter 1
  summary_en: Himalaya and Mena, the parents of Uma, performed intense penance to
    please Lord Shiva and Parvati. They engaged in daily worship and offered various
    offerings to the deities. Their devotion was so profound that after 27 years,
    Goddess Uma appeared before them, pleased with their dedication.
  summary_hi: हिमालय और मेना, जो उमा के माता-पिता थे, ने भगवान शिव और पार्वती को प्रसन्न
    करने के लिए कठोर तप किया। उन्होंने प्रतिदिन पूजा की और देवताओं को विभिन्न प्रकार
    के अर्पण किए। उनकी भक्ति इतनी गहरी थी कि 27 वर्षों के बाद, देवी उमा उनके सामने
    प्रकट हुईं और उनकी भक्ति से प्रसन्न हुईं।
- id: uma-appears-to-mena
  type: event
  keywords:
  - Uma
  - Mena
  - Divine Appearance
  source:
    book: Shiv Puran
    sarga: Chapter 1
  summary_en: After 27 years of penance by Mena, Goddess Uma appeared before her,
    radiant and divine. Uma, pleased with Mena's devotion, offered her a boon, asking
    her to express any wish she desired.
  summary_hi: मेना के 27 वर्षों के तप के बाद, देवी उमा उनके सामने प्रकट हुईं, दिव्य
    और तेजस्वी रूप में। उमा, मेना की भक्ति से प्रसन्न होकर, उन्हें वरदान देने की पेशकश
    की और उनसे कोई भी इच्छा व्यक्त करने के लिए कहा।
- id: menaka-boon-from-durga
  type: story
  keywords:
  - Menaka
  - Durga
  - boon
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: In this episode, Menaka praises Goddess Durga with devotion, and as
    a result, Durga offers her a boon. Menaka requests for a hundred sons who are
    virtuous and a daughter who will be a source of joy for both families and revered
    in the three worlds. Durga grants her wish, promising that her sons will be valorous
    and that she herself will be born as Menaka's daughter to fulfill divine purposes.
  summary_hi: इस प्रकरण में, मेनका देवी दुर्गा की भक्ति से स्तुति करती हैं, जिसके
    परिणामस्वरूप दुर्गा उन्हें वरदान देने का प्रस्ताव करती हैं। मेनका सौ सद्गुणी पुत्रों
    और एक पुत्री की कामना करती हैं, जो दोनों कुलों के लिए आनंद का स्रोत होगी और तीनों
    लोकों में पूजनीय होगी। दुर्गा उनकी इच्छा पूरी करती हैं, यह वादा करते हुए कि उनके
    पुत्र वीर होंगे और वह स्वयं मेनका की पुत्री के रूप में जन्म लेंगी ताकि दिव्य उद्देश्यों
    की पूर्ति हो सके।
- id: menaka-boon-episode
  type: story
  keywords:
  - Menaka
  - boon
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 5
  summary_en: Menaka, the wife of Himavan, prays to Goddess Shiva for a boon. She
    wishes for a hundred sons and a daughter who would be revered across the three
    worlds. Pleased with her devotion, Goddess Shiva grants her the boon, promising
    that she herself will incarnate as Menaka's daughter to fulfill the divine purpose.
  summary_hi: हिमवान की पत्नी मेनका देवी शिवा से वरदान मांगती हैं। वह सौ पुत्रों और
    एक पुत्री की कामना करती हैं, जो तीनों लोकों में पूजित होगी। देवी शिवा उनकी भक्ति
    से प्रसन्न होकर उन्हें वरदान देती हैं और वादा करती हैं कि वह स्वयं मेनका की पुत्री
    के रूप में अवतरित होंगी।
- id: mainaka-birth-story
  type: story
  keywords:
  - Mainaka
  - birth
  - Himavan
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 5
  summary_en: Mainaka, the son of Himavan and Menaka, is born as a powerful and extraordinary
    mountain. He forms a strong friendship with the ocean and remains unaffected when
    Indra attempts to cut the wings of mountains. Mainaka becomes the foremost among
    Himavan's sons and is celebrated for his strength and valor.
  summary_hi: हिमवान और मेनका के पुत्र मैनाक का जन्म एक शक्तिशाली और अद्भुत पर्वत
    के रूप में होता है। वह समुद्र के साथ गहरी मित्रता करता है और इंद्र द्वारा पर्वतों
    के पंख काटने के प्रयास के बावजूद अप्रभावित रहता है। मैनाक हिमवान के पुत्रों में
    सबसे श्रेष्ठ और बलशाली माना जाता है।
- id: birth-of-parvati
  type: story
  keywords:
  - parvati
  - himalaya
  - birth
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 7
  summary_en: The birth of Parvati is celebrated with great joy by her father, Himavan.
    She is given the name Kali and later known as Parvati. Her beauty and divine qualities
    are compared to the moon and the Ganges. Despite having many children, Himavan
    is particularly fond of Parvati.
  summary_hi: पार्वती का जन्म हिमवान के घर में बड़े हर्षोल्लास के साथ मनाया जाता है।
    उन्हें काली नाम दिया जाता है और बाद में पार्वती के नाम से जानी जाती हैं। उनकी
    सुंदरता और दिव्य गुणों की तुलना चंद्रमा और गंगा से की जाती है। हिमवान के कई संतान
    होने के बावजूद, वे पार्वती से विशेष स्नेह रखते हैं।
- id: sati-birth-story
  type: story
  keywords:
  - Sati
  - birth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The passage describes the divine birth of Sati, who appeared before
    Menaka in her true form. Sati was born on the ninth day of the Chaitra month under
    the Mrigashira Nakshatra, emerging from the moon's sphere like the Ganga. Her
    birth brought prosperity and happiness to the region, and the gods, including
    Vishnu, praised her.
  summary_hi: यह अंश सती के दिव्य जन्म का वर्णन करता है, जो मेनका के सामने अपने वास्तविक
    रूप में प्रकट हुईं। सती का जन्म चैत्र मास की नवमी तिथि को मृगशिरा नक्षत्र में
    चंद्रमंडल से गंगा की तरह हुआ। उनके जन्म से क्षेत्र में समृद्धि और खुशी आई, और
    विष्णु सहित देवताओं ने उनकी स्तुति की।
- id: menaka-prayer-to-sati
  type: story
  keywords:
  - Menaka
  - prayer
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Menaka, upon witnessing the divine form of Sati, expressed her gratitude
    and prayed to her. She acknowledged Sati as the primordial energy and mother of
    the three worlds, and requested her to remain in her meditation and take a form
    similar to her daughter.
  summary_hi: मेनका ने सती के दिव्य रूप को देखकर अपनी कृतज्ञता व्यक्त की और उनसे प्रार्थना
    की। उन्होंने सती को आद्याशक्ति और तीनों लोकों की जननी के रूप में स्वीकार किया,
    और उनसे अपने ध्यान में स्थित रहने और अपनी पुत्री के समान रूप धारण करने का अनुरोध
    किया।
- id: parvati-birth-story
  type: story
  keywords:
  - parvati
  - himavan
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati, the daughter of Himavan, is the reincarnation of Sati. She
    was destined to marry Shiva and was born to fulfill this divine purpose.
  summary_hi: पार्वती, हिमवान की पुत्री, सती का पुनर्जन्म हैं। उनका जन्म शिव से विवाह
    करने और इस दिव्य उद्देश्य को पूरा करने के लिए हुआ था।
- id: parvati-naming-ceremony
  type: event
  keywords:
  - Parvati
  - naming
  - ceremony
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 7
  summary_en: The naming ceremony of Parvati is conducted by Himavan with the presence
    of sages. She is given the name 'Kali' and later known as 'Parvati'. The event
    is celebrated with music, dance, and gifts to the Brahmins.
  summary_hi: पार्वती का नामकरण समारोह हिमवान द्वारा ऋषियों की उपस्थिति में किया जाता
    है। उन्हें 'काली' नाम दिया जाता है और बाद में 'पार्वती' के नाम से जाना जाता है।
    इस अवसर को संगीत, नृत्य और ब्राह्मणों को उपहार देकर मनाया जाता है।
- id: parvati-childhood
  type: story
  keywords:
  - parvati
  - childhood
  - play
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 7
  summary_en: Parvati's childhood is described as joyful and playful. She spends her
    time playing with her friends and engaging in various activities. Her education
    is also highlighted, as she learns all the arts and sciences with great dedication.
  summary_hi: पार्वती का बचपन आनंदमय और खेल-कूद से भरा हुआ बताया गया है। वह अपने दोस्तों
    के साथ खेलती हैं और विभिन्न गतिविधियों में संलग्न रहती हैं। उनकी शिक्षा का भी
    वर्णन किया गया है, जिसमें वे सभी कलाओं और विज्ञानों को बड़ी लगन से सीखती हैं।
- id: narada-visit-to-himalaya
  type: event
  keywords:
  - Narada
  - Himalaya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khand
  summary_en: Narada visits the abode of the Himalayas and is amazed by the grandeur
    of the place. He inquires about the arrival of Shiva for Parvati's marriage. The
    mountains, adorned with various ornaments, are present for the event. Narada is
    instructed to bring Shiva to the Himalayas for the marriage.
  summary_hi: नारद हिमालय के निवास स्थान पर जाते हैं और वहां की भव्यता से चकित हो
    जाते हैं। वे पार्वती के विवाह के लिए शिव के आगमन के बारे में पूछते हैं। पर्वत,
    विभिन्न आभूषणों से सुसज्जित, इस आयोजन के लिए उपस्थित हैं। नारद को शिव को हिमालय
    लाने के लिए निर्देशित किया जाता है।
- id: himalaya-narada-dialogue
  type: story
  keywords:
  - Himalaya
  - Narada
  - prophecy
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 357
  summary_en: Himalaya, the king of mountains, invites sage Narada to his abode and
    asks about the future of his daughter, Parvati. Narada predicts that Parvati will
    marry a yogi who is devoid of worldly attributes, which initially saddens Himalaya
    and his wife Menavati. However, Parvati is pleased with the prophecy, recognizing
    the yogi as Lord Shiva.
  summary_hi: हिमालय, पर्वतों के राजा, नारद मुनि को अपने निवास पर आमंत्रित करते हैं
    और अपनी पुत्री पार्वती के भविष्य के बारे में पूछते हैं। नारद भविष्यवाणी करते हैं
    कि पार्वती का विवाह एक योगी से होगा जो सांसारिक गुणों से रहित होगा, जिससे हिमालय
    और उनकी पत्नी मेनावती दुखी हो जाते हैं। हालांकि, पार्वती इस भविष्यवाणी से प्रसन्न
    होती हैं, क्योंकि वह योगी भगवान शिव हैं।
- id: parvati-marriage-prophecy
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 33
  summary_en: The sages advise King Himavat to give his daughter Parvati in marriage
    to Lord Shiva, as it is destined to happen. Despite initial reluctance, the prophecy
    states that the marriage will occur due to divine will. The sages emphasize the
    importance of fulfilling divine promises and the benefits of aligning with the
    cosmic order.
  summary_hi: ऋषि हिमालय राजा को सलाह देते हैं कि वे अपनी पुत्री पार्वती का विवाह
    भगवान शिव से कर दें, क्योंकि यह नियति द्वारा निर्धारित है। प्रारंभिक अनिच्छा के
    बावजूद, भविष्यवाणी कहती है कि यह विवाह दिव्य इच्छा के कारण अवश्य होगा। ऋषि दिव्य
    वचनों को पूरा करने के महत्व और ब्रह्मांडीय व्यवस्था के साथ संरेखित होने के लाभों
    पर जोर देते हैं।
- id: parvati-tapasya
  type: practice
  keywords:
  - Parvati
  - tapasya
  - penance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Parvati Khanda) 533
  summary_en: Parvati is advised to perform penance to win the favor of Lord Shiva.
    It is suggested that through her tapasya, she will please Shiva, who is known
    to be easily pleased by devotion and penance, and thus secure him as her husband.
  summary_hi: पार्वती को भगवान शिव की कृपा प्राप्त करने के लिए तपस्या करने की सलाह
    दी जाती है। यह सुझाव दिया गया है कि अपनी तपस्या के माध्यम से वह शिव को प्रसन्न
    करेगी, जो भक्ति और तपस्या से शीघ्र प्रसन्न होते हैं, और इस प्रकार उन्हें अपने
    पति के रूप में प्राप्त करेगी।
- id: ardhanaarishvara-concept
  type: concept
  keywords:
  - Ardhanarishvara
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Parvati Khanda) 533
  summary_en: The concept of Ardhanarishvara is introduced, where Parvati will become
    one with Shiva, symbolizing the union of masculine and feminine energies. This
    union is depicted as Parvati taking half of Shiva's body, representing their inseparable
    bond.
  summary_hi: अर्धनारीश्वर की अवधारणा प्रस्तुत की जाती है, जहाँ पार्वती शिव के साथ
    एक हो जाएंगी, जो पुरुष और स्त्री ऊर्जा के मिलन का प्रतीक है। इस मिलन को पार्वती
    के शिव के शरीर का आधा भाग लेने के रूप में चित्रित किया गया है, जो उनके अविभाज्य
    बंधन का प्रतिनिधित्व करता है।
- id: shiva-sati-vow
  type: story
  keywords:
  - Shiva
  - Sati
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Shiva made a vow to Sati, the daughter of Daksha, that he would
    not marry any other woman besides her. This vow was made before Sati's demise,
    and it highlights Shiva's devotion and commitment to Sati.
  summary_hi: भगवान शिव ने दक्ष की पुत्री सती से यह प्रतिज्ञा की थी कि वे उसके अलावा
    किसी अन्य स्त्री से विवाह नहीं करेंगे। यह प्रतिज्ञा सती की मृत्यु से पहले की गई
    थी और यह शिव की सती के प्रति भक्ति और समर्पण को दर्शाती है।
- id: parvati-marriage-discussion
  type: story
  keywords:
  - Parvati
  - marriage
  - Himalaya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 9
  summary_en: In this episode, Mena, the wife of Himalaya, expresses her desire for
    their daughter Parvati to be married to a suitable groom. She approaches her husband
    with this request, emphasizing the importance of finding a groom with good qualities.
    Himalaya advises Mena to encourage Parvati to perform penance for Lord Shiva,
    as his blessings would ensure a prosperous marriage.
  summary_hi: इस प्रकरण में, हिमालय की पत्नी मेना अपनी पुत्री पार्वती के लिए एक उपयुक्त
    वर की इच्छा व्यक्त करती हैं। वह अपने पति से इस अनुरोध के साथ संपर्क करती हैं,
    जिसमें अच्छे गुणों वाले वर की आवश्यकता पर जोर दिया गया है। हिमालय मेना को सलाह
    देते हैं कि वह पार्वती को भगवान शिव के लिए तप करने के लिए प्रेरित करें, क्योंकि
    उनकी कृपा से एक समृद्ध विवाह सुनिश्चित होगा।
- id: parvati-dream
  type: story
  keywords:
  - Parvati
  - dream
  - penance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 9
  summary_en: Parvati shares a dream she had with her mother Mena, where a sage advises
    her to perform penance for Lord Shiva. This dream reinforces the idea that Parvati
    should focus on her devotion to Shiva to achieve a favorable outcome in her life.
  summary_hi: पार्वती अपनी माँ मेना के साथ एक सपना साझा करती हैं, जिसमें एक ऋषि उन्हें
    भगवान शिव के लिए तप करने की सलाह देते हैं। यह सपना इस विचार को मजबूत करता है कि
    पार्वती को अपने जीवन में अनुकूल परिणाम प्राप्त करने के लिए शिव की भक्ति पर ध्यान
    केंद्रित करना चाहिए।
- id: parvati-tapasya-and-dream
  type: story
  keywords:
  - Parvati
  - Tapasya
  - Dream
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Parvati, encouraged by a dream and her mother's guidance, decides to
    undertake severe penance to win Lord Shiva's favor. Despite her mother's initial
    hesitation, Parvati is determined to follow the path shown in her dream, which
    involves a sage advising her to perform penance for Shiva.
  summary_hi: पार्वती, एक स्वप्न और अपनी माँ के मार्गदर्शन से प्रेरित होकर, भगवान
    शिव की कृपा प्राप्त करने के लिए कठोर तपस्या करने का निर्णय लेती हैं। अपनी माँ
    की प्रारंभिक हिचकिचाहट के बावजूद, पार्वती अपने स्वप्न में दिखाए गए मार्ग का अनुसरण
    करने के लिए दृढ़ संकल्पित हैं, जिसमें एक ऋषि उन्हें शिव के लिए तपस्या करने की
    सलाह देते हैं।
- id: shiva-and-kamadeva
  type: story
  keywords:
  - Shiva
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Lord Shiva, while performing penance, is targeted by Kamadeva, the god
    of love, who tries to disturb him with his arrows. However, Shiva remains unaffected
    and burns Kamadeva with the fire from his third eye, demonstrating his supreme
    control over desires.
  summary_hi: भगवान शिव, तपस्या करते समय, कामदेव द्वारा लक्षित होते हैं, जो उन्हें
    अपने बाणों से विचलित करने की कोशिश करते हैं। हालांकि, शिव अप्रभावित रहते हैं और
    अपनी तीसरी आँख की अग्नि से कामदेव को भस्म कर देते हैं, अपनी इच्छाओं पर सर्वोच्च
    नियंत्रण का प्रदर्शन करते हुए।
- id: shiva-parvati-marriage
  type: event
  keywords:
  - Shiva
  - Parvati
  - Marriage
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: After Parvati's successful penance and the destruction of her pride,
    Lord Shiva is pleased and agrees to marry her. The marriage is conducted with
    great celebration and auspiciousness, marking the union of Shiva and Parvati.
  summary_hi: पार्वती की सफल तपस्या और उनके अभिमान के नाश के बाद, भगवान शिव प्रसन्न
    होते हैं और उनसे विवाह करने के लिए सहमत होते हैं। विवाह बड़े धूमधाम और शुभता के
    साथ संपन्न होता है, जो शिव और पार्वती के मिलन को चिह्नित करता है।
- id: bhoomotpatti-from-shivas-forehead
  type: story
  keywords:
  - Bhoomotpatti
  - Shiva
  - birth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 10
  summary_en: From the forehead of Lord Shiva, a child named Bhoomotpatti was born.
    This child had a divine appearance with four arms and a radiant form. The earth,
    taking a female form, nurtured the child with love and care.
  summary_hi: भगवान शिव के ललाट से एक बालक जिसका नाम भूमोत्पत्ति था, उत्पन्न हुआ।
    इस बालक का दिव्य रूप था, चार भुजाएँ थीं और वह तेजस्वी था। पृथ्वी ने स्त्री रूप
    धारण कर उस बालक को प्रेमपूर्वक पोषण किया।
- id: bhuma-birth-story
  type: story
  keywords:
  - bhuma
  - shiva
  - earth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 10
  summary_en: From the sweat of Lord Shiva's forehead, a child named Bhuma was born.
    The Earth, taking the form of a beautiful woman, adopted the child and nurtured
    him. Bhuma grew up to be a virtuous and powerful being, eventually attaining the
    status of a celestial body and moving to a divine realm beyond Shukra Loka.
  summary_hi: भगवान शिव के ललाट से पसीने की बूंदों से एक बालक भौम का जन्म हुआ। पृथ्वी
    ने एक सुंदर स्त्री का रूप धारण कर उस बालक को गोद लिया और उसका पालन-पोषण किया।
    भौम एक गुणवान और शक्तिशाली व्यक्ति बन गया और अंततः एक दिव्य लोक में स्थान प्राप्त
    किया।
- id: shiva-meditation-on-himalaya
  type: story
  keywords:
  - Shiva
  - meditation
  - Himalaya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Lord Shiva, accompanied by his attendants like Nandi, goes to the sacred
    peak of the Himalayas, known as Gangavatar, to meditate. There, he begins his
    deep meditation, focusing on his own divine form, free from duality and attachment.
    His attendants also engage in meditation, while some serve as gatekeepers.
  summary_hi: भगवान शिव, नंदी आदि अपने पार्षदों के साथ, हिमालय के गंगावतार नामक पवित्र
    शिखर पर ध्यान करने जाते हैं। वहाँ वे अपने दिव्य रूप पर ध्यान केंद्रित करते हुए
    गहन ध्यान आरंभ करते हैं, जो द्वैत और आसक्ति से मुक्त है। उनके पार्षद भी ध्यान
    में लीन हो जाते हैं, जबकि कुछ द्वारपाल के रूप में सेवा करते हैं।
- id: himalaya-praises-shiva
  type: story
  keywords:
  - Himalaya
  - Shiva
  - praise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Himalaya, upon hearing of Lord Shiva's arrival at the medicinal peak,
    goes to greet him with respect. Accompanied by his attendants, Himalaya bows to
    Lord Rudra, worships him, and praises him for being the protector of the three
    worlds, acknowledging his divine qualities and expressing gratitude for his presence.
  summary_hi: भगवान शिव के औषधि शिखर पर आगमन की सूचना पाकर हिमालय आदरपूर्वक उनका स्वागत
    करने जाते हैं। अपने गणों के साथ हिमालय प्रभु रुद्र को प्रणाम करते हैं, उनकी पूजा
    करते हैं और तीनों लोकों के रक्षक के रूप में उनकी स्तुति करते हैं, उनके दिव्य गुणों
    को स्वीकार करते हुए उनकी उपस्थिति के लिए आभार व्यक्त करते हैं।
- id: shiva-tapasya-on-himalayas
  type: story
  keywords:
  - Shiva
  - Himalayas
  - Tapasya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 11
  summary_en: Lord Shiva arrives at the Himalayas to perform penance in solitude.
    He requests the mountain king, Himavan, to ensure that no one disturbs his meditation.
    Himavan, honored by Shiva's presence, promises to make all necessary arrangements
    to prevent any interruptions.
  summary_hi: भगवान शिव हिमालय पर एकांत में तपस्या करने के लिए आते हैं। वह पर्वतों
    के राजा हिमवान से अनुरोध करते हैं कि उनकी साधना में कोई विघ्न न आए। हिमवान, शिव
    की उपस्थिति से सम्मानित होकर, यह सुनिश्चित करने का वादा करते हैं कि कोई भी बाधा
    न आए।
- id: himavan-ensures-no-disturbance
  type: event
  keywords:
  - Himavan
  - Ganga
  - Tapasya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 11
  summary_en: Himavan, the king of mountains, instructs his followers that no one
    should visit the site of Shiva's penance at the Ganga's descent. He warns that
    anyone who disobeys will be punished severely. This ensures that Shiva's meditation
    remains undisturbed.
  summary_hi: पर्वतों के राजा हिमवान अपने अनुयायियों को निर्देश देते हैं कि कोई भी
    गंगा के अवतरण स्थल पर शिव की तपस्या के स्थान पर न जाए। वह चेतावनी देते हैं कि
    जो कोई भी इस आदेश का उल्लंघन करेगा, उसे कड़ी सजा दी जाएगी। इससे शिव की साधना में
    कोई विघ्न नहीं आता।
- id: himalaya-offers-parvati-to-shiva
  type: story
  keywords:
  - Himalaya
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1, Section 19
  summary_en: Himalaya, the king of mountains, approaches Lord Shiva with his daughter
    Parvati, offering her in marriage. Parvati is described as beautiful and eager
    to serve Shiva. Himalaya requests Shiva to accept her as his consort, highlighting
    her devotion and readiness to serve him.
  summary_hi: हिमालय, पर्वतों के राजा, भगवान शिव के पास अपनी पुत्री पार्वती को विवाह
    के लिए प्रस्तुत करते हैं। पार्वती को सुंदर और शिव की सेवा करने के लिए उत्सुक बताया
    गया है। हिमालय शिव से अनुरोध करते हैं कि वे उसे अपनी पत्नी के रूप में स्वीकार
    करें, उसकी भक्ति और सेवा की तत्परता को उजागर करते हुए।
- id: shiva-parvati-philosophical-dialogue
  type: story
  keywords:
  - Shiva
  - Parvati
  - dialogue
  - philosophy
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 13
  summary_en: In a philosophical dialogue, Parvati questions Shiva about the nature
    of Prakriti (nature) and its relationship with the divine. Shiva explains that
    through intense penance, he transcends Prakriti and remains detached from it.
    Parvati challenges this notion, emphasizing that all actions and experiences are
    bound by Prakriti.
  summary_hi: पार्वती और शिव के बीच एक दार्शनिक संवाद होता है जिसमें पार्वती प्रकृति
    और दिव्यता के संबंध के बारे में प्रश्न करती हैं। शिव बताते हैं कि गहन तपस्या के
    माध्यम से वे प्रकृति से परे हो जाते हैं। पार्वती इस विचार को चुनौती देती हैं और
    कहती हैं कि सभी क्रियाएँ और अनुभव प्रकृति से बंधे होते हैं।
- id: parvati-service-to-shiva
  type: story
  keywords:
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Parvati, along with her friends, regularly visited Lord Shiva to serve
    him with devotion. She performed rituals like washing Shiva's feet and drinking
    the water, and worshipped him with sixteen types of offerings. Despite her dedication,
    Shiva did not immediately accept her as his consort.
  summary_hi: पार्वती अपनी सहेलियों के साथ नियमित रूप से भगवान शिव की सेवा करने जाती
    थीं। उन्होंने शिव के चरण धोकर चरणोदक का पान किया और षोडशोपचार से उनकी पूजा की।
    उनकी भक्ति के बावजूद, शिव ने उन्हें तुरंत अपनी पत्नी के रूप में स्वीकार नहीं किया।
- id: kama-sent-to-disturb-shiva
  type: event
  keywords:
  - Kama
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: The gods, including Indra and sages, sent Kama, the god of love, to
    disturb Shiva's meditation and make him fall in love with Parvati. However, Shiva
    remained unaffected by Kama's attempts and eventually burned him to ashes.
  summary_hi: इंद्र और ऋषियों सहित देवताओं ने कामदेव को शिव की तपस्या भंग करने और
    पार्वती से प्रेम उत्पन्न करने के लिए भेजा। हालांकि, शिव कामदेव के प्रयासों से
    अप्रभावित रहे और अंततः उन्हें भस्म कर दिया।
- id: shiva-parvati-union
  type: story
  keywords:
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 13
  summary_en: Parvati, devoted to Shiva, engages in severe penance to win his affection.
    Despite the attempts of Kamadeva to disturb Shiva's meditation, Shiva remains
    unaffected and incinerates Kamadeva. Eventually, Parvati's devotion and penance
    lead to her union with Shiva as her husband.
  summary_hi: पार्वती, शिव की भक्ति में लीन होकर, उनकी कृपा पाने के लिए कठोर तप करती
    हैं। कामदेव के शिव के ध्यान को भंग करने के प्रयासों के बावजूद, शिव अप्रभावित रहते
    हैं और कामदेव को भस्म कर देते हैं। अंततः, पार्वती की भक्ति और तपस्या के फलस्वरूप
    उन्हें शिव पति रूप में प्राप्त होते हैं।
- id: kamadeva-incineration
  type: event
  keywords:
  - Kamadeva
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 13
  summary_en: Kamadeva is sent by the gods to disturb Shiva's meditation and incite
    love between Shiva and Parvati. However, Shiva remains undisturbed and incinerates
    Kamadeva with his third eye.
  summary_hi: कामदेव को देवताओं द्वारा शिव के ध्यान को भंग करने और शिव और पार्वती
    के बीच प्रेम उत्पन्न करने के लिए भेजा जाता है। हालांकि, शिव अप्रभावित रहते हैं
    और अपने तीसरे नेत्र से कामदेव को भस्म कर देते हैं।
- id: tarakasura-oppression
  type: story
  keywords:
  - Tarakasura
  - Devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 13
  summary_en: The mighty demon Tarakasura oppresses the gods, leading them to seek
    a solution. The gods, along with sages, send Kamadeva to unite Shiva and Parvati,
    hoping their offspring would defeat Tarakasura.
  summary_hi: महापराक्रमी दानव तारकासुर देवताओं को पीड़ित करता है, जिससे वे समाधान
    की खोज में लग जाते हैं। देवता और ऋषि, शिव और पार्वती के मिलन के लिए कामदेव को
    भेजते हैं, इस आशा में कि उनका संतान तारकासुर का वध करेगा।
- id: birth-of-maruts
  type: story
  keywords:
  - maruts
  - diti
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Diti, after being consoled by Kashyapa, performed penance and gave birth
    to forty-nine sons known as the Maruts. These sons were accepted by Indra and
    became divine beings.
  summary_hi: दिति ने कश्यप के समझाने पर तपस्या की और उनचास पुत्रों को जन्म दिया जिन्हें
    मरुत कहा गया। ये पुत्र इंद्र द्वारा स्वीकार किए गए और देवता बन गए।
- id: birth-of-vajrang
  type: story
  keywords:
  - vajrang
  - diti
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After completing her penance, Diti gave birth to a powerful son named
    Vajrang, who was as strong as his name suggests. He captured Indra and other gods,
    causing distress among them.
  summary_hi: तपस्या पूरी करने के बाद, दिति ने वज्रांग नामक एक शक्तिशाली पुत्र को
    जन्म दिया, जो अपने नाम के अनुसार ही शक्तिशाली था। उसने इंद्र और अन्य देवताओं को
    पकड़ लिया, जिससे उनमें दुख फैल गया।
- id: transformation-of-vajrang
  type: story
  keywords:
  - vajrang
  - transformation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vajrang, under the influence of his mother Diti, initially caused trouble
    for the gods. However, after receiving guidance, he adopted a sattvic nature,
    leaving behind his asuric tendencies and lived peacefully.
  summary_hi: वज्रांग, अपनी माता दिति के प्रभाव में आकर, प्रारंभ में देवताओं के लिए
    समस्या उत्पन्न करता था। हालांकि, मार्गदर्शन प्राप्त करने के बाद, उसने सात्विक
    स्वभाव अपनाया और अपनी आसुरी प्रवृत्तियों को छोड़कर शांतिपूर्वक जीवन व्यतीत किया।
- id: vajrang-creation-of-varangi
  type: story
  keywords:
  - Vajrang
  - Varangi
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 14
  summary_en: The sage creates a beautiful woman named Varangi and gives her to the
    demon Vajrang, who becomes sattvic and peaceful. However, Varangi does not develop
    a sattvic nature and serves her husband with devotion.
  summary_hi: ऋषि एक सुन्दर स्त्री वरांगी का निर्माण करते हैं और उसे दैत्य वज्रांग
    को देते हैं, जो सात्त्विक और शांत हो जाता है। हालांकि, वरांगी सात्त्विक स्वभाव
    नहीं अपनाती और अपने पति की श्रद्धापूर्वक सेवा करती है।
- id: vajrang-asks-for-son
  type: story
  keywords:
  - Vajrang
  - Varangi
  - Son
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 14
  summary_en: Vajrang is pleased with Varangi's service and asks her what she desires.
    Varangi expresses her wish for a powerful son who can defeat Indra. Vajrang is
    troubled by this request but decides to fulfill it.
  summary_hi: वज्रांग वरांगी की सेवा से प्रसन्न होकर उससे उसकी इच्छा पूछता है। वरांगी
    एक महाबली पुत्र की इच्छा व्यक्त करती है जो इन्द्र को पराजित कर सके। वज्रांग इस
    अनुरोध से चिंतित होता है लेकिन इसे पूरा करने का निर्णय लेता है।
- id: vajrang-penance-for-son
  type: story
  keywords:
  - Vajrang
  - Penance
  - Son
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 14
  summary_en: Vajrang performs intense penance to fulfill Varangi's wish for a powerful
    son. Brahma, pleased with his penance, grants him the boon of a son who will be
    a great warrior and a source of trouble for Indra.
  summary_hi: वज्रांग वरांगी की इच्छा को पूरा करने के लिए कठोर तप करता है। ब्रह्मा
    उसकी तपस्या से प्रसन्न होकर उसे एक पुत्र का वरदान देते हैं, जो महान योद्धा होगा
    और इन्द्र के लिए संकट का कारण बनेगा।
- id: birth-of-taraka-demon
  type: story
  keywords:
  - taraka
  - demon
  - birth
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Varangi, after a long period of gestation, gave birth to a son named
    Taraka. His birth was accompanied by ominous signs and disturbances in nature,
    indicating his future as a powerful demon who would bring distress to the gods.
  summary_hi: वरांगी ने लंबे गर्भकाल के बाद तारक नामक पुत्र को जन्म दिया। उसके जन्म
    के साथ ही प्रकृति में अशुभ संकेत और उथल-पुथल हुई, जो उसके भविष्य में एक शक्तिशाली
    दानव बनने का संकेत था, जो देवताओं के लिए कष्ट का कारण बनेगा।
- id: taraka-tapasya
  type: story
  keywords:
  - taraka
  - tapasya
  - boon
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Taraka, seeking to gain power over the gods, undertook severe penance.
    He stood on one leg, gazing at the sun for a hundred years, and performed various
    other austerities to please the deities and gain boons.
  summary_hi: तारक ने देवताओं पर विजय प्राप्त करने के लिए कठोर तपस्या की। उसने एक
    पैर पर खड़े होकर सौ वर्षों तक सूर्य की ओर देखते हुए तप किया और विभिन्न अन्य कठोर
    साधनाएँ कीं ताकि देवताओं को प्रसन्न कर वरदान प्राप्त कर सके।
- id: tarakasura-tapasya
  type: story
  keywords:
  - Tarakasura
  - tapasya
  - boon
  source:
    book: Shiv Puran
    sarga: अध्याय १५
  summary_en: Tarakasura, a powerful demon, performs intense penance to please Brahma
    and seeks a boon to become invincible. His penance causes disturbances in the
    universe, alarming the gods and sages. Eventually, Brahma appears and offers him
    a boon, which Tarakasura uses to ask for unparalleled strength.
  summary_hi: तारकासुर, एक शक्तिशाली दैत्य, ब्रह्मा को प्रसन्न करने के लिए कठोर तपस्या
    करता है और अजेय बनने का वरदान मांगता है। उसकी तपस्या से ब्रह्मांड में उपद्रव होता
    है, जिससे देवता और ऋषि चिंतित हो जाते हैं। अंततः ब्रह्मा प्रकट होते हैं और उसे
    वरदान देते हैं, जिसे तारकासुर अद्वितीय शक्ति के लिए मांगता है।
- id: tarakasura-boon-and-reign
  type: story
  keywords:
  - Tarakasura
  - boon
  - reign
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 15
  summary_en: Tarakasura, a demon, receives a boon that he can only be killed by a
    son of Shiva. After receiving this boon, he becomes the ruler of the three worlds,
    oppressing both gods and humans. He takes valuable possessions from the gods,
    including Indra's elephant and Kubera's treasures, and establishes his dominance
    over the universe.
  summary_hi: तारकासुर, एक दैत्य, को वरदान मिलता है कि उसकी मृत्यु केवल शिव के पुत्र
    के हाथों हो सकती है। इस वरदान को प्राप्त करने के बाद, वह तीनों लोकों का शासक बन
    जाता है और देवताओं और मनुष्यों दोनों को पीड़ित करता है। वह इंद्र के हाथी और कुबेर
    के खजाने सहित देवताओं से कीमती वस्तुएं ले लेता है और ब्रह्मांड पर अपना प्रभुत्व
    स्थापित करता है।
- id: tarakasura-oppression-of-devas
  type: story
  keywords:
  - Tarakasura
  - Devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The Devas, oppressed by the demon Tarakasura, approach Brahma seeking
    relief. Tarakasura, having gained a boon, has become arrogant and has forcibly
    taken over the Devas' abodes. The Devas express their inability to perform rituals
    and seek Brahma's guidance to overcome their plight.
  summary_hi: तारकासुर द्वारा पीड़ित देवता ब्रह्मा के पास राहत की गुहार लगाते हैं।
    वरदान प्राप्त कर तारकासुर अहंकारी हो गया है और उसने देवताओं के स्थानों को जबरदस्ती
    अपने अधीन कर लिया है। देवता अपनी अनुष्ठान करने की असमर्थता व्यक्त करते हैं और
    अपनी स्थिति से उबरने के लिए ब्रह्मा से मार्गदर्शन मांगते हैं।
- id: tarakasura-destruction-prophecy
  type: story
  keywords:
  - Tarakasura
  - prophecy
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Brahma informs the gods that the demon Tarakasura, empowered by a boon,
    cannot be killed by anyone except a son born from Shiva's seed. He advises the
    gods to ensure that Shiva marries Parvati, the reincarnation of Sati, so that
    their offspring can defeat Tarakasura.
  summary_hi: ब्रह्मा देवताओं को बताते हैं कि वरदान से शक्तिशाली तारकासुर को केवल
    शिव के वीर्य से उत्पन्न पुत्र ही मार सकता है। वह देवताओं को सलाह देते हैं कि वे
    सुनिश्चित करें कि शिव का विवाह सती के पुनर्जन्म पार्वती से हो, ताकि उनका संतान
    तारकासुर को हरा सके।
- id: parvati-tapasya-for-shiva
  type: story
  keywords:
  - Parvati
  - Tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: '27'
  summary_en: Parvati, driven by her devotion and desire to marry Shiva, undertakes
    severe penance. Despite knowing the challenges, her mind is eager to perform the
    tapasya. A Brahmin questions her about the purpose of her penance, and she explains
    her unwavering commitment to Shiva.
  summary_hi: पार्वती, शिव से विवाह करने की अपनी भक्ति और इच्छा से प्रेरित होकर, कठोर
    तपस्या करती हैं। चुनौतियों को जानते हुए भी, उनका मन तपस्या करने के लिए उत्सुक
    है। एक ब्राह्मण उनसे उनकी तपस्या के उद्देश्य के बारे में पूछता है, और वह शिव के
    प्रति अपनी अटूट प्रतिबद्धता को समझाती हैं।
- id: tarakasura-surrender-episode
  type: story
  keywords:
  - Tarakasura
  - Brahma
  - Devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 16
  summary_en: Brahma advises Tarakasura to leave the kingdom of heaven and rule on
    Earth instead. Tarakasura agrees and moves to the city of Shonit to rule. The
    Devas, following Brahma's counsel, return to their respective abodes.
  summary_hi: ब्रह्मा तारकासुर को स्वर्ग का राज्य छोड़कर पृथ्वी पर शासन करने की सलाह
    देते हैं। तारकासुर सहमत होकर शोणित नगर में जाकर राज्य करने लगता है। देवता, ब्रह्मा
    की सलाह मानकर अपने-अपने स्थानों को लौट जाते हैं।
- id: indra-summons-kamadeva
  type: story
  keywords:
  - Indra
  - Kamadeva
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 17
  summary_en: Indra, troubled by the demon Tarakasura, summons Kamadeva to help distract
    Shiva from his meditation. Kamadeva arrives with his consort Rati and the season
    of spring, ready to assist Indra in his task.
  summary_hi: इंद्र, दानव तारकासुर से परेशान होकर, कामदेव को शिव को उनके ध्यान से
    विचलित करने के लिए बुलाते हैं। कामदेव अपनी पत्नी रति और वसंत ऋतु के साथ इंद्र
    की सहायता के लिए आते हैं।
- id: indra-requests-kamadeva-help
  type: story
  keywords:
  - Indra
  - Kamadeva
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Indra approaches Kamadeva for assistance in defeating the demon Tarakasura,
    who has become invincible due to a boon from Brahma. Kamadeva agrees to help by
    using his powers to disrupt the demon's focus, which is crucial for his defeat.
  summary_hi: इंद्र कामदेव के पास जाकर उनसे तरकासुर नामक राक्षस को पराजित करने में
    सहायता मांगते हैं, जो ब्रह्मा के वरदान के कारण अजेय हो गया है। कामदेव अपनी शक्तियों
    का उपयोग करके राक्षस के ध्यान को भंग करने में मदद करने के लिए सहमत होते हैं, जो
    उसकी हार के लिए महत्वपूर्ण है।
- id: indra-kamadeva-conversation
  type: story
  keywords:
  - Indra
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 17
  summary_en: Indra approaches Kamadeva to request his help in defeating the demon
    Taraka, who has become invincible due to a boon from Brahma. Indra believes that
    only Kamadeva can accomplish this task and urges him to use his powers to make
    Shiva fall in love with Parvati, as their offspring is destined to defeat Taraka.
  summary_hi: इन्द्र कामदेव के पास जाकर उनसे तारक नामक राक्षस को पराजित करने में सहायता
    करने का अनुरोध करते हैं, जो ब्रह्मा के वरदान के कारण अजेय हो गया है। इन्द्र को
    विश्वास है कि केवल कामदेव ही इस कार्य को पूरा कर सकते हैं और उनसे शिव को पार्वती
    से प्रेम करने के लिए प्रेरित करने का आग्रह करते हैं, क्योंकि उनका संतान तारक का
    वध करने के लिए नियत है।
- id: kamadeva-approaches-shiva
  type: story
  keywords:
  - Kamadeva
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 17
  summary_en: Kamadeva, along with his wife and the season of spring, approaches Shiva
    who is engaged in deep meditation. Kamadeva aims to use the influence of spring
    to distract Shiva and make him fall in love with Parvati, thus fulfilling Indra's
    request.
  summary_hi: कामदेव अपनी पत्नी और वसंत ऋतु के साथ शिव के पास जाते हैं, जो गहन ध्यान
    में लीन हैं। कामदेव वसंत के प्रभाव का उपयोग करके शिव को विचलित करने और उन्हें
    पार्वती से प्रेम करने के लिए प्रेरित करना चाहते हैं, जिससे इन्द्र की इच्छा पूरी
    हो सके।
- id: shiva-springtime-meditation
  type: story
  keywords:
  - Shiva
  - meditation
  - spring
  - Kama
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: During the onset of spring, the environment became filled with elements
    that heightened desires, making it unbearable for even the sages. Lord Shiva,
    observing the untimely influence of spring, found it astonishing and began intense
    meditation. Meanwhile, Kama, the god of love, attempted to disturb Shiva's meditation
    by shooting his flower arrows.
  summary_hi: वसंत के आगमन पर वातावरण कामनाओं को बढ़ाने वाले तत्वों से भर गया, जिससे
    मुनियों के लिए भी यह असहनीय हो गया। भगवान शिव ने वसंत के असमय प्रभाव को देखकर
    इसे आश्चर्यजनक माना और गहन ध्यान में लीन हो गए। इस बीच, कामदेव ने शिव के ध्यान
    को भंग करने के लिए अपने पुष्प बाण चलाए।
- id: parvati-flower-offering
  type: story
  keywords:
  - Parvati
  - Shiva
  - flowers
  - devotion
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: Parvati, accompanied by her friends, collected beautiful flowers to
    offer to Lord Shiva. Her beauty surpassed all descriptions, and upon reaching
    Shiva, her presence momentarily distracted him from his meditation. This provided
    an opportunity for Kama to attempt to influence Shiva with his arrows.
  summary_hi: पार्वती अपनी सखियों के साथ भगवान शिव को अर्पित करने के लिए सुंदर फूल
    एकत्रित करती हैं। उनका सौंदर्य सभी वर्णनों से परे था, और शिव के पास पहुँचने पर
    उनकी उपस्थिति ने क्षण भर के लिए शिव के ध्यान को भंग कर दिया। इसने कामदेव को अपने
    बाणों से शिव को प्रभावित करने का अवसर प्रदान किया।
- id: parvati-shiva-meeting
  type: event
  keywords:
  - Parvati
  - Shiva
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati, accompanied by her two friends, arrives with flowers to worship
    Shiva. As she approaches, Shiva momentarily breaks his meditation. Kamadeva seizes
    this opportunity to shoot a flower arrow at Shiva to incite interest in Parvati.
    Despite the interruption, Shiva recalls the boon given to Parvati by Brahma and
    praises her beauty.
  summary_hi: पार्वती अपनी दो सखियों के साथ शिव की पूजा के लिए पुष्प लेकर आती हैं।
    उनके आने पर शिव क्षणभर के लिए ध्यान से बाहर आते हैं। कामदेव इस अवसर का लाभ उठाकर
    शिव पर पुष्प बाण चलाते हैं ताकि पार्वती में उनकी रुचि उत्पन्न हो। शिव ब्रह्मा
    द्वारा पार्वती को दिए गए वरदान को याद करते हैं और उनकी सुंदरता की प्रशंसा करते
    हैं।
- id: parvati-beauty-description
  type: character
  keywords:
  - Parvati
  - beauty
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 18
  summary_en: In this episode, Lord Shiva describes the unparalleled beauty of Parvati,
    comparing her features to celestial and natural wonders. Her beauty is said to
    be unmatched in all three worlds, and she is described as a source of great joy
    and allure, even to sages.
  summary_hi: इस प्रकरण में, भगवान शिव पार्वती की अतुलनीय सुंदरता का वर्णन करते हैं,
    उनके अंगों की तुलना स्वर्गीय और प्राकृतिक चमत्कारों से करते हैं। उनकी सुंदरता
    तीनों लोकों में अद्वितीय बताई गई है, और उन्हें महान आनंद और आकर्षण का स्रोत कहा
    गया है, यहां तक कि ऋषियों के लिए भी।
- id: shiva-renounces-desire
  type: story
  keywords:
  - Shiva
  - renunciation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 18
  summary_en: After experiencing a moment of desire for Parvati, Lord Shiva reflects
    on the nature of desire and renounces it, realizing that as a supreme being, he
    should not be swayed by such emotions. He abandons his seat and adopts a state
    of detachment, questioning how even a supreme being could fall into the trap of
    desire.
  summary_hi: पार्वती के प्रति एक क्षणिक इच्छा का अनुभव करने के बाद, भगवान शिव इच्छा
    की प्रकृति पर विचार करते हैं और इसे त्याग देते हैं, यह महसूस करते हुए कि एक सर्वोच्च
    प्राणी के रूप में उन्हें ऐसे भावनाओं से प्रभावित नहीं होना चाहिए। वह अपने आसन
    को छोड़ देते हैं और वैराग्य की स्थिति अपनाते हैं, यह प्रश्न करते हुए कि कैसे एक
    सर्वोच्च प्राणी भी इच्छा के जाल में फंस सकता है।
- id: kama-burnt-by-shiva
  type: event
  keywords:
  - Kama
  - Shiva
  - anger
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 19
  summary_en: In this episode, Lord Shiva, disturbed by the interruption in his meditation,
    sees Kama (the god of love) aiming an arrow at him. In a fit of anger, Shiva burns
    Kama to ashes with his third eye. This event leads to Rati's lamentation and the
    gods pleading with Shiva to revive Kama.
  summary_hi: इस प्रकरण में, भगवान शिव, अपनी ध्यान में बाधा से परेशान होकर, काम (प्रेम
    के देवता) को अपने ऊपर बाण साधते हुए देखते हैं। क्रोध में, शिव अपने तीसरे नेत्र
    से काम को भस्म कर देते हैं। इस घटना के बाद रति का विलाप होता है और देवता शिव से
    काम को पुनर्जीवित करने की प्रार्थना करते हैं।
- id: kama-destroys-episode
  type: story
  keywords:
  - Kama
  - Shiva
  - destruction
  source:
    book: Shiv Puran
    sarga: III
  summary_en: Kama, the god of love, attempts to disturb Lord Shiva's meditation by
    shooting an arrow at him. However, Shiva's power renders the arrow ineffective,
    and in his anger, Shiva opens his third eye, releasing a fiery blaze that incinerates
    Kama. The gods, witnessing this, are filled with sorrow and plead with Shiva for
    mercy.
  summary_hi: कामदेव, प्रेम के देवता, भगवान शिव के ध्यान को भंग करने के लिए उन पर
    बाण चलाते हैं। हालांकि, शिव की शक्ति से बाण निष्फल हो जाता है, और क्रोधित होकर
    शिव अपनी तीसरी आँख खोलते हैं, जिससे एक अग्नि ज्वाला निकलती है जो कामदेव को भस्म
    कर देती है। यह देखकर देवता दुखी हो जाते हैं और शिव से दया की प्रार्थना करते हैं।
- id: rati-lamentation-episode
  type: story
  keywords:
  - Rati
  - lamentation
  - Kama
  source:
    book: Shiv Puran
    sarga: III
  summary_en: After Kama is incinerated by Shiva's third eye, Rati, Kama's wife, is
    overwhelmed with grief. She laments the loss of her husband, expressing her sorrow
    and confusion about the events that transpired. The gods console her, suggesting
    that Shiva might restore Kama to life.
  summary_hi: शिव की तीसरी आँख से कामदेव के भस्म हो जाने के बाद, रति, कामदेव की पत्नी,
    अत्यधिक दुखी हो जाती हैं। वह अपने पति की मृत्यु पर विलाप करती हैं, अपनी पीड़ा
    और घटनाओं के बारे में उलझन व्यक्त करती हैं। देवता उन्हें सांत्वना देते हैं और
    सुझाव देते हैं कि शिव कामदेव को पुनर्जीवित कर सकते हैं।
- id: rati-lamentation-and-consolation
  type: story
  keywords:
  - Rati
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Rati, the wife of Kamadeva, laments the loss of her husband and is consoled
    by the gods who assure her that Mahadev will revive Kamadeva. They advise her
    to keep some ashes and not to fear, as Kamadeva will be brought back to life.
  summary_hi: रति, कामदेव की पत्नी, अपने पति के खोने पर विलाप करती है और देवताओं द्वारा
    सांत्वना दी जाती है जो उसे आश्वासन देते हैं कि महादेव कामदेव को पुनर्जीवित करेंगे।
    वे उसे कुछ भस्म रखने और भय न करने की सलाह देते हैं, क्योंकि कामदेव को पुनर्जीवित
    किया जाएगा।
- id: shiva-assurance-to-gods
  type: story
  keywords:
  - Shiva
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods approach Shiva, pleading for Kamadeva's revival. Shiva, pleased
    with their devotion, assures them that Kamadeva will remain formless until Krishna's
    incarnation, after which he will be reborn as Pradyumna, the son of Krishna and
    Rukmini.
  summary_hi: देवता शिव के पास जाकर कामदेव के पुनर्जीवन की प्रार्थना करते हैं। शिव,
    उनकी भक्ति से प्रसन्न होकर, उन्हें आश्वासन देते हैं कि कामदेव श्रीकृष्ण के अवतार
    तक निराकार रहेंगे, जिसके बाद वे कृष्ण और रुक्मिणी के पुत्र प्रद्युम्न के रूप में
    पुनर्जन्म लेंगे।
- id: pradyumna-rebirth-and-reunion
  type: story
  keywords:
  - Pradyumna
  - Sambara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva foretells that Pradyumna, the rebirth of Kamadeva, will be kidnapped
    by the demon Sambara and thrown into the sea. However, Pradyumna will eventually
    defeat Sambara, reclaim his wife, and return to his city with Sambara's wealth.
  summary_hi: शिव भविष्यवाणी करते हैं कि कामदेव के पुनर्जन्म प्रद्युम्न को दानव शम्बर
    द्वारा अपहरण कर समुद्र में फेंक दिया जाएगा। हालांकि, प्रद्युम्न अंततः शम्बर को
    पराजित करेगा, अपनी पत्नी को पुनः प्राप्त करेगा, और शम्बर के धन के साथ अपने नगर
    लौटेगा।
- id: shiva-revives-kama
  type: story
  keywords:
  - Shiva
  - Kama
  - resurrection
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 19
  summary_en: After the gods plead with Shiva to revive Kama, Shiva, pleased with
    their request, agrees to bring Kama back to life. He instructs the gods not to
    reveal this story to anyone and assures them that Kama will live in everyone's
    hearts as one of his attendants.
  summary_hi: देवताओं के अनुरोध पर शिव कामदेव को पुनर्जीवित करने के लिए सहमत होते
    हैं। शिव देवताओं से कहते हैं कि इस आख्यान को किसी के सामने न कहें और आश्वासन देते
    हैं कि कामदेव सबके हृदय में उनके गण के रूप में जीवित रहेगा।
- id: shiva-third-eye-fire
  type: story
  keywords:
  - Shiva
  - third eye
  - fire
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 20
  summary_en: The fire from Shiva's third eye, which had incinerated Kama, begins
    to spread uncontrollably. The gods and sages, in distress, approach Brahma for
    help. Brahma, recalling Shiva, manages to contain the fire and transforms it into
    a Vadava fire, which he then places in the ocean for the welfare of the world.
  summary_hi: शिव के तीसरे नेत्र से निकली अग्नि, जिसने कामदेव को भस्म कर दिया था,
    अनियंत्रित रूप से फैलने लगती है। देवता और ऋषि ब्रह्मा के पास सहायता के लिए जाते
    हैं। ब्रह्मा शिव का स्मरण कर अग्नि को नियंत्रित करते हैं और उसे वडवा अग्नि में
    बदलकर समुद्र में स्थापित कर देते हैं।
- id: transformation-of-anger-into-horse
  type: story
  keywords:
  - Shiva
  - anger
  - horse
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 20
  summary_en: In this episode, Lord Shiva's anger, which had the potential to destroy
    the three worlds, is transformed into a horse by Brahma. This horse, representing
    Shiva's wrath, is taken to the ocean for the benefit of the world.
  summary_hi: इस प्रकरण में, भगवान शिव के क्रोध को, जो तीनों लोकों को नष्ट करने की
    क्षमता रखता था, ब्रह्मा द्वारा घोड़े में परिवर्तित कर दिया जाता है। यह घोड़ा,
    जो शिव के क्रोध का प्रतीक है, विश्व के कल्याण के लिए समुद्र में ले जाया जाता है।
- id: ocean-accepts-shivas-anger
  type: story
  keywords:
  - ocean
  - Shiva
  - anger
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 20
  summary_en: The ocean, personified as a divine being, accepts the task of containing
    Shiva's anger in the form of the horse. This anger, known as Vadavanala, is to
    be sustained by the ocean until the time of cosmic dissolution.
  summary_hi: समुद्र, जो एक दिव्य पुरुष के रूप में प्रकट होता है, शिव के क्रोध को
    घोड़े के रूप में धारण करने का कार्य स्वीकार करता है। यह क्रोध, जो वडवानल के रूप
    में जाना जाता है, समुद्र द्वारा ब्रह्मांडीय प्रलय तक धारण किया जाना है।
- id: world-relieved-from-shivas-anger
  type: story
  keywords:
  - Shiva
  - world
  - relief
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 20
  summary_en: After the ocean accepts Shiva's anger, the world is relieved from the
    threat of destruction. The divine beings and sages rejoice as the cosmic balance
    is restored.
  summary_hi: समुद्र द्वारा शिव के क्रोध को स्वीकार करने के बाद, दुनिया विनाश के खतरे
    से मुक्त हो जाती है। देवता और ऋषि प्रसन्न होते हैं क्योंकि ब्रह्मांडीय संतुलन
    बहाल हो जाता है।
- id: parvati-grief-after-kamadeva-destruction
  type: story
  keywords:
  - Parvati
  - Kamadeva
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Kamadeva is burned by Shiva's third eye, Parvati becomes deeply
    distressed and returns to her father's home. She is inconsolable and constantly
    thinks of Shiva, feeling no peace or happiness. Her father, Himavan, tries to
    comfort her, but she remains in grief over her separation from Shiva.
  summary_hi: कामदेव के शिव के तीसरे नेत्र से भस्म हो जाने के बाद, पार्वती अत्यंत
    दुखी हो जाती हैं और अपने पिता के घर लौट जाती हैं। वह शिव के विरह में शोकाकुल रहती
    हैं और उन्हें कहीं भी शांति या सुख नहीं मिलता। उनके पिता हिमवान उन्हें सांत्वना
    देने का प्रयास करते हैं, लेकिन वह शिव से अलगाव के कारण दुखी रहती हैं।
- id: himavan-narada-visit
  type: event
  keywords:
  - Himavan
  - Narada
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Narada visits the Himalayas and is warmly welcomed by King Himavan.
    They engage in a conversation where Himavan narrates the story of his daughter
    Parvati's devotion to Lord Shiva.
  summary_hi: नारद हिमालय पर्वत पर जाते हैं और राजा हिमवान द्वारा उनका स्वागत किया
    जाता है। वे एक वार्तालाप में संलग्न होते हैं जहाँ हिमवान अपनी पुत्री पार्वती की
    भगवान शिव के प्रति भक्ति की कहानी सुनाते हैं।
- id: parvati-devotion-to-shiva
  type: story
  keywords:
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Himavan narrates the story of his daughter Parvati's devotion to Lord
    Shiva. Despite challenges, Parvati remains steadfast in her worship, and Narada
    advises her to continue her penance to win Shiva's favor.
  summary_hi: हिमवान अपनी पुत्री पार्वती की भगवान शिव के प्रति भक्ति की कहानी सुनाते
    हैं। चुनौतियों के बावजूद, पार्वती अपनी पूजा में दृढ़ रहती हैं, और नारद उन्हें
    शिव की कृपा प्राप्त करने के लिए अपनी तपस्या जारी रखने की सलाह देते हैं।
- id: narada-advises-parvati
  type: event
  keywords:
  - Narada
  - Parvati
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Narada advises Parvati to perform intense penance to please Lord Shiva.
    He teaches her the Panchakshara mantra, 'Namah Shivaya,' explaining its power
    to fulfill desires and attain liberation.
  summary_hi: नारद पार्वती को भगवान शिव को प्रसन्न करने के लिए गहन तपस्या करने की
    सलाह देते हैं। वे उन्हें पंचाक्षर मंत्र 'नमः शिवाय' सिखाते हैं, इसके इच्छाओं को
    पूरा करने और मुक्ति प्राप्त करने की शक्ति को समझाते हुए।
- id: parvati-receives-panchakshara-mantra
  type: story
  keywords:
  - Parvati
  - Panchakshara Mantra
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: After Narada's advice, Parvati becomes pleased as she receives the supreme
    Panchakshara Mantra. This mantra is believed to quickly satisfy Lord Shiva when
    chanted with devotion.
  summary_hi: नारद के उपदेश के बाद, पार्वती अत्यंत प्रसन्न होती हैं क्योंकि उन्हें
    परम उत्तम पंचाक्षर मंत्र की प्राप्ति होती है। इस मंत्र का जप करने से भगवान शिव
    शीघ्र ही संतुष्ट होते हैं।
- id: parvati-seeks-permission-for-penance
  type: story
  keywords:
  - Parvati
  - Penance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Parvati decides to undertake penance to attain Lord Shiva. She seeks
    permission from her parents, Himalaya and Mena, through her friends Jaya and Vijaya.
    Himalaya agrees, but Mena is initially hesitant.
  summary_hi: पार्वती भगवान शिव को प्राप्त करने के लिए तपस्या करने का निर्णय लेती
    हैं। वह अपनी सखियों जया और विजया के माध्यम से अपने माता-पिता हिमालय और मेना से
    अनुमति मांगती हैं। हिमालय सहमत हो जाते हैं, लेकिन मेना प्रारंभ में संकोच करती
    हैं।
- id: parvati-tapasya-permission
  type: story
  keywords:
  - Parvati
  - Tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: Parvati expresses her desire to perform tapasya to obtain Shiva as her
    husband. Her mother, Mena, initially opposes the idea, suggesting that Parvati
    should perform tapasya at home instead of going to the forest. Despite Mena's
    reluctance, Parvati remains determined, and eventually, Mena grants her permission
    to go to the forest for her tapasya.
  summary_hi: पार्वती शिव को पति रूप में प्राप्त करने के लिए तपस्या करने की इच्छा
    व्यक्त करती हैं। उनकी माता, मेना, पहले इस विचार का विरोध करती हैं और सुझाव देती
    हैं कि पार्वती घर पर ही तपस्या करें। मेना की अनिच्छा के बावजूद, पार्वती दृढ़ रहती
    हैं, और अंततः मेना उन्हें वन में तपस्या करने की अनुमति देती हैं।
- id: parvati-tapasya-episode
  type: story
  keywords:
  - Parvati
  - Tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Parvati Khand)
  summary_en: Parvati, the daughter of Himavat, recounts her past life as Sati, the
    daughter of Daksha. After her father's insult to her husband Shiva, she gave up
    her body through yogic means. In her current life, she performs severe penance
    to win Shiva's favor, despite his departure after burning Kama. She resolves to
    enter fire if Shiva does not accept her, but is momentarily stopped by a Brahmin's
    presence.
  summary_hi: पार्वती, जो हिमालय की पुत्री हैं, अपने पिछले जन्म की कहानी सुनाती हैं
    जब वह दक्ष की पुत्री सती थीं। अपने पिता द्वारा शिव की निंदा के कारण उन्होंने योग
    मार्ग से अपने शरीर का त्याग कर दिया था। इस जन्म में, वह शिव को प्राप्त करने के
    लिए कठोर तपस्या करती हैं, हालांकि शिव कामदेव को जलाकर चले गए थे। शिव के स्वीकार
    न करने पर वह अग्नि में प्रवेश करने का निर्णय लेती हैं, लेकिन एक ब्राह्मण की उपस्थिति
    से क्षणभर के लिए रुक जाती हैं।
- id: himalaya-discourages-parvati
  type: story
  keywords:
  - Himalaya
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 23
  summary_en: Himalaya, along with his wife and ministers, visits Parvati during her
    penance and tries to dissuade her from continuing. He expresses concern over her
    health and doubts Shiva's willingness to appear, citing Shiva's detachment and
    past actions like the destruction of Kamadeva.
  summary_hi: हिमालय अपनी पत्नी और मंत्रियों के साथ पार्वती के तप के दौरान उनसे मिलने
    आते हैं और उन्हें तपस्या जारी रखने से हतोत्साहित करने की कोशिश करते हैं। वह उनकी
    सेहत को लेकर चिंतित होते हैं और शिव के प्रकट होने की संभावना पर संदेह जताते हैं,
    शिव की विरक्ति और कामदेव के विनाश जैसे उनके पिछले कार्यों का हवाला देते हुए।
- id: gods-seek-brahma-guidance
  type: event
  keywords:
  - Gods
  - Brahma
  - Guidance
  source:
    book: Shiv Puran
    sarga: '23'
  summary_en: The gods, distressed by the intense heat and suffering caused by Parvati's
    tapasya, seek guidance from Brahma. They approach him, expressing their inability
    to understand the cause of their distress and request his help in resolving the
    situation.
  summary_hi: पार्वती की तपस्या से उत्पन्न तीव्र गर्मी और पीड़ा से परेशान देवता ब्रह्मा
    से मार्गदर्शन प्राप्त करने के लिए जाते हैं। वे उनके पास जाकर अपनी पीड़ा का कारण
    न समझ पाने की बात कहते हैं और स्थिति को सुलझाने के लिए उनकी मदद मांगते हैं।
- id: brahma-consults-vishnu
  type: event
  keywords:
  - Brahma
  - Vishnu
  - Consultation
  source:
    book: Shiv Puran
    sarga: '23'
  summary_en: Brahma, after understanding the cause of the universal distress as Parvati's
    tapasya, consults Vishnu for a solution. He approaches Vishnu, who is seated comfortably,
    and explains the situation, seeking his assistance in addressing the issue.
  summary_hi: ब्रह्मा, पार्वती की तपस्या को ब्रह्मांडीय पीड़ा का कारण समझने के बाद,
    समाधान के लिए विष्णु से परामर्श करते हैं। वह विष्णु के पास जाते हैं, जो आराम से
    बैठे होते हैं, और स्थिति को समझाते हुए उनकी सहायता मांगते हैं।
- id: shiva-parvati-marriage-request
  type: event
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 23
  summary_en: The gods approach Lord Shiva to request his marriage with Parvati. Initially,
    Shiva refuses, citing the faults of marriage, but upon further entreaty, he agrees
    to the union.
  summary_hi: देवता भगवान शिव के पास पार्वती के साथ विवाह का अनुरोध लेकर जाते हैं।
    प्रारंभ में, शिव विवाह के दोष बताकर अस्वीकार करते हैं, लेकिन पुनः प्रार्थना करने
    पर वे इस विवाह के लिए सहमत हो जाते हैं।
- id: gods-visit-shiva
  type: event
  keywords:
  - Shiva
  - gods
  - visit
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 23
  summary_en: The gods, led by Vishnu, visit Lord Shiva who is deep in meditation.
    They find him surrounded by his attendants and praise him with hymns from the
    Vedas and Upanishads.
  summary_hi: विष्णु के नेतृत्व में देवता भगवान शिव से मिलने जाते हैं, जो गहन ध्यान
    में लीन हैं। वे उन्हें उनके गणों से घिरे हुए पाते हैं और वेदों और उपनिषदों के
    सूक्तों से उनकी स्तुति करते हैं।
- id: nandi-pleads-to-shiva
  type: story
  keywords:
  - Nandi
  - Shiva
  - Devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Nandi, filled with compassion, pleads to Lord Shiva on behalf of the
    devas who are being tormented by the demon Tarakasura. He requests Shiva to protect
    the sages and gods, emphasizing Shiva's role as the compassionate protector of
    the distressed.
  summary_hi: नन्दिकेश्वर, करुणा से भरे हुए, भगवान शिव से देवताओं की ओर से प्रार्थना
    करते हैं, जो तारकासुर राक्षस द्वारा पीड़ित हैं। वह शिव से ऋषियों और देवताओं की
    रक्षा करने का अनुरोध करते हैं, शिव के दीनबंधु और भक्तवत्सल रूप को उजागर करते हुए।
- id: shiva-awakens-from-meditation
  type: event
  keywords:
  - Shiva
  - Meditation
  - Devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Nandi's plea, Shiva gradually opens his eyes and emerges from
    his deep meditation. He inquires the reason for the gathering of Brahma, Vishnu,
    and other gods at his abode.
  summary_hi: नन्दिकेश्वर की प्रार्थना के बाद, शिव धीरे-धीरे अपनी आँखें खोलते हैं
    और अपनी गहन ध्यानावस्था से बाहर आते हैं। वह ब्रह्मा, विष्णु और अन्य देवताओं के
    उनके पास आने का कारण पूछते हैं।
- id: vishnu-advises-shiva-on-tarakasura
  type: story
  keywords:
  - Vishnu
  - Shiva
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu informs Shiva about the great distress caused by the demon Tarakasura
    to the devas. He advises that only a son born to Shiva can defeat Tarakasura,
    urging Shiva to marry Parvati to fulfill this prophecy.
  summary_hi: विष्णु शिव को तारकासुर राक्षस द्वारा देवताओं को दिए गए महान कष्ट के
    बारे में बताते हैं। वह सलाह देते हैं कि केवल शिव के पुत्र द्वारा ही तारकासुर का
    वध संभव है, और शिव को पार्वती से विवाह करने के लिए प्रेरित करते हैं ताकि यह भविष्यवाणी
    पूरी हो सके।
- id: shiva-agrees-to-marry-parvati
  type: story
  keywords:
  - Shiva
  - Parvati
  - Marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Upon hearing Vishnu's counsel, Shiva agrees to marry Parvati. He acknowledges
    that the union will lead to the birth of a son who will defeat Tarakasura, thus
    fulfilling the divine plan.
  summary_hi: विष्णु की सलाह सुनकर, शिव पार्वती से विवाह करने के लिए सहमत हो जाते
    हैं। वह स्वीकार करते हैं कि इस मिलन से एक पुत्र का जन्म होगा जो तारकासुर का वध
    करेगा, इस प्रकार दिव्य योजना को पूरा करेगा।
- id: shiva-meditation
  type: practice
  keywords:
  - Shiva
  - meditation
  - detachment
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Shiva enters a deep state of meditation, focusing on his pure, formless,
    and eternal nature. This meditation is described as being beyond attributes and
    accessible only through knowledge. The gods, witnessing Shiva's meditation, seek
    guidance from Nandi on how to please Shiva.
  summary_hi: शिव गहन ध्यान की स्थिति में प्रवेश करते हैं, अपने शुद्ध, निराकार और
    शाश्वत स्वरूप पर ध्यान केंद्रित करते हैं। यह ध्यान गुणों से परे और केवल ज्ञान
    के माध्यम से सुलभ बताया गया है। देवता, शिव के ध्यान को देखकर, नंदी से शिव को प्रसन्न
    करने के उपाय पूछते हैं।
- id: nandi-guidance
  type: story
  keywords:
  - Nandi
  - guidance
  - devotion
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Nandi advises the gods and sages on how to please Lord Shiva. He suggests
    that if they are determined for Shiva to marry, they should sincerely praise Shiva
    with utmost devotion. Nandi emphasizes that Shiva, though difficult to please,
    can be swayed by true devotion.
  summary_hi: नंदी देवताओं और ऋषियों को भगवान शिव को प्रसन्न करने के उपाय बताते हैं।
    वे सुझाव देते हैं कि यदि वे शिव के विवाह के लिए दृढ़ हैं, तो उन्हें अत्यंत भक्ति
    के साथ शिव की स्तुति करनी चाहिए। नंदी इस बात पर जोर देते हैं कि शिव, हालांकि प्रसन्न
    करना कठिन है, सच्ची भक्ति से प्रभावित हो सकते हैं।
- id: shiva-appeasement-by-devas
  type: story
  keywords:
  - shiva
  - devas
  - appeasement
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The devas, led by Vishnu and Brahma, approach Lord Shiva with prayers
    and supplications to seek his help in overcoming the troubles caused by the demon
    Tarakasura. They praise Shiva's compassion and plead for his intervention to save
    them from their distress.
  summary_hi: देवताओं ने विष्णु और ब्रह्मा के नेतृत्व में भगवान शिव के पास जाकर प्रार्थना
    की और उनसे तारकासुर राक्षस के कारण हो रही परेशानियों से मुक्ति दिलाने की विनती
    की। उन्होंने शिव की करुणा की प्रशंसा की और उनसे अपनी पीड़ा से मुक्ति के लिए हस्तक्षेप
    करने की प्रार्थना की।
- id: tarakasura-boon-and-destruction
  type: story
  keywords:
  - tarakasura
  - boon
  - destruction
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Tarakasura, a powerful demon, received a boon from Brahma that he could
    only be killed by a son of Shiva. This boon made him invincible to all others,
    causing great distress to the devas. The devas seek Shiva's favor to ensure the
    birth of a son who could defeat Tarakasura.
  summary_hi: तारकासुर, एक शक्तिशाली राक्षस, को ब्रह्मा से यह वरदान मिला था कि उसे
    केवल शिव के पुत्र द्वारा ही मारा जा सकता है। इस वरदान ने उसे अन्य सभी के लिए अजेय
    बना दिया, जिससे देवताओं को बहुत कष्ट हुआ। देवता शिव की कृपा प्राप्त करने के लिए
    उनके पुत्र के जन्म की व्यवस्था करने का प्रयास करते हैं ताकि तारकासुर का विनाश
    हो सके।
- id: shiva-promise-to-devotees
  type: story
  keywords:
  - Shiva
  - devotees
  - promise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Lord Shiva assures the deities that despite his personal disinterest
    in marriage, he will fulfill their request due to his commitment to his devotees.
    He recounts past instances where he has helped his devotees, such as drinking
    poison for the welfare of the gods and alleviating the sufferings of his devotees.
  summary_hi: भगवान शिव देवताओं को आश्वस्त करते हैं कि विवाह में व्यक्तिगत रुचि न
    होने के बावजूद, वह अपने भक्तों के प्रति अपनी प्रतिबद्धता के कारण उनकी प्रार्थना
    को पूरा करेंगे। वह अपने भक्तों की मदद करने के पिछले उदाहरणों का उल्लेख करते हैं,
    जैसे देवताओं के कल्याण के लिए विषपान करना और अपने भक्तों के कष्टों को दूर करना।
- id: shiva-parvati-marriage-agreement
  type: event
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 24
  summary_en: Lord Shiva agrees to marry Parvati to fulfill the desire of the gods
    for a progeny. He assures the gods that he will accomplish their task and asks
    them to return to their abodes without fear.
  summary_hi: भगवान शिव देवताओं की इच्छा पूरी करने के लिए पार्वती से विवाह करने के
    लिए सहमत होते हैं। वह देवताओं को आश्वस्त करते हैं कि वह उनका कार्य सिद्ध करेंगे
    और उन्हें निर्भय होकर अपने-अपने धाम लौट जाने के लिए कहते हैं।
- id: parvati-tapasya-and-shiva-meditation
  type: story
  keywords:
  - Parvati
  - tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 25
  summary_en: Parvati begins a severe penance to win Shiva as her husband. Impressed
    by her devotion, Shiva enters deep meditation. The seven sages are summoned by
    Shiva to test Parvati's determination and devotion.
  summary_hi: पार्वती शिव को पति रूप में प्राप्त करने के लिए घोर तपस्या प्रारंभ करती
    हैं। उनकी भक्ति से प्रभावित होकर शिव गहन ध्यान में लीन हो जाते हैं। शिवजी सप्तर्षियों
    को पार्वती की दृढ़ता और भक्ति की परीक्षा लेने के लिए बुलाते हैं।
- id: parvati-determination-story
  type: story
  keywords:
  - Parvati
  - determination
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 406
  summary_en: Parvati, despite being advised by sages to marry Vishnu, remains determined
    to marry Shiva. She argues that her stubbornness is natural due to her origin
    from the mountains and insists on following Narada's advice, which she believes
    is beneficial. Parvati's unwavering resolve is highlighted as she expresses her
    willingness to remain unmarried if Shiva does not marry her.
  summary_hi: पार्वती, ऋषियों द्वारा विष्णु से विवाह करने की सलाह के बावजूद, शिव से
    विवाह करने के लिए दृढ़ रहती हैं। वह तर्क करती हैं कि पर्वत से उत्पन्न होने के
    कारण उनका हठ स्वाभाविक है और नारद के वचनों का पालन करना उनके लिए हितकारी है। पार्वती
    का अटल संकल्प तब प्रकट होता है जब वह कहती हैं कि यदि शिव उनसे विवाह नहीं करते,
    तो वह अविवाहित रहेंगी।
- id: parvati-marriage-vow
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 25
  summary_en: Parvati declares her unwavering vow to marry Shiva, stating that she
    will remain unmarried if he does not accept her. Despite any impossible occurrences,
    her determination will not waver. The sages, recognizing her resolve, bless her
    and depart.
  summary_hi: पार्वती शिव से विवाह करने की अपनी अटल प्रतिज्ञा व्यक्त करती हैं, यह
    कहते हुए कि यदि शिव उन्हें स्वीकार नहीं करते हैं तो वह अविवाहित रहेंगी। किसी भी
    असंभव घटना के बावजूद, उनका संकल्प नहीं डिगेगा। ऋषि उनके निश्चय को पहचानकर उन्हें
    आशीर्वाद देते हैं और चले जाते हैं।
- id: shiva-disguised-as-brahmin
  type: story
  keywords:
  - Shiva
  - Parvati
  - disguise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 26
  summary_en: Shiva, wishing to test Parvati's devotion, disguises himself as an old
    Brahmin and approaches her in the forest. Parvati, surrounded by her companions,
    welcomes the disguised Shiva with respect and inquires about his identity and
    purpose.
  summary_hi: शिव, पार्वती की भक्ति की परीक्षा लेने की इच्छा से, एक वृद्ध ब्राह्मण
    का वेश धारण कर वन में उनके पास जाते हैं। पार्वती, अपनी सखियों से घिरी हुई, वेशधारी
    शिव का सम्मानपूर्वक स्वागत करती हैं और उनकी पहचान और उद्देश्य के बारे में पूछती
    हैं।
- id: sati-and-shiva-story
  type: story
  keywords:
  - Sati
  - Shiva
  - Daksha
  source:
    book: Shiv Puran
    sarga: '27'
  summary_en: The story of Sati, the daughter of Daksha, who chose Shiva as her husband
    despite his unconventional appearance and lifestyle. Due to an insult at Daksha's
    sacrifice, Sati immolates herself, leading to Shiva's deep sorrow.
  summary_hi: सती, दक्ष की पुत्री, जिन्होंने शिव को उनके असामान्य रूप और जीवनशैली
    के बावजूद पति के रूप में चुना। दक्ष के यज्ञ में अपमान के कारण, सती आत्मदाह कर
    लेती हैं, जिससे शिव को गहरा दुख होता है।
- id: parvati-rebukes-brahmin
  type: event
  keywords:
  - Parvati
  - Brahmin
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Parvati, angered by a Brahmin's disrespectful words towards Shiva, rebukes
    him. She reveals her understanding of Shiva's true nature and criticizes the Brahmin's
    ignorance.
  summary_hi: पार्वती, शिव के प्रति एक ब्राह्मण के अपमानजनक शब्दों से क्रोधित होकर
    उसे फटकारती हैं। वह शिव के वास्तविक स्वरूप को समझने की अपनी क्षमता को प्रकट करती
    हैं और ब्राह्मण की अज्ञानता की आलोचना करती हैं।
- id: parvati-explains-shiva-nature
  type: concept
  keywords:
  - Parvati
  - Shiva
  - Nirguna
  - Saguna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Parvati explains the nature of Shiva as both Nirguna (without attributes)
    and Saguna (with attributes) due to Maya. She emphasizes Shiva's role as the foundation
    of all knowledge and his supremacy over all deities.
  summary_hi: पार्वती शिव के स्वरूप को निर्गुण (गुण रहित) और माया के कारण सगुण (गुण
    युक्त) के रूप में समझाती हैं। वह सभी विद्याओं के अधिष्ठान के रूप में शिव की भूमिका
    और सभी देवताओं पर उनकी श्रेष्ठता को रेखांकित करती हैं।
- id: shiva-grants-powers
  type: story
  keywords:
  - Shiva
  - Devotees
  - Powers
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Shiva is described as granting three eternal powers to those who worship
    him with devotion. These include the powers of action, will, and knowledge, leading
    to the devotees' liberation from fear and death.
  summary_hi: शिव को उन भक्तों को तीन शाश्वत शक्तियाँ प्रदान करते हुए वर्णित किया
    गया है जो उन्हें भक्ति के साथ पूजते हैं। इनमें क्रिया, इच्छा और ज्ञान की शक्तियाँ
    शामिल हैं, जो भक्तों को भय और मृत्यु से मुक्ति दिलाती हैं।
- id: parvati-shiva-encounter
  type: story
  keywords:
  - Parvati
  - Shiva
  - encounter
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 28
  summary_en: Parvati, immersed in meditation on Shiva, is approached by a Brahmin
    who intends to speak ill of Shiva. She decides to leave to avoid hearing any blasphemy.
    As she prepares to leave, Shiva himself appears in a beautiful form, revealing
    his presence to Parvati. He expresses his happiness with her devotion and declares
    her as his eternal consort, promising to take her to his abode on Mount Kailash.
  summary_hi: पार्वती, जो शिव का ध्यान कर रही थीं, एक ब्राह्मण द्वारा शिव की निंदा
    सुनने से बचने के लिए वहां से जाने का निर्णय लेती हैं। जैसे ही वह जाने के लिए तैयार
    होती हैं, शिव स्वयं एक सुंदर रूप में प्रकट होते हैं और पार्वती को दर्शन देते हैं।
    शिव अपनी प्रसन्नता व्यक्त करते हैं और पार्वती को अपनी सनातन पत्नी घोषित करते हैं,
    यह वादा करते हुए कि वह उन्हें कैलाश पर्वत पर अपने घर ले जाएंगे।
- id: shiva-parvati-marriage-acceptance
  type: story
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 415
  summary_en: Parvati requests Shiva to accept her as his wife, reminding him of their
    past connection and the destruction of Daksha's sacrifice for her sake. She expresses
    her desire to marry Shiva to help the gods defeat the demon Taraka. Shiva, pleased
    with Parvati's devotion, agrees to marry her, acknowledging the necessity of their
    union for the welfare of the universe.
  summary_hi: पार्वती शिव से अनुरोध करती हैं कि वे उन्हें अपनी पत्नी के रूप में स्वीकार
    करें, उन्हें उनके पिछले संबंध और उनके लिए दक्ष के यज्ञ के विनाश की याद दिलाती
    हैं। वह शिव से विवाह करने की अपनी इच्छा व्यक्त करती हैं ताकि देवताओं को तारक असुर
    से लड़ने में मदद मिल सके। पार्वती की भक्ति से प्रसन्न होकर शिव विवाह के लिए सहमत
    हो जाते हैं, और उनके मिलन की आवश्यकता को ब्रह्मांड के कल्याण के लिए स्वीकार करते
    हैं।
- id: parvati-return-to-parents
  type: event
  keywords:
  - Parvati
  - return
  - parents
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati returns to her parents' home, greeted with great celebration.
    Her parents, overjoyed, bless her and express their happiness. The community,
    including Brahmins and other women, participate in the festivities, offering blessings
    and performing rituals.
  summary_hi: पार्वती अपने माता-पिता के घर लौटती हैं, जहां उनका भव्य स्वागत होता है।
    उनके माता-पिता अत्यंत प्रसन्न होकर उन्हें आशीर्वाद देते हैं और अपनी खुशी व्यक्त
    करते हैं। समुदाय, जिसमें ब्राह्मण और अन्य महिलाएं शामिल हैं, उत्सव में भाग लेते
    हैं, आशीर्वाद देते हैं और अनुष्ठान करते हैं।
- id: shiva-disguised-as-dancer
  type: story
  keywords:
  - Shiva
  - disguise
  - dancer
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Shiva, in a playful mood, disguises himself as a beautiful dancer
    and approaches Menaka's vicinity. Holding a horn in one hand and a drum in the
    other, he performs a captivating dance and song, mesmerizing everyone present.
  summary_hi: भगवान शिव, लीला करने की इच्छा से, एक सुंदर नर्तक के रूप में वेश बदलकर
    मेनका के पास आते हैं। एक हाथ में शृंगी और दूसरे में डमरू लेकर, वे एक मनमोहक नृत्य
    और गीत प्रस्तुत करते हैं, जिससे वहां उपस्थित सभी लोग मंत्रमुग्ध हो जाते हैं।
- id: parvati-shiva-marriage-boon
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Parvati, upon seeing the divine form of Shiva, prays for him to be her
    husband. Shiva, pleased with her devotion, grants her the boon and then disappears,
    only to return in the guise of a beggar.
  summary_hi: पार्वती ने शिव के दिव्य रूप को देखकर प्रार्थना की कि वे उनके पति बनें।
    शिव ने उनकी भक्ति से प्रसन्न होकर उन्हें वरदान दिया और फिर अंतर्धान हो गए, लेकिन
    भिक्षुक के रूप में वापस आए।
- id: shiva-beggar-form
  type: story
  keywords:
  - Shiva
  - beggar
  - dance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Shiva, in the guise of a beggar, performs a captivating dance in Menaka's
    courtyard. Despite Menaka's offer of jewels, Shiva only asks for Parvati as alms
    and continues his dance.
  summary_hi: शिव भिक्षुक के रूप में मेनका के आँगन में मनमोहक नृत्य करते हैं। मेनका
    के रत्नों के प्रस्ताव के बावजूद, शिव केवल पार्वती को भिक्षा में मांगते हैं और
    अपना नृत्य जारी रखते हैं.
- id: himalaya-anger-at-beggar
  type: story
  keywords:
  - Himalaya
  - anger
  - beggar
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Himalaya becomes angry upon hearing about the beggar's actions from
    Menaka and orders his servants to expel the beggar. However, the beggar's divine
    radiance prevents anyone from doing so.
  summary_hi: हिमालय, मेनका से भिक्षुक की हरकतों के बारे में सुनकर क्रोधित हो जाते
    हैं और अपने सेवकों को भिक्षुक को बाहर निकालने का आदेश देते हैं। हालांकि, भिक्षुक
    के दिव्य तेज के कारण कोई भी ऐसा करने में सक्षम नहीं होता।
- id: shiva-divine-forms-revelation
  type: story
  keywords:
  - Shiva
  - divine forms
  - revelation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Shiva reveals his various divine forms to Himalaya, including those
    of Vishnu and Brahma, leaving Himalaya in awe and deep devotion.
  summary_hi: शिव हिमालय को अपने विभिन्न दिव्य रूपों का दर्शन कराते हैं, जिनमें विष्णु
    और ब्रह्मा के रूप शामिल हैं, जिससे हिमालय विस्मय और गहरी भक्ति में डूब जाते हैं।
- id: shiva-disguised-as-beggar
  type: story
  keywords:
  - Shiva
  - Himalaya
  - disguise
  source:
    book: Shiv Puran
    sarga: '39'
  summary_en: In this episode, Lord Shiva disguises himself as a beggar and visits
    the king of mountains, Himalaya. He displays various divine forms, including those
    of Vishnu and Brahma, to test Himalaya's devotion. Despite the divine spectacle,
    Himalaya, under the influence of Shiva's maya, does not recognize him and refuses
    his request. Shiva then disappears, leaving Himalaya and his wife Mena in awe
    and realization of their missed opportunity.
  summary_hi: इस प्रकरण में, भगवान शिव भिक्षुक के रूप में हिमालय के राजा के पास जाते
    हैं। वह हिमालय की भक्ति की परीक्षा लेने के लिए विष्णु और ब्रह्मा सहित विभिन्न
    दिव्य रूपों का प्रदर्शन करते हैं। दिव्य चमत्कार के बावजूद, शिव की माया के प्रभाव
    में हिमालय उन्हें पहचान नहीं पाते और उनकी याचना को अस्वीकार कर देते हैं। शिव अंतर्धान
    हो जाते हैं, जिससे हिमालय और उनकी पत्नी मेना आश्चर्यचकित और अपने खोए हुए अवसर
    का एहसास करते हैं।
- id: gods-plan-for-parvati-marriage
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: '39'
  summary_en: The gods, recognizing the unwavering devotion of Mena and Himalaya towards
    Shiva, plan to ensure Parvati's marriage to Shiva. They decide to send Brihaspati
    to Himalaya to speak ill of Shiva, hoping this will lead to Parvati's marriage
    to Shiva, as she will choose no one else. The gods believe this union will lead
    to Himalaya attaining liberation and divine status.
  summary_hi: देवता, मेना और हिमालय की शिव के प्रति अनन्य भक्ति को पहचानते हुए, पार्वती
    का विवाह शिव से सुनिश्चित करने की योजना बनाते हैं। वे बृहस्पति को हिमालय के पास
    शिव की निंदा करने के लिए भेजने का निर्णय लेते हैं, इस आशा में कि इससे पार्वती
    का विवाह शिव से होगा, क्योंकि वह किसी और को नहीं चुनेंगी। देवताओं का मानना है
    कि इस मिलन से हिमालय को मुक्ति और दिव्य स्थिति प्राप्त होगी।
- id: brahaspati-refuses-shiva-insult
  type: event
  keywords:
  - brahaspati
  - shiva
  - insult
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Brihaspati, upon hearing the gods' plan to insult Shiva, refuses to
    participate and warns them of the consequences. He advises them to seek Shiva's
    favor instead.
  summary_hi: बृहस्पति ने देवताओं की शिव की निंदा करने की योजना सुनकर भाग लेने से
    इनकार कर दिया और उन्हें इसके परिणामों के बारे में चेतावनी दी। उन्होंने उन्हें
    शिव की कृपा प्राप्त करने की सलाह दी।
- id: gods-seek-brahma-help
  type: event
  keywords:
  - gods
  - brahma
  - help
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The gods, unable to resolve their issue, approach Brahma for guidance.
    Brahma advises them to appease Shiva directly.
  summary_hi: देवता अपनी समस्या का समाधान नहीं कर पाने पर ब्रह्मा के पास मार्गदर्शन
    के लिए जाते हैं। ब्रह्मा उन्हें शिव को सीधे प्रसन्न करने की सलाह देते हैं।
- id: gods-appease-shiva
  type: event
  keywords:
  - Shiva
  - gods
  - appeasement
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: As Shiva becomes angry with Brahma, the gods, including Vishnu, become
    fearful and begin to praise Shiva to appease his wrath. They acknowledge Shiva's
    supreme nature and request his forgiveness for Brahma.
  summary_hi: जब शिव ब्रह्मा पर क्रोधित होते हैं, तो विष्णु सहित देवता भयभीत हो जाते
    हैं और शिव की स्तुति करने लगते हैं ताकि उनके क्रोध को शांत किया जा सके। वे शिव
    की सर्वोच्च प्रकृति को स्वीकार करते हैं और ब्रह्मा के लिए क्षमा की प्रार्थना करते
    हैं।
- id: shiva-appears-as-brahmin
  type: story
  keywords:
  - Shiva
  - Himalaya
  - Parvati
  source:
    book: Shiv Puran
    sarga: Chapter 32
  summary_en: In this episode, Lord Shiva appears in the court of King Himalaya disguised
    as a Brahmin. He is adorned with divine attire and a bright tilak, holding a crystal
    rosary and wearing a Shaligram stone. The assembly, including Parvati, stands
    up to honor him, and they offer their respects with devotion.
  summary_hi: इस प्रकरण में, भगवान शिव ब्राह्मण के वेश में राजा हिमालय के दरबार में
    प्रकट होते हैं। वे दिव्य वस्त्र और उज्ज्वल तिलक धारण किए हुए हैं, एक हाथ में स्फटिक
    की माला और गले में शालग्राम शिला पहने हुए हैं। सभा, जिसमें पार्वती भी शामिल हैं,
    उनका सम्मान करने के लिए खड़ी हो जाती है और भक्ति भाव से उन्हें प्रणाम करती है।
- id: shiva-blesses-himalaya
  type: story
  keywords:
  - Shiva
  - Himalaya
  - Blessing
  source:
    book: Shiv Puran
    sarga: Chapter 32
  summary_en: Lord Shiva, in the guise of a Brahmin, blesses King Himalaya and his
    assembly with great affection. He accepts the offerings made by Himalaya with
    joy and inquires about their well-being, showing his benevolent nature.
  summary_hi: ब्राह्मण के वेश में भगवान शिव राजा हिमालय और उनकी सभा को बड़े प्रेमपूर्वक
    आशीर्वाद देते हैं। वे हिमालय द्वारा दिए गए मधुपर्क आदि को प्रसन्नता से स्वीकार
    करते हैं और उनकी कुशलता के बारे में पूछते हैं, अपनी कृपालुता को प्रदर्शित करते
    हुए।
- id: shiva-summons-rishis
  type: event
  keywords:
  - Shiva
  - Rishis
  source:
    book: Shiv Puran
    sarga: '32'
  summary_en: Lord Shiva summoned the sages, who appeared instantly like celestial
    beings. They were filled with gratitude and praised Shiva, feeling blessed by
    his remembrance.
  summary_hi: भगवान शिव ने ऋषियों को स्मरण किया, जो तुरंत ही दिव्य प्राणियों की तरह
    प्रकट हो गए। वे कृतज्ञता से भर गए और शिव की स्तुति की, उनके स्मरण से धन्य महसूस
    किया।
- id: shiva-explains-purpose
  type: concept
  keywords:
  - Shiva
  - Purpose
  source:
    book: Shiv Puran
    sarga: '32'
  summary_en: Shiva explains to the sages that his actions are always for the benefit
    of others, particularly to alleviate the suffering of the gods caused by the demon
    Tarakasura. He mentions his intention to marry Parvati as part of this greater
    purpose.
  summary_hi: शिव ऋषियों को बताते हैं कि उनके कार्य हमेशा दूसरों के लाभ के लिए होते
    हैं, विशेष रूप से तारकासुर राक्षस के कारण देवताओं की पीड़ा को कम करने के लिए।
    वे पार्वती से विवाह करने की अपनी इच्छा को इस बड़े उद्देश्य का हिस्सा बताते हैं।
- id: shiva-parvati-marriage-intention
  type: story
  keywords:
  - Shiva
  - Parvati
  - Marriage
  source:
    book: Shiv Puran
    sarga: '32'
  summary_en: Shiva expresses his intention to marry Parvati, acknowledging her severe
    penance. He is committed to fulfilling her desires as a reward for her devotion,
    aligning with his vow to bring joy to his devotees.
  summary_hi: शिव पार्वती से विवाह करने की अपनी इच्छा व्यक्त करते हैं, उनके कठोर तप
    को स्वीकार करते हुए। वे उनकी इच्छाओं को उनके समर्पण के पुरस्कार के रूप में पूरा
    करने के लिए प्रतिबद्ध हैं, जो उनके भक्तों को आनंद देने की प्रतिज्ञा के अनुरूप
    है।
- id: shiva-parvati-marriage-arrangement
  type: event
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Parvati Khanda
  summary_en: In this episode, Shiva expresses his desire to marry Parvati and instructs
    the sages to visit the Himalayas to convince Parvati's parents, Himavan and Mena,
    of the marriage. The sages, feeling honored by Shiva's request, set out to fulfill
    his wish.
  summary_hi: इस प्रकरण में, शिव अपनी इच्छा व्यक्त करते हैं कि वे पार्वती से विवाह
    करना चाहते हैं और ऋषियों को हिमालय जाकर पार्वती के माता-पिता हिमवान और मेना को
    विवाह के लिए मनाने का निर्देश देते हैं। ऋषि, शिव के अनुरोध से सम्मानित महसूस करते
    हुए, उनकी इच्छा पूरी करने के लिए निकल पड़ते हैं।
- id: sages-visit-himalaya
  type: event
  keywords:
  - sages
  - Himalaya
  - divine city
  source:
    book: Shiv Puran
    sarga: Parvati Khanda
  summary_en: The sages, following Shiva's instructions, travel to the divine city
    of Himalaya. They are amazed by the beauty and grandeur of the city and feel blessed
    to be part of such a significant task assigned by Shiva.
  summary_hi: शिव के निर्देशों का पालन करते हुए, ऋषि हिमालय के दिव्य नगर की यात्रा
    करते हैं। वे नगर की सुंदरता और भव्यता से चकित हो जाते हैं और शिव द्वारा सौंपे
    गए इस महत्वपूर्ण कार्य का हिस्सा बनने के लिए धन्य महसूस करते हैं।
- id: himalayas-city-description
  type: story
  keywords:
  - himalaya
  - celestial-city
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 32
  summary_en: The passage describes the celestial city of the Himalayas, which is
    depicted as more splendid than Alaka, Swarga, Bhogavati, and Amaravati. The city
    is adorned with houses and courtyards made of crystal and various precious stones,
    with sun and moon jewels present in every home. The city features heavenly trees,
    beautiful gardens, and celestial beings resembling gods and apsaras.
  summary_hi: इस अंश में हिमालय की दिव्य नगरी का वर्णन किया गया है, जो अलका, स्वर्ग,
    भोगवती और अमरावती से भी अधिक भव्य है। यह नगरी स्फटिक और विभिन्न रत्नों से बने
    घरों और आँगनों से सजी है, जहाँ हर घर में सूर्यकांत और चंद्रकांत मणियाँ हैं। यहाँ
    स्वर्गीय वृक्ष, सुंदर उद्यान और देवताओं और अप्सराओं के समान दिव्य प्राणी हैं।
- id: arrival-of-saptarishis
  type: event
  keywords:
  - saptarishis
  - himalaya
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 32
  summary_en: The seven sages, known as the Saptarishis, arrive at the abode of the
    Himalayas. They are described as radiant like the sun, and their presence is considered
    a blessing by the householder Himalaya, who feels honored and performs their worship
    with great respect.
  summary_hi: सप्तर्षियों के रूप में जाने जाने वाले सात ऋषि हिमालय के निवास स्थान
    पर आते हैं। उन्हें सूर्य के समान तेजस्वी बताया गया है, और उनके आगमन को गृहस्थ
    हिमालय द्वारा एक आशीर्वाद माना जाता है, जो सम्मानपूर्वक उनकी पूजा करते हैं।
- id: himalaya-honors-sages
  type: story
  keywords:
  - himalaya
  - hospitality
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 32
  summary_en: Himalaya, the lord of the mountains, expresses his gratitude and honor
    at the visit of the Saptarishis. He considers his life fulfilled and his home
    blessed by their presence, offering them seats and asking for any service he can
    provide to make his life meaningful.
  summary_hi: पर्वतों के स्वामी हिमालय सप्तर्षियों के आगमन पर अपनी कृतज्ञता और सम्मान
    व्यक्त करते हैं। वह अपने जीवन को सफल और अपने घर को धन्य मानते हैं, उन्हें आसन
    प्रदान करते हैं और उनसे पूछते हैं कि वह कौन सी सेवा कर सकते हैं जिससे उनका जीवन
    सार्थक हो सके।
- id: himalaya-refuses-marriage
  type: story
  keywords:
  - Himalaya
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Himalaya, under the influence of Shiva's maya, refuses to give his daughter
    Parvati in marriage to Shiva, who is in the guise of a mendicant. Despite the
    advice of the Saptarishis, Himalaya expresses his reluctance, citing Shiva's lack
    of worldly possessions and connections.
  summary_hi: हिमालय, शिव की माया के प्रभाव में आकर, अपनी पुत्री पार्वती का विवाह
    शिव से करने से इंकार कर देते हैं, जो एक भिक्षु के रूप में हैं। सप्तर्षियों की
    सलाह के बावजूद, हिमालय अपनी अनिच्छा व्यक्त करते हैं, शिव के सांसारिक संपत्ति और
    संबंधों की कमी का हवाला देते हुए।
- id: arundhati-consoles-mena
  type: story
  keywords:
  - Arundhati
  - Mena
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Arundhati visits Mena, who is in distress over the proposed marriage
    of her daughter Parvati to Shiva. Arundhati, with the support of the Saptarishis,
    consoles Mena and advises her to accept the divine will.
  summary_hi: अरुन्धती मेना से मिलने जाती हैं, जो अपनी पुत्री पार्वती के शिव से प्रस्तावित
    विवाह को लेकर चिंतित हैं। सप्तर्षियों के समर्थन से, अरुन्धती मेना को सांत्वना
    देती हैं और उन्हें दिव्य इच्छा को स्वीकार करने की सलाह देती हैं।
- id: parvati-shiva-marriage-discussion
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: '30'
  summary_en: The sages, including Arundhati, advise King Himavat to marry his daughter
    Parvati to Lord Shiva. Despite Shiva's ascetic nature and lack of material wealth,
    the sages emphasize the divine purpose of this union, which is to defeat the demon
    Tarakasura. Himavat expresses concerns about Shiva's lack of worldly possessions
    but is reassured by the sages about Shiva's supreme spiritual status.
  summary_hi: ऋषि, अरुन्धती सहित, हिमालय राजा को सलाह देते हैं कि वे अपनी पुत्री पार्वती
    का विवाह भगवान शिव से कर दें। शिव के तपस्वी स्वभाव और भौतिक संपत्ति की कमी के
    बावजूद, ऋषि इस विवाह के दिव्य उद्देश्य पर जोर देते हैं, जो राक्षस तारकासुर को
    पराजित करने के लिए है। हिमालय शिव की सांसारिक संपत्ति की कमी को लेकर चिंतित हैं,
    लेकिन ऋषि उन्हें शिव की सर्वोच्च आध्यात्मिक स्थिति के बारे में आश्वस्त करते हैं।
- id: shiva-creation-and-destruction-concept
  type: concept
  keywords:
  - creation
  - destruction
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva is depicted as the supreme being capable of creation and destruction
    of the universe through his divine play. He transcends all attributes and is beyond
    nature.
  summary_hi: शिवजी को सर्वोच्च सत्ता के रूप में चित्रित किया गया है जो अपनी दिव्य
    लीला के माध्यम से ब्रह्मांड की सृष्टि और संहार करने में सक्षम हैं। वे सभी गुणों
    से परे और प्रकृति से परे हैं।
- id: shiva-trimurti-concept
  type: concept
  keywords:
  - trimurti
  - brahma
  - vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The concept of Trimurti is explained where Brahma, Vishnu, and Mahesh
    (Shiva) are responsible for creation, preservation, and destruction of the universe
    respectively. These forms are manifestations of Shiva's power.
  summary_hi: त्रिमूर्ति की अवधारणा को समझाया गया है जहाँ ब्रह्मा, विष्णु और महेश
    (शिव) क्रमशः सृष्टि, पालन और संहार के लिए उत्तरदायी हैं। ये रूप शिव की शक्ति के
    प्रकट रूप हैं।
- id: sati-birth-and-rebirth-story
  type: story
  keywords:
  - sati
  - daksha
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sati, the daughter of Daksha, was married to Shiva. Due to her father's
    insult towards Shiva, she immolated herself. She was later reborn as Parvati,
    the daughter of Himavan, and reunited with Shiva.
  summary_hi: सती, दक्ष की पुत्री, शिव से विवाहित थीं। अपने पिता द्वारा शिव का अपमान
    सहन न कर पाने के कारण उन्होंने आत्मदाह कर लिया। बाद में वे हिमवान की पुत्री पार्वती
    के रूप में पुनर्जन्म लेकर शिव से पुनः मिल गईं।
- id: king-anaranya-story
  type: story
  keywords:
  - Anaranya
  - king
  - sacrifice
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 34
  summary_en: King Anaranya, a devout follower of Shiva, was a powerful ruler of the
    seven islands. Despite being offered the position of Indra, he refused it. He
    had a hundred sons and a daughter named Padma, whom he loved dearly. The story
    highlights his devotion and the importance of making sacrifices for the greater
    good.
  summary_hi: राजा अनरण्य, जो शिव के भक्त थे, सात द्वीपों के शक्तिशाली शासक थे। इंद्र
    पद की पेशकश के बावजूद, उन्होंने इसे अस्वीकार कर दिया। उनके सौ पुत्र और एक पुत्री
    पद्मा थी, जिन्हें वे अत्यधिक प्रेम करते थे। यह कहानी उनकी भक्ति और महान उद्देश्य
    के लिए बलिदान देने के महत्व को दर्शाती है।
- id: pippalada-desire-for-padma
  type: story
  keywords:
  - Pippalada
  - Padma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Rishi Pippalada, while on his way to his hermitage, becomes enamored
    by a beautiful young woman named Padma, daughter of King Anaranya. Overcome by
    desire, he asks the king for her hand in marriage, threatening to destroy everything
    if his request is denied. The king, advised by his wise counselors, reluctantly
    agrees to give his daughter to the sage.
  summary_hi: ऋषि पिप्पलाद अपने आश्रम जाते समय राजा अनरण्य की पुत्री पद्मा को देखकर
    मोहित हो जाते हैं। वे राजा से उसका विवाह करने की इच्छा व्यक्त करते हैं और मना
    करने पर सब कुछ भस्म करने की धमकी देते हैं। राजा अपने सलाहकारों की सलाह पर अनिच्छा
    से अपनी पुत्री का विवाह ऋषि से करने के लिए तैयार हो जाते हैं।
- id: anarnya-charitra
  type: story
  keywords:
  - Anarnya
  - sacrifice
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 34
  summary_en: King Anarnya, after giving his daughter in marriage to a sage, renounces
    his kingdom and goes to the forest for penance. His wife, unable to bear the separation,
    dies of grief. Anarnya performs severe penance and attains Shiva's abode. His
    eldest son takes over the kingdom and rules justly.
  summary_hi: राजा अनरण्य अपनी पुत्री का विवाह एक मुनि से कर देते हैं और तपस्या के
    लिए वन में चले जाते हैं। उनकी पत्नी इस वियोग को सहन नहीं कर पाती और शोक में प्राण
    त्याग देती है। अनरण्य कठोर तपस्या कर शिवलोक को प्राप्त करते हैं। उनका ज्येष्ठ
    पुत्र राज्य का कार्यभार संभालता है और न्यायपूर्वक शासन करता है।
- id: anarnya-daughter-and-pippalada
  type: story
  keywords:
  - Anarnya
  - Pippalada
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The story describes how Anarnya's daughter was married to the sage Pippalada.
    Despite Pippalada's old age, the daughter served him with devotion, similar to
    how Lakshmi serves Narayana. During one of her visits to the river for a bath,
    she was approached by Dharma in disguise, who tried to tempt her away from her
    husband.
  summary_hi: यह कहानी बताती है कि अनरण्य की बेटी का विवाह पिप्पलाद मुनि से हुआ था।
    पिप्पलाद की वृद्धावस्था के बावजूद, बेटी ने उनकी सेवा लक्ष्मी के नारायण की सेवा
    करने के समान भक्ति से की। एक बार जब वह स्नान के लिए नदी जा रही थी, तो धर्म ने
    मानव रूप में आकर उसे उसके पति से दूर करने का प्रयास किया।
- id: dharma-temptation-episode
  type: story
  keywords:
  - Dharma
  - Temptation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Dharma, disguised as a king, attempts to seduce Anarnya's daughter by
    praising her beauty and questioning her marriage to the aged sage Pippalada. He
    tries to convince her to leave her husband for him, but she remains steadfast
    in her devotion and warns him of the consequences of his actions.
  summary_hi: धर्म, राजा के रूप में छद्मवेश धारण कर, अनरण्य की बेटी को उसके सौंदर्य
    की प्रशंसा करके और वृद्ध मुनि पिप्पलाद से उसके विवाह पर सवाल उठाकर उसे बहकाने
    का प्रयास करता है। वह उसे अपने पति को छोड़कर उसके साथ चलने के लिए मनाने की कोशिश
    करता है, लेकिन वह अपनी भक्ति में अडिग रहती है और उसे उसके कार्यों के परिणामों
    के बारे में चेतावनी देती है।
- id: padma-dharma-encounter
  type: story
  keywords:
  - padma
  - dharma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Padma, a devoted wife, is approached by a disguised
    Dharma who tests her fidelity. She rebukes him, affirming her loyalty to her husband,
    the sage Pippalada. Dharma reveals his true form and praises her virtue, acknowledging
    that her curse, given in ignorance, will have cosmic consequences.
  summary_hi: इस प्रकरण में, पद्मा, जो एक समर्पित पत्नी है, को धर्म छद्मवेश में आकर
    उसकी निष्ठा की परीक्षा लेते हैं। वह उसे फटकारती है और अपने पति, ऋषि पिप्पलाद के
    प्रति अपनी निष्ठा की पुष्टि करती है। धर्म अपने वास्तविक रूप में प्रकट होते हैं
    और उसकी पवित्रता की प्रशंसा करते हैं, यह स्वीकार करते हुए कि उसके अज्ञान में दिए
    गए शाप के ब्रह्मांडीय परिणाम होंगे।
- id: padma-and-dharma-conversation
  type: story
  keywords:
  - Padma
  - Dharma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Padma, the wife of Pippalada, has a conversation with Dharma where she
    expresses regret for cursing him. Dharma, pleased with her devotion and sincerity,
    blesses her with a prosperous life and a virtuous husband. He assures her that
    she will have ten virtuous sons and a home filled with wealth, surpassing even
    Kubera's abode.
  summary_hi: पद्मा, जो पिप्पलाद की पत्नी हैं, धर्म के साथ बातचीत करती हैं और उन्हें
    शाप देने के लिए खेद व्यक्त करती हैं। धर्म, उनकी भक्ति और ईमानदारी से प्रसन्न होकर,
    उन्हें समृद्ध जीवन और धर्मी पति का आशीर्वाद देते हैं। वह उन्हें आश्वस्त करते हैं
    कि उनके दस गुणवान पुत्र होंगे और उनका घर धन-धान्य से परिपूर्ण होगा, जो कुबेर के
    भवन से भी श्रेष्ठ होगा।
- id: parvati-shiva-marriage-decision
  type: event
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: The mountains, led by Himalaya, discuss the marriage of Parvati to Shiva.
    They conclude that Parvati, who was born for the purpose of aiding the gods, should
    be given to Shiva as she has already worshipped him and received his approval.
    Himalaya is pleased with this decision and prepares for the marriage.
  summary_hi: हिमालय के नेतृत्व में पर्वत पार्वती और शिव के विवाह पर चर्चा करते हैं।
    वे निष्कर्ष निकालते हैं कि पार्वती, जो देवताओं की सहायता के लिए उत्पन्न हुई थी,
    को शिव को दे देना चाहिए क्योंकि उसने पहले ही उनकी आराधना की है और उनकी स्वीकृति
    प्राप्त की है। हिमालय इस निर्णय से प्रसन्न होते हैं और विवाह की तैयारी करते हैं।
- id: arundhati-convinces-mena
  type: story
  keywords:
  - Arundhati
  - Mena
  - Parvati
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: Arundhati uses various stories and promises to convince Mena, the mother
    of Parvati, about the auspiciousness of Parvati's marriage to Shiva. Mena is eventually
    pleased and agrees to the marriage.
  summary_hi: अरुन्धती विभिन्न कथाओं और वचनों का उपयोग करके पार्वती की माँ मेना को
    पार्वती और शिव के विवाह की शुभता के बारे में समझाती हैं। अंततः मेना प्रसन्न होती
    हैं और विवाह के लिए सहमत हो जाती हैं।
- id: sages-bless-parvati
  type: event
  keywords:
  - Parvati
  - sages
  - blessing
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: The sages, after being convinced of the marriage, bless Parvati to bring
    happiness to Shiva and wish for her virtues to grow like the waxing moon. They
    offer flowers and fruits to Himalaya as a sign of their blessings.
  summary_hi: ऋषि, विवाह के लिए सहमत होने के बाद, पार्वती को शिव को सुख देने वाली
    बनने का आशीर्वाद देते हैं और उनके गुणों की वृद्धि चंद्रमा की तरह होने की कामना
    करते हैं। वे हिमालय को फूल और फल अर्पित करते हैं।
- id: shiva-parvati-marriage-preparation
  type: event
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Chapter 39
  summary_en: Lord Shiva, pleased with Parvati's penance, grants her the boon of marriage.
    He instructs Narada to invite all gods, sages, and celestial beings to the wedding,
    which is to take place in seven days. The preparations for the grand event are
    underway, with Shiva taking a keen interest in the arrangements.
  summary_hi: भगवान शिव, पार्वती की तपस्या से प्रसन्न होकर, उन्हें विवाह का वरदान
    देते हैं। वह नारद को सभी देवताओं, ऋषियों और दिव्य प्राणियों को विवाह में आमंत्रित
    करने का निर्देश देते हैं, जो सात दिनों में होना है। भव्य आयोजन की तैयारियाँ चल
    रही हैं, जिसमें शिव विशेष रुचि ले रहे हैं।
- id: himalayas-preparation-for-parvatis-marriage
  type: event
  keywords:
  - Himalaya
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 37
  summary_en: After receiving approval from the sages, Himalaya, along with his sons,
    joyfully prepared for Parvati's marriage. He sent invitations to relatives and
    gathered various items for the wedding, including food and ornaments. The event
    was marked by the arrival of many mountains and their families, who came to participate
    in the festivities.
  summary_hi: सप्तर्षियों से अनुमति प्राप्त करने के बाद, हिमालय ने अपने पुत्रों के
    साथ मिलकर पार्वती के विवाह की तैयारी की। उन्होंने संबंधियों को निमंत्रण भेजा और
    विवाह के लिए विभिन्न सामग्रियाँ एकत्रित कीं। इस आयोजन में कई पर्वत और उनके परिवार
    शामिल हुए, जो उत्सव में भाग लेने आए।
- id: shiva-parvati-wedding-celebration
  type: event
  keywords:
  - Shiva
  - Parvati
  - wedding
  - celebration
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: A grand celebration takes place on Mount Kailash for the wedding of
    Lord Shiva and Parvati. Various deities, sages, and celestial beings gather to
    participate in the festivities. Lord Vishnu, along with his entourage, arrives
    and pays homage to Shiva. The Sapta Matrikas adorn Shiva in wedding attire, preparing
    him for the ceremony.
  summary_hi: कैलाश पर्वत पर भगवान शिव और पार्वती के विवाह के लिए एक भव्य उत्सव आयोजित
    किया गया। विभिन्न देवता, ऋषि और दिव्य प्राणी इस उत्सव में भाग लेने के लिए एकत्रित
    होते हैं। भगवान विष्णु अपने परिकरों के साथ आते हैं और शिव को प्रणाम करते हैं।
    सप्तमातृकाएँ शिव को विवाह के वस्त्रों में सजाती हैं, उन्हें समारोह के लिए तैयार
    करती हैं।
- id: divine-mandap-construction
  type: event
  keywords:
  - Vishwakarma
  - mandap
  - construction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Vishwakarma is invited to construct a grand and beautiful mandap for
    the wedding of Shiva and Parvati. The mandap is described as being ten thousand
    yojanas long, filled with various wonders and adorned with both stationary and
    moving decorations. The construction is so intricate that it confounds even the
    experts in distinguishing between water and land.
  summary_hi: विवाह के लिए एक भव्य और सुंदर मंडप के निर्माण हेतु विश्वकर्मा को आमंत्रित
    किया जाता है। मंडप को दस हजार योजन लंबा बताया गया है, जो विभिन्न आश्चर्यों से
    भरा हुआ है और स्थावर तथा जंगम सजावटों से सुसज्जित है। निर्माण इतना जटिल है कि
    विशेषज्ञ भी जल और स्थल के बीच अंतर नहीं कर पाते।
- id: shiva-marriage-invitation
  type: event
  keywords:
  - Shiva
  - marriage
  - invitation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 39
  summary_en: Narada invites all the gods to attend Lord Shiva's marriage. Shiva receives
    the wedding invitation with joy and expresses his acceptance, inviting the sages
    to attend the ceremony.
  summary_hi: नारद सभी देवताओं को भगवान शिव के विवाह में आमंत्रित करते हैं। शिवजी
    प्रसन्नता से विवाह पत्रिका प्राप्त करते हैं और अपनी स्वीकृति व्यक्त करते हैं,
    साथ ही ऋषियों को समारोह में आने का निमंत्रण देते हैं।
- id: shiva-parvati-marriage-invitation
  type: event
  keywords:
  - shiva
  - parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 39
  summary_en: The gods, demons, serpents, celestial nymphs, and sages gather to invite
    Lord Shiva to marry Goddess Parvati, the daughter of the Himalayas. Lord Vishnu,
    understanding the essence of Shiva, respectfully requests Shiva to proceed with
    the marriage, which would set a precedent for all marriages in the world.
  summary_hi: देवता, दानव, नाग, अप्सराएँ और ऋषि भगवान शिव से हिमालय की पुत्री पार्वती
    से विवाह करने का अनुरोध करते हैं। भगवान विष्णु, शिव के तत्व को समझते हुए, आदरपूर्वक
    शिव से विवाह करने का अनुरोध करते हैं, जिससे यह विवाह संसार में सभी विवाहों के
    लिए एक मिसाल बनेगा।
- id: shiva-marriage-rituals
  type: event
  keywords:
  - shiva
  - marriage
  - rituals
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 39
  summary_en: Lord Shiva, following the request of Lord Vishnu, performs all the traditional
    and Vedic rituals for his marriage with Parvati. Brahma, along with numerous sages,
    assists in conducting the ceremonies according to Vedic traditions, ensuring the
    protection and auspiciousness of the event.
  summary_hi: भगवान शिव, भगवान विष्णु के अनुरोध पर, पार्वती के साथ अपने विवाह के लिए
    सभी पारंपरिक और वैदिक अनुष्ठान करते हैं। ब्रह्मा और कई ऋषि वैदिक परंपराओं के अनुसार
    समारोहों का संचालन करते हैं, जिससे इस आयोजन की सुरक्षा और शुभता सुनिश्चित होती
    है।
- id: shiva-procession-to-himalaya
  type: event
  keywords:
  - Shiva
  - Himalaya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva, accompanied by various deities and sages, is welcomed by the
    Himalayas with great festivities. The procession includes music, dance, and offerings
    as Shiva is seated on a bull and led towards the Himalayas.
  summary_hi: शिव, विभिन्न देवताओं और ऋषियों के साथ, हिमालय द्वारा भव्य उत्सव के साथ
    स्वागत किया जाता है। इस शोभायात्रा में संगीत, नृत्य और अर्पण शामिल हैं, जब शिव
    को एक वृषभ पर बैठाकर हिमालय की ओर ले जाया जाता है।
- id: shiva-ganas-journey
  type: event
  keywords:
  - Shiva
  - Ganas
  - Himalaya
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 40
  summary_en: Lord Shiva, after summoning all his Ganas, instructed them to accompany
    him to the city of the Himalayas for a grand festival. Various leaders of the
    Ganas, each with their own multitude of followers, set out joyfully to join Shiva
    on this journey.
  summary_hi: भगवान शिव ने अपने सभी गणों को बुलाकर उन्हें हिमालय की नगरी में एक भव्य
    उत्सव के लिए अपने साथ चलने का आदेश दिया। गणों के विभिन्न नेता, अपने-अपने अनुयायियों
    के साथ, इस यात्रा में शिव के साथ शामिल होने के लिए प्रसन्नतापूर्वक चल पड़े।
- id: shiva-wedding-procession
  type: event
  keywords:
  - Shiva
  - wedding
  - procession
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: The passage describes the grand procession of Shiva's wedding. Various
    divine beings, including Ganeshwaras, Bhairava, and Nandi, accompanied by millions
    of their followers, joined the procession with great enthusiasm. The event was
    marked by the presence of powerful beings, adorned with Rudraksha and sacred ash,
    as they made their way to the Himalayas for the wedding.
  summary_hi: यह अंश शिव के विवाह की भव्य शोभायात्रा का वर्णन करता है। गणेश्वर, भैरव
    और नंदी सहित विभिन्न दिव्य प्राणी, लाखों अनुयायियों के साथ, बड़े उत्साह के साथ
    इस शोभायात्रा में शामिल हुए। इस आयोजन में शक्तिशाली प्राणी, रुद्राक्ष और पवित्र
    भस्म से अलंकृत, हिमालय की ओर विवाह के लिए जाते हुए दिखाई दिए।
- id: shiva-parvati-wedding-procession
  type: event
  keywords:
  - Shiva
  - Parvati
  - wedding
  - procession
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 40
  summary_en: The passage describes the grand procession of Lord Shiva's wedding to
    Parvati. Various divine beings, including gods, sages, and celestial musicians,
    accompany the procession. Lord Shiva rides on a beautiful bull, symbolizing Dharma,
    as he proceeds to the Himalayas for the wedding ceremony.
  summary_hi: यह अंश भगवान शिव और पार्वती के विवाह की भव्य बारात का वर्णन करता है।
    विभिन्न दिव्य प्राणी, जिनमें देवता, ऋषि और आकाशीय संगीतकार शामिल हैं, इस बारात
    के साथ चलते हैं। भगवान शिव एक सुंदर वृषभ पर सवार होते हैं, जो धर्म का प्रतीक है,
    और हिमालय की ओर विवाह समारोह के लिए प्रस्थान करते हैं।
- id: shiva-parvati-marriage-discussion
  type: event
  keywords:
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Lord Shiva, along with other deities, discusses the marriage proposal
    of Parvati, the daughter of the mountain king Himachal. Narada assures Shiva that
    there are no obstacles to the marriage and that Himachal is eager to give his
    daughter to Shiva.
  summary_hi: भगवान शिव, अन्य देवताओं के साथ, पर्वत राजा हिमाचल की पुत्री पार्वती
    के विवाह प्रस्ताव पर चर्चा करते हैं। नारद शिव को आश्वस्त करते हैं कि विवाह में
    कोई बाधा नहीं है और हिमाचल अपनी पुत्री को शिव को देने के लिए उत्सुक हैं।
- id: divine-assembly-at-himalayas
  type: event
  keywords:
  - Himalayas
  - Divine Assembly
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: A grand assembly of gods, led by Vishnu and other sages, proceeds to
    the Himalayas to witness the divine arrangements made for the marriage of Shiva
    and Parvati. The assembly is amazed by the grandeur and the magical illusions
    created by Vishwakarma.
  summary_hi: विष्णु और अन्य ऋषियों के नेतृत्व में देवताओं की एक भव्य सभा हिमालय की
    ओर प्रस्थान करती है ताकि शिव और पार्वती के विवाह के लिए किए गए दिव्य प्रबंधों
    को देखा जा सके। सभा विश्वकर्मा द्वारा रचित भव्यता और जादुई माया से चकित है।
- id: himalaya-meets-shiva
  type: event
  keywords:
  - Himalaya
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Himalaya, upon hearing that Shiva has arrived near his city, becomes
    very pleased. He gathers materials and sends Brahmins and mountains to welcome
    Shiva. Himalaya himself, filled with devotion, goes to see Shiva and praises his
    own fortune.
  summary_hi: हिमालय, जब यह सुनते हैं कि शिव उनके नगर के निकट आए हैं, तो वे बहुत प्रसन्न
    होते हैं। वे सामग्री एकत्रित करते हैं और ब्राह्मणों और पर्वतों को शिव की अगवानी
    के लिए भेजते हैं। हिमालय स्वयं भी भक्ति से परिपूर्ण होकर शिव के दर्शन के लिए जाते
    हैं और अपने भाग्य की प्रशंसा करते हैं।
- id: himalaya-sees-divine-army
  type: event
  keywords:
  - Himalaya
  - Divine Army
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Himalaya is amazed to see the divine army and considers himself blessed.
    The gods are also astonished by the vast army of Himalaya. Both the gods and mountains
    feel immense joy and consider themselves fulfilled.
  summary_hi: हिमालय दिव्य सेना को देखकर आश्चर्यचकित हो जाते हैं और स्वयं को धन्य
    मानते हैं। देवता भी हिमालय की विशाल सेना को देखकर चकित हो जाते हैं। देवता और पर्वत
    दोनों अत्यधिक आनंदित होते हैं और स्वयं को कृतकृत्य मानते हैं।
- id: himalaya-pays-respect-to-shiva
  type: event
  keywords:
  - Himalaya
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Himalaya, upon seeing Shiva, pays his respects along with all the mountains
    and Brahmins. Shiva is described as being mounted on a bull, adorned with various
    ornaments, and radiating divine beauty.
  summary_hi: हिमालय, शिव को देखकर, सभी पर्वतों और ब्राह्मणों के साथ उन्हें प्रणाम
    करते हैं। शिव को वृषभ पर सवार, विभिन्न आभूषणों से सुशोभित और दिव्य सौंदर्य से
    प्रकाशित बताया गया है।
- id: shiva-appearance-to-mena
  type: event
  keywords:
  - Shiva
  - Mena
  - Narada
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Narada shows Mena, Parvati's mother, the divine form of Lord Shiva,
    for whom Parvati had performed intense penance. Mena is initially delighted but
    becomes overwhelmed and frightened by the sight of Shiva's terrifying attendants,
    the Rudra Sena, and faints.
  summary_hi: नारद ने मेना, पार्वती की माता, को भगवान शिव का दिव्य रूप दिखाया, जिनके
    लिए पार्वती ने कठोर तप किया था। मेना पहले प्रसन्न होती हैं, लेकिन शिव के भयानक
    गणों, रुद्र सेना, को देखकर भयभीत हो जाती हैं और बेहोश हो जाती हैं।
- id: mena-faints-seeing-shiva
  type: event
  keywords:
  - Mena
  - Shiva
  - fear
  source:
    book: Shiv Puran
    sarga: Parvati Khand, Chapter 43
  summary_en: Mena, the mother of Parvati, becomes extremely frightened upon seeing
    the terrifying form of Shiva surrounded by his ghostly attendants. Overwhelmed
    by fear, she faints and falls to the ground.
  summary_hi: पार्वती की माता मेना, शिव के भयानक रूप और उनके भूत-प्रेतों से घिरी हुई
    देखकर अत्यंत भयभीत हो जाती हैं और बेहोश होकर जमीन पर गिर जाती हैं।
- id: mena-laments-shiva-marriage
  type: event
  keywords:
  - Mena
  - Shiva
  - lamentation
  source:
    book: Shiv Puran
    sarga: Parvati Khand, Chapter 44
  summary_en: After regaining consciousness, Mena laments the prospect of her daughter
    Parvati marrying Shiva. She criticizes the decision and expresses her distress
    over the situation, feeling deceived by the sages who advised the marriage.
  summary_hi: होश में आने के बाद, मेना अपनी बेटी पार्वती के शिव से विवाह की संभावना
    पर विलाप करती हैं। वह इस निर्णय की आलोचना करती हैं और इस स्थिति पर अपनी पीड़ा
    व्यक्त करती हैं, यह महसूस करते हुए कि उन्हें विवाह की सलाह देने वाले ऋषियों द्वारा
    धोखा दिया गया है।
- id: parvati-marriage-opposition
  type: story
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Chapter 1
  summary_en: In this episode, Menaka, Parvati's mother, opposes the marriage of her
    daughter to Shiva due to his fearsome appearance. Despite the persuasion of Narada,
    the gods, and the sages, Menaka remains unconvinced and threatens to take drastic
    actions to prevent the marriage. Eventually, the mountain king Himalaya tries
    to calm Menaka by explaining Shiva's true nature and the importance of the union.
  summary_hi: इस प्रकरण में, पार्वती की माता मेनका शिव के भयानक रूप के कारण अपनी बेटी
    का विवाह उनसे करने का विरोध करती हैं। नारद, देवताओं और ऋषियों के समझाने के बावजूद,
    मेनका नहीं मानतीं और विवाह रोकने के लिए कठोर कदम उठाने की धमकी देती हैं। अंततः
    पर्वतराज हिमालय मेनका को शांत करने का प्रयास करते हैं और शिव के वास्तविक स्वरूप
    और इस विवाह के महत्व को समझाते हैं।
- id: parvati-pleads-with-mena
  type: story
  keywords:
  - Parvati
  - Mena
  - Shiva
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: Parvati pleads with her mother Mena to accept Lord Shiva as her husband,
    highlighting Shiva's divine attributes and importance. Despite Mena's initial
    resistance and anger, Parvati remains firm in her devotion to Shiva, expressing
    her unwillingness to marry anyone else.
  summary_hi: पार्वती अपनी माता मेना से भगवान शिव को पति के रूप में स्वीकार करने की
    प्रार्थना करती हैं, शिव के दिव्य गुणों और महत्व को उजागर करती हैं। मेना के प्रारंभिक
    प्रतिरोध और क्रोध के बावजूद, पार्वती शिव के प्रति अपनी भक्ति में दृढ़ रहती हैं
    और किसी अन्य से विवाह करने की अनिच्छा व्यक्त करती हैं।
- id: menas-refusal-to-give-parvati-to-shiva
  type: story
  keywords:
  - Parvati
  - Shiva
  - Menaka
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Menaka, the mother of Parvati, refuses to give her
    daughter in marriage to Shiva due to his fearsome appearance. Despite the persuasion
    of Brahma and other sages, Menaka remains adamant, expressing her reluctance to
    marry her daughter to someone with such a terrifying form.
  summary_hi: इस प्रकरण में, पार्वती की माता मेनका शिव के भयंकर रूप के कारण अपनी बेटी
    का विवाह उनसे करने से इनकार करती हैं। ब्रह्मा और अन्य ऋषियों के समझाने के बावजूद,
    मेनका अडिग रहती हैं और अपनी बेटी का विवाह ऐसे भयानक रूप वाले से करने में अनिच्छा
    व्यक्त करती हैं।
- id: vishnus-intervention-in-parvatis-marriage
  type: story
  keywords:
  - Vishnu
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu intervenes in the situation, trying to convince Menaka to accept
    Shiva as a suitable match for Parvati. He praises Shiva's divine nature and assures
    Menaka that marrying Parvati to Shiva will bring great joy and remove all sorrows.
  summary_hi: विष्णु इस स्थिति में हस्तक्षेप करते हैं और मेनका को शिव को पार्वती के
    लिए उपयुक्त वर मानने के लिए मनाने का प्रयास करते हैं। वे शिव के दिव्य स्वरूप की
    प्रशंसा करते हैं और मेनका को आश्वस्त करते हैं कि पार्वती का विवाह शिव से करने
    से महान आनंद प्राप्त होगा और सभी दुख दूर हो जाएंगे।
- id: shiva-divine-form-revelation
  type: event
  keywords:
  - Shiva
  - divine form
  - Menaka
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 45
  summary_en: In this episode, Lord Shiva reveals his beautiful divine form, which
    surpasses even that of Kamadeva, to Menaka and other women of the city. This revelation
    brings immense joy and fulfillment to those who witness it, as they consider their
    lives successful upon seeing Shiva's form.
  summary_hi: इस प्रकरण में, भगवान शिव अपने परम सुंदर दिव्य रूप को मेनका और नगर की
    अन्य स्त्रियों के समक्ष प्रकट करते हैं, जो कामदेव से भी अधिक आकर्षक है। इस दर्शन
    से उन्हें अत्यंत आनंद और संतोष प्राप्त होता है, और वे अपने जीवन को सफल मानते हैं।
- id: parvati-tapasya-success
  type: story
  keywords:
  - Parvati
  - tapasya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 45
  summary_en: Parvati's dedicated penance to win Shiva as her husband is successful.
    She is considered blessed and accomplished upon achieving her goal of marrying
    Shiva, thus fulfilling her purpose.
  summary_hi: पार्वती की भगवान शिव को पति रूप में प्राप्त करने के लिए की गई तपस्या
    सफल होती है। शिव को पति के रूप में प्राप्त कर पार्वती धन्य और कृतकृत्य मानी जाती
    हैं, जिससे उनका उद्देश्य पूरा होता है।
- id: parvati-marriage-to-shiva
  type: event
  keywords:
  - Parvati
  - Shiva
  - marriage
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: The passage describes the marriage of Parvati to Lord Shiva. The mountains,
    including Himalaya, are urged to give Parvati in marriage to Shiva. Brahma and
    other deities witness the event, and Parvati's hand is ceremonially placed in
    Shiva's hand, marking their union.
  summary_hi: इस अंश में पार्वती का विवाह भगवान शिव से होने का वर्णन है। हिमालय सहित
    पर्वतों को पार्वती का विवाह शिव से करने के लिए प्रेरित किया जाता है। ब्रह्मा और
    अन्य देवता इस घटना के साक्षी बनते हैं, और पार्वती का हाथ शिव के हाथ में रखकर उनके
    मिलन को चिह्नित किया जाता है।
- id: shiva-appearance-description
  type: character
  keywords:
  - Shiva
  - appearance
  source:
    book: Shiv Puran
    sarga: Parvati Khanda, Chapter 46
  summary_en: Shiva's divine appearance is described in detail as he arrives for his
    marriage with Parvati. He is depicted with five faces, three eyes, and adorned
    with various ornaments, exuding a radiant and youthful charm that captivates all
    who see him.
  summary_hi: शिव के दिव्य स्वरूप का विस्तार से वर्णन किया गया है जब वे पार्वती से
    विवाह के लिए आते हैं। उन्हें पाँच मुखों, तीन नेत्रों के साथ विभिन्न आभूषणों से
    सुसज्जित दिखाया गया है, जो एक उज्ज्वल और युवा आकर्षण का प्रदर्शन करते हैं जो सभी
    को मोहित करता है।
- id: mena-witnesses-shiva-beauty
  type: event
  keywords:
  - Mena
  - Shiva
  - beauty
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Mena, with a joyful face, performs an aarti and is amazed at the beauty
    of Shiva, which surpasses her expectations. She recalls Parvati's words and is
    filled with wonder at the indescribable beauty of Maheshwara.
  summary_hi: मेना प्रसन्नमुख होकर आरती करती हैं और शिव के सौंदर्य को देखकर चकित हो
    जाती हैं, जो उनकी अपेक्षाओं से परे है। वह पार्वती के शब्दों को याद करती हैं और
    महेश्वर के अवर्णनीय सौंदर्य पर आश्चर्यचकित होती हैं।
- id: celebration-of-shiva-and-parvati
  type: event
  keywords:
  - Shiva
  - Parvati
  - Celebration
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: A grand celebration takes place with the sound of Vedic chants and various
    musical instruments as Shiva and Parvati are united. The event is marked by joy
    and reverence among the gods and sages.
  summary_hi: शिव और पार्वती के मिलन पर वेदों के मंत्रों और विभिन्न वाद्ययंत्रों की
    ध्वनि के साथ एक भव्य उत्सव होता है। यह आयोजन देवताओं और ऋषियों के बीच आनंद और
    श्रद्धा से चिह्नित होता है।
- id: parvati-appearance-description
  type: character
  keywords:
  - Parvati
  - appearance
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: Parvati is described with a complexion like dark collyrium, adorned
    with beautiful ornaments, and having three eyes. Her charming smile and captivating
    appearance leave everyone in awe.
  summary_hi: पार्वती का वर्णन काजल के समान वर्ण, सुंदर आभूषणों से सजी और तीन नेत्रों
    वाली के रूप में किया गया है। उनकी मनमोहक मुस्कान और आकर्षक रूप सभी को चकित कर
    देता है।
- id: parvati-adornment-episode
  type: event
  keywords:
  - Parvati
  - adornment
  - celebration
  source:
    book: Shiv Puran
    sarga: '46'
  summary_en: In this episode, Parvati is adorned with divine ornaments and garments
    as part of a grand celebration. The event is marked by joy and various offerings
    are made to Brahmins. Parvati, the daughter of the great mountain, is described
    as meditating on Shiva, enhancing her beauty.
  summary_hi: इस प्रकरण में, पार्वती को दिव्य आभूषणों और वस्त्रों से सजाया जाता है,
    जो एक भव्य उत्सव का हिस्सा है। इस अवसर पर आनंद और विभिन्न प्रकार के दान ब्राह्मणों
    को दिए जाते हैं। महाशैल की पुत्री पार्वती शिव का ध्यान करती हुई अत्यंत शोभायमान
    होती हैं।
- id: shiva-visit-himalaya-episode
  type: event
  keywords:
  - Shiva
  - Himalaya
  - visit
  source:
    book: Shiv Puran
    sarga: '47'
  summary_en: Shiva visits the house of Himalaya for the marriage ceremony with Parvati.
    The event is attended by various gods and sages, and is marked by rituals and
    celebrations. Shiva and Parvati's union is celebrated with great enthusiasm and
    joy.
  summary_hi: शिव पार्वती के साथ विवाह समारोह के लिए हिमालय के घर जाते हैं। इस अवसर
    पर विभिन्न देवता और ऋषि उपस्थित होते हैं, और यह अनुष्ठानों और उत्सवों से चिह्नित
    होता है। शिव और पार्वती के मिलन को बड़े उत्साह और आनंद के साथ मनाया जाता है।
- id: parvati-wedding-preparations
  type: event
  keywords:
  - Parvati
  - Wedding
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Preparations for the wedding of Parvati and Shiva are underway. Parvati
    is adorned with jewelry and awaits the auspicious moment for the ceremony, while
    deities like Vishnu and sages like Brihaspati are present to witness the event.
  summary_hi: पार्वती और शिव के विवाह की तैयारियाँ चल रही हैं। पार्वती आभूषणों से
    सुसज्जित हैं और समारोह के शुभ मुहूर्त की प्रतीक्षा कर रही हैं, जबकि विष्णु जैसे
    देवता और बृहस्पति जैसे ऋषि इस घटना के साक्षी बनने के लिए उपस्थित हैं।
- id: himalaya-gives-daughter-parvati
  type: event
  keywords:
  - Himalaya
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 48
  summary_en: Himalaya, with his wife Mena, prepares to give their daughter Parvati
    in marriage to Shiva. The ceremony involves traditional rituals, including the
    offering of gifts and the recitation of auspicious timings by the Brahmins. Himalaya
    requests Shiva to reveal his lineage and other details as part of the marriage
    proceedings.
  summary_hi: हिमालय अपनी पत्नी मेना के साथ अपनी पुत्री पार्वती का विवाह शिव से करने
    की तैयारी करते हैं। इस समारोह में पारंपरिक अनुष्ठान शामिल हैं, जिसमें उपहारों
    का अर्पण और ब्राह्मणों द्वारा शुभ मुहूर्त का उच्चारण किया जाता है। हिमालय विवाह
    की प्रक्रिया के हिस्से के रूप में शिव से उनके वंश और अन्य विवरण प्रकट करने का
    अनुरोध करते हैं।
- id: shiva-nature-and-parvati-marriage
  type: story
  keywords:
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: In this episode, Narada explains to the mountain king Himalaya the nature
    of Shiva, who is beyond attributes and forms, and how Parvati's penance has led
    to Shiva becoming her husband. Despite Shiva being beyond worldly classifications
    like lineage and family, he becomes manifest with attributes and forms by his
    own will.
  summary_hi: इस प्रकरण में, नारद पर्वतराज हिमालय को शिव के स्वरूप के बारे में बताते
    हैं, जो गुण और रूप से परे हैं, और कैसे पार्वती की तपस्या के कारण शिव उनके पति
    बने हैं। शिव, जो गोत्र और कुल जैसी सांसारिक श्रेणियों से परे हैं, अपनी इच्छा से
    गुण और रूप धारण करते हैं।
- id: parvati-shiva-marriage-gift-episode
  type: event
  keywords:
  - Parvati
  - Shiva
  - marriage
  - Himalaya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: The passage describes the grand event of Parvati's marriage to Shiva.
    King Himalaya, Parvati's father, joyfully gives away his daughter to Shiva, accompanied
    by lavish gifts including cattle, horses, elephants, and precious gems. The event
    is celebrated with great enthusiasm by gods, sages, and celestial beings.
  summary_hi: यह अंश पार्वती और शिव के विवाह के भव्य आयोजन का वर्णन करता है। पार्वती
    के पिता, हिमालय, खुशी-खुशी अपनी बेटी को शिव को सौंपते हैं, जिसमें मवेशी, घोड़े,
    हाथी और कीमती रत्नों जैसे भव्य उपहार शामिल हैं। इस आयोजन को देवताओं, ऋषियों और
    दिव्य प्राणियों द्वारा बड़े उत्साह के साथ मनाया जाता है।
- id: brahma-moh-episode
  type: story
  keywords:
  - Brahma
  - Parvati
  - Shiva
  - delusion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda
  summary_en: During the marriage rituals of Parvati and Shiva, Brahma becomes momentarily
    deluded by the beauty of Parvati's toenail. Overcome by desire, Brahma is embarrassed
    and tries to hide his shame. Shiva becomes aware of this and is angered, but the
    situation is pacified by the intervention of other deities.
  summary_hi: पार्वती और शिव के विवाह समारोह के दौरान, ब्रह्मा पार्वती के पैर के नख
    की सुंदरता से क्षणिक रूप से मोहित हो जाते हैं। इच्छा से अभिभूत होकर, ब्रह्मा शर्मिंदा
    होते हैं और अपनी शर्म को छिपाने की कोशिश करते हैं। शिव को इसका पता चलता है और
    वे क्रोधित हो जाते हैं, लेकिन अन्य देवताओं के हस्तक्षेप से स्थिति शांत हो जाती
    है।
- id: shiva-parvati-marriage-ritual
  type: event
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Brahma narrates to Narada about the marriage ritual of Shiva and Parvati.
    Shiva performed a havan with Parvati seated beside him, offering oblations into
    the fire with Vedic mantras. The ritual included traditional practices, and both
    Shiva and Parvati circumambulated the fire.
  summary_hi: ब्रह्मा नारद को शिव और पार्वती के विवाह के अनुष्ठान के बारे में बताते
    हैं। शिव ने पार्वती को अपने पास बैठाकर वेद मंत्रों के साथ हवन किया। इस अनुष्ठान
    में पारंपरिक प्रथाएँ शामिल थीं, और शिव और पार्वती दोनों ने अग्नि की परिक्रमा की।
- id: brahma-bewildered-by-parvati
  type: story
  keywords:
  - Brahma
  - Parvati
  - bewilderment
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: During the marriage ceremony, Brahma becomes enchanted by the beauty
    of Parvati's toenails. This enchantment causes him to lose his composure, and
    his energy falls to the earth, leading to his embarrassment. Shiva becomes angry
    at Brahma's behavior.
  summary_hi: विवाह समारोह के दौरान, ब्रह्मा पार्वती के नखों की सुंदरता से मोहित हो
    जाते हैं। इस मोह के कारण वे अपनी स्थिरता खो देते हैं और उनकी ऊर्जा पृथ्वी पर गिर
    जाती है, जिससे उन्हें शर्मिंदगी होती है। शिव ब्रह्मा के व्यवहार से क्रोधित हो
    जाते हैं।
- id: creation-of-balakhilya-rishis
  type: story
  keywords:
  - Balakhilya
  - Rishis
  - creation
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: From the radiant particles of Brahma's seed, thousands of Balakhilya
    Rishis were created. These Rishis, glowing with their own brilliance, stood before
    Brahma and addressed him with affection.
  summary_hi: ब्रह्मा के तेजस्वी बीज के कणों से हजारों बालखिल्य ऋषियों की उत्पत्ति
    हुई। ये ऋषि अपनी स्वयं की चमक से प्रज्वलित होकर ब्रह्मा के सामने खड़े हो गए और
    उन्हें प्रेमपूर्वक संबोधित किया।
- id: narada-directs-balakhilya-rishis
  type: story
  keywords:
  - Narada
  - Balakhilya
  - Gandhamadana
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Narada, driven by divine will, instructed the Balakhilya Rishis to proceed
    to Mount Gandhamadana. He advised them not to stay where they were, as they had
    no purpose there, and told them that by performing severe penance, they would
    become great sages and disciples of the Sun.
  summary_hi: नारद, ईश्वरीय इच्छा से प्रेरित होकर, बालखिल्य ऋषियों को गन्धमादन पर्वत
    पर जाने का निर्देश देते हैं। उन्होंने उन्हें वहाँ रुकने से मना किया क्योंकि उनका
    वहाँ कोई प्रयोजन नहीं था, और कहा कि कठोर तपस्या करके वे महान ऋषि और सूर्य के शिष्य
    बनेंगे।
- id: shiva-revives-kamadeva
  type: story
  keywords:
  - Shiva
  - Kamadeva
  - Rati
  - resurrection
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 50
  summary_en: In this episode, Rati pleads with Lord Shiva to bring her husband Kamadeva
    back to life. Moved by her devotion and the pleas of other goddesses, Shiva revives
    Kamadeva from ashes with his divine gaze. Kamadeva returns to life in his original
    form, bringing joy to Rati and the other deities.
  summary_hi: इस प्रकरण में, रति भगवान शिव से अपने पति कामदेव को पुनर्जीवित करने की
    प्रार्थना करती हैं। उनकी भक्ति और अन्य देवियों की प्रार्थनाओं से प्रभावित होकर,
    शिव अपनी दिव्य दृष्टि से कामदेव को राख से पुनर्जीवित करते हैं। कामदेव अपने मूल
    रूप में जीवन में लौट आते हैं, जिससे रति और अन्य देवताओं को खुशी मिलती है।
- id: shiva-grants-boon-to-kamadeva
  type: story
  keywords:
  - Shiva
  - Kamadeva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Kamadeva, after being incinerated by Shiva's third eye, is granted a
    boon by Shiva. Shiva, pleased with Kamadeva's devotion and repentance, tells him
    to go to Vishnu and assures him of his protection.
  summary_hi: कामदेव, जो शिव की तीसरी आँख से भस्म हो गए थे, शिव द्वारा वरदान प्राप्त
    करते हैं। शिव, कामदेव की भक्ति और पश्चाताप से प्रसन्न होकर, उन्हें विष्णु के पास
    जाने और उनकी सुरक्षा का आश्वासन देते हैं।
- id: parvati-seated-on-shivas-left
  type: event
  keywords:
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Shiva seats Parvati on his left side in his abode and offers her a meal.
    Parvati, in turn, joyfully offers a meal to Shiva, signifying their mutual love
    and respect.
  summary_hi: शिव अपने निवास में पार्वती को अपने बाएँ ओर बैठाते हैं और उन्हें भोजन
    कराते हैं। पार्वती भी प्रसन्नतापूर्वक शिव को भोजन कराती हैं, जो उनके पारस्परिक
    प्रेम और सम्मान को दर्शाता है।
- id: himalaya-invites-shiva
  type: event
  keywords:
  - Himalaya
  - Shiva
  - invitation
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: Himalaya, after performing his rituals and worship, invites Lord Shiva
    and other deities to stay at his home. He expresses his gratitude and joy at having
    the divine guests and prepares a grand feast for them.
  summary_hi: हिमालय ने अपने इष्टदेव की पूजा कर भगवान शिव और अन्य देवताओं को अपने
    घर पर ठहरने के लिए आमंत्रित किया। उन्होंने अपनी कृतज्ञता और खुशी व्यक्त की और
    उनके लिए एक भव्य भोज की तैयारी की।
- id: divine-feast-at-himalayas
  type: event
  keywords:
  - feast
  - Himalaya
  - deities
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: A grand feast is organized by Himalaya for Lord Shiva, Vishnu, Brahma,
    and other deities. The event is marked by joyous celebrations, music, dance by
    apsaras, and generous offerings, creating an atmosphere of divine festivity.
  summary_hi: हिमालय द्वारा भगवान शिव, विष्णु, ब्रह्मा और अन्य देवताओं के लिए एक भव्य
    भोज का आयोजन किया गया। इस आयोजन में हर्षोल्लास, संगीत, अप्सराओं का नृत्य और उदार
    दान के साथ दिव्य उत्सव का माहौल बना।
- id: apsaras-dance-celebration
  type: event
  keywords:
  - apsaras
  - dance
  - celebration
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: During the feast organized by Himalaya, apsaras perform dances as part
    of the celebrations. The event is filled with music, praise, and various forms
    of entertainment, enhancing the festive spirit.
  summary_hi: हिमालय द्वारा आयोजित भोज के दौरान, अप्सराएँ नृत्य करती हैं। यह आयोजन
    संगीत, स्तुति और विभिन्न प्रकार के मनोरंजन से भरा हुआ है, जो उत्सव की भावना को
    बढ़ाता है।
- id: shiva-stays-at-himalayas
  type: event
  keywords:
  - Shiva
  - Himalaya
  - stay
  source:
    book: Shiv Puran
    sarga: Parvati Khand
  summary_en: Lord Shiva, along with other deities, stays at Himalaya's abode for
    several days. Himalaya requests them to extend their stay, showing great hospitality
    and reverence towards the divine guests.
  summary_hi: भगवान शिव अन्य देवताओं के साथ हिमालय के निवास पर कई दिनों तक ठहरते हैं।
    हिमालय उनसे अपने निवास पर अधिक दिन ठहरने का अनुरोध करते हैं, जिससे उनकी अतिथि
    सत्कार और श्रद्धा प्रकट होती है।
- id: shiva-himalaya-visit
  type: event
  keywords:
  - Shiva
  - Himalaya
  - visit
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Parvatikhanda, Chapter 53
  summary_en: Lord Shiva, along with other deities, visits the abode of the Himalayas.
    During this visit, Menaka, the mother of Parvati, expresses her concerns and requests
    Shiva to take care of Parvati and forgive her faults. The deities stay for some
    time before departing, and Menaka is deeply emotional about the separation.
  summary_hi: भगवान शिव अन्य देवताओं के साथ हिमालय के निवास पर जाते हैं। इस यात्रा
    के दौरान, पार्वती की माता मेनका अपनी चिंताओं को व्यक्त करती हैं और शिव से अनुरोध
    करती हैं कि वे पार्वती का ध्यान रखें और उसके दोषों को क्षमा करें। देवता कुछ समय
    के लिए रुकते हैं और फिर प्रस्थान करते हैं, और मेनका इस वियोग से अत्यंत भावुक हो
    जाती हैं।
- id: parvati-farewell
  type: event
  keywords:
  - Parvati
  - farewell
  - Himalaya
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Parvatikhanda, Chapter 54
  summary_en: The sages advise Himalaya to arrange for Parvati's farewell as an auspicious
    time has arrived. Himalaya, though saddened by the thought of separation from
    Parvati, agrees and prepares for her departure. Menaka is emotional and sends
    a message to Parvati, expressing her mixed feelings of joy and sorrow.
  summary_hi: सप्तर्षि हिमालय को सलाह देते हैं कि पार्वती की विदाई के लिए उत्तम समय
    आ गया है। हिमालय, पार्वती के वियोग के विचार से दुखी होते हुए भी सहमत होते हैं
    और उसकी विदाई की तैयारी करते हैं। मेनका भावुक होती हैं और पार्वती को एक संदेश
    भेजती हैं, जिसमें वे अपनी खुशी और दुख के मिश्रित भाव व्यक्त करती हैं।
- id: girija-vidai-episode
  type: event
  keywords:
  - girija
  - vidai
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Mena, the wife of Himachal, prepares for the departure of her daughter
    Girija. She adorns Girija with various ornaments and fine clothes, preparing her
    for her journey.
  summary_hi: हिमाचल की पत्नी मेना अपनी पुत्री गिरिजा की विदाई की तैयारी करती हैं।
    वह गिरिजा को विभिन्न आभूषणों और उत्तम वस्त्रों से सजाती हैं, उसे उसकी यात्रा के
    लिए तैयार करती हैं।
- id: pativrata-dharma-teaching
  type: concept
  keywords:
  - pativrata
  - dharma
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: A Brahmin woman teaches Girija about the supreme vow of pativrata dharma,
    emphasizing the importance of serving one's husband as a deity and the spiritual
    benefits it brings.
  summary_hi: एक ब्राह्मण महिला गिरिजा को पातिव्रता धर्म के सर्वोच्च व्रत के बारे
    में सिखाती है, जिसमें अपने पति की देवता के रूप में सेवा करने और इससे मिलने वाले
    आध्यात्मिक लाभों का महत्व बताया गया है।
- id: anasuya-revives-brahmin
  type: story
  keywords:
  - Anasuya
  - Atri
  - Brahmin
  - Varaha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 54
  summary_en: Anasuya, the devoted wife of sage Atri, was able to revive a Brahmin
    who had died due to a curse by Varaha. This was possible due to her unwavering
    devotion to her husband, showcasing the power of a devoted wife.
  summary_hi: अनसूया, जो कि ऋषि अत्रि की पतिव्रता पत्नी थीं, ने वराह के शाप से मरे
    हुए एक ब्राह्मण को पुनर्जीवित कर दिया। यह उनके पति के प्रति उनकी अटूट भक्ति के
    कारण संभव हुआ, जो एक पतिव्रता पत्नी की शक्ति को दर्शाता है।
- id: parvati-wedding-farewell
  type: event
  keywords:
  - Parvati
  - Shiva
  - Wedding
  - Farewell
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Parvati Khanda, Chapter 54
  summary_en: The passage describes the emotional farewell of Parvati as she departs
    with Shiva after their wedding. Her mother, Mena, and other women are overcome
    with emotion, and even the gods and sages present are moved to tears.
  summary_hi: यह अंश पार्वती की शिव के साथ विवाह के बाद की विदाई का वर्णन करता है।
    उनकी माता मेना और अन्य महिलाएं भावुक हो जाती हैं, और यहां तक कि उपस्थित देवता
    और ऋषि भी आंसुओं से भर जाते हैं।
- id: parvati-farewell-episode
  type: event
  keywords:
  - parvati
  - farewell
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati bids farewell to her family as she prepares to leave for her
    new home. Her parents, siblings, and other relatives are overcome with emotion
    and cry as they see her off. The Brahmins present offer spiritual guidance and
    blessings for her journey.
  summary_hi: पार्वती अपने परिवार को विदाई देती हैं क्योंकि वह अपने नए घर के लिए प्रस्थान
    करने की तैयारी करती हैं। उनके माता-पिता, भाई-बहन और अन्य रिश्तेदार भावुक होकर
    रोते हैं। उपस्थित ब्राह्मण आध्यात्मिक मार्गदर्शन और यात्रा के लिए आशीर्वाद प्रदान
    करते हैं।
- id: shiva-parvati-marriage-celebration
  type: event
  keywords:
  - shiva
  - parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The marriage of Shiva and Parvati is celebrated with great joy and festivity.
    All the gods, including Narayana, are invited and partake in a grand feast organized
    by Shiva. The event is marked by happiness and the blessings of the divine.
  summary_hi: शिव और पार्वती का विवाह बड़े हर्ष और उत्सव के साथ मनाया जाता है। नारायण
    सहित सभी देवताओं को आमंत्रित किया जाता है और शिव द्वारा आयोजित एक भव्य भोज में
    भाग लेते हैं। यह आयोजन खुशी और दिव्य आशीर्वाद से चिह्नित होता है।
- id: shiva-reminds-parvati-of-past-lives
  type: story
  keywords:
  - shiva
  - parvati
  - past-lives
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva reminds Parvati of their connection through past lives, suggesting
    that she has always been his beloved. Parvati acknowledges this with a smile and
    asks Shiva to focus on the present task at hand.
  summary_hi: शिव पार्वती को उनके पिछले जन्मों के संबंध की याद दिलाते हैं, यह सुझाव
    देते हुए कि वह हमेशा उनकी प्रिय रही हैं। पार्वती मुस्कुराते हुए इसे स्वीकार करती
    हैं और शिव से वर्तमान कार्य पर ध्यान केंद्रित करने के लिए कहती हैं।
- id: shiva-parvati-marriage-and-kailasa-episode
  type: story
  keywords:
  - Shiva
  - Parvati
  - Kailasa
  source:
    book: Shiv Puran
    sarga: Chapter 1
  summary_en: After marrying Parvati, Shiva went to Mount Kailasa where he engaged
    in divine activities. The gods were pleased and celebrated his arrival. Shiva
    and Parvati spent a long time in seclusion, enjoying each other's company.
  summary_hi: पार्वती से विवाह करने के बाद शिव कैलास पर्वत पर गए जहाँ उन्होंने दिव्य
    कार्यों में संलग्न हुए। देवताओं ने उनकी आगमन पर प्रसन्न होकर उत्सव मनाया। शिव
    और पार्वती ने एकांत में एक-दूसरे के साथ समय बिताया।
- id: birth-of-kartikeya-and-tarakasura-episode
  type: story
  keywords:
  - Kartikeya
  - Tarakasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: Chapter 1
  summary_en: Brahma narrates the divine story of Kartikeya's birth and his role in
    slaying the demon Tarakasura. This story is said to destroy all sins and bring
    liberation to those who hear it.
  summary_hi: ब्रह्मा कार्तिकेय के जन्म और राक्षस तारकासुर के वध की दिव्य कथा सुनाते
    हैं। यह कथा सभी पापों को नष्ट करने वाली और सुनने वालों को मोक्ष प्रदान करने वाली
    मानी जाती है।
- id: shiva-vishnu-discussion
  type: story
  keywords:
  - Shiva
  - Vishnu
  - Devatas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: The devatas, concerned about Shiva's prolonged period of enjoyment,
    approach Vishnu for guidance. Vishnu assures them that everything will be fine
    and advises them to seek refuge in Shiva, as those who do so have nothing to fear.
    He explains that Shiva will conclude his enjoyment after a thousand years as per
    divine timing.
  summary_hi: देवता, शिव के दीर्घकालिक भोग काल से चिंतित होकर, विष्णु के पास मार्गदर्शन
    के लिए जाते हैं। विष्णु उन्हें आश्वस्त करते हैं कि सब कुछ ठीक होगा और उन्हें शिव
    की शरण में जाने की सलाह देते हैं, क्योंकि जो ऐसा करते हैं उन्हें किसी भी प्रकार
    का भय नहीं होता। वह बताते हैं कि शिव अपने भोग को एक हजार वर्षों के बाद समाप्त
    करेंगे।
- id: durvasa-curse-story
  type: story
  keywords:
  - Durvasa
  - Curse
  - Separation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: The sage Durvasa experiences separation from his wife due to a curse.
    However, he later finds solace by marrying another auspicious woman, thus overcoming
    the sorrow of separation.
  summary_hi: महामुनि दुर्वासा को एक श्राप के कारण अपनी पत्नी से वियोग का सामना करना
    पड़ता है। हालांकि, वह बाद में एक अन्य मंगलमयी स्त्री से विवाह करके वियोग के दुःख
    को दूर करते हैं।
- id: chandra-tara-story
  type: story
  keywords:
  - Chandra
  - Tara
  - Separation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Chandra, after being separated from his wife Tara due to a curse, performs
    penance to Shiva and regains her, thus alleviating his sorrow.
  summary_hi: चंद्रमा, श्राप के कारण अपनी पत्नी तारा से वियोग के बाद, शिव की आराधना
    करते हैं और उन्हें पुनः प्राप्त करते हैं, जिससे उनका दुःख दूर होता है।
- id: harishchandra-curse-story
  type: story
  keywords:
  - Harishchandra
  - Curse
  - Separation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: King Harishchandra faces separation from his wife and son due to a curse.
    He later worships Shiva and is freed from his troubles.
  summary_hi: राजा हरिश्चंद्र को श्राप के कारण अपनी पत्नी और पुत्र से वियोग का सामना
    करना पड़ता है। वह बाद में शिव की आराधना करते हैं और अपनी समस्याओं से मुक्त हो
    जाते हैं।
- id: gautama-mohini-episode
  type: story
  keywords:
  - Gautama
  - Mohini
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sage Gautama became infatuated with Mohini, leading to his separation
    from his wife. He later performed penance to Lord Shiva to overcome this attachment.
  summary_hi: महर्षि गौतम मोहिनी के प्रति आसक्त हो गए, जिससे उनका अपनी पत्नी से वियोग
    हो गया। बाद में उन्होंने भगवान शिव की आराधना की और इस आसक्ति से छुटकारा पाया।
- id: ajamil-vrishali-episode
  type: story
  keywords:
  - Ajamila
  - Vrishali
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The noble Brahmin Ajamila became infatuated with a woman named Vrishali.
    Despite the fear of divine retribution, no deity intervened, illustrating the
    power of desire.
  summary_hi: द्विजश्रेष्ठ अजामिल वृषली नामक स्त्री के प्रति आसक्त हो गए। देवताओं
    के भय के बावजूद, किसी देवता ने हस्तक्षेप नहीं किया, जो कामना की शक्ति को दर्शाता
    है।
- id: skanda-birth-prophecy
  type: story
  keywords:
  - Skanda
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A prophecy foretold that a divine child named Skanda would be born from
    Shiva's energy after a thousand divine years. The gods were advised to visit Shiva
    after this period to ensure the prophecy's fulfillment.
  summary_hi: एक भविष्यवाणी के अनुसार, भगवान शिव की ऊर्जा से स्कन्द नामक एक दिव्य
    बालक का जन्म होगा, जो एक हजार दिव्य वर्षों के बाद होगा। देवताओं को इस अवधि के
    बाद शिव के पास जाने की सलाह दी गई थी ताकि भविष्यवाणी पूरी हो सके।
- id: vishnu-seeks-shiva
  type: story
  keywords:
  - Vishnu
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Vishnu, accompanied by Brahma and other deities, went to Mount
    Kailash to seek Lord Shiva's help. They were surprised not to find Shiva there
    and inquired about his whereabouts from Shiva's attendants.
  summary_hi: भगवान विष्णु, ब्रह्मा और अन्य देवताओं के साथ, भगवान शिव की सहायता के
    लिए कैलाश पर्वत गए। शिव को वहां न पाकर वे आश्चर्यचकित हुए और शिव के गणों से उनके
    ठिकाने के बारे में पूछा।
- id: shiva-plea-to-save-gods
  type: story
  keywords:
  - Shiva
  - Vishnu
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 1
  summary_en: The gods, along with Vishnu, approach Shiva to plead for his intervention
    against the demon Tarakasura. They express their distress and seek refuge in Shiva,
    asking him to protect them from the demon's tyranny.
  summary_hi: देवता और विष्णु शिव के पास जाकर उनसे तारकासुर राक्षस के खिलाफ हस्तक्षेप
    करने की प्रार्थना करते हैं। वे अपनी पीड़ा व्यक्त करते हैं और शिव से उनकी रक्षा
    करने की गुहार लगाते हैं।
- id: shiva-appears-to-gods
  type: event
  keywords:
  - Shiva
  - gods
  - appearance
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In response to the prayers and chants of the gods and sages, Lord Shiva
    appears before them. He is pleased with their devotion and asks them to request
    a boon.
  summary_hi: देवताओं और ऋषियों की प्रार्थनाओं और मंत्रों के जप के उत्तर में, भगवान
    शिव उनके सामने प्रकट होते हैं। वह उनकी भक्ति से प्रसन्न होते हैं और उन्हें वरदान
    मांगने के लिए कहते हैं।
- id: parvati-anger-at-gods
  type: story
  keywords:
  - Parvati
  - Gods
  - Anger
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 1
  summary_en: Parvati arrives and, upon learning about the situation, becomes furious
    with the gods for their actions. She accuses them of being selfish and causing
    her distress, expressing her anger towards them.
  summary_hi: पार्वती आती हैं और स्थिति के बारे में जानकर देवताओं पर क्रोधित हो जाती
    हैं। वह उन्हें स्वार्थी और अपने कष्ट का कारण मानती हैं, और उनके प्रति अपना क्रोध
    व्यक्त करती हैं।
- id: agni-absorbs-shivas-tejas
  type: event
  keywords:
  - Agni
  - Shiva
  - Tejas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Agni, inspired by the gods, takes the form of a pigeon and absorbs the
    Tejas (energy) of Shiva that had fallen to the earth. This event leads to a series
    of divine interactions and consequences.
  summary_hi: अग्नि, देवताओं से प्रेरित होकर, कपोत का रूप धारण कर शिव के पृथ्वी पर
    गिरे तेज को ग्रहण कर लेता है। इस घटना से कई दिव्य घटनाएं और परिणाम उत्पन्न होते
    हैं।
- id: parvati-curses-the-gods
  type: event
  keywords:
  - Parvati
  - Curse
  - Gods
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati, upon learning about the disturbance caused by the gods, becomes
    furious and curses them. She declares that from now on, the wives of the gods
    will be barren and those who oppose her will always suffer.
  summary_hi: पार्वती, देवताओं द्वारा उत्पन्न विघ्न के बारे में जानकर क्रोधित हो जाती
    हैं और उन्हें शाप देती हैं। वह घोषणा करती हैं कि अब से देवताओं की पत्नियाँ बांझ
    हो जाएँगी और जो उनका विरोध करेंगे, वे हमेशा दुखी रहेंगे।
- id: parvati-curses-agni
  type: event
  keywords:
  - Parvati
  - Agni
  - Curse
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Parvati curses Agni for consuming Shiva's Tejas, declaring that he will
    become all-consuming and suffer eternally. She criticizes him for not understanding
    the essence of Shiva and for aiding the gods.
  summary_hi: पार्वती अग्नि को शिव के तेज का भक्षण करने के लिए शाप देती हैं, यह कहते
    हुए कि वह सर्वभक्षी बन जाएगा और सदैव दुखी रहेगा। वह उसे शिव के तत्व को न समझने
    और देवताओं की सहायता करने के लिए आलोचना करती हैं।
- id: birth-of-ganesha
  type: story
  keywords:
  - ganesha
  - birth
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: In the Shvetakalpa, after Shiva's marriage and his departure to Kailasa,
    Parvati, with the help of her attendants Jaya and Vijaya, decided to create a
    being who would be her own attendant. From the dirt of her body, she fashioned
    a beautiful and powerful boy, endowed with all auspicious marks. She blessed him
    with clothes, ornaments, and declared him her son, naming him Ganesha.
  summary_hi: श्वेतकल्प में, शिव के विवाह और कैलास प्रस्थान के बाद, पार्वती ने अपनी
    सखियों जया और विजया की सहायता से एक ऐसा गण बनाने का निर्णय लिया जो उनका अपना हो।
    अपने शरीर के मैल से उन्होंने एक सुंदर और शक्तिशाली बालक का निर्माण किया, जिसे
    उन्होंने वस्त्र, आभूषण दिए और उसे अपना पुत्र घोषित किया, उसका नाम गणेश रखा।
- id: gods-seek-shivas-mercy
  type: event
  keywords:
  - Gods
  - Shiva
  - Mercy
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, suffering from the effects of Parvati's curse and unable to
    bear the Tejas of Shiva, seek refuge with Shiva. They approach him with humility
    and devotion, pleading for relief from their predicament.
  summary_hi: देवता, पार्वती के शाप के प्रभाव से पीड़ित और शिव के तेज को सहन न कर
    पाने के कारण, शिव की शरण में जाते हैं। वे नम्रता और भक्ति के साथ उनसे अपनी स्थिति
    से राहत की प्रार्थना करते हैं।
- id: devas-seeking-shivas-help
  type: story
  keywords:
  - devas
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: The devas, suffering from the unbearable heat of Shiva's energy, approach
    him for help. They plead with Shiva to alleviate their distress, as they are unable
    to bear the heat any longer.
  summary_hi: देवता, शिव की ऊर्जा की असहनीय गर्मी से पीड़ित होकर, उनसे मदद मांगते
    हैं। वे शिव से अपनी पीड़ा को कम करने की प्रार्थना करते हैं, क्योंकि वे अब और अधिक
    गर्मी सहन नहीं कर सकते।
- id: shiva-alleviates-devas-distress
  type: story
  keywords:
  - shiva
  - devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Shiva, hearing the pleas of the devas, assures them that they will soon
    be relieved of their suffering. He instructs them to expel his energy, which they
    do, resulting in a golden, mountain-like form on earth, bringing them peace.
  summary_hi: शिव, देवताओं की प्रार्थनाओं को सुनकर, उन्हें आश्वासन देते हैं कि वे
    जल्द ही अपने कष्टों से मुक्त हो जाएंगे। वह उन्हें अपनी ऊर्जा को बाहर निकालने का
    निर्देश देते हैं, जिसे वे करते हैं, और यह पृथ्वी पर एक सुनहरे, पर्वत के आकार का
    रूप ले लेता है, जिससे उन्हें शांति मिलती है।
- id: agni-seeks-forgiveness-from-shiva
  type: story
  keywords:
  - agni
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Agni, feeling remorseful for consuming Shiva's energy, seeks forgiveness
    from Shiva. Shiva, pleased with Agni's repentance, forgives him and instructs
    him to release the energy in a specific manner, ensuring Agni's peace.
  summary_hi: अग्नि, शिव की ऊर्जा को ग्रहण करने के लिए पछताते हुए, शिव से क्षमा मांगते
    हैं। शिव, अग्नि के पश्चाताप से प्रसन्न होकर, उन्हें क्षमा कर देते हैं और एक विशेष
    तरीके से ऊर्जा को छोड़ने का निर्देश देते हैं, जिससे अग्नि को शांति मिलती है।
- id: agni-seeks-shiva-refuge
  type: story
  keywords:
  - Agni
  - Shiva
  - refuge
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Agni, overwhelmed by his actions, seeks refuge in Lord Shiva. Shiva,
    pleased with Agni's submission, assures him that his suffering will end and instructs
    him to place Shiva's seed in a virtuous woman to be free from the burning pain.
  summary_hi: अग्नि, अपने कार्यों से व्यथित होकर भगवान शिव की शरण में जाता है। शिव,
    अग्नि की समर्पण भावना से प्रसन्न होकर उसे आश्वासन देते हैं कि उसका कष्ट समाप्त
    हो जाएगा और उसे एक सुलक्षणा स्त्री में शिव के वीर्य को स्थापित करने का निर्देश
    देते हैं ताकि वह दाह से मुक्त हो सके।
- id: sapta-rishi-wives-episode
  type: story
  keywords:
  - Sapta Rishi
  - wives
  - Shiva's seed
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The wives of the Sapta Rishis, while bathing in the cold, are drawn
    to Agni for warmth. Under Shiva's influence, they unknowingly receive his seed
    through their pores, leading to their pregnancy. This causes distress among the
    Rishis, who abandon their wives.
  summary_hi: सप्तर्षियों की पत्नियाँ ठंड में स्नान करते समय गर्मी के लिए अग्नि की
    ओर आकर्षित होती हैं। शिव के प्रभाव में, वे अनजाने में अपने रोमकूपों के माध्यम
    से शिव का वीर्य ग्रहण कर लेती हैं, जिससे वे गर्भवती हो जाती हैं। इससे ऋषियों में
    चिंता उत्पन्न होती है और वे अपनी पत्नियों का त्याग कर देते हैं।
- id: birth-of-kartikeya
  type: story
  keywords:
  - kartikeya
  - birth
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 4
  summary_en: Kartikeya, the son of Shiva, was born from the divine energies of various
    elements like fire, Himalaya, and Ganga. He was destined to defeat the demon Taraka
    and was raised by the Krittikas. Despite being nurtured by them, he was recognized
    as the son of Shiva.
  summary_hi: कार्तिकेय, शिव के पुत्र, अग्नि, हिमालय और गंगा जैसी विभिन्न तत्वों की
    दिव्य ऊर्जा से उत्पन्न हुए। उन्हें राक्षस तारक का वध करने के लिए नियत किया गया
    था और उन्हें कृत्तिकाओं ने पाला। उनके द्वारा पाले जाने के बावजूद, उन्हें शिव का
    पुत्र माना गया।
- id: birth-of-skanda
  type: story
  keywords:
  - skanda
  - birth
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: The unbearable radiance of Shiva was deposited into the Ganga by the
    Himalayas, leading to the birth of a radiant and auspicious child, Skanda, on
    the sixth day of the bright half of the month of Margashirsha. This event brought
    joy to Parvati and Shiva, and a shower of flowers fell from the sky.
  summary_hi: शिव के असहनीय तेज को हिमालय ने गंगा में विसर्जित कर दिया, जिससे मार्गशीर्ष
    मास के शुक्ल पक्ष की षष्ठी तिथि को एक तेजस्वी और शुभ बालक स्कंद का जन्म हुआ। इस
    घटना से पार्वती और शिव आनंदित हो गए, और आकाश से पुष्पवृष्टि हुई।
- id: skanda-initiation-by-vishwamitra
  type: story
  keywords:
  - skanda
  - vishwamitra
  - initiation
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: Vishwamitra, guided by divine will, arrives at the place where Skanda
    was born. Impressed by the child's divine aura, Vishwamitra praises him. Skanda
    requests Vishwamitra to perform his initiation according to Vedic rites, and appoints
    him as his priest, promising him eternal reverence.
  summary_hi: विधाता की प्रेरणा से विश्वामित्र उस स्थान पर पहुँचे जहाँ स्कंद का जन्म
    हुआ था। बालक के दिव्य तेज से प्रभावित होकर विश्वामित्र ने उसकी स्तुति की। स्कंद
    ने उनसे वेदोक्त रीति से अपना संस्कार करने का अनुरोध किया और उन्हें अपना पुरोहित
    नियुक्त किया, जिससे उन्हें सदा के लिए सम्मान प्राप्त होगा।
- id: shiva-initiation-ceremony
  type: event
  keywords:
  - Shiva
  - initiation
  - Vishwamitra
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishwamitra performs the initiation ceremony for the young Shiva according
    to Vedic rites, as instructed by Shiva himself. This event marks the beginning
    of Shiva's divine journey and his association with Vishwamitra.
  summary_hi: विश्वामित्र ने शिव के बाल रूप का वेदोक्त विधि से संस्कार किया, जैसा
    कि शिव ने स्वयं निर्देश दिया था। यह घटना शिव की दिव्य यात्रा की शुरुआत और विश्वामित्र
    के साथ उनके संबंध को चिह्नित करती है।
- id: agni-gifts-shakti-to-kartikeya
  type: story
  keywords:
  - Agni
  - Kartikeya
  - Shakti
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Agni, the fire god, embraces the divine child Kartikeya and gifts him
    a powerful weapon called Shakti. Kartikeya uses this weapon to destroy a mountain
    peak, showcasing his strength and divine power.
  summary_hi: अग्निदेव ने दिव्य बालक कार्तिकेय को गले लगाकर उन्हें शक्तिशाली अस्त्र
    'शक्ति' प्रदान किया। कार्तिकेय ने इस अस्त्र का उपयोग करके एक पर्वत शिखर को नष्ट
    कर दिया, जिससे उनकी शक्ति और दिव्यता प्रदर्शित होती है।
- id: kartikeya-battle-with-demons
  type: story
  keywords:
  - Kartikeya
  - demons
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: In a fierce battle, the gods were initially defeated by the demons and
    sought refuge with Lord Shiva. Angered by the plight of the gods, Shiva empowered
    his son Kartikeya to fight the demons. Kartikeya, with great valor, defeated the
    demon army, and the goddess Kali joined the battle, causing terror among the demons.
  summary_hi: एक भयंकर युद्ध में, देवताओं को पहले दानवों ने पराजित कर दिया और उन्होंने
    भगवान शिव की शरण ली। देवताओं की स्थिति देखकर शिवजी ने क्रोधित होकर अपने पुत्र
    कार्तिकेय को दानवों से लड़ने के लिए सशक्त किया। कार्तिकेय ने वीरता से दानव सेना
    को पराजित किया और देवी काली ने युद्ध में शामिल होकर दानवों में आतंक फैला दिया।
- id: kartikeya-nursed-by-krittikas
  type: story
  keywords:
  - Kartikeya
  - Krittikas
  - nurturing
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The six Krittika goddesses find the divine child Kartikeya and decide
    to nurse him. They each feed him, and he develops six faces to drink milk from
    all of them simultaneously, symbolizing his divine nature.
  summary_hi: छह कृतिका देवियों ने दिव्य बालक कार्तिकेय को पाया और उन्हें दूध पिलाने
    का निर्णय लिया। उन्होंने प्रत्येक को दूध पिलाया, और कार्तिकेय ने एक साथ सभी से
    दूध पीने के लिए छह मुख विकसित किए, जो उनकी दिव्यता का प्रतीक है।
- id: birth-of-shakha-vishakha-naigama
  type: story
  keywords:
  - Indra
  - Kartikeya
  - Shakha
  - Vishakha
  - Naigama
  source:
    book: Shiv Puran
    sarga: Kumar Khand, Chapter 3
  summary_en: 'Indra attacked Kartikeya with his vajra, resulting in the birth of
    three powerful beings: Shakha, Vishakha, and Naigama. These beings, along with
    Kartikeya, charged at Indra, who then sought refuge with them. The gods, including
    Indra, were amazed and returned to their abode, unable to comprehend the mystery
    of Kartikeya''s power.'
  summary_hi: इन्द्र ने कार्तिकेय पर अपने वज्र से प्रहार किया, जिससे तीन शक्तिशाली
    पुरुषों - शाख, विशाख और नैगम का जन्म हुआ। ये पुरुष कार्तिकेय के साथ इन्द्र पर
    आक्रमण करने दौड़े, जिससे इन्द्र ने उनकी शरण ली। देवगण, इन्द्र सहित, इस रहस्य को
    समझ नहीं सके और अपने लोक लौट गए।
- id: kartikeya-nurtured-by-krittikas
  type: story
  keywords:
  - Kartikeya
  - Krittikas
  - Divine Child
  source:
    book: Shiv Puran
    sarga: Kumar Khand, Chapter 3
  summary_en: The six Krittikas, upon seeing the divine child Kartikeya, wished to
    nurture him. To resolve their dispute, Kartikeya manifested six faces and accepted
    nourishment from all of them. The Krittikas, pleased, took him to their abode
    and raised him with care and affection.
  summary_hi: छः कृत्तिकाओं ने दिव्य बालक कार्तिकेय को देखकर उसे पालने की इच्छा की।
    उनके विवाद को सुलझाने के लिए कार्तिकेय ने छः मुख बना लिए और सभी से स्तनपान किया।
    कृत्तिकाएँ प्रसन्न होकर उसे अपने लोक ले गईं और उसे प्रेमपूर्वक पाला।
- id: kartikeya-displays-divine-powers
  type: story
  keywords:
  - Kartikeya
  - Divine Powers
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Kumar Khand, Chapter 3
  summary_en: Kartikeya, the son of the Krittikas, displayed his divine powers in
    the celestial assembly, astonishing Vishnu and the other gods. When asked about
    his identity, he remained silent and returned to his abode, continuing to live
    in secrecy.
  summary_hi: कृत्तिकाओं के पुत्र कार्तिकेय ने दिव्य देवसभा में अपनी दिव्य शक्तियों
    का प्रदर्शन किया, जिससे विष्णु और अन्य देवता आश्चर्यचकित हो गए। जब उनसे उनकी पहचान
    पूछी गई, तो उन्होंने कुछ नहीं कहा और अपने घर लौट गए, गुप्त रूप से रहने लगे।
- id: parvati-question-to-shiva
  type: story
  keywords:
  - Parvati
  - Shiva
  - divine-energy
  source:
    book: Shiv Puran
    sarga: Kumar Khanda
  summary_en: Parvati playfully questions Shiva about the fate of his divine energy,
    which did not enter her womb and instead fell to the earth. She wonders where
    it went and who might have hidden it. Shiva, amused, calls upon the gods and sages
    to find out the truth.
  summary_hi: पार्वती ने शिव से हँसते हुए पूछा कि उनका दिव्य तेज, जो उनके गर्भ में
    नहीं गया और पृथ्वी पर गिर गया, कहाँ गया और किसने उसे छिपा लिया। शिव ने देवताओं
    और ऋषियों को बुलाकर इस रहस्य का पता लगाने को कहा।
- id: shiva-energy-hidden
  type: story
  keywords:
  - Shiva
  - divine-energy
  - gods
  source:
    book: Shiv Puran
    sarga: Kumar Khanda
  summary_en: The gods, fearing Shiva's wrath, discuss among themselves and declare
    that whoever hid Shiva's energy should face various punishments. Vishnu, Brahma,
    and other deities express that the culprit should suffer consequences for their
    actions.
  summary_hi: देवता, शिव के क्रोध से डरते हुए, आपस में चर्चा करते हैं और घोषणा करते
    हैं कि जिसने भी शिव के तेज को छिपाया है, उसे विभिन्न दंड भुगतने चाहिए। विष्णु,
    ब्रह्मा और अन्य देवता व्यक्त करते हैं कि अपराधी को अपने कार्यों के लिए परिणाम
    भुगतने चाहिए।
- id: earth-fire-mountain-ganga-confession
  type: story
  keywords:
  - Earth
  - Fire
  - Mountain
  - Ganga
  source:
    book: Shiv Puran
    sarga: Kumar Khanda
  summary_en: Earth, Fire, Mountain, and Ganga each confess their inability to contain
    Shiva's powerful energy. Earth admits to being unable to hold it and passing it
    on, while Fire, Mountain, and Ganga also express their struggles with the overwhelming
    energy.
  summary_hi: पृथ्वी, अग्नि, पर्वत और गंगा, शिव के शक्तिशाली तेज को धारण करने में
    अपनी असमर्थता स्वीकार करते हैं। पृथ्वी इसे धारण करने में असमर्थता व्यक्त करती
    है और इसे आगे बढ़ा देती है, जबकि अग्नि, पर्वत और गंगा भी इस अत्यधिक ऊर्जा के साथ
    अपने संघर्ष को व्यक्त करते हैं।
- id: kartikeya-assurance-to-krittikas
  type: story
  keywords:
  - Kartikeya
  - Krittikas
  source:
    book: Shiv Puran
    sarga: Kumar Khanda
  summary_en: The Krittikas, seeing the army of Shiva's attendants surrounding their
    abode, become fearful and seek guidance from Kartikeya. Kartikeya assures them
    not to fear, as he is invincible despite being a child.
  summary_hi: कृत्तिकाएँ शिव के गणों की सेना को अपने घर के चारों ओर देखकर भयभीत हो
    जाती हैं और कार्तिकेय से मार्गदर्शन मांगती हैं। कार्तिकेय उन्हें आश्वस्त करते
    हैं कि वे भयभीत न हों, क्योंकि वे बालक होते हुए भी अजेय हैं।
- id: nandishwara-message-to-kartikeya
  type: story
  keywords:
  - Nandishwara
  - Kartikeya
  source:
    book: Shiv Puran
    sarga: Kumar Khanda
  summary_en: Nandishwara approaches Kartikeya and explains the reason for their visit.
    He tells Kartikeya that they were sent by Maheshwara to find him, as all the gods
    including Brahma, Vishnu, and Shiva were gathered at Kailasa for a great festival.
  summary_hi: नन्दीश्वर कार्तिकेय के पास आते हैं और उनके आगमन का कारण बताते हैं। वे
    कार्तिकेय को बताते हैं कि महेश्वर ने उन्हें भेजा है ताकि वे उन्हें ढूंढ सकें,
    क्योंकि ब्रह्मा, विष्णु और शिव सहित सभी देवता कैलाश पर एक महान उत्सव के लिए एकत्रित
    थे।
- id: kartikeya-acknowledges-krittikas
  type: story
  keywords:
  - kartikeya
  - krittikas
  - gratitude
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 4
  summary_en: Kartikeya acknowledges the Krittikas for nurturing him and expresses
    gratitude for their care. He considers them as his mothers, similar to how Parvati
    is his mother by dharma.
  summary_hi: कार्तिकेय कृत्तिकाओं को उनके पालन-पोषण के लिए धन्यवाद देते हैं और उनके
    देखभाल के लिए आभार व्यक्त करते हैं। वे उन्हें अपनी माताओं के रूप में मानते हैं,
    जैसे पार्वती उनकी धर्ममाता हैं।
- id: kartikeya-joins-shiva
  type: event
  keywords:
  - kartikeya
  - shiva
  - reunion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 4
  summary_en: Kartikeya decides to join Shiva and his attendants after receiving their
    invitation. He prepares to leave with them to meet the gods.
  summary_hi: कार्तिकेय शिव और उनके गणों के निमंत्रण के बाद उनके साथ जुड़ने का निर्णय
    लेते हैं। वे देवताओं से मिलने के लिए उनके साथ जाने की तैयारी करते हैं।
- id: kartikeya-departure-episode
  type: story
  keywords:
  - Kartikeya
  - Krittikas
  source:
    book: Shiv Puran
    sarga: Rudrasamhita (Kumarakhanda)
  summary_en: Kartikeya, feeling sorrowful, mounts a chariot sent by Parvati. The
    Krittikas, who raised him, express their grief and question his departure. Kartikeya
    consoles them with spiritual words and proceeds to his father's abode.
  summary_hi: कार्तिकेय दुखी मन से पार्वती द्वारा भेजे गए रथ पर सवार हो जाते हैं।
    कृत्तिकाएँ, जिन्होंने उनका पालन-पोषण किया, उनके प्रस्थान पर शोक व्यक्त करती हैं
    और प्रश्न करती हैं। कार्तिकेय उन्हें आध्यात्मिक वचनों से समझाते हैं और अपने पिता
    के घर की ओर प्रस्थान करते हैं।
- id: kartikeya-arrival-at-kailasa
  type: event
  keywords:
  - Kartikeya
  - Kailasa
  source:
    book: Shiv Puran
    sarga: Rudrasamhita (Kumarakhanda)
  summary_en: Kartikeya arrives at Mount Kailasa with Nandi and his attendants. The
    gods, sages, and celestial beings, including Brahma and Vishnu, gather to welcome
    him. A grand celebration ensues with music and dance.
  summary_hi: कार्तिकेय नंदी और अपने पार्षदों के साथ कैलास पर्वत पर पहुँचते हैं। देवता,
    ऋषि, और दिव्य प्राणी, ब्रह्मा और विष्णु सहित, उनका स्वागत करने के लिए एकत्र होते
    हैं। संगीत और नृत्य के साथ एक भव्य उत्सव होता है।
- id: kartikeya-meets-shiva-and-parvati
  type: story
  keywords:
  - Kartikeya
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudrasamhita (Kumarakhanda)
  summary_en: Upon seeing his parents, Shiva and Parvati, Kartikeya descends from
    his chariot and bows to them. Shiva, filled with affection, embraces his son,
    marking a joyous reunion.
  summary_hi: अपने माता-पिता, शिव और पार्वती को देखकर, कार्तिकेय रथ से उतरकर उन्हें
    प्रणाम करते हैं। शिव, प्रेम से भरे हुए, अपने पुत्र को गले लगाते हैं, जो एक आनंदमय
    पुनर्मिलन का प्रतीक है।
- id: kartikeya-birth-celebration
  type: event
  keywords:
  - Kartikeya
  - birth
  - celebration
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The birth of Kartikeya is celebrated with great joy and festivity. The
    gods and divine beings gather to honor the newborn, and Shiva and Parvati express
    their love and happiness for their son. The atmosphere is filled with music, dance,
    and the chanting of hymns.
  summary_hi: कार्तिकेय के जन्म का उत्सव बड़े हर्ष और उल्लास के साथ मनाया जाता है।
    देवता और दिव्य प्राणी नवजात का सम्मान करने के लिए एकत्र होते हैं, और शिव तथा पार्वती
    अपने पुत्र के प्रति अपना प्रेम और खुशी व्यक्त करते हैं। वातावरण संगीत, नृत्य और
    मंत्रोच्चारण से भरा होता है।
- id: kartikeya-receives-divine-weapons
  type: event
  keywords:
  - Kartikeya
  - divine weapons
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Kartikeya is bestowed with divine weapons and blessings by Lord Shiva
    and other gods. He receives a trident, bow, and other celestial arms, symbolizing
    his future role as a warrior and protector.
  summary_hi: कार्तिकेय को भगवान शिव और अन्य देवताओं द्वारा दिव्य अस्त्र और आशीर्वाद
    प्रदान किए जाते हैं। उन्हें त्रिशूल, धनुष और अन्य दिव्य शस्त्र प्राप्त होते हैं,
    जो उनके भविष्य के योद्धा और रक्षक के रूप में भूमिका का प्रतीक हैं।
- id: kartikeya-coronation
  type: event
  keywords:
  - Kartikeya
  - coronation
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Vishnu, with the help of other deities, performs the coronation of Kartikeya
    using water from all holy places. Kartikeya is adorned and celebrated with various
    rituals and festivities, and is granted the lordship of the universe by Vishnu.
  summary_hi: विष्णु ने अन्य देवताओं के साथ मिलकर कार्तिकेय का सभी तीर्थों के जल से
    अभिषेक किया। कार्तिकेय को सजाया गया और विभिन्न विधियों और उत्सवों के साथ उनका
    स्वागत किया गया, और विष्णु द्वारा उन्हें ब्रह्माण्ड का अधिपति बनाया गया।
- id: divine-gifts-to-kartikeya
  type: event
  keywords:
  - Kartikeya
  - divine gifts
  - gods
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: During the grand celebration, various gods and goddesses presented Kartikeya
    with divine gifts. Parvati granted him supreme power and immortality, while Lakshmi
    gave him divine wealth. Other deities offered their unique weapons and blessings.
  summary_hi: महान उत्सव के दौरान, विभिन्न देवताओं और देवियों ने कार्तिकेय को दिव्य
    उपहार दिए। पार्वती ने उन्हें परम ऐश्वर्य और अमरता का वरदान दिया, जबकि लक्ष्मी
    ने दिव्य संपत्ति प्रदान की। अन्य देवताओं ने अपने विशिष्ट अस्त्र और आशीर्वाद दिए।
- id: kartikeya-mission-to-defeat-taraka
  type: event
  keywords:
  - Kartikeya
  - Taraka
  - mission
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, led by Brahma and Vishnu, requested Shiva to send Kartikeya
    to defeat the demon Taraka. Shiva agreed, and Kartikeya was sent on the mission
    to bring peace by vanquishing Taraka.
  summary_hi: ब्रह्मा और विष्णु के नेतृत्व में देवताओं ने शिव से अनुरोध किया कि वे
    कार्तिकेय को राक्षस तारक को पराजित करने के लिए भेजें। शिव ने सहमति दी, और कार्तिकेय
    को तारक का वध कर शांति स्थापित करने के मिशन पर भेजा।
- id: kartikeya-battle-preparation
  type: event
  keywords:
  - Kartikeya
  - Tarakasura
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Shiva, upon hearing the plea of the gods, agrees to send his son Kartikeya
    to battle the demon Tarakasura. The gods, led by Brahma and Vishnu, prepare Kartikeya
    for the battle and set out from the mountain to confront the demon.
  summary_hi: शिव ने देवताओं की प्रार्थना सुनकर अपने पुत्र कार्तिकेय को राक्षस तारकासुर
    से युद्ध करने के लिए भेजने की सहमति दी। ब्रह्मा और विष्णु के नेतृत्व में देवताओं
    ने कार्तिकेय को युद्ध के लिए तैयार किया और पर्वत से राक्षस का सामना करने के लिए
    प्रस्थान किया।
- id: kartikeya-divine-city
  type: event
  keywords:
  - Kartikeya
  - Vishwakarma
  - divine city
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Vishwakarma, under the orders of Vishnu, constructs a beautiful and
    divine city near the mountain for Kartikeya. The city includes a magnificent throne
    for Kartikeya, symbolizing his divine authority and leadership.
  summary_hi: विष्णु के आदेश पर विश्वकर्मा ने पर्वत के निकट कार्तिकेय के लिए एक सुंदर
    और दिव्य नगर का निर्माण किया। इस नगर में कार्तिकेय के लिए एक भव्य सिंहासन भी शामिल
    था, जो उनके दिव्य अधिकार और नेतृत्व का प्रतीक था।
- id: kartikeya-brahmin-episode
  type: story
  keywords:
  - Kartikeya
  - Brahmin
  - yajna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: A Brahmin named Narada, who was conducting a yajna, approaches Kartikeya
    for help after the sacrificial goat escapes. Kartikeya, known for his compassion
    and divine authority, listens to the Brahmin's plea and is expected to assist
    in resolving the issue.
  summary_hi: नारद नामक एक ब्राह्मण, जो यज्ञ कर रहा था, कार्तिकेय के पास सहायता के
    लिए आता है जब यज्ञ का बकरा भाग जाता है। कार्तिकेय, जो अपनी करुणा और दिव्य अधिकार
    के लिए जाने जाते हैं, ब्राह्मण की प्रार्थना सुनते हैं और समस्या को हल करने में
    सहायता करने की उम्मीद की जाती है।
- id: kartikeya-and-the-sacrificial-goat
  type: story
  keywords:
  - Kartikeya
  - sacrificial goat
  - Narada
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 6
  summary_en: In this episode, Kartikeya listens to the plea of a Brahmin, who requests
    the return of his sacrificial goat. Kartikeya, recognizing the goat as unworthy
    of sacrifice, instructs the Brahmin to return home, assuring him that his sacrifice
    is complete through divine grace. The Brahmin, pleased with Kartikeya's words,
    returns home after receiving blessings.
  summary_hi: इस प्रकरण में, कार्तिकेय एक ब्राह्मण की विनती सुनते हैं, जो अपने यज्ञ
    के बकरे की वापसी की मांग करता है। कार्तिकेय, बकरे को वध के योग्य न मानते हुए,
    ब्राह्मण को घर लौटने का निर्देश देते हैं और उसे आश्वस्त करते हैं कि उसकी यज्ञ
    उनकी कृपा से पूर्ण हो गया है। ब्राह्मण, कार्तिकेय के वचनों से प्रसन्न होकर, आशीर्वाद
    प्राप्त कर अपने घर लौट जाता है।
- id: tarakasura-battle-preparation
  type: event
  keywords:
  - Tarakasura
  - battle
  - Devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 7
  summary_en: The Devas, led by Kartikeya, prepare to confront the demon Tarakasura.
    Inspired by Shiva's energy, they are filled with confidence and enthusiasm. Meanwhile,
    Tarakasura, upon hearing of the Devas' preparations, gathers his forces to engage
    in battle against them.
  summary_hi: देवता, कार्तिकेय के नेतृत्व में, राक्षस तारकासुर का सामना करने की तैयारी
    करते हैं। शिव के तेज से प्रेरित होकर, वे आत्मविश्वास और उत्साह से भर जाते हैं।
    इस बीच, तारकासुर, देवताओं की तैयारियों के बारे में सुनकर, उनके खिलाफ युद्ध करने
    के लिए अपनी सेना को एकत्र करता है।
- id: tarakasura-battle-episode
  type: story
  keywords:
  - Tarakasura
  - Devas
  - Battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: The Devas, led by Kartikeya, prepare for battle against the demon Tarakasura.
    Encouraged by a divine voice, they gather their forces and confront Tarakasura's
    army. The battle is fierce, with both sides displaying great valor and strength.
  summary_hi: देवगण, कार्तिकेय के नेतृत्व में, राक्षस तारकासुर के खिलाफ युद्ध की तैयारी
    करते हैं। एक दिव्य आवाज से प्रेरित होकर, वे अपनी सेनाओं को इकट्ठा करते हैं और
    तारकासुर की सेना का सामना करते हैं। युद्ध भयंकर होता है, जिसमें दोनों पक्ष महान
    वीरता और शक्ति का प्रदर्शन करते हैं।
- id: devas-danavas-battle
  type: event
  keywords:
  - devas
  - danavas
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: A great battle ensues between the devas and the danavas. Both sides
    engage in a righteous fight, with various gods and demons pairing off against
    each other. The battlefield is filled with the sounds of war drums and the roars
    of warriors.
  summary_hi: देवताओं और दानवों के बीच एक महान युद्ध होता है। दोनों पक्ष धर्मपूर्वक
    युद्ध में संलग्न होते हैं, विभिन्न देवता और दानव एक-दूसरे के खिलाफ लड़ते हैं।
    युद्धभूमि युद्ध के नगाड़ों और योद्धाओं की गर्जनाओं से गूंज उठती है।
- id: tarakasura-battle
  type: story
  keywords:
  - Tarakasura
  - Battle
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: Tarakasura engaged in a fierce battle with the gods, where he was eventually
    defeated by Lord Vishnu. This battle signifies the eternal struggle between good
    and evil.
  summary_hi: तारकासुर ने देवताओं के साथ एक भयंकर युद्ध किया, जिसमें अंततः भगवान विष्णु
    ने उसे पराजित किया। यह युद्ध अच्छाई और बुराई के बीच के शाश्वत संघर्ष को दर्शाता
    है।
- id: tarakasura-battle-with-devas
  type: story
  keywords:
  - Tarakasura
  - Indra
  - battle
  source:
    book: Shiv Puran
    sarga: अथाष्टमोऽध्यायः
  summary_en: The passage describes a fierce battle between the demon Tarakasura and
    the gods, including Indra. Tarakasura uses his immense power to defeat Indra,
    causing him to fall from his elephant and become unconscious. The demon army,
    led by Tarakasura, overpowers the gods, forcing them to retreat.
  summary_hi: यह अंश तारकासुर और देवताओं के बीच भयंकर युद्ध का वर्णन करता है, जिसमें
    इन्द्र भी शामिल हैं। तारकासुर अपनी अपार शक्ति का उपयोग करके इन्द्र को पराजित करता
    है, जिससे वह अपने हाथी से गिरकर मूर्छित हो जाते हैं। तारकासुर के नेतृत्व में दैत्य
    सेना देवताओं को पराजित कर देती है, जिससे वे पीछे हटने को मजबूर हो जाते हैं।
- id: virabhadra-confronts-tarakasura
  type: story
  keywords:
  - Virabhadra
  - Tarakasura
  - confrontation
  source:
    book: Shiv Puran
    sarga: अथाष्टमोऽध्यायः
  summary_en: Virabhadra, born from Shiva's anger, confronts Tarakasura on the battlefield.
    Despite Tarakasura's initial success, Virabhadra challenges him with great valor,
    leading to a fierce duel between the two warriors. The battle is intense, with
    both sides using various weapons against each other.
  summary_hi: शिव के क्रोध से उत्पन्न वीरभद्र युद्धभूमि में तारकासुर का सामना करते
    हैं। तारकासुर की प्रारंभिक सफलता के बावजूद, वीरभद्र उन्हें महान वीरता के साथ चुनौती
    देते हैं, जिससे दोनों योद्धाओं के बीच भयंकर द्वंद्व होता है। यह युद्ध अत्यंत तीव्र
    होता है, जिसमें दोनों पक्ष विभिन्न हथियारों का उपयोग करते हैं।
- id: battle-of-veerbhadra-and-tarakasura
  type: story
  keywords:
  - Veerbhadra
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: A fierce battle takes place between Veerbhadra, a powerful warrior and
    devotee of Shiva, and the demon Tarakasura. Despite Narada's advice to withdraw,
    Veerbhadra is determined to defeat Tarakasura. The battle is intense, with Veerbhadra
    leading Shiva's ganas against the demon's forces. Ultimately, Veerbhadra's valor
    and the divine intervention of Kartikeya lead to the retreat of the demons.
  summary_hi: वीरभद्र, जो शिव के एक शक्तिशाली योद्धा और भक्त हैं, और राक्षस तारकासुर
    के बीच एक भयंकर युद्ध होता है। नारद के युद्ध से हटने की सलाह के बावजूद, वीरभद्र
    तारकासुर को हराने के लिए दृढ़ हैं। यह युद्ध तीव्र होता है, जिसमें वीरभद्र शिव
    के गणों का नेतृत्व करते हैं और राक्षसों की सेना के खिलाफ लड़ते हैं। अंततः, वीरभद्र
    की वीरता और कार्तिकेय के दिव्य हस्तक्षेप से राक्षस पीछे हट जाते हैं।
- id: vishnu-tarakasura-battle
  type: story
  keywords:
  - Vishnu
  - Tarakasura
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 8
  summary_en: A fierce battle takes place between Lord Vishnu and the demon Tarakasura.
    Despite Vishnu's powerful attacks with his Sudarshan Chakra and other weapons,
    Tarakasura proves to be a formidable opponent. The demon manages to counter Vishnu's
    assaults and even causes him to fall unconscious. However, Vishnu recovers and
    continues the fight with renewed vigor.
  summary_hi: भगवान विष्णु और दानव तारकासुर के बीच एक भयंकर युद्ध होता है। विष्णु
    के सुदर्शन चक्र और अन्य अस्त्रों के शक्तिशाली प्रहारों के बावजूद, तारकासुर एक
    दुर्जेय प्रतिद्वंद्वी साबित होता है। दानव विष्णु के हमलों का सामना करता है और
    उन्हें मूर्छित भी कर देता है। हालांकि, विष्णु चेतना प्राप्त कर पुनः जोश के साथ
    युद्ध जारी रखते हैं।
- id: brahma-instructs-kartikeya
  type: story
  keywords:
  - Brahma
  - Kartikeya
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 9
  summary_en: Lord Brahma instructs Kartikeya, the son of Shiva and Parvati, to defeat
    the demon Tarakasura. Brahma explains that Tarakasura cannot be killed by Vishnu
    due to a boon and that only Kartikeya can accomplish this task. He urges Kartikeya
    to accept this responsibility and protect the gods.
  summary_hi: भगवान ब्रह्मा कार्तिकेय, जो शिव और पार्वती के पुत्र हैं, को दानव तारकासुर
    को पराजित करने का निर्देश देते हैं। ब्रह्मा बताते हैं कि तारकासुर को विष्णु नहीं
    मार सकते क्योंकि उसे वरदान प्राप्त है और केवल कार्तिकेय ही इस कार्य को पूरा कर
    सकते हैं। वे कार्तिकेय से इस जिम्मेदारी को स्वीकार करने और देवताओं की रक्षा करने
    का आग्रह करते हैं।
- id: kartikeya-battle-with-tarakasura
  type: event
  keywords:
  - Kartikeya
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 10
  summary_en: Kartikeya, the son of Shiva, engages in a fierce battle with the demon
    Tarakasura. The battle is intense and terrifying, with both warriors wielding
    powerful weapons. Ultimately, Kartikeya defeats Tarakasura, leading to the victory
    of the gods over the demon forces.
  summary_hi: शिव के पुत्र कार्तिकेय दैत्य तारकासुर के साथ एक भयंकर युद्ध में संलग्न
    होते हैं। यह युद्ध अत्यंत भीषण और भयावह होता है, जिसमें दोनों योद्धा शक्तिशाली
    अस्त्रों का प्रयोग करते हैं। अंततः, कार्तिकेय तारकासुर को पराजित करते हैं, जिससे
    देवताओं को दैत्य सेना पर विजय प्राप्त होती है।
- id: rama-avatar-tataka-vadha
  type: story
  keywords:
  - Rama
  - Tataka
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: In the Ramavatar, Lord Rama killed the demoness Tataka. This act is
    part of his divine mission to rid the world of evil.
  summary_hi: रामावतार में भगवान राम ने राक्षसी ताड़का का वध किया। यह उनके दिव्य मिशन
    का हिस्सा था, जिसमें उन्होंने संसार को बुराई से मुक्त किया।
- id: parashurama-avatar-mother-decapitation
  type: story
  keywords:
  - Parashurama
  - Mother
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: In the Parashurama avatar, Parashurama decapitated his own mother as
    part of a test of obedience. This story highlights the extreme actions taken in
    adherence to dharma.
  summary_hi: परशुराम अवतार में, परशुराम ने आज्ञा पालन की परीक्षा के रूप में अपनी
    ही माता का सिर काट दिया। यह कहानी धर्म के पालन में उठाए गए अत्यधिक कदमों को दर्शाती
    है।
- id: krishna-avatar-multiple-marriages
  type: story
  keywords:
  - Krishna
  - Marriages
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: In the Krishna avatar, Lord Krishna engaged in multiple marriages, which
    is seen as a departure from traditional Vedic practices. This episode reflects
    the complexities of dharma in different contexts.
  summary_hi: कृष्ण अवतार में, भगवान कृष्ण ने कई विवाह किए, जो पारंपरिक वैदिक प्रथाओं
    से एक विचलन के रूप में देखा जाता है। यह प्रकरण विभिन्न संदर्भों में धर्म की जटिलताओं
    को दर्शाता है।
- id: buddha-avatar-vedic-criticism
  type: story
  keywords:
  - Buddha
  - Vedic Criticism
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: In the Buddha avatar, the Buddha criticized Vedic practices and established
    a non-theistic philosophy. This avatar represents a significant shift in spiritual
    thought and practice.
  summary_hi: बुद्ध अवतार में, बुद्ध ने वैदिक प्रथाओं की आलोचना की और एक नास्तिक दर्शन
    की स्थापना की। यह अवतार आध्यात्मिक विचार और अभ्यास में एक महत्वपूर्ण बदलाव का
    प्रतिनिधित्व करता है।
- id: indra-vritra-vadha
  type: story
  keywords:
  - Indra
  - Vritra
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Kumarakhanda
  summary_en: Indra, in his quest for power, killed Vritra, a Brahmin boy, which is
    considered a sinful act. This episode highlights the moral dilemmas faced by the
    gods.
  summary_hi: इंद्र ने शक्ति की खोज में ब्राह्मण बालक वृत्र का वध किया, जिसे पापपूर्ण
    कार्य माना जाता है। यह प्रकरण देवताओं द्वारा सामना की गई नैतिक दुविधाओं को उजागर
    करता है।
- id: tarakasura-battle-with-veerabhadra
  type: event
  keywords:
  - Tarakasura
  - Veerabhadra
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 9
  summary_en: In a fierce battle, the demon king Tarakasura attacks Lord Vishnu with
    a weapon called Shakti, causing Vishnu to fall to the ground. Veerabhadra arrives
    at the scene and engages in combat with Tarakasura, striking him with a trident.
    Despite being struck, Tarakasura rises again and retaliates, causing Veerabhadra
    to fall unconscious temporarily.
  summary_hi: एक भयंकर युद्ध में, दैत्यराज तारकासुर भगवान विष्णु पर शक्ति नामक अस्त्र
    से प्रहार करता है, जिससे विष्णु पृथ्वी पर गिर जाते हैं। वीरभद्र वहां पहुंचते हैं
    और तारकासुर से युद्ध करते हैं, उन्हें त्रिशूल से प्रहार करते हैं। प्रहार के बावजूद,
    तारकासुर फिर से उठ खड़ा होता है और प्रतिकार करता है, जिससे वीरभद्र क्षणिक रूप
    से मूर्छित हो जाते हैं।
- id: kartikeya-tarakasura-battle
  type: story
  keywords:
  - Kartikeya
  - Tarakasura
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Kartikeya, the son of Shiva, engages in a fierce battle with the demon
    Tarakasura. The gods and sages cheer for Kartikeya as he prepares to fight. Despite
    being struck by Tarakasura's weapon, Kartikeya recovers and ultimately defeats
    the demon with his own weapon, bringing peace to the heavens.
  summary_hi: शिव के पुत्र कार्तिकेय और दानव तारकासुर के बीच एक भयंकर युद्ध होता है।
    देवता और ऋषि कार्तिकेय का उत्साहवर्धन करते हैं। तारकासुर के अस्त्र से घायल होने
    के बावजूद, कार्तिकेय पुनः चेतना प्राप्त करते हैं और अंततः अपने अस्त्र से दानव
    का वध करते हैं, जिससे स्वर्ग में शांति स्थापित होती है।
- id: kartikeya-slaying-tarakasura
  type: story
  keywords:
  - Kartikeya
  - Tarakasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: Kartikeya, the son of Shiva and Parvati, reassures the mountains and
    other divine beings not to worry as he prepares to slay the demon Tarakasura.
    With a powerful weapon, Kartikeya defeats Tarakasura, causing the demon's army
    to flee or seek refuge. The victory brings peace and joy to the gods and the three
    worlds.
  summary_hi: कार्तिकेय, जो शिव और पार्वती के पुत्र हैं, पर्वतों और अन्य देवताओं को
    आश्वस्त करते हैं कि वे चिंता न करें क्योंकि वे राक्षस तारकासुर को मारने की तैयारी
    कर रहे हैं। एक शक्तिशाली हथियार के साथ, कार्तिकेय तारकासुर को पराजित करते हैं,
    जिससे राक्षस की सेना भाग जाती है या शरण मांगती है। इस विजय से देवताओं और तीनों
    लोकों में शांति और आनंद आता है।
- id: kartikeya-victory-celebration
  type: event
  keywords:
  - Kartikeya
  - victory
  - celebration
  source:
    book: Shiv Puran
    sarga: Kumar Khanda, Chapter 10
  summary_en: After Kartikeya's victory, all the gods and the three worlds rejoiced.
    Lord Shiva, along with Parvati and his attendants, arrived to celebrate. Parvati
    lovingly embraced her son Kartikeya, and the gods, sages, and celestial beings
    praised Shiva, Parvati, and Kartikeya. A grand celebration ensued with music,
    dance, and offerings.
  summary_hi: कार्तिकेय की विजय के बाद, सभी देवता और तीनों लोक आनंदित हो गए। भगवान
    शिव, पार्वती और उनके गणों के साथ उत्सव मनाने पहुंचे। पार्वती ने अपने पुत्र कार्तिकेय
    को प्रेमपूर्वक गोद में लिया, और देवताओं, ऋषियों और दिव्य प्राणियों ने शिव, पार्वती
    और कार्तिकेय की स्तुति की। एक भव्य उत्सव संगीत, नृत्य और अर्पण के साथ मनाया गया।
- id: kartikeya-and-krauncha
  type: story
  keywords:
  - Kartikeya
  - Krauncha
  - demon
  source:
    book: Shiv Puran
    sarga: Kumar Khanda, Chapter 11
  summary_en: Krauncha mountain, troubled by the demon Bana, sought refuge with Kartikeya.
    Krauncha praised Kartikeya and pleaded for protection. Kartikeya, pleased with
    Krauncha's devotion, used his divine power to destroy the demon Bana, assuring
    Krauncha of safety.
  summary_hi: क्रौंच पर्वत, बाण नामक राक्षस से पीड़ित होकर, कार्तिकेय की शरण में आया।
    क्रौंच ने कार्तिकेय की स्तुति की और सुरक्षा की याचना की। कार्तिकेय, क्रौंच की
    भक्ति से प्रसन्न होकर, अपनी दिव्य शक्ति से बाण राक्षस का नाश कर दिया और क्रौंच
    को सुरक्षा का आश्वासन दिया।
- id: skanda-establishes-lingas
  type: event
  keywords:
  - Skanda
  - Shiva Linga
  - establishment
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Skanda, also known as Kartikeya, established three Shiva Lingas named
    Pratijneshvara, Kapaleshvara, and Kumareshvara at a sacred site. These Lingas
    are said to grant all desires and provide liberation to devotees.
  summary_hi: स्कन्द, जिन्हें कार्तिकेय भी कहा जाता है, ने एक पवित्र स्थल पर प्रतिज्ञेश्वर,
    कपालेश्वर और कुमारेश्वर नामक तीन शिवलिंगों की स्थापना की। कहा जाता है कि ये लिंग
    सभी इच्छाओं को पूरा करते हैं और भक्तों को मुक्ति प्रदान करते हैं।
- id: kumuda-seeks-skanda-protection
  type: story
  keywords:
  - Kumuda
  - Skanda
  - protection
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Kumuda, the son of Shesha, seeks protection from Skanda against the
    demon Pralamba. Skanda, invoking the power of Shiva, destroys Pralamba with his
    divine weapon, granting Kumuda safety.
  summary_hi: शेष के पुत्र कुमुद, प्रलंब नामक राक्षस से सुरक्षा के लिए स्कन्द की शरण
    में आते हैं। स्कन्द, शिव की शक्ति का आह्वान कर, अपनी दिव्य शस्त्र से प्रलंब का
    नाश करते हैं और कुमुद को सुरक्षा प्रदान करते हैं।
- id: kartikeya-defeats-pralamba
  type: story
  keywords:
  - Kartikeya
  - Pralamba
  source:
    book: Shiv Puran
    sarga: '11'
  summary_en: Kartikeya, the son of Parvati, targets the demon Pralamba with his weapon,
    resulting in a great sound and the burning of the skies. The weapon destroys Pralamba
    and his ten thousand soldiers, and then returns to Kartikeya. After the victory,
    Kartikeya assures Kumuda, the son of Shesha, that the demon has been defeated
    and he can return home safely.
  summary_hi: कार्तिकेय, पार्वती के पुत्र, प्रलंब दानव को अपने शस्त्र से लक्ष्य बनाते
    हैं, जिससे महान ध्वनि होती है और आकाश जलने लगता है। यह शस्त्र प्रलंब और उसकी दस
    हजार सेनाओं को नष्ट कर देता है और फिर कार्तिकेय के पास लौट आता है। विजय के बाद,
    कार्तिकेय शेष के पुत्र कुमुद को आश्वस्त करते हैं कि दानव पराजित हो चुका है और
    वह सुरक्षित घर लौट सकता है।
- id: kartikeya-praised-by-gods
  type: event
  keywords:
  - Kartikeya
  - Gods
  source:
    book: Shiv Puran
    sarga: '12'
  summary_en: After the defeat of Tarakasura, the gods led by Vishnu praise Kartikeya
    for his victory. They express gratitude for his role in protecting them and request
    him to visit Kailasa to meet Shiva and Parvati. Kartikeya is pleased and grants
    boons to the mountains, ensuring they will be revered by sages and worshippers.
  summary_hi: तारकासुर की पराजय के बाद, विष्णु के नेतृत्व में देवता कार्तिकेय की विजय
    के लिए उनकी स्तुति करते हैं। वे उनकी रक्षा के लिए आभार व्यक्त करते हैं और उनसे
    कैलाश पर शिव और पार्वती से मिलने का अनुरोध करते हैं। कार्तिकेय प्रसन्न होते हैं
    और पर्वतों को वरदान देते हैं कि वे ऋषियों और उपासकों द्वारा पूजित होंगे।
- id: kartikeya-return-to-kailasa
  type: event
  keywords:
  - Kartikeya
  - Kailasa
  - Shiva
  source:
    book: Shiv Puran
    sarga: Kumar Khand
  summary_en: Kartikeya, after defeating Tarakasura, is advised by the gods to visit
    his parents, Parvati and Shiva, at Kailasa. Accompanied by the gods, he travels
    in a grand, decorated chariot. Upon reaching Kailasa, he is warmly welcomed by
    Shiva and Parvati, who express great joy at his return.
  summary_hi: तारकासुर का वध करने के बाद, कार्तिकेय को देवताओं द्वारा अपने माता-पिता,
    पार्वती और शिव से कैलास पर मिलने की सलाह दी जाती है। देवताओं के साथ, वह एक भव्य,
    सुसज्जित विमान में यात्रा करते हैं। कैलास पहुँचने पर, शिव और पार्वती द्वारा उनका
    गर्मजोशी से स्वागत किया जाता है, जो उनके लौटने पर अत्यंत प्रसन्न होते हैं।
- id: shiva-parvati-celebration
  type: event
  keywords:
  - Shiva
  - Parvati
  - Celebration
  source:
    book: Shiv Puran
    sarga: Kumar Khand
  summary_en: Upon Kartikeya's return to Kailasa, a grand celebration takes place
    in Shiva's abode. The atmosphere is filled with joyous chants and praises for
    Shiva and Parvati. The gods and sages, including Vishnu, offer their respects
    and sing hymns in honor of Shiva.
  summary_hi: कार्तिकेय के कैलास लौटने पर, शिव के निवास में एक भव्य उत्सव होता है।
    वातावरण शिव और पार्वती की जय-जयकार और स्तुतियों से गूंज उठता है। विष्णु सहित देवता
    और ऋषि शिव को अपनी श्रद्धांजलि अर्पित करते हैं और उनकी स्तुति में भजन गाते हैं।
- id: kartikeya-story
  type: story
  keywords:
  - Kartikeya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 12
  summary_en: The story describes how Vishnu and other deities, after receiving Shiva's
    permission, praised Parvati, Shiva, and Kartikeya, and then returned to their
    abodes. Shiva, along with Parvati and Kartikeya, happily resided on the mountain.
    The narrative of Kartikeya and Shiva is said to be divine and joy-giving.
  summary_hi: यह कहानी बताती है कि विष्णु और अन्य देवता, शिव की अनुमति प्राप्त करने
    के बाद, पार्वती, शिव और कार्तिकेय की प्रशंसा करते हैं और फिर अपने-अपने स्थानों
    पर लौट जाते हैं। शिव, पार्वती और कार्तिकेय के साथ खुशी-खुशी पर्वत पर निवास करते
    हैं। कार्तिकेय और शिव की कथा दिव्य और सुखदायक बताई गई है।
- id: ganesha-as-doorkeeper
  type: story
  keywords:
  - ganesha
  - doorkeeper
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: Parvati instructed her newly created son, Ganesha, to stand guard at
    her door and not allow anyone to enter without her permission. She gave him a
    strong staff and expressed her affection by kissing and embracing him. Ganesha,
    holding the staff, stood at the door to protect his mother, Parvati.
  summary_hi: पार्वती ने अपने नवसृजित पुत्र गणेश को अपने द्वार पर पहरा देने का आदेश
    दिया और बिना उनकी अनुमति के किसी को भी अंदर न आने देने को कहा। उन्होंने उसे एक
    मजबूत लाठी दी और उसे चूमकर और गले लगाकर अपना स्नेह व्यक्त किया। गणेश लाठी लेकर
    अपनी माता पार्वती की रक्षा के लिए द्वार पर खड़े हो गए।
- id: ganesha-guards-parvati-episode
  type: story
  keywords:
  - Ganesha
  - Shiva
  - Parvati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 13
  summary_en: Ganesha, acting as a guardian, prevents Shiva from entering Parvati's
    quarters as she is bathing. Unaware of Shiva's identity, Ganesha insists that
    Shiva cannot enter without Parvati's permission. This leads to a confrontation
    where Ganesha strikes Shiva with a staff, and Shiva, in turn, becomes angry and
    instructs his attendants to find out who Ganesha is.
  summary_hi: गणेश, पार्वती के स्नान के दौरान द्वारपाल के रूप में कार्य करते हुए,
    शिव को उनके कक्ष में प्रवेश करने से रोकते हैं। शिव की पहचान से अनजान गणेश जोर
    देते हैं कि शिव पार्वती की अनुमति के बिना प्रवेश नहीं कर सकते। इससे एक टकराव होता
    है जिसमें गणेश शिव पर लाठी से प्रहार करते हैं और शिव क्रोधित होकर अपने गणों को
    गणेश की पहचान जानने का आदेश देते हैं।
- id: shiva-attendants-confront-ganesha-episode
  type: story
  keywords:
  - Shiva
  - Ganesha
  - Attendants
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 14
  summary_en: Shiva's attendants, following Shiva's orders, confront Ganesha and question
    his identity and intentions. Despite being outnumbered, Ganesha fearlessly stands
    his ground and refuses to let them pass, leading to a tense standoff.
  summary_hi: शिव के गण, शिव के आदेश का पालन करते हुए, गणेश का सामना करते हैं और उनकी
    पहचान और इरादों के बारे में पूछताछ करते हैं। संख्या में अधिक होने के बावजूद, गणेश
    निडर होकर अपनी जगह पर डटे रहते हैं और उन्हें आगे बढ़ने से मना कर देते हैं, जिससे
    एक तनावपूर्ण स्थिति उत्पन्न होती है।
- id: ganesha-stands-guard
  type: story
  keywords:
  - Ganesha
  - Shiva
  - confrontation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Ganesha, the son of Parvati, stands guard at the entrance
    and refuses to let Shiva's attendants pass. Despite being warned by the attendants,
    Ganesha remains steadfast and fearless, leading to a confrontation. The attendants
    report the incident to Shiva, who questions their courage and instructs them to
    remove the new guard.
  summary_hi: इस प्रकरण में पार्वतीपुत्र गणेश द्वार पर पहरा देते हैं और शिव के गणों
    को अंदर जाने से रोकते हैं। गणों की चेतावनी के बावजूद गणेश निर्भीक और अडिग रहते
    हैं, जिससे टकराव होता है। गण यह घटना शिव को बताते हैं, जो उनके साहस पर प्रश्न
    करते हैं और उन्हें नए द्वारपाल को हटाने का आदेश देते हैं।
- id: ganesha-guarding-episode
  type: story
  keywords:
  - Ganesha
  - Parvati
  - Shiva's attendants
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Ganesha, the son of Parvati, is guarding the door when Shiva's attendants
    arrive and demand entry. A conflict arises as Ganesha refuses to let them in without
    permission. Parvati, upon hearing the commotion, sends her friend to investigate.
    The friend reports back, and Parvati is pleased with Ganesha's dedication to his
    duty.
  summary_hi: गणेश, पार्वती के पुत्र, द्वार की रक्षा कर रहे हैं जब शिव के गण आते हैं
    और प्रवेश की मांग करते हैं। गणेश के अनुमति के बिना उन्हें अंदर न जाने देने पर
    विवाद होता है। पार्वती, शोर सुनकर, अपनी सखी को जांच के लिए भेजती हैं। सखी वापस
    आकर रिपोर्ट करती है, और पार्वती गणेश की कर्तव्यनिष्ठा से प्रसन्न होती हैं।
- id: ganesha-guarding-parvati
  type: story
  keywords:
  - Ganesha
  - Parvati
  - Shiva's attendants
  source:
    book: Shiv Puran
    sarga: '1.16'
  summary_en: Parvati instructs her son Ganesha to guard her chamber and prevent anyone
    from entering. When Shiva's attendants try to enter, Ganesha stops them, leading
    to a confrontation. Parvati sends a message through her friend to Ganesha, encouraging
    him to stand firm. Ganesha, emboldened by his mother's words, prepares to face
    the attendants.
  summary_hi: पार्वती अपने पुत्र गणेश को अपने कक्ष की रक्षा करने और किसी को भी प्रवेश
    करने से रोकने का निर्देश देती हैं। जब शिव के गण प्रवेश करने का प्रयास करते हैं,
    तो गणेश उन्हें रोक देते हैं, जिससे एक टकराव होता है। पार्वती अपनी सखी के माध्यम
    से गणेश को संदेश भेजती हैं, जिससे गणेश को दृढ़ रहने के लिए प्रोत्साहन मिलता है।
    अपनी माता के शब्दों से प्रेरित होकर गणेश शिव के गणों का सामना करने के लिए तैयार
    हो जाते हैं।
- id: shiva-attendants-report
  type: event
  keywords:
  - Shiva
  - Ganesha
  - confrontation
  source:
    book: Shiv Puran
    sarga: '1.16'
  summary_en: After being stopped by Ganesha, Shiva's attendants return to Shiva and
    report the incident. They express their embarrassment and seek guidance from Shiva.
    Shiva, acknowledging the situation, advises his attendants on how to proceed,
    emphasizing the importance of maintaining their dignity and the need for a strategic
    approach.
  summary_hi: गणेश द्वारा रोके जाने के बाद, शिव के गण शिव के पास लौटकर इस घटना की
    रिपोर्ट करते हैं। वे अपनी शर्मिंदगी व्यक्त करते हैं और शिव से मार्गदर्शन मांगते
    हैं। शिव, स्थिति को स्वीकार करते हुए, अपने गणों को आगे बढ़ने की सलाह देते हैं,
    उनकी गरिमा बनाए रखने और एक रणनीतिक दृष्टिकोण की आवश्यकता पर जोर देते हैं।
- id: ganesha-shiva-gana-war
  type: event
  keywords:
  - Ganesha
  - Shiva
  - war
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 15
  summary_en: A fierce battle erupts between Ganesha and the Shiva Ganas. Ganesha,
    despite being a child, prepares to fight against the powerful Ganas of Shiva,
    showcasing his strength. The battle is intense, with Ganesha demonstrating his
    prowess by defeating many of the Ganas. The event draws the attention of the gods,
    who arrive to witness the conflict.
  summary_hi: गणेश और शिव गणों के बीच एक भयंकर युद्ध छिड़ जाता है। गणेश, जो एक बालक
    हैं, शिव के शक्तिशाली गणों के खिलाफ लड़ने के लिए तैयार होते हैं और अपनी शक्ति
    का प्रदर्शन करते हैं। युद्ध तीव्र होता है, जिसमें गणेश कई गणों को पराजित करते
    हैं। इस घटना को देखने के लिए देवता भी आते हैं।
- id: ganesha-battle-with-shivas-ganas
  type: story
  keywords:
  - Ganesha
  - Shiva's Ganas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: In this episode, Ganesha defends the entrance to Parvati's abode by
    fighting off Shiva's Ganas. Despite their efforts to restrain him, Ganesha uses
    his strength and a large club to defeat them, causing many to flee or be injured.
    His formidable presence is likened to the destructive force of time at the end
    of a cosmic cycle.
  summary_hi: इस प्रकरण में, गणेश पार्वती के निवास के द्वार की रक्षा करते हैं और शिव
    के गणों से लड़ते हैं। उनके प्रयासों के बावजूद, गणेश अपनी शक्ति और एक बड़े परिघ
    का उपयोग करके उन्हें पराजित करते हैं, जिससे कई लोग भाग जाते हैं या घायल हो जाते
    हैं। उनकी भयंकर उपस्थिति को कल्पांत के समय के विनाशकारी बल के समान बताया गया है।
- id: brahma-pleads-to-ganesha
  type: story
  keywords:
  - Brahma
  - Ganesha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: Brahma approaches Ganesha to request peace, acknowledging his own ignorance
    and seeking to avoid conflict. Despite his peaceful intentions, Ganesha, in his
    youthful vigor, remains ready for battle, causing Brahma to retreat hastily.
  summary_hi: ब्रह्मा गणेश के पास शांति की याचना करने जाते हैं, अपनी अज्ञानता को स्वीकार
    करते हुए और संघर्ष से बचने की कोशिश करते हैं। अपनी शांतिपूर्ण मंशा के बावजूद,
    गणेश अपनी युवा शक्ति में युद्ध के लिए तैयार रहते हैं, जिससे ब्रह्मा को जल्दी से
    पीछे हटना पड़ता है।
- id: shiva-orders-devas-to-subdue-ganesha
  type: story
  keywords:
  - Shiva
  - Devas
  - Ganesha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: Shiva, witnessing the chaos caused by Ganesha, instructs the Devas,
    including Indra and other celestial beings, to subdue Ganesha. Armed and ready,
    they attempt to confront Ganesha, but he remains undeterred, showcasing his immense
    power.
  summary_hi: गणेश द्वारा उत्पन्न अराजकता को देखकर शिव इंद्र और अन्य देवताओं सहित
    देवताओं को गणेश को वश में करने का आदेश देते हैं। सशस्त्र और तैयार, वे गणेश का
    सामना करने का प्रयास करते हैं, लेकिन गणेश अपनी अपार शक्ति का प्रदर्शन करते हुए
    अडिग रहते हैं।
- id: ganesha-guardian-episode
  type: story
  keywords:
  - Ganesha
  - guardian
  - Shiva
  source:
    book: Shiv Puran
    sarga: '5'
  summary_en: In this episode, a powerful child, Ganesha, stands guard with a staff,
    preventing entry into a house. He defeats Shiva's attendants and challenges the
    gods. Brahma approaches Ganesha, who becomes angry and attacks him. The gods,
    including Indra and Kartikeya, attempt to subdue Ganesha but fail, leading to
    chaos across the three worlds.
  summary_hi: इस प्रकरण में, एक शक्तिशाली बालक गणेश लाठी लेकर घर में प्रवेश को रोकता
    है। वह शिव के पार्षदों को पराजित करता है और देवताओं को चुनौती देता है। ब्रह्मा
    गणेश के पास जाते हैं, जो क्रोधित होकर उन पर हमला करते हैं। इंद्र और कार्तिकेय
    सहित देवता गणेश को वश में करने का प्रयास करते हैं लेकिन असफल रहते हैं, जिससे तीनों
    लोकों में हाहाकार मच जाता है।
- id: jagadamba-intervention-episode
  type: story
  keywords:
  - Jagadamba
  - intervention
  - divine powers
  source:
    book: Shiv Puran
    sarga: '5'
  summary_en: Goddess Jagadamba, witnessing the chaos caused by Ganesha, becomes enraged
    and creates two powerful entities to assist her forces. One takes a formidable
    form resembling a mountain, while the other is lightning-like with multiple arms,
    both consuming the weapons of the gods. This intervention showcases the divine
    power and the futility of the gods' efforts against Ganesha.
  summary_hi: गणेश द्वारा उत्पन्न अराजकता को देखकर देवी जगदम्बा क्रोधित हो जाती हैं
    और अपने गणों की सहायता के लिए दो शक्तिशाली शक्तियों का निर्माण करती हैं। एक पहाड़
    के समान प्रचंड रूप धारण करती है, जबकि दूसरी बिजली के समान रूप धारण करती है और
    देवताओं के सभी शस्त्रों को निगल जाती है। यह हस्तक्षेप देवी की दिव्य शक्ति और गणेश
    के खिलाफ देवताओं के प्रयासों की निष्फलता को दर्शाता है।
- id: ganesha-defends-entry
  type: event
  keywords:
  - Ganesha
  - Indra
  - battle
  source:
    book: Shiv Puran
    sarga: 51-66
  summary_en: Ganesha fiercely defends the entrance, causing panic among the gods
    and Shiva's attendants. Despite their combined efforts, they are unable to overcome
    Ganesha's might and are forced to retreat.
  summary_hi: गणेश ने प्रवेश द्वार की रक्षा करते हुए इन्द्र और शिवगणों को पराजित कर
    दिया, जिससे वे सभी व्याकुल हो गए। उनकी संयुक्त कोशिशों के बावजूद, वे गणेश की शक्ति
    को नहीं हरा सके और पीछे हटने पर मजबूर हो गए।
- id: kartikeya-stands-firm
  type: character
  keywords:
  - Kartikeya
  - bravery
  - battle
  source:
    book: Shiv Puran
    sarga: 58-59
  summary_en: Amidst the chaos, Kartikeya stands firm and does not flee. His bravery
    is highlighted as he confronts Ganesha, showcasing his valor in the face of adversity.
  summary_hi: अराजकता के बीच, कार्तिकेय डटे रहते हैं और भागते नहीं हैं। उनकी वीरता
    को उजागर किया गया है क्योंकि वे गणेश का सामना करते हैं, विपत्ति के समय में उनके
    साहस को दर्शाते हुए।
- id: apsaras-and-sages-witness-battle
  type: event
  keywords:
  - Apsaras
  - sages
  - battle
  source:
    book: Shiv Puran
    sarga: 54-56
  summary_en: Apsaras and sages gather to witness the extraordinary battle. They are
    amazed by the intensity of the conflict, which they have never seen before.
  summary_hi: अप्सराएँ और ऋषि इस अद्वितीय युद्ध को देखने के लिए एकत्रित होते हैं।
    वे इस संघर्ष की तीव्रता से चकित हैं, जिसे उन्होंने पहले कभी नहीं देखा।
- id: shiva-intervenes
  type: event
  keywords:
  - Shiva
  - intervention
  - battle
  source:
    book: Shiv Puran
    sarga: 65-66
  summary_en: Upon hearing the pleas of the gods, Shiva becomes enraged and decides
    to intervene in the battle. Accompanied by his attendants, he moves towards the
    battlefield.
  summary_hi: देवताओं की प्रार्थनाओं को सुनकर शिव क्रोधित हो जाते हैं और युद्ध में
    हस्तक्षेप करने का निर्णय लेते हैं। अपने गणों के साथ, वे युद्धक्षेत्र की ओर बढ़ते
    हैं।
- id: shiva-ganesha-battle
  type: story
  keywords:
  - Shiva
  - Ganesha
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 15
  summary_en: In this episode, Lord Shiva engages in a battle with Ganesha, who is
    depicted as a powerful and valiant warrior. Despite the combined efforts of the
    gods, Ganesha proves to be formidable. Ultimately, Shiva, with the help of Vishnu,
    devises a strategy to defeat Ganesha by using deceit, as Ganesha cannot be defeated
    by conventional means.
  summary_hi: इस प्रकरण में, भगवान शिव गणेश के साथ युद्ध में संलग्न होते हैं, जो एक
    शक्तिशाली और साहसी योद्धा के रूप में चित्रित हैं। देवताओं के संयुक्त प्रयासों
    के बावजूद, गणेश अत्यंत शक्तिशाली साबित होते हैं। अंततः, शिव, विष्णु की सहायता
    से, गणेश को छल से हराने की योजना बनाते हैं, क्योंकि गणेश को पारंपरिक तरीकों से
    हराया नहीं जा सकता।
- id: ganesha-battle-with-vishnu
  type: event
  keywords:
  - Ganesha
  - Vishnu
  source:
    book: Shiv Puran
    sarga: कुमारखण्ड
  summary_en: Ganesha, empowered by divine energy, engages in a fierce battle with
    Vishnu. Despite Vishnu's attempts to counter Ganesha's attacks using his chakra,
    Ganesha's strength and valor are unmatched. The battle continues with both warriors
    displaying their might.
  summary_hi: गणेश, दिव्य शक्ति से संपन्न होकर, विष्णु के साथ एक भयंकर युद्ध में संलग्न
    होते हैं। विष्णु के चक्र का उपयोग करके गणेश के हमलों का मुकाबला करने के प्रयासों
    के बावजूद, गणेश की शक्ति और वीरता अद्वितीय है। दोनों योद्धा अपनी शक्ति का प्रदर्शन
    करते हुए युद्ध जारी रखते हैं।
- id: ganesha-beheading-episode
  type: event
  keywords:
  - Ganesha
  - beheading
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 16
  summary_en: In a fierce battle, Lord Shiva beheads Ganesha with his trident. This
    act causes both the army of Ganas and the army of gods to become relieved. Narada
    informs Parvati about the incident, advising her not to abandon her pride.
  summary_hi: एक भयंकर युद्ध में, भगवान शिव ने अपने त्रिशूल से गणेश का सिर काट दिया।
    इस घटना से गणों की सेना और देवताओं की सेना दोनों निश्चिंत हो गईं। नारद ने पार्वती
    को इस घटना की जानकारी दी और उन्हें अपनी प्रतिष्ठा न छोड़ने की सलाह दी।
- id: parvati-anger-and-creation-of-shaktis
  type: event
  keywords:
  - Parvati
  - Shaktis
  - creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 17
  summary_en: Angered by the death of her son, Parvati creates numerous Shaktis to
    bring about destruction. These Shaktis, filled with rage, are instructed by Parvati
    to consume all beings, including gods and sages, without hesitation.
  summary_hi: अपने पुत्र की मृत्यु से क्रोधित होकर, पार्वती ने अनेक शक्तियों को उत्पन्न
    किया ताकि वे प्रलय ला सकें। ये शक्तियाँ, क्रोध से भरी हुई, पार्वती द्वारा सभी
    प्राणियों, देवताओं और ऋषियों को बिना किसी हिचकिचाहट के भक्षण करने का आदेश पाती
    हैं।
- id: resurrection-of-ganesha
  type: event
  keywords:
  - Ganesha
  - resurrection
  - elephant head
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 17
  summary_en: Following the destruction caused by Parvati's Shaktis, the gods and
    sages appease Parvati. As per Shiva's instructions, an elephant's head is brought
    and attached to Ganesha's body, reviving him.
  summary_hi: पार्वती की शक्तियों द्वारा लाए गए विनाश के बाद, देवता और ऋषि पार्वती
    को प्रसन्न करते हैं। शिव के निर्देशानुसार, एक हाथी का सिर लाया जाता है और गणेश
    के शरीर से जोड़ा जाता है, जिससे गणेश पुनर्जीवित हो जाते हैं।
- id: parvati-anger-destruction
  type: story
  keywords:
  - Parvati
  - destruction
  - divine-fury
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a fit of rage, Parvati's powers began to destroy the gods and other
    celestial beings. The scene was reminiscent of fire consuming dry grass, as her
    energies wreaked havoc. Witnessing this, the gods and sages feared an untimely
    apocalypse and were left in despair, contemplating their next move.
  summary_hi: पार्वती के क्रोध में उनकी शक्तियाँ देवताओं और अन्य दिव्य प्राणियों का
    संहार करने लगीं। यह दृश्य अग्नि के तृणों को भस्म करने जैसा था, क्योंकि उनकी शक्तियाँ
    विनाश कर रही थीं। यह देखकर देवता और ऋषि भयभीत हो गए और एक अकाल प्रलय की आशंका
    में पड़ गए।
- id: chandika-appeasement-episode
  type: story
  keywords:
  - Chandika
  - appeasement
  - Rishis
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: The Rishis, along with Brahma and Vishnu, plead with the goddess Chandika
    to calm her anger and restore peace. Chandika, moved by their pleas, agrees to
    their request on the condition that her son be revived and made the foremost deity
    among them.
  summary_hi: ऋषि, ब्रह्मा और विष्णु के साथ, देवी चंडिका से उनकी क्रोध को शांत करने
    और शांति बहाल करने की प्रार्थना करते हैं। चंडिका, उनकी प्रार्थनाओं से प्रभावित
    होकर, इस शर्त पर उनकी मांग मान लेती हैं कि उनका पुत्र पुनर्जीवित हो और उनके बीच
    प्रथम पूज्य देवता बने।
- id: ganesha-revival-episode
  type: story
  keywords:
  - Ganesha
  - revival
  - elephant head
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: Following Shiva's instructions, the gods find an elephant with a single
    tusk and attach its head to the body of Ganesha, reviving him. Ganesha is brought
    back to life with the touch of sacred water, and all the gods rejoice at his revival.
  summary_hi: शिव के निर्देशों का पालन करते हुए, देवता एक दाँत वाले हाथी को खोजते
    हैं और उसके सिर को गणेश के शरीर से जोड़ देते हैं, जिससे गणेश पुनर्जीवित हो जाते
    हैं। पवित्र जल के स्पर्श से गणेश को जीवन मिलता है, और सभी देवता उनके पुनर्जीवित
    होने पर आनंदित होते हैं।
- id: ganesha-revival-story
  type: story
  keywords:
  - ganesha
  - revival
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 17
  summary_en: After being revived by the touch of sacred water and Shiva's will, Ganesha,
    the son of Parvati, awakens and is described as a beautiful and radiant child.
    The gods and Parvati are overjoyed at his revival. Parvati showers Ganesha with
    love, gifts, and blessings, declaring that he will be worshipped first among all
    gods and will remain free from sorrow.
  summary_hi: पवित्र जल और शिव की इच्छा से पुनर्जीवित होने के बाद, गणेश, पार्वती के
    पुत्र, जागते हैं और उन्हें एक सुंदर और तेजस्वी बालक के रूप में वर्णित किया जाता
    है। देवता और पार्वती उनके पुनर्जीवन पर अत्यंत प्रसन्न होते हैं। पार्वती गणेश पर
    प्रेम, उपहार और आशीर्वादों की वर्षा करती हैं, यह घोषणा करते हुए कि उन्हें सभी
    देवताओं में पहले पूजा जाएगा और वे सदा दुःख से मुक्त रहेंगे।
- id: ganesha-chief-of-ganas
  type: event
  keywords:
  - ganesha
  - chief
  - ganas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 17
  summary_en: Upon Ganesha's revival, the gods appoint him as the chief of the Ganas.
    Parvati is delighted to see her son honored in such a way and embraces him with
    love. This event marks Ganesha's significant role among the divine beings.
  summary_hi: गणेश के पुनर्जीवन के बाद, देवता उन्हें गणों का अध्यक्ष नियुक्त करते
    हैं। पार्वती अपने पुत्र को इस प्रकार सम्मानित होते देखकर अत्यंत प्रसन्न होती हैं
    और उन्हें प्रेमपूर्वक गले लगाती हैं। यह घटना गणेश के दिव्य प्राणियों में महत्वपूर्ण
    भूमिका को चिह्नित करती है।
- id: ganesha-blessings-and-worship
  type: practice
  keywords:
  - ganesha
  - blessings
  - worship
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 17
  summary_en: Parvati blesses Ganesha, stating that he will be worshipped first among
    all deities and will always be free from sorrow. She instructs that Ganesha should
    be worshipped with offerings such as sindoor, flowers, sandalwood, and sweets,
    ensuring the removal of obstacles for devotees.
  summary_hi: पार्वती गणेश को आशीर्वाद देती हैं, यह कहते हुए कि उन्हें सभी देवताओं
    में पहले पूजा जाएगा और वे सदा दुःख से मुक्त रहेंगे। वह निर्देश देती हैं कि गणेश
    की पूजा सिंदूर, फूल, चंदन और मिठाई जैसे अर्पणों के साथ की जानी चाहिए, जिससे भक्तों
    के लिए बाधाओं का निवारण सुनिश्चित हो सके।
- id: ganesha-worship-establishment
  type: story
  keywords:
  - Ganesha
  - worship
  - deities
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda
  summary_en: In this episode, Ganesha is established as a deity to be worshipped
    before all others. After Ganesha apologizes for any offenses, Brahma, Vishnu,
    and Shiva grant him the boon that he will be worshipped first among the gods.
    This establishes Ganesha as the remover of obstacles and the granter of all desires.
  summary_hi: इस प्रकरण में गणेश को अन्य सभी देवताओं से पहले पूजनीय देवता के रूप में
    स्थापित किया गया है। गणेश द्वारा किसी भी अपराध के लिए क्षमा मांगने के बाद, ब्रह्मा,
    विष्णु और शिव उन्हें यह वरदान देते हैं कि वे देवताओं में सबसे पहले पूजे जाएंगे।
    इससे गणेश को विघ्नहर्ता और सभी इच्छाओं को पूरा करने वाला देवता स्थापित किया जाता
    है।
- id: ganesha-blessings-story
  type: story
  keywords:
  - Ganesha
  - blessings
  - Shiva
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Lord Shiva, pleased with Ganesha, grants him numerous boons that ensure
    his happiness and prosperity. Shiva declares Ganesha as the remover of obstacles
    and the leader of all his attendants, making him worthy of worship by all.
  summary_hi: भगवान शिव गणेश से प्रसन्न होकर उन्हें अनेक वरदान देते हैं, जो उनकी खुशी
    और समृद्धि सुनिश्चित करते हैं। शिव गणेश को विघ्नों का नाशक और अपने सभी गणों का
    अध्यक्ष घोषित करते हैं, जिससे वे सभी के पूजनीय बन जाते हैं।
- id: ganesha-chaturthi-practice
  type: practice
  keywords:
  - Ganesha Chaturthi
  - vrat
  - worship
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Ganesha Chaturthi is celebrated on the fourth day of the dark fortnight
    in the month of Bhadrapada. Devotees are advised to perform a special vrat (fast)
    and worship Ganesha on this day to attain various siddhis (spiritual powers).
  summary_hi: गणेश चतुर्थी भाद्रपद मास के कृष्ण पक्ष की चतुर्थी को मनाई जाती है। भक्तों
    को इस दिन विशेष व्रत (उपवास) करने और गणेश की पूजा करने की सलाह दी जाती है ताकि
    वे विभिन्न सिद्धियों को प्राप्त कर सकें।
- id: ganesha-installation-celebration
  type: event
  keywords:
  - ganesha
  - celebration
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Following the installation of Ganesha, the entire world became joyful.
    The gods played drums, apsaras danced, and flowers rained down from the sky. This
    event marked a period of happiness and the removal of all sorrows.
  summary_hi: गणेश की स्थापना के बाद, पूरा जगत आनंदित हो गया। देवताओं ने ढोल बजाए,
    अप्सराएँ नाचने लगीं, और आकाश से पुष्पवृष्टि होने लगी। इस घटना ने एक सुखद समय की
    शुरुआत की और सभी दुखों का नाश कर दिया।
- id: parvati-shiva-reconciliation
  type: story
  keywords:
  - parvati
  - shiva
  - reconciliation
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: After Parvati's anger subsided, Shiva returned to her side as before.
    Together, they engaged in various activities for the welfare of the world, demonstrating
    their eternal dedication to their devotees.
  summary_hi: पार्वती का क्रोध शांत होने के बाद, शिव फिर से उनके पास लौट आए। उन्होंने
    मिलकर लोक कल्याण के लिए विभिन्न कार्य किए, जो उनके भक्तों के प्रति उनकी अनंत निष्ठा
    को दर्शाता है।
- id: ganesha-blessings
  type: concept
  keywords:
  - ganesha
  - blessings
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Listening to the auspicious story of Ganesha brings various blessings.
    It is believed that the childless gain children, the poor gain wealth, and those
    desiring a spouse or progeny achieve their wishes. The story is said to remove
    sorrow and bring prosperity.
  summary_hi: गणेश की शुभ कथा सुनने से विभिन्न आशीर्वाद प्राप्त होते हैं। माना जाता
    है कि निःसंतान को संतान, निर्धन को धन, और जो पत्नी या संतान की इच्छा रखते हैं,
    उन्हें उनकी इच्छाएँ प्राप्त होती हैं। यह कथा दुखों को दूर करती है और समृद्धि लाती
    है।
- id: ganesha-first-marriage
  type: story
  keywords:
  - ganesha
  - marriage
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Ganesha's first marriage was approved by Shiva and Parvati after Ganesha
    cleverly circled them, symbolizing the universe, instead of physically circling
    the Earth. This act demonstrated his wisdom and devotion.
  summary_hi: गणेश का पहला विवाह शिव और पार्वती द्वारा तब स्वीकृत हुआ जब गणेश ने पृथ्वी
    की परिक्रमा करने के बजाय उन्हें, जो ब्रह्मांड का प्रतीक हैं, परिक्रमा की। इस कार्य
    ने उनकी बुद्धिमत्ता और भक्ति को दर्शाया।
- id: shiva-parvati-discuss-sons-marriage
  type: story
  keywords:
  - Shiva
  - Parvati
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva and Parvati, in a moment of privacy, discuss the marriage of their
    sons, Kartikeya and Ganesha. They ponder how to arrange a suitable marriage for
    both, as they are equally dear to them.
  summary_hi: शिव और पार्वती एकांत में अपने पुत्रों, कार्तिकेय और गणेश के विवाह पर
    चर्चा करते हैं। वे सोचते हैं कि दोनों के लिए उपयुक्त विवाह कैसे किया जाए, क्योंकि
    वे दोनों उनके लिए समान रूप से प्रिय हैं।
- id: kartikeya-ganesha-marriage-contest
  type: story
  keywords:
  - Kartikeya
  - Ganesha
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Upon learning of their parents' wishes, Kartikeya and Ganesha become
    eager to marry. They engage in a friendly competition to determine who will marry
    first, with the condition that whoever circles the earth first will have the first
    marriage.
  summary_hi: अपने माता-पिता की इच्छाओं को जानकर, कार्तिकेय और गणेश विवाह के लिए उत्सुक
    हो जाते हैं। वे यह तय करने के लिए एक मैत्रीपूर्ण प्रतियोगिता में शामिल होते हैं
    कि पहले विवाह कौन करेगा, इस शर्त के साथ कि जो पहले पृथ्वी का चक्कर लगाएगा, उसका
    पहले विवाह होगा।
- id: ganesha-circumvents-parents
  type: story
  keywords:
  - Ganesha
  - wisdom
  - marriage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Instead of physically circling the earth, Ganesha uses his wisdom. He
    circumvents his parents, Shiva and Parvati, symbolically representing the universe,
    thus winning the contest and securing his marriage first.
  summary_hi: गणेश अपनी बुद्धिमत्ता का उपयोग करते हुए पृथ्वी का शारीरिक रूप से चक्कर
    लगाने के बजाय अपने माता-पिता, शिव और पार्वती, जो ब्रह्मांड का प्रतीक हैं, का चक्कर
    लगाते हैं। इस प्रकार, वह प्रतियोगिता जीतकर पहले विवाह सुनिश्चित करते हैं।
- id: ganesha-circumambulation-story
  type: story
  keywords:
  - Ganesha
  - circumambulation
  - wisdom
  source:
    book: Shiv Puran
    sarga: Rudra Samhita (Kumar Khanda)
  summary_en: In a contest to determine who would marry first, Ganesha and Kartikeya
    were tasked with circumambulating the earth. While Kartikeya set off on the journey,
    Ganesha, using his wisdom, circumambulated his parents, Shiva and Parvati, symbolically
    considering them as the universe. This act demonstrated his intelligence and devotion,
    leading to his marriage being arranged first.
  summary_hi: गणेश और कार्तिकेय के बीच यह तय करने के लिए कि कौन पहले विवाह करेगा,
    उन्हें पृथ्वी की परिक्रमा करने का कार्य सौंपा गया। जबकि कार्तिकेय यात्रा पर निकल
    पड़े, गणेश ने अपनी बुद्धिमत्ता का उपयोग करते हुए अपने माता-पिता, शिव और पार्वती
    की परिक्रमा की, उन्हें प्रतीकात्मक रूप से ब्रह्मांड मानते हुए। इस कार्य ने उनकी
    बुद्धिमत्ता और भक्ति को प्रदर्शित किया, जिससे उनका विवाह पहले तय हुआ।
- id: ganesha-earth-circumambulation-story
  type: story
  keywords:
  - Ganesha
  - circumambulation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 19
  summary_en: Ganesha narrates how he worshipped his parents, Shiva and Parvati, and
    circumambulated them, which is considered equivalent to circumambulating the Earth.
    This act is praised in the scriptures as it signifies the importance of parental
    worship.
  summary_hi: गणेशजी बताते हैं कि उन्होंने अपने माता-पिता, शिव और पार्वती की पूजा
    की और उनकी परिक्रमा की, जो पृथ्वी की परिक्रमा के समान मानी जाती है। इस कार्य की
    शास्त्रों में प्रशंसा की गई है क्योंकि यह माता-पिता की पूजा के महत्व को दर्शाता
    है।
- id: parental-worship-concept
  type: concept
  keywords:
  - parental worship
  - dharma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 19
  summary_en: The concept of parental worship is emphasized, stating that worshipping
    and circumambulating one's parents yields the same merit as visiting holy places.
    It highlights the significance of respecting and honoring one's parents as a primary
    duty.
  summary_hi: माता-पिता की पूजा के महत्व को रेखांकित किया गया है, जिसमें कहा गया है
    कि माता-पिता की पूजा और परिक्रमा करने से तीर्थ स्थानों की यात्रा के समान पुण्य
    प्राप्त होता है। यह अपने माता-पिता का सम्मान और आदर करने के महत्व को दर्शाता है।
- id: ganesha-wisdom-praise
  type: story
  keywords:
  - Ganesha
  - wisdom
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 19
  summary_en: After Ganesha's explanation of the importance of parental worship, Shiva
    and Parvati praise his wisdom and acknowledge the truth in his words. They express
    that intelligence is the true strength, as demonstrated by Ganesha's actions.
  summary_hi: गणेशजी द्वारा माता-पिता की पूजा के महत्व को समझाने के बाद, शिव और पार्वती
    उनकी बुद्धिमत्ता की प्रशंसा करते हैं और उनके शब्दों की सत्यता को स्वीकार करते
    हैं। वे व्यक्त करते हैं कि बुद्धि ही वास्तविक शक्ति है, जैसा कि गणेशजी के कार्यों
    से प्रदर्शित होता है।
- id: ganesha-marriage-preparation
  type: event
  keywords:
  - Ganesha
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 19
  summary_en: Following the discussion on wisdom and parental worship, preparations
    for Ganesha's marriage are initiated. This marks the beginning of a significant
    event in Ganesha's life as his parents decide to arrange his marriage.
  summary_hi: बुद्धिमत्ता और माता-पिता की पूजा पर चर्चा के बाद, गणेशजी के विवाह की
    तैयारियाँ शुरू होती हैं। यह गणेशजी के जीवन की एक महत्वपूर्ण घटना की शुरुआत को
    चिह्नित करता है क्योंकि उनके माता-पिता उनके विवाह की व्यवस्था करने का निर्णय लेते
    हैं।
- id: ganesha-marriage-and-sons
  type: story
  keywords:
  - Ganesha
  - marriage
  - sons
  source:
    book: Shiv Puran
    sarga: अथ विंशोऽध्यायः
  summary_en: Ganesha was married to Siddhi and Buddhi, the daughters of Prajapati
    Vishvarupa, in a grand ceremony attended by all the gods. From these marriages,
    Ganesha had two sons, Kshema and Labha, who brought great joy and prosperity.
  summary_hi: गणेशजी का विवाह प्रजापति विश्वरूप की कन्याएँ सिद्धि और बुद्धि के साथ
    धूमधाम से हुआ, जिसमें सभी देवता शामिल हुए। इन विवाहों से गणेशजी के दो पुत्र हुए,
    क्षेम और लाभ, जिन्होंने अत्यधिक सुख और समृद्धि प्रदान की।
- id: kartikeya-return-and-anger
  type: story
  keywords:
  - Kartikeya
  - return
  - anger
  source:
    book: Shiv Puran
    sarga: अथ विंशोऽध्यायः
  summary_en: After circling the Earth, Kartikeya returned home only to find that
    his brother Ganesha had been married in his absence. Feeling slighted, Kartikeya
    left for Mount Krauncha despite his parents' attempts to pacify him.
  summary_hi: पृथ्वी की परिक्रमा करके लौटने पर कार्तिकेय ने पाया कि उनके भाई गणेशजी
    का विवाह उनकी अनुपस्थिति में हो गया था। इससे आहत होकर कार्तिकेय क्रौंच पर्वत की
    ओर चले गए, हालांकि उनके माता-पिता ने उन्हें समझाने की कोशिश की।
- id: kartikeya-exile-story
  type: story
  keywords:
  - Kartikeya
  - exile
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Kartikeya, the son of Shiva and Parvati, becomes upset with his parents
    for their perceived deceit and decides to leave them. Despite their pleas, he
    insists on leaving and goes to reside elsewhere. His presence is said to absolve
    sins, and he becomes known as a deity associated with purity and celibacy. On
    Kartik Purnima, many deities and sages visit him for blessings.
  summary_hi: कार्तिकेय, जो शिव और पार्वती के पुत्र हैं, अपने माता-पिता की छलपूर्ण
    आज्ञा से नाराज होकर उन्हें छोड़ने का निर्णय लेते हैं। उनके रोकने के बावजूद, वे
    जाने पर अड़े रहते हैं और कहीं और निवास करने लगते हैं। उनकी उपस्थिति पापों का नाश
    करती है और वे पवित्रता और ब्रह्मचर्य के देवता के रूप में प्रसिद्ध हो जाते हैं।
    कार्तिक पूर्णिमा के दिन कई देवता और ऋषि उनके दर्शन के लिए जाते हैं।
- id: mallikarjuna-jyotirlinga-concept
  type: concept
  keywords:
  - Mallikarjuna
  - Jyotirlinga
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: To console Parvati, who is saddened by Kartikeya's departure, Shiva
    manifests himself at the Mallikarjuna Jyotirlinga on the Krauncha mountain. This
    Jyotirlinga is considered a source of happiness and fulfills the desires of devotees.
    Shiva and Parvati are believed to reside there, granting refuge to the virtuous.
  summary_hi: कार्तिकेय के वियोग से दुखी पार्वती को सांत्वना देने के लिए, शिव क्रौंच
    पर्वत पर मल्लिकार्जुन ज्योतिर्लिंग के रूप में प्रकट होते हैं। यह ज्योतिर्लिंग
    सुख का स्रोत माना जाता है और भक्तों की इच्छाओं को पूरा करता है। शिव और पार्वती
    वहां निवास करते हैं और सज्जनों को शरण देते हैं।
- id: tripura-dahana-story
  type: story
  keywords:
  - tripura
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Kumar Khanda, Chapter 20
  summary_en: The story describes how Lord Shiva, with a single arrow, destroyed the
    three cities (Tripura) of the demons. This act was performed after the demon Tarakasura
    was slain by Shiva's son, Kartikeya. The three demon sons of Tarakasura, Tarakaksha,
    Vidyunmali, and Kamalaksha, performed intense penance to gain boons, leading to
    the creation of the three cities.
  summary_hi: यह कहानी बताती है कि भगवान शिव ने एक ही बाण से दैत्यों के तीन नगरों
    (त्रिपुर) को नष्ट कर दिया। यह कार्य तब किया गया जब शिव के पुत्र कार्तिकेय ने दैत्य
    तारकासुर का वध कर दिया था। तारकासुर के तीन पुत्र, तारकाक्ष, विद्युन्माली और कमलाक्ष,
    ने वरदान प्राप्त करने के लिए घोर तप किया, जिससे तीन नगरों की रचना हुई।
- id: tapasya-of-tarakasura-sons
  type: story
  keywords:
  - tapasya
  - tarakasura
  - austerity
  source:
    book: Shiv Puran
    sarga: '1'
  summary_en: The three sons of Tarakasura, named Tarakaksha, Vidyunmali, and Kamalaksha,
    undertook severe austerities in the caves of Mount Meru. They abandoned all worldly
    pleasures and performed intense penance to gain boons. Their tapasya included
    standing on one leg for a hundred years, subsisting on air for a thousand years,
    and enduring extreme weather conditions. Their dedication eventually pleased Lord
    Brahma, who appeared to grant them a boon.
  summary_hi: तारकासुर के तीन पुत्र, तारकाक्ष, विद्युनमाली और कमलाक्ष, ने मेरु पर्वत
    की गुफाओं में कठोर तप किया। उन्होंने सभी सांसारिक सुखों का त्याग कर दिया और वरदान
    प्राप्त करने के लिए गहन तपस्या की। उनकी तपस्या में सौ वर्षों तक एक पैर पर खड़े
    रहना, हजार वर्षों तक वायु पर निर्भर रहना और अत्यधिक मौसम की परिस्थितियों को सहन
    करना शामिल था। उनकी भक्ति से प्रसन्न होकर, भगवान ब्रह्मा प्रकट हुए और उन्हें वरदान
    देने का वचन दिया।
- id: brahma-grants-boon-to-demons
  type: story
  keywords:
  - Brahma
  - demons
  - boon
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: In this episode, the demons perform intense penance to please Brahma.
    Satisfied with their devotion, Brahma appears before them and offers to grant
    them a boon. The demons request immortality, but Brahma explains that true immortality
    is not possible. Instead, he advises them to ask for a different boon that would
    protect them from death.
  summary_hi: इस प्रकरण में, राक्षस ब्रह्मा को प्रसन्न करने के लिए कठोर तप करते हैं।
    उनकी भक्ति से संतुष्ट होकर, ब्रह्मा उनके सामने प्रकट होते हैं और उन्हें वरदान
    देने की पेशकश करते हैं। राक्षस अमरत्व की मांग करते हैं, लेकिन ब्रह्मा बताते हैं
    कि सच्चा अमरत्व संभव नहीं है। इसके बजाय, वह उन्हें मृत्यु से बचाने के लिए कोई
    अन्य वरदान मांगने की सलाह देते हैं।
- id: tripura-creation-story
  type: story
  keywords:
  - tripura
  - mayasura
  - asuras
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The asuras, seeking an impregnable abode, request Brahma to create three
    cities that are indestructible by the gods. Brahma instructs the architect Mayasura
    to build three cities made of gold, silver, and iron for the asuras Tarakaksha,
    Kamalaksha, and Vidyunmali. These cities, known as Tripura, are located in heaven,
    sky, and earth, respectively.
  summary_hi: असुरों ने ब्रह्मा से एक अभेद्य स्थान की याचना की, जहाँ देवता प्रवेश
    न कर सकें। ब्रह्मा ने वास्तुकार मयासुर को सोने, चाँदी और लोहे के तीन नगर बनाने
    का आदेश दिया, जो तारकाक्ष, कमलाक्ष और विद्युन्माली के लिए थे। ये नगर, जिन्हें
    त्रिपुरा कहा जाता है, क्रमशः स्वर्ग, आकाश और पृथ्वी में स्थित थे।
- id: tripurasura-threat
  type: event
  keywords:
  - Tripurasura
  - Brahma
  - Devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The Devas, led by Indra, were troubled by the demon Tripurasura and
    his sons. They approached Brahma for help, expressing their fear and seeking a
    solution to their plight.
  summary_hi: इन्द्र के नेतृत्व में देवता त्रिपुरासुर और उसके पुत्रों से परेशान थे।
    उन्होंने ब्रह्मा के पास जाकर अपनी चिंता व्यक्त की और समाधान की मांग की।
- id: brahma-advice-to-devas
  type: story
  keywords:
  - Brahma
  - Devas
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Brahma advised the Devas not to fear the demons and suggested that they
    pray to Shiva for assistance. He assured them that if Shiva was pleased, he would
    help them overcome their difficulties.
  summary_hi: ब्रह्मा ने देवताओं को दैत्यों से न डरने की सलाह दी और शिव से सहायता
    के लिए प्रार्थना करने का सुझाव दिया। उन्होंने आश्वासन दिया कि यदि शिव प्रसन्न
    होते हैं, तो वे उनकी कठिनाइयों को दूर करने में मदद करेंगे।
- id: devas-prayer-to-shiva
  type: practice
  keywords:
  - Devas
  - Shiva
  - Prayer
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Following Brahma's advice, the Devas, led by Indra, went to Shiva and
    offered their prayers with great devotion. They praised Shiva's various forms
    and attributes, seeking his intervention to alleviate their suffering.
  summary_hi: ब्रह्मा की सलाह के बाद, इन्द्र के नेतृत्व में देवता शिव के पास गए और
    बड़ी भक्ति के साथ प्रार्थना की। उन्होंने शिव के विभिन्न रूपों और गुणों की प्रशंसा
    की और उनके हस्तक्षेप की मांग की ताकि उनका कष्ट दूर हो सके।
- id: tripura-destruction-plan
  type: story
  keywords:
  - Vishnu
  - Tripura
  - demons
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu instructs the Bhutaganas to go to Tripura and destroy the three
    cities of the demons. However, upon reaching there, they are consumed by the power
    of the Tripura rulers. Vishnu then contemplates a plan to disrupt the demons'
    religious practices to ensure their defeat.
  summary_hi: विष्णुजी भूतगणों को त्रिपुर जाने और दैत्यों के तीनों पुरों को नष्ट करने
    का आदेश देते हैं। लेकिन वहां पहुंचने पर, वे त्रिपुर के शासकों की शक्ति से भस्म
    हो जाते हैं। इसके बाद, विष्णुजी दैत्यों की धार्मिक प्रथाओं में विघ्न डालने की
    योजना बनाते हैं ताकि उनकी हार सुनिश्चित हो सके।
- id: vishnu-creates-maya-sage
  type: story
  keywords:
  - Vishnu
  - Maya
  - Tripura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Chapter 4
  summary_en: Lord Vishnu creates a sage from his own body to disrupt the religious
    practices of the demons residing in Tripura. This sage, characterized by his shaved
    head and tattered clothes, is tasked with spreading a deceptive scripture that
    contradicts traditional Vedic teachings.
  summary_hi: भगवान विष्णु ने त्रिपुरा में रहने वाले दैत्यों के धार्मिक कार्यों में
    विघ्न डालने के लिए अपने शरीर से एक मुनि का सृजन किया। यह मुनि, जो अपने मुंडित
    सिर और फटे वस्त्रों के साथ पहचाना जाता है, को एक मायामय शास्त्र फैलाने का कार्य
    सौंपा गया, जो पारंपरिक वैदिक शिक्षाओं के विपरीत है।
- id: mundi-mission-to-tripura
  type: story
  keywords:
  - Mundi
  - Tripura
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu instructs Mundi to go to Tripura and deceive the demons residing
    there by teaching them a false doctrine. Mundi is to initiate them into this doctrine
    and lead them away from their righteous path. After completing this task, Mundi
    is to reside in the desert until the arrival of Kali Yuga, at which point he will
    spread his teachings further.
  summary_hi: विष्णु मुण्डी को त्रिपुर जाने और वहां रहने वाले दैत्यों को मायामय शास्त्र
    पढ़ाकर उन्हें मोहित करने का निर्देश देते हैं। मुण्डी को उन्हें इस शास्त्र में
    दीक्षित करना है और धर्म से च्युत करना है। इस कार्य के बाद, मुण्डी को मरुस्थल में
    कलियुग के आगमन तक निवास करना है और तब अपने धर्म का प्रचार करना है।
- id: creation-of-mundi-disciples
  type: story
  keywords:
  - Mundi
  - Disciples
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Following Vishnu's command, Mundi creates four disciples in his own
    image and teaches them the illusory doctrine. These disciples, like Mundi, are
    devoted to Vishnu and follow his instructions. They are described as carrying
    a pot, wearing cloth over their noses, and dressed in tattered clothes, spreading
    the belief that 'Dharma is the ultimate truth.'
  summary_hi: विष्णु की आज्ञा का पालन करते हुए, मुण्डी अपने रूप के अनुसार चार शिष्यों
    का निर्माण करता है और उन्हें मायामय शास्त्र पढ़ाता है। ये शिष्य, मुण्डी की तरह,
    विष्णु के प्रति समर्पित हैं और उनकी आज्ञा का पालन करते हैं। उन्हें एक पात्र लिए,
    नासिका पर वस्त्र बांधे, मलिन वस्त्र धारण किए हुए और 'धर्म ही परम तत्त्व है' कहते
    हुए वर्णित किया गया है।
- id: narada-visit-to-tripura
  type: event
  keywords:
  - Narada
  - Tripura
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Narada, upon Vishnu's request, visits Tripura to assist in a divine
    mission. He meets with the ruler of Tripura and discusses the presence of a sage
    who is influencing the city's inhabitants.
  summary_hi: नारद, विष्णु के अनुरोध पर, त्रिपुर में एक दिव्य मिशन में सहायता करने
    के लिए जाते हैं। वह त्रिपुर के शासक से मिलते हैं और एक ऋषि की उपस्थिति पर चर्चा
    करते हैं जो शहर के निवासियों को प्रभावित कर रहा है।
- id: tripura-ruler-initiation
  type: event
  keywords:
  - Tripura
  - Initiation
  - Sage
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The ruler of Tripura, impressed by the sage's teachings, requests initiation
    into the sage's practices. The sage agrees to initiate the ruler, provided he
    follows the prescribed guidelines.
  summary_hi: त्रिपुर के शासक, ऋषि की शिक्षाओं से प्रभावित होकर, उनके अभ्यासों में
    दीक्षा लेने का अनुरोध करते हैं। ऋषि सहमत होते हैं कि शासक निर्धारित दिशानिर्देशों
    का पालन करें।
- id: tripura-diksha-episode
  type: story
  keywords:
  - Tripura
  - Diksha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 4
  summary_en: In this episode, the king of Tripura, influenced by the sage Narada,
    decides to take initiation (Diksha) into a spiritual path. The sage Sanatkumara,
    after ensuring the king's commitment to follow his instructions, grants him the
    initiation. Consequently, the inhabitants of Tripura also receive the initiation.
  summary_hi: इस प्रकरण में, त्रिपुर के राजा, नारद मुनि के प्रभाव में आकर, एक आध्यात्मिक
    पथ में दीक्षा लेने का निर्णय लेते हैं। सनत्कुमार ऋषि, राजा की आज्ञा पालन की प्रतिबद्धता
    सुनिश्चित करने के बाद, उन्हें दीक्षा प्रदान करते हैं। इसके परिणामस्वरूप, त्रिपुर
    के निवासी भी दीक्षा प्राप्त करते हैं।
- id: tripura-mohini-episode
  type: story
  keywords:
  - tripura
  - moha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 5
  summary_en: In the Tripura Mohini episode, a sage, using his mystical powers, leads
    the people of Tripura astray from their dharma. The women abandon their duties,
    and the men become infatuated with others' wives. This chaos is orchestrated by
    the sage under the influence of Vishnu's maya, leading to the departure of Lakshmi
    from Tripura.
  summary_hi: त्रिपुर मोहिनी प्रकरण में, एक यति अपनी मायावी शक्तियों का उपयोग करके
    त्रिपुर के लोगों को उनके धर्म से भटका देता है। महिलाएं अपने कर्तव्यों को छोड़
    देती हैं और पुरुष दूसरों की पत्नियों के प्रति मोहित हो जाते हैं। यह अराजकता विष्णु
    की माया के प्रभाव में यति द्वारा रची जाती है, जिससे लक्ष्मी त्रिपुर से प्रस्थान
    कर जाती हैं।
- id: vishnu-praises-shiva
  type: story
  keywords:
  - Vishnu
  - Shiva
  - praise
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: In this episode, Lord Vishnu, accompanied by other deities, approaches
    Lord Shiva to praise him. Vishnu acknowledges Shiva's supreme nature and offers
    his respects through a hymn. The deities join in the praise, recognizing Shiva
    as the ultimate creator, preserver, and destroyer of the universe.
  summary_hi: इस प्रकरण में, भगवान विष्णु अन्य देवताओं के साथ भगवान शिव के पास जाकर
    उनकी स्तुति करते हैं। विष्णु शिव के परम स्वरूप को स्वीकार करते हैं और एक स्तोत्र
    के माध्यम से उन्हें सम्मानित करते हैं। देवता भी इस स्तुति में शामिल होते हैं और
    शिव को ब्रह्मांड के अंतिम स्रष्टा, पालक और संहारक के रूप में मान्यता देते हैं।
- id: shiva-parvati-visit-episode
  type: event
  keywords:
  - Shiva
  - Parvati
  - Devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Devi Parvati arrives with her two sons at the place where Lord Shiva
    is with the Devas. The Devas, including Vishnu, are surprised and respectfully
    greet her. Parvati speaks to Shiva, who is engrossed in the joy of being with
    his son Skanda, and momentarily forgets the troubles of the Devas.
  summary_hi: देवी पार्वती अपने दो पुत्रों के साथ उस स्थान पर आती हैं जहाँ भगवान शिव
    देवताओं के साथ हैं। विष्णु सहित सभी देवता आश्चर्यचकित होते हैं और उन्हें आदरपूर्वक
    प्रणाम करते हैं। पार्वती शिव से बात करती हैं, जो अपने पुत्र स्कंद के साथ होने
    की खुशी में मग्न हैं और क्षणभर के लिए देवताओं की समस्याओं को भूल जाते हैं।
- id: devas-distress-episode
  type: event
  keywords:
  - Devas
  - Distress
  - Kumbhodara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The Devas, distressed and confused, stand near Shiva's abode, unsure
    of what to do next. They lament their fate and express envy towards the Asuras.
    Meanwhile, Kumbhodara, a powerful being, begins to attack the Devas, causing them
    to flee in fear.
  summary_hi: देवता, परेशान और भ्रमित होकर, शिव के निवास के पास खड़े होते हैं, यह
    नहीं जानते कि आगे क्या करना है। वे अपने भाग्य पर विलाप करते हैं और असुरों से ईर्ष्या
    व्यक्त करते हैं। इस बीच, कुम्भोदर नामक एक शक्तिशाली गण देवताओं पर हमला करने लगता
    है, जिससे वे भयभीत होकर भाग जाते हैं।
- id: vishnu-consoles-devas
  type: event
  keywords:
  - Vishnu
  - Devas
  - Consolation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu addresses the distressed Devas and sages, urging them to listen
    to his words and abandon their sorrow. He advises them that great worship is not
    easily achieved and that initial suffering is part of the process. He assures
    them that perseverance will lead to divine favor.
  summary_hi: विष्णु परेशान देवताओं और ऋषियों को संबोधित करते हैं, उन्हें उनके शब्दों
    को सुनने और अपने दुख को त्यागने का आग्रह करते हैं। वह उन्हें सलाह देते हैं कि
    महान आराधना आसानी से प्राप्त नहीं होती और प्रारंभिक कष्ट प्रक्रिया का हिस्सा है।
    वह उन्हें आश्वस्त करते हैं कि दृढ़ता से दिव्य कृपा प्राप्त होगी।
- id: gods-request-tripura-destruction
  type: story
  keywords:
  - Tripura
  - destruction
  - boon
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, recognizing Shiva's satisfaction, request him to destroy the
    three cities of Tripura, which have been causing them distress. They appeal to
    Shiva's compassion and past protection to save them once again.
  summary_hi: देवता, शिव की प्रसन्नता को पहचानते हुए, उनसे त्रिपुर के तीन नगरों को
    नष्ट करने का अनुरोध करते हैं, जो उन्हें कष्ट दे रहे हैं। वे शिव की करुणा और पिछले
    संरक्षण की अपील करते हैं कि वह उन्हें फिर से बचाएं।
- id: shiva-pashupati-name-origin
  type: etymology
  keywords:
  - shiva
  - pashupati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 9
  summary_en: The passage explains the origin of the name 'Pashupati' for Lord Shiva.
    Shiva agrees to become the lord of all creatures (Pashupati) to defeat the demons.
    The gods express concern about being considered as animals, but Shiva assures
    them that those who follow the Pashupata vow will be liberated from animal-like
    existence. Thus, Shiva becomes known as Pashupati, the liberator from the bonds
    of animal existence.
  summary_hi: इस अंश में भगवान शिव के 'पशुपति' नाम की उत्पत्ति का वर्णन है। शिव असुरों
    को पराजित करने के लिए सभी प्राणियों के अधिपति बनने के लिए सहमत होते हैं। देवता
    पशुओं के रूप में माने जाने की चिंता व्यक्त करते हैं, लेकिन शिव उन्हें आश्वस्त
    करते हैं कि जो लोग पाशुपत व्रत का पालन करेंगे, वे पशु जैसे अस्तित्व से मुक्त हो
    जाएंगे। इस प्रकार, शिव पशुपति के रूप में जाने जाते हैं, जो पशु अस्तित्व के बंधनों
    से मुक्त करते हैं।
- id: pashupata-vrata-concept
  type: concept
  keywords:
  - Pashupata Vrata
  - liberation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: In this passage, Lord Shiva explains the concept of the Pashupata Vrata
    to the gods. He assures them that by practicing this divine vow, they can be liberated
    from the state of being 'pashu' or animal-like. The vrata involves dedicated worship
    for a period of twelve, six, or three years.
  summary_hi: इस अंश में, भगवान शिव देवताओं को पाशुपत व्रत की अवधारणा समझाते हैं।
    वे उन्हें आश्वस्त करते हैं कि इस दिव्य व्रत का पालन करने से वे 'पशु' या पशु जैसे
    होने की स्थिति से मुक्त हो सकते हैं। व्रत में बारह, छह या तीन वर्षों तक समर्पित
    उपासना शामिल है।
- id: tripura-vadha-event
  type: event
  keywords:
  - Tripura
  - destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: The passage narrates the event where Lord Shiva, accompanied by various
    gods and celestial beings, sets out to destroy the three cities known as Tripura.
    The gods, riding on elephants, horses, lions, and chariots, follow Shiva, armed
    with various weapons, to assist in the destruction.
  summary_hi: यह अंश उस घटना का वर्णन करता है जब भगवान शिव, विभिन्न देवताओं और दिव्य
    प्राणियों के साथ, त्रिपुर नामक तीन नगरों को नष्ट करने के लिए निकलते हैं। देवता
    हाथियों, घोड़ों, सिंहों और रथों पर सवार होकर, विभिन्न हथियारों से लैस होकर, विनाश
    में सहायता करने के लिए शिव का अनुसरण करते हैं।
- id: shiva-tripura-destruction
  type: story
  keywords:
  - Shiva
  - Tripura
  - Destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 9
  summary_en: Lord Shiva, accompanied by his ganas and devas, sets out to destroy
    the three cities of Tripura. Despite being capable of burning them himself, he
    uses a chariot, bow, and arrow to perform this task. The purpose is to demonstrate
    his supremacy among the gods and to extend his glory across the three worlds.
  summary_hi: भगवान शिव अपने गणों और देवताओं के साथ त्रिपुर के तीन नगरों को नष्ट करने
    के लिए निकलते हैं। यद्यपि वे स्वयं उन्हें जलाने में सक्षम हैं, फिर भी वे इस कार्य
    को करने के लिए रथ, धनुष और बाण का उपयोग करते हैं। इसका उद्देश्य देवताओं में उनकी
    श्रेष्ठता को प्रदर्शित करना और तीनों लोकों में उनकी महिमा का विस्तार करना है।
- id: ganesha-obstacle-removal
  type: story
  keywords:
  - Ganesha
  - Obstacle
  - Worship
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 9
  summary_en: Before Shiva could destroy Tripura, he was unable to see his target
    due to an obstacle created by Ganesha. Upon realizing this, Shiva worships Ganesha,
    who then removes the obstacle, allowing Shiva to proceed with the destruction
    of Tripura.
  summary_hi: शिव त्रिपुर को नष्ट करने से पहले अपने लक्ष्य को नहीं देख पा रहे थे क्योंकि
    गणेश द्वारा एक विघ्न उत्पन्न किया गया था। इसे समझने पर, शिव गणेश की पूजा करते
    हैं, जो विघ्न को हटा देते हैं, जिससे शिव त्रिपुर के विनाश को आगे बढ़ा सकते हैं।
- id: tripura-destruction-story
  type: story
  keywords:
  - Tripura
  - Shiva
  - Destruction
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Shiva, after worshipping Ganesha, sees the three cities of the
    demon sons of Taraka. With the cities aligned, Shiva is urged by Brahma and Vishnu
    to destroy them. Shiva uses the Pashupatastra to burn the cities, fulfilling the
    divine task and bringing joy to the gods and sages.
  summary_hi: भगवान शिव ने गणेश की पूजा करने के बाद तारक के पुत्रों के तीन नगरों को
    देखा। नगरों के एकत्र होने पर ब्रह्मा और विष्णु ने शिव से उन्हें नष्ट करने का आग्रह
    किया। शिव ने पाशुपतास्त्र का उपयोग करके नगरों को भस्म कर दिया, जिससे देवताओं और
    ऋषियों को प्रसन्नता हुई।
- id: tripura-destruction-by-shiva
  type: story
  keywords:
  - Tripura
  - Shiva
  - Destruction
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: In this episode, Lord Shiva destroys the three cities of Tripura with
    a powerful arrow. Despite being capable of destroying the cities with a mere glance,
    Shiva uses the arrow to enhance the glory of the gods. The destruction is so complete
    that the cities fall to the earth as ashes, and the demons residing in them are
    annihilated.
  summary_hi: इस प्रकरण में, भगवान शिव त्रिपुर के तीन नगरों को एक शक्तिशाली बाण से
    नष्ट कर देते हैं। यद्यपि शिव केवल एक दृष्टि से नगरों को नष्ट करने में सक्षम हैं,
    वे देवताओं की महिमा बढ़ाने के लिए बाण का उपयोग करते हैं। विनाश इतना पूर्ण होता
    है कि नगर पृथ्वी पर राख के रूप में गिर जाते हैं और उनमें निवास करने वाले दानव
    नष्ट हो जाते हैं।
- id: mayasura-survival
  type: story
  keywords:
  - Mayasura
  - Survival
  - Devotion
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Mayasura, the architect of the demons, survives the destruction of Tripura
    due to his devotion to Lord Shiva. Unlike other demons, he is not opposed to the
    gods and is protected by Shiva's grace, showcasing the power of devotion and surrender
    to the divine.
  summary_hi: मयासुर, जो दानवों का वास्तुकार है, त्रिपुर के विनाश से बच जाता है क्योंकि
    वह भगवान शिव का भक्त है। अन्य दानवों के विपरीत, वह देवताओं का विरोधी नहीं है और
    शिव की कृपा से संरक्षित है, जो भक्ति और दिव्य के प्रति समर्पण की शक्ति को दर्शाता
    है।
- id: tripura-daha-episode
  type: story
  keywords:
  - Tripura
  - Shiva
  source:
    book: Shiv Puran
    sarga: द्वितीय रुद्रसंहिता, पंचम युद्धखण्ड, दशम अध्याय
  summary_en: After the destruction of Tripura, the gods, including Indra and Vishnu,
    were astonished by Shiva's fierce form. They praised Shiva, who appeared like
    a blazing fire, and sought his blessings. Brahma, along with other gods, offered
    prayers to calm Shiva and expressed their gratitude for his protection.
  summary_hi: त्रिपुर के विनाश के बाद, इंद्र और विष्णु सहित देवता शिव के रौद्र रूप
    को देखकर आश्चर्यचकित हो गए। उन्होंने शिव की स्तुति की, जो प्रज्वलित अग्नि के समान
    दिखाई दे रहे थे, और उनसे आशीर्वाद मांगा। ब्रह्मा ने अन्य देवताओं के साथ शिव की
    स्तुति की और उनकी रक्षा के लिए आभार व्यक्त किया।
- id: shiva-praise-by-brahma-and-vishnu
  type: story
  keywords:
  - Shiva
  - Brahma
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: In this episode, Brahma and Vishnu, along with other deities, praise
    Lord Shiva for his benevolence and power. They express their devotion and request
    Shiva to always be pleased with them and to protect them from any future calamities.
    Shiva, pleased with their devotion, assures them of his continued support and
    protection.
  summary_hi: इस प्रकरण में, ब्रह्मा और विष्णु अन्य देवताओं के साथ भगवान शिव की उनकी
    दयालुता और शक्ति के लिए स्तुति करते हैं। वे अपनी भक्ति व्यक्त करते हैं और शिव
    से अनुरोध करते हैं कि वे हमेशा उनसे प्रसन्न रहें और भविष्य की किसी भी विपत्ति
    से उनकी रक्षा करें। शिव, उनकी भक्ति से प्रसन्न होकर, उन्हें अपने निरंतर समर्थन
    और सुरक्षा का आश्वासन देते हैं।
- id: shiva-boon-to-devas
  type: story
  keywords:
  - Shiva
  - Devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 11
  summary_en: In this episode, the Devas praise Lord Shiva and request him to assist
    them whenever they face difficulties. Pleased with their devotion, Shiva grants
    their wish, promising to appear and help them in times of trouble.
  summary_hi: इस प्रकरण में, देवता भगवान शिव की स्तुति करते हैं और उनसे अनुरोध करते
    हैं कि जब भी वे कठिनाइयों का सामना करें, तब वे उनकी सहायता करें। उनकी भक्ति से
    प्रसन्न होकर, शिव उनकी इच्छा पूरी करते हैं और उन्हें वचन देते हैं कि वे संकट के
    समय प्रकट होकर उनकी सहायता करेंगे।
- id: maya-danava-seeks-shiva
  type: story
  keywords:
  - Maya Danava
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 12
  summary_en: Maya Danava, having survived the destruction due to Shiva's grace, approaches
    Lord Shiva with devotion. He praises Shiva and seeks refuge, after which Shiva
    grants him the boon to reside in Vitala Loka and continue his devotion.
  summary_hi: मय दानव, शिव की कृपा से विनाश से बचकर, भगवान शिव के पास भक्ति के साथ
    आता है। वह शिव की स्तुति करता है और शरण मांगता है, जिसके बाद शिव उसे वितल लोक
    में निवास करने और अपनी भक्ति जारी रखने का वरदान देते हैं।
- id: maya-boon-from-shiva
  type: story
  keywords:
  - Maya
  - Shiva
  - boon
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Maya, a demon, prays to Lord Shiva and asks for eternal devotion and
    the absence of demonic tendencies. Pleased with Maya's devotion, Shiva grants
    him the boon, allowing him to live fearlessly in the beautiful realm of Vitala
    with his family.
  summary_hi: मय नामक दानव भगवान शिव से प्रार्थना करता है और शाश्वत भक्ति और असुर
    भावनाओं की अनुपस्थिति का वरदान मांगता है। मय की भक्ति से प्रसन्न होकर, शिव उसे
    यह वरदान देते हैं, जिससे वह अपने परिवार के साथ निर्भय होकर मनोहर वितल लोक में
    रह सके।
- id: mundis-seek-forgiveness
  type: story
  keywords:
  - Mundis
  - forgiveness
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The Mundis, having committed misdeeds against Shiva's devotees, seek
    forgiveness from the gods. Vishnu and other deities assure them that their actions
    were part of Shiva's divine plan and that they will not suffer as they are servants
    of Shiva and beneficial to the gods and sages.
  summary_hi: मुण्डियों ने शिव भक्तों के खिलाफ दुष्कर्म किए थे और वे देवताओं से क्षमा
    मांगते हैं। विष्णु और अन्य देवता उन्हें आश्वस्त करते हैं कि उनके कार्य शिव की
    दिव्य योजना का हिस्सा थे और वे शिव के सेवक होने के नाते कष्ट नहीं सहेंगे और देवताओं
    और ऋषियों के लिए हितकारी हैं।
- id: indra-shiva-encounter
  type: story
  keywords:
  - Indra
  - Shiva
  source:
    book: Shiv Puran
    sarga: '13'
  summary_en: Indra and Brihaspati, filled with devotion, set out to visit Lord Shiva
    on Mount Kailash. Upon their arrival, Shiva, in a digambara form with matted hair,
    stands in their path to test their knowledge. Indra, not recognizing Shiva, arrogantly
    questions him and threatens him with his thunderbolt. Shiva remains silent, testing
    Indra's patience and wisdom.
  summary_hi: इन्द्र और बृहस्पति, भक्ति से परिपूर्ण होकर, कैलाश पर्वत पर भगवान शिव
    के दर्शन के लिए जाते हैं। उनके आगमन पर, शिव जटाजूट धारण कर दिगम्बर रूप में उनके
    मार्ग में खड़े हो जाते हैं और उनके ज्ञान की परीक्षा लेते हैं। इन्द्र, शिव को पहचान
    नहीं पाते और अहंकार में उन्हें प्रश्न करते हैं और अपने वज्र से धमकी देते हैं।
    शिव मौन रहते हैं, इन्द्र की धैर्य और ज्ञान की परीक्षा लेते हुए।
- id: shiva-anger-and-indra-salvation
  type: story
  keywords:
  - Shiva
  - Indra
  - anger
  - salvation
  source:
    book: Shiv Puran
    sarga: '13'
  summary_en: In this episode, Shiva, angered by Indra, releases a destructive fire
    from his third eye. Brihaspati pleads with Shiva to spare Indra, emphasizing Shiva's
    nature as a protector of devotees. Shiva, appeased by Brihaspati's words, grants
    a boon and throws the fire into the ocean, saving Indra.
  summary_hi: इस प्रकरण में, शिव इन्द्र से क्रोधित होकर अपनी तीसरी आँख से विनाशकारी
    अग्नि प्रकट करते हैं। बृहस्पति शिव से इन्द्र को क्षमा करने की प्रार्थना करते हैं,
    शिव के भक्तवत्सल स्वभाव को याद दिलाते हैं। शिव, बृहस्पति की बातों से प्रसन्न होकर,
    वरदान देते हैं और अग्नि को समुद्र में फेंक देते हैं, जिससे इन्द्र की रक्षा होती
    है।
- id: birth-of-jalandhara
  type: story
  keywords:
  - Jalandhara
  - Shiva
  - Brahma
  source:
    book: Shiv Puran
    sarga: '591'
  summary_en: The story narrates the birth of Jalandhara, a powerful being born from
    the energy of Shiva's third eye, which was cast into the ocean. The child's cries
    caused great disturbance across the worlds, prompting the gods to seek Brahma's
    help. Brahma, upon seeing the child, named him Jalandhara, as he was found in
    the ocean.
  summary_hi: यह कहानी जलंधर के जन्म की है, जो शिव के तीसरे नेत्र से उत्पन्न ऊर्जा
    से पैदा हुआ था और जिसे समुद्र में फेंक दिया गया था। बच्चे के रोने से सभी लोकों
    में हलचल मच गई, जिससे देवताओं ने ब्रह्मा की सहायता मांगी। ब्रह्मा ने बच्चे को
    देखकर उसका नाम जलंधर रखा, क्योंकि वह समुद्र में पाया गया था।
- id: jalandhara-birth-and-marriage
  type: story
  keywords:
  - jalandhara
  - birth
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand, Chapter 14
  summary_en: Jalandhara, born from the water that emerged from Shiva's eyes, was
    destined to be a powerful warrior and ruler of the demons. He was married to Vrinda,
    the daughter of the demon Kalanemi. The marriage was celebrated with great festivity,
    and Jalandhara became a formidable force, even challenging the gods.
  summary_hi: जलन्धर, जो शिव की आँखों से निकले जल से उत्पन्न हुआ था, एक शक्तिशाली
    योद्धा और दैत्यों का शासक बनने के लिए नियत था। उसका विवाह कालनेमि की पुत्री वृन्दा
    से हुआ। विवाह बड़े उत्सव के साथ मनाया गया और जलन्धर एक प्रबल शक्ति बन गया, जिसने
    देवताओं को भी चुनौती दी।
- id: jalandhara-conquest
  type: story
  keywords:
  - jalandhara
  - conquest
  - gods
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand, Chapter 14
  summary_en: Jalandhara, after marrying Vrinda, became a powerful ruler and began
    to conquer the heavens. He defeated the gods and took control of Amaravati, causing
    the gods to hide in fear. His actions were driven by anger over the deceit of
    the gods during the churning of the ocean.
  summary_hi: वृन्दा से विवाह के बाद जलन्धर एक शक्तिशाली शासक बन गया और स्वर्ग पर
    आक्रमण करने लगा। उसने देवताओं को पराजित कर अमरावती पर अधिकार कर लिया, जिससे देवता
    भयभीत होकर छिप गए। उसके कार्य समुद्र मंथन के समय देवताओं के छल से उत्पन्न क्रोध
    के कारण थे।
- id: jalandhara-assembly-episode
  type: event
  keywords:
  - Jalandhara
  - Asuras
  - Shukracharya
  source:
    book: Shiv Puran
    sarga: '15'
  summary_en: Jalandhara, the son of the ocean, was sitting with his wife Vrinda and
    other Asuras when the sage Shukracharya arrived. Jalandhara and the Asuras respectfully
    greeted the sage, who then blessed them and sat down. Jalandhara, pleased with
    the assembly, noticed the headless Rahu and inquired about the incident from Shukracharya.
  summary_hi: समुद्रपुत्र जलंधर अपनी पत्नी वृंदा और अन्य असुरों के साथ बैठे थे, तभी
    शुकाचार्य वहां आए। जलंधर और असुरों ने आदरपूर्वक उनका स्वागत किया। शुकाचार्य ने
    उन्हें आशीर्वाद दिया और बैठ गए। जलंधर ने प्रसन्न होकर सभा को देखा और राहु के कटे
    हुए सिर को देखकर शुकाचार्य से इसके बारे में पूछा।
- id: rahu-decapitation-story
  type: story
  keywords:
  - Rahu
  - Decapitation
  - Vishnu
  source:
    book: Shiv Puran
    sarga: '15'
  summary_en: Shukracharya narrates the story of how Rahu was decapitated by Vishnu.
    During the churning of the ocean, the Asuras and Devas worked together to obtain
    Amrita. However, the Devas, with Vishnu's help, deceitfully consumed the Amrita.
    Rahu, who tried to partake in the nectar, was decapitated by Vishnu.
  summary_hi: शुक्राचार्य ने राहु के सिर काटे जाने की कहानी सुनाई। समुद्र मंथन के
    दौरान, असुरों और देवताओं ने मिलकर अमृत प्राप्त करने का प्रयास किया। हालांकि, देवताओं
    ने विष्णु की मदद से छलपूर्वक अमृत का सेवन किया। राहु, जो अमृत पीने का प्रयास कर
    रहा था, विष्णु द्वारा उसका सिर काट दिया गया।
- id: ocean-churning-episode
  type: event
  keywords:
  - Ocean Churning
  - Amrita
  - Devas
  source:
    book: Shiv Puran
    sarga: '15'
  summary_en: The Devas, under Vishnu's guidance, formed an alliance with the Asuras
    to churn the ocean for Amrita. Despite the cooperation, the Devas, skilled in
    deceit, managed to consume the Amrita themselves, leading to their victory over
    the Asuras.
  summary_hi: विष्णु के मार्गदर्शन में देवताओं ने असुरों के साथ मिलकर अमृत के लिए
    समुद्र मंथन किया। सहयोग के बावजूद, छल में निपुण देवताओं ने स्वयं अमृत का सेवन
    कर लिया, जिससे उन्हें असुरों पर विजय प्राप्त हुई।
- id: jalandhara-envoy-to-indra
  type: story
  keywords:
  - Jalandhara
  - Indra
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Jalandhara, the son of the ocean, sends his envoy Ghasmara to Indra
    with a message. Jalandhara demands the return of the jewels taken from his father
    during the churning of the ocean and threatens Indra with dire consequences if
    his demands are not met.
  summary_hi: जलन्धर, जो समुद्र का पुत्र है, अपने दूत घस्मर को इन्द्र के पास संदेश
    के साथ भेजता है। जलन्धर अपने पिता से समुद्र मंथन के दौरान लिए गए रत्नों की वापसी
    की मांग करता है और इन्द्र को चेतावनी देता है कि अगर उसकी मांगें पूरी नहीं हुईं
    तो गंभीर परिणाम होंगे।
- id: indra-response-to-jalandhara
  type: story
  keywords:
  - Indra
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Indra responds to Jalandhara's envoy, recalling past events where he
    had to protect himself from the demons. Indra refuses to return the jewels, stating
    that he cannot allow a traitor to live in peace.
  summary_hi: इन्द्र जलन्धर के दूत को जवाब देते हैं, उन पिछले घटनाओं को याद करते हुए
    जब उन्हें राक्षसों से अपनी रक्षा करनी पड़ी थी। इन्द्र रत्नों को लौटाने से इनकार
    करते हैं, यह कहते हुए कि वह एक द्रोही को शांति से जीने नहीं दे सकते।
- id: jalandhara-prepares-for-war
  type: event
  keywords:
  - Jalandhara
  - War
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Upon hearing Indra's response, Jalandhara becomes furious and prepares
    for war against the gods. He gathers a massive army from all directions, including
    powerful demons like Shumbha and Nishumbha, and marches towards the heavens.
  summary_hi: इन्द्र के जवाब को सुनकर जलन्धर क्रोधित हो जाता है और देवताओं के खिलाफ
    युद्ध की तैयारी करता है। वह सभी दिशाओं से शक्तिशाली राक्षसों जैसे शुम्भ और निशुम्भ
    के साथ एक विशाल सेना इकट्ठा करता है और स्वर्ग की ओर कूच करता है।
- id: jalandhara-battle-with-devas
  type: event
  keywords:
  - Jalandhara
  - Devas
  - Battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 16
  summary_en: Jalandhara, a powerful demon, commands his vast army of demons to engage
    in a fierce battle against the Devas, led by Vishnu. Despite the overwhelming
    numbers of demons, the Devas, empowered by Vishnu's presence, fight valiantly.
    The battle is intense and causes fear among sages and Siddhas.
  summary_hi: जलन्धर, एक शक्तिशाली दैत्य, अपनी विशाल दैत्य सेना को विष्णु के नेतृत्व
    में देवताओं के खिलाफ भयंकर युद्ध में शामिल होने का आदेश देता है। दैत्यों की भारी
    संख्या के बावजूद, विष्णु की उपस्थिति से सशक्त देवता वीरतापूर्वक लड़ते हैं। यह
    युद्ध अत्यंत भयंकर है और मुनियों तथा सिद्धों में भय उत्पन्न करता है।
- id: angiras-revives-devas
  type: story
  keywords:
  - Angiras
  - Divine Herbs
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Angiras, also known as Brihaspati, repeatedly brings divine herbs from
    Mount Drona to revive the Devas during the battle. This act of reviving the Devas
    adds to the intensity of the ongoing conflict.
  summary_hi: अंगिरा, जिन्हें बृहस्पति भी कहा जाता है, बार-बार द्रोण पर्वत से दिव्य
    औषधियाँ लाकर युद्ध के दौरान देवताओं को पुनर्जीवित करते हैं। देवताओं को पुनर्जीवित
    करने का यह कार्य चल रहे संघर्ष की तीव्रता को बढ़ा देता है।
- id: jalandhara-removes-mount-drona
  type: story
  keywords:
  - Jalandhara
  - Mount Drona
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Following Shukracharya's advice, Jalandhara uproots Mount Drona with
    his immense strength and throws it into the ocean, preventing the Devas from using
    its divine herbs. This act demonstrates Jalandhara's power and strategic thinking
    in the battle.
  summary_hi: शुक्राचार्य की सलाह पर, जलन्धर अपनी अपार शक्ति से द्रोण पर्वत को उखाड़कर
    समुद्र में फेंक देता है, जिससे देवता उसकी दिव्य औषधियों का उपयोग नहीं कर पाते।
    यह कार्य युद्ध में जलन्धर की शक्ति और रणनीतिक सोच को दर्शाता है।
- id: jalandhara-invasion-of-amaravati
  type: event
  keywords:
  - Jalandhara
  - Amaravati
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The demon Jalandhara, son of the ocean, invades Amaravati, causing the
    gods to flee in fear. The gods, led by Indra, hide in the caves of Mount Meru
    to escape Jalandhara's wrath.
  summary_hi: सागरपुत्र दैत्य जलन्धर अमरावती पर आक्रमण करता है, जिससे देवता भयभीत
    होकर भाग जाते हैं। इन्द्र के नेतृत्व में देवता जलन्धर के क्रोध से बचने के लिए
    मेरु पर्वत की गुफाओं में छिप जाते हैं।
- id: gods-seek-vishnus-help
  type: event
  keywords:
  - Vishnu
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Frightened by the approach of the demon Jalandhara, the gods, led by
    Prajapati, flee to Vaikuntha. There, they offer prayers to Lord Vishnu, seeking
    his help to defeat Jalandhara.
  summary_hi: दैत्य जलन्धर के आगमन से भयभीत होकर, प्रजापति के नेतृत्व में देवता वैकुण्ठ
    की ओर भाग जाते हैं। वहाँ वे भगवान विष्णु की स्तुति करते हैं और जलन्धर को पराजित
    करने के लिए उनकी सहायता मांगते हैं।
- id: battle-between-vishnu-and-jalandhara
  type: event
  keywords:
  - Vishnu
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A fierce battle ensues between Lord Vishnu and the demon king Jalandhara.
    Vishnu, mounted on Garuda, uses his Sudarshan Chakra and other weapons to fight
    the demons. Jalandhara, in his anger, retaliates with his own powerful weapons,
    causing fear among the gods and shaking the universe.
  summary_hi: भगवान विष्णु और दैत्यराज जलंधर के बीच एक भयंकर युद्ध होता है। गरुड़
    पर सवार विष्णु अपने सुदर्शन चक्र और अन्य हथियारों का उपयोग करके दैत्यों से लड़ते
    हैं। जलंधर अपने शक्तिशाली हथियारों से प्रतिकार करता है, जिससे देवताओं में भय उत्पन्न
    होता है और सारा जगत कांप उठता है।
- id: jalandhara-battle-with-vishnu
  type: story
  keywords:
  - Jalandhara
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The demon Jalandhara engages in a fierce battle with Lord Vishnu. Despite
    Vishnu's powerful attacks with his sword and bow, Jalandhara remains unshaken.
    The battle continues with both sides exchanging blows, and Vishnu eventually praises
    Jalandhara's bravery and offers him a boon.
  summary_hi: राक्षस जलंधर भगवान विष्णु के साथ एक भयंकर युद्ध में संलग्न होता है।
    विष्णु के शक्तिशाली हमलों के बावजूद जलंधर अडिग रहता है। युद्ध जारी रहता है और
    दोनों पक्षों के बीच प्रहार होते हैं। अंततः विष्णु जलंधर की बहादुरी की प्रशंसा
    करते हैं और उसे वरदान देने का प्रस्ताव करते हैं।
- id: vishnu-praises-jalandhara
  type: event
  keywords:
  - Vishnu
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After a prolonged battle, Lord Vishnu acknowledges Jalandhara's valor
    and offers him a boon, impressed by his bravery and strength in battle.
  summary_hi: लंबे युद्ध के बाद, भगवान विष्णु जलंधर की वीरता को स्वीकार करते हैं और
    उसकी बहादुरी और युद्ध में शक्ति से प्रभावित होकर उसे वरदान देने की पेशकश करते
    हैं।
- id: jalandhara-boon-request
  type: story
  keywords:
  - Jalandhara
  - Boon
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Jalandhara, after being offered a boon by Vishnu, requests that Vishnu
    reside with him and his sister in his city, along with all the divine beings.
  summary_hi: विष्णु द्वारा वरदान की पेशकश के बाद, जलंधर अनुरोध करता है कि विष्णु
    उसके और उसकी बहन के साथ उसके नगर में सभी देवताओं के साथ निवास करें।
- id: vishnu-jalandhara-battle
  type: story
  keywords:
  - Vishnu
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 17
  summary_en: A fierce battle takes place between Lord Vishnu and the demon king Jalandhara.
    Despite the intense fight, Vishnu is impressed by Jalandhara's bravery and offers
    him a boon. Jalandhara requests Vishnu to reside with him, along with Goddess
    Lakshmi and his attendants, which Vishnu agrees to.
  summary_hi: भगवान विष्णु और दैत्यराज जलंधर के बीच एक भयंकर युद्ध होता है। इस तीव्र
    युद्ध के बावजूद, विष्णु जलंधर की वीरता से प्रभावित होते हैं और उसे वरदान देने
    की पेशकश करते हैं। जलंधर विष्णु से अनुरोध करता है कि वे देवी लक्ष्मी और अपने गणों
    के साथ उसके साथ निवास करें, जिसे विष्णु स्वीकार कर लेते हैं।
- id: jalandhara-rule
  type: story
  keywords:
  - Jalandhara
  - Rule
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 17
  summary_en: After gaining control over the gods, Jalandhara rules the three worlds
    with righteousness. Under his rule, there is no disease, sorrow, or poverty, and
    he governs like a father caring for his children.
  summary_hi: देवताओं पर अधिकार प्राप्त करने के बाद, जलंधर तीनों लोकों पर धर्मपूर्वक
    शासन करता है। उसके शासन में कोई रोग, दुख या गरीबी नहीं होती, और वह अपने बच्चों
    की तरह प्रजा का पालन करता है।
- id: narada-visits-demon-city
  type: event
  keywords:
  - Narada
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Narada, a sage and devotee of Shiva, visits the city of demons on Shiva's
    command. The gods, including Indra, are distressed by the demon king Jalandhara,
    who has displaced them from their positions. They seek Narada's help to find a
    solution to their plight.
  summary_hi: नारद, जो शिव के भक्त और ऋषि हैं, शिव की आज्ञा से दैत्यों के नगर में
    जाते हैं। इंद्र सहित देवता जलंधर नामक दैत्यराज द्वारा अपने स्थानों से हटाए जाने
    के कारण व्यथित हैं। वे नारद से अपनी समस्या का समाधान खोजने की प्रार्थना करते हैं।
- id: gods-seek-narada-help
  type: story
  keywords:
  - Gods
  - Narada
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: The gods, led by Indra, approach Narada with their grievances against
    the demon king Jalandhara. They explain how Jalandhara has overpowered them and
    even brought Vishnu under his control. They plead with Narada to help them defeat
    Jalandhara.
  summary_hi: इंद्र के नेतृत्व में देवता नारद के पास अपनी शिकायतें लेकर जाते हैं,
    जो जलंधर दैत्यराज के खिलाफ हैं। वे बताते हैं कि जलंधर ने उन्हें परास्त कर दिया
    है और यहां तक कि विष्णु को भी अपने वश में कर लिया है। वे नारद से जलंधर को हराने
    में मदद करने की प्रार्थना करते हैं।
- id: narada-meets-jalandhara
  type: event
  keywords:
  - Narada
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Narada visits Jalandhara's court, where the demon king receives him
    with great respect and offers him a seat. Jalandhara, curious about Narada's visit,
    inquires about the purpose of his arrival.
  summary_hi: नारद जलंधर के दरबार में जाते हैं, जहां दैत्यराज उनका आदरपूर्वक स्वागत
    करते हैं और उन्हें आसन प्रदान करते हैं। जलंधर, नारद की यात्रा के उद्देश्य के बारे
    में जानने के लिए उत्सुक होते हैं।
- id: narada-visits-jalandhara
  type: story
  keywords:
  - Narada
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sage Narada visits the demon king Jalandhara's court. Jalandhara welcomes
    Narada with great devotion and offers him a seat. Narada praises Jalandhara's
    wealth and mentions his visit to Mount Kailash, where he saw Lord Shiva with Parvati.
    Intrigued by Narada's words, Jalandhara expresses a desire to see his own wealth
    compared to Shiva's.
  summary_hi: ऋषि नारद दानव राजा जलंधर के दरबार में जाते हैं। जलंधर नारद का बड़ी भक्ति
    के साथ स्वागत करता है और उन्हें आसन प्रदान करता है। नारद जलंधर की समृद्धि की प्रशंसा
    करते हैं और कैलाश पर्वत पर भगवान शिव और पार्वती के दर्शन का उल्लेख करते हैं। नारद
    की बातों से प्रभावित होकर जलंधर अपनी समृद्धि की तुलना शिव से करने की इच्छा व्यक्त
    करता है।
- id: jalandhara-seeks-parvati
  type: story
  keywords:
  - Jalandhara
  - Parvati
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After hearing Narada's description of Parvati's beauty, Jalandhara becomes
    eager to possess her. He asks Narada where he can find such a jewel of a wife.
    Narada informs him that Parvati, the beautiful consort of Lord Shiva, resides
    on Mount Kailash. Jalandhara, driven by desire, decides to pursue Parvati.
  summary_hi: नारद द्वारा पार्वती की सुंदरता का वर्णन सुनकर जलंधर उन्हें पाने के लिए
    उत्सुक हो जाता है। वह नारद से पूछता है कि ऐसी रत्न जैसी पत्नी कहां मिल सकती है।
    नारद उसे बताते हैं कि पार्वती, भगवान शिव की सुंदर पत्नी, कैलाश पर्वत पर निवास
    करती हैं। जलंधर, कामना से प्रेरित होकर, पार्वती को पाने का निर्णय लेता है।
- id: narada-jalandhara-dialogue
  type: story
  keywords:
  - Narada
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khanda
  summary_en: Narada visits the demon king Jalandhara and praises his wealth and power.
    However, Narada points out that Jalandhara lacks a supreme woman in his household,
    which prompts Jalandhara to inquire about such a woman. Narada describes Parvati,
    the wife of Shiva, as the most beautiful and powerful woman, inciting Jalandhara's
    desire to possess her.
  summary_hi: नारद जलंधर से मिलते हैं और उसकी संपत्ति और शक्ति की प्रशंसा करते हैं।
    हालांकि, नारद यह भी बताते हैं कि जलंधर के घर में एक सर्वोच्च स्त्री का अभाव है,
    जिससे जलंधर ऐसी स्त्री के बारे में पूछता है। नारद पार्वती का वर्णन करते हैं, जो
    शिव की पत्नी हैं, और उन्हें सबसे सुंदर और शक्तिशाली स्त्री बताते हैं, जिससे जलंधर
    की इच्छा उन्हें प्राप्त करने की होती है।
- id: jalandhara-sends-messenger-to-shiva
  type: story
  keywords:
  - Jalandhara
  - Shiva
  - Kailasa
  source:
    book: Shiv Puran
    sarga: Section 30
  summary_en: The demon king Jalandhara, overwhelmed by desire, sends a messenger
    to Lord Shiva at Mount Kailasa. He instructs the messenger to tell Shiva to give
    up his wife, claiming that all treasures of the three worlds belong to him, including
    Shiva's consort.
  summary_hi: दानव राजा जलंधर, काम से प्रभावित होकर, कैलास पर्वत पर भगवान शिव के पास
    एक दूत भेजता है। वह दूत को निर्देश देता है कि वह शिव से कहे कि वह अपनी पत्नी को
    छोड़ दें, यह दावा करते हुए कि तीनों लोकों के सभी रत्न उसके हैं, जिसमें शिव की
    पत्नी भी शामिल है।
- id: rahu-delivers-jalandhara-message-to-shiva
  type: story
  keywords:
  - Rahu
  - Jalandhara
  - Shiva
  source:
    book: Shiv Puran
    sarga: Section 30
  summary_en: Rahu, the messenger of Jalandhara, approaches Lord Shiva and delivers
    the demon king's message. He conveys Jalandhara's claim over all treasures and
    demands Shiva's wife, Parvati, as she is considered a jewel among women.
  summary_hi: राहु, जलंधर का दूत, भगवान शिव के पास जाता है और दानव राजा का संदेश देता
    है। वह जलंधर के सभी रत्नों पर अधिकार के दावे को व्यक्त करता है और शिव की पत्नी
    पार्वती की मांग करता है, क्योंकि वह स्त्रियों में रत्न मानी जाती हैं।
- id: rahu-visit-to-shiva
  type: story
  keywords:
  - Rahu
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Rahu, the son of Simhika, visits the court of Lord Shiva as a messenger
    of the demon king Jalandhar. He conveys Jalandhar's message, claiming that Parvati,
    Shiva's consort, is more suited to Jalandhar due to his wealth and power. Shiva's
    response is not detailed in this passage.
  summary_hi: सिंहिकापुत्र राहु, दैत्यराज जलंधर का दूत बनकर शिवजी की सभा में आता है।
    वह जलंधर का संदेश देता है, जिसमें जलंधर यह दावा करता है कि पार्वती, जो शिव की
    पत्नी हैं, उनके धन और शक्ति के कारण जलंधर के लिए अधिक उपयुक्त हैं। इस अंश में
    शिव की प्रतिक्रिया का विवरण नहीं है।
- id: shiva-saves-rahu
  type: story
  keywords:
  - Shiva
  - Rahu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: When Rahu is threatened by a fierce being emerging from Shiva's brow,
    he seeks refuge with Lord Shiva. Shiva, known for his compassion, instructs the
    being to release Rahu, emphasizing the protection of those who seek refuge.
  summary_hi: जब राहु को शिव के भ्रूमध्य से प्रकट हुए एक भयंकर पुरुष द्वारा धमकी दी
    जाती है, तो वह शिवजी की शरण में जाता है। शिव, जो अपनी करुणा के लिए प्रसिद्ध हैं,
    उस पुरुष को राहु को छोड़ने का आदेश देते हैं, और शरणागत की रक्षा के महत्व पर जोर
    देते हैं।
- id: birth-of-kirtimukha
  type: story
  keywords:
  - Kirtimukha
  - Shiva
  - self-sacrifice
  source:
    book: Shiv Puran
    sarga: Section 30
  summary_en: A man, suffering from extreme hunger, approaches Lord Shiva for guidance.
    Shiva instructs him to consume his own flesh. The man obeys, leaving only his
    head. Pleased with his devotion, Shiva names him Kirtimukha and appoints him as
    a guardian at his door, declaring that those who worship Shiva must also honor
    Kirtimukha.
  summary_hi: एक व्यक्ति, जो अत्यधिक भूख से पीड़ित था, भगवान शिव के पास मार्गदर्शन
    के लिए जाता है। शिव उसे अपना मांस खाने का निर्देश देते हैं। व्यक्ति आज्ञा का पालन
    करता है और केवल उसका सिर बचता है। उसकी भक्ति से प्रसन्न होकर, शिव उसे कीर्तिमुख
    नाम देते हैं और अपने द्वार पर रक्षक नियुक्त करते हैं, यह घोषणा करते हैं कि जो
    लोग शिव की पूजा करते हैं, उन्हें कीर्तिमुख की भी पूजा करनी चाहिए।
- id: rahu-liberation-and-jalandhara-conflict
  type: story
  keywords:
  - Rahu
  - Jalandhara
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After being liberated by a divine being from Shiva's brow, Rahu, now
    known as Varvara, reaches the city of Jalandhara. He narrates Shiva's exploits
    to the demon king Jalandhara, who becomes enraged and prepares for battle against
    the gods. The gods, troubled by Jalandhara's actions, seek refuge with Shiva on
    Mount Kailash, pleading for protection.
  summary_hi: शिव के भ्रूमध्य से प्रकट दिव्य पुरुष द्वारा मुक्त होने के बाद, राहु,
    जिसे अब वर्वर के नाम से जाना जाता है, जलंधर के नगर में पहुँचता है। वह दैत्यराज
    जलंधर को शिव की लीलाओं का वर्णन करता है, जिससे जलंधर क्रोधित होकर देवताओं के विरुद्ध
    युद्ध की तैयारी करता है। जलंधर के उपद्रव से व्यथित देवता कैलाश पर्वत पर शिव की
    शरण में जाते हैं और उनसे रक्षा की प्रार्थना करते हैं।
- id: vishnu-refuses-to-kill-jalandhar
  type: story
  keywords:
  - Vishnu
  - Jalandhar
  - Lakshmi
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu explains to Shiva that he did not kill the demon Jalandhar because
    Jalandhar is born from a part of Vishnu and is the brother of Lakshmi. Vishnu
    requests Shiva to kill Jalandhar as he is invincible to the gods.
  summary_hi: विष्णु शिव से कहते हैं कि उन्होंने जलंधर को नहीं मारा क्योंकि जलंधर
    विष्णु के अंश से उत्पन्न हुआ है और लक्ष्मी का भाई है। विष्णु शिव से अनुरोध करते
    हैं कि वे जलंधर का वध करें क्योंकि वह देवताओं के लिए अजेय है।
- id: shiva-promises-to-kill-jalandhar
  type: story
  keywords:
  - Shiva
  - Jalandhar
  - Devatas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva assures Vishnu and the gods that he will kill the demon Jalandhar.
    He tells them to return to their places without fear as he will take care of the
    demon.
  summary_hi: शिव विष्णु और देवताओं को आश्वासन देते हैं कि वे दानव जलंधर का वध करेंगे।
    वे उन्हें बिना भय के अपने स्थानों पर लौटने के लिए कहते हैं क्योंकि वे दानव का
    नाश करेंगे।
- id: battle-at-kailasa
  type: event
  keywords:
  - Battle
  - Kailasa
  - Demons
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A fierce battle takes place at the foothills of Kailasa between the
    forces of Shiva and the demons led by Jalandhar. The battle is intense with the
    sound of various weapons and war cries filling the air.
  summary_hi: कैलास की तलहटी में शिव की सेना और जलंधर के नेतृत्व में दानवों के बीच
    एक भयंकर युद्ध होता है। युद्ध बहुत तीव्र होता है और विभिन्न हथियारों और युद्ध
    के नारों की आवाज से वातावरण गूंज उठता है।
- id: shiva-battle-with-demons
  type: story
  keywords:
  - Shiva
  - battle
  - demons
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Lord Shiva, mounted on his bull, leads his fierce troops
    into battle against the demons. The demons, initially retreating, return to fight
    upon seeing Shiva. The battle intensifies as Shiva's forces, including his ganas,
    attack the demons with a barrage of arrows. The demon Jalandhara, along with others
    like Shumbha and Nishumbha, confronts Shiva with great ferocity.
  summary_hi: इस प्रकरण में, भगवान शिव अपने बैल पर सवार होकर अपनी उग्र सेना के साथ
    राक्षसों के खिलाफ युद्ध में जाते हैं। राक्षस, जो पहले पीछे हट गए थे, शिव को देखकर
    फिर से लड़ाई में लौट आते हैं। युद्ध तेज हो जाता है जब शिव की सेना, जिसमें उनके
    गण भी शामिल हैं, बाणों की बौछार से राक्षसों पर हमला करती है। जलंधर, शुंभ और निशुंभ
    जैसे अन्य राक्षसों के साथ, शिव का सामना बड़ी उग्रता से करता है।
- id: creation-of-kritiya
  type: story
  keywords:
  - kritiya
  - shiva
  - creation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: In response to the revival of demons by Shukracharya, Lord Shiva creates
    a terrifying entity named Kritiya. This being, with formidable features, enters
    the battlefield and begins devouring the demons, causing chaos among their ranks.
  summary_hi: शुक्राचार्य द्वारा दैत्यों को पुनर्जीवित करने के जवाब में, भगवान शिव
    एक भयानक कृत्या नामक प्राणी की रचना करते हैं। यह प्राणी, भयंकर रूप धारण कर, युद्धभूमि
    में प्रवेश करता है और दैत्यों को भक्षण करने लगता है, जिससे उनकी पंक्तियों में
    अराजकता फैल जाती है।
- id: nandi-ganesha-kartikeya-battle
  type: event
  keywords:
  - Nandi
  - Ganesha
  - Kartikeya
  - battle
  source:
    book: Shiv Puran
    sarga: अथैकविंशोऽध्यायः
  summary_en: A fierce battle ensues between the followers of Shiva, including Nandi,
    Ganesha, and Kartikeya, and the demons led by Kalnemi, Shumbha, and Nishumbha.
    The demons attack with great force, but the Shiva followers fight back valiantly,
    causing chaos on the battlefield.
  summary_hi: नंदी, गणेश और कार्तिकेय सहित शिव के अनुयायियों और कालनेमि, शुम्भ और
    निशुम्भ के नेतृत्व वाले दानवों के बीच एक भयंकर युद्ध होता है। दानव पूरी ताकत से
    हमला करते हैं, लेकिन शिव के अनुयायी बहादुरी से लड़ते हैं, जिससे युद्धभूमि में
    अराजकता फैल जाती है।
- id: kartikeya-nishumbha-duel
  type: event
  keywords:
  - Kartikeya
  - Nishumbha
  - duel
  source:
    book: Shiv Puran
    sarga: अथैकविंशोऽध्यायः
  summary_en: Kartikeya and Nishumbha engage in a fierce duel. Nishumbha attacks Kartikeya's
    peacock with arrows, causing it to fall unconscious. In retaliation, Kartikeya
    strikes back at Nishumbha's chariot and horses, leading to a heated battle between
    the two.
  summary_hi: कार्तिकेय और निशुम्भ के बीच एक भयंकर द्वंद्व होता है। निशुम्भ कार्तिकेय
    के मयूर पर बाणों से हमला करता है, जिससे वह मूर्छित होकर गिर जाता है। इसके जवाब
    में, कार्तिकेय निशुम्भ के रथ और घोड़ों पर प्रहार करता है, जिससे दोनों के बीच एक
    गरमागरम युद्ध छिड़ जाता है।
- id: nandi-kalnemi-combat
  type: event
  keywords:
  - Nandi
  - Kalnemi
  - combat
  source:
    book: Shiv Puran
    sarga: अथैकविंशोऽध्यायः
  summary_en: Nandi and Kalnemi engage in combat. Nandi attacks Kalnemi with arrows,
    damaging his chariot and horses. In response, Kalnemi cuts Nandi's bow with his
    arrows. Nandi then uses a spear to strike Kalnemi, leading to a fierce confrontation.
  summary_hi: नंदी और कालनेमि के बीच युद्ध होता है। नंदी कालनेमि पर बाणों से हमला
    करता है, जिससे उसके रथ और घोड़ों को नुकसान होता है। जवाब में, कालनेमि नंदी के
    धनुष को काट देता है। इसके बाद नंदी एक भाले से कालनेमि पर प्रहार करता है, जिससे
    एक भयंकर टकराव होता है।
- id: ganesha-shumbha-battle
  type: event
  keywords:
  - Ganesha
  - Shumbha
  - battle
  source:
    book: Shiv Puran
    sarga: अथैकविंशोऽध्यायः
  summary_en: Ganesha and Shumbha engage in battle. Ganesha strikes Shumbha with an
    arrow in the heart and defeats his charioteer. Shumbha, in anger, retaliates with
    a shower of arrows, wounding Ganesha's mouse vehicle and causing it to falter.
  summary_hi: गणेश और शुम्भ के बीच युद्ध होता है। गणेश शुम्भ के हृदय में बाण से प्रहार
    करते हैं और उसके सारथी को पराजित कर देते हैं। शुम्भ क्रोधित होकर बाणों की वर्षा
    करता है, जिससे गणेश के मूषक वाहन को चोट पहुँचती है और वह लड़खड़ाने लगता है।
- id: ganesha-battle-with-shumbha
  type: story
  keywords:
  - Ganesha
  - Shumbha
  source:
    book: Shiv Puran
    sarga: युद्धखण्ड
  summary_en: Ganesha, after falling from his mouse vehicle, engages in battle with
    the demon Shumbha. He strikes Shumbha with his axe, causing him to fall to the
    ground. Ganesha then remounts his mouse and prepares to continue the fight.
  summary_hi: गणेशजी, अपने मूषक वाहन से गिरने के बाद, शुम्भ दानव के साथ युद्ध में
    संलग्न होते हैं। वे अपने परशु से शुम्भ पर प्रहार करते हैं, जिससे वह पृथ्वी पर
    गिर जाता है। गणेशजी फिर से अपने मूषक पर सवार होकर युद्ध के लिए तैयार हो जाते हैं।
- id: kartikeya-battle-with-jalandhara
  type: story
  keywords:
  - Kartikeya
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: युद्धखण्ड
  summary_en: Kartikeya, the son of Rudra, engages in battle with the demon Jalandhara.
    Using his spear, Kartikeya strikes Jalandhara, causing the demon to fall to the
    ground. Despite being injured, Jalandhara quickly rises and retaliates by striking
    Kartikeya with a mace.
  summary_hi: रुद्रपुत्र कार्तिकेय, जलन्धर दानव के साथ युद्ध में संलग्न होते हैं।
    अपनी शक्ति का उपयोग करते हुए, कार्तिकेय जलन्धर पर प्रहार करते हैं, जिससे वह दानव
    पृथ्वी पर गिर जाता है। घायल होने के बावजूद, जलन्धर शीघ्रता से उठता है और कार्तिकेय
    पर गदा से प्रहार करता है।
- id: nandi-and-ganas-in-battle
  type: story
  keywords:
  - Nandi
  - Ganas
  source:
    book: Shiv Puran
    sarga: युद्धखण्ड
  summary_en: Nandi, along with other ganas like Veerabhadra, engages in a fierce
    battle against the demons. Despite being struck by a mace and falling to the ground,
    Nandi and the ganas continue to fight valiantly, roaring loudly in the battlefield.
  summary_hi: नन्दी, वीरभद्र जैसे अन्य गणों के साथ, दानवों के खिलाफ एक भयंकर युद्ध
    में संलग्न होते हैं। गदा से प्रहारित होकर और पृथ्वी पर गिरने के बावजूद, नन्दी
    और गण युद्धभूमि में जोर-जोर से गर्जना करते हुए वीरतापूर्वक लड़ाई जारी रखते हैं।
- id: battle-between-veerabhadra-and-jalandhara
  type: story
  keywords:
  - Veerabhadra
  - Jalandhara
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 21
  summary_en: A fierce battle takes place between Veerabhadra and the demon king Jalandhara.
    Despite Veerabhadra's valiant efforts, Jalandhara strikes him down with a powerful
    weapon, causing Veerabhadra to fall to the ground, bleeding. The Rudra Ganas,
    witnessing this, flee the battlefield in fear, calling out to Lord Shiva for help.
  summary_hi: वीरभद्र और दैत्यराज जलंधर के बीच एक भयंकर युद्ध होता है। वीरभद्र के
    वीरतापूर्ण प्रयासों के बावजूद, जलंधर एक शक्तिशाली अस्त्र से उन पर प्रहार करता
    है, जिससे वीरभद्र घायल होकर भूमि पर गिर पड़ते हैं। यह देखकर रुद्र गण भयभीत होकर
    रणभूमि से भाग जाते हैं और शिवजी को पुकारते हैं।
- id: jalandhara-challenges-shiva
  type: story
  keywords:
  - Jalandhara
  - Shiva
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Jalandhara, a powerful demon, challenges Lord Shiva to a battle. He
    boasts of his strength and previous victories over various deities, including
    Brahma and Vishnu. Jalandhara claims that he has defeated the gods and conquered
    the three worlds, and now he intends to defeat Shiva as well.
  summary_hi: जलंधर, एक शक्तिशाली दैत्य, भगवान शिव को युद्ध के लिए चुनौती देता है।
    वह अपनी शक्ति और ब्रह्मा और विष्णु सहित विभिन्न देवताओं पर अपनी पूर्व जीत का दावा
    करता है। जलंधर कहता है कि उसने देवताओं को पराजित कर तीनों लोकों पर विजय प्राप्त
    की है और अब वह शिव को भी पराजित करना चाहता है।
- id: jalandhara-battle-with-shiva
  type: story
  keywords:
  - Jalandhara
  - Shiva
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: In a fierce battle, the demon Jalandhara challenges Lord Shiva. Despite
    Jalandhara's initial attack with arrows, Shiva easily deflects them and disarms
    Jalandhara by cutting his bow, chariot, and horses. Enraged, Jalandhara charges
    at Shiva with a mace, but Shiva effortlessly destroys it. Jalandhara then attempts
    to use his magical powers to confuse Shiva with illusions.
  summary_hi: एक भयंकर युद्ध में, दानव जलंधर भगवान शिव को चुनौती देता है। जलंधर के
    प्रारंभिक तीरों के हमले के बावजूद, शिव उन्हें आसानी से काट देते हैं और जलंधर के
    धनुष, रथ और घोड़ों को काटकर उसे निरस्त्र कर देते हैं। क्रोधित होकर, जलंधर गदा
    लेकर शिव की ओर दौड़ता है, लेकिन शिव उसे आसानी से नष्ट कर देते हैं। जलंधर फिर अपनी
    मायावी शक्तियों का उपयोग करके शिव को भ्रमित करने का प्रयास करता है।
- id: rudra-mesmerized-by-gandharvas
  type: event
  keywords:
  - Rudra
  - Gandharvas
  - Apsaras
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 22
  summary_en: Rudra becomes mesmerized by the dance and music of the Gandharvas and
    Apsaras on the battlefield, losing focus on his weapons.
  summary_hi: रुद्र गन्धर्वों और अप्सराओं के नृत्य और संगीत से मोहित हो जाते हैं और
    रणभूमि में अपने अस्त्रों पर ध्यान खो बैठते हैं।
- id: jalandhara-deceives-parvati
  type: story
  keywords:
  - Jalandhara
  - Parvati
  - Deception
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 22
  summary_en: Jalandhara, using his demonic powers, disguises himself to look like
    Shiva and approaches Parvati. Parvati, realizing the deception, becomes frightened
    and disappears.
  summary_hi: जलन्धर अपनी मायावी शक्तियों का उपयोग करके शिव का रूप धारण कर पार्वती
    के पास पहुँचता है। पार्वती इस छल को समझकर भयभीत हो जाती हैं और अंतर्धान हो जाती
    हैं।
- id: parvati-requests-vishnu-to-break-vrinda-pativrata
  type: story
  keywords:
  - Parvati
  - Vishnu
  - Vrinda
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 22
  summary_en: Parvati instructs Vishnu to break the chastity of Vrinda, Jalandhara's
    wife, as it is the only way to defeat the demon Jalandhara. Vishnu agrees to follow
    Parvati's command.
  summary_hi: पार्वती विष्णु से जलन्धर की पत्नी वृन्दा के पातिव्रत्य को भंग करने का
    अनुरोध करती हैं, क्योंकि यही जलन्धर को पराजित करने का एकमात्र उपाय है। विष्णु
    पार्वती की आज्ञा का पालन करने के लिए सहमत होते हैं।
- id: vrinda-dream-episode
  type: story
  keywords:
  - Vrinda
  - dream
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vrinda, the devoted wife of Jalandhara, experiences a series of ominous
    dreams. She sees her husband riding a buffalo, adorned with black flowers, heading
    south with demons, and her city submerged in the ocean. These dreams leave her
    distressed and fearful.
  summary_hi: वृन्दा, जलंधर की पतिव्रता पत्नी, कई अशुभ स्वप्न देखती है। वह अपने पति
    को भैंसे पर सवार, काले पुष्पों से विभूषित, राक्षसों के साथ दक्षिण दिशा की ओर जाते
    हुए और अपने नगर को समुद्र में डूबते हुए देखती है। ये स्वप्न उसे चिंतित और भयभीत
    कर देते हैं।
- id: vrinda-meets-sage-episode
  type: story
  keywords:
  - Vrinda
  - sage
  - demons
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vrinda, pursued by two terrifying demons, seeks refuge with a sage she
    encounters in the forest. The sage, with a mere utterance, drives the demons away,
    leaving Vrinda amazed and relieved. She expresses her gratitude and inquires about
    her husband Jalandhara's fate in his battle with Rudra.
  summary_hi: दो भयानक राक्षसों द्वारा पीछा की जा रही वृन्दा एक तपस्वी के पास शरण
    लेती है, जिसे वह वन में मिलती है। तपस्वी अपने हुंकार से राक्षसों को भगा देता है,
    जिससे वृन्दा विस्मित और राहत महसूस करती है। वह अपनी कृतज्ञता व्यक्त करती है और
    अपने पति जलंधर के रुद्र के साथ युद्ध में भाग्य के बारे में पूछती है।
- id: jalandhara-battle-and-revival
  type: story
  keywords:
  - Jalandhara
  - Vrinda
  - Sanatkumara
  source:
    book: Shiv Puran
    sarga: Chapter 22
  summary_en: Jalandhara, a demon king, goes to battle against Rudra (Shiva) and is
    killed. His wife, Vrinda, mourns his death and pleads with the sage Sanatkumara
    to revive him. Despite the impossibility of reviving someone killed by Rudra,
    Sanatkumara, moved by compassion and the eternal duty to protect those who seek
    refuge, revives Jalandhara.
  summary_hi: जलन्धर, एक दैत्य राजा, रुद्र (शिव) के खिलाफ युद्ध में जाता है और मारा
    जाता है। उसकी पत्नी वृन्दा उसके मृत्यु पर शोक करती है और मुनि सनत्कुमार से उसे
    पुनर्जीवित करने की प्रार्थना करती है। रुद्र द्वारा मारे गए व्यक्ति को पुनर्जीवित
    करना असंभव होने के बावजूद, सनत्कुमार, करुणा से प्रेरित होकर और शरणागत की रक्षा
    के शाश्वत धर्म को जानते हुए, जलन्धर को पुनर्जीवित कर देते हैं।
- id: vrinda-curse-on-vishnu
  type: story
  keywords:
  - Vrinda
  - Vishnu
  - Curse
  source:
    book: Shiv Puran
    sarga: Chapter 22
  summary_en: After being revived, Jalandhara and Vrinda live happily for some time.
    However, Vrinda discovers Vishnu's deception and curses him for his actions. She
    curses Vishnu to suffer the consequences of his deceit, leading to his future
    troubles.
  summary_hi: पुनर्जीवित होने के बाद, जलन्धर और वृन्दा कुछ समय के लिए सुखपूर्वक रहते
    हैं। हालांकि, वृन्दा विष्णु के छल को जानकर उसे उसके कार्यों के लिए शाप देती है।
    वह विष्णु को उसके छल के परिणाम भुगतने का शाप देती है, जिससे उसके भविष्य में समस्याएं
    उत्पन्न होती हैं।
- id: vrinda-curse-and-sacrifice
  type: story
  keywords:
  - Vrinda
  - Vishnu
  - curse
  - sacrifice
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Vrinda, the devoted wife of the demon Jalandhar, curses Vishnu for deceiving
    her and causing her husband's death. Despite Vishnu's attempts to stop her, she
    enters the fire in deep meditation on her husband, achieving liberation. Her energy
    merges with Parvati, and the gods witness her ultimate sacrifice.
  summary_hi: वृन्दा, जो दैत्य जलन्धर की पतिव्रता पत्नी थी, विष्णु को धोखा देने और
    उसके पति की मृत्यु का कारण बनने के लिए शाप देती है। विष्णु के रोकने के प्रयासों
    के बावजूद, वह अपने पति का ध्यान करते हुए अग्नि में प्रवेश कर जाती है और मोक्ष
    प्राप्त करती है। उसकी ऊर्जा पार्वती में विलीन हो जाती है और देवता उसकी अंतिम बलिदान
    को देखते हैं।
- id: jalandhar-battle-and-death
  type: story
  keywords:
  - Jalandhar
  - Shiva
  - battle
  - death
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The demon king Jalandhar engages in a fierce battle with Lord Shiva.
    Despite using illusions to confuse Shiva, Jalandhar is ultimately defeated when
    Shiva, realizing the deception, fights back with great fury and cuts off Jalandhar's
    head with his chakra, bringing peace to the world.
  summary_hi: दैत्यराज जलन्धर भगवान शिव के साथ घोर संग्राम में संलग्न होता है। शिव
    को भ्रमित करने के लिए माया का उपयोग करने के बावजूद, जलन्धर अंततः पराजित हो जाता
    है जब शिव, धोखे को समझकर, अत्यधिक क्रोध के साथ लड़ते हैं और अपने चक्र से जलन्धर
    का सिर काट देते हैं, जिससे संसार में शांति फैलती है।
- id: jalandhara-vadha-episode
  type: story
  keywords:
  - Jalandhara
  - Shiva
  - Sudarshana Chakra
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 24
  summary_en: In this episode, Lord Shiva defeats the demon Jalandhara. Despite Jalandhara's
    arrogance and insults, Shiva remains composed and ultimately uses the Sudarshana
    Chakra, created from his toe, to decapitate Jalandhara. The demon's death brings
    peace and joy to the universe, as the gods and celestial beings celebrate Shiva's
    victory.
  summary_hi: इस प्रकरण में भगवान शिव दानव जलंधर को पराजित करते हैं। जलंधर के अहंकार
    और अपमानजनक शब्दों के बावजूद, शिव शांत रहते हैं और अंततः अपने पैर के अंगूठे से
    निर्मित सुदर्शन चक्र का उपयोग करके जलंधर का सिर काट देते हैं। दानव की मृत्यु से
    ब्रह्मांड में शांति और आनंद फैल जाता है, और देवता और दिव्य प्राणी शिव की विजय
    का उत्सव मनाते हैं।
- id: dasa-kalavati-devotion
  type: story
  keywords:
  - devotion
  - siddhi
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In ancient times, a devotee named Dasa and his wife Kalavati attained
    spiritual success through their devotion to Lord Shiva. Their unwavering faith
    and dedication led them to achieve siddhi, a state of spiritual accomplishment.
  summary_hi: प्राचीन समय में, दासा नामक भक्त और उनकी पत्नी कलावती ने भगवान शिव की
    भक्ति के माध्यम से आध्यात्मिक सफलता प्राप्त की। उनकी अटल श्रद्धा और समर्पण ने
    उन्हें सिद्धि, एक आध्यात्मिक उपलब्धि की स्थिति, प्राप्त करने में मदद की।
- id: mitrasaha-madayanti-liberation
  type: story
  keywords:
  - liberation
  - devotion
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: King Mitrasaha and his wife Madayanti achieved the highest state of
    liberation, known as Kaivalya, through their devotion to Lord Shiva. Their spiritual
    journey exemplifies the power of sincere devotion in attaining ultimate freedom.
  summary_hi: राजा मित्रसह और उनकी पत्नी मदयन्ती ने भगवान शिव की भक्ति के माध्यम से
    कैवल्य के रूप में जानी जाने वाली उच्चतम मुक्ति की स्थिति प्राप्त की। उनकी आध्यात्मिक
    यात्रा सच्ची भक्ति की शक्ति को अंतिम स्वतंत्रता प्राप्त करने में दर्शाती है।
- id: saumini-devotion
  type: story
  keywords:
  - devotion
  - happiness
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Saumini, the daughter of the King of Kekaya, attained supreme happiness,
    which is difficult even for great yogis to achieve, through her devotion to Lord
    Shiva. Her story highlights the transformative power of devotion.
  summary_hi: केकय के राजा की पुत्री सौमिनी ने भगवान शिव की भक्ति के माध्यम से महान
    योगियों के लिए भी कठिन परम सुख प्राप्त किया। उनकी कहानी भक्ति की परिवर्तनकारी
    शक्ति को उजागर करती है।
- id: chandrasena-devotion
  type: story
  keywords:
  - devotion
  - liberation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: King Chandrasena, through his devotion to Lord Shiva, was freed from
    suffering and enjoyed various pleasures in both this world and the next. His devotion
    led him to ultimate liberation.
  summary_hi: राजा चन्द्रसेन ने भगवान शिव की भक्ति के माध्यम से दुःख से मुक्ति पाई
    और इस लोक और परलोक में विभिन्न सुखों का आनंद लिया। उनकी भक्ति ने उन्हें अंतिम
    मुक्ति की ओर अग्रसर किया।
- id: gopiputra-srikara-devotion
  type: story
  keywords:
  - devotion
  - happiness
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Gopiputra Srikara, a disciple of Mahavir, experienced supreme happiness
    in this world and attained liberation in the next through his devotion to Lord
    Shiva. His story is a testament to the joy and fulfillment that devotion can bring.
  summary_hi: महावीर के शिष्य गोपीपुत्र श्रीकर ने भगवान शिव की भक्ति के माध्यम से
    इस लोक में परम सुख का अनुभव किया और परलोक में मुक्ति प्राप्त की। उनकी कहानी भक्ति
    से मिलने वाले आनंद और संतोष का प्रमाण है।
- id: shuchivrata-brahmin-transformation
  type: story
  keywords:
  - transformation
  - devotion
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A Brahmin named Shuchivrata, guided by his mother's teachings, became
    wealthy and wise through his devotion to Lord Shiva. This transformation showcases
    the profound impact of devotion and guidance.
  summary_hi: शुचिव्रत नामक एक ब्राह्मण, अपनी माता के उपदेशों से प्रेरित होकर भगवान
    शिव की भक्ति के माध्यम से धनवान और ज्ञानी बन गया। यह परिवर्तन भक्ति और मार्गदर्शन
    के गहरे प्रभाव को दर्शाता है।
- id: chandrangada-devotion
  type: story
  keywords:
  - devotion
  - liberation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Prince Chandrangada, along with his wife, achieved great happiness and
    liberation through their devotion to Lord Shiva. Their story illustrates the power
    of devotion in overcoming worldly sorrows and attaining spiritual goals.
  summary_hi: राजकुमार चन्द्रांगद ने अपनी पत्नी के साथ भगवान शिव की भक्ति के माध्यम
    से महान सुख और मुक्ति प्राप्त की। उनकी कहानी भक्ति की शक्ति को सांसारिक दुखों
    को दूर करने और आध्यात्मिक लक्ष्यों को प्राप्त करने में दर्शाती है।
- id: mandara-brahmin-redemption
  type: story
  keywords:
  - redemption
  - devotion
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A Brahmin named Mandara, despite being a sinner and indulging in vices,
    attained redemption and liberation through his devotion to Lord Shiva. His story
    is a powerful example of how devotion can lead to spiritual redemption.
  summary_hi: मन्दर नामक एक ब्राह्मण, जो पापी और दुर्व्यसनों में लिप्त था, भगवान शिव
    की भक्ति के माध्यम से मुक्ति और उद्धार प्राप्त किया। उनकी कहानी यह दर्शाती है
    कि भक्ति कैसे आध्यात्मिक उद्धार की ओर ले जा सकती है।
- id: bhadrasena-son-liberation
  type: story
  keywords:
  - bhadrasena
  - liberation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The son of Bhadrasena and the son of his minister, who were devoted
    to good deeds and always wore Rudraksha, attained liberation and happiness in
    this world through Shiva's grace. In their previous birth, they were a monkey
    and a rooster who wore Rudraksha.
  summary_hi: भद्रसेन का पुत्र और उसके मंत्री का पुत्र, जो उत्तम धर्म और शुभ कर्म
    करते थे और सदा रुद्राक्ष धारण करते थे, शिव की कृपा से इस लोक में उत्तम सुख भोगकर
    मुक्त हो गए। अपने पूर्वजन्म में वे कपि और कुक्कुट थे जो रुद्राक्ष धारण करते थे।
- id: pingala-mahananda-salvation
  type: story
  keywords:
  - pingala
  - mahananda
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Pingala and Mahananda, two courtesans, attained salvation through their
    devotion to Shiva. Their devotion led them to a higher state of existence.
  summary_hi: पिंगला और महानन्दा नामक दो वेश्याएँ शिव की भक्ति से सद्गति को प्राप्त
    हुईं। उनकी भक्ति ने उन्हें उच्च अवस्था में पहुँचाया।
- id: sharada-blessing
  type: story
  keywords:
  - sharada
  - blessing
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: A Brahmin's daughter named Sharada, who became a child widow, was blessed
    with a son and prosperity through her devotion to Shiva.
  summary_hi: शारदा नामक ब्राह्मण कन्या, जो बालविधवा हो गई थी, शिव की भक्ति के प्रभाव
    से पुत्रवती और सौभाग्यवती हो गई।
- id: binduga-chanchula-salvation
  type: story
  keywords:
  - binduga
  - chanchula
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Binduga, a nominal Brahmin and a frequenter of courtesans, along with
    his wife Chanchula, attained a higher state after hearing the glory of Shiva.
  summary_hi: नाममात्र का ब्राह्मण बिन्दुग और उसकी पत्नी चंचुला, जो वेश्यागामी थे,
    शिव का यश श्रवण कर परम गतिको प्राप्त हुए।
- id: shiva-instructs-devas
  type: story
  keywords:
  - shiva
  - devas
  - maya
  source:
    book: Shiv Puran
    sarga: अथ षड्विंशोऽध्यायः
  summary_en: Shiva instructs the devas on how to dispel Vishnu's delusion caused
    by his own maya. He explains that his maya is difficult to overcome and has even
    affected Vishnu, making him succumb to desires.
  summary_hi: शिव देवताओं को बताते हैं कि विष्णु के मोह को कैसे दूर किया जाए, जो उनकी
    माया के कारण हुआ है। वे समझाते हैं कि उनकी माया को पार करना कठिन है और इसने विष्णु
    को भी प्रभावित किया है, जिससे वे काम के अधीन हो गए हैं।
- id: vishnu-deluded-by-maya
  type: story
  keywords:
  - vishnu
  - maya
  - delusion
  source:
    book: Shiv Puran
    sarga: अथ षड्विंशोऽध्यायः
  summary_en: Vishnu becomes deluded by Shiva's maya and is unable to comprehend the
    situation despite being advised by sages and devas. This delusion leads him to
    be infatuated with Vrinda's beauty.
  summary_hi: विष्णु शिव की माया से मोहित हो जाते हैं और ऋषियों और देवताओं द्वारा
    सलाह दिए जाने के बावजूद स्थिति को समझ नहीं पाते। इस मोह के कारण वे वृंदा के सौंदर्य
    पर मोहित हो जाते हैं।
- id: vrinda-immolation
  type: story
  keywords:
  - vrinda
  - immolation
  - liberation
  source:
    book: Shiv Puran
    sarga: अथ षड्विंशोऽध्यायः
  summary_en: Vrinda, deluded by Vishnu, immolates herself and attains liberation.
    Her beauty had captivated Vishnu, leading to his delusion.
  summary_hi: वृंदा, जो विष्णु द्वारा मोहित हो गई थी, आत्मदाह कर लेती है और मुक्ति
    प्राप्त करती है। उनका सौंदर्य विष्णु को मोहित कर देता है, जिससे उनका मोह होता
    है।
- id: shiva-disappears-with-ganas
  type: event
  keywords:
  - Shiva
  - disappearance
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After addressing the gods, Lord Shiva, along with his attendants, disappears
    from sight. Following Shiva's command, Indra and other deities begin to praise
    the primordial nature with devotion.
  summary_hi: भगवान शिव ने देवताओं से बात करने के बाद अपने गणों के साथ अंतर्धान हो
    गए। शिव के आदेश के अनुसार, इंद्र और अन्य देवता भक्ति के साथ मूलप्रकृति की स्तुति
    करने लगे।
- id: praise-of-primordial-nature
  type: concept
  keywords:
  - primordial nature
  - praise
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The deities praise the primordial nature, acknowledging it as the source
    of creation, maintenance, and destruction of the universe. They express reverence
    for its supreme power and qualities that are beyond the understanding of the three
    worlds.
  summary_hi: देवता मूलप्रकृति की स्तुति करते हैं, इसे सृष्टि, पालन और संहार का स्रोत
    मानते हुए। वे इसकी सर्वोच्च शक्ति और गुणों के लिए सम्मान प्रकट करते हैं, जो तीनों
    लोकों की समझ से परे हैं।
- id: jalandhara-vadha
  type: event
  keywords:
  - Jalandhara
  - battle
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a battle, Lord Shiva, following the command of Goddess Gauri, defeats
    and kills the demon Jalandhara. This act liberates the gods from the fear of Jalandhara.
  summary_hi: एक युद्ध में, भगवान शिव, देवी गौरी के आदेश का पालन करते हुए, राक्षस
    जलंधर को पराजित और वध करते हैं। इस कार्य से देवताओं को जलंधर के भय से मुक्ति मिलती
    है।
- id: vishnu-bewildered-by-vrinda
  type: story
  keywords:
  - Vishnu
  - Vrinda
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Vishnu, bewildered by Vrinda's beauty, becomes deluded and loses
    his knowledge. He stands there, covered in ashes from the pyre, unable to comprehend
    his surroundings.
  summary_hi: भगवान विष्णु, वृंदा के सौंदर्य से भ्रमित होकर, मोहग्रस्त हो जाते हैं
    और अपना ज्ञान खो देते हैं। वह चिता की भस्म से ढके हुए वहीं खड़े रहते हैं, अपने
    परिवेश को समझने में असमर्थ।
- id: divine-appeal-to-mahadevi
  type: event
  keywords:
  - Mahadevi
  - Vishnu
  - divine-intervention
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, unable to make Vishnu understand their plight, appeal to Mahadevi
    for assistance. They request her to enlighten Vishnu so that he can protect his
    realm and fulfill the duties of the gods.
  summary_hi: देवता, विष्णु को अपनी स्थिति समझाने में असमर्थ होकर, महादेवी से सहायता
    की अपील करते हैं। वे उनसे अनुरोध करते हैं कि वे विष्णु को समझाएं ताकि वह अपने
    लोक की रक्षा कर सके और देवताओं के कार्यों को पूरा कर सके।
- id: celestial-voice-guidance
  type: event
  keywords:
  - celestial-voice
  - divine-guidance
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A celestial voice emanates from a radiant sphere in the sky, instructing
    the gods to approach the three goddesses—Gauri, Lakshmi, and Suradevi—who will
    fulfill their desires. The gods, inspired by this guidance, proceed to honor the
    goddesses.
  summary_hi: आकाश में एक तेजोमंडल से एक आकाशवाणी होती है, जो देवताओं को तीन देवियों—गौरी,
    लक्ष्मी और सुरादेवी—के पास जाने का निर्देश देती है, जो उनकी इच्छाओं को पूरा करेंगी।
    इस मार्गदर्शन से प्रेरित होकर देवता देवियों का सम्मान करने के लिए आगे बढ़ते हैं।
- id: planting-of-divine-seeds
  type: event
  keywords:
  - divine-seeds
  - Vishnu
  - plant-creation
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The goddesses give the gods divine seeds to plant at the location where
    Vishnu resides. Upon planting these seeds, three plants—Dhatri, Malati, and Tulsi—emerge,
    each embodying aspects of the goddesses.
  summary_hi: देवियाँ देवताओं को दिव्य बीज देती हैं, जिन्हें विष्णु के निवास स्थान
    पर बोने के लिए कहा जाता है। इन बीजों को बोने पर तीन वनस्पतियाँ—धात्री, मालती,
    और तुलसी—उत्पन्न होती हैं, जो देवियों के विभिन्न अंशों का प्रतिनिधित्व करती हैं।
- id: vishnu-and-the-divine-plants
  type: story
  keywords:
  - Vishnu
  - Tulsi
  - divine-love
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu becomes enamored with the divine plants, particularly Tulsi and
    Dhatri, and expresses his love for them. This interaction leads to a transformation
    where the plants take on feminine forms, and Vishnu's sorrow is alleviated as
    he returns to Vaikuntha with them.
  summary_hi: विष्णु दिव्य वनस्पतियों, विशेष रूप से तुलसी और धात्री, के प्रति आकर्षित
    हो जाते हैं और उनके प्रति प्रेम व्यक्त करते हैं। इस संपर्क से वनस्पतियाँ स्त्री
    रूप धारण कर लेती हैं, और विष्णु का दुःख दूर हो जाता है क्योंकि वे उनके साथ वैकुण्ठ
    लौट जाते हैं।
- id: shankhchuda-origin-story
  type: story
  keywords:
  - Shankhchuda
  - origin
  - demon
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The passage narrates the origin story of Shankhchuda, a powerful demon
    who was a thorn in the side of the gods. He was born to Danu, a virtuous and beautiful
    wife of Kashyapa, and was known for his immense strength and valor. Shankhchuda's
    story is part of the divine and purifying tales of Shiva.
  summary_hi: यह अंश शंखचूड की उत्पत्ति की कथा बताता है, जो देवताओं के लिए एक शक्तिशाली
    दानव और कांटा था। वह कश्यप की पत्नी दनु से उत्पन्न हुआ था, जो एक सदाचारी और सुंदर
    स्त्री थी। शंखचूड अपनी अपार शक्ति और पराक्रम के लिए जाना जाता था। शंखचूड की कथा
    शिव के दिव्य और पवित्र करने वाले चरित्रों का हिस्सा है।
- id: shankhchuda-demon-story
  type: story
  keywords:
  - Shankhchuda
  - demon
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Shankhchuda was a demon who was a thorn for the gods. The narrative
    describes how Lord Shiva vanquished him in battle. This story is considered sacred
    and purifying.
  summary_hi: शंखचूड एक दानव था जो देवताओं के लिए कण्टक था। इस कथा में बताया गया है
    कि भगवान शिव ने युद्ध में उसका वध कैसे किया। यह कथा पवित्र और पापनाशक मानी जाती
    है।
- id: dambha-demon-tapasya
  type: story
  keywords:
  - Dambha
  - tapasya
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Dambha, a demon and devotee of Vishnu, performed severe penance for
    a son. His intense tapasya caused distress among the gods, who approached Brahma
    and Vishnu for help. Vishnu assured them that he would grant Dambha a boon to
    calm him.
  summary_hi: दंभ नामक दानव, जो विष्णु का भक्त था, पुत्र प्राप्ति के लिए घोर तपस्या
    कर रहा था। उसकी तपस्या से देवता परेशान हो गए और ब्रह्मा और विष्णु के पास सहायता
    के लिए गए। विष्णु ने उन्हें आश्वासन दिया कि वह दंभ को वरदान देकर शांत करेंगे।
- id: dambha-boon-from-vishnu
  type: story
  keywords:
  - Dambha
  - Vishnu
  source:
    book: Shiv Puran
    sarga: '27'
  summary_en: The demon Dambha performs intense penance to please Vishnu. Pleased
    with his devotion, Vishnu grants him a boon. Dambha requests a powerful and invincible
    son who can conquer the three worlds.
  summary_hi: दानव दंभ विष्णु को प्रसन्न करने के लिए कठोर तप करता है। उसकी भक्ति से
    प्रसन्न होकर, विष्णु उसे वरदान देते हैं। दंभ एक शक्तिशाली और अजेय पुत्र की मांग
    करता है जो तीनों लोकों को जीत सके।
- id: birth-of-shankhchuda
  type: story
  keywords:
  - Shankhchuda
  - Birth
  source:
    book: Shiv Puran
    sarga: '27'
  summary_en: Shankhchuda is born to the demon Dambha and his wife. He is a radiant
    child, and a grand celebration is held for his birth. Shankhchuda grows up to
    be a learned and beloved figure in his family.
  summary_hi: शंखचूड़ का जन्म दानव दंभ और उसकी पत्नी से होता है। वह एक तेजस्वी बालक
    है, और उसके जन्म पर एक भव्य उत्सव मनाया जाता है। शंखचूड़ बड़ा होकर एक विद्वान
    और अपने परिवार में प्रिय व्यक्ति बनता है।
- id: shankhchuda-tapasya-and-boon
  type: story
  keywords:
  - Shankhchuda
  - Tapasya
  - Boon
  source:
    book: Shiv Puran
    sarga: '28'
  summary_en: Shankhchuda performs penance at Pushkar under the guidance of sage Jaigishavya.
    Brahma, pleased with his devotion, grants him invincibility and the divine Krishna
    Kavach. Brahma also instructs him to marry Tulsi.
  summary_hi: शंखचूड़ महर्षि जैगीषव्य के मार्गदर्शन में पुष्कर में तपस्या करते हैं।
    उनकी भक्ति से प्रसन्न होकर, ब्रह्मा उन्हें अजेयता और दिव्य कृष्ण कवच प्रदान करते
    हैं। ब्रह्मा उन्हें तुलसी से विवाह करने का निर्देश भी देते हैं।
- id: shankhchuda-boon-from-brahma
  type: story
  keywords:
  - Shankhchuda
  - Brahma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: In Pushkar, the demon Shankhchuda performs penance to receive a boon
    from Lord Brahma. Pleased with his devotion, Brahma grants him a boon that the
    gods cannot defeat him and gives him a divine Krishna Kavach for victory.
  summary_hi: पुष्कर में, शंखचूड दानव ब्रह्मा से वर प्राप्त करने के लिए तप करता है।
    उसकी भक्ति से प्रसन्न होकर, ब्रह्मा उसे वरदान देते हैं कि देवता उसे पराजित नहीं
    कर सकते और उसे विजय के लिए दिव्य कृष्ण कवच प्रदान करते हैं।
- id: shankhchuda-tulsi-marriage
  type: story
  keywords:
  - Shankhchuda
  - Tulsi
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Following Brahma's advice, Shankhchuda goes to Badrikashram to marry
    Tulsi, who is performing penance there. Tulsi, the daughter of Dharmadhvaja, is
    destined to marry Shankhchuda, and they engage in a conversation leading to their
    union.
  summary_hi: ब्रह्मा की सलाह के अनुसार, शंखचूड बदरिकाश्रम जाते हैं जहाँ तुलसी तप
    कर रही होती हैं। धर्मध्वज की पुत्री तुलसी शंखचूड से विवाह के लिए नियत होती हैं,
    और उनके बीच वार्तालाप होता है जो उनके विवाह की ओर अग्रसर होता है।
- id: tulsi-shankhchuda-dialogue
  type: story
  keywords:
  - Tulsi
  - Shankhchuda
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Tulsi, engaged in penance, is approached by Shankhchuda, a demon who
    reveals his past life as Sudama, a companion of Krishna. He expresses his intention
    to marry Tulsi through Gandharva marriage, as ordained by Brahma. Tulsi, initially
    hesitant, is convinced by Shankhchuda's respectful words and agrees to the union.
  summary_hi: तुलसी, जो तपस्या में लीन है, शंखचूड़ द्वारा संपर्क की जाती है, जो अपने
    पूर्व जीवन को कृष्ण के साथी सुदामा के रूप में प्रकट करता है। वह ब्रह्मा की आज्ञा
    से गान्धर्व विवाह के माध्यम से तुलसी से विवाह करने की इच्छा व्यक्त करता है। शंखचूड़
    के आदरपूर्ण शब्दों से प्रभावित होकर तुलसी इस विवाह के लिए सहमत हो जाती है।
- id: shankhchuda-marriage-story
  type: story
  keywords:
  - Shankhchuda
  - Tulsi
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 28
  summary_en: The passage describes the marriage of the demon Shankhchuda with Tulsi.
    After receiving a boon, Shankhchuda marries Tulsi through a Gandharva marriage,
    and they live happily together.
  summary_hi: यह अंश दानव शंखचूड और तुलसी के विवाह का वर्णन करता है। वर प्राप्त करने
    के बाद, शंखचूड तुलसी से गंधर्व विवाह करता है और वे सुखपूर्वक साथ रहते हैं।
- id: shankhchuda-coronation-and-victory
  type: event
  keywords:
  - Shankhchuda
  - coronation
  - victory
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 29
  summary_en: Shankhchuda is crowned as the king of demons by his guru Shukracharya.
    He then leads the demons to victory over the gods, causing the gods to seek refuge
    in caves.
  summary_hi: शंखचूड को उसके गुरु शुक्राचार्य द्वारा दानवों का राजा बनाया जाता है।
    इसके बाद वह दानवों को देवताओं पर विजय दिलाता है, जिससे देवता गुफाओं में शरण लेते
    हैं।
- id: shankhchuda-conquest-of-heaven
  type: story
  keywords:
  - shankhchuda
  - indra
  - battle
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shankhchuda, the valiant son of Dambha, ascended to power and led a
    massive army of demons to conquer Indra's abode. A fierce battle ensued between
    the gods and demons, resulting in the defeat of the gods. Shankhchuda became the
    ruler of the heavens, taking control of all the worlds and the offerings of the
    sacrifices.
  summary_hi: दम्भपुत्र शंखचूड ने शक्ति प्राप्त कर दैत्यों की विशाल सेना के साथ इन्द्रपुरी
    पर विजय प्राप्त करने के लिए आक्रमण किया। देवताओं और दैत्यों के बीच घोर युद्ध हुआ,
    जिसमें देवता पराजित हुए। शंखचूड ने सभी लोकों और यज्ञों के भागों पर अधिकार कर लिया।
- id: shankhchuda-rule-and-prosperity
  type: story
  keywords:
  - shankhchuda
  - prosperity
  - rule
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Under Shankhchuda's rule, the world experienced unprecedented prosperity.
    There were no famines, diseases, or inauspicious planetary influences. The earth
    yielded crops without plowing, and nature flourished with abundant fruits, herbs,
    and gems. All beings, except the gods, lived in happiness and harmony.
  summary_hi: शंखचूड के शासनकाल में संसार ने अद्वितीय समृद्धि का अनुभव किया। कोई दुर्भिक्ष,
    रोग या अशुभ ग्रह नहीं थे। पृथ्वी बिना जोते ही फसलें देती थी, और प्रकृति में फल,
    औषधियाँ और रत्न प्रचुर मात्रा में थे। देवताओं को छोड़कर सभी प्राणी सुखी और संतुष्ट
    थे।
- id: shankhchuda-devotion-to-krishna
  type: character
  keywords:
  - shankhchuda
  - krishna
  - devotion
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shankhchuda, despite being born in the demon lineage due to a curse,
    was a devout follower of Lord Krishna. He was known for his saintly nature and
    resided in Goloka, constantly engaged in devotion to Krishna.
  summary_hi: शंखचूड, जो पूर्वजन्म के शाप के कारण दानव कुल में जन्मा था, भगवान श्रीकृष्ण
    का परम भक्त था। वह अपने साधु स्वभाव के लिए जाना जाता था और गोलोक में निवास करता
    था, जहाँ वह श्रीकृष्ण की भक्ति में निरंतर लीन रहता था।
- id: shankhchuda-story
  type: story
  keywords:
  - shankhchuda
  - brahma
  - vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: The gods, having been defeated and deprived of their kingdom, approach
    Brahma for help. Brahma, along with the gods, goes to Vaikuntha to seek Lord Vishnu's
    assistance. Vishnu, aware of the troubles caused by Shankhchuda, listens to Brahma's
    account and assures them that Shiva will take care of the situation.
  summary_hi: देवताओं को पराजित और राज्य से वंचित होने के बाद, वे ब्रह्मा के पास सहायता
    के लिए जाते हैं। ब्रह्मा, देवताओं के साथ, भगवान विष्णु की सहायता के लिए वैकुंठ
    जाते हैं। विष्णु, शंखचूड़ द्वारा उत्पन्न समस्याओं से अवगत होकर, ब्रह्मा की बात
    सुनते हैं और उन्हें आश्वस्त करते हैं कि शिव इस स्थिति का समाधान करेंगे।
- id: nandi-gatekeeper-episode
  type: character
  keywords:
  - Nandi
  - gatekeeper
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: In this episode, Vishnu encounters Nandi, the gatekeeper, at a grand
    entrance. After respectfully greeting and praising Nandi, Vishnu receives permission
    to enter further into the divine realm.
  summary_hi: इस प्रकरण में, विष्णु एक भव्य द्वार पर नंदी, द्वारपाल से मिलते हैं।
    नंदी को आदरपूर्वक नमस्कार और स्तुति करने के बाद, विष्णु को दिव्य क्षेत्र में आगे
    प्रवेश करने की अनुमति मिलती है।
- id: shiva-mahasabha-episode
  type: story
  keywords:
  - Shiva
  - assembly
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Vishnu and others witness the grand assembly of Shiva, characterized
    by its immense beauty and divine presence. Shiva is depicted with multiple arms,
    faces, and adorned with sacred ash and rudraksha beads, surrounded by devoted
    attendants.
  summary_hi: विष्णु और अन्य लोग शिव की भव्य महासभा का दर्शन करते हैं, जो अपनी अपार
    सुंदरता और दिव्य उपस्थिति से युक्त है। शिव को कई भुजाओं, मुखों के साथ चित्रित
    किया गया है और वे पवित्र भस्म और रुद्राक्ष की मालाओं से अलंकृत हैं, भक्तिपूर्ण
    सेवकों से घिरे हुए हैं।
- id: shiva-divine-form-episode
  type: concept
  keywords:
  - Shiva
  - divine form
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: The passage describes Shiva's divine form as transcending the three
    gunas, being the creator of the three deities, and possessing both formless and
    manifest aspects. Shiva is portrayed as the supreme being beyond maya and the
    ultimate reality.
  summary_hi: यह अंश शिव के दिव्य स्वरूप का वर्णन करता है, जो तीन गुणों से परे है,
    तीन देवताओं के सृजनकर्ता हैं, और निराकार एवं साकार दोनों रूपों को धारण करते हैं।
    शिव को माया से परे और परम वास्तविकता के रूप में चित्रित किया गया है।
- id: shankhchuda-curse-and-reincarnation
  type: story
  keywords:
  - Shankhchuda
  - Sudama
  - Krishna
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: In this episode, it is revealed that Shankhchuda, a demon causing distress
    to the gods, was originally Sudama, a devoted follower of Krishna. Due to a curse,
    Sudama was reborn as Shankhchuda. The gods, including Brahma and Vishnu, seek
    Shiva's help to defeat Shankhchuda and restore peace.
  summary_hi: इस प्रकरण में यह प्रकट होता है कि शंखचूड, जो देवताओं को कष्ट दे रहा
    था, मूल रूप से कृष्ण के भक्त सुदामा थे। एक शाप के कारण सुदामा का पुनर्जन्म शंखचूड
    के रूप में हुआ। ब्रह्मा और विष्णु सहित देवता शंकरजी से शंखचूड को पराजित करने और
    शांति बहाल करने की सहायता मांगते हैं।
- id: shiva-assures-gods
  type: story
  keywords:
  - Shiva
  - Shankhchuda
  - Gods
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: Shiva assures Brahma and Vishnu that he is aware of Shankhchuda's past
    and promises to eliminate the demon. He explains that Shankhchuda was once a cowherd
    named Sudama, a devotee of Krishna, and that he will take care of the situation,
    ensuring the gods' welfare.
  summary_hi: शिव ब्रह्मा और विष्णु को आश्वस्त करते हैं कि उन्हें शंखचूड के अतीत की
    जानकारी है और वे राक्षस का नाश करने का वादा करते हैं। वे बताते हैं कि शंखचूड पहले
    सुदामा नामक एक ग्वाला था, जो कृष्ण का भक्त था, और वे स्थिति का ध्यान रखेंगे, देवताओं
    के कल्याण को सुनिश्चित करेंगे।
- id: sudama-curse-and-redemption
  type: story
  keywords:
  - Sudama
  - curse
  - redemption
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Sudama, a devotee of Krishna, was cursed to be born as a demon named
    Shankhchuda due to Radha's curse. However, Shiva assures Krishna that he will
    eventually lift the curse and restore Sudama's original form. This episode highlights
    the interplay of divine will and the power of curses in Hindu mythology.
  summary_hi: सुदामा, जो कृष्ण के भक्त थे, राधा के शाप के कारण शंखचूड़ नामक दानव के
    रूप में जन्म लेते हैं। हालांकि, शिव कृष्ण को आश्वस्त करते हैं कि वह अंततः शाप
    को हटा देंगे और सुदामा को उनके मूल रूप में बहाल करेंगे। यह प्रकरण हिंदू पौराणिक
    कथाओं में दिव्य इच्छा और शाप की शक्ति के बीच के संबंध को दर्शाता है।
- id: krishna-seeks-shiva-s-blessing
  type: story
  keywords:
  - Krishna
  - Shiva
  - blessing
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Krishna, along with Radha and other companions, approaches Shiva to
    seek his blessings and to make amends for any transgressions. Shiva, pleased with
    Krishna's devotion, assures him of protection and advises him to return to his
    abode with Radha, promising that all will be well.
  summary_hi: कृष्ण, राधा और अन्य साथियों के साथ, शिव के पास उनके आशीर्वाद प्राप्त
    करने और किसी भी अपराध के लिए क्षमा मांगने जाते हैं। शिव, कृष्ण की भक्ति से प्रसन्न
    होकर, उन्हें सुरक्षा का आश्वासन देते हैं और राधा के साथ उनके निवास लौटने की सलाह
    देते हैं, यह वादा करते हुए कि सब कुछ ठीक हो जाएगा।
- id: sudama-curse-story
  type: story
  keywords:
  - Sudama
  - curse
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Sudama, a beloved attendant of Krishna, was cursed by Radha to be born
    in a demonic form. As a result, he became a demon named Shankhachuda, who troubled
    the world by siding with the demons against the gods. Krishna, seeking to alleviate
    the curse, appealed to Shiva for help.
  summary_hi: सुदामा, जो कृष्ण के प्रिय पार्षद थे, राधा के शाप के कारण दानवी योनि
    में जन्मे। इसके परिणामस्वरूप, वह शंखचूड़ नामक दानव बन गए, जो देवताओं के विरुद्ध
    दैत्यों का पक्ष लेकर संसार को क्लेश देने लगे। कृष्ण ने इस शाप से मुक्ति के लिए
    शिव से सहायता मांगी।
- id: shiva-krishna-dialogue
  type: story
  keywords:
  - Shiva
  - Krishna
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a dialogue between Shiva and Krishna, Shiva reassures Krishna not
    to fear and to continue his duties without worry. Shiva explains that he has taken
    a form to assist the gods and that there is no difference between him and Krishna.
    He advises Krishna to return to his place and continue his work with Radha.
  summary_hi: शिव और कृष्ण के संवाद में, शिव कृष्ण को निडर रहने और बिना चिंता के अपने
    कर्तव्यों को जारी रखने का आश्वासन देते हैं। शिव बताते हैं कि उन्होंने देवताओं
    की सहायता के लिए एक रूप धारण किया है और उनके और कृष्ण के बीच कोई भेद नहीं है।
    वह कृष्ण को अपने स्थान पर लौटकर राधा के साथ अपना कार्य जारी रखने की सलाह देते
    हैं।
- id: shankhchuda-vadha-episode
  type: story
  keywords:
  - shankhchuda
  - shiva
  - devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Panchama Yuddha Khanda
  summary_en: The devas, troubled by the demon king Shankhchuda, approach Lord Shiva
    for help. Shiva assures them that he will defeat Shankhchuda and restore their
    lost authority. The devas, relieved by Shiva's promise, return to their respective
    abodes.
  summary_hi: देवता, दैत्यराज शंखचूड से परेशान होकर भगवान शिव के पास सहायता के लिए
    जाते हैं। शिव उन्हें आश्वासन देते हैं कि वे शंखचूड को पराजित करेंगे और उनके खोए
    हुए अधिकारों को बहाल करेंगे। शिव के वचन से संतुष्ट होकर देवता अपने-अपने स्थानों
    पर लौट जाते हैं।
- id: shankhchuda-message-episode
  type: story
  keywords:
  - shankhchuda
  - shiva
  - pushpadanta
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Panchama Yuddha Khanda
  summary_en: Lord Shiva sends Gandharva king Chitraratha, also known as Pushpadanta,
    as a messenger to Shankhchuda. Pushpadanta conveys Shiva's message to Shankhchuda,
    urging him to return the devas' kingdom or face battle with Shiva. Shankhchuda
    dismisses the message, preparing for war instead.
  summary_hi: भगवान शिव गंधर्वराज चित्ररथ, जिन्हें पुष्पदंत भी कहा जाता है, को शंखचूड
    के पास दूत के रूप में भेजते हैं। पुष्पदंत शंखचूड को शिव का संदेश देते हैं, जिसमें
    उन्हें देवताओं का राज्य लौटाने या शिव के साथ युद्ध का सामना करने का आग्रह किया
    जाता है। शंखचूड संदेश को नजरअंदाज कर देता है और युद्ध की तैयारी करता है।
- id: shankhachuda-confrontation-with-shiva
  type: story
  keywords:
  - Shankhachuda
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudrasamhita, Yuddhakhanda
  summary_en: Shankhachuda, the demon king, refuses to return the kingdom to the gods
    and challenges Shiva to a battle. Shiva sends his messenger, Pushpadanta, to deliver
    the message to Shankhachuda, demanding the return of the gods' kingdom or face
    war. Shankhachuda, confident in his strength, decides to confront Shiva instead.
  summary_hi: शंखचूड, दानव राजा, देवताओं को राज्य लौटाने से इनकार करता है और शिव को
    युद्ध के लिए चुनौती देता है। शिव अपने दूत पुष्पदंत को शंखचूड के पास संदेश देने
    भेजते हैं, जिसमें देवताओं का राज्य लौटाने या युद्ध का सामना करने की मांग की जाती
    है। शंखचूड, अपनी शक्ति पर विश्वास रखते हुए, शिव का सामना करने का निर्णय लेता है।
- id: shankhchuda-refuses-to-yield
  type: story
  keywords:
  - Shankhchuda
  - Shiva
  - refusal
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khand, Chapter 32
  summary_en: The demon king Shankhchuda, influenced by fate, refuses to yield the
    kingdom and authority of the gods without a fight against Shiva. He acknowledges
    the supremacy of time over all creation and destruction.
  summary_hi: दानव राजा शंखचूड, भाग्य से प्रभावित होकर, शिव के साथ युद्ध किए बिना
    देवताओं का राज्य और अधिकार देने से इनकार कर देता है। वह सृष्टि और विनाश पर समय
    की सर्वोच्चता को स्वीकार करता है।
- id: shiva-prepares-for-battle
  type: event
  keywords:
  - Shiva
  - battle
  - preparation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khand, Chapter 33
  summary_en: Upon hearing the refusal of Shankhchuda, Lord Shiva becomes enraged
    and instructs his powerful attendants, including Veerabhadra and Nandi, to prepare
    for battle. Shiva himself prepares to lead the charge against Shankhchuda.
  summary_hi: शंखचूड के इनकार को सुनकर भगवान शिव क्रोधित हो जाते हैं और वीरभद्र और
    नंदी सहित अपने शक्तिशाली गणों को युद्ध की तैयारी करने का आदेश देते हैं। शिव स्वयं
    शंखचूड के खिलाफ युद्ध का नेतृत्व करने की तैयारी करते हैं।
- id: skanda-battle-preparation
  type: event
  keywords:
  - Skanda
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 33
  summary_en: Skanda, surrounded by various mystical beings, pays homage to Shiva
    and prepares for battle against Shankhachuda. Shiva, with his army, fearlessly
    proceeds to the banks of the Chandrabhaga river to relieve the gods' distress.
  summary_hi: स्कन्द विभिन्न रहस्यमय प्राणियों से घिरे हुए शिवजी को प्रणाम करते हैं
    और शंखचूड के साथ युद्ध की तैयारी करते हैं। शिव अपनी सेना के साथ निर्भय होकर चन्द्रभागा
    नदी के तट पर देवताओं के कष्ट को दूर करने के लिए प्रस्थान करते हैं।
- id: shankhachuda-prepares-for-battle
  type: event
  keywords:
  - Shankhachuda
  - Tulsi
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 34
  summary_en: After receiving a message from Shiva's messenger, Shankhachuda prepares
    for battle. He informs his wife Tulsi about his departure and entrusts her with
    the kingdom's responsibilities. Shankhachuda then gathers his army and commands
    them to prepare for war against Shiva.
  summary_hi: शिवदूत से संदेश प्राप्त करने के बाद, शंखचूड युद्ध की तैयारी करता है।
    वह अपनी पत्नी तुलसी को अपने प्रस्थान के बारे में बताता है और राज्य की जिम्मेदारियाँ
    सौंपता है। शंखचूड अपनी सेना को एकत्र करता है और उन्हें शिव के खिलाफ युद्ध की तैयारी
    करने का आदेश देता है।
- id: shankhchuda-march-to-battle
  type: event
  keywords:
  - Shankhchuda
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 34
  summary_en: Shankhchuda, the mighty demon king, commands his vast army and sets
    out for battle. Accompanied by his skilled general and three divisions of troops,
    he prepares to face the forces of Shiva. The narrative describes the geographical
    and spiritual significance of the regions they traverse, including sacred sites
    and rivers.
  summary_hi: शंखचूड, महाबली असुरराज, अपनी विशाल सेना के साथ युद्ध के लिए निकलता है।
    अपने कुशल सेनापति और तीन अक्षौहिणी सेनाओं के साथ, वह शिव की सेना का सामना करने
    की तैयारी करता है। इस वर्णन में वे जिन क्षेत्रों से गुजरते हैं, उनकी भौगोलिक और
    आध्यात्मिक महत्ता का उल्लेख किया गया है, जिसमें पवित्र स्थल और नदियाँ शामिल हैं।
- id: shankhchuda-envoy-to-shiva
  type: event
  keywords:
  - Shankhchuda
  - envoy
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 35
  summary_en: Shankhchuda sends a wise envoy to Lord Shiva to deliver a message. The
    envoy finds Shiva in deep meditation and conveys Shankhchuda's message. Shiva,
    in his benevolent form, listens and responds with a message for Shankhchuda, emphasizing
    the cosmic order and the roles of divine beings.
  summary_hi: शंखचूड एक बुद्धिमान दूत को भगवान शिव के पास संदेश देने के लिए भेजता
    है। दूत शिव को गहन ध्यान में पाता है और शंखचूड का संदेश देता है। शिव, अपनी कृपालु
    मुद्रा में, सुनते हैं और शंखचूड के लिए एक संदेश देते हैं, जिसमें वे ब्रह्मांडीय
    व्यवस्था और दिव्य प्राणियों की भूमिकाओं पर जोर देते हैं।
- id: vishnu-bali-subjugation
  type: story
  keywords:
  - Vishnu
  - Bali
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu, after taking everything from Bali, sent him to the netherworld.
    Vishnu stands at the gate with a mace to protect the realms Bali was sent to.
  summary_hi: विष्णु ने बलि से सब कुछ लेकर उसे पाताल लोक भेज दिया। विष्णु गदा धारण
    कर उन लोकों की रक्षा के लिए द्वार पर खड़े हैं।
- id: hiranyaksha-and-shumbha-demons-defeat
  type: story
  keywords:
  - Hiranyaksha
  - Shumbha
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods killed Hiranyaksha and Shumbha along with other demons. This
    was part of the ongoing conflict between gods and demons.
  summary_hi: देवताओं ने हिरण्याक्ष और शुम्भ सहित अन्य असुरों का वध किया। यह देवताओं
    और असुरों के बीच चल रहे संघर्ष का हिस्सा था।
- id: churning-of-ocean-amrita
  type: story
  keywords:
  - Ocean Churning
  - Amrita
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: During the churning of the ocean, the gods consumed the nectar of immortality,
    while the demons were left with hardships.
  summary_hi: समुद्र मंथन के दौरान देवताओं ने अमृत का पान किया, जबकि असुरों को कष्ट
    सहना पड़ा।
- id: tripura-destruction
  type: story
  keywords:
  - Tripura
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shiva, upon the request of the gods, destroyed the three cities of Tripura.
    This act is well-known among the battles fought by the gods.
  summary_hi: शिव ने देवताओं की प्रार्थना पर त्रिपुर के तीन नगरों का विनाश किया। यह
    देवताओं द्वारा लड़े गए युद्धों में प्रसिद्ध है।
- id: hiranyakashipu-slaying
  type: story
  keywords:
  - Hiranyakashipu
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu, at the request of the gods, killed Hiranyakashipu to protect
    the pious and uphold righteousness.
  summary_hi: विष्णु ने देवताओं की प्रार्थना पर हिरण्यकशिपु का वध किया ताकि धर्म की
    रक्षा हो सके।
- id: shankhchuda-battle-preparation
  type: event
  keywords:
  - Shankhchuda
  - battle
  - devas
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: Shankhchuda, a powerful demon king, prepares for battle against the
    devas. After receiving a message from Shiva's messenger, he accepts the challenge
    with enthusiasm and quickly mounts his chariot with his ministers to lead his
    army into battle.
  summary_hi: शंखचूड, एक शक्तिशाली दानव राजा, देवताओं के खिलाफ युद्ध की तैयारी करता
    है। शिव के दूत से संदेश प्राप्त करने के बाद, वह उत्साहपूर्वक चुनौती स्वीकार करता
    है और अपने मंत्रियों के साथ शीघ्रता से अपने रथ पर चढ़कर अपनी सेना का नेतृत्व करने
    के लिए निकल पड़ता है।
- id: skanda-mahamari-victory
  type: event
  keywords:
  - Skanda
  - Mahamari
  - victory
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Skanda and Mahamari achieved victory in battle, causing celestial drums
    to sound and flowers to rain down from the heavens.
  summary_hi: स्कन्द और महामारी ने युद्ध में विजय प्राप्त की, जिससे स्वर्ग में दुंदुभियाँ
    बजने लगीं और फूलों की वर्षा होने लगी।
- id: shankhachuda-battle
  type: event
  keywords:
  - Shankhachuda
  - battle
  - Skanda
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Enraged by the destruction caused by Skanda and Mahamari, Shankhachuda
    prepared for battle, wielding various weapons and raining arrows upon the battlefield.
  summary_hi: स्कन्द और महामारी द्वारा किए गए विनाश से क्रोधित होकर शंखचूड़ ने युद्ध
    के लिए तैयारी की, विभिन्न अस्त्रों का उपयोग करते हुए युद्धभूमि पर बाणों की वर्षा
    की।
- id: skanda-revival
  type: event
  keywords:
  - Skanda
  - revival
  - Kali
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: After being struck down in battle, Skanda was revived by Kali, who brought
    him to Shiva. Shiva then restored Skanda's life and strength, allowing him to
    rise again.
  summary_hi: युद्ध में पराजित होने के बाद, काली ने स्कन्द को शिव के पास ले जाकर पुनर्जीवित
    किया। शिव ने स्कन्द को जीवन और शक्ति प्रदान की, जिससे वे फिर से उठ खड़े हुए।
- id: veerabhadra-shankhchuda-battle
  type: story
  keywords:
  - Veerabhadra
  - Shankhchuda
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 37
  summary_en: Veerabhadra, a powerful warrior, engages in battle with the demon Shankhchuda.
    Despite Shankhchuda's use of divine weapons, Veerabhadra skillfully counters them
    with his arrows. The battle intensifies as Shankhchuda becomes enraged and strikes
    Veerabhadra, who momentarily loses consciousness but quickly recovers to continue
    the fight.
  summary_hi: वीरभद्र, एक शक्तिशाली योद्धा, दानव शंखचूड़ के साथ युद्ध में संलग्न होते
    हैं। शंखचूड़ के दिव्य अस्त्रों के उपयोग के बावजूद, वीरभद्र अपने बाणों से उन्हें
    कुशलता से काट देते हैं। युद्ध तब और तीव्र हो जाता है जब शंखचूड़ क्रोधित होकर वीरभद्र
    पर प्रहार करता है, जिससे वीरभद्र क्षणिक रूप से चेतना खो देते हैं लेकिन जल्दी से
    पुनः उठ खड़े होते हैं और युद्ध जारी रखते हैं।
- id: kali-joins-battle
  type: story
  keywords:
  - Kali
  - Kartikeya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 37
  summary_en: Goddess Kali enters the battlefield with the intention of devouring
    the demons and protecting her followers, as per Kartikeya's wish. She is accompanied
    by Nandi and other divine beings. The battlefield is filled with the sounds of
    drums and warriors ready for battle.
  summary_hi: देवी काली युद्धभूमि में प्रवेश करती हैं, कार्तिकेय की इच्छा के अनुसार
    दानवों का भक्षण करने और अपने अनुयायियों की रक्षा करने के उद्देश्य से। उनके साथ
    नंदी और अन्य दिव्य प्राणी भी होते हैं। युद्धभूमि में ढोल की आवाज़ और युद्ध के
    लिए तैयार योद्धाओं की गूंज होती है।
- id: kali-shankhchuda-confrontation
  type: story
  keywords:
  - Kali
  - Shankhchuda
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 38
  summary_en: Kali confronts Shankhchuda on the battlefield, causing fear among the
    demons with her fierce presence. Shankhchuda attempts to counter her with divine
    weapons, but Kali's power is overwhelming. The battle is intense, with both sides
    employing powerful weapons.
  summary_hi: काली युद्धभूमि में शंखचूड़ का सामना करती हैं, अपनी भयंकर उपस्थिति से
    दानवों में भय उत्पन्न करती हैं। शंखचूड़ दिव्य अस्त्रों से उनका सामना करने का प्रयास
    करता है, लेकिन काली की शक्ति अत्यधिक होती है। युद्ध तीव्र होता है, दोनों पक्ष
    शक्तिशाली अस्त्रों का उपयोग करते हैं।
- id: narayanastra-and-brahmastra-episode
  type: story
  keywords:
  - Narayanastra
  - Brahmastra
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a fierce battle, a goddess uses the Narayanastra against a demon,
    causing him to fall to the ground and surrender. The goddess then uses the Brahmastra,
    which the demon also manages to withstand. The battle continues with the demon
    using divine weapons, but the goddess consumes them with her vast mouth, terrifying
    the demon.
  summary_hi: एक भयंकर युद्ध में, एक देवी ने एक दानव के खिलाफ नारायणास्त्र का प्रयोग
    किया, जिससे वह जमीन पर गिर पड़ा और आत्मसमर्पण कर दिया। देवी ने फिर ब्रह्मास्त्र
    का प्रयोग किया, जिसे दानव ने भी सहन कर लिया। युद्ध जारी रहा, जिसमें दानव ने दिव्यास्त्रों
    का उपयोग किया, लेकिन देवी ने अपने विशाल मुख से उन्हें निगल लिया, जिससे दानव भयभीत
    हो गया।
- id: kali-and-shankhchuda-battle
  type: story
  keywords:
  - Kali
  - Shankhchuda
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The battle between Goddess Kali and the demon Shankhchuda is intense.
    Shankhchuda uses a powerful sword and other divine weapons against Kali, but she
    consumes them effortlessly. Despite his efforts, Shankhchuda is unable to defeat
    Kali, who ultimately destroys his chariot and kills his charioteer. The demon
    attempts to attack with a fiery discus, but Kali catches it and consumes it as
    well.
  summary_hi: देवी काली और दानव शंखचूड़ के बीच का युद्ध अत्यंत तीव्र है। शंखचूड़ काली
    के खिलाफ एक शक्तिशाली तलवार और अन्य दिव्यास्त्रों का उपयोग करता है, लेकिन काली
    उन्हें आसानी से निगल जाती हैं। अपनी कोशिशों के बावजूद, शंखचूड़ काली को पराजित
    नहीं कर पाता, जो अंततः उसके रथ को नष्ट कर देती हैं और उसके सारथी को मार देती हैं।
    दानव एक प्रज्वलित चक्र से हमला करने की कोशिश करता है, लेकिन काली उसे पकड़कर निगल
    जाती हैं।
- id: shankhchuda-battle-with-bhadrakali
  type: event
  keywords:
  - Shankhchuda
  - Bhadrakali
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 38
  summary_en: In a fierce battle, the demon Shankhchuda confronts Bhadrakali. Despite
    Bhadrakali's attempts, Shankhchuda remains unharmed due to a divine decree. Bhadrakali
    consumes the flesh and blood of many demons and reports the battle's events to
    Shiva.
  summary_hi: एक भयंकर युद्ध में, दानव शंखचूड भद्रकाली का सामना करता है। भद्रकाली
    के प्रयासों के बावजूद, शंखचूड एक दिव्य आदेश के कारण अजेय रहता है। भद्रकाली कई
    दानवों का मांस और रक्त पीती है और युद्ध की घटनाओं को शिव को बताती है।
- id: shiva-arrives-at-battlefield
  type: event
  keywords:
  - Shiva
  - Shankhchuda
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 39
  summary_en: Upon hearing Bhadrakali's account, Shiva arrives at the battlefield
    with his attendants, including Virabhadra and Bhairavas. Shankhchuda descends
    from his celestial vehicle, pays homage to Shiva, and prepares for battle.
  summary_hi: भद्रकाली की कथा सुनकर, शिव अपने अनुचरों के साथ युद्धभूमि में पहुँचते
    हैं, जिनमें वीरभद्र और भैरव शामिल हैं। शंखचूड अपने दिव्य विमान से उतरकर शिव को
    प्रणाम करता है और युद्ध की तैयारी करता है।
- id: shiva-shankhchuda-battle
  type: story
  keywords:
  - Shiva
  - Shankhchuda
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: A fierce battle ensues between Lord Shiva and the demon Shankhchuda,
    lasting for a hundred years. Despite Shankhchuda's powerful attacks, Shiva skillfully
    counters them with his own weapons. The battle reaches a climax when Shiva, in
    a fit of rage, strikes Shankhchuda with his trident, rendering the demon unconscious.
  summary_hi: भगवान शिव और दानव शंखचूड के बीच सौ वर्षों तक एक भयंकर युद्ध होता है।
    शंखचूड के शक्तिशाली हमलों के बावजूद, शिव अपने हथियारों से उन्हें कुशलतापूर्वक
    विफल कर देते हैं। युद्ध चरम पर पहुँचता है जब शिव क्रोधित होकर अपने त्रिशूल से
    शंखचूड पर प्रहार करते हैं, जिससे वह मूर्छित होकर गिर पड़ता है।
- id: shiva-sankhachuda-battle
  type: story
  keywords:
  - Shiva
  - Shankhachuda
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Chapter 39
  summary_en: A fierce battle ensues between Lord Shiva and the demon king Shankhachuda.
    Shankhachuda, with his thousand arms, attacks Shiva with numerous weapons. Shiva,
    in his wrath, destroys Shankhachuda's weapons and ultimately kills him with his
    trident. The demon's army is decimated by Shiva's attendants, including Kali,
    who devours many demons.
  summary_hi: भगवान शिव और दानव राजा शंखचूड के बीच एक भयंकर युद्ध होता है। शंखचूड
    अपनी हजार भुजाओं के साथ शिव पर अनेक हथियारों से हमला करता है। शिव अपने क्रोध में
    शंखचूड के हथियारों को नष्ट कर देते हैं और अंततः अपने त्रिशूल से उसे मार देते हैं।
    शिव के गण, जिनमें काली भी शामिल हैं, दानवों की सेना को नष्ट कर देते हैं।
- id: shiva-battle-with-demon
  type: story
  keywords:
  - Shiva
  - demon
  - battle
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A demon challenges Lord Shiva to a battle, casting divine weapons and
    illusions to defeat him. Shiva counters with his powerful Maheshwar weapon, destroying
    the demon's illusions and weapons. Ultimately, Shiva prepares to vanquish the
    demon with his trident.
  summary_hi: एक दानव भगवान शिव को युद्ध के लिए चुनौती देता है और उन्हें हराने के
    लिए दिव्य अस्त्र और माया का प्रयोग करता है। शिव अपने महेश्वर अस्त्र से दानव की
    माया और अस्त्रों को नष्ट कर देते हैं। अंततः शिव अपने त्रिशूल से दानव का वध करने
    की तैयारी करते हैं।
- id: vishnu-disguise-as-brahmin
  type: story
  keywords:
  - Vishnu
  - disguise
  - Brahmin
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Vishnu, in disguise as an old Brahmin, approaches the demon Shankhchuda
    to ask for alms. The demon, known for his devotion to Brahmins and truthfulness,
    gives Vishnu his divine armor, which Vishnu uses to deceive Shankhchuda's wife,
    Tulsi.
  summary_hi: भगवान विष्णु वृद्ध ब्राह्मण के वेश में दानव शंखचूड़ के पास भिक्षा मांगने
    जाते हैं। ब्राह्मणों के प्रति भक्त और सत्यवादी शंखचूड़ विष्णु को अपना दिव्य कवच
    दे देता है, जिसे विष्णु शंखचूड़ की पत्नी तुलसी को धोखा देने के लिए उपयोग करते
    हैं।
- id: destruction-of-shankhchuda
  type: story
  keywords:
  - Shankhchuda
  - destruction
  - trident
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After Vishnu's intervention, Shiva uses his trident to destroy the demon
    Shankhchuda. The trident, a powerful weapon, turns Shankhchuda to ashes instantly,
    fulfilling the divine plan to maintain cosmic order.
  summary_hi: विष्णु के हस्तक्षेप के बाद, शिव अपने त्रिशूल का उपयोग करके दानव शंखचूड़
    का विनाश करते हैं। त्रिशूल, एक शक्तिशाली अस्त्र, शंखचूड़ को तुरंत भस्म कर देता
    है, जिससे ब्रह्मांडीय व्यवस्था बनाए रखने की दिव्य योजना पूरी होती है।
- id: shankhchuda-liberation-story
  type: story
  keywords:
  - Shankhchuda
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand, Chapter 40
  summary_en: The demon king Shankhchuda was liberated from a curse by Lord Shiva's
    grace. After his liberation, Shankhchuda regained his original form. His bones
    gave rise to a type of conch shell, which is considered auspicious for all deities
    except Shiva.
  summary_hi: दानवेंद्र शंखचूड को शिवजी की कृपा से शाप से मुक्ति मिली और उसने अपना
    पूर्व रूप प्राप्त कर लिया। उसकी अस्थियों से एक प्रकार की शंख जाति प्रकट हुई, जो
    शिवजी को छोड़कर अन्य सभी देवताओं के लिए प्रशस्त मानी जाती है।
- id: shiva-trident-story
  type: story
  keywords:
  - Shiva
  - Trident
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand, Chapter 40
  summary_en: Lord Shiva's trident, described as immensely powerful and radiant, was
    used to destroy the demon Shankhchuda. The trident returned to Shiva after completing
    its task, symbolizing Shiva's supreme power and control over the universe.
  summary_hi: भगवान शिव का त्रिशूल, जो अत्यंत शक्तिशाली और तेजस्वी था, का उपयोग दानव
    शंखचूड को नष्ट करने के लिए किया गया। त्रिशूल ने अपना कार्य समाप्त कर शीघ्रता से
    शिवजी के पास लौट आया, जो शिवजी की सर्वोच्च शक्ति और ब्रह्मांड पर उनके नियंत्रण
    का प्रतीक है।
- id: tulsi-curse-vishnu-story
  type: story
  keywords:
  - Tulsi
  - Vishnu
  - curse
  source:
    book: Shiv Puran
    sarga: '41'
  summary_en: Vishnu, taking the form of Shankhchuda, deceives Tulsi and violates
    her chastity. In her anger, Tulsi curses Vishnu to become a stone, which leads
    to the creation of the Shaligram stone. Shiva later consoles Tulsi, and from her
    emerges the sacred plant that bears her name.
  summary_hi: विष्णु, शंखचूड का रूप धारण कर तुलसी को छलते हैं और उनके शील का हरण करते
    हैं। क्रोधित होकर तुलसी विष्णु को पत्थर बनने का शाप देती हैं, जिससे शालिग्राम
    पत्थर की उत्पत्ति होती है। बाद में शिव तुलसी को सांत्वना देते हैं और उनसे तुलसी
    के पवित्र पौधे की उत्पत्ति होती है।
- id: rudra-battle-assistance
  type: event
  keywords:
  - Rudra
  - battle
  - Brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Rudra came to assist in a battle, and the conflict lasted for a full
    year. Eventually, Brahma intervened to establish peace, and the gods were granted
    authority by Brahma's decree.
  summary_hi: रुद्र युद्ध में सहायता के लिए आए, और यह संघर्ष पूरे एक वर्ष तक चला।
    अंततः ब्रह्मा ने हस्तक्षेप कर शांति स्थापित की, और देवताओं को ब्रह्मा के आदेश
    से अधिकार दिया गया।
- id: tulsi-curse-vishnu
  type: story
  keywords:
  - Tulsi
  - Vishnu
  - curse
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Tulsi, upon realizing that Vishnu had deceived her and broken her chastity,
    cursed him to become a stone. She was deeply grieved by the loss of her husband
    and accused Vishnu of being heartless.
  summary_hi: तुलसी ने जब यह महसूस किया कि विष्णु ने उन्हें धोखा दिया और उनका सतीत्व
    भंग किया, तो उन्होंने विष्णु को पत्थर बनने का श्राप दिया। वह अपने पति की मृत्यु
    से अत्यंत दुखी थीं और विष्णु को निर्दयी होने का आरोप लगाया।
- id: tulsi-transformation-story
  type: story
  keywords:
  - Tulsi
  - Shaligram
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Tulsi, the wife of Shankhchuda, is consoled by Lord Shiva after her
    husband's demise. Shiva explains that her previous penance has resulted in her
    current situation. He grants her a divine form and promises that she will become
    a sacred river named Gandaki and a revered Tulsi plant, associated with Lord Vishnu.
  summary_hi: तुलसी, जो शंखचूड़ की पत्नी है, अपने पति की मृत्यु के बाद भगवान शिव द्वारा
    सांत्वना दी जाती है। शिव बताते हैं कि उनके पूर्व तप का फल उन्हें वर्तमान स्थिति
    में मिला है। वह उन्हें एक दिव्य रूप देते हैं और वादा करते हैं कि वह गंडकी नामक
    एक पवित्र नदी और भगवान विष्णु से जुड़ी एक पूजनीय तुलसी पौधा बनेंगी।
- id: shaligram-creation-concept
  type: concept
  keywords:
  - Shaligram
  - Gandaki
  - Vishnu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The Shaligram stones, found in the Gandaki river, are considered sacred
    due to the presence of Vishnu's chakra marks created by worms. These stones are
    highly revered and are believed to bestow great merit upon those who worship them.
  summary_hi: गंडकी नदी में पाए जाने वाले शालग्राम पत्थरों को पवित्र माना जाता है
    क्योंकि उन पर विष्णु के चक्र के निशान होते हैं, जो कीड़ों द्वारा बनाए जाते हैं।
    इन पत्थरों की अत्यधिक पूजा की जाती है और इन्हें पूजने वालों को महान पुण्य प्राप्त
    होता है।
- id: tulsi-curse-and-transformation
  type: story
  keywords:
  - Tulsi
  - Shaligram
  - Vishnu
  source:
    book: Shiv Puran
    sarga: Part 1, Passage 664/722
  summary_en: The story describes how Tulsi, after being cursed, is transformed and
    becomes divine. Shankarji narrates the greatness of Shaligram and Tulsi, which
    pleases Tulsi, leading her to leave her mortal body and attain a divine form.
    Vishnu accompanies her to Vaikuntha, and the Gandaki River is formed from Tulsi's
    abandoned body.
  summary_hi: यह कहानी बताती है कि कैसे तुलसी, शापित होने के बाद, दिव्य रूप धारण करती
    हैं। शंकरजी शालिग्राम और तुलसी के महान पुण्य का वर्णन करते हैं, जिससे तुलसी प्रसन्न
    होती हैं और अपने शरीर को छोड़कर दिव्य रूप प्राप्त करती हैं। विष्णु उनके साथ वैकुण्ठ
    चले जाते हैं और तुलसी के छोड़े हुए शरीर से गण्डकी नदी का निर्माण होता है।
- id: andhakasura-birth-and-defeat
  type: story
  keywords:
  - Andhakasura
  - Hiranyaksha
  - Varaha
  source:
    book: Shiv Puran
    sarga: Part 1, Passage 664/722
  summary_en: The passage narrates the birth of Andhakasura, who was born as a boon
    from Shiva to Hiranyaksha. Hiranyaksha takes the Earth to the netherworld, and
    Vishnu, in his Varaha form, defeats Hiranyaksha and restores the Earth to its
    place.
  summary_hi: यह अंश अंधकासुर के जन्म की कथा बताता है, जो शिव के वरदान से हिरण्याक्ष
    के पुत्र के रूप में जन्मा था। हिरण्याक्ष पृथ्वी को पाताललोक में ले जाता है, और
    विष्णु वाराह रूप धारण कर हिरण्याक्ष का वध करते हैं और पृथ्वी को उसके स्थान पर
    स्थापित करते हैं।
- id: shiva-parvati-eye-closing-episode
  type: story
  keywords:
  - Shiva
  - Parvati
  - darkness
  source:
    book: Shiv Puran
    sarga: '42'
  summary_en: Once, Parvati playfully closed Shiva's eyes, causing a momentary darkness
    to envelop the world. From the sweat of Parvati's hands, a fearsome and deformed
    child was born. This child, named Andhaka, was blind and had a terrifying appearance.
  summary_hi: एक बार, पार्वती ने खेल-खेल में शिव के नेत्र बंद कर दिए, जिससे क्षणिक
    अंधकार ने दुनिया को घेर लिया। पार्वती के हाथों के पसीने से एक भयंकर और विकृत बालक
    उत्पन्न हुआ। इस बालक का नाम अंधक था, जो अंधा और भयानक रूप वाला था।
- id: andhaka-birth-story
  type: story
  keywords:
  - andhaka
  - shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The demon king requests a son from Shiva, who grants him a son named
    Andhaka, born from Shiva himself. Andhaka is as powerful and invincible as the
    demon king.
  summary_hi: दैत्यराज शिव से पुत्र की याचना करता है, और शिव उसे अपना पुत्र अंधक प्रदान
    करते हैं, जो दैत्यराज के समान ही शक्तिशाली और अजेय है।
- id: birth-of-andhaka
  type: story
  keywords:
  - andhaka
  - birth
  source:
    book: Shiv Puran
    sarga: '5'
  summary_en: Upon closing Shiva's eyes, Parvati inadvertently creates a demon named
    Andhaka from the sweat of her hands. This demon is born with a terrifying appearance,
    and Shiva explains to Parvati that she is the mother of this powerful demon. Parvati
    is advised to take care of Andhaka with her companions.
  summary_hi: शिव के नेत्र बंद करने पर पार्वती अनजाने में अपने हाथों के पसीने से अंधक
    नामक राक्षस को जन्म देती हैं। यह राक्षस भयानक रूप में उत्पन्न होता है और शिव पार्वती
    को बताते हैं कि वह इस शक्तिशाली राक्षस की माता हैं। पार्वती को सलाह दी जाती है
    कि वह अपनी सखियों के साथ मिलकर अंधक की देखभाल करें।
- id: hiranyaksha-tapasya
  type: story
  keywords:
  - hiranyaksha
  - tapasya
  source:
    book: Shiv Puran
    sarga: '42'
  summary_en: Hiranyaksha, desiring a powerful son, undertakes severe penance in the
    forest to please Lord Shiva. Pleased with his devotion, Shiva appears before him
    and offers a boon. Hiranyaksha requests a mighty son to continue his lineage,
    as he feels incomplete without one.
  summary_hi: हिरण्याक्ष, एक शक्तिशाली पुत्र की इच्छा रखते हुए, भगवान शिव को प्रसन्न
    करने के लिए वन में कठोर तपस्या करते हैं। उनकी भक्ति से प्रसन्न होकर, शिव उनके
    सामने प्रकट होते हैं और वरदान देने का प्रस्ताव करते हैं। हिरण्याक्ष एक महाबलवान
    पुत्र की मांग करते हैं ताकि उनका वंश आगे बढ़ सके, क्योंकि वह बिना पुत्र के अधूरा
    महसूस करते हैं।
- id: varaha-avatar-story
  type: story
  keywords:
  - varaha
  - vishnu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: Vishnu takes the form of Varaha to defeat the demon Hiranyaksha. After
    killing Hiranyaksha, Vishnu restores the Earth to its original position and is
    praised by all the gods and sages.
  summary_hi: विष्णु वराह रूप धारण कर दैत्य हिरण्याक्ष का वध करते हैं। हिरण्याक्ष
    के मारे जाने के बाद, विष्णु पृथ्वी को उसके मूल स्थान पर स्थापित करते हैं और सभी
    देवता और ऋषि उनकी स्तुति करते हैं।
- id: hiranyakashipu-revenge-plan
  type: story
  keywords:
  - hiranyakashipu
  - revenge
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After the death of his brother Hiranyaksha at the hands of Vishnu, Hiranyakashipu
    was filled with anger and grief. He commanded his demon followers to torment the
    gods and the people, seeking revenge for his brother's death.
  summary_hi: अपने भाई हिरण्याक्ष की विष्णु द्वारा हत्या के बाद, हिरण्यकशिपु क्रोध
    और दुःख से भर गया। उसने अपने असुर अनुयायियों को देवताओं और लोगों को पीड़ा देने
    का आदेश दिया, अपने भाई की मृत्यु का बदला लेने के लिए।
- id: hiranyakashipu-tapasya
  type: story
  keywords:
  - hiranyakashipu
  - tapasya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Hiranyakashipu, seeking to become invincible, performed severe penance
    in the Mandarachal mountains. His intense tapasya caused a fiery energy to emanate,
    affecting all the worlds and forcing the gods to seek refuge in Brahmaloka.
  summary_hi: अजेय बनने की इच्छा से हिरण्यकशिपु ने मंदराचल पर्वतों में कठोर तप किया।
    उसकी तीव्र तपस्या से एक अग्निमय ऊर्जा उत्पन्न हुई, जिसने सभी लोकों को प्रभावित
    किया और देवताओं को ब्रह्मलोक में शरण लेने के लिए मजबूर कर दिया।
- id: brahma-grants-boon-to-hiranyakashipu
  type: story
  keywords:
  - brahma
  - boon
  - hiranyakashipu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Impressed by Hiranyakashipu's penance, Brahma appeared before him to
    grant a boon. Hiranyakashipu asked for immunity from death by various means and
    beings, seeking to become immortal and invincible.
  summary_hi: हिरण्यकशिपु की तपस्या से प्रभावित होकर, ब्रह्मा उसके सामने प्रकट हुए
    और वरदान देने का प्रस्ताव किया। हिरण्यकशिपु ने विभिन्न साधनों और प्राणियों द्वारा
    मृत्यु से सुरक्षा की मांग की, अमर और अजेय बनने की इच्छा से।
- id: hiranyakashipu-boon-story
  type: story
  keywords:
  - hiranyakashipu
  - boon
  - brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Hiranyakashipu, a demon king, requests a boon from Brahma to be immune
    to death from various sources, including weapons, elements, and creatures. Brahma
    grants his wish, leading Hiranyakashipu to become arrogant and oppressive towards
    the gods.
  summary_hi: हिरण्यकशिपु, एक दैत्य राजा, ब्रह्मा से वरदान मांगता है कि उसे विभिन्न
    स्रोतों जैसे शस्त्र, तत्व और जीवों से मृत्यु का भय न हो। ब्रह्मा उसकी इच्छा पूरी
    करते हैं, जिससे हिरण्यकशिपु अहंकारी और देवताओं के प्रति अत्याचारी हो जाता है।
- id: devas-seek-vishnu-help
  type: story
  keywords:
  - devas
  - vishnu
  - help
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: The gods, troubled by Hiranyakashipu's tyranny, approach Vishnu for
    help. They find Vishnu resting in the ocean of milk and express their distress.
    Vishnu assures them that he will take care of the demon.
  summary_hi: हिरण्यकशिपु के अत्याचार से परेशान देवता विष्णु की सहायता के लिए जाते
    हैं। वे क्षीरसागर में विश्राम कर रहे विष्णु से मिलते हैं और अपनी पीड़ा व्यक्त
    करते हैं। विष्णु उन्हें आश्वस्त करते हैं कि वह दैत्य का नाश करेंगे।
- id: narasimha-avatar-story
  type: story
  keywords:
  - narasimha
  - avatar
  - hiranyakashipu
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu takes the form of Narasimha, a half-man, half-lion, to defeat
    Hiranyakashipu. He appears at dusk, a time not covered by Hiranyakashipu's boon,
    and kills the demon, thus saving the universe from his tyranny.
  summary_hi: विष्णु नरसिंह, आधे मनुष्य और आधे सिंह के रूप में अवतार लेते हैं, हिरण्यकशिपु
    को पराजित करने के लिए। वे संध्या के समय प्रकट होते हैं, जो हिरण्यकशिपु के वरदान
    में शामिल नहीं था, और दैत्य का वध करते हैं, इस प्रकार ब्रह्मांड को उसके अत्याचार
    से बचाते हैं।
- id: narasimha-hiranyakashipu-battle
  type: story
  keywords:
  - narasimha
  - hiranyakashipu
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: The passage describes the fierce battle between Narasimha and the demon
    king Hiranyakashipu. Despite using various weapons and powers, Hiranyakashipu
    is ultimately defeated by Narasimha, who tears him apart with his claws. After
    the demon's defeat, Vishnu, in the form of Narasimha, is pleased and appoints
    Prahlad as the new king.
  summary_hi: यह अंश नरसिंह और दैत्यराज हिरण्यकशिपु के बीच भयंकर युद्ध का वर्णन करता
    है। विभिन्न अस्त्र-शस्त्रों का प्रयोग करने के बावजूद, हिरण्यकशिपु अंततः नरसिंह
    द्वारा पराजित होता है, जो अपने नखों से उसे चीर डालता है। दैत्य की पराजय के बाद,
    विष्णु नरसिंह रूप में प्रसन्न होते हैं और प्रह्लाद को नया राजा नियुक्त करते हैं।
- id: prahlada-coronation
  type: event
  keywords:
  - prahlada
  - coronation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda
  summary_en: After the defeat of Hiranyakashipu, Vishnu, in the form of Narasimha,
    appoints Prahlad as the king. The gods, including Brahma, express their joy and
    return to their abodes after paying respects to Vishnu.
  summary_hi: हिरण्यकशिपु की पराजय के बाद, विष्णु नरसिंह रूप में प्रह्लाद को राजा
    नियुक्त करते हैं। ब्रह्मा सहित देवता अपनी प्रसन्नता व्यक्त करते हैं और विष्णु
    को प्रणाम कर अपने-अपने धाम लौट जाते हैं।
- id: andhaka-tapasya-and-boon
  type: story
  keywords:
  - Andhaka
  - tapasya
  - boon
  source:
    book: Shiv Puran
    sarga: Part 1
  summary_en: Andhaka, blinded and deformed, performed severe penance to please Lord
    Shiva. Despite his deformities, he sought a boon from Brahma to have his brothers,
    who had taken his kingdom, become his servants. He also wished for divine sight
    and immunity from death by any being, including gods and demons. Brahma granted
    his wishes but warned him to choose a cause for his death, as no one can escape
    time.
  summary_hi: अंधक, जो अंधा और विकृत था, ने भगवान शिव को प्रसन्न करने के लिए घोर तपस्या
    की। अपनी विकृतियों के बावजूद, उसने ब्रह्मा से वरदान मांगा कि उसके भाई, जिन्होंने
    उसका राज्य छीन लिया था, उसके सेवक बन जाएं। उसने दिव्य दृष्टि और किसी भी प्राणी,
    देवताओं और राक्षसों से मृत्यु से मुक्ति की भी कामना की। ब्रह्मा ने उसकी इच्छाएं
    पूरी कीं लेकिन उसे अपनी मृत्यु का कारण चुनने की चेतावनी दी, क्योंकि कोई भी समय
    से बच नहीं सकता।
- id: andhaka-boon-from-brahma
  type: story
  keywords:
  - Andhaka
  - Brahma
  - boon
  source:
    book: Shiv Puran
    sarga: '44'
  summary_en: Andhaka, the son of Hiranyaksha, approaches Brahma and requests a boon
    to become strong and handsome. Brahma grants his wish by touching him, transforming
    Andhaka into a powerful and beautiful being. With his newfound strength, Andhaka
    sets out to conquer the heavens and defeats the gods.
  summary_hi: हिरण्याक्ष के पुत्र अंधक ब्रह्मा के पास जाकर उनसे बलवान और सुंदर बनने
    का वरदान मांगते हैं। ब्रह्मा उनके शरीर को स्पर्श करके उनकी इच्छा पूरी करते हैं,
    जिससे अंधक शक्तिशाली और सुंदर बन जाते हैं। अपनी नई शक्ति के साथ, अंधक स्वर्ग पर
    विजय प्राप्त करने के लिए निकल पड़ते हैं और देवताओं को पराजित कर देते हैं।
- id: andhaka-conquers-three-worlds
  type: story
  keywords:
  - Andhaka
  - conquest
  - three worlds
  source:
    book: Shiv Puran
    sarga: '44'
  summary_en: After receiving a boon from Brahma, Andhaka becomes powerful and sets
    out to conquer the three worlds. He defeats the gods, including Indra, and takes
    control over the heavens, earth, and the netherworld. Andhaka indulges in pleasures
    with beautiful women across these realms.
  summary_hi: ब्रह्मा से वरदान प्राप्त करने के बाद, अंधक शक्तिशाली बनकर तीनों लोकों
    को जीतने के लिए निकल पड़ते हैं। वह इंद्र सहित देवताओं को पराजित कर स्वर्ग, पृथ्वी
    और पाताल पर अधिकार कर लेते हैं। अंधक इन लोकों में सुंदर स्त्रियों के साथ भोग-विलास
    में लिप्त हो जाते हैं।
- id: andhaka-defeat-by-veeraka
  type: story
  keywords:
  - Andhaka
  - Veeraka
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Andhaka, consumed by the fire of desire, engages in battle with Veeraka,
    a formidable warrior. Despite Andhaka's initial aggression, Veeraka defeats him
    swiftly, causing Andhaka to flee the battlefield in distress and exhaustion.
  summary_hi: अन्धक, कामाग्नि से दग्ध होकर, वीरक नामक महावीर के साथ युद्ध करता है।
    अन्धक के प्रारंभिक आक्रमण के बावजूद, वीरक उसे शीघ्र ही पराजित कर देता है, जिससे
    अन्धक युद्धभूमि से दुखी और थका हुआ भाग खड़ा होता है।
- id: daityas-defeated-by-veeraka
  type: story
  keywords:
  - Daityas
  - Veeraka
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Following Andhaka's defeat, other powerful demons like Prahlada, Virochana,
    and Bali engage in battle against Veeraka. Despite their might and numbers, Veeraka
    triumphs over them, cutting them down and causing many demons to perish.
  summary_hi: अन्धक की पराजय के बाद, प्रह्लाद, विरोचन और बलि जैसे अन्य शक्तिशाली दैत्य
    वीरक के खिलाफ युद्ध करते हैं। उनकी शक्ति और संख्या के बावजूद, वीरक उन पर विजय
    प्राप्त करता है, उन्हें काट देता है और कई दानवों को मार डालता है।
- id: shiva-pashupata-vrata
  type: practice
  keywords:
  - Shiva
  - Pashupata Vrata
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Lord Shiva decides to undertake the rigorous Pashupata Vrata, a vow
    so difficult that even gods and demons cannot perform it. He reassures Parvati
    to remain fearless and free from sorrow as he embarks on this divine penance.
  summary_hi: भगवान शिव अत्यंत कठिन पाशुपत व्रत करने का निर्णय लेते हैं, जो इतना कठिन
    है कि देवता और दानव भी इसे नहीं कर सकते। वह पार्वती को निडर और शोकमुक्त रहने का
    आश्वासन देते हैं क्योंकि वह इस दिव्य तपस्या को शुरू करते हैं।
- id: parvati-waiting-for-shiva
  type: story
  keywords:
  - Parvati
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: While Shiva performs the Pashupata Vrata, Parvati waits for his return
    on Mount Mandara. Despite being alone and fearful, she remains devoted, protected
    by her son Veeraka, who guards her vigilantly.
  summary_hi: जब शिव पाशुपत व्रत कर रहे होते हैं, पार्वती मंदर पर्वत पर उनके लौटने
    की प्रतीक्षा करती हैं। अकेली और भयभीत होने के बावजूद, वह समर्पित रहती हैं, और
    उनके पुत्र वीरक द्वारा संरक्षित रहती हैं, जो उनकी सतर्कता से रक्षा करता है।
- id: divine-transformation-episode
  type: story
  keywords:
  - transformation
  - divine-intervention
  source:
    book: Shiv Puran
    sarga: अ० ४५
  summary_en: In this episode, Brahma, Vishnu, and Indra, along with their armies,
    transform into women to enter a cave where male presence is forbidden. This transformation
    allows them to assist Parvati, who is pleased by their presence.
  summary_hi: इस प्रकरण में, ब्रह्मा, विष्णु और इंद्र अपनी सेनाओं के साथ स्त्री रूप
    धारण करते हैं ताकि वे एक गुफा में प्रवेश कर सकें जहाँ पुरुषों का प्रवेश वर्जित
    है। यह परिवर्तन उन्हें पार्वती की सहायता करने की अनुमति देता है, जो उनकी उपस्थिति
    से प्रसन्न होती हैं।
- id: parvati-battle-preparation
  type: event
  keywords:
  - battle
  - parvati
  source:
    book: Shiv Puran
    sarga: अ० ४५
  summary_en: Parvati, along with her companions, prepares for battle by appointing
    Virak as the commander. The divine forces, transformed into women, join her in
    the fight against the demons, showcasing remarkable battle skills.
  summary_hi: पार्वती अपनी सखियों के साथ युद्ध की तैयारी करती हैं और वीरक को सेनापति
    नियुक्त करती हैं। दिव्य शक्तियाँ, जो स्त्री रूप में परिवर्तित हो चुकी हैं, राक्षसों
    के खिलाफ लड़ाई में शामिल होती हैं और अद्भुत युद्ध कौशल का प्रदर्शन करती हैं।
- id: divine-weapons-episode
  type: story
  keywords:
  - divine-weapons
  - battle
  source:
    book: Shiv Puran
    sarga: अ० ४५
  summary_en: Various divine beings, including Brahmi, Gauri, and Narayani, arm themselves
    with powerful weapons like the conch, mace, and bow. They prepare to engage in
    battle against the demons, demonstrating their formidable prowess.
  summary_hi: विभिन्न दिव्य शक्तियाँ, जैसे ब्राह्मी, गौरी और नारायणी, शंख, गदा और
    धनुष जैसे शक्तिशाली हथियारों से सुसज्जित होती हैं। वे राक्षसों के खिलाफ युद्ध
    में शामिल होने की तैयारी करती हैं, अपनी अद्भुत शक्ति का प्रदर्शन करती हैं।
- id: shiva-and-andhakasura-battle
  type: story
  keywords:
  - Shiva
  - Andhakasura
  - battle
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 46
  summary_en: In this episode, Lord Shiva engages in a fierce battle with the demon
    Andhakasura. Andhakasura uses his blood to create more demons, but Shiva, with
    the help of Vishnu in the form of Kali, drinks the blood to prevent more demons
    from forming. Eventually, Shiva impales Andhakasura on his trident, and after
    being pleased with Andhakasura's penance, grants him the position of a Gana leader.
  summary_hi: इस प्रकरण में भगवान शिव राक्षस अंधकासुर के साथ एक भयंकर युद्ध में संलग्न
    होते हैं। अंधकासुर अपने रक्त से और अधिक राक्षस उत्पन्न करता है, लेकिन शिव, काली
    रूप में विष्णु की सहायता से, रक्त को पीकर और राक्षसों के बनने से रोकते हैं। अंततः,
    शिव अंधकासुर को अपने त्रिशूल पर लटका देते हैं और उसकी स्तुति से प्रसन्न होकर उसे
    गणपति पद प्रदान करते हैं।
- id: vighasa-demon-devours-gods
  type: story
  keywords:
  - Vighasa
  - demon
  - gods
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a fierce battle, the demon Vighasa devours the armies of the gods,
    including prominent deities like Vishnu, Brahma, Indra, and others. Only a warrior
    named Veerak remains, who seeks refuge with Shiva, narrating the dire situation.
  summary_hi: एक भयंकर युद्ध में विघस दैत्य ने विष्णु, ब्रह्मा, इंद्र और अन्य प्रमुख
    देवताओं सहित देवताओं की सेनाओं को निगल लिया। केवल वीरक नामक एक योद्धा बचता है,
    जो शिव की शरण में जाता है और इस गंभीर स्थिति का वर्णन करता है।
- id: vishnu-curse-and-redemption
  type: story
  keywords:
  - Vishnu
  - curse
  - redemption
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Vishnu was cursed by the Saptarishis to be devoured by demons for a
    long time. However, he is told that during a battle, he will be swallowed by the
    demon Vighasa, but will eventually escape by striking the demon from within. Later,
    he will take an avatar in the sacred Badari forest and be free from the curse.
  summary_hi: विष्णु को सप्तर्षियों द्वारा शाप दिया गया था कि वे लंबे समय तक दैत्यों
    द्वारा निगल लिए जाएंगे। हालांकि, उन्हें बताया गया कि एक युद्ध के दौरान विघस दैत्य
    उन्हें निगल लेगा, लेकिन वे अंततः दैत्य के भीतर से प्रहार कर निकल जाएंगे। बाद में,
    वे पवित्र बदरी वन में अवतार लेंगे और शाप से मुक्त हो जाएंगे।
- id: nandi-battle-with-demons
  type: story
  keywords:
  - Nandi
  - demons
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Nandi, created by Sage Shilad, engages in a fierce battle against demons.
    Despite being swallowed by a demon, Nandi is later released along with other deities
    by the divine intervention of Maharudra, who chants a powerful mantra.
  summary_hi: ऋषि शिलाद द्वारा उत्पन्न नंदी राक्षसों के खिलाफ एक घोर युद्ध में संलग्न
    होते हैं। एक राक्षस द्वारा निगल लिए जाने के बावजूद, नंदी को महा रुद्र के दिव्य
    मंत्र के माध्यम से अन्य देवताओं के साथ मुक्त कर दिया जाता है।
- id: shukracharya-captured-and-swallowed
  type: story
  keywords:
  - Shukracharya
  - capture
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shukracharya, the preceptor of the demons, attempts to revive the slain
    demons using his Sanjeevani Vidya. However, he is captured by the Ganas and presented
    to Shiva, who swallows him.
  summary_hi: शुक्राचार्य, जो दैत्यों के गुरु हैं, अपनी संजीवनी विद्या का उपयोग करके
    मारे गए दैत्यों को पुनर्जीवित करने का प्रयास करते हैं। हालांकि, उन्हें गणों द्वारा
    पकड़ लिया जाता है और शिव के समक्ष प्रस्तुत किया जाता है, जो उन्हें निगल लेते हैं।
- id: battle-against-hiranyakashipu-descendant
  type: story
  keywords:
  - Hiranyakashipu
  - battle
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: A descendant of Hiranyakashipu engages in a prolonged battle against
    Vishnu, Indra, and Shiva. Despite his efforts, he is eventually defeated by the
    combined might of the deities.
  summary_hi: हिरण्यकशिपु के वंशज विष्णु, इंद्र और शिव के खिलाफ एक लंबे युद्ध में
    संलग्न होते हैं। उनके प्रयासों के बावजूद, अंततः देवताओं की संयुक्त शक्ति द्वारा
    उन्हें पराजित कर दिया जाता है।
- id: andhaka-defeat-by-shiva
  type: story
  keywords:
  - Andhaka
  - Shiva
  - battle
  source:
    book: Shiv Puran
    sarga: Chapter 46
  summary_en: The demon Andhaka, despite being severely wounded by the gods, continued
    to fight due to a boon from Brahma. He used various weapons and illusions to attack
    Shiva and Parvati. Ultimately, Shiva defeated Andhaka by piercing his heart with
    a trident and lifted his body into the sky. Impressed by Andhaka's devotion, Shiva
    granted him the position of a Gana leader.
  summary_hi: दैत्य अन्धक, जो ब्रह्माजी के वरदान के कारण देवताओं के शस्त्रों से घायल
    होने के बावजूद लड़ता रहा, ने शिव और पार्वती पर विभिन्न हथियारों और माया का प्रयोग
    किया। अंततः शिव ने अपने त्रिशूल से उसके हृदय को भेदकर उसे आकाश में उठा लिया। अन्धक
    की भक्ति से प्रभावित होकर शिव ने उसे गणों का नेता बना दिया।
- id: andhaka-seeks-shukracharya-help
  type: story
  keywords:
  - Andhaka
  - Shukracharya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Andhaka, a great demon, becomes distressed after facing defeat and seeks
    the counsel of his guru, Shukracharya. He expresses his concerns about their defeat
    despite having Shukracharya's support, which usually makes them victorious against
    gods like Shiva and Vishnu.
  summary_hi: अन्धक, एक महान्‌ दैत्य, पराजय का सामना करने के बाद दुखी हो जाता है और
    अपने गुरु शुक्राचार्य के पास सलाह लेने जाता है। वह अपनी चिंता व्यक्त करता है कि
    उनकी पराजय हो रही है, जबकि शुक्राचार्य का समर्थन उन्हें आमतौर पर शिव और विष्णु
    जैसे देवताओं के खिलाफ विजयी बनाता है।
- id: sanjeevani-vidya-revives-demons
  type: story
  keywords:
  - Sanjeevani Vidya
  - Shukracharya
  source:
    book: Shiv Puran
    sarga: '47'
  summary_en: Shukracharya uses the Sanjeevani Vidya to revive the demons who were
    slain in battle. This act astonishes the Pramathas, who decide to inform Lord
    Shiva about the situation. The revived demons, including Tuhund and others, return
    from the abode of Yama and continue to fight fiercely.
  summary_hi: शुक्राचार्य संजीवनी विद्या का प्रयोग करके युद्ध में मारे गए दैत्यों
    को पुनर्जीवित कर देते हैं। यह देखकर प्रमथगण आश्चर्यचकित हो जाते हैं और शिवजी को
    इस स्थिति की सूचना देने का निर्णय लेते हैं। पुनर्जीवित दैत्य, तुहुण्ड और अन्य,
    यमलोक से लौटकर फिर से उग्रता से युद्ध करने लगते हैं।
- id: nandi-seeks-shiva-s-help
  type: story
  keywords:
  - Nandi
  - Shiva
  source:
    book: Shiv Puran
    sarga: '47'
  summary_en: Nandi, witnessing the revival of demons by Shukracharya, approaches
    Lord Shiva for assistance. Shiva instructs Nandi to swiftly capture Shukracharya
    from the midst of the demons, similar to how a hawk captures its prey.
  summary_hi: नंदी, शुक्राचार्य द्वारा दैत्यों के पुनर्जीवित होने को देखकर, शिवजी
    के पास सहायता के लिए जाते हैं। शिवजी नंदी को आदेश देते हैं कि वह शीघ्रता से दैत्यों
    के बीच से शुक्राचार्य को पकड़कर ले आएं, जैसे बाज अपने शिकार को पकड़ता है।
- id: nandi-captures-shukracharya
  type: event
  keywords:
  - Nandi
  - Shukracharya
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 47
  summary_en: Nandi, roaring like a lion, breaks through the demon army to capture
    Shukracharya, the preceptor of the demons. Despite the demons' efforts to protect
    Shukracharya with various weapons, Nandi captures him and takes him to Lord Shiva.
  summary_hi: नंदी सिंह की तरह गर्जना करते हुए दैत्य सेना को चीरते हुए शुक्राचार्य
    को पकड़ लेते हैं, जो दैत्यों के गुरु हैं। दैत्यों के विभिन्न हथियारों के बावजूद,
    नंदी उन्हें पकड़कर शिवजी के पास ले जाते हैं।
- id: andhaka-rallies-demons
  type: event
  keywords:
  - Andhaka
  - Demons
  source:
    book: Shiv Puran
    sarga: Part 1, Chapter 47
  summary_en: Andhaka, witnessing the demoralized demons, encourages them to fight
    bravely against the followers of Shiva. He vows to free Shukracharya and restore
    their strength and honor.
  summary_hi: अंधक, निराश दैत्यों को देखकर, उन्हें शिव के अनुयायियों के खिलाफ बहादुरी
    से लड़ने के लिए प्रेरित करता है। वह शुक्राचार्य को मुक्त करने और उनकी शक्ति और
    सम्मान को बहाल करने की कसम खाता है।
- id: andhaka-battle-with-pramathas
  type: story
  keywords:
  - Andhaka
  - Pramathas
  - battle
  - Nandi
  source:
    book: Shiv Puran
    sarga: '48'
  summary_en: In this episode, Andhaka, a demon, rallies his forces after being deceived
    by Nandi, who captured their guru Shukracharya. Andhaka urges his warriors to
    fight the Pramathas, Shiva's attendants, to rescue their guru. A fierce battle
    ensues with both sides using various weapons, resulting in chaos and destruction.
    Ultimately, the Pramathas, led by Nandi, defeat the demons and achieve victory.
  summary_hi: इस प्रकरण में, अन्धक नामक दैत्य अपने गुरु शुक्राचार्य को नन्दी द्वारा
    धोखा देकर पकड़े जाने के बाद अपनी सेना को संगठित करता है। अन्धक अपने योद्धाओं को
    प्रमथों, जो शिव के अनुचर हैं, से युद्ध करने और अपने गुरु को बचाने के लिए प्रेरित
    करता है। दोनों पक्षों के बीच भयंकर युद्ध होता है जिसमें विभिन्न हथियारों का उपयोग
    होता है, जिससे अराजकता और विनाश होता है। अंततः, नन्दी के नेतृत्व में प्रमथगण दैत्यों
    को पराजित कर विजय प्राप्त करते हैं।
- id: andhaka-battle-with-shiva-gana
  type: story
  keywords:
  - Andhaka
  - Shiva Gana
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Andhaka, upon seeing his army being destroyed by the Pramathas, mounted
    his chariot and attacked the Shiva Ganas with a barrage of arrows. Despite the
    fierce battle, the powerful Andhaka was eventually overwhelmed by the combined
    might of the Shiva Ganas, including Kartikeya, Nandi, and others.
  summary_hi: अन्धक ने अपनी सेना को नष्ट होते देख रथ पर चढ़कर शिवगणों पर हमला किया।
    भयंकर युद्ध के बावजूद, शक्तिशाली अन्धक को कार्तिकेय, नंदी और अन्य शिवगणों की संयुक्त
    शक्ति ने अंततः पराजित कर दिया।
- id: shukra-escape-from-shiva
  type: story
  keywords:
  - Shukra
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shukra, trapped inside Shiva's stomach, wandered for a hundred years
    searching for an exit. With the help of a powerful mantra given by Shiva, Shukra
    emerged through Shiva's lingam and was blessed by Shiva, who declared him as his
    son.
  summary_hi: शुक्र, शिव के पेट में फंसे हुए, सौ वर्षों तक बाहर निकलने का रास्ता खोजते
    रहे। शिव द्वारा दिए गए एक शक्तिशाली मंत्र की सहायता से, शुक्र शिव के लिंग के माध्यम
    से बाहर निकले और शिव ने उन्हें अपना पुत्र घोषित किया।
- id: shukracharya-chanting-mantra
  type: story
  keywords:
  - Shukracharya
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 49
  summary_en: Shukracharya, trapped inside Lord Shiva's stomach, chants a powerful
    mantra. This mantra praises Shiva's various attributes and forms. As a result
    of this chanting, Shukracharya is released from Shiva's body.
  summary_hi: शुक्राचार्य, भगवान शिव के उदर में फंसे हुए, एक शक्तिशाली मंत्र का जाप
    करते हैं। यह मंत्र शिव के विभिन्न गुणों और रूपों की स्तुति करता है। इस जाप के
    परिणामस्वरूप, शुक्राचार्य शिव के शरीर से मुक्त हो जाते हैं।
- id: andhaka-receives-boon
  type: story
  keywords:
  - Andhaka
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 49
  summary_en: Andhaka, a demon king, performs severe penance and praises Lord Shiva.
    Pleased with his devotion, Shiva grants him a boon of life and the position of
    Gana-pati, leader of Shiva's attendants.
  summary_hi: अन्धक, एक दानव राजा, कठोर तपस्या करता है और भगवान शिव की स्तुति करता
    है। उनकी भक्ति से प्रसन्न होकर, शिव उन्हें जीवनदान और गणपति, शिव के गणों के नेता
    का पद प्रदान करते हैं।
- id: andhaka-plea-to-shiva
  type: story
  keywords:
  - Andhaka
  - Shiva
  - forgiveness
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 49
  summary_en: Andhaka, feeling remorseful for his past actions driven by desire, pleads
    for forgiveness from Lord Shiva. He acknowledges his mistakes and seeks Shiva's
    protection, expressing his devotion and humility.
  summary_hi: अन्धक, अपनी कामविकार से प्रेरित पूर्व की गलतियों के लिए पश्चाताप करते
    हुए भगवान शिव से क्षमा मांगता है। वह अपनी गलतियों को स्वीकार करता है और शिव की
    शरण में आकर उनकी रक्षा की प्रार्थना करता है, अपनी भक्ति और विनम्रता प्रकट करता
    है।
- id: shiva-grants-andhaka-boon
  type: story
  keywords:
  - Andhaka
  - Shiva
  - boon
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 49
  summary_en: After Andhaka's plea, Shiva, pleased with his devotion and repentance,
    grants him a boon. Andhaka remembers his past and feels fulfilled, receiving blessings
    from Shiva and Parvati.
  summary_hi: अन्धक की प्रार्थना के बाद, शिव उसकी भक्ति और पश्चाताप से प्रसन्न होकर
    उसे वरदान देते हैं। अन्धक अपने अतीत को याद करता है और शिव और पार्वती से आशीर्वाद
    प्राप्त कर संतुष्ट महसूस करता है।
- id: shukracharya-tapasya-and-shiva-boon
  type: story
  keywords:
  - Shukracharya
  - Shiva
  - Tapasya
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Shukracharya, the son of Bhrigu, performed intense penance in Varanasi
    to please Lord Shiva. He established a Shiva Linga and performed various rituals,
    including bathing the deity with Panchamrit and offering numerous fragrant flowers.
    Despite his efforts, when Shiva did not appear, Shukracharya adopted a more severe
    form of penance by consuming smoke. Eventually, Shiva, pleased with his devotion,
    appeared and offered him a boon.
  summary_hi: शुक्राचार्य, जो भृगु के पुत्र थे, ने भगवान शिव को प्रसन्न करने के लिए
    वाराणसी में कठोर तप किया। उन्होंने एक शिवलिंग की स्थापना की और पंचामृत से स्नान
    और सुगंधित फूलों की अर्पण सहित विभिन्न अनुष्ठान किए। जब शिव प्रकट नहीं हुए, तो
    शुक्राचार्य ने धूम्रपान करके एक और कठोर तपस्या अपनाई। अंततः, शिव उनके भक्ति से
    प्रसन्न होकर प्रकट हुए और उन्हें वरदान दिया।
- id: shukreshwar-linga-establishment
  type: story
  keywords:
  - shukreshwar
  - linga
  - bhargava
  source:
    book: Shiv Puran
    sarga: अ० ५०
  summary_en: In this episode, Bhargava performs intense penance and establishes a
    linga named Shukreshwar. Lord Shiva, pleased with his devotion, grants him the
    boon of the Mritasanjivani Vidya, a powerful knowledge that can bring the dead
    back to life. Bhargava's devotion and the establishment of the Shukreshwar Linga
    ensure that those who worship it will have their desires fulfilled.
  summary_hi: इस प्रकरण में, भार्गव ने कठोर तप किया और शुक्रेश्वर नामक लिंग की स्थापना
    की। भगवान शिव, उनकी भक्ति से प्रसन्न होकर, उन्हें मृतसंजीवनी विद्या का वरदान देते
    हैं, जो मृतकों को पुनर्जीवित कर सकती है। भार्गव की भक्ति और शुक्रेश्वर लिंग की
    स्थापना यह सुनिश्चित करती है कि जो लोग इसकी पूजा करेंगे, उनकी इच्छाएं पूरी होंगी।
- id: shukracharya-mrityunjaya-vidya
  type: story
  keywords:
  - Shukracharya
  - Mrityunjaya Vidya
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 50
  summary_en: Shukracharya, through his intense penance, received the knowledge of
    Mrityunjaya Vidya from Lord Shiva. This knowledge granted him the power to conquer
    death. Satisfied with this boon, Shukracharya returned to his abode.
  summary_hi: शुक्राचार्य ने अपनी तपस्या के बल पर शिवजी से मृत्युंजय विद्या प्राप्त
    की। इस विद्या ने उन्हें मृत्यु पर विजय प्राप्त करने की शक्ति दी। इस वरदान से संतुष्ट
    होकर, शुक्राचार्य अपने स्थान को लौट गए।
- id: banasura-shiva-boon
  type: story
  keywords:
  - Banasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 51
  summary_en: Banasura, a devotee of Shiva, pleased the Lord with his Tandava dance.
    As a boon, Shiva agreed to reside in Banasura's city. This episode also involves
    Shiva granting the boon of Ganapatya to Banasura.
  summary_hi: बाणासुर, जो शिव का भक्त था, ने तांडव नृत्य से भगवान शिव को प्रसन्न किया।
    वरदान के रूप में, शिव ने बाणासुर की नगरी में निवास करने का वचन दिया। इस कथा में
    शिव द्वारा बाणासुर को गाणपत्य पद का वरदान देना भी शामिल है।
- id: prahlada-lineage
  type: character
  keywords:
  - Prahlada
  - Banasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khanda, Chapter 51
  summary_en: The lineage of Prahlada is described, highlighting Banasura as a descendant.
    Banasura is depicted as a powerful and devout follower of Shiva, known for his
    thousand arms and his devotion that pleased Shiva.
  summary_hi: प्रह्लाद के वंश का वर्णन किया गया है, जिसमें बाणासुर को उनके वंशज के
    रूप में दर्शाया गया है। बाणासुर को शिव का शक्तिशाली और भक्त अनुयायी बताया गया
    है, जो अपनी हजार भुजाओं और शिव को प्रसन्न करने वाली भक्ति के लिए प्रसिद्ध है।
- id: brahmaji-marichi-kashyap-lineage
  type: character
  keywords:
  - Brahma
  - Marichi
  - Kashyap
  source:
    book: Shiv Puran
    sarga: Chapter 6-7
  summary_en: Marichi, the mind-born son of Brahma, was a great sage and the father
    of Kashyap, who played a crucial role in the creation of the universe. Kashyap
    married the thirteen daughters of Daksha, and through them, various beings, including
    gods and demons, were born.
  summary_hi: ब्रह्माजी के मानसपुत्र मरीचि एक महान मुनि थे और कश्यप के पिता थे, जिन्होंने
    सृष्टि के निर्माण में महत्वपूर्ण भूमिका निभाई। कश्यप ने दक्ष की तेरह कन्याओं से
    विवाह किया, और उनके माध्यम से विभिन्न प्राणी, जिनमें देवता और दैत्य शामिल हैं,
    उत्पन्न हुए।
- id: hiranyakashipu-hiranyaksha-birth
  type: story
  keywords:
  - Hiranyakashipu
  - Hiranyaksha
  source:
    book: Shiv Puran
    sarga: Chapter 10-11
  summary_en: Diti, the eldest daughter of Daksha, gave birth to two powerful sons,
    Hiranyakashipu and Hiranyaksha. Hiranyakashipu had four sons, among whom Prahlad
    was a devout follower of Vishnu.
  summary_hi: दिति, दक्ष की ज्येष्ठ पुत्री, ने दो शक्तिशाली पुत्रों, हिरण्यकशिपु और
    हिरण्याक्ष को जन्म दिया। हिरण्यकशिपु के चार पुत्र थे, जिनमें प्रह्लाद भगवान विष्णु
    के परम भक्त थे।
- id: prahlad-virochan-bali-lineage
  type: character
  keywords:
  - Prahlad
  - Virochan
  - Bali
  source:
    book: Shiv Puran
    sarga: Chapter 12-14
  summary_en: Prahlad, a devout follower of Vishnu, was the father of Virochan, who
    was known for his generosity. Virochan's son Bali was a great donor and a devotee
    of Shiva, who gave the entire earth to Vishnu in his Vamana avatar.
  summary_hi: प्रह्लाद, जो भगवान विष्णु के परम भक्त थे, विरोचन के पिता थे, जो अपनी
    उदारता के लिए प्रसिद्ध थे। विरोचन के पुत्र बलि एक महान दानी और शिवभक्त थे, जिन्होंने
    वामन अवतार में विष्णु को पूरी पृथ्वी दान कर दी।
- id: banasur-shiva-devotion
  type: story
  keywords:
  - Banasur
  - Shiva
  source:
    book: Shiv Puran
    sarga: Chapter 17-27
  summary_en: Banasur, the son of Bali, was a devout follower of Shiva. Pleased with
    Banasur's devotion, Shiva granted him a boon and resided in his city, Shonitpur,
    along with his followers and sons. Banasur's devotion made the gods his servants.
  summary_hi: बाणासुर, जो बलि का पुत्र था, शिव का परम भक्त था। बाणासुर की भक्ति से
    प्रसन्न होकर, शिव ने उसे वरदान दिया और अपने गणों और पुत्रों के साथ उसके नगर शोणितपुर
    में निवास किया। बाणासुर की भक्ति ने देवताओं को उसका सेवक बना दिया।
- id: rudra-bana-confrontation
  type: story
  keywords:
  - Rudra
  - Bana
  - confrontation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: In this episode, Rudra confronts Bana, the son of Bali, who is filled
    with arrogance and seeks a formidable opponent to satisfy his desire for battle.
    Rudra admonishes Bana for his pride and warns him of an impending fierce battle
    where his mighty arms will be severed like wood by weapons. Bana is advised to
    return home and prepare for the great conflict.
  summary_hi: इस प्रकरण में, रुद्र अहंकार से भरे बाण, जो बलि का पुत्र है और युद्ध
    की इच्छा से एक शक्तिशाली प्रतिद्वंद्वी की खोज कर रहा है, का सामना करते हैं। रुद्र
    बाण को उसके अहंकार के लिए फटकारते हैं और उसे चेतावनी देते हैं कि एक भयंकर युद्ध
    आने वाला है जिसमें उसकी शक्तिशाली भुजाएँ हथियारों से लकड़ी की तरह काट दी जाएँगी।
    बाण को घर लौटकर इस महान संघर्ष की तैयारी करने की सलाह दी जाती है।
- id: aniruddha-usa-abduction
  type: story
  keywords:
  - Aniruddha
  - Usha
  - Abduction
  source:
    book: Shiv Puran
    sarga: अ० ५२
  summary_en: Aniruddha, the grandson of Lord Krishna, is drawn to Usha, the daughter
    of Banasura, due to the divine influence of Goddess Parvati. He abducts her and
    takes her to Dwarka, causing Usha to lament her situation. This event sets off
    a series of conflicts involving Banasura and the divine forces.
  summary_hi: भगवान कृष्ण के पौत्र अनिरुद्ध, देवी पार्वती की दिव्य माया के कारण बाणासुर
    की पुत्री ऊषा की ओर आकर्षित होते हैं। वह उसे अपहरण कर द्वारका ले जाते हैं, जिससे
    ऊषा अपनी स्थिति पर विलाप करती है। यह घटना बाणासुर और दिव्य शक्तियों के बीच संघर्ष
    की श्रृंखला को शुरू करती है।
- id: usha-chitralekha-dialogue
  type: story
  keywords:
  - Usha
  - Chitralekha
  - Dialogue
  source:
    book: Shiv Puran
    sarga: अ० ५२
  summary_en: Usha, distressed by her separation from Aniruddha, confides in her friend
    Chitralekha. She expresses her desire to reunite with Aniruddha, whom she believes
    is destined to be her husband. Chitralekha promises to help Usha find Aniruddha,
    using her abilities to locate him across the three worlds.
  summary_hi: अनिरुद्ध से अलगाव के कारण व्यथित ऊषा अपनी सखी चित्रलेखा से अपनी व्यथा
    साझा करती है। वह अनिरुद्ध से पुनर्मिलन की इच्छा व्यक्त करती है, जिसे वह अपना नियत
    पति मानती है। चित्रलेखा ऊषा से वादा करती है कि वह अपनी क्षमताओं का उपयोग करके
    अनिरुद्ध को तीनों लोकों में ढूंढ निकालेगी।
- id: usha-aniruddha-love-story
  type: story
  keywords:
  - Usha
  - Aniruddha
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Usha, the daughter of Banasura, falls in love with Aniruddha, the grandson
    of Krishna, after seeing his portrait. With the help of her friend Chitralekha,
    who uses her divine powers, Aniruddha is brought to Usha's palace. Usha is overjoyed
    to see Aniruddha, but also feels shy and anxious about the situation.
  summary_hi: बाणासुर की पुत्री ऊषा, कृष्ण के पौत्र अनिरुद्ध के चित्र को देखकर उनसे
    प्रेम करने लगती है। अपनी सखी चित्रलेखा की सहायता से, जो अपनी दिव्य शक्तियों का
    उपयोग करती है, अनिरुद्ध को ऊषा के महल में लाया जाता है। अनिरुद्ध को देखकर ऊषा
    अत्यंत प्रसन्न होती है, लेकिन साथ ही वह संकोच और चिंता भी महसूस करती है।
- id: aniruddha-battle-with-banasura
  type: story
  keywords:
  - Aniruddha
  - Banasura
  - battle
  source:
    book: Shiv Puran
    sarga: '53'
  summary_en: Aniruddha, the grandson of Krishna, engages in a fierce battle with
    Banasura, a devotee of Shiva. Despite being bound by Banasura using deceit, Aniruddha
    displays immense valor and strength, likened to that of Vishnu, and defeats a
    large number of Banasura's forces. Banasura, enraged, commands his charioteer
    to kill Aniruddha, but is advised against it by the wise demon Kumbhanda.
  summary_hi: कृष्ण के पौत्र अनिरुद्ध और शिवभक्त बाणासुर के बीच भयंकर युद्ध होता है।
    बाणासुर द्वारा छल से बांध दिए जाने के बावजूद, अनिरुद्ध विष्णु के समान पराक्रम
    और शक्ति का प्रदर्शन करते हैं और बाणासुर की सेना के बड़े हिस्से को पराजित करते
    हैं। बाणासुर क्रोधित होकर अपने सारथी को अनिरुद्ध को मारने का आदेश देता है, लेकिन
    कुंभाण्ड नामक बुद्धिमान राक्षस उसे ऐसा न करने की सलाह देता है।
- id: aniruddha-and-banasura-confrontation
  type: story
  keywords:
  - Aniruddha
  - Banasura
  - confrontation
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Aniruddha confronts Banasura, who is surprised and angered by Aniruddha's
    brave words. A celestial voice advises Banasura to control his anger, reminding
    him of Shiva's supremacy and the futility of pride. Banasura heeds the advice
    and refrains from harming Aniruddha.
  summary_hi: अनिरुद्ध बाणासुर का सामना करते हैं, जो अनिरुद्ध के वीरतापूर्ण शब्दों
    से आश्चर्यचकित और क्रोधित हो जाता है। एक आकाशवाणी बाणासुर को क्रोध पर नियंत्रण
    रखने की सलाह देती है, शिव की सर्वोच्चता और गर्व की व्यर्थता की याद दिलाती है।
    बाणासुर इस सलाह को मानता है और अनिरुद्ध को नुकसान नहीं पहुँचाता।
- id: aniruddha-imprisonment-and-durga-intervention
  type: story
  keywords:
  - Aniruddha
  - imprisonment
  - Durga
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: Aniruddha is imprisoned and bound by venomous snakes. He prays to Goddess
    Durga for rescue. Pleased by his devotion, Durga appears and destroys the snakes,
    freeing Aniruddha. She then disappears, leaving Aniruddha relieved and grateful.
  summary_hi: अनिरुद्ध को कैद कर विषैले सर्पों से बांध दिया जाता है। वह देवी दुर्गा
    से प्रार्थना करते हैं। उनकी भक्ति से प्रसन्न होकर, दुर्गा प्रकट होती हैं और सर्पों
    को नष्ट कर अनिरुद्ध को मुक्त कर देती हैं। इसके बाद वह अदृश्य हो जाती हैं, जिससे
    अनिरुद्ध राहत और कृतज्ञता महसूस करते हैं।
- id: aniruddha-and-ushas-marriage
  type: story
  keywords:
  - Aniruddha
  - Usha
  - marriage
  source:
    book: Shiv Puran
    sarga: Rudra Samhita
  summary_en: After being freed by Goddess Durga, Aniruddha marries Usha, the daughter
    of Banasura. With the blessings of Shiva and Durga, Aniruddha and Usha live happily
    together.
  summary_hi: देवी दुर्गा द्वारा मुक्त किए जाने के बाद, अनिरुद्ध बाणासुर की पुत्री
    उषा से विवाह करते हैं। शिव और दुर्गा के आशीर्वाद से, अनिरुद्ध और उषा सुखपूर्वक
    साथ रहते हैं।
- id: aniruddha-imprisonment-and-rescue
  type: story
  keywords:
  - Aniruddha
  - Durga
  - rescue
  source:
    book: Shiv Puran
    sarga: द्वितीयायां संहिताया पञ्चमे युद्धखण्डे
  summary_en: Aniruddha, bound by venomous snakes and longing for his beloved, prays
    to Goddess Durga for help. In response, Goddess Kali appears and frees him by
    destroying the snakes and breaking his cage. Aniruddha is then reunited with his
    beloved and returns to his previous joyful life.
  summary_hi: अनिरुद्ध, जो विषैले सर्पों से बंधे हुए थे और अपनी प्रिया के बिना व्याकुल
    थे, देवी दुर्गा से सहायता के लिए प्रार्थना करते हैं। इसके उत्तर में, देवी काली
    प्रकट होती हैं और सर्पों को नष्ट कर और पिंजरे को तोड़कर उन्हें मुक्त करती हैं।
    अनिरुद्ध अपनी प्रिया से पुनः मिल जाते हैं और पूर्व की भांति आनंदित जीवन व्यतीत
    करने लगते हैं।
- id: krishna-prepares-for-battle
  type: event
  keywords:
  - Krishna
  - Narada
  - battle
  source:
    book: Shiv Puran
    sarga: रुद्रसंहिता
  summary_en: Upon hearing from Narada about Aniruddha's capture, Krishna becomes
    distressed and prepares for battle. He gathers his allies, including Pradyumna
    and Balarama, and sets out with a large army to rescue Aniruddha from Banasura's
    city.
  summary_hi: नारद से अनिरुद्ध के बंदी होने की सूचना पाकर कृष्ण दुखी हो जाते हैं और
    युद्ध की तैयारी करते हैं। वे प्रद्युम्न और बलराम सहित अपने सहयोगियों को एकत्रित
    करते हैं और बड़ी सेना के साथ अनिरुद्ध को बाणासुर के नगर से बचाने के लिए निकल पड़ते
    हैं।
- id: battle-of-banasura
  type: event
  keywords:
  - Banasura
  - Krishna
  - Shiva
  source:
    book: Shiv Puran
    sarga: '54'
  summary_en: A fierce battle takes place between the forces of Banasura, protected
    by Lord Shiva, and the Yadavas led by Lord Krishna. Various divine beings, including
    Brahma and other gods, gather to witness the battle. The conflict involves multiple
    duels, including Krishna against Shiva and Pradyumna against Kartikeya.
  summary_hi: बाणासुर की रक्षा के लिए भगवान शिव और उनके गणों के साथ श्रीकृष्ण और यदुवंशी
    योद्धाओं के बीच भयंकर युद्ध होता है। इस युद्ध को देखने के लिए ब्रह्मा और अन्य
    देवता भी आते हैं। युद्ध में कृष्ण और शिव, प्रद्युम्न और कार्तिकेय के बीच द्वंद्व
    होता है।
- id: shiva-and-krishna-duel
  type: event
  keywords:
  - Shiva
  - Krishna
  - Duel
  source:
    book: Shiv Puran
    sarga: '54'
  summary_en: During the battle, Lord Krishna and Lord Shiva engage in a direct duel.
    Krishna uses his Sharnga bow to attack Shiva, who counters with his divine weapons,
    neutralizing Krishna's attacks. The duel showcases the immense power and skill
    of both deities.
  summary_hi: युद्ध के दौरान, भगवान कृष्ण और भगवान शिव के बीच सीधा द्वंद्व होता है।
    कृष्ण अपने शारंग धनुष से शिव पर आक्रमण करते हैं, जिसे शिव अपने दिव्य अस्त्रों
    से निष्क्रिय कर देते हैं। यह द्वंद्व दोनों देवताओं की अपार शक्ति और कौशल को दर्शाता
    है।
- id: battle-of-fevers
  type: event
  keywords:
  - Vishnu Fever
  - Shiva Fever
  - Jvara
  source:
    book: Shiv Puran
    sarga: '54'
  summary_en: In the midst of the battle, Lord Krishna releases his Vishnu Fever to
    combat the forces of Shiva. In response, Shiva releases his own fever, leading
    to a cosmic battle between the two fevers. Ultimately, the Vishnu Fever, unable
    to withstand Shiva's fever, seeks refuge and praises Shiva.
  summary_hi: युद्ध के बीच में, भगवान कृष्ण अपनी विष्णु ज्वर को शिव की सेना से लड़ने
    के लिए छोड़ते हैं। इसके जवाब में, शिव अपना ज्वर छोड़ते हैं, जिससे दोनों ज्वरों
    के बीच एक ब्रह्मांडीय युद्ध होता है। अंततः, विष्णु ज्वर शिव के ज्वर का सामना नहीं
    कर पाता और शिव की शरण में जाकर उनकी स्तुति करता है।
- id: skanda-pradyumna-battle
  type: event
  keywords:
  - Skanda
  - Pradyumna
  - battle
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In a fierce battle, Skanda, also known as Kartikeya, uses his power
    to strike Pradyumna, causing him to retreat from the battlefield, bleeding. Despite
    his strength, Pradyumna is unable to withstand Skanda's attack and is forced to
    withdraw.
  summary_hi: एक भयंकर युद्ध में, स्कंद, जिन्हें कार्तिकेय के नाम से भी जाना जाता
    है, अपनी शक्ति का उपयोग करके प्रद्युम्न पर प्रहार करते हैं, जिससे प्रद्युम्न को
    युद्धभूमि से पीछे हटना पड़ता है। अपनी शक्ति के बावजूद, प्रद्युम्न स्कंद के हमले
    का सामना नहीं कर पाते और पीछे हटने के लिए मजबूर हो जाते हैं।
- id: garuda-bull-battle
  type: event
  keywords:
  - Garuda
  - Bull
  - battle
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Garuda, after taking on multiple forms and consuming ocean water, is
    attacked by Shiva's bull. The bull, with great speed and force, strikes Garuda
    with its horns, causing Garuda to be astonished and flee the battlefield.
  summary_hi: गरुड़, जो महासागर का जल पीकर और कई रूप धारण कर चुके थे, शिव के बैल द्वारा
    आक्रमण किए जाते हैं। बैल, अपनी तेज गति और शक्ति के साथ, गरुड़ को अपने सींगों से
    प्रहार करता है, जिससे गरुड़ आश्चर्यचकित होकर युद्धभूमि से भाग जाते हैं।
- id: krishna-shiva-meeting
  type: event
  keywords:
  - Krishna
  - Shiva
  - meeting
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After witnessing the events on the battlefield, Krishna, amazed by Shiva's
    power, instructs his charioteer to take him to Shiva. Upon reaching, Krishna humbly
    prays to Shiva, acknowledging his supreme power and seeking his guidance.
  summary_hi: युद्धभूमि की घटनाओं को देखकर, कृष्ण शिव की शक्ति से प्रभावित होते हैं
    और अपने सारथी को शिव के पास ले जाने का निर्देश देते हैं। वहां पहुंचकर, कृष्ण विनम्रता
    से शिव की प्रार्थना करते हैं, उनकी सर्वोच्च शक्ति को स्वीकार करते हुए और उनका
    मार्गदर्शन मांगते हैं।
- id: garuda-battles-banasura
  type: event
  keywords:
  - Garuda
  - Banasura
  source:
    book: Shiv Puran
    sarga: '55'
  summary_en: In a fierce battle, Garuda, in a fit of rage, decimates Banasura's army
    with his powerful wings. Witnessing the destruction of his forces, Banasura, a
    devotee of Shiva, becomes enraged and attacks Garuda and the Yadavas with numerous
    arrows.
  summary_hi: एक भयंकर युद्ध में, गरुड़ ने क्रोध में आकर अपने शक्तिशाली पंखों से बाणासुर
    की सेना को नष्ट कर दिया। अपनी सेना की तबाही देखकर, शिव भक्त बाणासुर क्रोधित हो
    गया और गरुड़ और यादवों पर अनेक बाणों से हमला किया।
- id: krishna-battles-banasura
  type: event
  keywords:
  - Krishna
  - Banasura
  source:
    book: Shiv Puran
    sarga: '55'
  summary_en: During the battle, Krishna, an incarnation of Vishnu, becomes furious
    and attacks Banasura and his soldiers with arrows. He destroys Banasura's bow
    and chariot, but Banasura retaliates by striking Krishna with a mace, causing
    him to fall.
  summary_hi: युद्ध के दौरान, विष्णु के अवतार कृष्ण क्रोधित हो गए और बाणासुर और उसकी
    सेना पर बाणों से हमला किया। उन्होंने बाणासुर के धनुष और रथ को नष्ट कर दिया, लेकिन
    बाणासुर ने गदा से प्रहार कर कृष्ण को गिरा दिया।
- id: shiva-intervenes-in-battle
  type: event
  keywords:
  - Shiva
  - Krishna
  source:
    book: Shiv Puran
    sarga: '55'
  summary_en: As Krishna prepares to decapitate Banasura, Shiva intervenes, reminding
    Krishna of his promise not to kill Banasura. Shiva requests Krishna to withdraw
    his Sudarshan Chakra, as it would be ineffective against his devotee.
  summary_hi: जब कृष्ण बाणासुर का सिर काटने की तैयारी करते हैं, तो शिव हस्तक्षेप करते
    हैं और कृष्ण को उनकी बाणासुर को न मारने की प्रतिज्ञा की याद दिलाते हैं। शिव कृष्ण
    से अपने सुदर्शन चक्र को वापस लेने का अनुरोध करते हैं, क्योंकि यह उनके भक्त के
    खिलाफ निष्फल होगा।
- id: shiva-grants-boon-to-banasura
  type: event
  keywords:
  - Shiva
  - Banasura
  source:
    book: Shiv Puran
    sarga: '55'
  summary_en: Shiva grants Banasura a boon that he will not face death, ensuring his
    safety. Shiva is pleased with Krishna's adherence to his command and asks him
    to return home, ending the battle.
  summary_hi: शिव बाणासुर को यह वरदान देते हैं कि उसे मृत्यु का भय नहीं होगा, जिससे
    उसकी सुरक्षा सुनिश्चित होती है। शिव कृष्ण की आज्ञा पालन से प्रसन्न होते हैं और
    उन्हें घर लौटने के लिए कहते हैं, जिससे युद्ध समाप्त हो जाता है।
- id: krishna-victory-over-banasura
  type: story
  keywords:
  - Krishna
  - Banasura
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Chapter 55
  summary_en: After hearing Shiva's words, Krishna, victorious and unharmed, enters
    the inner chambers and reassures Aniruddha and his wife. He accepts the jewels
    given by Banasura and, with Shiva's permission, departs for Dwarka with his family,
    defeating Varuna along the way.
  summary_hi: शिवजी के वचन सुनकर, श्रीकृष्ण विजयी और अक्षत शरीर के साथ अन्तःपुर में
    प्रवेश करते हैं और अनिरुद्ध और उनकी पत्नी को आश्वासन देते हैं। वे बाणासुर द्वारा
    दिए गए रत्नों को स्वीकार करते हैं और शिवजी की आज्ञा से अपने परिवार के साथ द्वारका
    के लिए प्रस्थान करते हैं, मार्ग में वरुण को पराजित करते हुए।
- id: banasura-atonement-and-dance
  type: story
  keywords:
  - Banasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Chapter 56
  summary_en: After Krishna and Aniruddha leave for Dwarka, Banasura feels remorseful
    for his ignorance. Nandi advises him to remember Shiva and perform a dance to
    please him. Banasura performs a Tandava dance, which pleases Shiva, who is known
    for his love of dance and music.
  summary_hi: श्रीकृष्ण और अनिरुद्ध के द्वारका चले जाने के बाद, बाणासुर अपने अज्ञान
    के लिए पछताता है। नंदी उसे शिवजी का स्मरण करने और उन्हें प्रसन्न करने के लिए तांडव
    नृत्य करने की सलाह देते हैं। बाणासुर तांडव नृत्य करता है, जिससे शिवजी प्रसन्न
    होते हैं, जो नृत्य और संगीत के प्रेमी हैं।
- id: banasura-devotion-to-shiva
  type: story
  keywords:
  - Banasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Pancham Yuddha Khand
  summary_en: Banasura, a devotee of Shiva, offers his devotion and is blessed by
    Shiva with the promise of achieving everything he desires. Shiva then disappears,
    leaving Banasura content and joyful.
  summary_hi: बाणासुर, जो शिव का भक्त है, अपनी भक्ति अर्पित करता है और शिव उसे आशीर्वाद
    देते हैं कि वह जो चाहेगा उसे प्राप्त करेगा। इसके बाद शिव अंतर्धान हो जाते हैं,
    जिससे बाणासुर संतुष्ट और प्रसन्न होता है।
- id: gajasura-tapasya-and-boon
  type: story
  keywords:
  - Gajasura
  - Brahma
  source:
    book: Shiv Puran
    sarga: Rudra Samhita, Yuddha Khand
  summary_en: Gajasura, the son of Mahishasura, performs severe penance to please
    Brahma and asks for a boon to be invincible to beings under the influence of desire.
    Brahma grants him the boon, making him a powerful and formidable being.
  summary_hi: गजासुर, जो महिषासुर का पुत्र है, ब्रह्मा को प्रसन्न करने के लिए कठोर
    तप करता है और उनसे यह वरदान मांगता है कि वह काम के वशीभूत प्राणियों के लिए अवध्य
    हो जाए। ब्रह्मा उसे यह वरदान देते हैं, जिससे वह एक शक्तिशाली और दुर्जेय प्राणी
    बन जाता है।
- id: gajasura-boon-from-brahma
  type: story
  keywords:
  - gajasura
  - boon
  - brahma
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Gajasura, the son of Mahishasura, performed intense penance and pleased
    Brahma, who granted him a boon. Gajasura asked to be invincible to gods and humans,
    and to enjoy all the wealth of the world. Satisfied with the boon, Gajasura returned
    to his abode.
  summary_hi: गजासुर, जो महिषासुर का पुत्र था, ने कठोर तप किया और ब्रह्मा को प्रसन्न
    किया, जिन्होंने उसे वरदान दिया। गजासुर ने देवताओं और मनुष्यों से अजेय होने और
    संसार की सारी संपत्ति का भोग करने का वरदान मांगा। वरदान से संतुष्ट होकर गजासुर
    अपने स्थान पर लौट गया।
- id: gajasura-conquers-world
  type: story
  keywords:
  - gajasura
  - conquest
  - devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: After receiving a boon from Brahma, Gajasura conquered all directions
    and the three worlds, subjugating gods, demons, humans, and celestial beings.
    He took over the abodes of the guardians of the world and resided in the celestial
    palace of Indra, built by Vishwakarma.
  summary_hi: ब्रह्मा से वरदान प्राप्त करने के बाद, गजासुर ने सभी दिशाओं और तीनों
    लोकों को जीत लिया, देवताओं, असुरों, मनुष्यों और दिव्य प्राणियों को अपने अधीन कर
    लिया। उसने लोकपालों के स्थानों पर कब्जा कर लिया और विश्वकर्मा द्वारा निर्मित इंद्र
    के स्वर्गीय महल में निवास किया।
- id: gajasura-tyranny
  type: story
  keywords:
  - gajasura
  - tyranny
  - devas
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Gajasura, intoxicated by his power and wealth, began to oppress the
    gods, sages, and humans. His tyranny led the devas to seek refuge with Shiva,
    pleading for relief from Gajasura's oppression.
  summary_hi: गजासुर, अपनी शक्ति और संपत्ति से मदमस्त होकर, देवताओं, ऋषियों और मनुष्यों
    को सताने लगा। उसकी अत्याचार से परेशान होकर देवताओं ने शिव की शरण ली और गजासुर
    के अत्याचार से मुक्ति की प्रार्थना की।
- id: gajasura-invasion-of-kashi
  type: event
  keywords:
  - Gajasura
  - Kashi
  source:
    book: Shiv Puran
    sarga: '57'
  summary_en: The demon Gajasura, driven by past enmity, invades the city of Kashi,
    causing distress to the residents and devotees of Shiva. The gods, led by Indra,
    seek refuge with Shiva, requesting him to protect his devotees and defeat Gajasura.
  summary_hi: गजासुर नामक दैत्य, पूर्व वैरभाव से प्रेरित होकर काशी नगरी पर आक्रमण
    करता है, जिससे शिव भक्तों और निवासियों को कष्ट होता है। इन्द्र के नेतृत्व में
    देवता शिव की शरण में जाते हैं और उनसे गजासुर का वध करने की प्रार्थना करते हैं।
- id: shiva-battles-gajasura
  type: story
  keywords:
  - Shiva
  - Gajasura
  source:
    book: Shiv Puran
    sarga: '57'
  summary_en: Shiva, armed with his trident, confronts the demon Gajasura in a fierce
    battle. Despite Gajasura's formidable strength and attacks, Shiva ultimately defeats
    him with his trident. Gajasura, realizing his defeat, praises Shiva and acknowledges
    him as his lord.
  summary_hi: शिव अपने त्रिशूल के साथ गजासुर का सामना करते हैं और उनके बीच भयंकर युद्ध
    होता है। गजासुर की शक्ति और आक्रमण के बावजूद, शिव अंततः उसे त्रिशूल से पराजित
    करते हैं। पराजय के बाद, गजासुर शिव की स्तुति करता है और उन्हें अपना स्वामी मानता
    है।
- id: gajasura-boon-from-shiva
  type: story
  keywords:
  - Gajasura
  - Shiva
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: Gajasura, the son of Mahishasura, after being defeated by Shiva, requests
    a boon from the deity. He asks Shiva to wear his skin, purified by the fire of
    Shiva's trident, as a garment. Gajasura desires that his skin remains fragrant,
    soft, and unburnt by fire, and that Shiva be known as 'Krittivasa' from that day
    forward.
  summary_hi: महिषासुर के पुत्र गजासुर, शिव द्वारा पराजित होने के बाद, शिव से एक वरदान
    मांगते हैं। वह शिव से अनुरोध करता है कि वे उसके चर्म को, जो शिव के त्रिशूल की
    अग्नि से शुद्ध हुआ है, वस्त्र के रूप में धारण करें। गजासुर चाहता है कि उसका चर्म
    सुगंधित, कोमल और अग्नि से नष्ट न हो, और उस दिन से शिव 'कृत्तिवास' के नाम से जाने
    जाएं।
- id: dundubhinirhad-brahmin-slaughter
  type: story
  keywords:
  - Dundubhinirhad
  - Brahmin
  - slaughter
  source:
    book: Shiv Puran
    sarga: '58'
  summary_en: The demon Dundubhinirhad, using his magical powers, began slaughtering
    Brahmins in the forest where they collected sacred materials. He believed that
    by destroying the Brahmins, the Vedas and the gods would also be destroyed, allowing
    him to rule the three worlds.
  summary_hi: दानव दुंदुभिनिर्हाद ने अपनी मायावी शक्तियों का उपयोग करके उन ब्राह्मणों
    का वध करना शुरू कर दिया जो पवित्र सामग्री एकत्र करने के लिए वन में जाते थे। उसका
    मानना था कि ब्राह्मणों को नष्ट करके, वेद और देवता भी नष्ट हो जाएंगे, जिससे उसे
    तीनों लोकों पर शासन करने का अवसर मिलेगा।
- id: shivratri-devotee-saved-by-shiva
  type: story
  keywords:
  - Shivratri
  - devotee
  - Shiva
  source:
    book: Shiv Puran
    sarga: '58'
  summary_en: On Shivratri, a devotee was meditating after worshipping Shiva. The
    demon Dundubhinirhad, in the form of a tiger, attempted to attack the devotee.
    However, Shiva appeared and protected the devotee, ultimately defeating the demon.
  summary_hi: शिवरात्रि के दिन, एक भक्त शिव की पूजा करने के बाद ध्यान में लीन था।
    दानव दुंदुभिनिर्हाद ने व्याघ्र रूप में उस भक्त पर हमला करने का प्रयास किया। लेकिन
    शिव प्रकट हुए और भक्त की रक्षा की, अंततः दानव को पराजित कर दिया।
- id: vidal-utpal-demons-defeat
  type: story
  keywords:
  - demons
  - vidal
  - utpal
  source:
    book: Shiv Puran
    sarga: '59'
  summary_en: In ancient times, two powerful demons named Vidal and Utpal, who were
    invincible due to a boon from Brahma, conquered the three worlds and defeated
    the gods. The gods, seeking refuge, approached Brahma, who assured them that the
    demons would be slain by Parvati. The gods were advised to remember Shiva and
    Parvati with devotion.
  summary_hi: प्राचीन काल में विदल और उत्पल नामक दो शक्तिशाली दैत्य, जो ब्रह्माजी
    के वरदान से अजेय थे, तीनों लोकों को जीतकर देवताओं को पराजित कर देते हैं। देवता
    ब्रह्माजी की शरण में जाते हैं, जो उन्हें आश्वासन देते हैं कि पार्वती द्वारा दैत्यों
    का वध होगा। देवताओं को शिव और पार्वती का स्मरण करने की सलाह दी जाती है।
- id: parvati-playful-moment
  type: story
  keywords:
  - parvati
  - play
  - shiva
  source:
    book: Shiv Puran
    sarga: '59'
  summary_en: Parvati, in a playful mood, was seen playing ball with her companions
    near Shiva. Her beauty and grace were evident as she engaged in the game, attracting
    the attention of the demons Vidal and Utpal, who were captivated by her charm.
  summary_hi: पार्वती, एक खेलपूर्ण मूड में, शिव के पास अपनी सखियों के साथ गेंद खेलती
    हुई देखी गईं। उनके सौंदर्य और आकर्षण ने दैत्यों विदल और उत्पल का ध्यान आकर्षित
    किया, जो उनके आकर्षण से मोहित हो गए।
- id: narada-informs-demons
  type: story
  keywords:
  - narada
  - demons
  - parvati
  source:
    book: Shiv Puran
    sarga: '59'
  summary_en: Narada, inspired by Shiva, visits the demons Vidal and Utpal and describes
    Parvati's beauty to them. The demons, deluded by Maya and desiring to abduct Parvati,
    plan to find her, unaware of their impending doom.
  summary_hi: शिव की प्रेरणा से नारदजी दैत्यों विदल और उत्पल के पास जाते हैं और उन्हें
    पार्वती के सौंदर्य का वर्णन करते हैं। माया से मोहित और पार्वती का हरण करने की
    इच्छा रखने वाले दैत्य, उसे खोजने की योजना बनाते हैं, अपने आसन्न विनाश से अनजान।
- id: kandukeshwar-linga-origin
  type: story
  keywords:
  - Kandukeshwar
  - Linga
  source:
    book: Shiv Puran
    sarga: ''
  summary_en: In this episode, Parvati understands a signal from Shiva and uses a
    ball to defeat two powerful demons. The ball transforms into a linga, which becomes
    known as Kandukeshwar Linga, a symbol that removes all evils and grants desires.
    This linga is located near Jyestheshwar and is revered for its power to destroy
    wickedness and grant both worldly and spiritual benefits.
  summary_hi: इस प्रकरण में, पार्वती शिव के संकेत को समझकर एक गेंद का उपयोग करके दो
    शक्तिशाली दैत्यों को पराजित करती हैं। गेंद लिंग में परिवर्तित हो जाती है, जिसे
    कन्दुकेश्वर लिंग के नाम से जाना जाता है, जो सभी दोषों का निवारण करता है और इच्छाओं
    को पूरा करता है। यह लिंग ज्येष्ठेश्वर के पास स्थित है और इसे दुष्टता को नष्ट करने
    और भौतिक और आध्यात्मिक लाभ देने के लिए पूजा जाता है।

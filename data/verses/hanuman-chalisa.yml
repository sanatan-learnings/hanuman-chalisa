# Hanuman Chalisa - Canonical Verse Texts
# This file stores the authoritative Devanagari text for all verses in Hanuman Chalisa
# Source: Traditional Hanuman Chalisa by Goswami Tulsidas
#
# Format:
#   verse_id: The identifier used in the project (e.g., verse_01, doha_01)
#   devanagari: The canonical Devanagari text (use | for multiline)
#   notes: Optional notes about the verse

verses:
  # Opening Dohas
  - verse_id: opening-doha-01
    devanagari: |
      श्रीगुरु चरन सरोज रज, निज मन मुकुर सुधारि।
      बरनउं रघुबर बिमल जसु, जो दायक फल चारि।।
    notes: "First opening doha"

  - verse_id: opening-doha-02
    devanagari: |
      बुद्धिहीन तनु जानिके, सुमिरौं पवन कुमार।
      बल बुद्धि बिद्या देहु मोहिं, हरहु कलेस बिकार।।
    notes: "Second opening doha"

  # 40 Chaupais
  - verse_id: verse-01
    devanagari: |
      जय हनुमान ज्ञान गुन सागर।
      जय कपीस तिहुं लोक उजागर।।
    notes: "First chaupai"

  # Add remaining verses here
  - verse_id: verse-02
    devanagari: |
      [ENTER VERSE TEXT HERE]
    notes: "Verse 2 - pending input"


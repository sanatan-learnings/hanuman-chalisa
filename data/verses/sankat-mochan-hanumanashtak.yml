# Eight Padas (Verses)
pada-01:
  devanagari: बाल समय रवि भक्षि लियो तब तीनहुं लोक भयो अंधियारो। ताहि सों त्रास भयो जग को यह संकट काहु सों जात न टारो।। देवन आनि करी बिनती तब छाँड़ि दियो रवि कष्ट निवारो। को नहिं जानत है जग में कपि संकट मोचन नाम तिहारो।।

pada-02:
  devanagari: बालि की त्रास कपीस बसैं गिरि जात महाप्रभु पंथ निहारो। चौंकि महामुनि साप दियो तब चाहिय कौन बिचार बिचारो।। केहरि रूप धरें प्रभु आए करी अति भयानक सिंह हुंकारो। केहरि रूप धरें प्रभु आए करी अति भयानक सिंह हुंकारो।।

pada-03:
  devanagari: अंगद के सँग लेन गये सिय खोज कपीस यह बैन उचारो। जीवत ना बचिहौ हम सो जु बिना सुधि लाये इहाँ पगु धारो।। हेरि थके तट सिंधु सबै तब लाय सिया-सुधि प्रान उबारो। को नहिं जानत है जग में कपि संकट मोचन नाम तिहारो।।

pada-04:
  devanagari: रावन त्रास दई सिय को सब राक्षसि सों कहि सोक निवारो। ताहि समय हनुमान महाप्रभु जाय महा रजनीचर मारो।। चाहत सीय असोक सों आगि सु दै प्रभु मुद्रिका सोक निवारो। को नहिं जानत है जग में कपि संकट मोचन नाम तिहारो।।

pada-05:
  devanagari: बंधु समेत जबै अहिरावन ले रघुनाथ पताल सिधारो। देबिहिं पूजि भली बिधि सों बलि देउ सबै मिलि मंत्र बिचारो।। जाय सहाय भयो तब ही अहिरावन सैन्य समेत संहारो। को नहिं जानत है जग में कपि संकट मोचन नाम तिहारो।।

pada-06:
  devanagari: काज कियो बड़ देवन के तुम बीर महाप्रभु देखि बिचारो। कौन सो संकट मोर गरीब को जो तुमसों नहिं जात है टारो।। बेगि हरो हनुमान महाप्रभु जो कछु संकट होय हमारो। को नहिं जानत है जग में कपि संकट मोचन नाम तिहारो।।

pada-07:
  devanagari: द्वार तुम्हार खरो हू महाप्रभु करि जोरि बिनती सुनि मोरी। जाते कोई आन देव नहिं जाकी मैं करों मनुहारी।। लागत मोही आस तुम्हारी महाप्रभु यह बिनती हमारी। जै हनुमान प्रभु को नहिं जानत हृदय विचारी दुःख भारी।।

pada-08:
  devanagari: भजलो भाई, सोई सज्जन है, भज हनुमान गहे जो भजनु कों। कष्ट काटि भव सिन्धु तरायो, सुख सम्पति दै भजनु जनु जो को।। जाको नाम संकट मोचन है, तुलसी सो क्यों नहिं भजत मनु को। अष्ट सिद्धि नौ निधि के दाता, हरो संकट तुम बलिदान को।।
